<script>
  function createTimeline(el, data, ctx) {
    var tl = gsap.timeline();
    var eyebrow = el.querySelector('.eyebrow');
    var headline = el.querySelector('.headline');
    var rows = el.querySelectorAll('.bar-row');
    var fills = el.querySelectorAll('.bar-fill');
    var values = el.querySelectorAll('.bar-value');

    gsap.set([eyebrow, headline], { autoAlpha: 0, x: -25 });
    gsap.set(rows, { autoAlpha: 0, x: 30 });
    gsap.set(fills, { scaleX: 0 });
    gsap.set(values, { autoAlpha: 0 });

    var speed = ctx.motion === 'minimal' ? 0.4 : ctx.motion === 'punchy' ? 0.6 : 0.9;

    if (eyebrow.textContent.trim()) {
      tl.to(eyebrow, { autoAlpha: 1, x: 0, duration: speed * 0.4, ease: 'power2.out' }, 0.2);
    }
    tl.to(headline, { autoAlpha: 1, x: 0, duration: speed * 0.7, ease: 'power3.out' }, 0.3);

    // Rows fade in
    tl.to(rows, { autoAlpha: 1, x: 0, stagger: 0.12, duration: speed * 0.5, ease: 'power2.out' }, 0.5);

    // Bars fill up with cascade
    tl.to(fills, { scaleX: 1, stagger: 0.15, duration: speed * 0.8, ease: 'power2.out' }, 0.7);

    // Values pop in after their bars fill
    tl.to(values, { autoAlpha: 1, stagger: 0.15, duration: speed * 0.3, ease: 'power2.out' }, 1.0);

    if (ctx.duration > 3) {
      var exitAt = ctx.duration - 0.7;
      tl.to(rows, { autoAlpha: 0, x: -15, stagger: 0.04, duration: 0.3, ease: 'power2.in' }, exitAt);
      tl.to([headline, eyebrow], { autoAlpha: 0, x: 15, duration: 0.35, ease: 'power2.in' }, exitAt + 0.1);
    }
    return tl;
  }
</script>
