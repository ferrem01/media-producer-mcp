<script>
  function createTimeline(el, data, ctx) {
    var tl = gsap.timeline();
    var eyebrow = el.querySelector('.eyebrow');
    var question = el.querySelector('.question');
    var accentLine = el.querySelector('.accent-line');
    var answer = el.querySelector('.answer');
    var ctaText = el.querySelector('.cta-text');
    var orb = el.querySelector('.bg-orb-1');

    // Populate
    if (data.eyebrow) eyebrow.textContent = data.eyebrow;
    question.textContent = data.question || 'Why us?';
    answer.textContent = data.answer || '';
    if (data.cta_text) ctaText.textContent = data.cta_text;

    var speed = ctx.motion === 'minimal' ? 0.5 : ctx.motion === 'punchy' ? 0.7 : 1.0;

    // Initial states
    gsap.set(eyebrow, { autoAlpha: 0, y: -10 });
    gsap.set(question, { autoAlpha: 0, y: 25, filter: 'blur(4px)' });
    gsap.set(accentLine, { autoAlpha: 0, scaleX: 0, transformOrigin: 'center center' });
    gsap.set(answer, { autoAlpha: 0, y: 25 });
    gsap.set(ctaText, { autoAlpha: 0, y: 15 });
    gsap.set(orb, { scale: 0.6, autoAlpha: 0 });

    // Orb
    tl.to(orb, {
      scale: 1, autoAlpha: 1,
      duration: speed * 2,
      ease: 'power2.out'
    }, 0);

    // Eyebrow
    if (data.eyebrow) {
      tl.to(eyebrow, {
        autoAlpha: 1, y: 0,
        duration: speed * 0.3,
        ease: 'power2.out'
      }, 0.1);
    }

    // Question fades in
    tl.to(question, {
      autoAlpha: 1, y: 0, filter: 'blur(0px)',
      duration: speed * 0.7,
      ease: 'power3.out'
    }, 0.2);

    // Accent line draws at 1.5s
    tl.to(accentLine, {
      autoAlpha: 1, scaleX: 1,
      duration: speed * 0.6,
      ease: 'power2.inOut'
    }, 1.5);

    // Answer slides up at 1.5s
    tl.to(answer, {
      autoAlpha: 1, y: 0,
      duration: speed * 0.6,
      ease: 'power2.out'
    }, 1.7);

    // CTA
    if (data.cta_text) {
      tl.to(ctaText, {
        autoAlpha: 1, y: 0,
        duration: speed * 0.4,
        ease: 'power2.out'
      }, 2.1);
    }

    // Orb drift
    tl.to(orb, {
      y: -20,
      duration: 3, ease: 'sine.inOut',
      yoyo: true, repeat: -1
    }, 1);

    // Exit
    if (ctx.duration > 2) {
      var exitAt = ctx.duration - 0.8;
      tl.to([ctaText, answer], {
        autoAlpha: 0, y: -10,
        duration: 0.35, stagger: 0.04,
        ease: 'power2.in'
      }, exitAt);
      tl.to(accentLine, {
        autoAlpha: 0, scaleX: 0,
        duration: 0.3, ease: 'power2.in'
      }, exitAt + 0.05);
      tl.to(question, {
        autoAlpha: 0, y: -15, filter: 'blur(4px)',
        duration: 0.4, ease: 'power2.in'
      }, exitAt + 0.08);
      tl.to(eyebrow, {
        autoAlpha: 0,
        duration: 0.25, ease: 'power2.in'
      }, exitAt + 0.1);
    }

    return tl;
  }

  window.__MP_READY = true;
</script>
