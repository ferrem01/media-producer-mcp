<script>
  function createTimeline(el, data, ctx) {
    var tl = gsap.timeline();
    var quoteMark = el.querySelector('.quote-mark');
    var quoteText = el.querySelector('.quote-text');
    var authorBlock = el.querySelector('.quote-author');
    var avatarEl = el.querySelector('.author-avatar');
    var nameEl = el.querySelector('.author-name');
    var roleEl = el.querySelector('.author-role');

    // Populate
    quoteText.textContent = data.quote || data.text || '';
    nameEl.textContent = data.author || '';
    if (data.role) roleEl.textContent = data.role;
    if (data.avatar_url) {
      avatarEl.innerHTML = '<img src="' + data.avatar_url + '" alt="" />';
    }

    var speed = ctx.motion === 'minimal' ? 0.5 : ctx.motion === 'punchy' ? 0.7 : 1.0;

    // Initial states
    gsap.set(quoteMark, { autoAlpha: 0, scale: 0.7 });
    gsap.set(quoteText, { autoAlpha: 0, y: 20 });
    gsap.set(authorBlock, { autoAlpha: 0, y: 15 });

    // Quote mark fades in
    tl.to(quoteMark, {
      autoAlpha: 0.3, scale: 1,
      duration: speed * 0.8,
      ease: 'power2.out'
    }, 0.1);

    // Quote text
    if (typeof SplitText !== 'undefined' && quoteText.textContent.length <= 150) {
      gsap.set(quoteText, { autoAlpha: 1, y: 0 });
      var split = new SplitText(quoteText, { type: 'words' });
      gsap.set(split.words, { autoAlpha: 0, y: 12 });
      tl.to(split.words, {
        autoAlpha: 1, y: 0,
        duration: speed * 0.4,
        stagger: 0.03,
        ease: 'power2.out'
      }, 0.25);
    } else {
      tl.to(quoteText, {
        autoAlpha: 1, y: 0,
        duration: speed * 0.7,
        ease: 'power3.out'
      }, 0.25);
    }

    // Author
    tl.to(authorBlock, {
      autoAlpha: 1, y: 0,
      duration: speed * 0.5,
      ease: 'power2.out'
    }, 0.7);

    // Exit
    if (ctx.duration > 2) {
      var exitAt = ctx.duration - 0.7;
      tl.to(authorBlock, {
        autoAlpha: 0, y: -10,
        duration: 0.3, ease: 'power2.in'
      }, exitAt);
      tl.to(quoteText, {
        autoAlpha: 0, y: -15,
        duration: 0.35, ease: 'power2.in'
      }, exitAt + 0.05);
      tl.to(quoteMark, {
        autoAlpha: 0,
        duration: 0.3, ease: 'power2.in'
      }, exitAt + 0.08);
    }

    return tl;
  }
</script>
