<script>
  function createTimeline(el, data, ctx) {
    var tl = gsap.timeline();
    var eyebrow = el.querySelector('.eyebrow');
    var problemCard = el.querySelector('.problem-card');
    var solutionCard = el.querySelector('.solution-card');
    var problemTitle = el.querySelector('.problem-title');
    var problemDesc = el.querySelector('.problem-desc');
    var solutionTitle = el.querySelector('.solution-title');
    var solutionDesc = el.querySelector('.solution-desc');
    var solutionIcon = el.querySelector('.solution-icon');

    // Populate
    if (data.eyebrow) eyebrow.textContent = data.eyebrow;
    problemTitle.textContent = data.problem_title || 'The Problem';
    if (data.problem_desc) problemDesc.textContent = data.problem_desc;
    solutionTitle.textContent = data.solution_title || 'The Solution';
    if (data.solution_desc) solutionDesc.textContent = data.solution_desc;
    if (data.solution_icon_svg) solutionIcon.innerHTML = data.solution_icon_svg;

    var speed = ctx.motion === 'minimal' ? 0.5 : ctx.motion === 'punchy' ? 0.7 : 1.0;

    // Initial states
    gsap.set(eyebrow, { autoAlpha: 0, y: -10 });
    gsap.set(problemCard, { autoAlpha: 0, y: 30, scale: 0.97 });
    gsap.set(solutionCard, { autoAlpha: 0, y: 50, scale: 0.97 });

    // Eyebrow
    if (data.eyebrow) {
      tl.to(eyebrow, {
        autoAlpha: 1, y: 0,
        duration: speed * 0.4,
        ease: 'power2.out'
      }, 0.1);
    }

    // Problem card appears
    tl.to(problemCard, {
      autoAlpha: 1, y: 0, scale: 1,
      duration: speed * 0.7,
      ease: 'power3.out'
    }, 0.2);

    // Solution card slides up
    tl.to(solutionCard, {
      autoAlpha: 1, y: 0, scale: 1,
      duration: speed * 0.7,
      ease: 'power3.out'
    }, 1.2);

    // Problem fades back slightly when solution appears
    tl.to(problemCard, {
      autoAlpha: 0.6,
      duration: speed * 0.5,
      ease: 'power2.out'
    }, 1.3);

    // Exit
    if (ctx.duration > 2) {
      var exitAt = ctx.duration - 0.8;
      tl.to([solutionCard, problemCard], {
        autoAlpha: 0, y: -15,
        duration: 0.4, stagger: 0.06,
        ease: 'power2.in'
      }, exitAt);
      tl.to(eyebrow, {
        autoAlpha: 0,
        duration: 0.3,
        ease: 'power2.in'
      }, exitAt);
    }

    return tl;
  }

  window.__MP_READY = true;
</script>
