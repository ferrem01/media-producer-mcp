<script>
  function createTimeline(el, data, ctx) {
    var tl = gsap.timeline();
    var eyebrow = el.querySelector('.eyebrow');
    var headline = el.querySelector('.headline');
    var centerCell = el.querySelector('.center-cell');
    var appCells = el.querySelectorAll('.app-cell');
    var connLines = el.querySelectorAll('.conn-line');

    // Populate
    if (data.eyebrow) eyebrow.textContent = data.eyebrow;
    headline.textContent = data.headline || 'Integrations';
    centerCell.textContent = data.center_label || 'Your Product';

    var appNames = [
      data.app_1, data.app_2, data.app_3, data.app_4,
      data.app_5, data.app_6, data.app_7, data.app_8
    ];
    appCells.forEach(function(cell, i) {
      cell.textContent = appNames[i] || 'App ' + (i + 1);
    });

    var speed = ctx.motion === 'minimal' ? 0.5 : ctx.motion === 'punchy' ? 0.7 : 1.0;

    // Initial states
    gsap.set(eyebrow, { autoAlpha: 0, y: -10 });
    gsap.set(headline, { autoAlpha: 0, y: 20, filter: 'blur(4px)' });
    gsap.set(centerCell, { autoAlpha: 0, scale: 0.5 });
    gsap.set(appCells, { autoAlpha: 0, scale: 0.6 });
    connLines.forEach(function(line) {
      var len = line.getTotalLength ? line.getTotalLength() : 300;
      gsap.set(line, { strokeDashoffset: len, strokeDasharray: len });
    });

    // Eyebrow
    if (data.eyebrow) {
      tl.to(eyebrow, {
        autoAlpha: 1, y: 0,
        duration: speed * 0.3,
        ease: 'power2.out'
      }, 0.1);
    }

    // Headline
    tl.to(headline, {
      autoAlpha: 1, y: 0, filter: 'blur(0px)',
      duration: speed * 0.5,
      ease: 'power3.out'
    }, 0.15);

    // Center cell appears first
    tl.to(centerCell, {
      autoAlpha: 1, scale: 1,
      duration: speed * 0.5,
      ease: 'back.out(1.4)'
    }, 0.5);

    // App cells stagger in
    tl.to(appCells, {
      autoAlpha: 1, scale: 1,
      duration: speed * 0.4,
      stagger: 0.08,
      ease: 'back.out(1.2)'
    }, 0.8);

    // Connection lines draw
    connLines.forEach(function(line, i) {
      tl.to(line, {
        strokeDashoffset: 0,
        duration: speed * 0.6,
        ease: 'power2.out'
      }, 0.9 + i * 0.06);
    });

    // Exit
    if (ctx.duration > 2) {
      var exitAt = ctx.duration - 0.8;
      tl.to(appCells, {
        autoAlpha: 0, scale: 0.8,
        duration: 0.35, stagger: 0.03,
        ease: 'power2.in'
      }, exitAt);
      tl.to(centerCell, {
        autoAlpha: 0, scale: 0.7,
        duration: 0.35, ease: 'power2.in'
      }, exitAt + 0.1);
      tl.to([headline, eyebrow], {
        autoAlpha: 0,
        duration: 0.3, ease: 'power2.in'
      }, exitAt);
    }

    return tl;
  }

  window.__MP_READY = true;
</script>
