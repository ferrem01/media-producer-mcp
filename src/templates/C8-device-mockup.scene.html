<script>
  function createTimeline(el, data, ctx) {
    var tl = gsap.timeline();
    var topText = el.querySelector('.top-text');
    var headline = el.querySelector('.headline');
    var device = el.querySelector('.device');
    var screen = el.querySelector('.laptop-screen');
    var cards = el.querySelectorAll('.ui-card');
    var chart = el.querySelector('.ui-chart');
    var caption = el.querySelector('.caption');
    var glow = el.querySelector('.bg-glow');

    gsap.set(topText, { autoAlpha: 0, y: -20 });
    gsap.set(device, { autoAlpha: 0, y: 60, scale: 0.9, rotateX: 8 });
    gsap.set(cards, { autoAlpha: 0, y: 15, scale: 0.95 });
    gsap.set(chart, { autoAlpha: 0, scaleY: 0, transformOrigin: 'bottom' });
    gsap.set(caption, { autoAlpha: 0, y: 15 });
    gsap.set(glow, { autoAlpha: 0, scale: 0.6 });

    var speed = ctx.motion === 'minimal' ? 0.5 : ctx.motion === 'punchy' ? 0.7 : 1.0;

    // Glow appears
    tl.to(glow, { autoAlpha: 1, scale: 1, duration: speed * 1.5, ease: 'power2.out' }, 0);

    // Text enters
    tl.to(topText, { autoAlpha: 1, y: 0, duration: speed * 0.6, ease: 'power2.out' }, 0.2);

    // Device rises into frame
    tl.to(device, { autoAlpha: 1, y: 0, scale: 1, rotateX: 0, duration: speed * 1.2, ease: 'power3.out' }, 0.3);

    // UI elements populate
    tl.to(cards, { autoAlpha: 1, y: 0, scale: 1, stagger: 0.08, duration: speed * 0.5, ease: 'power2.out' }, 0.8);
    tl.to(chart, { autoAlpha: 1, scaleY: 1, duration: speed * 0.6, ease: 'power2.out' }, 1.0);

    if (caption.textContent.trim()) {
      tl.to(caption, { autoAlpha: 1, y: 0, duration: speed * 0.5, ease: 'power2.out' }, 1.1);
    }

    if (ctx.duration > 3) {
      var exitAt = ctx.duration - 0.8;
      tl.to(device, { autoAlpha: 0, y: 30, scale: 0.95, duration: 0.5, ease: 'power2.in' }, exitAt);
      tl.to([topText, caption], { autoAlpha: 0, y: -15, duration: 0.4, ease: 'power2.in' }, exitAt);
    }

    return tl;
  }
</script>
