<script>
  function createTimeline(el, data, ctx) {
    var tl = gsap.timeline();
    var eyebrow = el.querySelector('.eyebrow');
    var headline = el.querySelector('.headline');
    var blocks = el.querySelectorAll('.counter-block');
    var dividers = el.querySelectorAll('.counter-divider');
    var glow = el.querySelector('.bg-glow');

    // Populate
    if (data.eyebrow) eyebrow.textContent = data.eyebrow;
    if (data.headline) headline.textContent = data.headline;

    var counters = [
      { value: data.counter_1_value, suffix: data.counter_1_suffix, label: data.counter_1_label },
      { value: data.counter_2_value, suffix: data.counter_2_suffix, label: data.counter_2_label },
      { value: data.counter_3_value, suffix: data.counter_3_suffix, label: data.counter_3_label }
    ];

    blocks.forEach(function(block, i) {
      var c = counters[i] || {};
      if (c.suffix) block.querySelector('.counter-suffix').textContent = c.suffix;
      if (c.label) block.querySelector('.counter-label').textContent = c.label;
    });

    var speed = ctx.motion === 'minimal' ? 0.5 : ctx.motion === 'punchy' ? 0.7 : 1.0;

    // Initial states
    gsap.set(eyebrow, { autoAlpha: 0, y: -10 });
    gsap.set(headline, { autoAlpha: 0, y: 15 });
    gsap.set(blocks, { autoAlpha: 0, y: 40 });
    gsap.set(dividers, { autoAlpha: 0, scaleY: 0 });
    gsap.set(glow, { scale: 0.5, autoAlpha: 0 });

    // Eyebrow
    if (data.eyebrow) {
      tl.to(eyebrow, {
        autoAlpha: 1, y: 0,
        duration: speed * 0.3,
        ease: 'power2.out'
      }, 0.1);
    }

    // Headline
    if (data.headline) {
      tl.to(headline, {
        autoAlpha: 1, y: 0,
        duration: speed * 0.4,
        ease: 'power2.out'
      }, 0.15);
    }

    // Glow
    tl.to(glow, {
      scale: 1.2, autoAlpha: 1,
      duration: speed * 1.2,
      ease: 'power2.out'
    }, 0.2);

    // Blocks stagger in and count up
    blocks.forEach(function(block, i) {
      var c = counters[i] || {};
      var numEl = block.querySelector('.counter-number');
      var targetValue = parseFloat(c.value) || 0;
      var delay = 0.4 + i * 0.2;

      tl.to(block, {
        autoAlpha: 1, y: 0,
        duration: speed * 0.5,
        ease: 'power3.out'
      }, delay);

      // Count up animation
      var counter = { val: 0 };
      tl.to(counter, {
        val: targetValue,
        duration: speed * 1.8,
        ease: 'power2.out',
        onUpdate: function() {
          if (targetValue % 1 !== 0) {
            numEl.textContent = counter.val.toFixed(1);
          } else {
            numEl.textContent = Math.round(counter.val).toLocaleString();
          }
        }
      }, delay + 0.1);
    });

    // Dividers
    dividers.forEach(function(div, i) {
      tl.to(div, {
        autoAlpha: 1, scaleY: 1,
        duration: speed * 0.5,
        ease: 'power2.out'
      }, 0.5 + i * 0.2);
    });

    // Glow pulse
    tl.to(glow, {
      scale: 1.4, autoAlpha: 0.6,
      duration: 2.5, ease: 'sine.inOut',
      yoyo: true, repeat: -1
    }, 2);

    // Exit
    if (ctx.duration > 2) {
      var exitAt = ctx.duration - 0.8;
      tl.to(glow, {
        autoAlpha: 0, scale: 0.5,
        duration: 0.4, ease: 'power2.in'
      }, exitAt);
      tl.to(dividers, {
        autoAlpha: 0, scaleY: 0,
        duration: 0.3, ease: 'power2.in'
      }, exitAt);
      blocks.forEach(function(block, i) {
        tl.to(block, {
          autoAlpha: 0, y: -20,
          duration: 0.35,
          ease: 'power2.in'
        }, exitAt + 0.05 + i * 0.04);
      });
      tl.to([headline, eyebrow], {
        autoAlpha: 0,
        duration: 0.3, ease: 'power2.in'
      }, exitAt);
    }

    return tl;
  }

  window.__MP_READY = true;
</script>
