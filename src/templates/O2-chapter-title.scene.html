<script>
  function createTimeline(el, data, ctx) {
    var tl = gsap.timeline();
    var accentLine = el.querySelector('.accent-line');
    var number = el.querySelector('.chapter-number');
    var title = el.querySelector('.title');
    var subtitle = el.querySelector('.subtitle');

    gsap.set(accentLine, { scaleX: 0, autoAlpha: 1 });
    gsap.set([number, title, subtitle], { autoAlpha: 0 });
    gsap.set(title, { y: 30, filter: 'blur(6px)' });
    gsap.set(number, { y: -15 });
    gsap.set(subtitle, { y: 20 });

    var speed = ctx.motion === 'minimal' ? 0.5 : ctx.motion === 'punchy' ? 0.7 : 1.0;

    // Accent line expands
    tl.to(accentLine, { scaleX: 1, duration: speed * 0.6, ease: 'power3.inOut' }, 0.1);

    // Line fades/moves up as title enters
    tl.to(accentLine, { y: -60, autoAlpha: 0, duration: speed * 0.4, ease: 'power2.in' }, 0.5);

    // Number appears
    if (number.textContent.trim()) {
      tl.to(number, { autoAlpha: 1, y: 0, duration: speed * 0.4, ease: 'power2.out' }, 0.4);
    }

    // Title deblurs and enters
    tl.to(title, { autoAlpha: 1, y: 0, filter: 'blur(0px)', duration: speed * 0.9, ease: 'power3.out' }, 0.5);

    // Subtitle
    if (subtitle.textContent.trim()) {
      tl.to(subtitle, { autoAlpha: 1, y: 0, duration: speed * 0.5, ease: 'power2.out' }, 0.8);
    }

    if (ctx.duration > 2.5) {
      var exitAt = ctx.duration - 0.7;
      tl.to([subtitle, title, number], { autoAlpha: 0, y: -20, stagger: 0.06, duration: 0.4, ease: 'power2.in' }, exitAt);
    }

    return tl;
  }
</script>
