<script>
  function createTimeline(el, data, ctx) {
    var tl = gsap.timeline();
    var eyebrow = el.querySelector('.eyebrow');
    var headline = el.querySelector('.headline');
    var cards = el.querySelectorAll('.post-card');
    var hearts = el.querySelectorAll('.heart-icon');

    // Populate
    if (data.eyebrow) eyebrow.textContent = data.eyebrow;
    if (data.headline) headline.textContent = data.headline;

    var posts = [
      { avatar: data.post_1_avatar, name: data.post_1_name, handle: data.post_1_handle, text: data.post_1_text, likes: data.post_1_likes },
      { avatar: data.post_2_avatar, name: data.post_2_name, handle: data.post_2_handle, text: data.post_2_text, likes: data.post_2_likes },
      { avatar: data.post_3_avatar, name: data.post_3_name, handle: data.post_3_handle, text: data.post_3_text, likes: data.post_3_likes }
    ];

    cards.forEach(function(card, i) {
      var p = posts[i] || {};
      card.querySelector('.post-avatar').textContent = p.avatar || '';
      card.querySelector('.post-name').textContent = p.name || 'User';
      card.querySelector('.post-handle').textContent = p.handle ? '@' + p.handle.replace(/^@/, '') : '';
      card.querySelector('.post-text').textContent = p.text || '';
      card.querySelector('.likes-count').textContent = p.likes || '';
    });

    var speed = ctx.motion === 'minimal' ? 0.5 : ctx.motion === 'punchy' ? 0.7 : 1.0;

    // Initial states
    gsap.set(eyebrow, { autoAlpha: 0, y: -10 });
    gsap.set(headline, { autoAlpha: 0, y: 15 });
    gsap.set(cards, { autoAlpha: 0, y: 50 });
    gsap.set(hearts, { scale: 0 });

    // Eyebrow
    if (data.eyebrow) {
      tl.to(eyebrow, {
        autoAlpha: 1, y: 0,
        duration: speed * 0.3,
        ease: 'power2.out'
      }, 0.1);
    }

    // Headline
    if (data.headline) {
      tl.to(headline, {
        autoAlpha: 1, y: 0,
        duration: speed * 0.4,
        ease: 'power2.out'
      }, 0.15);
    }

    // Cards stagger in from bottom
    tl.to(cards, {
      autoAlpha: 1, y: 0,
      duration: speed * 0.6,
      stagger: 0.15,
      ease: 'power3.out'
    }, 0.4);

    // Hearts pulse on appearance
    hearts.forEach(function(heart, i) {
      tl.to(heart, {
        scale: 1,
        duration: speed * 0.3,
        ease: 'back.out(2)'
      }, 0.7 + i * 0.15);
      // Pulse
      tl.to(heart, {
        scale: 1.3,
        duration: 0.15,
        ease: 'power2.out',
        yoyo: true,
        repeat: 1
      }, 0.9 + i * 0.15);
    });

    // Fill hearts with red after pulse
    hearts.forEach(function(heart, i) {
      tl.to(heart, {
        fill: '#ef4444',
        duration: 0.01
      }, 1.0 + i * 0.15);
    });

    // Exit
    if (ctx.duration > 2) {
      var exitAt = ctx.duration - 0.8;
      tl.to(cards, {
        autoAlpha: 0, y: -20,
        duration: 0.35, stagger: 0.05,
        ease: 'power2.in'
      }, exitAt);
      tl.to([headline, eyebrow], {
        autoAlpha: 0,
        duration: 0.3, ease: 'power2.in'
      }, exitAt);
    }

    return tl;
  }

  window.__MP_READY = true;
</script>
