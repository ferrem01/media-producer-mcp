<script>
  function createTimeline(el, data, ctx) {
    var tl = gsap.timeline();
    var logoMark = el.querySelector('.logo-mark');
    var companyName = el.querySelector('.company-name');
    var tagline = el.querySelector('.tagline');
    var radial = el.querySelector('.bg-radial');
    var corners = el.querySelectorAll('.corner-accent');

    gsap.set(logoMark, { autoAlpha: 0, scale: 0.5, rotation: -15 });
    gsap.set(companyName, { autoAlpha: 0, y: 30, filter: 'blur(8px)' });
    gsap.set(tagline, { autoAlpha: 0, y: 15 });
    gsap.set(radial, { autoAlpha: 0, scale: 0.3 });
    gsap.set(corners, { autoAlpha: 0, scale: 0.8 });

    var speed = ctx.motion === 'minimal' ? 0.6 : ctx.motion === 'punchy' ? 0.8 : 1.2;

    // Radial glow breathes in
    tl.to(radial, { autoAlpha: 1, scale: 1, duration: speed * 1.5, ease: 'power2.out' }, 0);

    // Logo mark drops in with rotation
    tl.to(logoMark, { autoAlpha: 1, scale: 1, rotation: 0, duration: speed * 0.8, ease: 'back.out(1.8)' }, 0.2);

    // Company name deblurs
    tl.to(companyName, { autoAlpha: 1, y: 0, filter: 'blur(0px)', duration: speed * 0.9, ease: 'power3.out' }, 0.5);

    // Tagline
    if (tagline.textContent.trim()) {
      tl.to(tagline, { autoAlpha: 1, y: 0, duration: speed * 0.5, ease: 'power2.out' }, 0.8);
    }

    // Corner accents
    tl.to(corners, { autoAlpha: 1, scale: 1, stagger: 0.1, duration: speed * 0.4, ease: 'power2.out' }, 0.6);

    if (ctx.duration > 2.5) {
      var exitAt = ctx.duration - 0.8;
      tl.to(corners, { autoAlpha: 0, duration: 0.3 }, exitAt);
      tl.to([tagline, companyName], { autoAlpha: 0, y: -15, stagger: 0.06, duration: 0.4, ease: 'power2.in' }, exitAt);
      tl.to(logoMark, { autoAlpha: 0, scale: 0.8, duration: 0.4, ease: 'power2.in' }, exitAt + 0.1);
    }
    return tl;
  }
</script>
