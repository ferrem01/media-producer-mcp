<script>
  function createTimeline(el, data, ctx) {
    var tl = gsap.timeline();

    var browserFrame = el.querySelector('.browser-frame');
    var urlText = el.querySelector('.url-text');
    var tabTitle = el.querySelector('.tab-title');
    var headline = el.querySelector('.headline');
    var body = el.querySelector('.body');
    var browserMain = el.querySelector('.browser-main');
    var metricRow = el.querySelector('.metric-row');
    var chartArea = el.querySelector('.chart-area');
    var bars = el.querySelectorAll('.bar');
    var orb1 = el.querySelector('.bg-orb-1');
    var orb2 = el.querySelector('.bg-orb-2');

    // Populate
    if (data.url) urlText.textContent = data.url;
    if (data.page_title) tabTitle.textContent = data.page_title;
    headline.textContent = data.headline || '';
    if (data.body) body.textContent = data.body;

    // Speaker PiP: load video if pip_source is provided
    var pipContainer = el.querySelector('#pip-container');
    if (data.pip_source && pipContainer) {
      pipContainer.style.display = 'block';
      var pipVideo = loadVideoForCapture(pipContainer, data.pip_source, {
        startAt: data.start_at || 0,
        style: 'position:absolute;inset:0;width:100%;height:100%;object-fit:cover;border-radius:50%;',
      });
      pipVideo.classList.add('pip-video');
    }

    var speed = ctx.motion === 'minimal' ? 0.5 : ctx.motion === 'punchy' ? 0.7 : 1.0;

    // Initial states
    gsap.set(browserFrame, { autoAlpha: 0, y: 50, scale: 0.97 });
    gsap.set(headline, { autoAlpha: 0, y: 16, filter: 'blur(4px)' });
    gsap.set(body, { autoAlpha: 0, y: 12 });
    gsap.set(urlText, { autoAlpha: 0 });
    gsap.set(metricRow, { autoAlpha: 0, y: 10 });
    gsap.set(chartArea, { autoAlpha: 0, y: 10 });
    gsap.set(bars, { scaleY: 0, transformOrigin: 'bottom center' });
    gsap.set([orb1, orb2], { scale: 0.6, autoAlpha: 0 });

    // Orbs breathe in
    tl.to([orb1, orb2], {
      scale: 1, autoAlpha: 1,
      duration: speed * 1.8,
      stagger: 0.15,
      ease: 'power2.out'
    }, 0);

    // Headline
    tl.to(headline, {
      autoAlpha: 1, y: 0, filter: 'blur(0px)',
      duration: speed * 0.6,
      ease: 'power3.out'
    }, 0.1);
    if (data.body) {
      tl.to(body, {
        autoAlpha: 1, y: 0,
        duration: speed * 0.4,
        ease: 'power2.out'
      }, 0.3);
    }

    // Browser slides up
    tl.to(browserFrame, {
      autoAlpha: 1, y: 0, scale: 1,
      duration: speed * 0.7,
      ease: 'power3.out'
    }, 0.2);

    // URL types in (staggered character reveal via opacity)
    tl.to(urlText, {
      autoAlpha: 1,
      duration: speed * 0.5,
      ease: 'power2.out'
    }, 0.6);

    // Content fades in
    tl.to(metricRow, {
      autoAlpha: 1, y: 0,
      duration: speed * 0.5,
      ease: 'power2.out'
    }, 0.8);
    tl.to(chartArea, {
      autoAlpha: 1, y: 0,
      duration: speed * 0.4,
      ease: 'power2.out'
    }, 0.95);

    // Bars animate up
    tl.to(bars, {
      scaleY: 1,
      duration: speed * 0.6,
      stagger: 0.05,
      ease: 'power3.out'
    }, 1.0);

    // Orb drift
    tl.to(orb1, {
      x: 25, y: -15,
      duration: 5, ease: 'sine.inOut',
      yoyo: true, repeat: -1
    }, 1.5);

    // Exit
    if (ctx.duration > 2.5) {
      var exitAt = ctx.duration - 0.9;
      tl.to([body], {
        autoAlpha: 0, y: -8,
        duration: 0.3,
        ease: 'power2.in'
      }, exitAt);
      tl.to(browserFrame, {
        autoAlpha: 0, y: 30, scale: 0.97,
        duration: 0.45,
        ease: 'power2.in'
      }, exitAt + 0.05);
      tl.to(headline, {
        autoAlpha: 0, y: -14, filter: 'blur(4px)',
        duration: 0.35,
        ease: 'power2.in'
      }, exitAt + 0.1);
    }

    // PiP entrance animation
    if (data.pip_source && pipContainer) {
      gsap.set(pipContainer, { autoAlpha: 0, scale: 0.6 });
      tl.to(pipContainer, {
        autoAlpha: 1, scale: 1,
        duration: speed * 0.5,
        ease: 'back.out(1.7)',
      }, 0.7);
    }

    return tl;
  }
</script>
