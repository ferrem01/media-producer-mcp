<script>
  function createTimeline(el, data, ctx) {
    var tl = gsap.timeline();
    var eyebrow = el.querySelector('.eyebrow');
    var headline = el.querySelector('.headline');
    var lineFill = el.querySelector('.timeline-line-fill');
    var milestones = el.querySelectorAll('.milestone');
    var milestone4 = el.querySelector('.milestone-4');
    var dots = el.querySelectorAll('.milestone-dot');
    var contents = el.querySelectorAll('.milestone-content');

    // Populate
    if (data.eyebrow) eyebrow.textContent = data.eyebrow;
    headline.textContent = data.headline || 'Timeline';

    var points = [
      { label: data.point_1_label, desc: data.point_1_desc },
      { label: data.point_2_label, desc: data.point_2_desc },
      { label: data.point_3_label, desc: data.point_3_desc },
      { label: data.point_4_label, desc: data.point_4_desc }
    ];

    // Hide 4th milestone if no data
    if (!data.point_4_label) {
      milestone4.style.display = 'none';
    }

    milestones.forEach(function(ms, i) {
      if (points[i]) {
        ms.querySelector('.milestone-label').textContent = points[i].label || '';
        ms.querySelector('.milestone-desc').textContent = points[i].desc || '';
      }
    });

    var activePoints = data.point_4_label ? 4 : 3;
    var speed = ctx.motion === 'minimal' ? 0.5 : ctx.motion === 'punchy' ? 0.7 : 1.0;

    // Initial states
    gsap.set(eyebrow, { autoAlpha: 0, y: -10 });
    gsap.set(headline, { autoAlpha: 0, y: 20, filter: 'blur(4px)' });
    gsap.set(dots, { autoAlpha: 0, scale: 0 });
    gsap.set(contents, { autoAlpha: 0, y: function(i) {
      return i % 2 === 0 ? 15 : -15;
    }});

    // Eyebrow
    if (data.eyebrow) {
      tl.to(eyebrow, {
        autoAlpha: 1, y: 0,
        duration: speed * 0.3,
        ease: 'power2.out'
      }, 0.1);
    }

    // Headline
    tl.to(headline, {
      autoAlpha: 1, y: 0, filter: 'blur(0px)',
      duration: speed * 0.5,
      ease: 'power3.out'
    }, 0.15);

    // Line draws
    tl.to(lineFill, {
      width: '100%',
      duration: speed * 2.0,
      ease: 'power2.inOut'
    }, 0.6);

    // Dots and content appear sequentially
    for (var i = 0; i < activePoints; i++) {
      var delay = 0.7 + i * 0.4;
      (function(idx, d) {
        tl.to(dots[idx], {
          autoAlpha: 1, scale: 1,
          duration: speed * 0.35,
          ease: 'back.out(2)'
        }, d);
        tl.to(contents[idx], {
          autoAlpha: 1, y: 0,
          duration: speed * 0.4,
          ease: 'power2.out'
        }, d + 0.15);
      })(i, delay);
    }

    // Exit
    if (ctx.duration > 2) {
      var exitAt = ctx.duration - 0.8;
      tl.to(contents, {
        autoAlpha: 0,
        duration: 0.3, ease: 'power2.in'
      }, exitAt);
      tl.to(dots, {
        autoAlpha: 0, scale: 0,
        duration: 0.3, ease: 'power2.in'
      }, exitAt + 0.05);
      tl.to(lineFill, {
        width: '0%',
        duration: 0.3, ease: 'power2.in'
      }, exitAt + 0.05);
      tl.to([headline, eyebrow], {
        autoAlpha: 0,
        duration: 0.3, ease: 'power2.in'
      }, exitAt);
    }

    return tl;
  }

  window.__MP_READY = true;
</script>
