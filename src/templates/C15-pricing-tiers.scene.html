<script>
  function createTimeline(el, data, ctx) {
    var tl = gsap.timeline();
    var eyebrow = el.querySelector('.eyebrow');
    var headline = el.querySelector('.headline');
    var tiers = el.querySelectorAll('.tier');
    var featured = el.querySelector('.tier.featured');

    gsap.set([eyebrow, headline], { autoAlpha: 0, y: 20 });
    gsap.set(tiers, { autoAlpha: 0, y: 40, scale: 0.92 });

    var speed = ctx.motion === 'minimal' ? 0.4 : ctx.motion === 'punchy' ? 0.6 : 0.8;

    if (eyebrow.textContent.trim()) {
      tl.to(eyebrow, { autoAlpha: 1, y: 0, duration: speed * 0.4, ease: 'power2.out' }, 0.2);
    }
    tl.to(headline, { autoAlpha: 1, y: 0, duration: speed * 0.6, ease: 'power3.out' }, 0.3);

    // Side tiers first, featured pops last
    var sideTiers = Array.from(tiers).filter(function(t) { return !t.classList.contains('featured'); });
    tl.to(sideTiers, {
      autoAlpha: 1, y: 0, scale: 1,
      stagger: 0.1, duration: speed * 0.6, ease: 'power2.out'
    }, 0.6);
    if (featured) {
      tl.to(featured, { autoAlpha: 1, y: 0, scale: 1.04, duration: speed * 0.7, ease: 'back.out(1.5)' }, 0.8);
    }

    if (ctx.duration > 3) {
      var exitAt = ctx.duration - 0.7;
      tl.to(tiers, { autoAlpha: 0, y: -20, scale: 0.95, stagger: 0.05, duration: 0.3, ease: 'power2.in' }, exitAt);
      tl.to([headline, eyebrow], { autoAlpha: 0, y: -15, duration: 0.35, ease: 'power2.in' }, exitAt + 0.1);
    }
    return tl;
  }
</script>
