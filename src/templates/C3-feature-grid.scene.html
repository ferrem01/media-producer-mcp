<script>
  function createTimeline(el, data, ctx) {
    var tl = gsap.timeline();
    var heading = el.querySelector('.heading');
    var cards = el.querySelectorAll('.card');
    var features = data.features || [];
    var orb1 = el.querySelector('.bg-orb-1');
    var orb2 = el.querySelector('.bg-orb-2');

    // Populate heading
    if (data.heading) heading.textContent = data.heading;

    // Hide unused cards, populate used ones
    cards.forEach(function(card, i) {
      if (i >= features.length) {
        card.style.display = 'none';
        return;
      }
      var f = features[i];
      var iconEl = card.querySelector('.card-icon');
      var titleEl = card.querySelector('.card-title');
      var descEl = card.querySelector('.card-desc');

      if (f.icon_svg) iconEl.innerHTML = f.icon_svg;
      titleEl.textContent = f.title || '';
      if (f.description) descEl.textContent = f.description;
    });

    // If 3 features, make first card span full width
    if (features.length === 3) {
      cards[0].style.gridColumn = '1 / -1';
    }

    var speed = ctx.motion === 'minimal' ? 0.4 : ctx.motion === 'punchy' ? 0.6 : 0.8;

    // Initial states
    gsap.set(heading, { autoAlpha: 0, y: 20 });
    gsap.set([orb1, orb2], { scale: 0.5, autoAlpha: 0 });
    cards.forEach(function(card) {
      if (card.style.display !== 'none') {
        gsap.set(card, { autoAlpha: 0, y: 30, scale: 0.95 });
      }
    });

    // Orbs
    tl.to([orb1, orb2], {
      scale: 1, autoAlpha: 1,
      duration: speed * 2,
      stagger: 0.15,
      ease: 'power2.out'
    }, 0);

    // Heading
    if (data.heading) {
      tl.to(heading, {
        autoAlpha: 1, y: 0,
        duration: speed * 0.6,
        ease: 'power2.out'
      }, 0.15);
    }

    // Cards stagger in
    var visibleCards = [];
    cards.forEach(function(c) { if (c.style.display !== 'none') visibleCards.push(c); });

    visibleCards.forEach(function(card, i) {
      tl.to(card, {
        autoAlpha: 1, y: 0, scale: 1,
        duration: speed * 0.6,
        ease: 'back.out(1.2)'
      }, 0.3 + i * 0.12);
    });

    // Exit
    if (ctx.duration > 2) {
      var exitAt = ctx.duration - 0.8;
      visibleCards.reverse().forEach(function(card, i) {
        tl.to(card, {
          autoAlpha: 0, y: -15, scale: 0.97,
          duration: 0.3, ease: 'power2.in'
        }, exitAt + i * 0.04);
      });
      tl.to(heading, {
        autoAlpha: 0, y: -10,
        duration: 0.3, ease: 'power2.in'
      }, exitAt + 0.15);
    }

    return tl;
  }
</script>
