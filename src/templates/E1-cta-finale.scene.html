<script>
  function createTimeline(el, data, ctx) {
    var tl = gsap.timeline();
    var headline = el.querySelector('.headline');
    var subtitle = el.querySelector('.subtitle');
    var ctaBtn = el.querySelector('.cta-btn');
    var ctaText = el.querySelector('.cta-text');
    var ctaUrl = el.querySelector('.cta-url');
    var glow = el.querySelector('.bg-glow');
    var rays = el.querySelector('.bg-rays');
    var shimmer = el.querySelector('.cta-btn::before');

    // Populate
    headline.textContent = data.headline || data.text || '';
    if (data.subtitle) subtitle.textContent = data.subtitle;
    ctaText.textContent = data.cta_text || 'Get Started';
    if (data.cta_url) ctaUrl.textContent = data.cta_url;

    var speed = ctx.motion === 'minimal' ? 0.5 : ctx.motion === 'punchy' ? 0.7 : 1.0;

    // Initial states
    gsap.set(headline, { autoAlpha: 0, y: 30 });
    gsap.set(subtitle, { autoAlpha: 0, y: 20 });
    gsap.set(ctaBtn, { autoAlpha: 0, scale: 0.85, y: 20 });
    gsap.set(ctaUrl, { autoAlpha: 0 });
    gsap.set(glow, { autoAlpha: 0, scale: 0.5 });
    gsap.set(rays, { autoAlpha: 0, rotation: -10 });

    // Glow builds
    tl.to(glow, {
      autoAlpha: 1, scale: 1,
      duration: speed * 1.5,
      ease: 'power2.out'
    }, 0);

    // Rays fade in with rotation
    tl.to(rays, {
      autoAlpha: 1, rotation: 0,
      duration: speed * 2,
      ease: 'power1.out'
    }, 0.1);

    // Headline
    tl.to(headline, {
      autoAlpha: 1, y: 0,
      duration: speed * 0.7,
      ease: 'power3.out'
    }, 0.2);

    // Subtitle
    if (data.subtitle) {
      tl.to(subtitle, {
        autoAlpha: 1, y: 0,
        duration: speed * 0.5,
        ease: 'power2.out'
      }, 0.45);
    }

    // CTA button pops in
    tl.to(ctaBtn, {
      autoAlpha: 1, scale: 1, y: 0,
      duration: speed * 0.6,
      ease: 'back.out(1.4)'
    }, data.subtitle ? 0.65 : 0.5);

    // CTA shimmer sweep
    tl.fromTo(ctaBtn.querySelector('::before') || ctaBtn, {
      backgroundPosition: '-200% 0'
    }, {
      backgroundPosition: '200% 0',
      duration: 1.2,
      ease: 'power1.inOut'
    }, data.subtitle ? 1.1 : 0.9);

    // Button glow pulse
    tl.to(ctaBtn, {
      boxShadow: '0 0 60px ' + 'color-mix(in srgb, var(--mp-color-primary, #6366f1) 50%, transparent)' +
                 ', 0 4px 30px ' + 'color-mix(in srgb, var(--mp-color-primary, #6366f1) 35%, transparent)' +
                 ', inset 0 1px 0 ' + 'color-mix(in srgb, white 15%, transparent)',
      duration: 1.5, ease: 'sine.inOut',
      yoyo: true, repeat: -1
    }, 1.2);

    // URL
    if (data.cta_url) {
      tl.to(ctaUrl, {
        autoAlpha: 1,
        duration: speed * 0.4,
        ease: 'power2.out'
      }, data.subtitle ? 0.9 : 0.7);
    }

    // Rays slow rotate
    tl.to(rays, {
      rotation: 15,
      duration: 8, ease: 'none',
      repeat: -1
    }, 0.5);

    // Exit
    if (ctx.duration > 2) {
      var exitAt = ctx.duration - 0.8;
      tl.to([ctaUrl, subtitle], {
        autoAlpha: 0,
        duration: 0.3, ease: 'power2.in'
      }, exitAt);
      tl.to(ctaBtn, {
        autoAlpha: 0, scale: 0.9, y: -10,
        duration: 0.4, ease: 'power2.in'
      }, exitAt + 0.05);
      tl.to(headline, {
        autoAlpha: 0, y: -20,
        duration: 0.4, ease: 'power2.in'
      }, exitAt + 0.1);
    }

    return tl;
  }
</script>
