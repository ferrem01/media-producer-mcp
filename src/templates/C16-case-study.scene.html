<script>
  function createTimeline(el, data, ctx) {
    var tl = gsap.timeline();
    var card = el.querySelector('.case-card');
    var avatar = el.querySelector('.company-avatar');
    var companyName = el.querySelector('.company-name');
    var resultValue = el.querySelector('.result-value');
    var resultLabel = el.querySelector('.result-label');
    var divider = el.querySelector('.divider');
    var quote = el.querySelector('.quote');
    var author = el.querySelector('.author');
    var role = el.querySelector('.role');
    var orb1 = el.querySelector('.bg-orb-1');
    var orb2 = el.querySelector('.bg-orb-2');

    // Populate
    avatar.textContent = data.company_logo_text || 'CO';
    companyName.textContent = data.company_name || 'Company';
    resultValue.textContent = data.result_value || '10x';
    resultLabel.textContent = data.result_label || 'Improvement';
    quote.textContent = data.quote ? '"' + data.quote + '"' : '';
    author.textContent = data.author || '';
    role.textContent = data.role || '';

    var speed = ctx.motion === 'minimal' ? 0.5 : ctx.motion === 'punchy' ? 0.7 : 1.0;

    // Initial states
    gsap.set(card, { autoAlpha: 0, y: 30, scale: 0.97 });
    gsap.set(avatar, { autoAlpha: 0, scale: 0.6 });
    gsap.set(companyName, { autoAlpha: 0, y: 10 });
    gsap.set(resultValue, { autoAlpha: 0, y: 20 });
    gsap.set(resultLabel, { autoAlpha: 0, x: -15 });
    gsap.set(divider, { autoAlpha: 0, scaleX: 0, transformOrigin: 'left center' });
    gsap.set(quote, { autoAlpha: 0, y: 15 });
    gsap.set(el.querySelector('.attribution'), { autoAlpha: 0, y: 10 });
    gsap.set([orb1, orb2], { scale: 0.6, autoAlpha: 0 });

    // Orbs
    tl.to([orb1, orb2], {
      scale: 1, autoAlpha: 1,
      duration: speed * 2, stagger: 0.2,
      ease: 'power2.out'
    }, 0);

    // Card fades in
    tl.to(card, {
      autoAlpha: 1, y: 0, scale: 1,
      duration: speed * 0.6,
      ease: 'power3.out'
    }, 0.1);

    // Avatar pops
    tl.to(avatar, {
      autoAlpha: 1, scale: 1,
      duration: speed * 0.5,
      ease: 'back.out(1.4)'
    }, 0.25);

    tl.to(companyName, {
      autoAlpha: 1, y: 0,
      duration: speed * 0.4,
      ease: 'power2.out'
    }, 0.35);

    // Result
    tl.to(resultValue, {
      autoAlpha: 1, y: 0,
      duration: speed * 0.6,
      ease: 'power3.out'
    }, 0.4);

    tl.to(resultLabel, {
      autoAlpha: 1, x: 0,
      duration: speed * 0.4,
      ease: 'power2.out'
    }, 0.55);

    // Divider draws
    tl.to(divider, {
      autoAlpha: 1, scaleX: 1,
      duration: speed * 0.5,
      ease: 'power2.inOut'
    }, 0.6);

    // Quote
    tl.to(quote, {
      autoAlpha: 1, y: 0,
      duration: speed * 0.6,
      ease: 'power2.out'
    }, 0.75);

    // Attribution
    tl.to(el.querySelector('.attribution'), {
      autoAlpha: 1, y: 0,
      duration: speed * 0.4,
      ease: 'power2.out'
    }, 0.9);

    // Orb drift
    tl.to(orb1, {
      x: 25, y: -15,
      duration: 4, ease: 'sine.inOut',
      yoyo: true, repeat: -1
    }, 1);

    // Exit
    if (ctx.duration > 2) {
      var exitAt = ctx.duration - 0.8;
      tl.to(card, {
        autoAlpha: 0, y: -15, scale: 0.98,
        duration: 0.5, ease: 'power2.in'
      }, exitAt);
    }

    return tl;
  }

  window.__MP_READY = true;
</script>
