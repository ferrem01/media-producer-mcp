<style scoped>
  .scene {

    position: absolute;

    background-size: 128px 128px;

  }

<script>
  function createTimeline(el, data, ctx) {
    var tl = gsap.timeline();
    var question = el.querySelector('.question');
    var attribution = el.querySelector('.attribution');
    var orb = el.querySelector('.bg-orb');

    // Populate
    question.textContent = data.question || data.headline || data.text || '';
    if (data.attribution) attribution.textContent = data.attribution;

    var speed = ctx.motion === 'minimal' ? 0.5 : ctx.motion === 'punchy' ? 0.7 : 1.0;

    gsap.set(orb, { scale: 0.3, autoAlpha: 0 });
    gsap.set(attribution, { autoAlpha: 0, y: 15 });

    // Orb breathes in
    tl.to(orb, {
      scale: 1, autoAlpha: 1,
      duration: speed * 2,
      ease: 'power2.out'
    }, 0);

    // Use SplitText if available for word-by-word reveal
    if (typeof SplitText !== 'undefined') {
      var split = new SplitText(question, { type: 'words' });
      gsap.set(split.words, { autoAlpha: 0, y: 20 });
      tl.to(split.words, {
        autoAlpha: 1, y: 0,
        duration: speed * 0.5,
        stagger: 0.06,
        ease: 'power2.out'
      }, 0.2);
    } else {
      gsap.set(question, { autoAlpha: 0, y: 30, filter: 'blur(6px)' });
      tl.to(question, {
        autoAlpha: 1, y: 0, filter: 'blur(0px)',
        duration: speed * 0.9,
        ease: 'power3.out'
      }, 0.2);
    }

    // Attribution
    if (data.attribution) {
      tl.to(attribution, {
        autoAlpha: 1, y: 0,
        duration: speed * 0.4,
        ease: 'power2.out'
      }, 0.8);
    }

    // Exit
    if (ctx.duration > 2) {
      var exitAt = ctx.duration - 0.7;
      tl.to(attribution, {
        autoAlpha: 0,
        duration: 0.3, ease: 'power2.in'
      }, exitAt);
      tl.to(question, {
        autoAlpha: 0, y: -15,
        duration: 0.4, ease: 'power2.in'
      }, exitAt + 0.05);
    }

    return tl;
  }
</script>
