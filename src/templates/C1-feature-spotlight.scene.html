<script>
  function createTimeline(el, data, ctx) {
    var tl = gsap.timeline();
    var iconRing = el.querySelector('.icon-ring');
    var eyebrow = el.querySelector('.eyebrow');
    var headline = el.querySelector('.headline');
    var body = el.querySelector('.body');
    var accentLine = el.querySelector('.accent-line');
    var orb1 = el.querySelector('.bg-orb-1');
    var orb2 = el.querySelector('.bg-orb-2');

    // Populate
    if (data.icon_svg) iconRing.innerHTML = data.icon_svg;
    if (data.eyebrow) eyebrow.textContent = data.eyebrow;
    headline.textContent = data.headline || data.text || '';
    if (data.body) body.textContent = data.body;

    var speed = ctx.motion === 'minimal' ? 0.5 : ctx.motion === 'punchy' ? 0.7 : 1.0;

    // Initial states
    gsap.set(iconRing, { autoAlpha: 0, scale: 0.6, y: 20 });
    gsap.set(eyebrow, { autoAlpha: 0, x: -20 });
    gsap.set(headline, { autoAlpha: 0, y: 30, filter: 'blur(6px)' });
    gsap.set(body, { autoAlpha: 0, y: 20 });
    gsap.set(accentLine, { autoAlpha: 0, scaleX: 0, transformOrigin: 'left center' });
    gsap.set([orb1, orb2], { scale: 0.6, autoAlpha: 0 });

    // Orbs breathe in
    tl.to([orb1, orb2], {
      scale: 1, autoAlpha: 1,
      duration: speed * 2,
      stagger: 0.2,
      ease: 'power2.out'
    }, 0);

    // Icon pops
    if (data.icon_svg) {
      tl.to(iconRing, {
        autoAlpha: 1, scale: 1, y: 0,
        duration: speed * 0.5,
        ease: 'back.out(1.6)'
      }, 0.15);
    }

    // Eyebrow slides in
    if (data.eyebrow) {
      tl.to(eyebrow, {
        autoAlpha: 1, x: 0,
        duration: speed * 0.4,
        ease: 'power2.out'
      }, 0.25);
    }

    // Headline reveals with blur clear
    tl.to(headline, {
      autoAlpha: 1, y: 0, filter: 'blur(0px)',
      duration: speed * 0.8,
      ease: 'power3.out'
    }, 0.35);

    // Body text
    if (data.body) {
      tl.to(body, {
        autoAlpha: 1, y: 0,
        duration: speed * 0.6,
        ease: 'power2.out'
      }, 0.55);
    }

    // Accent line draws in
    tl.to(accentLine, {
      autoAlpha: 1, scaleX: 1,
      duration: speed * 0.7,
      ease: 'power2.inOut'
    }, 0.65);

    // Orb drift
    tl.to(orb1, {
      x: 30, y: -20,
      duration: 4, ease: 'sine.inOut',
      yoyo: true, repeat: -1
    }, 1);

    // Exit
    if (ctx.duration > 2) {
      var exitAt = ctx.duration - 0.8;
      tl.to([body, accentLine], {
        autoAlpha: 0, y: -10,
        duration: 0.35, stagger: 0.04,
        ease: 'power2.in'
      }, exitAt);
      tl.to(headline, {
        autoAlpha: 0, y: -15, filter: 'blur(4px)',
        duration: 0.4, ease: 'power2.in'
      }, exitAt + 0.06);
      tl.to([eyebrow, iconRing], {
        autoAlpha: 0,
        duration: 0.3, stagger: 0.03,
        ease: 'power2.in'
      }, exitAt + 0.1);
    }

    return tl;
  }
</script>
