<script>
  function createTimeline(el, data, ctx) {
    var tl = gsap.timeline();
    var left = el.querySelector('.panel-left');
    var right = el.querySelector('.panel-right');
    var divider = el.querySelector('.divider');
    var leftLabel = left.querySelector('.panel-label');
    var leftContent = left.querySelector('.panel-content');
    var rightLabel = right.querySelector('.panel-label');
    var rightContent = right.querySelector('.panel-content');

    gsap.set([left, right, divider], { autoAlpha: 0 });
    gsap.set(left, { x: -40 });
    gsap.set(right, { x: 40 });
    gsap.set(divider, { scaleY: 0 });
    gsap.set([leftLabel, leftContent, rightLabel, rightContent], { autoAlpha: 0, y: 20 });

    var speed = ctx.motion === 'minimal' ? 0.5 : ctx.motion === 'punchy' ? 0.7 : 1.0;

    // Left panel slides in
    tl.to(left, { autoAlpha: 1, x: 0, duration: speed, ease: 'power3.out' }, 0.2);
    tl.to(leftLabel, { autoAlpha: 1, y: 0, duration: speed * 0.6, ease: 'power2.out' }, 0.4);
    tl.to(leftContent, { autoAlpha: 1, y: 0, duration: speed * 0.7, ease: 'power2.out' }, 0.55);

    // Divider grows
    tl.to(divider, { autoAlpha: 1, scaleY: 1, duration: speed * 0.8, ease: 'power2.inOut' }, 0.5);

    // Right panel slides in
    tl.to(right, { autoAlpha: 1, x: 0, duration: speed, ease: 'power3.out' }, 0.6);
    tl.to(rightLabel, { autoAlpha: 1, y: 0, duration: speed * 0.6, ease: 'power2.out' }, 0.8);
    tl.to(rightContent, { autoAlpha: 1, y: 0, duration: speed * 0.7, ease: 'power2.out' }, 0.95);

    if (ctx.duration > 3) {
      var exitAt = ctx.duration - 0.8;
      tl.to([left, divider, right], {
        autoAlpha: 0, y: -20, stagger: 0.08, duration: 0.5, ease: 'power2.in'
      }, exitAt);
    }

    return tl;
  }
</script>
