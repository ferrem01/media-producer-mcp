<script>
  function createTimeline(el, data, ctx) {
    var tl = gsap.timeline();
    var eyebrow = el.querySelector('.eyebrow');
    var headline = el.querySelector('.headline');
    var before = el.querySelector('.comp-before');
    var after = el.querySelector('.comp-after');
    var arrow = el.querySelector('.comp-arrow');
    var caption = el.querySelector('.caption');

    gsap.set([eyebrow, headline], { autoAlpha: 0, y: 20 });
    gsap.set(before, { autoAlpha: 0, x: -40 });
    gsap.set(arrow, { autoAlpha: 0, scale: 0 });
    gsap.set(after, { autoAlpha: 0, x: 40 });
    gsap.set(caption, { autoAlpha: 0, y: 15 });

    var speed = ctx.motion === 'minimal' ? 0.4 : ctx.motion === 'punchy' ? 0.6 : 0.9;

    if (eyebrow.textContent.trim()) {
      tl.to(eyebrow, { autoAlpha: 1, y: 0, duration: speed * 0.4, ease: 'power2.out' }, 0.2);
    }
    tl.to(headline, { autoAlpha: 1, y: 0, duration: speed * 0.6, ease: 'power3.out' }, 0.3);

    // Before card slides in from left
    tl.to(before, { autoAlpha: 1, x: 0, duration: speed * 0.7, ease: 'power3.out' }, 0.5);

    // Arrow pops
    tl.to(arrow, { autoAlpha: 1, scale: 1, duration: speed * 0.4, ease: 'back.out(3)' }, 0.9);

    // After card slides in from right (the payoff)
    tl.to(after, { autoAlpha: 1, x: 0, duration: speed * 0.7, ease: 'power3.out' }, 1.0);

    if (caption.textContent.trim()) {
      tl.to(caption, { autoAlpha: 1, y: 0, duration: speed * 0.4, ease: 'power2.out' }, 1.4);
    }

    if (ctx.duration > 3) {
      var exitAt = ctx.duration - 0.7;
      tl.to([after, arrow, before], { autoAlpha: 0, scale: 0.95, stagger: 0.05, duration: 0.3, ease: 'power2.in' }, exitAt);
      tl.to([headline, eyebrow, caption], { autoAlpha: 0, y: -15, duration: 0.35, ease: 'power2.in' }, exitAt + 0.1);
    }
    return tl;
  }
</script>
