<script>
  function createTimeline(el, data, ctx) {
    var tl = gsap.timeline();
    var eyebrow = el.querySelector('.eyebrow');
    var headline = el.querySelector('.headline');
    var body = el.querySelector('.body');
    var phone = el.querySelector('.phone-frame');
    var phoneW = el.querySelector('.phone-wrapper');
    var shadow = el.querySelector('.phone-shadow');
    var radial = el.querySelector('.bg-radial');
    var cards = el.querySelectorAll('.screen-card');
    var rows = el.querySelectorAll('.sl-row');
    var fab = el.querySelector('.screen-fab');

    gsap.set([eyebrow, headline, body], { autoAlpha: 0, x: -30 });
    gsap.set(phoneW, { autoAlpha: 0, x: 60, scale: 0.9 });
    gsap.set(shadow, { autoAlpha: 0 });
    gsap.set(radial, { autoAlpha: 0, scale: 0.5 });
    gsap.set(cards, { autoAlpha: 0, y: 15 });
    gsap.set(rows, { autoAlpha: 0, x: 10 });
    gsap.set(fab, { autoAlpha: 0, scale: 0 });

    var speed = ctx.motion === 'minimal' ? 0.5 : ctx.motion === 'punchy' ? 0.7 : 1.0;

    tl.to(radial, { autoAlpha: 1, scale: 1, duration: speed * 1.5, ease: 'power2.out' }, 0);

    if (eyebrow.textContent.trim()) {
      tl.to(eyebrow, { autoAlpha: 1, x: 0, duration: speed * 0.4, ease: 'power2.out' }, 0.2);
    }
    tl.to(headline, { autoAlpha: 1, x: 0, duration: speed * 0.7, ease: 'power3.out' }, 0.3);
    if (body.textContent.trim()) {
      tl.to(body, { autoAlpha: 1, x: 0, duration: speed * 0.5, ease: 'power2.out' }, 0.5);
    }

    tl.to(phoneW, { autoAlpha: 1, x: 0, scale: 1, duration: speed * 1.0, ease: 'power3.out' }, 0.3);
    tl.to(shadow, { autoAlpha: 1, duration: speed * 0.6 }, 0.6);
    tl.to(cards, { autoAlpha: 1, y: 0, stagger: 0.1, duration: speed * 0.4, ease: 'power2.out' }, 0.7);
    tl.to(rows, { autoAlpha: 1, x: 0, stagger: 0.06, duration: speed * 0.3, ease: 'power2.out' }, 0.9);
    tl.to(fab, { autoAlpha: 1, scale: 1, duration: speed * 0.4, ease: 'back.out(3)' }, 1.1);

    if (ctx.duration > 3) {
      var exitAt = ctx.duration - 0.8;
      tl.to(phoneW, { autoAlpha: 0, x: 40, scale: 0.95, duration: 0.5, ease: 'power2.in' }, exitAt);
      tl.to([headline, body, eyebrow], { autoAlpha: 0, x: -15, stagger: 0.04, duration: 0.4, ease: 'power2.in' }, exitAt + 0.1);
    }
    return tl;
  }
</script>
