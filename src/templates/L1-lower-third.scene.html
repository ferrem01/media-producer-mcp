<script>
  function createTimeline(el, data, ctx) {
    var tl = gsap.timeline();
    var mainArea = el.querySelector('.main-area');
    var mainHeadline = el.querySelector('.main-headline');
    var lowerThird = el.querySelector('.lower-third');
    var ltAccent = el.querySelector('.lt-accent');
    var ltContent = el.querySelector('.lt-content');
    var ltLogo = el.querySelector('.lt-logo');

    gsap.set(mainHeadline, { autoAlpha: 0, y: 20 });
    gsap.set(lowerThird, { autoAlpha: 0, y: 40 });
    gsap.set(ltAccent, { scaleY: 0 });
    gsap.set([ltContent, ltLogo], { autoAlpha: 0, x: -15 });

    var speed = ctx.motion === 'minimal' ? 0.5 : ctx.motion === 'punchy' ? 0.7 : 1.0;

    // Main text
    if (mainHeadline.textContent.trim()) {
      tl.to(mainHeadline, { autoAlpha: 1, y: 0, duration: speed * 0.8, ease: 'power3.out' }, 0.2);
    }

    // Lower third slides up
    tl.to(lowerThird, { autoAlpha: 1, y: 0, duration: speed * 0.7, ease: 'power3.out' }, 0.5);
    tl.to(ltAccent, { scaleY: 1, duration: speed * 0.4, ease: 'power2.out' }, 0.7);
    tl.to(ltContent, { autoAlpha: 1, x: 0, duration: speed * 0.5, ease: 'power2.out' }, 0.8);
    if (ltLogo.textContent.trim()) {
      tl.to(ltLogo, { autoAlpha: 1, x: 0, duration: speed * 0.4, ease: 'power2.out' }, 0.9);
    }

    if (ctx.duration > 3) {
      var exitAt = ctx.duration - 0.7;
      tl.to(lowerThird, { autoAlpha: 0, y: 30, duration: 0.4, ease: 'power2.in' }, exitAt);
      tl.to(mainHeadline, { autoAlpha: 0, y: -15, duration: 0.4, ease: 'power2.in' }, exitAt + 0.05);
    }

    return tl;
  }
</script>
