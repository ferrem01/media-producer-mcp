<script>
  function createTimeline(el, data, ctx) {
    var tl = gsap.timeline();
    var eyebrow = el.querySelector('.eyebrow');
    var headline = el.querySelector('.headline');
    var items = el.querySelectorAll('.logo-item');

    gsap.set([eyebrow, headline], { autoAlpha: 0, y: 20 });
    gsap.set(items, { autoAlpha: 0, y: 25, scale: 0.92 });

    var speed = ctx.motion === 'minimal' ? 0.4 : ctx.motion === 'punchy' ? 0.6 : 0.8;

    if (eyebrow.textContent.trim()) {
      tl.to(eyebrow, { autoAlpha: 1, y: 0, duration: speed * 0.5, ease: 'power2.out' }, 0.2);
    }
    tl.to(headline, { autoAlpha: 1, y: 0, duration: speed * 0.7, ease: 'power3.out' }, 0.3);

    // Logos appear in a cascade
    tl.to(items, {
      autoAlpha: 1, y: 0, scale: 1,
      stagger: { each: 0.08, from: 'random' },
      duration: speed * 0.5,
      ease: 'back.out(1.4)'
    }, 0.6);

    if (ctx.duration > 3) {
      var exitAt = ctx.duration - 0.7;
      tl.to(items, { autoAlpha: 0, scale: 0.95, stagger: 0.03, duration: 0.3, ease: 'power2.in' }, exitAt);
      tl.to([headline, eyebrow], { autoAlpha: 0, y: -15, stagger: 0.05, duration: 0.4, ease: 'power2.in' }, exitAt + 0.1);
    }

    return tl;
  }
</script>
