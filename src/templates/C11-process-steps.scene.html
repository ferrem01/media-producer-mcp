<script>
  function createTimeline(el, data, ctx) {
    var tl = gsap.timeline();
    var headline = el.querySelector('.headline');
    var eyebrow = el.querySelector('.eyebrow');
    var trackLine = el.querySelector('.track-line');
    var steps = el.querySelectorAll('.step');
    var dots = el.querySelectorAll('.step-dot');

    gsap.set([eyebrow, headline], { autoAlpha: 0, y: 20 });
    gsap.set(trackLine, { scaleX: 0, transformOrigin: 'left' });
    gsap.set(steps, { autoAlpha: 0 });
    gsap.set(dots, { scale: 0 });

    var speed = ctx.motion === 'minimal' ? 0.4 : ctx.motion === 'punchy' ? 0.6 : 0.9;

    // Header
    if (eyebrow.textContent.trim()) {
      tl.to(eyebrow, { autoAlpha: 1, y: 0, duration: speed * 0.4, ease: 'power2.out' }, 0.2);
    }
    tl.to(headline, { autoAlpha: 1, y: 0, duration: speed * 0.7, ease: 'power3.out' }, 0.3);

    // Track line draws across
    tl.to(trackLine, { scaleX: 1, duration: speed * 1.0, ease: 'power2.inOut' }, 0.5);

    // Steps appear with dot pop
    for (var i = 0; i < steps.length; i++) {
      var delay = 0.6 + i * 0.25;
      tl.to(dots[i], { scale: 1, duration: speed * 0.4, ease: 'back.out(3)' }, delay);
      tl.to(steps[i], { autoAlpha: 1, duration: speed * 0.5, ease: 'power2.out' }, delay + 0.1);
    }

    if (ctx.duration > 3) {
      var exitAt = ctx.duration - 0.7;
      tl.to(steps, { autoAlpha: 0, y: -15, stagger: 0.05, duration: 0.3, ease: 'power2.in' }, exitAt);
      tl.to([trackLine, headline, eyebrow], { autoAlpha: 0, duration: 0.3, ease: 'power2.in' }, exitAt + 0.1);
    }

    return tl;
  }
</script>
