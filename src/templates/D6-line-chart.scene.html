<script>
  function createTimeline(el, data, ctx) {
    // Bind data
    if (data.eyebrow) el.querySelector('.eyebrow').textContent = data.eyebrow;
    if (data.headline) el.querySelector('.headline').textContent = data.headline;
    if (data.y_label) el.querySelector('.y-label').textContent = data.y_label;
    if (data.highlight_value) el.querySelector('.highlight-value').textContent = data.highlight_value;
    if (data.highlight_label) el.querySelector('.highlight-label').textContent = data.highlight_label;

    // Parse data
    var xLabels = (data.x_labels || 'Q1,Q2,Q3,Q4').split(',');
    var points = (data.data_points || '20,40,60,90').split(',').map(Number);

    // Build x-labels
    var xlEl = el.querySelector('.x-labels');
    xlEl.innerHTML = '';
    xLabels.forEach(function(l) {
      var span = document.createElement('span');
      span.textContent = l.trim();
      xlEl.appendChild(span);
    });

    // Build SVG path
    var svg = el.querySelector('.chart-svg');
    var w = 600, h = 300, pad = 20;
    var stepX = (w - pad * 2) / (points.length - 1);

    // Add gradient def
    var defs = document.createElementNS('http://www.w3.org/2000/svg', 'defs');
    defs.innerHTML = '<linearGradient id="areaGradient" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="var(--mp-color-primary, #6366f1)" stop-opacity="0.3"/><stop offset="100%" stop-color="var(--mp-color-primary, #6366f1)" stop-opacity="0"/></linearGradient>';
    svg.insertBefore(defs, svg.firstChild);

    var coords = points.map(function(v, i) {
      return { x: pad + i * stepX, y: h - pad - (v / 100) * (h - pad * 2) };
    });

    // Build line path
    var d = 'M ' + coords.map(function(c) { return c.x + ' ' + c.y; }).join(' L ');
    var linePath = el.querySelector('.chart-line');
    linePath.setAttribute('d', d);

    // Build area path
    var areaD = d + ' L ' + coords[coords.length - 1].x + ' ' + (h - pad) + ' L ' + coords[0].x + ' ' + (h - pad) + ' Z';
    el.querySelector('.chart-area').setAttribute('d', areaD);

    // Position dot at last point
    var dot = el.querySelector('.chart-dot');
    var lastPt = coords[coords.length - 1];
    dot.setAttribute('cx', lastPt.x);
    dot.setAttribute('cy', lastPt.y);

    // Get line length for draw animation
    var lineLen = linePath.getTotalLength();
    linePath.style.strokeDasharray = lineLen;
    linePath.style.strokeDashoffset = lineLen;

    var tl = gsap.timeline();
    var exitAt = ctx.duration - 0.8;

    // Entrance
    tl.from(el.querySelector('.eyebrow'), { autoAlpha: 0, y: 20, duration: 0.4 }, 0.2);
    tl.from(el.querySelector('.headline'), { autoAlpha: 0, y: 30, duration: 0.5 }, 0.3);
    tl.from(el.querySelector('.chart-container'), { autoAlpha: 0, y: 40, duration: 0.6, ease: 'power3.out' }, 0.4);

    // Draw the line
    tl.to(linePath, { strokeDashoffset: 0, duration: 2.0, ease: 'power2.inOut' }, 0.8);
    tl.from(el.querySelector('.chart-area'), { autoAlpha: 0, duration: 1.0 }, 1.5);

    // Dot appears at end
    tl.from(dot, { autoAlpha: 0, scale: 0, duration: 0.4, ease: 'back.out(2)' }, 2.6);
    tl.to(dot, { scale: 1.3, duration: 0.3, yoyo: true, repeat: 1 }, 2.8);

    // Highlight value
    tl.from(el.querySelector('.highlight-value'), { autoAlpha: 0, y: 20, duration: 0.5 }, 2.2);
    tl.from(el.querySelector('.highlight-label'), { autoAlpha: 0, y: 10, duration: 0.4 }, 2.5);

    // X labels stagger
    tl.from(el.querySelectorAll('.x-labels span'), { autoAlpha: 0, y: 10, stagger: 0.1, duration: 0.3 }, 1.0);

    // Exit
    tl.to(el.querySelector('.content'), { autoAlpha: 0, y: -30, duration: 0.5 }, exitAt);

    return tl;
  }

  window.__MP_READY = true;
</script>
