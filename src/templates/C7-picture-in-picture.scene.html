<script>
  function createTimeline(el, data, ctx) {
    var tl = gsap.timeline();
    var eyebrow = el.querySelector('.eyebrow');
    var headline = el.querySelector('.headline');
    var body = el.querySelector('.body');
    var pipFrame = el.querySelector('.pip-frame');
    var pipWindow = el.querySelector('.pip-window');
    var pipGlow = el.querySelector('.pip-glow');
    var bars = el.querySelectorAll('.pip-bar');

    gsap.set([eyebrow, headline, body], { autoAlpha: 0, y: 30 });
    gsap.set(pipFrame, { autoAlpha: 0, x: 60, scale: 0.92 });
    gsap.set(pipGlow, { autoAlpha: 0, scale: 0.5 });
    gsap.set(bars, { scaleY: 0, transformOrigin: 'bottom' });

    var speed = ctx.motion === 'minimal' ? 0.5 : ctx.motion === 'punchy' ? 0.7 : 1.0;

    // Text enters
    if (eyebrow.textContent.trim()) {
      tl.to(eyebrow, { autoAlpha: 1, y: 0, duration: speed * 0.5, ease: 'power2.out' }, 0.2);
    }
    tl.to(headline, { autoAlpha: 1, y: 0, duration: speed * 0.8, ease: 'power3.out' }, 0.3);
    tl.to(body, { autoAlpha: 1, y: 0, duration: speed * 0.6, ease: 'power2.out' }, 0.5);

    // PiP flies in from right
    tl.to(pipGlow, { autoAlpha: 1, scale: 1, duration: speed * 1.2, ease: 'power2.out' }, 0.4);
    tl.to(pipFrame, { autoAlpha: 1, x: 0, scale: 1, duration: speed, ease: 'back.out(1.2)' }, 0.5);

    // Bars grow up with stagger
    tl.to(bars, { scaleY: 1, duration: speed * 0.6, stagger: 0.06, ease: 'power2.out' }, 0.9);

    if (ctx.duration > 3) {
      var exitAt = ctx.duration - 0.8;
      tl.to(pipFrame, { autoAlpha: 0, x: 40, scale: 0.95, duration: 0.5, ease: 'power2.in' }, exitAt);
      tl.to([headline, body, eyebrow], { autoAlpha: 0, y: -20, stagger: 0.05, duration: 0.4, ease: 'power2.in' }, exitAt + 0.1);
    }

    return tl;
  }
</script>
