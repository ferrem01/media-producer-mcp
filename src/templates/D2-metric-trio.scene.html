<script>
  function createTimeline(el, data, ctx) {
    var tl = gsap.timeline();
    var cards = el.querySelectorAll('.metric-card');
    var dividers = el.querySelectorAll('.metric-divider');
    var metrics = data.metrics || [];

    var speed = ctx.motion === 'minimal' ? 0.5 : ctx.motion === 'punchy' ? 0.7 : 1.0;

    // Populate and animate each metric
    cards.forEach(function(card, i) {
      var m = metrics[i] || {};
      var valueEl = card.querySelector('.metric-value');
      var prefixEl = card.querySelector('.metric-prefix');
      var suffixEl = card.querySelector('.metric-suffix');
      var labelEl = card.querySelector('.metric-label');

      if (m.prefix) prefixEl.textContent = m.prefix;
      if (m.suffix) suffixEl.textContent = m.suffix;
      if (m.label) labelEl.textContent = m.label;

      var targetValue = m.value || 0;
      var decimals = m.decimals || 0;

      // Initial states
      gsap.set(card, { autoAlpha: 0, y: 40 });

      // Staggered entrance
      var delay = 0.3 + i * 0.2;
      tl.to(card, {
        autoAlpha: 1, y: 0,
        duration: speed * 0.6,
        ease: 'power3.out'
      }, delay);

      // Count up
      var counter = { val: 0 };
      tl.to(counter, {
        val: targetValue,
        duration: speed * 1.5,
        ease: 'power2.out',
        onUpdate: function() {
          if (decimals > 0) {
            valueEl.textContent = counter.val.toFixed(decimals);
          } else {
            valueEl.textContent = Math.round(counter.val).toLocaleString();
          }
        }
      }, delay + 0.1);
    });

    // Dividers fade in
    dividers.forEach(function(div, i) {
      gsap.set(div, { autoAlpha: 0, scaleY: 0 });
      tl.to(div, {
        autoAlpha: 1, scaleY: 1,
        duration: speed * 0.6,
        ease: 'power2.out'
      }, 0.4 + i * 0.2);
    });

    // Exit
    if (ctx.duration > 2) {
      var exitAt = ctx.duration - 0.8;
      tl.to(dividers, {
        autoAlpha: 0, scaleY: 0,
        duration: 0.3, ease: 'power2.in'
      }, exitAt);
      cards.forEach(function(card, i) {
        tl.to(card, {
          autoAlpha: 0, y: -20,
          duration: 0.35,
          ease: 'power2.in'
        }, exitAt + 0.05 + i * 0.04);
      });
    }

    return tl;
  }
</script>
