<script>
  function createTimeline(el, data, ctx) {
    var tl = gsap.timeline();
    var eyebrow = el.querySelector('.eyebrow');
    var headline = el.querySelector('.headline');
    var items = el.querySelectorAll('.stack-item');

    gsap.set([eyebrow, headline], { autoAlpha: 0, x: -30 });
    gsap.set(items, { autoAlpha: 0, x: 40 });

    var speed = ctx.motion === 'minimal' ? 0.4 : ctx.motion === 'punchy' ? 0.6 : 0.8;

    if (eyebrow.textContent.trim()) {
      tl.to(eyebrow, { autoAlpha: 1, x: 0, duration: speed * 0.5, ease: 'power2.out' }, 0.2);
    }
    tl.to(headline, { autoAlpha: 1, x: 0, duration: speed * 0.8, ease: 'power3.out' }, 0.3);

    // Stack items reveal one by one
    tl.to(items, {
      autoAlpha: 1, x: 0,
      stagger: 0.15,
      duration: speed * 0.6,
      ease: 'power2.out'
    }, 0.5);

    if (ctx.duration > 3) {
      var exitAt = ctx.duration - 0.7;
      tl.to(items, { autoAlpha: 0, x: -20, stagger: 0.04, duration: 0.3, ease: 'power2.in' }, exitAt);
      tl.to([headline, eyebrow], { autoAlpha: 0, x: 20, stagger: 0.05, duration: 0.4, ease: 'power2.in' }, exitAt + 0.1);
    }

    return tl;
  }
</script>
