<script>
  function createTimeline(el, data, ctx) {
    var tl = gsap.timeline();
    var device = el.querySelector('.device-frame');
    var heroDevice = el.querySelector('.hero-device');
    var shadow = el.querySelector('.device-shadow');
    var radial = el.querySelector('.bg-radial');
    var badge = el.querySelector('.badge');
    var headline = el.querySelector('.headline');
    var subtitle = el.querySelector('.subtitle');
    var cards = el.querySelectorAll('.ui-card-sm');
    var cta = el.querySelector('.ui-hero-cta');

    gsap.set(heroDevice, { autoAlpha: 0, y: 80, scale: 0.88 });
    gsap.set(shadow, { autoAlpha: 0 });
    gsap.set(radial, { autoAlpha: 0, scale: 0.5 });
    gsap.set([badge, headline, subtitle], { autoAlpha: 0, y: 25 });
    gsap.set(cards, { autoAlpha: 0, y: 10 });
    gsap.set(cta, { autoAlpha: 0, scale: 0.8 });

    var speed = ctx.motion === 'minimal' ? 0.6 : ctx.motion === 'punchy' ? 0.8 : 1.2;

    // Radial glow
    tl.to(radial, { autoAlpha: 1, scale: 1, duration: speed * 1.5, ease: 'power2.out' }, 0);

    // Device floats up with 3D perspective
    tl.to(heroDevice, { autoAlpha: 1, y: 0, scale: 1, duration: speed * 1.2, ease: 'power3.out' }, 0.2);
    tl.to(shadow, { autoAlpha: 1, duration: speed * 0.8, ease: 'power2.out' }, 0.5);

    // UI elements populate inside device
    tl.to(cards, { autoAlpha: 1, y: 0, stagger: 0.1, duration: speed * 0.4, ease: 'power2.out' }, 0.8);
    tl.to(cta, { autoAlpha: 1, scale: 1, duration: speed * 0.3, ease: 'back.out(2)' }, 0.9);

    // Text overlay
    if (badge.textContent.trim()) {
      tl.to(badge, { autoAlpha: 1, y: 0, duration: speed * 0.4, ease: 'power2.out' }, 0.7);
    }
    tl.to(headline, { autoAlpha: 1, y: 0, duration: speed * 0.7, ease: 'power3.out' }, 0.8);
    if (subtitle.textContent.trim()) {
      tl.to(subtitle, { autoAlpha: 1, y: 0, duration: speed * 0.5, ease: 'power2.out' }, 1.0);
    }

    if (ctx.duration > 3) {
      var exitAt = ctx.duration - 0.9;
      tl.to(heroDevice, { autoAlpha: 0, y: -40, scale: 0.95, duration: 0.6, ease: 'power2.in' }, exitAt);
      tl.to([headline, subtitle, badge], { autoAlpha: 0, y: -20, stagger: 0.05, duration: 0.4, ease: 'power2.in' }, exitAt + 0.1);
    }

    return tl;
  }
</script>
