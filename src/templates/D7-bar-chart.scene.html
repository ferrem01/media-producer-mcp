<script>
  function createTimeline(el, data, ctx) {
    // Bind data
    if (data.eyebrow) el.querySelector('.eyebrow').textContent = data.eyebrow;
    if (data.headline) el.querySelector('.headline').textContent = data.headline;

    var bars = [];
    for (var i = 1; i <= 5; i++) {
      var label = data['bar_' + i + '_label'];
      var value = data['bar_' + i + '_value'];
      var display = data['bar_' + i + '_display'];
      var row = el.querySelector('.bar-' + i);
      if (label && value) {
        row.querySelector('.bar-label').textContent = label;
        row.querySelector('.bar-display').textContent = display || (value + '%');
        row.style.display = 'flex';
        bars.push({ row: row, fill: row.querySelector('.bar-fill'), value: Number(value) });
      } else {
        row.style.display = 'none';
      }
    }

    var tl = gsap.timeline();
    var exitAt = ctx.duration - 0.8;

    // Header entrance
    tl.from(el.querySelector('.eyebrow'), { autoAlpha: 0, y: 20, duration: 0.4 }, 0.2);
    tl.from(el.querySelector('.headline'), { autoAlpha: 0, y: 30, duration: 0.5 }, 0.3);

    // Bars grow with stagger
    bars.forEach(function(b, idx) {
      var delay = 0.8 + idx * 0.2;
      tl.from(b.row, { autoAlpha: 0, x: -20, duration: 0.4 }, delay);
      tl.to(b.fill, { width: b.value + '%', duration: 1.2, ease: 'power3.out' }, delay + 0.1);
      tl.from(b.row.querySelector('.bar-display'), { autoAlpha: 0, duration: 0.3 }, delay + 0.8);
    });

    // Exit
    tl.to(el.querySelector('.content'), { autoAlpha: 0, y: -30, duration: 0.5 }, exitAt);

    return tl;
  }

  window.__MP_READY = true;
</script>
