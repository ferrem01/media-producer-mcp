<!--
  Scene Template: D1 - Hero Stat
  Category: DATA
  Use when: Showcasing a single impressive number/metric.
  Feel: Dramatic reveal of a powerful data point.
  Content slots:
    - prefix: Optional prefix (e.g. "$", "#")
    - value: The number to count up to
    - suffix: Optional suffix (e.g. "%", "x", "M", "+")
    - decimals: Number of decimal places (default 0)
    - label: Description of what the number means
  Duration: 4-5s
-->
<template>

    <!-- Background -->
    <div class="bg-brand-image"></div>

<script>
  function createTimeline(el, data, ctx) {
    var tl = gsap.timeline();
    var numberEl = el.querySelector('.stat-number');
    var prefixEl = el.querySelector('.stat-prefix');
    var suffixEl = el.querySelector('.stat-suffix');
    var labelEl = el.querySelector('.stat-label');
    var wrap = el.querySelector('.stat-wrap');
    var glow = el.querySelector('.bg-glow');
    var grid = el.querySelector('.bg-grid');

    // Populate content
    if (data.prefix) prefixEl.textContent = data.prefix;
    if (data.suffix) suffixEl.textContent = data.suffix;
    if (data.label) labelEl.textContent = data.label;

    var targetValue = data.value || 0;
    var decimals = data.decimals !== undefined ? data.decimals : 0;
    var speed = ctx.motion === 'minimal' ? 0.5 : ctx.motion === 'punchy' ? 0.7 : 1.0;

    // Initial states
    gsap.set([wrap, labelEl], { autoAlpha: 0 });
    gsap.set(wrap, { scale: 0.8, y: 40 });
    gsap.set(labelEl, { y: 20 });
    gsap.set(glow, { scale: 0.3, autoAlpha: 0 });
    gsap.set(grid, { autoAlpha: 0 });

    // Grid fades in
    tl.to(grid, {
      autoAlpha: 1,
      duration: speed * 1.5,
      ease: 'power2.out'
    }, 0);

    // Glow expands
    tl.to(glow, {
      scale: 1.2, autoAlpha: 1,
      duration: speed * 1.2,
      ease: 'power2.out'
    }, 0.15);

    // Number reveals with scale
    tl.to(wrap, {
      autoAlpha: 1, scale: 1, y: 0,
      duration: speed,
      ease: ctx.motion === 'punchy' ? 'back.out(1.3)' : 'power3.out'
    }, 0.3);

    // Count up
    var counter = { val: 0 };
    tl.to(counter, {
      val: targetValue,
      duration: speed * 1.8,
      ease: 'power2.out',
      onUpdate: function() {
        if (decimals > 0) {
          numberEl.textContent = counter.val.toFixed(decimals);
        } else {
          numberEl.textContent = Math.round(counter.val).toLocaleString();
        }
      }
    }, 0.3);

    // Label fades in
    tl.to(labelEl, {
      autoAlpha: 1, y: 0,
      duration: speed * 0.5,
      ease: 'power2.out'
    }, 0.3 + speed * 0.6);

    // Glow pulse
    tl.to(glow, {
      scale: 1.4, autoAlpha: 0.6,
      duration: 2.5, ease: 'sine.inOut',
      yoyo: true, repeat: -1
    }, 0.3 + speed);

    // Exit
    if (ctx.duration > 2) {
      var exitAt = ctx.duration - 0.7;
      tl.to(glow, {
        autoAlpha: 0, scale: 0.5,
        duration: 0.5, ease: 'power2.in'
      }, exitAt);
      tl.to(grid, {
        autoAlpha: 0,
        duration: 0.4, ease: 'power2.in'
      }, exitAt);
      tl.to([wrap, labelEl], {
        autoAlpha: 0, y: -25,
        duration: 0.4, stagger: 0.05,
        ease: 'power2.in'
      }, exitAt + 0.05);
    }

    return tl;
  }
</script>
