<script>
  function createTimeline(el, data, ctx) {
    var tl = gsap.timeline();
    data = data || {};

    var stage = el.querySelector('.d3-stage');
    var device = el.querySelector('.d3-device');
    var screen = el.querySelector('.d3-screen');
    var fallback = el.querySelector('.d3-screen-fallback');
    var specular = el.querySelector('.d3-specular');
    var glow = el.querySelector('.d3-glow');
    if (!stage || !device) return tl;

    var kind = data.device === 'laptop' ? 'laptop' : 'phone';
    device.classList.add('d3-' + kind);

    if (data.screenshot && screen && fallback) {
      screen.style.backgroundImage = 'url(' + data.screenshot + ')';
      screen.style.backgroundSize = 'cover';
      screen.style.backgroundPosition = 'top center';
      fallback.style.display = 'none';
    }

    var speed = ctx.motion === 'minimal' ? 0.6 : ctx.motion === 'punchy' ? 0.7 : 1.0;
    var ease = ctx.motion === 'punchy' ? 'back.out(1.2)' : 'power3.out';

    // Settle angle: readable but with depth
    var settleY = kind === 'laptop' ? -14 : -16;
    var settleX = kind === 'laptop' ? 8 : 6;

    // Initial: hidden, rotated through real space, pushed back in depth
    gsap.set(stage, {
      autoAlpha: 0,
      rotateY: -75,
      rotateX: 22,
      z: -420,
      transformPerspective: 1200
    });
    gsap.set(glow, { autoAlpha: 0, scale: 0.5 });
    if (specular) gsap.set(specular, { xPercent: -60, autoAlpha: 0.0 });

    // Glow blooms first
    tl.to(glow, { autoAlpha: 1, scale: 1, duration: speed * 0.9, ease: 'power2.out' }, 0.1);

    // Device rotates in through space and settles to a readable angle
    tl.to(stage, {
      autoAlpha: 1,
      rotateY: settleY,
      rotateX: settleX,
      z: 0,
      duration: speed * 1.5,
      ease: ease
    }, 0.25);

    // Specular sweep tied to the rotation (lighting feel)
    if (specular) {
      tl.to(specular, { autoAlpha: 1, duration: 0.4, ease: 'power1.out' }, 0.4);
      tl.fromTo(specular,
        { xPercent: -60 },
        { xPercent: 60, duration: speed * 1.5, ease: 'power2.inOut' },
        0.4);
    }

    var settleAt = 0.25 + speed * 1.5;

    // Gentle ambient orbit (one continuous tasteful 3D move)
    tl.to(stage, {
      rotateY: settleY + 10,
      rotateX: settleX - 4,
      duration: 3.2,
      ease: 'sine.inOut',
      yoyo: true,
      repeat: -1
    }, settleAt);

    // Ambient specular drift to match orbit
    if (specular) {
      tl.to(specular, {
        xPercent: 25,
        duration: 3.2,
        ease: 'sine.inOut',
        yoyo: true,
        repeat: -1
      }, settleAt);
    }

    // Exit
    if (ctx.duration > 2) {
      var exitAt = ctx.duration - 0.7;
      tl.to(stage, {
        autoAlpha: 0,
        rotateY: settleY - 30,
        z: -200,
        scale: 0.95,
        duration: 0.5,
        ease: 'power2.in'
      }, exitAt);
      tl.to(glow, { autoAlpha: 0, duration: 0.45, ease: 'power2.in' }, exitAt);
    }

    return tl;
  }
</script>
