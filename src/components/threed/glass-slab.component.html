<template>
  <div class="gls-root">
    <div class="gls-mount"></div>
    <div class="gls-caption"></div>
  </div>
</template>

<style scoped>
  .gls-root {
    position: relative;
    width: 100%;
    height: 100%;
    /* Deep blue ambient vignette behind the transparent canvas: the glow feels
       like light scattering into a dark room, not a pane floating in a void. */
    background: radial-gradient(ellipse 90% 75% at 50% 44%, #0a1030 0%, #050818 45%, #000000 100%);
    overflow: hidden;
    font-family: var(--mp-font-heading, var(--mp-font-family, 'Inter', system-ui, sans-serif));
  }
  .gls-mount {
    position: absolute;
    inset: 0;
  }
  .gls-mount canvas { display: block; width: 100%; height: 100%; }
  .gls-caption {
    position: absolute;
    left: 0; right: 0;
    bottom: 8%;
    text-align: center;
    font-weight: 500;
    font-size: 26px;
    letter-spacing: 0.16em;
    color: rgba(255,255,255,0.85);
    z-index: 5;
    pointer-events: none;
  }
</style>

<script>
  function createTimeline(el, data, ctx) {
    var tl = gsap.timeline();
    data = data || {};
    ctx = ctx || {};

    var mount = el.querySelector('.gls-mount');
    var captionEl = el.querySelector('.gls-caption');

    // If three.js failed to load, degrade gracefully to an empty timeline.
    if (typeof THREE === 'undefined' || !mount) {
      if (typeof console !== 'undefined') console.warn('[glass-slab] THREE not available');
      return tl;
    }

    var W = (ctx.canvas && ctx.canvas.width) || 1920;
    var H = (ctx.canvas && ctx.canvas.height) || 1080;

    // Software WebGL (SwiftShader) has no GPU: full-1080p bloom compile+render is
    // synchronous and can blow the 30s __MP_READY budget. Render internally at a
    // capped resolution and let CSS upscale the canvas to fill the frame.
    var RES_MAX = 1280;
    var rscale = Math.min(1, RES_MAX / Math.max(W, H));
    var RW = Math.max(2, Math.round(W * rscale));
    var RH = Math.max(2, Math.round(H * rscale));

    // ── Colors ──
    function hexToRgb(hex) {
      var h = String(hex || '').trim().replace('#', '');
      if (h.length === 3) h = h[0]+h[0]+h[1]+h[1]+h[2]+h[2];
      var n = parseInt(h, 16);
      if (isNaN(n) || h.length !== 6) return null;
      return { r:((n>>16)&255)/255, g:((n>>8)&255)/255, b:(n&255)/255 };
    }
    var rootStyle = getComputedStyle(el.querySelector('.gls-root') || el);
    var brandPrimary = (rootStyle.getPropertyValue('--mp-color-primary') || '').trim();
    var glowHex = (data.glow_color && String(data.glow_color).trim()) || brandPrimary || '#393bf5';
    if (!hexToRgb(glowHex)) glowHex = '#393bf5';
    // Construct from the hex STRING so three applies the sRGB->linear working-space
    // conversion. Feeding raw sRGB floats in as linear is what washed the brand
    // blue out to pale lavender on output (linear 0.22 -> sRGB ~0.52).
    var glowColor = new THREE.Color(glowHex);

    // ── Aspect ──
    function parseAspect(s) {
      var m = String(s || '').match(/([\d.]+)\s*[\/:xX]\s*([\d.]+)/);
      if (m) { var a=parseFloat(m[1]), b=parseFloat(m[2]); if (a>0&&b>0) return a/b; }
      return 16/9;
    }
    var ar = parseAspect(data.aspect_ratio);

    // ── Renderer ──
    try {
    var renderer = new THREE.WebGLRenderer({ antialias: false, alpha: true, preserveDrawingBuffer: true });
    renderer.setPixelRatio(1);                 // SwiftShader software WebGL -- keep it at 1
    renderer.setSize(RW, RH, false);
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.15;
    renderer.setClearColor(0x000000, 0);   // transparent: the CSS vignette shows through
    mount.appendChild(renderer.domElement);

    var scene = new THREE.Scene();
    var camera = new THREE.PerspectiveCamera(34, W / H, 0.1, 100);
    var CAM_Z = 5.0;
    camera.position.set(0, 0, CAM_Z);

    // ── The glass pane (rounded, thin) ──
    // THIN is what sells the Framer look: edge-on it must read as a hairline of
    // light, not a glowing column. Face corners stay rounded via the extruded
    // rounded-rect (a RoundedBox can't have face radius > depth/2 on a thin pane).
    var paneW = 3.4;
    var paneH = paneW / ar;
    var depth = 0.055;
    var radius = 0.07;
    function roundedRectPath(target, w, h, r) {
      var x = -w / 2, y = -h / 2;
      target.moveTo(x, y + r);
      target.lineTo(x, y + h - r);
      target.quadraticCurveTo(x, y + h, x + r, y + h);
      target.lineTo(x + w - r, y + h);
      target.quadraticCurveTo(x + w, y + h, x + w, y + h - r);
      target.lineTo(x + w, y + r);
      target.quadraticCurveTo(x + w, y, x + w - r, y);
      target.lineTo(x + r, y);
      target.quadraticCurveTo(x, y, x, y + r);
    }

    // No transmission pass (flaky/slow under SwiftShader). The Framer look is a
    // DARK glass body -- barely-there blue tint, glossy specular -- with all the
    // light coming from the rim ring below. Body emissive stays very low.
    var glassShape = new THREE.Shape();
    roundedRectPath(glassShape, paneW, paneH, radius);
    var glassGeo = new THREE.ExtrudeGeometry(glassShape, { depth: depth, bevelEnabled: false, curveSegments: 10 });
    glassGeo.translate(0, 0, -depth / 2);
    var glassMat = new THREE.MeshPhysicalMaterial({
      color: new THREE.Color(0x05060d),
      metalness: 0.0,
      roughness: 0.14,
      clearcoat: 1.0,
      clearcoatRoughness: 0.06,
      reflectivity: 0.6,
      emissive: glowColor,
      emissiveIntensity: 0.05,
      transparent: false
    });
    var glass = new THREE.Mesh(glassGeo, glassMat);

    // ── The glowing rim: a thin extruded rounded-rect ring wrapping the pane's
    // edge. This is the ONLY strong bloom source -- a blue line with a hot core
    // and a soft blue halo tracing the contour, like the Framer reveal. ──
    var ringW = 0.016;
    var ringDepth = depth * 1.12;
    var rimShape = new THREE.Shape();
    roundedRectPath(rimShape, paneW + 0.016, paneH + 0.016, radius + 0.008);
    var rimHole = new THREE.Path();
    roundedRectPath(rimHole, paneW + 0.016 - ringW * 2, paneH + 0.016 - ringW * 2, Math.max(0.02, radius + 0.008 - ringW));
    rimShape.holes.push(rimHole);
    var rimGeo = new THREE.ExtrudeGeometry(rimShape, { depth: ringDepth, bevelEnabled: false, curveSegments: 10 });
    rimGeo.translate(0, 0, -ringDepth / 2);
    // Mostly brand blue with a slight lift toward white; bloom supplies the halo.
    // Brightness is corner-weighted (hot at the top-left, decaying along the run)
    // like the reference -- a uniform ring reads as cheap neon.
    var rimColor = glowColor.clone().lerp(new THREE.Color(0xffffff), 0.12).multiplyScalar(1.25);
    var rimMat = new THREE.ShaderMaterial({
      uniforms: {
        uColor: { value: rimColor },
        uHalf: { value: new THREE.Vector2(paneW / 2, paneH / 2) }
      },
      vertexShader: 'varying vec2 vP; void main(){ vP = position.xy; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }',
      fragmentShader: [
        'uniform vec3 uColor; uniform vec2 uHalf; varying vec2 vP;',
        'void main(){',
        '  float w = clamp(0.5 - (vP.x / uHalf.x) * 0.42 + (vP.y / uHalf.y) * 0.40, 0.0, 1.0);',
        '  float b = 0.5 + 1.7 * w * w;',
        '  gl_FragColor = vec4(uColor * b, 1.0);',
        '}'
      ].join('\n')
    });
    var rimMesh = new THREE.Mesh(rimGeo, rimMat);

    // ── Fresnel sheen: a grazing-angle blue wash over the glass body that lives
    // during the turn and dies as the pane squares up. Additive, subtle. ──
    var fresnelMat = new THREE.ShaderMaterial({
      uniforms: { uColor: { value: glowColor.clone() } },
      vertexShader: 'varying vec3 vN; varying vec3 vV; void main(){ vec4 mv = modelViewMatrix * vec4(position, 1.0); vN = normalize(normalMatrix * normal); vV = normalize(-mv.xyz); gl_Position = projectionMatrix * mv; }',
      fragmentShader: 'uniform vec3 uColor; varying vec3 vN; varying vec3 vV; void main(){ float f = pow(1.0 - abs(dot(normalize(vN), normalize(vV))), 3.0); gl_FragColor = vec4(uColor * f * 0.22, 1.0); }',
      blending: THREE.AdditiveBlending,
      depthWrite: false,
      transparent: true
    });
    var fresnelMesh = new THREE.Mesh(glassGeo, fresnelMat);

    // ── The screen (screenshot) sitting just in front of the glass face ──
    var screenW = paneW * 0.93, screenH = paneH * 0.93;
    var screenGeo = new THREE.PlaneGeometry(screenW, screenH);
    var screenMat = new THREE.MeshBasicMaterial({ color: new THREE.Color(0x0a0b18) });
    var screenMesh = new THREE.Mesh(screenGeo, screenMat);
    screenMesh.position.z = depth / 2 + 0.012;

    // Load the screenshot as the screen texture (async; face isn't visible until
    // the pane crosses 90deg, by which time the local fetch has resolved).
    if (data.screenshot) {
      var loader = new THREE.TextureLoader();
      loader.setCrossOrigin('anonymous');
      loader.load(String(data.screenshot), function (tex) {
        // NoColorSpace on purpose: the screen is an unlit basic material and the
        // composer has no output pass to re-encode, so decoding sRGB->linear here
        // would ship darker, hue-shifted UI colors. Pass source pixels through.
        tex.colorSpace = THREE.NoColorSpace;
        tex.anisotropy = 1;
        screenMat.map = tex;
        screenMat.color = new THREE.Color(0xffffff);
        screenMat.needsUpdate = true;
      });
    }

    var slab = new THREE.Group();
    slab.add(glass);
    slab.add(fresnelMesh);
    slab.add(rimMesh);
    slab.add(screenMesh);
    scene.add(slab);

    // ── Lighting: real specular that shifts as the pane turns ──
    scene.add(new THREE.AmbientLight(0x223055, 0.35));
    var key = new THREE.DirectionalLight(0xbcc6ff, 1.4);
    key.position.set(-3, 2.5, 4);
    scene.add(key);
    var rim = new THREE.PointLight(glowColor, 3.0, 20);
    rim.position.set(0, 0, 2.2);
    scene.add(rim);

    // ── Selective bloom (classic two-composer technique) ──
    // A single global bloom pass cannot work here: bloom thresholds are
    // LUMINANCE-weighted (blue ~0.11), so a white light-mode screenshot always
    // out-lumas the blue glass edge -- either the whole UI blooms into a blown
    // white rectangle or nothing blooms. Instead: render a bloom pass with the
    // screen blacked out (mesh kept, so occlusion is preserved), then additively
    // composite it over the base render.
    var blackMat = new THREE.MeshBasicMaterial({ color: 0x000000 });
    var bloomComposer = new THREE.EffectComposer(renderer);
    bloomComposer.renderToScreen = false;
    bloomComposer.addPass(new THREE.RenderPass(scene, camera));
    // Strength/radius sized for a THIN line source: the fat, soft blue halo
    // around the rim comes from here.
    var bloom = new THREE.UnrealBloomPass(new THREE.Vector2(RW, RH), 1.0, 0.5, 0.0);
    bloomComposer.addPass(bloom);

    var composer = new THREE.EffectComposer(renderer);
    composer.addPass(new THREE.RenderPass(scene, camera));
    // The composite also carries the film grade: vignette, a gentle contrast
    // lift, and grain. Grain is seeded from uTime = the timeline's t, so every
    // frame is deterministic under the seek-based capture.
    var mixPass = new THREE.ShaderPass(new THREE.ShaderMaterial({
      uniforms: {
        baseTexture: { value: null },
        bloomTexture: { value: bloomComposer.renderTarget2.texture },
        uTime: { value: 0 }
      },
      vertexShader: 'varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }',
      fragmentShader: [
        'uniform sampler2D baseTexture; uniform sampler2D bloomTexture; uniform float uTime; varying vec2 vUv;',
        'float hash(vec2 p){ return fract(sin(dot(p, vec2(12.9898, 78.233))) * 43758.5453); }',
        'void main(){',
        '  vec4 b = texture2D(baseTexture, vUv);',
        '  vec4 bl = texture2D(bloomTexture, vUv);',
        '  vec4 c = b + bl;',
        // Content mask: geometry (base alpha) or glow (bloom energy). Keeps the
        // grade/grain off the empty background so it stays clean.
        '  float m = clamp(b.a + dot(bl.rgb, vec3(2.0)), 0.0, 1.0);',
        '  float d = distance(vUv, vec2(0.5, 0.47));',
        '  c.rgb *= 1.0 - 0.30 * smoothstep(0.38, 0.95, d);',         // vignette
        '  c.rgb = c.rgb * 1.04 + vec3(0.003, 0.005, 0.016) * m;',    // grade: contrast + navy lift
        '  float g = hash(vUv * vec2(1287.0, 718.0) + fract(uTime * 7.13)) - 0.5;',
        '  c.rgb += g * 0.012 * m;',                                   // film grain (subtle, content only)
        '  gl_FragColor = c;',
        '}'
      ].join('\n')
    }), 'baseTexture');
    composer.addPass(mixPass);

    // ── Caption (DOM overlay) ──
    if (captionEl) {
      if (data.caption) { captionEl.textContent = data.caption; gsap.set(captionEl, { autoAlpha: 0, y: 12 }); }
      else { captionEl.style.display = 'none'; }
    }

    // ── Motion (all a pure function of the tweened proxy `state.t`) ──
    var motion = ctx.motion || 'cinematic';
    var base = motion === 'punchy' ? 0.85 : motion === 'minimal' ? 1.2 : 1.0;
    var holdDur = 0.6 * base;                 // edge-on beauty hold
    var rotDur = 2.7 * base;                  // the turn
    var startY = Math.PI / 2 + 0.10;          // just past edge-on (face turned away)
    var restY = -0.14;                        // ~ -8deg resting angle
    // Weighted mechanical turn: gentle start off the hold, long luxurious
    // deceleration into the rest pose (the Framer feel), instead of the
    // front-loaded kick of an ease-out.
    function turnEase(p) { return p < 0.5 ? 8 * p * p * p * p : 1 - 8 * Math.pow(1 - p, 4); }
    function clamp01(x) { return x < 0 ? 0 : x > 1 ? 1 : x; }

    function applyState(t) {
      // rotation: hold edge-on, then one continuous weighted turn
      var rp = turnEase(clamp01((t - holdDur) / rotDur));
      slab.rotation.y = startY + (restY - startY) * rp;
      slab.rotation.x = 0.05 * (1 - rp) + 0.03;
      slab.rotation.z = -0.01 * rp;
      // scale settle + slow macro push-in after the turn
      var settleAt = holdDur + rotDur;
      var pushP = clamp01((t - settleAt) / 3.2);
      var s = 0.92 + 0.08 * rp;
      slab.scale.setScalar(s);
      camera.position.z = CAM_Z - 0.35 * pushP;
      // rim light drifts with the turn to keep the specular alive
      rim.position.x = -1.6 * (1 - rp);
      // The screen wakes up as the pane comes to face the camera (Framer-style:
      // during the turn the face is dark glass, then the UI lights up).
      var wake = clamp01((rp - 0.72) / 0.28);
      var lum = 0.08 + 0.92 * wake * wake;
      screenMat.color.setRGB(lum, lum, lum);
      mixPass.material.uniforms.uTime.value = t;
      // Selective bloom: bloom pass sees the screen blacked out (occlusion kept),
      // then the mix pass composites bloom over the true render.
      var liveMat = screenMesh.material;
      screenMesh.material = blackMat;
      bloomComposer.render();
      screenMesh.material = liveMat;
      composer.render();
    }

    // The single driving tween: seeking the master timeline to t sets state.t and
    // fires onUpdate -> applyState -> composer.render(). Deterministic per frame.
    var state = { t: 0 };
    applyState(0);
    tl.to(state, {
      t: (ctx.duration || 6.5),
      duration: (ctx.duration || 6.5),
      ease: 'none',
      onUpdate: function () { applyState(state.t); }
    }, 0);

    // Caption fades in late, like a signature.
    if (captionEl && data.caption) {
      var capAt = Math.max(holdDur + rotDur, (ctx.duration || 6.5) - 1.6);
      tl.to(captionEl, { autoAlpha: 1, y: 0, duration: 1.0, ease: 'power2.out' }, capAt);
    }
    } catch (e) {
      // WebGL setup/render failed under software rasterization: degrade to an
      // empty (black) timeline rather than hanging the readiness probe.
      if (typeof console !== 'undefined') console.warn('[glass-slab] WebGL failed:', e && e.message);
      return tl;
    }

    return tl;
  }
</script>
