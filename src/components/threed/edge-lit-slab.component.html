    <div class="els-stage">

        <div class="els-extrude"></div>

      </div>
      <div class="els-lightbar"></div>

    <div class="els-caption"></div>
  </div>
</template>

<style scoped>

<script>
  function createTimeline(el, data, ctx) {
    var tl = gsap.timeline();
    data = data || {};
    ctx = ctx || {};

    var root = el.querySelector('.els-root');
    var stage = el.querySelector('.els-stage');
    var slab = el.querySelector('.els-slab');
    var extrude = el.querySelector('.els-extrude');
    var face = el.querySelector('.els-face');
    var screen = el.querySelector('.els-screen');
    var fallback = el.querySelector('.els-screen-fallback');
    var rim = el.querySelector('.els-rim');
    var specular = el.querySelector('.els-specular');
    var glow = el.querySelector('.els-glow');
    var lightbar = el.querySelector('.els-lightbar');
    var caption = el.querySelector('.els-caption');
    if (!slab || !stage) return tl;

    // ── Resolve colors ──
    function hexToRgb(hex) {
      var h = String(hex || '').trim().replace('#', '');
      if (h.length === 3) h = h[0] + h[0] + h[1] + h[1] + h[2] + h[2];
      var n = parseInt(h, 16);
      if (isNaN(n) || h.length !== 6) return null;
      return { r: (n >> 16) & 255, g: (n >> 8) & 255, b: n & 255 };
    }
    function rgba(hex, a) {
      var c = hexToRgb(hex);
      if (!c) return 'rgba(57,59,245,' + a + ')';
      return 'rgba(' + c.r + ',' + c.g + ',' + c.b + ',' + a + ')';
    }
    function lighten(hex, amt) {
      var c = hexToRgb(hex);
      if (!c) return '#dfe2ff';
      var f = function (v) { return Math.round(v + (255 - v) * amt); };
      var toHex = function (v) { return ('0' + v.toString(16)).slice(-2); };
      return '#' + toHex(f(c.r)) + toHex(f(c.g)) + toHex(f(c.b));
    }

    var brandPrimary = (getComputedStyle(root).getPropertyValue('--mp-color-primary') || '').trim();
    var glowHex = (data.glow_color && String(data.glow_color).trim()) || brandPrimary || '#393bf5';
    var crestHex = lighten(glowHex, 0.78);
    if (root) {
      root.style.setProperty('--els-glow', glowHex);
      root.style.setProperty('--els-glow-soft', rgba(glowHex, 0.6));
      root.style.setProperty('--els-glow-faint', rgba(glowHex, 0.18));
      root.style.setProperty('--els-crest', crestHex);
      // Escape hatch: composite over another layer instead of a black stage.
      if (String(data.backdrop || '').toLowerCase() === 'transparent') {
        root.style.background = 'transparent';
      }
    }

    // ── Size the slab from the image aspect ratio ──
    function parseAspect(s) {
      var m = String(s || '').match(/([\d.]+)\s*[\/:xX]\s*([\d.]+)/);
      if (m) { var a = parseFloat(m[1]); var b = parseFloat(m[2]); if (a > 0 && b > 0) return a / b; }
      return 16 / 9;
    }
    var ar = parseAspect(data.aspect_ratio);
    var maxW = 1000, maxH = 690;
    var w = maxW, h = w / ar;
    if (h > maxH) { h = maxH; w = h * ar; }
    var radius = Math.max(12, Math.round(Math.min(w, h) * 0.03));
    slab.style.width = Math.round(w) + 'px';
    slab.style.height = Math.round(h) + 'px';
    if (face) face.style.borderRadius = radius + 'px';
    if (rim) rim.style.borderRadius = radius + 'px';

    // ── Build the extruded thickness (stacked Z-offset frames) ──
    var DEPTH = 26;          // total thickness in px
    var LAYERS = 16;
    if (extrude) {
      var step = DEPTH / LAYERS;
      for (var i = 1; i <= LAYERS; i++) {
        var layer = document.createElement('div');
        layer.className = 'els-layer';
        layer.style.borderRadius = radius + 'px';
        var depthT = i / LAYERS;                 // 0..1 from face to back
        var bright = 1 - depthT;                 // brighter near the face crest
        // near-face layers glow bright (the lit bevel crest), deep layers go dark
        layer.style.transform = 'translateZ(' + (-i * step) + 'px)';
        layer.style.background = rgba(glowHex, 0.16 + bright * 0.42);
        layer.style.boxShadow = 'inset 0 0 ' + (7 + bright * 13) + 'px ' + rgba(crestHex, 0.14 + bright * 0.45)
          + ', 0 0 ' + (bright * 12) + 'px ' + rgba(glowHex, bright * 0.7);
        extrude.appendChild(layer);
      }
    }

    // ── Screenshot on the face ──
    if (data.screenshot && screen) {
      screen.style.backgroundImage = 'url("' + String(data.screenshot).replace(/"/g, '&quot;') + '")';
      if (fallback) fallback.style.display = 'none';
    }

    // ── Light bar (edge-on beauty) -- a contained clean edge, not full-length ──
    if (lightbar) lightbar.style.height = Math.round(h * 0.58) + 'px';

    // ── Caption ──
    if (caption) {
      if (data.caption) { caption.textContent = data.caption; }
      else { caption.style.display = 'none'; }
    }

    // ── Motion tuning ──
    var motion = ctx.motion || 'cinematic';
    var base = motion === 'punchy' ? 0.85 : motion === 'minimal' ? 1.2 : 1.0;
    var restY = (typeof data.rest_angle === 'number') ? data.rest_angle : -8;
    var restX = 3;
    var rotDur = 2.7 * base;

    // ── Initial state: slab HIDDEN and only partly rotated, so the raw edge-on
    // silhouette is never seen -- the clean light bar is the sole opener. ──
    gsap.set(stage, { transformPerspective: 1700 });
    gsap.set(slab, { rotateY: 72, rotateX: 0, z: -40, scale: 0.94, autoAlpha: 0, transformOrigin: '50% 50%' });
    if (rim) gsap.set(rim, { autoAlpha: 0.15 });
    if (specular) gsap.set(specular, { autoAlpha: 0, xPercent: -60 });
    if (glow) gsap.set(glow, { autoAlpha: 0, scale: 0.6 });
    if (lightbar) gsap.set(lightbar, { autoAlpha: 0, scaleY: 0.7 });
    if (caption) gsap.set(caption, { autoAlpha: 0, y: 12 });

    // Beauty beat: the light bar ignites and holds edge-on
    if (lightbar) {
      tl.to(lightbar, { autoAlpha: 1, scaleY: 1, duration: 0.5 * base, ease: 'power2.out' }, 0.1);
    }
    if (glow) {
      tl.to(glow, { autoAlpha: 1, scale: 1, duration: 1.1 * base, ease: 'power2.out' }, 0.2);
    }

    var pivotAt = 0.7 * base;

    // The slab fades in FROM the light bar right as the pivot begins, so the
    // opener reads as a clean glowing edge that opens into the panel.
    tl.to(slab, { autoAlpha: 1, duration: 0.35 * base, ease: 'power1.out' }, pivotAt);

    // The pivot: edge-on -> face-on, weighted and inevitable
    tl.to(slab, {
      rotateY: restY,
      rotateX: restX,
      z: 0,
      scale: 1.0,
      duration: rotDur,
      ease: 'power3.out'
    }, pivotAt);

    // Light bar hands off to the face as it opens
    if (lightbar) {
      tl.to(lightbar, { autoAlpha: 0, duration: 0.6 * base, ease: 'power2.in' }, pivotAt + 0.15);
    }
    // Rim glow blooms in as the beveled face turns toward camera
    if (rim) {
      tl.to(rim, { autoAlpha: 1, duration: rotDur * 0.7, ease: 'power2.out' }, pivotAt + 0.1);
    }
    // Specular rake across the screen, tied to the rotation
    if (specular) {
      tl.to(specular, { autoAlpha: 1, duration: 0.4, ease: 'power1.out' }, pivotAt + 0.2);
      tl.fromTo(specular, { xPercent: -60 }, { xPercent: 60, duration: rotDur, ease: 'power2.inOut' }, pivotAt + 0.2);
    }

    var settleAt = pivotAt + rotDur;

    // Slow macro push-in toward the UI (camera dolly with inertia) -- kept
    // modest so the slab stays comfortably framed at the end.
    tl.to(slab, { scale: 1.045, duration: 3.2, ease: 'none' }, settleAt);
    // Gentle ambient orbit so the rim-light keeps shifting
    tl.to(slab, {
      rotateY: restY + 6, rotateX: restX - 2,
      duration: 3.4, ease: 'sine.inOut', yoyo: true, repeat: -1
    }, settleAt);
    if (specular) {
      tl.to(specular, { xPercent: 28, duration: 3.4, ease: 'sine.inOut', yoyo: true, repeat: -1 }, settleAt);
    }

    // Caption arrives late, like a signature
    if (caption && data.caption) {
      var capAt = Math.max(settleAt, (ctx.duration || 6.5) - 1.6);
      tl.to(caption, { autoAlpha: 1, y: 0, duration: 1.0, ease: 'power2.out' }, capAt);
    }

    // Exit
    if (ctx.duration && ctx.duration > 2.5) {
      var exitAt = ctx.duration - 0.6;
      tl.to(slab, { autoAlpha: 0, rotateY: restY - 22, z: -160, duration: 0.5, ease: 'power2.in' }, exitAt);
      if (glow) tl.to(glow, { autoAlpha: 0, duration: 0.45, ease: 'power2.in' }, exitAt);
      if (caption) tl.to(caption, { autoAlpha: 0, duration: 0.4 }, exitAt);
    }

    return tl;
  }
</script>
