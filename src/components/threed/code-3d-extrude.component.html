<script>
  function createTimeline(el, data, ctx) {
    var tl = gsap.timeline();
    data = data || {};

    var stage = el.querySelector('.c3-stage');
    var slab = el.querySelector('.c3-slab');
    var codeEl = el.querySelector('.c3-code');
    var numsEl = el.querySelector('.c3-nums');
    var langEl = el.querySelector('.c3-lang');
    var specular = el.querySelector('.c3-specular');
    var glow = el.querySelector('.c3-glow');
    if (!stage || !slab || !codeEl || !numsEl) return tl;

    var code = (typeof data.code === 'string' && data.code.length) ? data.code
      : "function greet(name) {\n  // build a friendly message\n  const msg = \"Hello, \" + name;\n  return msg;\n}";
    var language = data.language || 'js';
    if (langEl) langEl.textContent = language;

    // lightweight tokenizer -> array of {text, cls}
    var KW = ['function','return','const','let','var','if','else','for','while','import','export','from','class','new','async','await','def','public','private','void','int','string','bool','true','false','null','undefined','this','print'];
    function tokenize(line) {
      var out = [];
      var trimmed = line.replace(/^\s*/, '');
      if (trimmed.indexOf('//') === 0 || trimmed.indexOf('#') === 0) {
        out.push({ text: line, cls: 'tok-com' });
        return out;
      }
      var re = /(\"[^\"]*\"|'[^']*'|`[^`]*`)|(\/\/.*$)|(\b\d+(?:\.\d+)?\b)|([A-Za-z_$][A-Za-z0-9_$]*)|(\s+)|([^\sA-Za-z0-9_$]+)/g;
      var m;
      while ((m = re.exec(line)) !== null) {
        if (m[1]) out.push({ text: m[1], cls: 'tok-str' });
        else if (m[2]) out.push({ text: m[2], cls: 'tok-com' });
        else if (m[3]) out.push({ text: m[3], cls: 'tok-num' });
        else if (m[4]) {
          var cls = KW.indexOf(m[4]) !== -1 ? 'tok-kw' : null;
          if (!cls) {
            var after = line.slice(re.lastIndex);
            if (/^\s*\(/.test(after)) cls = 'tok-fn';
          }
          out.push({ text: m[4], cls: cls });
        }
        else if (m[5]) out.push({ text: m[5], cls: null });
        else out.push({ text: m[0], cls: null });
        if (m.index === re.lastIndex) re.lastIndex++;
      }
      return out;
    }

    var lines = code.split('\n');
    codeEl.innerHTML = '';
    numsEl.innerHTML = '';
    var lineEls = [];
    lines.forEach(function(line, i) {
      var num = document.createElement('span');
      num.className = 'c3-num';
      num.textContent = (i + 1).toString();
      numsEl.appendChild(num);

      var lineEl = document.createElement('span');
      lineEl.className = 'c3-line';
      var toks = tokenize(line);
      toks.forEach(function(tok) {
        var span = document.createElement('span');
        if (tok.cls) span.className = tok.cls;
        span.textContent = tok.text;
        lineEl.appendChild(span);
      });
      codeEl.appendChild(lineEl);
      lineEls.push(lineEl);
    });

    var speed = ctx.motion === 'minimal' ? 0.6 : ctx.motion === 'punchy' ? 0.7 : 1.0;
    var ease = ctx.motion === 'punchy' ? 'back.out(1.2)' : 'power3.out';

    // Initial: rotated through space, pushed back, hidden
    gsap.set(stage, {
      autoAlpha: 0,
      rotateY: 62,
      rotateX: -20,
      z: -460,
      transformPerspective: 1300
    });
    gsap.set(glow, { autoAlpha: 0, scale: 0.5 });
    gsap.set(lineEls, { autoAlpha: 0, x: -8 });
    if (specular) gsap.set(specular, { xPercent: 70, autoAlpha: 0 });

    // Glow blooms
    tl.to(glow, { autoAlpha: 1, scale: 1, duration: speed * 0.9, ease: 'power2.out' }, 0.1);

    // Slab rotates through space and settles flat to readable
    tl.to(stage, {
      autoAlpha: 1,
      rotateY: 0,
      rotateX: 0,
      z: 0,
      duration: speed * 1.5,
      ease: ease
    }, 0.25);

    // Specular sweep across the slab as it rotates
    if (specular) {
      tl.to(specular, { autoAlpha: 1, duration: 0.4 }, 0.35);
      tl.fromTo(specular,
        { xPercent: 70 },
        { xPercent: -70, duration: speed * 1.5, ease: 'power2.inOut' },
        0.35);
    }

    // Code lines reveal once slab is mostly flat
    var revealAt = 0.25 + speed * 0.9;
    tl.to(lineEls, {
      autoAlpha: 1, x: 0,
      duration: 0.4,
      stagger: 0.06,
      ease: 'power2.out'
    }, revealAt);

    var settleAt = 0.25 + speed * 1.5;

    // Gentle ambient orbit at readable angle
    tl.to(stage, {
      rotateY: 7,
      rotateX: 3,
      duration: 3.4,
      ease: 'sine.inOut',
      yoyo: true,
      repeat: -1
    }, settleAt);
    if (specular) {
      tl.to(specular, {
        xPercent: 20,
        duration: 3.4,
        ease: 'sine.inOut',
        yoyo: true,
        repeat: -1
      }, settleAt);
    }

    // Exit
    if (ctx.duration > 2) {
      var exitAt = ctx.duration - 0.7;
      tl.to(stage, {
        autoAlpha: 0,
        rotateY: -28,
        z: -220,
        scale: 0.96,
        duration: 0.5,
        ease: 'power2.in'
      }, exitAt);
      tl.to(glow, { autoAlpha: 0, duration: 0.45, ease: 'power2.in' }, exitAt);
    }

    return tl;
  }
</script>
