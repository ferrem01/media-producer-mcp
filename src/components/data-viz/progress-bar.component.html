<template>
  <div class="progress-bar-component">
    <div class="progress-label">{{label}}</div>
    <div class="progress-track">
      <div class="progress-fill"></div>
    </div>
    <div class="progress-value"></div>
  </div>
</template>

<style scoped>
  .progress-bar-component {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    width: 100%;
    height: 100%;
    font-family: var(--mp-font-family, 'Inter', sans-serif);
    padding: 40px 80px;
    box-sizing: border-box;
  }

  .progress-label {
    font-size: 36px;
    font-weight: 700;
    color: var(--mp-color-text, #ffffff);
    margin-bottom: 32px;
    text-align: center;
  }

  .progress-label:empty {
    display: none;
  }

  .progress-track {
    width: 100%;
    max-width: 700px;
    height: 32px;
    background: var(--mp-color-surface, #1e293b);
    border-radius: 999px;
    overflow: hidden;
    position: relative;
  }

  .progress-fill {
    height: 100%;
    border-radius: 999px;
    width: 0%;
  }

  .progress-value {
    font-size: 48px;
    font-weight: 800;
    color: var(--mp-color-text, #ffffff);
    margin-top: 24px;
  }
</style>

<script>
  function createTimeline(el, data, ctx) {
    var tl = gsap.timeline();
    var fill = el.querySelector('.progress-fill');
    var valueEl = el.querySelector('.progress-value');
    var label = el.querySelector('.progress-label');
    var maxVal = data.max || 100;
    var val = Math.min(data.value || 0, maxVal);
    var pct = (val / maxVal) * 100;
    var color = data.color || 'var(--mp-color-primary, #6366f1)';

    fill.style.background = color;
    valueEl.textContent = '0%';

    var wrapper = el.querySelector('.progress-bar-component');
    gsap.set(wrapper, { autoAlpha: 0 });

    // Fade in
    tl.to(wrapper, { autoAlpha: 1, duration: 0.4, ease: 'power2.out' }, 0.2);

    // Fill bar
    var counter = { val: 0 };
    tl.to(fill, {
      width: pct + '%',
      duration: ctx.duration * 0.5,
      ease: 'power2.out'
    }, 0.5);

    tl.to(counter, {
      val: pct,
      duration: ctx.duration * 0.5,
      ease: 'power2.out',
      onUpdate: function() {
        valueEl.textContent = Math.round(counter.val) + '%';
      }
    }, 0.5);

    // Exit
    if (ctx.duration > 2) {
      tl.to(wrapper, {
        autoAlpha: 0,
        duration: 0.4,
        ease: 'power2.in'
      }, ctx.duration - 0.5);
    }

    return tl;
  }
</script>
