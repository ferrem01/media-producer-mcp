<template>
  <div class="progress-bar-component">

    <div class="progress-card">
      <div class="progress-track">
        <div class="progress-fill"></div>
      </div>
    </div>
    <div class="progress-value"></div>
  </div>
</template>

</style>

<script>
  function createTimeline(el, data, ctx) {
    var tl = gsap.timeline();
    var fill = el.querySelector('.progress-fill');
    var valueEl = el.querySelector('.progress-value');
    var label = el.querySelector('.progress-label');
    var card = el.querySelector('.progress-card');
    var maxVal = data.max || 100;
    var val = Math.min(data.value || 0, maxVal);
    var pct = (val / maxVal) * 100;
    var color = data.color || 'var(--mp-color-accent, #A78BFA)';

    fill.style.background = color;
    valueEl.textContent = '0%';

    var speed = ctx.motion === 'minimal' ? 0.4 : ctx.motion === 'punchy' ? 0.5 : 0.65;

    // Label entrance
    if (label && label.textContent.trim()) {
      gsap.set(label, { autoAlpha: 0, y: 20, filter: 'blur(4px)' });
      tl.to(label, { autoAlpha: 1, y: 0, filter: 'blur(0px)', duration: speed, ease: 'power3.out' }, 0.2);
    }

    // Card entrance
    gsap.set(card, { autoAlpha: 0, y: 30, scale: 1.05, filter: 'blur(4px)' });
    tl.to(card, {
      autoAlpha: 1, y: 0, scale: 1, filter: 'blur(0px)',
      duration: speed, ease: 'power3.out'
    }, 0.3);

    // Value entrance
    gsap.set(valueEl, { autoAlpha: 0, y: 15 });
    tl.to(valueEl, {
      autoAlpha: 1, y: 0,
      duration: 0.4, ease: 'power2.out'
    }, 0.4);

    // Fill bar + count up
    var counter = { val: 0 };
    var fillDuration = ctx.duration * 0.45;
    tl.to(fill, {
      width: pct + '%',
      duration: fillDuration,
      ease: 'power2.out'
    }, 0.6);

    tl.to(counter, {
      val: pct,
      duration: fillDuration,
      ease: 'power2.out',
      onUpdate: function() {
        valueEl.textContent = Math.round(counter.val) + '%';
      }
    }, 0.6);

    // Exit
    if (ctx.duration > 2) {
      var exitAt = ctx.duration - 0.6;
      tl.to(el.querySelector('.progress-bar-component'), {
        autoAlpha: 0,
        duration: 0.4,
        ease: 'power2.in'
      }, exitAt);
    }

    return tl;
  }
</script>
