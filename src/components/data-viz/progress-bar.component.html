    // Card entrance
    gsap.set(card, { autoAlpha: 0, y: 30, scale: 1.05, filter: 'blur(4px)' });
    tl.to(card, {
      autoAlpha: 1, y: 0, scale: 1, filter: 'blur(0px)',
      duration: speed, ease: 'power3.out'
    }, 0.3);

    // Value entrance
    gsap.set(valueEl, { autoAlpha: 0, y: 15 });
    tl.to(valueEl, {
      autoAlpha: 1, y: 0,
      duration: 0.4, ease: 'power2.out'

    // Fill bar + count up
    var counter = { val: 0 };
    var fillDuration = ctx.duration * 0.45;
    tl.to(fill, {
      width: pct + '%',
      duration: fillDuration,
      ease: 'power2.out'

    tl.to(counter, {
      val: pct,
      duration: fillDuration,
      ease: 'power2.out',
      onUpdate: function() {
        valueEl.textContent = Math.round(counter.val) + '%';
      }

    if (ctx.duration > 2) {
      var exitAt = ctx.duration - 0.6;
      tl.to(el.querySelector('.progress-bar-component'), {
        autoAlpha: 0,
        duration: 0.4,
        ease: 'power2.in'

      return (0.2126 * parseInt(h.slice(0, 2), 16) + 0.7152 * parseInt(h.slice(2, 4), 16) + 0.0722 * parseInt(h.slice(4, 6), 16)) / 255;
    };

    root.className = 'pb-alt';
    root.style.setProperty('--pb-ink', dark ? '#f4f4f8' : (cs.getPropertyValue('--mp-color-text').trim() || '#17171c'));
    root.style.setProperty('--pb-mute', dark ? 'rgba(244,244,248,0.62)' : 'rgba(23,23,28,0.56)');

      var D = Math.min(W * 0.8, H * (data.label ? 0.72 : 0.84));
      var SW = Math.max(6, D * 0.045), R = D / 2 - SW;
      var box = document.createElement('div'); box.className = 'pb-ring'; box.style.width = box.style.height = D + 'px'; root.appendChild(box);
      var svg = mk('svg', { width: D, height: D, viewBox: '0 0 ' + D + ' ' + D }, box);
      mk('circle', { cx: D / 2, cy: D / 2, r: R, fill: 'none', stroke: dark ? 'rgba(255,255,255,0.12)' : 'rgba(23,23,28,0.08)', 'stroke-width': SW }, svg);
      var arc = mk('circle', { cx: D / 2, cy: D / 2, r: R, fill: 'none', stroke: ACC, 'stroke-width': SW, 'stroke-linecap': 'round',

      var C = 2 * Math.PI * R;

      var big = document.createElement('div'); big.className = 'pb-big'; big.style.fontSize = Math.round(D * 0.26) + 'px'; inner.appendChild(big);

      if (data.label) { var cap = document.createElement('div'); cap.className = 'pb-cap'; cap.style.fontSize = Math.round(D * 0.08) + 'px'; cap.style.marginTop = Math.round(D * 0.06) + 'px'; cap.textContent = data.label; root.appendChild(cap); gsap.set(cap, { autoAlpha: 0, y: 10 }); tl.to(cap, { autoAlpha: 1, y: 0, duration: 0.45, ease: 'power3.out' }, AT); }

      var count = Math.round(mx);

      var GAP = SZ * 0.35, TW = count * SZ + (count - 1) * GAP;
      var head = document.createElement('div'); head.className = 'pb-big'; head.style.fontSize = Math.round(SZ * 1.3) + 'px'; head.style.marginBottom = Math.round(SZ * 0.25) + 'px';
      var dec2 = data.decimals !== undefined ? num(data.decimals, 1) : 1;
      head.textContent = (0).toFixed(dec2);

        var cx = x0 + SZ / 2, cy = SZ * 0.53, ro = SZ / 2, ri = ro * 0.46, d = '';
        for (var i = 0; i < 10; i++) { var a = -Math.PI / 2 + i * Math.PI / 5, r = i % 2 ? ri : ro; d += (i ? ' L ' : 'M ') + (cx + Math.cos(a) * r).toFixed(1) + ' ' + (cy + Math.sin(a) * r).toFixed(1); }
        return d + ' Z';
      };
      var GOLD = data.color || '#f5b301';
      var fillG = mk('g', { 'clip-path': 'url(#' + cid + ')' }, svg2);

      var fw = whole * (SZ + GAP) + part * SZ;
      if (data.label) { var cap2 = document.createElement('div'); cap2.className = 'pb-cap'; cap2.style.fontSize = Math.round(SZ * 0.42) + 'px'; cap2.style.marginTop = Math.round(SZ * 0.35) + 'px'; cap2.textContent = data.label; root.appendChild(cap2); gsap.set(cap2, { autoAlpha: 0, y: 10 }); tl.to(cap2, { autoAlpha: 1, y: 0, duration: 0.45, ease: 'power3.out' }, AT + 0.3); }
