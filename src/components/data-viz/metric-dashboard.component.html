<template>
  <div class="metric-dashboard">
    <div class="metrics-grid"></div>
  </div>
</template>

<style scoped>

<script>
  function createTimeline(el, data, ctx) {
    var tl = gsap.timeline();
    var grid = el.querySelector('.metrics-grid');
    var metrics = data.metrics || [];
    var cols = data.columns || Math.min(metrics.length, 3);
    grid.style.gridTemplateColumns = 'repeat(' + cols + ', 1fr)';

    metrics.forEach(function(m) {
      var card = document.createElement('div');
      card.className = 'metric-card';

      var info = document.createElement('div');
      info.className = 'metric-info';

      var valueDiv = document.createElement('div');
      valueDiv.className = 'metric-value';
      var prefix = m.prefix || '';
      var suffix = m.suffix || '';
      valueDiv.dataset.target = m.value;
      valueDiv.dataset.prefix = prefix;
      valueDiv.dataset.suffix = suffix;
      valueDiv.textContent = prefix + '0' + suffix;

      var labelRow = document.createElement('div');
      labelRow.className = 'metric-label-row';

      var labelDiv = document.createElement('div');
      labelDiv.className = 'metric-label';
      labelDiv.textContent = m.label;
      labelRow.appendChild(labelDiv);

      if (m.change !== undefined) {
        var changeDiv = document.createElement('div');
        changeDiv.className = 'metric-change ' + (m.change >= 0 ? 'positive' : 'negative');
        var arrow = document.createElement('span');
        arrow.className = 'trend-arrow';
        arrow.textContent = m.change >= 0 ? '▲' : '▼';
        changeDiv.appendChild(arrow);
        var changeText = document.createTextNode((m.change >= 0 ? '+' : '') + m.change + '%');
        changeDiv.appendChild(changeText);
        labelRow.appendChild(changeDiv);
      }

      info.appendChild(valueDiv);
      info.appendChild(labelRow);
      card.appendChild(info);

      // Mini sparkline
      if (m.chart_data && m.chart_data.length > 1) {
        var sparkWrap = document.createElement('div');
        sparkWrap.className = 'metric-sparkline-wrap';
        var svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
        svg.setAttribute('viewBox', '0 0 80 36');
        svg.setAttribute('preserveAspectRatio', 'none');

        var chartData = m.chart_data;
        var min = Math.min.apply(null, chartData);
        var max = Math.max.apply(null, chartData);
        var range = max - min || 1;
        var points = [];
        for (var p = 0; p < chartData.length; p++) {
          var x = (p / (chartData.length - 1)) * 80;
          var y = 34 - ((chartData[p] - min) / range) * 30;
          points.push(x + ',' + y);
        }

        var strokeColor = (m.change !== undefined && m.change < 0) ? '#f87171' : '#A78BFA';

        var fillPath = document.createElementNS('http://www.w3.org/2000/svg', 'path');
        fillPath.setAttribute('class', 'spark-fill');
        fillPath.setAttribute('d', 'M0,36 L' + points.join(' L') + ' L80,36 Z');
        fillPath.setAttribute('fill', strokeColor);
        svg.appendChild(fillPath);

        var linePath = document.createElementNS('http://www.w3.org/2000/svg', 'path');
        linePath.setAttribute('class', 'spark-line');
        linePath.setAttribute('d', 'M' + points.join(' L'));
        linePath.setAttribute('stroke', strokeColor);
        svg.appendChild(linePath);

        sparkWrap.appendChild(svg);
        card.appendChild(sparkWrap);
      }

      grid.appendChild(card);
    });

    var cards = grid.querySelectorAll('.metric-card');
    var valueEls = grid.querySelectorAll('.metric-value');

    // Scale + blur entrance
    gsap.set(cards, { autoAlpha: 0, y: 30, scale: 1.06, filter: 'blur(5px)' });

    var speed = ctx.motion === 'minimal' ? 0.35 : ctx.motion === 'punchy' ? 0.45 : 0.6;
    var stagger = ctx.motion === 'minimal' ? 0.08 : 0.12;

    // Stagger cards in
    tl.to(cards, {
      autoAlpha: 1, y: 0, scale: 1, filter: 'blur(0px)',
      duration: speed,
      stagger: stagger,
      ease: ctx.motion === 'punchy' ? 'back.out(1.2)' : 'power3.out'
    }, 0.3);

    // Count up numbers
    valueEls.forEach(function(ve, i) {
      var target = parseFloat(ve.dataset.target);
      var prefix = ve.dataset.prefix;
      var suffix = ve.dataset.suffix;
      var counter = { val: 0 };
      tl.to(counter, {
        val: target,
        duration: 0.9,
        ease: 'power2.out',
        onUpdate: function() {
          var display = target % 1 !== 0 ? counter.val.toFixed(1) : Math.round(counter.val);
          ve.textContent = prefix + display + suffix;
        }
      }, 0.5 + i * 0.1);
    });

    // Exit
    if (ctx.duration > 2) {
      var exitAt = ctx.duration - 0.7;
      tl.to(cards, {
        autoAlpha: 0, y: -15,
        duration: 0.4,
        stagger: 0.04,
        ease: 'power2.in'
      }, exitAt);
    }

    return tl;
  }
</script>
