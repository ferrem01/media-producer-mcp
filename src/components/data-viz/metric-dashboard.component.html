<template>
  <div class="metric-dashboard">
    <div class="metrics-grid"></div>
  </div>
</template>

<style scoped>
  .metric-dashboard {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 100%;
    height: 100%;
    font-family: var(--mp-font-family, 'Inter', system-ui, -apple-system, sans-serif);
    padding: 80px;
    box-sizing: border-box;
  }

  .metrics-grid {
    display: grid;
    gap: 20px;
    width: 100%;
    max-width: 1000px;
  }

  .metric-card {
    background: rgba(255, 255, 255, 0.03);
    border: 1px solid rgba(255, 255, 255, 0.06);
    border-radius: 16px;
    padding: 36px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    box-shadow:
      0 8px 32px rgba(0, 0, 0, 0.2),
      0 0 0 1px rgba(255, 255, 255, 0.03);
  }

  .metric-value {
    font-size: 52px;
    font-weight: 700;
    color: var(--mp-color-text, #ffffff);
    line-height: 1.1;
    letter-spacing: -0.02em;
    font-variant-numeric: tabular-nums;
    text-shadow:
      0 0 60px rgba(167, 139, 250, 0.2),
      0 0 20px rgba(167, 139, 250, 0.1);
  }

  .metric-label {
    font-size: 14px;
    font-weight: 600;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: #94a3b8;
    margin-top: 12px;
  }

  .metric-change {
    font-size: 14px;
    font-weight: 600;
    margin-top: 8px;
    letter-spacing: 0.02em;
  }

  .metric-change.positive {
    color: #34d399;
  }

  .metric-change.negative {
    color: #f87171;
  }
</style>

<script>
  function createTimeline(el, data, ctx) {
    var tl = gsap.timeline();
    var grid = el.querySelector('.metrics-grid');
    var metrics = data.metrics || [];
    var cols = data.columns || Math.min(metrics.length, 3);
    grid.style.gridTemplateColumns = 'repeat(' + cols + ', 1fr)';

    metrics.forEach(function(m) {
      var card = document.createElement('div');
      card.className = 'metric-card';

      var valueDiv = document.createElement('div');
      valueDiv.className = 'metric-value';
      var prefix = m.prefix || '';
      var suffix = m.suffix || '';
      valueDiv.dataset.target = m.value;
      valueDiv.dataset.prefix = prefix;
      valueDiv.dataset.suffix = suffix;
      valueDiv.textContent = prefix + '0' + suffix;

      var labelDiv = document.createElement('div');
      labelDiv.className = 'metric-label';
      labelDiv.textContent = m.label;

      card.appendChild(valueDiv);
      card.appendChild(labelDiv);

      if (m.change !== undefined) {
        var changeDiv = document.createElement('div');
        changeDiv.className = 'metric-change ' + (m.change >= 0 ? 'positive' : 'negative');
        changeDiv.textContent = (m.change >= 0 ? '+' : '') + m.change + '%';
        card.appendChild(changeDiv);
      }

      grid.appendChild(card);
    });

    var cards = grid.querySelectorAll('.metric-card');
    var valueEls = grid.querySelectorAll('.metric-value');

    // Scale + blur entrance
    gsap.set(cards, { autoAlpha: 0, y: 30, scale: 1.06, filter: 'blur(5px)' });

    var speed = ctx.motion === 'minimal' ? 0.35 : ctx.motion === 'punchy' ? 0.45 : 0.6;
    var stagger = ctx.motion === 'minimal' ? 0.08 : 0.12;

    // Stagger cards in
    tl.to(cards, {
      autoAlpha: 1, y: 0, scale: 1, filter: 'blur(0px)',
      duration: speed,
      stagger: stagger,
      ease: ctx.motion === 'punchy' ? 'back.out(1.2)' : 'power3.out'
    }, 0.3);

    // Subtle glow
    tl.to(cards, {
      boxShadow: '0 0 30px rgba(167, 139, 250, 0.05), 0 8px 32px rgba(0, 0, 0, 0.2), 0 0 0 1px rgba(255, 255, 255, 0.04)',
      duration: 0.4,
      stagger: stagger * 0.5
    }, '-=0.2');

    // Count up numbers
    valueEls.forEach(function(ve, i) {
      var target = parseFloat(ve.dataset.target);
      var prefix = ve.dataset.prefix;
      var suffix = ve.dataset.suffix;
      var counter = { val: 0 };
      tl.to(counter, {
        val: target,
        duration: 0.9,
        ease: 'power2.out',
        onUpdate: function() {
          var display = target % 1 !== 0 ? counter.val.toFixed(1) : Math.round(counter.val);
          ve.textContent = prefix + display + suffix;
        }
      }, 0.5 + i * 0.1);
    });

    // Exit
    if (ctx.duration > 2) {
      var exitAt = ctx.duration - 0.6;
      tl.to(cards, {
        autoAlpha: 0, y: -15,
        duration: 0.4,
        stagger: 0.04,
        ease: 'power2.in'
      }, exitAt);
    }

    return tl;
  }
</script>
