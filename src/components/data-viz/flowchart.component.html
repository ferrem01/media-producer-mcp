<template>
  <div class="fc-root">
    <div class="fc-stage">
      <svg class="fc-edges" xmlns="http://www.w3.org/2000/svg"></svg>
      <div class="fc-nodes"></div>
    </div>
  </div>
</template>

<style scoped>
  /* FLOWCHART: nodes laid out in layers (longest path from the roots),
     sized from the box so the type reads at video scale (the audit measured
     19px labels in fixed 180px boxes), built layer by layer: nodes rise,
     their connectors draw, the arrowhead lands when the line arrives (a
     marker-end showed the heads before the lines). Themed from the ground. */
  .fc-root, .fc-root * { max-width: none; }
  .fc-root { --u: 1px; position: absolute; inset: 0; box-sizing: border-box; padding: calc(var(--u) * 20);
    font-family: var(--mp-font-family, 'Inter', system-ui, sans-serif); }
  .fc-root.t-light { --n-bg: #ffffff; --n-ink: var(--mp-color-on-light, #17171c); --n-line: rgba(20, 20, 40, 0.10); --n-first: color-mix(in srgb, var(--mp-color-primary, #393bf5) 12%, #ffffff); --n-first-ink: color-mix(in srgb, var(--mp-color-primary, #393bf5) 78%, #000000); }
  .fc-root.t-dark { --n-bg: #1b1c24; --n-ink: #ffffff; --n-line: rgba(255, 255, 255, 0.12); --n-first: color-mix(in srgb, var(--mp-color-primary, #393bf5) 34%, #1b1c24); --n-first-ink: #ffffff; }
  .fc-stage { position: relative; width: 100%; height: 100%; }
  .fc-edges { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; pointer-events: none; }
  .fc-node {
    position: absolute; left: 0; top: 0; box-sizing: border-box;
    display: flex; align-items: center; justify-content: center; text-align: center;
    padding: calc(var(--u) * 16) calc(var(--u) * 24);
    border-radius: calc(var(--u) * 14);
    font-size: calc(var(--u) * 26); font-weight: 600; line-height: 1.2; letter-spacing: -0.01em;
    background: var(--n-bg); color: var(--n-ink); border: 1px solid var(--n-line);
    box-shadow: 0 calc(var(--u) * 2) calc(var(--u) * 5) rgba(20, 20, 60, 0.06), 0 calc(var(--u) * 10) calc(var(--u) * 26) rgba(20, 20, 60, 0.10);
  }
  .fc-node.first { background: var(--n-first); color: var(--n-first-ink); border-color: color-mix(in srgb, var(--mp-color-primary, #393bf5) 30%, transparent); }
  .fc-node.last { background: var(--mp-color-primary, #393bf5); color: var(--mp-color-on-primary, #ffffff); border-color: transparent;
    box-shadow: 0 calc(var(--u) * 10) calc(var(--u) * 26) color-mix(in srgb, var(--mp-color-primary, #393bf5) 30%, transparent); }
</style>

<script>
  function createTimeline(el, data, ctx) {
    var tl = gsap.timeline();
    var q = function (s) { return el.querySelector(s); };
    var root = q('.fc-root'), stage = q('.fc-stage'), svg = q('.fc-edges'), layer = q('.fc-nodes');
    var NS = 'http://www.w3.org/2000/svg';
    var DUR = (ctx && ctx.duration) || 5;

    var gl = window.mpGroundLum ? mpGroundLum() : null;
    var theme = data.theme === 'dark' || data.theme === 'light' ? data.theme : (typeof gl === 'number' && gl < 0.18 ? 'dark' : 'light');
    root.classList.add('t-' + theme);

    var nodes = (Array.isArray(data.nodes) && data.nodes.length ? data.nodes : [{ id: 'a', label: 'Start' }, { id: 'b', label: 'Process' }, { id: 'c', label: 'Done' }])
      .map(function (nd, i) { return { id: String(nd.id !== undefined ? nd.id : i), label: nd.label !== undefined ? String(nd.label) : String(nd.id), color: nd.color }; });
    var byId = {}; nodes.forEach(function (nd) { byId[nd.id] = nd; });
    // No edges: the nodes are a chain in the order given.
    var edges = (Array.isArray(data.edges) && data.edges.length ? data.edges : nodes.slice(1).map(function (nd, i) { return { from: nodes[i].id, to: nd.id }; }))
      .map(function (e) { return { from: String(e.from), to: String(e.to) }; })
      .filter(function (e) { return byId[e.from] && byId[e.to] && e.from !== e.to; });
    var dir = String(data.direction || 'horizontal').toLowerCase();
    var vertical = dir === 'vertical' || dir === 'tb' || dir === 'td' || dir === 'top-down' || dir === 'down';

    // ---- Layers: longest path from the roots (bounded, so a cycle cannot spin) ----
    var depth = {}; nodes.forEach(function (nd) { depth[nd.id] = 0; });
    for (var it = 0; it < nodes.length; it++) {
      edges.forEach(function (e) { if (depth[e.to] < depth[e.from] + 1 && depth[e.from] + 1 < nodes.length) depth[e.to] = depth[e.from] + 1; });
    }
    var L = 0; nodes.forEach(function (nd) { L = Math.max(L, depth[nd.id]); }); L += 1;
    var layers = []; for (var d = 0; d < L; d++) layers.push([]);
    nodes.forEach(function (nd) { layers[depth[nd.id]].push(nd); });
    // Order each layer by its parents' mean position (fewer crossings).
    for (var d2 = 1; d2 < L; d2++) {
      var prevIdx = {}; layers[d2 - 1].forEach(function (nd, i) { prevIdx[nd.id] = i / Math.max(1, layers[d2 - 1].length - 1); });
      layers[d2].forEach(function (nd, i) {
        var ps = edges.filter(function (e) { return e.to === nd.id && prevIdx[e.from] !== undefined; }).map(function (e) { return prevIdx[e.from]; });
        nd._k = ps.length ? ps.reduce(function (a, b) { return a + b; }, 0) / ps.length : i / Math.max(1, layers[d2].length);
      });
      layers[d2].sort(function (a, b) { return a._k - b._k; });
    }
    var C = Math.max.apply(null, layers.map(function (l) { return l.length; }));

    // ---- Node DOM ----
    function chipInk(hex) {
      var m = /^#?([0-9a-f]{6})$/i.exec(String(hex || '').trim());
      if (!m) return null;
      var v = parseInt(m[1], 16);
      function lin(c) { var s = c / 255; return s <= 0.03928 ? s / 12.92 : Math.pow((s + 0.055) / 1.055, 2.4); }
      var lum = 0.2126 * lin(v >> 16 & 255) + 0.7152 * lin(v >> 8 & 255) + 0.0722 * lin(v & 255);
      return lum < 0.18 ? '#ffffff' : '#111318';
    }
    nodes.forEach(function (nd) {
      var b = document.createElement('div'); b.className = 'fc-node';
      if (L > 1 && depth[nd.id] === 0) b.classList.add('first');
      if (L > 1 && depth[nd.id] === L - 1) b.classList.add('last');
      b.textContent = nd.label;
      var ink = nd.color ? chipInk(nd.color) : null;
      if (ink) { b.classList.remove('first', 'last'); b.style.background = nd.color; b.style.color = ink; b.style.borderColor = 'rgba(0,0,0,0.08)'; }
      layer.appendChild(b); nd.el = b;
    });

    // ---- SIZE: cells from the box; type from the cells; shrink until every
    // node fits its cell (labels wrap within the cell's width). ----
    var SW = stage.clientWidth || 900, SH = stage.clientHeight || 600;
    // Lay out inside what is SEEN: a full-frame slot overhangs the frame
    // (measured: the first node of a chain 19px from the edge).
    var rc = stage.getBoundingClientRect(), sc = rc.width / SW || 1;
    var ox = Math.max(0, -rc.left, rc.right - window.innerWidth) / sc + SW * 0.015, oy = Math.max(0, -rc.top, rc.bottom - window.innerHeight) / sc + SH * 0.015;
    var W = SW - 2 * ox, H = SH - 2 * oy;
    var mainLen = vertical ? H : W, crossLen = vertical ? W : H;
    var cellMain = mainLen / L, cellCross = crossLen / C;
    var maxW = vertical ? cellCross * 0.86 : cellMain * 0.8, maxH = vertical ? cellMain * 0.62 : cellCross * 0.72;
    nodes.forEach(function (nd) { nd.el.style.maxWidth = maxW + 'px'; });
    // Labels stay on one line while the type can stay above ~70% of its
    // start (measured: "Follow-up" split at its hyphen, "Wait 2 / Days"
    // wrapped); past that they wrap inside the cell.
    var u0 = Math.min(maxW / 200, maxH / 60), u = u0;
    function fitAt(wrap) {
      nodes.forEach(function (nd) { nd.el.style.whiteSpace = wrap ? 'normal' : 'nowrap'; });
      for (var i2 = 0; i2 < 40; i2++) {
        root.style.setProperty('--u', u.toFixed(3) + 'px');
        var fits = nodes.every(function (nd) { return nd.el.offsetHeight <= maxH && nd.el.offsetWidth <= maxW + 1 && nd.el.scrollWidth <= nd.el.clientWidth + 1; });
        if (fits) return true;
        if (!wrap && u < u0 * 0.7) return false;
        u *= 0.95;
      }
      return false;
    }
    if (!fitAt(false)) { u = u0; fitAt(true); }
    // One width per layer (a ragged column reads as a mistake).
    layers.forEach(function (l) {
      var w = Math.max.apply(null, l.map(function (nd) { return nd.el.offsetWidth; }));
      if (!vertical) l.forEach(function (nd) { nd.el.style.width = w + 'px'; });
    });
    if (vertical) { var wAll = Math.max.apply(null, nodes.map(function (nd) { return nd.el.offsetWidth; })); nodes.forEach(function (nd) { nd.el.style.width = Math.min(wAll, maxW) + 'px'; }); }
    layers.forEach(function (l, d) {
      l.forEach(function (nd, gi) {
        var m = (d + 0.5) * cellMain, c = (gi + 0.5) * (crossLen / l.length);
        nd.x = ox + (vertical ? c : m); nd.y = oy + (vertical ? m : c);
        nd.w = nd.el.offsetWidth; nd.h = nd.el.offsetHeight;
        nd.el.style.left = (nd.x - nd.w / 2) + 'px'; nd.el.style.top = (nd.y - nd.h / 2) + 'px';
      });
    });

    // ---- Edges: from the node's edge to the next node's edge, a curve along
    // the flow axis; the arrowhead is its own shape, landing when the line does. ----
    svg.setAttribute('viewBox', '0 0 ' + SW + ' ' + SH);
    var stroke = data.edge_color || 'color-mix(in srgb, var(--mp-color-primary, #393bf5) 75%, transparent)';
    var sw = Math.max(2, u * 3), head = Math.max(8, u * 12);
    var drawn = edges.map(function (e) {
      var a = byId[e.from], b = byId[e.to];
      var fwd = vertical ? b.y >= a.y : b.x >= a.x, s = fwd ? 1 : -1;
      var sx = vertical ? a.x : a.x + s * a.w / 2, sy = vertical ? a.y + s * a.h / 2 : a.y;
      var ex = vertical ? b.x : b.x - s * (b.w / 2 + head * 0.9), ey = vertical ? b.y - s * (b.h / 2 + head * 0.9) : b.y;
      var mid = vertical ? (sy + ey) / 2 : (sx + ex) / 2;
      var dStr = vertical ? 'M' + sx + ' ' + sy + ' C' + sx + ' ' + mid + ' ' + ex + ' ' + mid + ' ' + ex + ' ' + ey
        : 'M' + sx + ' ' + sy + ' C' + mid + ' ' + sy + ' ' + mid + ' ' + ey + ' ' + ex + ' ' + ey;
      var p = document.createElementNS(NS, 'path');
      p.setAttribute('d', dStr); p.setAttribute('fill', 'none'); p.setAttribute('stroke-width', sw); p.setAttribute('stroke-linecap', 'round');
      p.style.stroke = stroke;
      svg.appendChild(p);
      var len = p.getTotalLength ? p.getTotalLength() : 300;
      p.style.strokeDasharray = len; p.style.strokeDashoffset = len;
      // The head points along the flow axis (the curve ends tangent to it).
      var ang = vertical ? (s > 0 ? 90 : -90) : (s > 0 ? 0 : 180);
      var hd = document.createElementNS(NS, 'path');
      hd.setAttribute('d', 'M0 ' + (-head / 2) + ' L' + head + ' 0 L0 ' + (head / 2) + ' Z');
      hd.setAttribute('transform', 'translate(' + ex + ' ' + ey + ') rotate(' + ang + ')');
      hd.style.fill = stroke;
      svg.appendChild(hd);
      return { e: e, path: p, head: hd, len: len };
    });

    // ---- MOTION: layer by layer, built by ~60% of the scene ----
    var AT = Number(data.at) || 0.2;
    var step = Math.max(0.18, Math.min(0.6, (DUR * 0.6 - AT - 0.5) / L));
    layers.forEach(function (l, d) {
      var t = AT + d * step;
      l.forEach(function (nd, k) {
        gsap.set(nd.el, { autoAlpha: 0, y: 12 });
        tl.to(nd.el, { autoAlpha: 1, y: 0, duration: 0.4, ease: 'power3.out' }, t + k * 0.05);
      });
      drawn.filter(function (x) { return depth[x.e.from] === d; }).forEach(function (x) {
        var draw = Math.max(0.2, step * 0.8);
        tl.to(x.path.style, { strokeDashoffset: 0, duration: draw, ease: 'power2.inOut' }, t + 0.25);
        gsap.set(x.head, { autoAlpha: 0 });
        tl.to(x.head, { autoAlpha: 1, duration: 0.12, ease: 'none' }, t + 0.25 + draw - 0.08);
      });
    });
    // FLOW: an optional dot running each connector once the chart is built.
    if (data.flow === true) {
      var start = AT + L * step + 0.2;
      drawn.forEach(function (x, i) {
        var dot = document.createElementNS(NS, 'circle'); dot.setAttribute('r', Math.max(4, u * 6)); dot.style.fill = 'var(--mp-color-primary, #393bf5)';
        svg.appendChild(dot);
        var st = { p: 0 };
        var put = function () { var pt = x.path.getPointAtLength(st.p * x.len); dot.setAttribute('cx', pt.x); dot.setAttribute('cy', pt.y); dot.style.opacity = st.p > 0 && st.p < 1 ? 1 : 0; };
        put();
        tl.to(st, { p: 1, duration: 1.1, ease: 'power1.inOut', repeat: Math.max(0, Math.floor((DUR - start) / 1.6) - 1), repeatDelay: 0.5, onUpdate: put }, start + (i % 3) * 0.2);
      });
    }
    if (data.exit === true && DUR > 2) tl.to(stage, { autoAlpha: 0, duration: 0.4, ease: 'power2.in' }, DUR - 0.5);
    return tl;
  }
</script>
