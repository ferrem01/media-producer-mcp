<template>
  <div class="lc-root">
    <div class="lc-head">
      <div class="lc-title"></div>
      <div class="lc-sub"></div>
    </div>
    <div class="lc-plot"><svg class="lc-svg" xmlns="http://www.w3.org/2000/svg"></svg></div>
    <div class="lc-legend"></div>
  </div>
</template>

<style scoped>
  /* LINE CHART: a trend told as a draw. Gridlines settle, each series draws
     left to right with its area wiping in under it, a dot rides the tip
     carrying the running value, and the final value lands big at the end.
     Several series get a legend; a highlight marks the moment that matters.
     Drawn in real pixels (type sized for video), themed from the ground. */
  .lc-root, .lc-root * { max-width: none; }
  .lc-root { position: absolute; inset: 0; display: flex; flex-direction: column; padding: 3.5% 4%;
    font-family: var(--mp-font-family, 'Inter', system-ui, sans-serif); color: var(--lc-ink); }
  .lc-head { flex: none; margin-bottom: 1.5%; }
  .lc-title { font-size: var(--lc-title, 40px); font-weight: 700; letter-spacing: -0.02em; line-height: 1.1; }
  .lc-sub { font-size: var(--lc-small, 20px); color: var(--lc-mute); margin-top: 6px; }
  .lc-title:empty, .lc-sub:empty { display: none; }
  .lc-plot { flex: 1; position: relative; min-height: 0; }
  .lc-svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
  .lc-svg text { font-family: var(--mp-font-family, 'Inter', system-ui, sans-serif); }
  .lc-legend { flex: none; display: flex; gap: 28px; justify-content: center; margin-top: 1.2%; font-size: var(--lc-small, 20px); font-weight: 600; }
  .lc-legend:empty { display: none; }
  .lc-key { display: inline-flex; align-items: center; gap: 10px; }
  .lc-key i { display: inline-block; width: 22px; height: 6px; border-radius: 3px; }
</style>

<script>
  function createTimeline(el, data, ctx) {
    var tl = gsap.timeline();
    data = data || {};
    ctx = ctx || {};
    var DUR = ctx.duration || 5;
    var num = function (v, d) { var n = Number(v); return (v === null || v === undefined || v === '' || !isFinite(n)) ? d : n; };
    var root = el.querySelector('.lc-root'), svg = el.querySelector('.lc-svg'), plot = el.querySelector('.lc-plot');
    var NS = 'http://www.w3.org/2000/svg';
    var cs = getComputedStyle(el);

    // ---- Ground: ink follows the brand's background, unless told ----
    var lum = function (c) {
      var m = String(c || '').trim().match(/^#([0-9a-f]{3}|[0-9a-f]{6})$/i);
      if (!m) return null;
      var h = m[1].length === 3 ? m[1].replace(/./g, '$&$&') : m[1];
      return (0.2126 * parseInt(h.slice(0, 2), 16) + 0.7152 * parseInt(h.slice(2, 4), 16) + 0.0722 * parseInt(h.slice(4, 6), 16)) / 255;
    };
    var g = lum(cs.getPropertyValue('--mp-color-background'));
    var dark = data.theme === 'dark' || (data.theme !== 'light' && g !== null && g < 0.45);
    var INK = data.text_color || (dark ? '#f4f4f8' : (cs.getPropertyValue('--mp-color-text').trim() || '#17171c'));
    root.style.setProperty('--lc-ink', INK);
    root.style.setProperty('--lc-mute', dark ? 'rgba(244,244,248,0.6)' : 'rgba(23,23,28,0.55)');
    var GRID = dark ? 'rgba(255,255,255,0.1)' : 'rgba(23,23,28,0.08)';
    var PRIMARY = cs.getPropertyValue('--mp-color-primary').trim() || '#393bf5';
    var PALETTE = [PRIMARY, cs.getPropertyValue('--mp-color-secondary').trim() || '#e8590c', '#12a594', '#b45cf0'];

    // ---- Data: series[], or the legacy single points[] ----
    var series = Array.isArray(data.series) && data.series.length ? data.series
      : [{ name: '', points: Array.isArray(data.points) ? data.points : [], color: data.color }];
    series = series.filter(function (s) { return s && Array.isArray(s.points) && s.points.length >= 2; }).slice(0, 4);
    if (!series.length) return tl;
    var cats = Array.isArray(data.x_labels) ? data.x_labels.map(String) : null;
    var n = Math.max.apply(null, series.map(function (s) { return s.points.length; }));
    if (!cats) cats = series[0].points.map(function (p, i) { return p && p.label !== undefined ? String(p.label) : (p && p.x !== undefined ? String(p.x) : String(i + 1)); });
    var yOf = function (p) { return typeof p === 'number' ? p : num(p && p.y, 0); };
    var all = []; series.forEach(function (s) { s.points.forEach(function (p) { all.push(yOf(p)); }); });
    var lo = Math.min.apply(null, all), hi = Math.max.apply(null, all);
    if (data.y_min !== undefined) lo = num(data.y_min, lo); else lo = Math.min(0, lo);

    // Nice ticks: 4-5 round steps.
    var span = (hi - lo) || 1, raw = span / 4, mag = Math.pow(10, Math.floor(Math.log10(raw)));
    var step = [1, 2, 2.5, 5, 10].map(function (k) { return k * mag; }).filter(function (s) { return s >= raw; })[0] || raw;
    var top = Math.ceil(hi / step) * step, bot = Math.floor(lo / step) * step;
    var PRE = data.prefix || '', SUF = data.suffix || (data.format === 'percent' ? '%' : '');
    var fmt = function (v) {
      var a = Math.abs(v), s;
      if (data.compact !== false && a >= 1e6) s = (v / 1e6).toFixed(a >= 1e7 ? 0 : 1).replace(/\.0$/, '') + 'M';
      else if (data.compact !== false && a >= 1e4) s = (v / 1e3).toFixed(a >= 1e5 ? 0 : 1).replace(/\.0$/, '') + 'K';
      else s = (Math.round(v * 10) / 10).toLocaleString('en-US');
      return PRE + s + SUF;
    };

    // ---- Real pixels ----
    el.querySelector('.lc-title').textContent = data.title || '';
    el.querySelector('.lc-sub').textContent = data.subtitle || '';
    var W0 = el.clientWidth || 1600, H0 = el.clientHeight || 900;
    var T = Math.max(0.6, Math.min(W0, H0 * 1.6) / 1600);
    root.style.setProperty('--lc-title', Math.round(44 * T) + 'px');
    root.style.setProperty('--lc-small', Math.round(21 * T) + 'px');
    var legend = el.querySelector('.lc-legend');
    if (series.length > 1) series.forEach(function (s, i) {
      var k = document.createElement('span'); k.className = 'lc-key';
      k.innerHTML = '<i></i>'; k.firstChild.style.background = s.color || PALETTE[i % PALETTE.length];
      k.appendChild(document.createTextNode(s.name || ('Series ' + (i + 1))));
      legend.appendChild(k);
    });
    var PW = plot.clientWidth || W0 * 0.9, PH = plot.clientHeight || H0 * 0.7;
    svg.setAttribute('viewBox', '0 0 ' + PW + ' ' + PH);
    var FS = Math.round(20 * T);
    var L = Math.round(FS * 3.4), R = Math.round(FS * 4.2), TOP = Math.round(FS * 1.6), B = Math.round(FS * 2.2);
    var X = function (i) { return L + (n > 1 ? i / (n - 1) : 0) * (PW - L - R); };
    var Y = function (v) { return TOP + (1 - (v - bot) / ((top - bot) || 1)) * (PH - TOP - B); };
    var mk = function (tag, attrs, parent) { var e = document.createElementNS(NS, tag); for (var k in attrs) e.setAttribute(k, attrs[k]); (parent || svg).appendChild(e); return e; };

    // ---- Grid + axes ----
    var gridG = mk('g', {});
    for (var v = bot; v <= top + step / 2; v += step) {
      mk('line', { x1: L, x2: PW - R, y1: Y(v), y2: Y(v), stroke: GRID, 'stroke-width': Math.max(1, T * 1.2) }, gridG);
      var tx = mk('text', { x: L - FS * 0.6, y: Y(v) + FS * 0.35, 'text-anchor': 'end', 'font-size': FS, fill: dark ? 'rgba(244,244,248,0.55)' : 'rgba(23,23,28,0.5)' }, gridG);
      tx.textContent = fmt(v);
    }
    var every = Math.max(1, Math.ceil(n / 8));
    cats.forEach(function (c, i) {
      if (i % every && i !== n - 1) return;
      var t2 = mk('text', { x: X(i), y: PH - B + FS * 1.5, 'text-anchor': 'middle', 'font-size': FS, fill: dark ? 'rgba(244,244,248,0.55)' : 'rgba(23,23,28,0.5)' }, gridG);
      t2.textContent = c;
    });
    gsap.set(gridG, { autoAlpha: 0 });
    var AT = num(data.at, 0.3);
    tl.to(gridG, { autoAlpha: 1, duration: 0.5, ease: 'power1.out' }, AT);

    // ---- Series: draw, area wipe, riding dot, final value ----
    window.__lcN = (window.__lcN || 0) + 1;
    var uid = 'lc' + window.__lcN;
    var defs = mk('defs', {});
    var DRAW = Math.min(num(data.draw, 1.6), Math.max(0.6, DUR * 0.45));
    series.forEach(function (s, si) {
      var col = s.color || PALETTE[si % PALETTE.length];
      var pts = s.points.map(function (p, i) { return { x: X(i), y: Y(yOf(p)), v: yOf(p) }; });
      // A gentle monotone curve through the points (Catmull-Rom, clamped).
      var d = 'M ' + pts[0].x.toFixed(1) + ' ' + pts[0].y.toFixed(1);
      for (var i = 0; i < pts.length - 1; i++) {
        var p0 = pts[Math.max(0, i - 1)], p1 = pts[i], p2 = pts[i + 1], p3 = pts[Math.min(pts.length - 1, i + 2)];
        var c1x = p1.x + (p2.x - p0.x) / 6, c1y = p1.y + (p2.y - p0.y) / 6, c2x = p2.x - (p3.x - p1.x) / 6, c2y = p2.y - (p3.y - p1.y) / 6;
        var ylo = Math.min(p1.y, p2.y), yhi = Math.max(p1.y, p2.y);
        c1y = Math.max(ylo, Math.min(yhi, c1y)); c2y = Math.max(ylo, Math.min(yhi, c2y));
        d += ' C ' + c1x.toFixed(1) + ' ' + c1y.toFixed(1) + ', ' + c2x.toFixed(1) + ' ' + c2y.toFixed(1) + ', ' + p2.x.toFixed(1) + ' ' + p2.y.toFixed(1);
      }
      var start = AT + 0.35 + si * 0.35;
      // Area: a gradient fill revealed by a clip that tracks the draw.
      var gr = mk('linearGradient', { id: uid + 'g' + si, x1: 0, y1: 0, x2: 0, y2: 1 }, defs);
      mk('stop', { offset: '0%', 'stop-color': col, 'stop-opacity': series.length > 1 ? 0.12 : 0.22 }, gr);
      mk('stop', { offset: '100%', 'stop-color': col, 'stop-opacity': 0 }, gr);
      var cp = mk('clipPath', { id: uid + 'c' + si }, defs);
      var clipRect = mk('rect', { x: L, y: 0, width: 0, height: PH }, cp);
      if (data.area !== false) {
        var area = mk('path', { d: d + ' L ' + pts[pts.length - 1].x.toFixed(1) + ' ' + Y(bot).toFixed(1) + ' L ' + pts[0].x.toFixed(1) + ' ' + Y(bot).toFixed(1) + ' Z',
          fill: 'url(#' + uid + 'g' + si + ')', 'clip-path': 'url(#' + uid + 'c' + si + ')' });
      }
      var line = mk('path', { d: d, fill: 'none', stroke: col, 'stroke-width': Math.max(3, 5 * T), 'stroke-linecap': 'round', 'stroke-linejoin': 'round' });
      var len = line.getTotalLength ? line.getTotalLength() : 1000;
      gsap.set(line, { strokeDasharray: len + 2, strokeDashoffset: len + 2 });
      tl.to(line, { strokeDashoffset: 0, duration: DRAW, ease: 'power2.inOut' }, start);
      tl.to(clipRect, { attr: { width: PW - L - R + 2 }, duration: DRAW, ease: 'power2.inOut' }, start);
      // The riding dot: keyframed along the drawn curve with the same ease,
      // so it sits on the tip at every seek.
      var dot = mk('circle', { r: Math.max(5, 8 * T), fill: col, stroke: dark ? '#0b0b12' : '#ffffff', 'stroke-width': Math.max(2, 3 * T) });
      var K = 40, kf = [];
      for (var k = 0; k <= K; k++) { var pt = line.getPointAtLength(len * k / K); kf.push({ cx: pt.x, cy: pt.y }); }
      gsap.set(dot, { attr: kf[0], autoAlpha: 0 });
      tl.set(dot, { autoAlpha: 1 }, start);
      var prog = { t: 0 };
      tl.to(prog, { t: 1, duration: DRAW, ease: 'power2.inOut',
        onUpdate: function () { var f = prog.t * K, a = Math.floor(f), b = Math.min(K, a + 1), u = f - a; dot.setAttribute('cx', kf[a].cx + (kf[b].cx - kf[a].cx) * u); dot.setAttribute('cy', kf[a].cy + (kf[b].cy - kf[a].cy) * u); } }, start);
      // The last value lands big beside the end of the line.
      var last = pts[pts.length - 1];
      var endLabel = mk('text', { x: last.x + FS * 0.8, y: last.y + FS * 0.45, 'font-size': Math.round(FS * 1.5), 'font-weight': 800, fill: col });
      endLabel.textContent = fmt(last.v);
      gsap.set(endLabel, { autoAlpha: 0, x: -8 });
      tl.to(endLabel, { autoAlpha: 1, x: 0, duration: 0.35, ease: 'power2.out' }, start + DRAW - 0.1);
    });

    // ---- Highlight: the moment that matters ----
    var hl = data.highlight;
    if (hl && hl.index !== undefined || hl && hl.label) {
      var hi2 = hl.index !== undefined ? Math.max(0, Math.min(n - 1, Math.round(num(hl.index, n - 1)))) : Math.max(0, cats.indexOf(String(hl.label)));
      var hx = X(hi2), hv = yOf(series[0].points[hi2]), hy = Y(hv);
      var hg = mk('g', {});
      mk('line', { x1: hx, x2: hx, y1: TOP, y2: PH - B, stroke: PRIMARY, 'stroke-width': Math.max(1.5, 2 * T), 'stroke-dasharray': (6 * T) + ' ' + (6 * T) }, hg);
      var pillText = String(hl.text || fmt(hv));
      var pw = pillText.length * FS * 0.62 + FS * 1.4, ph = FS * 1.9;
      var px = Math.max(L, Math.min(PW - R - pw, hx - pw / 2)), py = Math.max(0, hy - ph - FS * 1.2);
      mk('rect', { x: px, y: py, width: pw, height: ph, rx: ph / 2, fill: PRIMARY }, hg);
      var ht = mk('text', { x: px + pw / 2, y: py + ph * 0.66, 'text-anchor': 'middle', 'font-size': FS, 'font-weight': 700, fill: '#ffffff' }, hg);
      ht.textContent = pillText;
      gsap.set(hg, { autoAlpha: 0, y: 10 });
      var hAt = hl.at !== undefined ? num(hl.at, DUR - 1.5) : AT + 0.35 + DRAW + 0.2;
      tl.to(hg, { autoAlpha: 1, y: 0, duration: 0.35, ease: 'back.out(2)' }, hAt);
    }

    gsap.set([el.querySelector('.lc-head'), legend], { autoAlpha: 0, y: 12 });
    tl.to([el.querySelector('.lc-head'), legend], { autoAlpha: 1, y: 0, duration: 0.5, ease: 'power3.out', stagger: 0.1 }, Math.max(0, AT - 0.2));
    if (DUR > 2.5 && data.exit !== false) tl.to(root, { autoAlpha: 0, duration: 0.4, ease: 'power2.in' }, DUR - 0.5);
    return tl;
  }
</script>
