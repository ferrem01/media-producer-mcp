    color: var(--mp-color-on-primary, #ffffff);

  /* When a bar is too short to hold its number, the value sits OUTSIDE it --

<script>
  function createTimeline(el, data, ctx) {
    var tl = gsap.timeline();
    var root = el.querySelector('.funnel-chart') || el;
    var card = el.querySelector('.funnel-card');
    var rowsEl = el.querySelector('.funnel-rows');
    var title = el.querySelector('.funnel-title');
    var stages = data.stages || [];
    if (!stages.length) return tl;

    // WHICH WORLD ARE WE ON? The assembler sets --mp-color-text to #ffffff
    // on a dark scene and to the brand's ink on a light one, so the ink's
    // own luminance is the answer -- no schema slot, no guessing from the
    // backdrop component (the plain world has none).
    (function () {
      var ink = getComputedStyle(root).getPropertyValue('--mp-color-text').trim();
      var rgb = window.mpParseColor ? mpParseColor(ink) : null;
      if (!rgb) {
        var m6 = /^#([0-9a-f]{2})([0-9a-f]{2})([0-9a-f]{2})$/i.exec(ink);
        var m3 = /^#([0-9a-f])([0-9a-f])([0-9a-f])$/i.exec(ink);
        var mr = /rgba?\(\s*(\d+)[\s,]+(\d+)[\s,]+(\d+)/.exec(ink);
        if (m6) rgb = { r: parseInt(m6[1], 16), g: parseInt(m6[2], 16), b: parseInt(m6[3], 16) };
        else if (m3) rgb = { r: parseInt(m3[1] + m3[1], 16), g: parseInt(m3[2] + m3[2], 16), b: parseInt(m3[3] + m3[3], 16) };
        else if (mr) rgb = { r: +mr[1], g: +mr[2], b: +mr[3] };
      }
      if (!rgb) return;
      // Dark ink means a light ground.
      if (0.2126 * rgb.r + 0.7152 * rgb.g + 0.0722 * rgb.b < 140) root.classList.add('is-light');
    })();

    var maxVal = Math.max.apply(null, stages.map(function (s) { return Number(s.value) || 0; })) || 1;

    // ── THE FUNNEL IS ONE HUE, RAMPED BY DEPTH ──
    // The old ramp walked the whole palette (secondary -> primary -> accent
    // -> pink -> amber). On a real brand kit that renders as five unrelated
    // bars -- orange, blue, near-black, pink -- when what the chart means is
    // ONE audience narrowing. Stages now tint the brand primary from light
    // at the mouth to deep at the money row, so the color itself carries the
    // narrowing. The light end stops at 18% toward white because the value
    // rides ON the bar in white: past that it drops under 4.5:1.
    var brandPrimary = (function () {
      var raw = getComputedStyle(root).getPropertyValue('--mp-color-primary').trim();
      var rgb = window.mpParseColor ? mpParseColor(raw) : null;
      if (!rgb) {
        var m = /^#([0-9a-f]{2})([0-9a-f]{2})([0-9a-f]{2})$/i.exec(raw);
        if (m) rgb = { r: parseInt(m[1], 16), g: parseInt(m[2], 16), b: parseInt(m[3], 16) };
      }
      return rgb || { r: 99, g: 102, b: 241 };
    })();
    function rampStop(f) {
      // f in [0,1]: 0 = mouth (lightened 18% toward white), 1 = money row
      // (deepened 40% toward ink). Linear in between.
      var t = -0.18 + f * 0.58;
      var mixR, mixG, mixB, k;
      if (t < 0) { k = -t; mixR = 255; mixG = 255; mixB = 255; }
      else { k = t; mixR = 11; mixG = 11; mixB = 46; }
      return 'rgb(' + Math.round(brandPrimary.r * (1 - k) + mixR * k) + ',' +
        Math.round(brandPrimary.g * (1 - k) + mixG * k) + ',' +
        Math.round(brandPrimary.b * (1 - k) + mixB * k) + ')';
    }

    var showRetention = data.show_retention !== false;
    var counters = [];

    stages.forEach(function (stage, i) {
      var row = document.createElement('div');
      row.className = 'funnel-row' + (i === stages.length - 1 ? ' is-money' : '');

      var label = document.createElement('div');
      label.className = 'funnel-label';
      label.textContent = stage.label || '';

      var track = document.createElement('div');
      track.className = 'funnel-track';

      var bar = document.createElement('div');
      bar.className = 'funnel-bar';
      var span = Math.max(1, stages.length - 1);
      bar.style.background = stage.color
        ? 'linear-gradient(180deg, ' + stage.color + ' 0%, ' + stage.color + 'cc 100%)'
        : 'linear-gradient(90deg, ' + rampStop(i / span) + ' 0%, ' + rampStop(Math.min(1, (i + 0.6) / span)) + ' 100%)';
      var val = Number(stage.value) || 0;
      var pct = Math.max(4, (val / maxVal) * 100);
      bar.style.width = '0%';
      bar.dataset.targetWidth = pct + '%';

      var value = document.createElement('div');
      value.className = 'funnel-value' + (pct < 22 ? ' outside' : '');
      value.textContent = '0';

      var retention = document.createElement('div');
      retention.className = 'funnel-retention';
      if (showRetention && i > 0) {
        var prev = Number(stages[i - 1].value) || 0;
        var r = stage.retention != null
          ? stage.retention
          : (prev > 0 ? Math.round((val / prev) * 100) + '%' : '');
        retention.textContent = r ? String(r) : '';
      }

      // Outside values anchor to the bar's right edge, so they ride the draw.
      bar.appendChild(value);
      track.appendChild(bar);
      row.appendChild(label);
      row.appendChild(track);
      row.appendChild(retention);
      rowsEl.appendChild(row);

      counters.push({ el: value, to: val, display: stage.display, bar: bar, retention: retention, row: row });
    });

    var rows = rowsEl.querySelectorAll('.funnel-row');
    var labels = rowsEl.querySelectorAll('.funnel-label');
    var retentions = rowsEl.querySelectorAll('.funnel-retention');

    gsap.set(labels, { autoAlpha: 0, x: -10 });
    gsap.set(retentions, { autoAlpha: 0, scale: 0.7 });

    // Title entrance
    if (title && title.textContent.trim()) {
      gsap.set(title, { autoAlpha: 0, y: 20, filter: 'blur(4px)' });
      tl.to(title, { autoAlpha: 1, y: 0, filter: 'blur(0px)', duration: 0.5, ease: 'power3.out' }, 0.2);
    }

    // Card entrance
    gsap.set(card, { autoAlpha: 0, y: 30, scale: 1.05, filter: 'blur(4px)' });
    tl.to(card, {
      autoAlpha: 1, y: 0, scale: 1, filter: 'blur(0px)',
      duration: 0.6, ease: 'power3.out'
    }, 0.3);

    // Rows draw top-to-bottom: label in, bar sweeps, number rides the count,
    // then the retention badge pops. The last stage (the money number) lands
    // with a touch more drama.
    var step = ctx.motion === 'minimal' ? 0.22 : 0.34;
    counters.forEach(function (c, i) {
      var at = 0.7 + i * step;
      var isMoney = i === counters.length - 1;
      var drawDur = isMoney ? 0.85 : 0.65;

      tl.to(labels[i], { autoAlpha: 1, x: 0, duration: 0.3, ease: 'power2.out' }, at);
      tl.to(c.bar, {
        width: c.bar.dataset.targetWidth,
        duration: drawDur,
        ease: isMoney ? 'power4.out' : 'power3.out'
      }, at + 0.05);

      var prox = { n: 0 };
      tl.to(prox, {
        n: c.to, duration: drawDur, ease: 'power2.out',
        onUpdate: function () {
          c.el.textContent = c.display != null && prox.n >= c.to
            ? String(c.display)
            : Math.round(prox.n).toLocaleString('en-US');
        }
      }, at + 0.05);

      if (c.retention.textContent) {
        tl.to(retentions[i], { autoAlpha: 1, scale: 1, duration: 0.3, ease: 'back.out(2)' }, at + drawDur * 0.8);
      }
      if (isMoney) {
        tl.fromTo(c.row, { scale: 1 }, { scale: 1.03, duration: 0.18, ease: 'power2.out' }, at + drawDur);
        tl.to(c.row, { scale: 1, duration: 0.25, ease: 'power2.inOut' }, at + drawDur + 0.18);
      }
    });

    // Exit
    if (ctx.duration > 2) {
      var exitAt = ctx.duration - 0.7;
      tl.to(el.querySelector('.funnel-chart'), {
        autoAlpha: 0,
        duration: 0.4,
        ease: 'power2.in'
      }, exitAt);
    }

    return tl;
  }
</script>
