<template>
  <div class="fn-root">
    <div class="fn-head"><div class="fn-title"></div><div class="fn-sub"></div></div>
    <div class="fn-rows"></div>
    <div class="fn-total"></div>
  </div>
</template>

<style scoped>
  /* FUNNEL: one audience narrowing. Each stage is a centred band on a LOG
     scale (a linear scale drew 3,184 of 48,200 as a 7% stub -- the funnel
     vanished after the first row), joined to the next by a tapering neck.
     The value counts up inside its band, the step conversion sits beside it,
     the money row lands deepest, the end-to-end rate closes. On the ground,
     type sized from the box (--u). */
  .fn-root, .fn-root * { max-width: none; }
  .fn-root { --u: 1px; position: absolute; inset: 0; box-sizing: border-box; display: flex; flex-direction: column; justify-content: center;
    padding: calc(var(--u) * 28) calc(var(--u) * 32);
    font-family: var(--mp-font-family, 'Inter', system-ui, sans-serif); color: var(--fn-ink); }
  .fn-root.t-light { --fn-ink: var(--mp-color-on-light, #17171c); --fn-mute: color-mix(in srgb, var(--mp-color-on-light, #17171c) 62%, #ffffff); --fn-chip: color-mix(in srgb, var(--mp-color-primary, #393bf5) 12%, #ffffff); --fn-chip-ink: color-mix(in srgb, var(--mp-color-primary, #393bf5) 80%, #000000); --fn-neck: color-mix(in srgb, var(--mp-color-primary, #393bf5) 14%, transparent); }
  .fn-root.t-dark { --fn-ink: #ffffff; --fn-mute: rgba(255, 255, 255, 0.68); --fn-chip: color-mix(in srgb, var(--mp-color-primary, #393bf5) 30%, #16171d); --fn-chip-ink: #ffffff; --fn-neck: color-mix(in srgb, var(--mp-color-primary, #393bf5) 30%, transparent); }
  .fn-head { margin-bottom: calc(var(--u) * 26); }
  .fn-title { font-size: calc(var(--u) * 40); font-weight: 700; letter-spacing: -0.02em; line-height: 1.1; }
  .fn-sub { margin-top: calc(var(--u) * 8); font-size: calc(var(--u) * 20); color: var(--fn-mute); }
  .fn-title:empty, .fn-sub:empty, .fn-total:empty { display: none; }
  .fn-rows { display: flex; flex-direction: column; }
  .fn-row { display: grid; grid-template-columns: var(--fn-cols); align-items: center; column-gap: calc(var(--u) * 18); }
  .fn-label { text-align: right; font-size: calc(var(--u) * 22); font-weight: 600; line-height: 1.15; color: var(--fn-mute); }
  .fn-row.money .fn-label { color: var(--fn-ink); }
  .fn-lane { position: relative; height: calc(var(--u) * 66); display: flex; justify-content: center; }
  .fn-band { height: 100%; border-radius: calc(var(--u) * 12); display: flex; align-items: center; justify-content: center;
    color: #ffffff; font-size: calc(var(--u) * 28); font-weight: 700; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; white-space: nowrap;
    box-shadow: 0 calc(var(--u) * 6) calc(var(--u) * 18) color-mix(in srgb, var(--mp-color-primary, #393bf5) 22%, transparent); }
  .fn-row.money .fn-band { font-size: calc(var(--u) * 32); }
  .fn-neck { height: calc(var(--u) * 16); display: grid; grid-template-columns: var(--fn-cols); column-gap: calc(var(--u) * 18); }
  .fn-neck i { grid-column: 2; display: block; background: var(--fn-neck); }
  .fn-rate { justify-self: start; white-space: nowrap; font-size: calc(var(--u) * 19); font-weight: 700; font-variant-numeric: tabular-nums;
    padding: calc(var(--u) * 6) calc(var(--u) * 12); border-radius: 999px; background: var(--fn-chip); color: var(--fn-chip-ink); }
  .fn-rate:empty { visibility: hidden; }
  .fn-total { margin-top: calc(var(--u) * 24); text-align: center; font-size: calc(var(--u) * 22); color: var(--fn-mute); }
  .fn-total b { color: var(--fn-ink); font-weight: 700; }
</style>

<script>
  function createTimeline(el, data, ctx) {
    var tl = gsap.timeline();
    var q = function (s) { return el.querySelector(s); };
    var root = q('.fn-root'), rowsEl = q('.fn-rows');
    var DUR = (ctx && ctx.duration) || 5;
    var stages = (Array.isArray(data.stages) ? data.stages : []).filter(function (s) { return s && isFinite(Number(s.value)); });
    if (!stages.length) return tl;

    var gl = window.mpGroundLum ? mpGroundLum() : null;
    var theme = data.theme === 'dark' || data.theme === 'light' ? data.theme : (typeof gl === 'number' && gl < 0.18 ? 'dark' : 'light');
    root.classList.add('t-' + theme);
    q('.fn-title').textContent = data.title ? String(data.title) : '';
    q('.fn-sub').textContent = data.subtitle ? String(data.subtitle) : '';
    var showRate = data.show_retention !== false;

    // Band widths on a log scale between the mouth and the money row, never
    // narrower than 36% of the lane (the value must fit inside).
    var vals = stages.map(function (s) { return Math.max(1e-9, Number(s.value)); });
    var vmax = Math.max.apply(null, vals), vmin = Math.min.apply(null, vals);
    var span = Math.log(vmax / vmin) || 1;
    var widths = vals.map(function (v) { return vmax === vmin ? 1 : 0.36 + 0.64 * (Math.log(v / vmin) / span); });
    var fmt = function (v) { return Math.round(v).toString().replace(/\B(?=(\d{3})+(?!\d))/g, ','); };
    var pct = function (a, b) { var p = (a / b) * 100; return (p >= 10 ? Math.round(p) : p >= 1 ? p.toFixed(1) : p.toFixed(2)) + '%'; };
    var n = stages.length;

    var rows = [], necks = [];
    stages.forEach(function (s, i) {
      if (i > 0) {
        var nk = document.createElement('div'); nk.className = 'fn-neck';
        var shape = document.createElement('i');
        var a = (1 - widths[i - 1]) * 50, b = (1 - widths[i]) * 50;
        shape.style.clipPath = 'polygon(' + a + '% 0, ' + (100 - a) + '% 0, ' + (100 - b) + '% 100%, ' + b + '% 100%)';
        nk.innerHTML = '<span></span>'; nk.appendChild(shape);
        rowsEl.appendChild(nk); necks.push(nk);
      }
      var row = document.createElement('div');
      row.className = 'fn-row' + (i === n - 1 && n > 1 ? ' money' : '');
      row.innerHTML = '<div class="fn-label"></div><div class="fn-lane"><div class="fn-band"></div></div><div class="fn-rate"></div>';
      row.querySelector('.fn-label').textContent = String(s.label || '');
      var band = row.querySelector('.fn-band');
      band.style.width = (widths[i] * 100).toFixed(2) + '%';
      // One hue, deepening as the audience narrows (a stage color overrides).
      var f = n > 1 ? i / (n - 1) : 1;
      band.style.background = s.color ? String(s.color)
        : 'linear-gradient(180deg, color-mix(in srgb, var(--mp-color-primary, #393bf5) ' + Math.round(80 + f * 12) + '%, ' + (f < 0.5 ? '#ffffff' : '#0b0b2e') + '), color-mix(in srgb, var(--mp-color-primary, #393bf5) ' + Math.round(88 - f * 6) + '%, #0b0b2e))';
      band.textContent = s.display ? String(s.display) : fmt(vals[i]);
      if (showRate && i > 0) row.querySelector('.fn-rate').textContent = s.retention ? String(s.retention) : pct(vals[i], vals[i - 1]);
      rowsEl.appendChild(row);
      rows.push({ row: row, band: band, label: row.querySelector('.fn-label'), rate: row.querySelector('.fn-rate') });
    });
    var total = q('.fn-total');
    if (n >= 3 && data.show_total !== false) {
      total.innerHTML = '<b></b> end to end';
      total.querySelector('b').textContent = pct(vals[n - 1], vals[0]);
    }

    // SIZE: columns and type from the box, shrink until everything fits
    // (rows fit the height, each value fits inside its band).
    var W = el.clientWidth || 900, H = el.clientHeight || 600;
    var labelFrac = W < 700 ? 0.3 : 0.24, rateFrac = showRate ? (W < 700 ? 0.19 : 0.14) : 0;
    root.style.setProperty('--fn-cols', labelFrac * 100 + '% 1fr ' + (rateFrac ? rateFrac * 100 + '%' : '0'));
    var u = Math.min(W / 480, H / (140 + n * 100));
    function spills() {
      if (root.scrollHeight > H + 1) return true;
      for (var k = 0; k < rows.length; k++) {
        var r = rows[k];
        if (r.band.scrollWidth > r.band.clientWidth + 1 || r.label.scrollWidth > r.label.clientWidth + 1 || r.rate.scrollWidth > r.rate.clientWidth + 1) return true;
      }
      return false;
    }
    for (var it = 0; it < 40; it++) {
      root.style.setProperty('--u', u.toFixed(3) + 'px');
      if (!spills()) break;
      u *= 0.95;
    }

    // MOTION: the title rises; stage by stage the band opens from its
    // centre while its value counts up, the neck fills in, the step rate
    // lands; the end-to-end rate closes. Built by ~60% of the scene.
    var AT = Number(data.at) || 0.2;
    var head = [q('.fn-title'), q('.fn-sub')].filter(function (x) { return x.textContent; });
    if (head.length && window.mpLineRise) mpLineRise(tl, head, AT, { duration: 0.45, rise: 12 });
    var t0 = AT + (head.length ? 0.3 : 0);
    var step = Math.max(0.14, Math.min(0.5, (DUR * 0.6 - t0 - 0.6) / n));
    rows.forEach(function (r, i) {
      var t = t0 + i * step;
      gsap.set(r.label, { autoAlpha: 0, y: 8 });
      tl.to(r.label, { autoAlpha: 1, y: 0, duration: 0.35, ease: 'power3.out' }, t);
      gsap.set(r.band, { scaleX: 0.04, autoAlpha: 0 });
      tl.to(r.band, { scaleX: 1, autoAlpha: 1, duration: 0.55, ease: 'power3.out' }, t);
      if (!stages[i].display && window.mpCountUp) mpCountUp(tl, r.band, t + 0.05, { to: fmt(vals[i]), duration: Math.min(0.9, step * 2 + 0.3) });
      if (i > 0) {
        var nk = necks[i - 1];
        gsap.set(nk, { autoAlpha: 0 });
        tl.to(nk, { autoAlpha: 1, duration: 0.3, ease: 'power1.out' }, t - 0.05);
      }
      if (r.rate.textContent) {
        gsap.set(r.rate, { autoAlpha: 0, x: -8 });
        tl.to(r.rate, { autoAlpha: 1, x: 0, duration: 0.35, ease: 'power3.out' }, t + 0.3);
      }
    });
    if (total.textContent) {
      gsap.set(total, { autoAlpha: 0, y: 8 });
      tl.to(total, { autoAlpha: 1, y: 0, duration: 0.4, ease: 'power3.out' }, t0 + n * step + 0.3);
    }
    if (data.exit === true && DUR > 2) tl.to(root, { autoAlpha: 0, duration: 0.4, ease: 'power2.in' }, DUR - 0.5);
    return tl;
  }
</script>
