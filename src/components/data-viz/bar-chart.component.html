    <div class="chart-card">
      <div class="chart-area">
        <div class="chart-grid-lines"></div>
      </div>
    </div>
  </div>
</template>

<style scoped>

</style>

<script>
  function createTimeline(el, data, ctx) {
    var tl = gsap.timeline();
    var chartCard = el.querySelector('.chart-card');
    var chartArea = el.querySelector('.chart-area');
    var gridLines = el.querySelector('.chart-grid-lines');
    var title = el.querySelector('.chart-title');
    var bars = data.bars || [];
    var maxVal = data.max_value || Math.max.apply(null, bars.map(function(b) { return b.value; }));
    var maxHeight = 280;
    var defaultGradients = [
      ['var(--mp-color-accent, #a78bfa)', 'var(--mp-color-primary, #6366f1)'],
      ['var(--mp-color-primary, #6366f1)', '#4f46e5'],
      ['var(--mp-color-secondary, #22d3ee)', '#06b6d4'],
      ['#f472b6', '#ec4899'],
      ['#fbbf24', '#f59e0b'],
      ['#34d399', '#10b981']
    ];

    // Add grid lines
    for (var g = 0; g < 5; g++) {
      var line = document.createElement('div');
      line.className = 'grid-line';
      gridLines.appendChild(line);
    }

    // THE BRAND, NOT A RAINBOW: every bar in the primary, the one that
    // matters (data.highlight -- an index or label; default the tallest) at
    // full strength, the rest muted. palette:"rainbow" keeps the old look.
    var rainbow = data.palette === 'rainbow';
    var hi = -1;
    if (data.highlight !== undefined && data.highlight !== null && data.highlight !== false) {
      hi = typeof data.highlight === 'number' ? data.highlight : bars.map(function (b) { return String(b.label); }).indexOf(String(data.highlight));
    }
    if (hi < 0 && data.highlight !== false) bars.forEach(function (b, i) { if (hi < 0 || b.value > bars[hi].value) hi = i; });
    var PRE = data.prefix || '', SUF = data.suffix || '';
    bars.forEach(function(bar, i) {
      var group = document.createElement('div');
      group.className = 'bar-group';

      var value = document.createElement('div');
      value.className = 'bar-value';
      value.textContent = PRE + Number(bar.value).toLocaleString('en-US') + SUF;
      value.dataset.to = value.textContent;

      var fill = document.createElement('div');
      fill.className = 'bar-fill';
      var grad = defaultGradients[i % defaultGradients.length];
      var P = 'var(--mp-color-primary, #393bf5)';
      fill.style.background = bar.color
        ? 'linear-gradient(180deg, ' + bar.color + ' 0%, ' + bar.color + 'cc 100%)'
        : rainbow ? 'linear-gradient(180deg, ' + grad[0] + ' 0%, ' + grad[1] + ' 100%)'
        : (i === hi ? 'linear-gradient(180deg, ' + P + ' 0%, color-mix(in srgb, ' + P + ' 78%, #000) 100%)'
          : 'color-mix(in srgb, ' + P + ' 26%, transparent)');
      if (i === hi && !rainbow) value.style.fontWeight = '800';
      var targetH = Math.max(8, (bar.value / maxVal) * maxHeight);
      fill.style.height = '0px';
      fill.dataset.targetHeight = targetH + 'px';

      var label = document.createElement('div');
      label.className = 'bar-label';
      label.textContent = bar.label;

      group.appendChild(value);
      group.appendChild(fill);
      group.appendChild(label);
      chartArea.appendChild(group);
    });

    var fills = chartArea.querySelectorAll('.bar-fill');
    var values = chartArea.querySelectorAll('.bar-value');
    var labels = chartArea.querySelectorAll('.bar-label');

    gsap.set(values, { autoAlpha: 0 });
    gsap.set(labels, { autoAlpha: 0 });

    // Title entrance
    if (title && title.textContent.trim()) {
      gsap.set(title, { autoAlpha: 0, y: 20, filter: 'blur(4px)' });
      tl.to(title, { autoAlpha: 1, y: 0, filter: 'blur(0px)', duration: 0.5, ease: 'power3.out' }, 0.2);
    }

    // Card entrance
    gsap.set(chartCard, { autoAlpha: 0, y: 30, scale: 1.05, filter: 'blur(4px)' });
    tl.to(chartCard, {
      autoAlpha: 1, y: 0, scale: 1, filter: 'blur(0px)',
      duration: 0.6, ease: 'power3.out'
    }, 0.3);

    // Bars grow with stagger
    var stagger = ctx.motion === 'minimal' ? 0.08 : 0.12;
    fills.forEach(function(fill, i) {
      tl.to(fill, {
        height: fill.dataset.targetHeight,
        duration: 0.7,
        ease: 'power3.out'
      }, 0.7 + i * stagger);
    });

    // Values and labels: each value counts up as its bar grows.
    tl.to(values, { autoAlpha: 1, duration: 0.3, stagger: stagger }, 0.7);
    if (window.mpCountUp) values.forEach(function (v, i) { mpCountUp(tl, v, 0.7 + i * stagger, { to: v.dataset.to, duration: 0.7 }); });
    tl.to(labels, { autoAlpha: 1, duration: 0.3, stagger: stagger }, 1.0);

    // Exit
    if (ctx.duration > 2) {
      var exitAt = ctx.duration - 0.7;
      tl.to(el.querySelector('.bar-chart'), {
        autoAlpha: 0,
        duration: 0.4,
        ease: 'power2.in'
      }, exitAt);
    }

    return tl;
  }
</script>
