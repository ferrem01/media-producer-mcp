<script>
  function createTimeline(el, data, ctx) {
    var tl = gsap.timeline();
    var chartCard = el.querySelector('.chart-card');
    var chartArea = el.querySelector('.chart-area');
    var gridLines = el.querySelector('.chart-grid-lines');
    var title = el.querySelector('.chart-title');
    var bars = data.bars || [];
    var maxVal = data.max_value || Math.max.apply(null, bars.map(function(b) { return b.value; }));
    var maxHeight = 280;
    var defaultGradients = [
      ['var(--mp-color-accent, #a78bfa)', 'var(--mp-color-primary, #6366f1)'],
      ['var(--mp-color-primary, #6366f1)', '#4f46e5'],
      ['var(--mp-color-secondary, #22d3ee)', '#06b6d4'],
      ['#f472b6', '#ec4899'],
      ['#fbbf24', '#f59e0b'],
      ['#34d399', '#10b981']
    ];

    // Add grid lines
    for (var g = 0; g < 5; g++) {
      var line = document.createElement('div');
      line.className = 'grid-line';
      gridLines.appendChild(line);
    }

    bars.forEach(function(bar, i) {
      var group = document.createElement('div');
      group.className = 'bar-group';

      var value = document.createElement('div');
      value.className = 'bar-value';
      value.textContent = bar.value;

      var fill = document.createElement('div');
      fill.className = 'bar-fill';
      var grad = defaultGradients[i % defaultGradients.length];
      fill.style.background = bar.color
        ? 'linear-gradient(180deg, ' + bar.color + ' 0%, ' + bar.color + 'cc 100%)'
        : 'linear-gradient(180deg, ' + grad[0] + ' 0%, ' + grad[1] + ' 100%)';
      var targetH = Math.max(8, (bar.value / maxVal) * maxHeight);
      fill.style.height = '0px';
      fill.dataset.targetHeight = targetH + 'px';

      var label = document.createElement('div');
      label.className = 'bar-label';
      label.textContent = bar.label;

      group.appendChild(value);
      group.appendChild(fill);
      group.appendChild(label);
      chartArea.appendChild(group);
    });

    var fills = chartArea.querySelectorAll('.bar-fill');
    var values = chartArea.querySelectorAll('.bar-value');
    var labels = chartArea.querySelectorAll('.bar-label');

    gsap.set(values, { autoAlpha: 0 });
    gsap.set(labels, { autoAlpha: 0 });

    // Title entrance
    if (title && title.textContent.trim()) {
      gsap.set(title, { autoAlpha: 0, y: 20, filter: 'blur(4px)' });
      tl.to(title, { autoAlpha: 1, y: 0, filter: 'blur(0px)', duration: 0.5, ease: 'power3.out' }, 0.2);
    }

    // Card entrance
    gsap.set(chartCard, { autoAlpha: 0, y: 30, scale: 1.05, filter: 'blur(4px)' });
    tl.to(chartCard, {
      autoAlpha: 1, y: 0, scale: 1, filter: 'blur(0px)',
      duration: 0.6, ease: 'power3.out'
    }, 0.3);

    // Bars grow with stagger
    var stagger = ctx.motion === 'minimal' ? 0.08 : 0.12;
    fills.forEach(function(fill, i) {
      tl.to(fill, {
        height: fill.dataset.targetHeight,
        duration: 0.7,
        ease: 'power3.out'
      }, 0.7 + i * stagger);
    });

    // Values and labels
    tl.to(values, { autoAlpha: 1, duration: 0.3, stagger: stagger }, 1.0);
    tl.to(labels, { autoAlpha: 1, duration: 0.3, stagger: stagger }, 1.0);

    // Exit
    if (ctx.duration > 2) {
      var exitAt = ctx.duration - 0.7;
      tl.to(el.querySelector('.bar-chart'), {
        autoAlpha: 0,
        duration: 0.4,
        ease: 'power2.in'
      }, exitAt);
    }

    return tl;
  }
</script>
