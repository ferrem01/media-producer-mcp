<template>
  <div class="gc-root" data-anchor="grid">
    <div class="gc-wall"></div>
    <div class="gc-col" data-anchor="shortlist"><div class="gc-title"></div></div>
  </div>
</template>

<style scoped>
  /* GRID CULL: the needle out of the haystack. A dense wall of small record
     cards lands in a wave; the matches ring in the accent one by one; the
     rest blur away; the survivors glide into a ranked column under a title
     chip ("Your JD -- Creative strategist"). The crowd is seeded (fake,
     deterministic); the survivors are the real rows. */
  .gc-root, .gc-root * { box-sizing: border-box; max-width: none; }
  .gc-root { --u: 1px; position: absolute; inset: 0; font-family: var(--mp-font-family, 'Inter', system-ui, sans-serif); color: var(--ink); }
  .gc-root.t-light { --ink: var(--mp-color-on-light, #17171c); --mute: color-mix(in srgb, var(--mp-color-on-light, #17171c) 55%, #ffffff); --card: #ffffff; --edge: rgba(20, 20, 40, 0.07); --shadow: 0 calc(var(--u) * 3) calc(var(--u) * 10) rgba(20, 20, 60, 0.09); }
  .gc-root.t-dark { --ink: #f5f6fa; --mute: rgba(255, 255, 255, 0.6); --card: #1d1e26; --edge: rgba(255, 255, 255, 0.08); --shadow: 0 calc(var(--u) * 3) calc(var(--u) * 12) rgba(0, 0, 0, 0.4); }
  .gc-wall, .gc-col { position: absolute; inset: 0; }
  .gc-card { position: absolute; display: flex; align-items: center; gap: 0.5em; padding: 0 0.55em; border-radius: 0.55em;
    background: var(--card); box-shadow: var(--shadow), inset 0 0 0 1px var(--edge); overflow: hidden; white-space: nowrap; }
  .gc-av { flex: 0 0 auto; width: 1.9em; height: 1.9em; border-radius: 50%; overflow: hidden; display: flex; align-items: center; justify-content: center;
    color: #fff; font-weight: 700; font-size: 0.72em; letter-spacing: 0.02em; }
  .gc-av img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .gc-tx { flex: 1 1 auto; min-width: 0; line-height: 1.15; }
  .gc-nm { font-weight: 650; font-size: 0.78em; overflow: hidden; text-overflow: ellipsis; }
  .gc-rl { font-size: 0.62em; color: var(--mute); overflow: hidden; text-overflow: ellipsis; margin-top: 0.12em; }
  .gc-ring { position: absolute; inset: 0; border-radius: inherit; box-shadow: inset 0 0 0 0.14em var(--acc); background: color-mix(in srgb, var(--acc) 9%, transparent); opacity: 0; pointer-events: none; }
  .gc-score { position: absolute; right: 0.9em; top: 50%; transform: translateY(-50%); font-size: 0.6em; font-weight: 700; padding: 0.3em 0.7em; border-radius: 999px; background: color-mix(in srgb, var(--acc) 16%, var(--card)); color: var(--ink); opacity: 0; }
  .gc-title { position: absolute; display: flex; align-items: center; gap: 0.5em; padding: 0.45em 0.95em; border-radius: 999px;
    background: var(--card); box-shadow: var(--shadow), inset 0 0 0 1px var(--edge); font-weight: 600; white-space: nowrap; }
  .gc-title:empty { display: none; }
  .gc-title i { width: 0.55em; height: 0.55em; border-radius: 50%; background: var(--acc); display: block; }
</style>

<script>
  function createTimeline(el, data, ctx) {
    var tl = gsap.timeline();
    var q = function (s) { return el.querySelector(s); };
    var root = q('.gc-root'), wall = q('.gc-wall'), col = q('.gc-col'), title = q('.gc-title');
    var DUR = (ctx && ctx.duration) || 7;
    var num = function (v, d) { var n = Number(v); return (v === null || v === undefined || v === '' || !isFinite(n)) ? d : n; };
    var gl = window.mpGroundLum ? mpGroundLum() : null;
    root.classList.add('t-' + (data.theme === 'dark' || data.theme === 'light' ? data.theme : (typeof gl === 'number' && gl < 0.18 ? 'dark' : 'light')));
    root.style.setProperty('--acc', data.color ? String(data.color) : 'var(--mp-color-primary, #393bf5)');

    // Seeded randomness: the crowd is the same on every render and every seek.
    var seed = (num(data.seed, 7) >>> 0) || 7;
    function rnd() { seed = (seed + 0x6D2B79F5) >>> 0; var t = seed; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }

    // ---- The rows: the real ones (the survivors are the rows marked keep,
    // else the first five), then the seeded crowd up to `count`. ----
    var real = (Array.isArray(data.rows) ? data.rows : []).filter(function (r) { return r && (r.name || typeof r === 'string'); })
      .map(function (r) { return typeof r === 'string' ? { name: r } : r; });
    var keepList = real.filter(function (r) { return r.keep; });
    if (!keepList.length) keepList = real.slice(0, 5);
    keepList = keepList.slice(0, 8);
    var FIRST = ['Amara', 'Devin', 'Lena', 'Elise', 'Theo', 'Maya', 'Jonah', 'Priya', 'Omar', 'Sofia', 'Kai', 'Nina', 'Luca', 'Ines', 'Marcus', 'Hana', 'Ravi', 'Zoe', 'Felix', 'Aisha', 'Leo', 'Clara', 'Mateo', 'Yara', 'Owen', 'Mei', 'Diego', 'Freya', 'Sam', 'Tara', 'Noah', 'Iris', 'Ethan', 'Lila', 'Ben', 'Rosa'];
    var LAST = 'ABCDFGHJKLMNPRSTVW';
    var ROLES = Array.isArray(data.crowd_roles) && data.crowd_roles.length ? data.crowd_roles.map(String)
      : ['Creative strategist', 'Growth marketer', 'Content lead', 'Brand designer', 'Performance marketer', 'Copywriter', 'Social lead', 'Product marketer'];
    var TONES = ['#b5654a', '#6b7a8f', '#c08a3e', '#7a5c8e', '#4f7f6a', '#a0525f', '#5a6fa8', '#8a7560', '#3f6f86', '#9a6a3c'];
    var count = Math.max(keepList.length + 8, Math.min(320, Math.round(num(data.count, 96))));
    var rows = [];
    for (var i = 0; i < count; i++) {
      rows.push({ name: FIRST[Math.floor(rnd() * FIRST.length)] + ' ' + LAST.charAt(Math.floor(rnd() * LAST.length)) + '.', role: ROLES[Math.floor(rnd() * ROLES.length)], tone: TONES[Math.floor(rnd() * TONES.length)], crowd: true });
    }
    // The real rows that are not survivors join the crowd; the survivors take
    // spread-out slots (never bunched, never on the edge row).
    var others = real.filter(function (r) { return keepList.indexOf(r) < 0; });
    others.forEach(function (r) { var k = Math.floor(rnd() * count); rows[k] = { name: r.name, role: r.role || r.sub || '', avatar: r.avatar, tone: TONES[k % TONES.length], crowd: true }; });

    // ---- Layout: the visible frame of the box, a grid of small cards. ----
    var W0 = el.clientWidth || 1200, H0 = el.clientHeight || 700;
    var rc = el.getBoundingClientRect(), sc = rc.width / W0 || 1;
    var ox = Math.max(0, -rc.left, rc.right - window.innerWidth) / sc + W0 * 0.03, oy = Math.max(0, -rc.top, rc.bottom - window.innerHeight) / sc + H0 * 0.04;
    var X = ox, Y = oy, W = W0 - 2 * ox, H = H0 - 2 * oy;
    var ASPECT = 3.3;
    var cols = Math.max(2, Math.round(Math.sqrt((count * W) / (H * ASPECT))));
    var nrows = Math.ceil(count / cols);
    var cellW = W / cols, cellH = H / nrows;
    var cardW = cellW * 0.9, cardH = Math.min(cellH * 0.82, cardW / 2.4);
    var u = Math.min(W / 1200, H / 700);
    root.style.setProperty('--u', u.toFixed(3) + 'px');

    // The survivors' slots: evenly through the grid, jittered, off the edges.
    var slots = [];
    keepList.forEach(function (r, k) {
      var f = (k + 0.5) / keepList.length;
      var idx = Math.floor(f * count + (rnd() - 0.5) * cols * 0.8);
      var rr = Math.min(nrows - 2, Math.max(1, Math.floor(idx / cols))), cc = Math.min(cols - 2, Math.max(1, idx % cols));
      var slot = rr * cols + cc;
      while (slots.indexOf(slot) >= 0 && slot < count - 1) slot++;
      slots.push(slot);
      rows[slot] = { name: r.name, role: r.role || r.sub || '', avatar: r.avatar, score: r.score, tone: TONES[k % TONES.length], keep: k };
    });

    function initials(n) { return String(n || '').split(/\s+/).filter(Boolean).slice(0, 2).map(function (w) { return w.charAt(0).toUpperCase(); }).join(''); }
    var cards = rows.map(function (r, i) {
      var c = document.createElement('div'); c.className = 'gc-card'; c.setAttribute('data-anchor', 'card');
      var av = document.createElement('div'); av.className = 'gc-av'; av.setAttribute('data-anchor', 'avatar'); av.style.background = r.tone;
      if (r.avatar) { var im = document.createElement('img'); im.src = String(r.avatar); im.alt = ''; av.appendChild(im); } else av.textContent = initials(r.name);
      var tx = document.createElement('div'); tx.className = 'gc-tx';
      var nm = document.createElement('div'); nm.className = 'gc-nm'; nm.textContent = r.name;
      var rl = document.createElement('div'); rl.className = 'gc-rl'; rl.textContent = r.role || '';
      tx.appendChild(nm); tx.appendChild(rl); c.appendChild(av); c.appendChild(tx);
      var ring = null, score = null;
      if (r.keep !== undefined) {
        ring = document.createElement('div'); ring.className = 'gc-ring'; c.appendChild(ring);
        if (r.score !== undefined && r.score !== '') { score = document.createElement('div'); score.className = 'gc-score'; score.textContent = String(r.score); c.appendChild(score); }
      }
      var cx = X + (i % cols) * cellW + (cellW - cardW) / 2, cy = Y + Math.floor(i / cols) * cellH + (cellH - cardH) / 2;
      c.style.cssText = 'left:' + cx.toFixed(1) + 'px;top:' + cy.toFixed(1) + 'px;width:' + cardW.toFixed(1) + 'px;height:' + cardH.toFixed(1) + 'px;font-size:' + (cardH * 0.4).toFixed(2) + 'px';
      wall.appendChild(c);
      return { el: c, row: r, ring: ring, score: score, i: i, cx: cx, cy: cy };
    });
    var keeps = cards.filter(function (c) { return c.row.keep !== undefined; }).sort(function (a, b) { return a.row.keep - b.row.keep; });

    // ---- The shortlist column: centred, or to one side (column: left|right). ----
    var tall = H > W * 0.9;
    var colW = tall ? W * 0.86 : Math.min(W * 0.46, H * 1.05);
    var rowH = Math.min((H * 0.72) / Math.max(4, keeps.length), colW * 0.13);
    var gap = rowH * 0.2;
    title.innerHTML = data.column_title ? '<i></i><span></span>' : '';
    if (data.column_title) title.querySelector('span').textContent = String(data.column_title);
    title.style.fontSize = (rowH * 0.3).toFixed(2) + 'px';
    var titleH = data.column_title ? rowH * 0.75 + gap * 1.5 : 0;
    var stackH = keeps.length * rowH + (keeps.length - 1) * gap + titleH;
    var colX = data.column === 'left' ? X : data.column === 'right' ? X + W - colW : X + (W - colW) / 2;
    var colY = Y + (H - stackH) / 2;
    // The chip never runs past the column (measured: off the right edge on 9x16).
    var tfs = rowH * 0.3;
    for (var f = 0; f < 12 && data.column_title && title.offsetWidth > colW; f++) { tfs *= 0.9; title.style.fontSize = tfs.toFixed(2) + 'px'; }
    title.style.left = colX + 'px'; title.style.top = colY + 'px';

    // ---- Motion: the wave in, the scan, the cull, the gather. Times scale
    // down together when the scene is short. ----
    var AT = num(data.at, 0.2);
    var scanAt = num(data.scan_at, AT + 1.4), cullAt = num(data.cull_at, scanAt + 0.25 + keeps.length * 0.14), gatherAt = num(data.gather_at, cullAt + 0.55);
    var end = gatherAt + 0.9 + keeps.length * 0.06;
    var k = end > DUR - 0.2 && data.gather_at === undefined ? Math.max(0.45, (DUR - 0.2 - AT) / (end - AT)) : 1;
    var T = function (t) { return AT + (t - AT) * k; };
    var ocx = X + W / 2, ocy = Y + H / 2, maxD = Math.sqrt(W * W + H * H) / 2;
    cards.forEach(function (c) {
      var d = Math.sqrt(Math.pow(c.cx + cardW / 2 - ocx, 2) + Math.pow(c.cy + cardH / 2 - ocy, 2)) / maxD;
      gsap.set(c.el, { autoAlpha: 0, scale: 0.55, y: cardH * 0.5 });
      tl.to(c.el, { autoAlpha: 1, scale: 1, y: 0, duration: 0.45 * k, ease: 'back.out(1.5)' }, T(AT + d * 0.9 + rnd() * 0.12));
    });
    // The scan: survivors ring in reading order.
    keeps.slice().sort(function (a, b) { return a.i - b.i; }).forEach(function (c, j) {
      tl.to(c.ring, { opacity: 1, duration: 0.2 * k }, T(scanAt + j * 0.14));
      tl.fromTo(c.el, { scale: 1 }, { scale: 1.08, duration: 0.12 * k, yoyo: true, repeat: 1, ease: 'power1.inOut', immediateRender: false }, T(scanAt + j * 0.14));
    });
    // The cull: everyone else blurs away, in a seeded order.
    cards.forEach(function (c) {
      if (c.row.keep !== undefined) return;
      tl.to(c.el, { autoAlpha: 0, scale: 0.86, filter: 'blur(' + (cardH * 0.12).toFixed(1) + 'px)', duration: 0.42 * k, ease: 'power2.in' }, T(cullAt + rnd() * 0.45));
    });
    // The gather: the survivors glide into the ranked column and grow.
    keeps.forEach(function (c, j) {
      var tx = colX, ty = colY + titleH + j * (rowH + gap);
      tl.to(c.el, { left: tx, top: ty, width: colW, height: rowH, fontSize: rowH * 0.4, duration: 0.8 * k, ease: 'power3.inOut' }, T(gatherAt + j * 0.06));
      // Room for the badge only once in the column (in the grid the name needs it).
      if (c.score) { tl.set(c.el.querySelector('.gc-tx'), { paddingRight: '5.2em' }, T(gatherAt)); tl.to(c.score, { opacity: 1, duration: 0.3 * k }, T(gatherAt + 0.7 + j * 0.06)); }
    });
    if (data.column_title) {
      gsap.set(title, { autoAlpha: 0, y: rowH * 0.3 });
      tl.to(title, { autoAlpha: 1, y: 0, duration: 0.45 * k, ease: 'power3.out' }, T(gatherAt + 0.35));
    }
    return tl;
  }
</script>
