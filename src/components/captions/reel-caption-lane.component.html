<script>
  function createTimeline(el, data, ctx) {
    var tl = gsap.timeline();
    var stack = el.querySelector('.rcl-stack');
    if (!stack) return tl;

    var phrases = (data && data.phrases) || [];
    if (!phrases.length) return tl;

    // Modifier classes go on the TEMPLATE root, not the component wrapper --
    // scoped styles only match inside the template, so a class on the wrapper
    // silently matches nothing.
    var root = el.querySelector('.rcl') || stack;
    if (data && data.align === 'left') root.classList.add('rcl-align-left');
    var scrim = (data && data.scrim) || 'none';
    if (scrim === 'shadow') root.classList.add('rcl-scrim-shadow');
    else if (scrim === 'plate') root.classList.add('rcl-scrim-plate');
    // Scatter (the Air cut): phrases accumulate at their own spots instead
    // of replacing each other in one box.
    var scatter = !!(data && data.mode === 'scatter');
    if (scatter) root.classList.add('rcl-scatter');
    // Eight spots: left / right columns, stepping down the frame. A ninth
    // phrase clears the board and starts over at the top.
    var SPOTS = 8;

    // Tiered (the Scale Army cut): lead small, starred phrase big on a
    // brush plate, tail small. Its own build and timeline, below.
    if (data && data.mode === 'tiered') return tieredTimeline(el, root, stack, phrases, data, ctx, tl);

    var maxFont = (data && data.max_font) || 104;
    var minFont = (data && data.min_font) || 44;
    var upper = !!(data && data.uppercase);

    // ── Emphasis ink ───────────────────────────────────────────────────────
    // The brand primary is a saturated statement color, not a legible one:
    // #393bf5 on a near-black lane measures ~2.4:1. Mix it toward the ground's
    // opposite until it clears 4.5:1, the same repair caption-kinetic-slam
    // does for its accent words.
    var emInk = null;
    // Under a plate the words sit on the PLATE, not on the scene ground --
    // measuring the scene would mix the accent toward the wrong end.
    var lum = scrim === 'plate' ? 0.02 : (window.mpGroundLum ? mpGroundLum() : null);
    if (typeof lum === 'number' && window.mpInkContrast && window.mpParseColor) {
      var probe = document.createElement('span');
      probe.className = 'rcl-w em';
      stack.appendChild(probe);
      var raw = getComputedStyle(probe).color;
      stack.removeChild(probe);
      var rc = mpParseColor(raw);
      var target = mpParseColor(lum < 0.4 ? '#ffffff' : '#0b0b12');
      if (rc && target) {
        for (var mix = 0; mix <= 0.9; mix += 0.1) {
          var cand = 'rgb(' + Math.round(rc.r + (target.r - rc.r) * mix) + ',' +
            Math.round(rc.g + (target.g - rc.g) * mix) + ',' +
            Math.round(rc.b + (target.b - rc.b) * mix) + ')';
          var ratio = mpInkContrast(cand, lum);
          if (ratio === null || ratio >= 4.5) { emInk = cand; break; }
          emInk = cand;
        }
      }
    }

    // ── Build every phrase up front ────────────────────────────────────────
    var built = [];
    for (var i = 0; i < phrases.length; i++) {
      var p = phrases[i] || {};
      var raw2 = String(p.text || '');
      if (!raw2) continue;

      var wrap = document.createElement('div');
      wrap.className = 'rcl-phrase';
      var inner = document.createElement('div');
      inner.className = 'rcl-inner';
      var pos = null;
      if (scatter) {
        pos = document.createElement('div');
        var k = built.length % SPOTS;
        var right = k % 2 === 1;
        pos.className = 'rcl-pos' + (right ? ' rcl-r' : '');
        pos.style.setProperty('--rcl-x', right ? '48%' : '4%');
        pos.style.setProperty('--rcl-y', (5 + k * 8.5) + '%');
        pos.style.setProperty('--rcl-w', '48%');
        pos.appendChild(inner);
        wrap.appendChild(pos);
      } else {
        wrap.appendChild(inner);
      }
      stack.appendChild(wrap);

      // *starred* spans mark emphasis. Split on the stars FIRST so a phrase
      // with unbalanced stars degrades to plain text instead of looping.
      var words = [];
      var segs = raw2.split('*');
      for (var s = 0; s < segs.length; s++) {
        if (!segs[s]) continue;
        var isEm = (s % 2 === 1) && (segs.length % 2 === 1);
        var chunk = segs[s].split(/\s+/).filter(function (w) { return w.length; });
        for (var c = 0; c < chunk.length; c++) {
          var sp = document.createElement('span');
          sp.className = 'rcl-w' + (isEm ? ' em' : '');
          sp.textContent = upper ? chunk[c].toUpperCase() : chunk[c];
          if (isEm && emInk) sp.style.color = emInk;
          inner.appendChild(sp);
          inner.appendChild(document.createTextNode(' '));
          words.push(sp);
        }
      }
      if (!words.length) { stack.removeChild(wrap); continue; }

      built.push({
        wrap: wrap, inner: inner, words: words, pos: pos,
        start: Number(p.start) || 0,
        end: (p.end != null ? Number(p.end) : (Number(p.start) || 0) + 2.4),
      });
    }
    if (!built.length) return tl;

    // ── Fit each phrase to the lane ────────────────────────────────────────
    // Measured once, while the phrase is laid out but still invisible: step the
    // size down until the block clears the lane box in BOTH axes.
    var boxW = stack.clientWidth || el.clientWidth;
    var boxH = stack.clientHeight || el.clientHeight;
    for (var b = 0; b < built.length; b++) {
      var it = built[b];
      it.wrap.style.visibility = 'hidden';
      it.wrap.style.opacity = '0';
      var fs = maxFont;
      it.inner.style.fontSize = fs + 'px';
      var guard = 0;
      if (scatter) {
        // A spot is a column, two lines tall at most; a wide word shrinks.
        var colW = it.pos ? it.pos.clientWidth : boxW * 0.48;
        while (guard++ < 40 && fs > minFont &&
          (it.inner.scrollHeight > fs * 2.3 || it.inner.scrollWidth > colW + 1)) {
          fs = Math.round(fs * 0.92);
          it.inner.style.fontSize = fs + 'px';
        }
      } else {
        while (guard++ < 40 && fs > minFont &&
          (it.inner.scrollHeight > boxH || it.inner.scrollWidth > boxW + 1)) {
          fs = Math.round(fs * 0.92);
          it.inner.style.fontSize = fs + 'px';
        }
      }
      it.fontSize = fs;
    }

    // ── Timeline ───────────────────────────────────────────────────────────
    var rise = ctx.motion === 'minimal' ? 0.42 : ctx.motion === 'punchy' ? 0.3 : 0.36;
    var stepBase = ctx.motion === 'minimal' ? 0.07 : ctx.motion === 'punchy' ? 0.055 : 0.06;

    if (scatter) {
      // Each phrase pops in word by word at its spot and STAYS. The phrase
      // before it is marked old (hidden only over a cutaway). Every SPOTS
      // phrases the board clears and the next one starts at the top.
      for (var q = 0; q < built.length; q++) {
        var sp2 = built[q];
        var span2 = Math.max(0.3, sp2.end - sp2.start);
        var step2 = Math.min(0.22, Math.max(0.05, (span2 * 0.7) / Math.max(1, sp2.words.length)));
        if (q > 0 && q % SPOTS === 0) {
          for (var o = q - SPOTS; o < q; o++) tl.to(built[o].wrap, { autoAlpha: 0, duration: 0.18, ease: 'power2.in' }, Math.max(0, sp2.start - 0.2));
        }
        if (q > 0 && built[q - 1].pos) tl.set(built[q - 1].pos, { '--rcl-old': 1 }, sp2.start);
        tl.set(sp2.wrap, { autoAlpha: 1, y: 0 }, sp2.start);
        for (var v = 0; v < sp2.words.length; v++) {
          tl.fromTo(sp2.words[v],
            { autoAlpha: 0, y: 16, scale: 0.72 },
            { autoAlpha: 1, y: 0, scale: 1, duration: 0.26, ease: 'back.out(2)', immediateRender: false },
            sp2.start + v * step2);
        }
      }
      return tl;
    }

    for (var j = 0; j < built.length; j++) {
      var itm = built[j];
      var span = Math.max(0.4, itm.end - itm.start);
      var step = stepBase;
      // Never let the word cascade outrun the phrase's own slot.
      var cascade = (itm.words.length - 1) * step + rise;
      if (cascade > span * 0.7) step = Math.max(0.02, (span * 0.7 - rise) / Math.max(1, itm.words.length - 1));

      tl.set(itm.wrap, { autoAlpha: 1, y: 0 }, itm.start);
      for (var w = 0; w < itm.words.length; w++) {
        tl.fromTo(itm.words[w],
          { autoAlpha: 0, y: 34, scale: 0.92, filter: 'blur(7px)' },
          {
            autoAlpha: 1, y: 0, scale: 1, filter: 'blur(0px)',
            duration: rise, ease: 'back.out(1.7)', immediateRender: false,
          },
          itm.start + w * step);
      }

      var exit = Math.max(itm.start + 0.2, itm.end - 0.28);
      tl.to(itm.wrap, { autoAlpha: 0, y: -26, duration: 0.26, ease: 'power2.in' }, exit);
      tl.set(itm.wrap, { autoAlpha: 0, y: 0 }, itm.end);
    }

    return tl;
  }
  function tieredTimeline(el, root, stack, phrases, data, ctx, tl) {
    root.classList.add('rcl-tiered');
    var maxFont = data.max_font || 96;
    var minFont = data.min_font || 40;
    var small = typeof data.small === 'number' ? data.small : 0.44;
    // The ink on the plate: white unless the brand colour is too light to
    // carry it (then near-black).
    var plateInk = '#ffffff';
    if (window.mpParseColor) {
      var probe = document.createElement('span');
      probe.style.color = 'var(--mp-color-primary, #f26b3a)';
      stack.appendChild(probe);
      var pc = mpParseColor(getComputedStyle(probe).color);
      stack.removeChild(probe);
      if (pc) {
        var lin = function (v) { v /= 255; return v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4); };
        var L = 0.2126 * lin(pc.r) + 0.7152 * lin(pc.g) + 0.0722 * lin(pc.b);
        if ((1.05) / (L + 0.05) < 3) plateInk = '#111118';
      }
    }
    var built = [];
    for (var i = 0; i < phrases.length; i++) {
      var p = phrases[i] || {};
      var text = String(p.text || '').trim();
      if (!text) continue;
      // Split on the stars: lead, key (every starred run joined), tail.
      var segs = text.split('*');
      var balanced = segs.length % 2 === 1;
      var lead = [], key = [], tail = [];
      for (var s = 0; s < segs.length; s++) {
        var ws = segs[s].split(/\s+/).filter(function (w) { return w.length; });
        if (!ws.length) continue;
        var isKey = balanced && s % 2 === 1;
        if (isKey) key = key.concat(ws);
        else if (key.length) tail = tail.concat(ws);
        else lead = lead.concat(ws);
      }
      // A key that only closes the line's punctuation ("*Analytics*.")
      // leaves a tail of stray marks: fold them onto the key.
      if (tail.length && tail.join('').replace(/[.,!?;:\u2014\u2013\-"')]/g, '') === '') { key[key.length - 1] += tail.join(''); tail = []; }
      var plain = String(p.key_style || data.key_style || 'plate') === 'plain';
      var wrap = document.createElement('div');
      wrap.className = 'rcl-phrase';
      var tier = document.createElement('div');
      tier.className = 'rcl-tier';
      tier.style.setProperty('--rcl-small', key.length ? small + 'em' : '0.5em');
      var mk = function (cls, words) {
        var d = document.createElement('div');
        d.className = cls;
        var spans = [];
        for (var w = 0; w < words.length; w++) {
          var sp = document.createElement('span');
          sp.className = 'rcl-w';
          sp.textContent = words[w];
          d.appendChild(sp);
          if (w < words.length - 1) d.appendChild(document.createTextNode(' '));
          spans.push(sp);
        }
        return { el: d, words: spans };
      };
      var leadB = lead.length ? mk('rcl-lead', lead) : null;
      var keyB = null, plate = null;
      if (key.length) {
        var kd = document.createElement('div');
        kd.className = 'rcl-key' + (plain ? ' plain' : '');
        if (!plain) { plate = document.createElement('span'); plate.className = 'rcl-plate'; kd.appendChild(plate); }
        var kt = mk('rcl-keytext', key);
        kt.el.style.display = 'inline';
        if (!plain) kt.el.style.color = plateInk;
        kd.appendChild(kt.el);
        keyB = { el: kd, words: kt.words };
      }
      var tailB = tail.length ? mk('rcl-tail', tail) : null;
      if (leadB) tier.appendChild(leadB.el);
      if (keyB) tier.appendChild(keyB.el);
      if (tailB) tier.appendChild(tailB.el);
      wrap.appendChild(tier);
      stack.appendChild(wrap);
      built.push({ wrap: wrap, tier: tier, lead: leadB, key: keyB, plate: plate, tail: tailB,
        start: Number(p.start) || 0, end: (p.end != null ? Number(p.end) : (Number(p.start) || 0) + 2.4) });
    }
    if (!built.length) return tl;
    // Fit: step the size down until the tier clears the lane in both axes.
    var boxW = stack.clientWidth || el.clientWidth;
    var boxH = stack.clientHeight || el.clientHeight;
    for (var b = 0; b < built.length; b++) {
      var it = built[b];
      it.wrap.style.visibility = 'hidden';
      var fs = it.key ? maxFont : Math.round(maxFont * 0.9);
      it.tier.style.fontSize = fs + 'px';
      var guard = 0;
      while (guard++ < 40 && fs > minFont && (it.tier.scrollHeight > boxH || it.tier.scrollWidth > boxW + 1 || (it.key && it.key.el.scrollWidth > boxW + 1))) {
        fs = Math.round(fs * 0.92);
        it.tier.style.fontSize = fs + 'px';
      }
    }
    // Timeline: the words land in reading order across the first 70% of
    // the phrase; the plate wipes on as the key begins; the phrase cuts out.
    for (var j = 0; j < built.length; j++) {
      var ph = built[j];
      var span = Math.max(0.4, ph.end - ph.start);
      var order = [].concat(ph.lead ? ph.lead.words : [], ph.key ? ph.key.words : [], ph.tail ? ph.tail.words : []);
      var step = Math.min(0.16, Math.max(0.03, (span * 0.7) / Math.max(1, order.length)));
      tl.set(ph.wrap, { autoAlpha: 1 }, ph.start);
      var t = ph.start;
      var landSmall = function (els, at) {
        for (var k = 0; k < els.length; k++) {
          tl.fromTo(els[k], { autoAlpha: 0, y: 10 }, { autoAlpha: 1, y: 0, duration: 0.16, ease: 'power2.out', immediateRender: false }, at + k * step);
        }
        return at + els.length * step;
      };
      if (ph.lead) t = landSmall(ph.lead.words, t);
      if (ph.key) {
        if (ph.plate) tl.fromTo(ph.plate, { clipPath: 'inset(0 100% 0 0)' }, { clipPath: 'inset(0 0% 0 0)', duration: 0.22, ease: 'power2.out', immediateRender: false }, t);
        tl.fromTo(ph.key.words, { autoAlpha: 0, scale: 0.86 }, { autoAlpha: 1, scale: 1, duration: 0.24, ease: 'back.out(2)', stagger: 0.03, immediateRender: false }, t + (ph.plate ? 0.06 : 0));
        t += ph.key.words.length * step + 0.12;
      }
      if (ph.tail) landSmall(ph.tail.words, t);
      tl.set(ph.wrap, { autoAlpha: 0 }, ph.end);
    }
    return tl;
  }
</script>
