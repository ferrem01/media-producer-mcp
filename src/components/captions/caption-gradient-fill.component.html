<template>
  <div class="cap-grad">
    <div class="cap-grad-text"></div>
  </div>
</template>

<style scoped>
  .cap-grad {

    font-family: var(--mp-font-family, 'Inter', system-ui, -apple-system, sans-serif);

  .cap-grad-text {
    font-size: 84px;
    font-weight: 800;

    letter-spacing: -0.02em;
    text-align: center;
    max-width: 90%;
    background: linear-gradient(
      100deg,
      var(--mp-color-primary, #6366f1) 0%,
      var(--mp-color-accent, #ec4899) 35%,
      #ffffff 50%,
      var(--mp-color-accent, #ec4899) 65%,
      var(--mp-color-primary, #6366f1) 100%
    );
    background-size: 300% 100%;
    background-position: 0% 50%;
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    color: transparent;
    filter: drop-shadow(0 3px 18px rgba(0, 0, 0, 0.4));
  }
</style>

<script>
  function createTimeline(el, data, ctx) {
    var tl = gsap.timeline();
    var textEl = el.querySelector('.cap-grad-text');
    if (!textEl) return tl;

    var text = (data && data.text) || 'Smooth gradient sweep';
    textEl.textContent = text;

    // Gradient stops ride brand tokens: on a dark ground raw primary/accent
    // can sit near the bg, and the gate reads the element's `color`
    // (transparent -> black) at 1.18:1 (cert). On a measured dark ground pin
    // LIGHT stops (brand hue mixed toward #f4f4f8) and a truthful white
    // `color` -- the visible fill stays the clipped gradient.
    var lum = window.mpGroundLum ? mpGroundLum() : null;
    if (typeof lum === 'number' && lum < 0.18) {
      textEl.style.backgroundImage = 'linear-gradient(100deg,' +
        'color-mix(in srgb, var(--mp-color-primary, #6366f1) 45%, #f4f4f8) 0%,' +
        'color-mix(in srgb, var(--mp-color-accent, #ec4899) 45%, #f4f4f8) 35%,' +
        '#ffffff 50%,' +
        'color-mix(in srgb, var(--mp-color-accent, #ec4899) 45%, #f4f4f8) 65%,' +
        'color-mix(in srgb, var(--mp-color-primary, #6366f1) 45%, #f4f4f8) 100%)';
      textEl.style.color = '#ffffff';
    } else if (typeof lum === 'number') {
      textEl.style.color = '#17171c'; // truthful ink for the gate on light grounds
    }

    if (text.length > 24) {
      var fs = Math.max(46, Math.round(84 * (24 / text.length) + 12));
      textEl.style.fontSize = fs + 'px';
    }

    var speed = ctx.motion === 'minimal' ? 0.6 : ctx.motion === 'punchy' ? 0.45 : 0.55;

    // Final visible state defined in CSS; animate in from below + blurred.
    gsap.set(textEl, { autoAlpha: 0, y: 30, filter: 'blur(6px) drop-shadow(0 3px 18px rgba(0,0,0,0.4))', backgroundPosition: '0% 50%' });

    tl.to(textEl, {
      autoAlpha: 1, y: 0, filter: 'blur(0px) drop-shadow(0 3px 18px rgba(0,0,0,0.4))',
      duration: speed,
      ease: 'power3.out'
    }, 0.15);

    // Gentle continuous gradient sweep across the fill
    tl.to(textEl, {
      backgroundPosition: '100% 50%',
      duration: ctx.motion === 'punchy' ? 2.2 : 3.2,
      ease: 'sine.inOut',
      yoyo: true,
      repeat: -1
    }, 0.15 + speed * 0.5);

    if (ctx.duration > 2) {
      var exitAt = ctx.duration - 0.5;
      tl.to(textEl, { autoAlpha: 0, y: -16, filter: 'blur(5px) drop-shadow(0 3px 18px rgba(0,0,0,0.4))', duration: 0.4, ease: 'power2.in' }, exitAt);
    }

    return tl;
  }
</script>
