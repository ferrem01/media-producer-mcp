<template>
  <div class="cap-blend">
    <div class="cap-blend-shape"></div>
    <div class="cap-blend-text"></div>
  </div>
</template>

<style scoped>
  .cap-blend {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 100%;
    height: 100%;
    padding: 70px;
    font-family: var(--mp-font-family, 'Inter', system-ui, -apple-system, sans-serif);
    position: relative;
    background: transparent;
    overflow: hidden;
  }

  .cap-blend-shape {
    position: absolute;
    top: 50%;
    left: 0;
    width: 46%;
    height: 130%;
    transform: translate(-60%, -50%) rotate(8deg);
    background: var(--mp-color-accent, #fbbf24);
    box-shadow: 0 0 80px var(--mp-color-glow, rgba(251, 191, 36, 0.55));
    pointer-events: none;
    z-index: 1;
    border-radius: 12px;
  }

  .cap-blend-text {
    position: relative;
    z-index: 2;
    font-size: 96px;
    font-weight: 900;
    line-height: 1.06;
    letter-spacing: -0.02em;
    text-transform: uppercase;
    text-align: center;
    max-width: 92%;
    color: var(--mp-color-text, #ffffff);
    mix-blend-mode: difference;
  }

  .cap-blend-text .dw {
    display: inline-block;
    margin: 0 0.12em;
  }
</style>

<script>
  function createTimeline(el, data, ctx) {
    var tl = gsap.timeline();
    var shape = el.querySelector('.cap-blend-shape');
    var textEl = el.querySelector('.cap-blend-text');
    if (!textEl || !shape) return tl;

    var text = (data && data.text) || 'INVERT THE FRAME';
    var words = text.split(/\s+/).filter(function (w) { return w.length; });

    if (text.length > 20) {
      var fs = Math.max(48, Math.round(96 * (20 / text.length) + 14));
      textEl.style.fontSize = fs + 'px';
    }

    textEl.innerHTML = '';
    var wordEls = [];
    for (var i = 0; i < words.length; i++) {
      var span = document.createElement('span');
      span.className = 'dw';
      span.textContent = words[i];
      textEl.appendChild(span);
      wordEls.push(span);
    }
    if (wordEls.length === 0) return tl;

    var speed = ctx.motion === 'minimal' ? 0.7 : ctx.motion === 'punchy' ? 0.45 : 0.55;
    var step = ctx.motion === 'minimal' ? 0.16 : ctx.motion === 'punchy' ? 0.09 : 0.12;

    gsap.set(textEl, { autoAlpha: 1 });
    gsap.set(wordEls, { autoAlpha: 0, scale: 0.7, y: 18, filter: 'blur(5px)' });
    gsap.set(shape, { xPercent: -160, rotation: 8 });

    var startAt = 0.2;

    // Text wipes/scales in.
    for (var k = 0; k < wordEls.length; k++) {
      tl.to(wordEls[k], {
        autoAlpha: 1, scale: 1, y: 0, filter: 'blur(0px)',
        duration: speed,
        ease: 'back.out(1.6)'
      }, startAt + k * step);
    }

    // Accent shape sweeps across behind the text, inverting it via mix-blend.
    var sweepAt = startAt + 0.1;
    var sweepDur = Math.max(1.6, (ctx.duration > 2 ? ctx.duration - 0.8 : ctx.duration) - sweepAt);
    tl.fromTo(shape,
      { xPercent: -160 },
      { xPercent: 320, duration: sweepDur, ease: 'sine.inOut' },
      sweepAt
    );

    if (ctx.duration > 2) {
      var exitAt = ctx.duration - 0.5;
      tl.to(wordEls, { autoAlpha: 0, scale: 0.8, filter: 'blur(5px)', duration: 0.35, stagger: 0.03, ease: 'power2.in' }, exitAt);
    }

    return tl;
  }
</script>
