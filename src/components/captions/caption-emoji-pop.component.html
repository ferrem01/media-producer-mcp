<template>
  <div class="cap-emoji">
    <div class="cap-emoji-row">
      <span class="cap-emoji-glyph"></span>
      <span class="cap-emoji-text"></span>
    </div>
  </div>
</template>

<style scoped>
  .cap-emoji {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 100%;
    height: 100%;
    padding: 80px;
    font-family: var(--mp-font-family, 'Inter', system-ui, -apple-system, sans-serif);
    position: relative;
    background: transparent;
  }

  .cap-emoji-row {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 0.35em;
    max-width: 90%;
    position: relative;
  }

  .cap-emoji-glyph {
    font-size: 96px;
    line-height: 1;
    display: inline-block;
    transform-origin: center bottom;
    position: relative;
    z-index: 2;
  }

  .cap-emoji-glyph:empty {
    display: none;
  }

  .cap-emoji-text {
    font-size: 72px;
    font-weight: 800;
    line-height: 1.1;
    letter-spacing: -0.02em;
    color: var(--mp-color-text, #ffffff);
    text-shadow: 0 3px 18px rgba(0, 0, 0, 0.55);
  }
</style>

<script>
  function createTimeline(el, data, ctx) {
    var tl = gsap.timeline();
    var row = el.querySelector('.cap-emoji-row');
    var glyph = el.querySelector('.cap-emoji-glyph');
    var textEl = el.querySelector('.cap-emoji-text');
    if (!row || !glyph || !textEl) return tl;

    var text = (data && data.text) || 'Let’s go!';
    var emoji = (data && data.emoji) || '🎉';
    textEl.textContent = text;
    glyph.textContent = emoji;

    if (text.length > 18) {
      var fs = Math.max(42, Math.round(72 * (18 / text.length) + 12));
      textEl.style.fontSize = fs + 'px';
      glyph.style.fontSize = Math.round(fs * 1.3) + 'px';
    }

    var speed = ctx.motion === 'minimal' ? 0.45 : ctx.motion === 'punchy' ? 0.32 : 0.4;

    gsap.set(textEl, { autoAlpha: 0, y: 26, scale: 0.94 });
    gsap.set(glyph, { autoAlpha: 0, scale: 0, rotation: -25 });

    // Text slides up first
    tl.to(textEl, { autoAlpha: 1, y: 0, scale: 1, duration: speed, ease: 'back.out(1.6)' }, 0.15);

    // Emoji pops in with overshoot + settle wobble
    var popAt = 0.3;
    tl.to(glyph, { autoAlpha: 1, scale: 1.35, rotation: 8, duration: speed * 0.7, ease: 'back.out(3)' }, popAt);
    tl.to(glyph, { scale: 1, rotation: 0, duration: speed * 0.7, ease: 'elastic.out(1, 0.4)' }, popAt + speed * 0.7);

    // Burst particles around the emoji
    var burstN = ctx.motion === 'minimal' ? 5 : 9;
    for (var i = 0; i < burstN; i++) {
      var p = document.createElement('span');
      var ang = (Math.PI * 2 * i) / burstN;
      var dist = 70 + Math.random() * 40;
      p.style.cssText = 'position:absolute;left:18%;top:50%;width:12px;height:12px;border-radius:50%;background:var(--mp-color-accent,#fbbf24);box-shadow:0 0 12px var(--mp-color-glow,rgba(251,191,36,0.7));pointer-events:none;z-index:1;';
      row.appendChild(p);
      gsap.set(p, { autoAlpha: 0, scale: 0, x: 0, y: 0 });
      tl.to(p, { autoAlpha: 1, scale: 1, x: Math.cos(ang) * dist, y: Math.sin(ang) * dist, duration: 0.4, ease: 'power2.out' }, popAt + 0.05);
      tl.to(p, { autoAlpha: 0, scale: 0.2, x: Math.cos(ang) * dist * 1.3, y: Math.sin(ang) * dist * 1.3 + 30, duration: 0.45, ease: 'power1.in' }, popAt + 0.45);
    }

    // Idle bounce on the emoji
    var idleAt = popAt + speed * 1.6;
    tl.to(glyph, { y: -14, duration: 0.7, ease: 'sine.inOut', yoyo: true, repeat: -1 }, idleAt);

    if (ctx.duration > 2) {
      var exitAt = ctx.duration - 0.5;
      tl.to([textEl, glyph], { autoAlpha: 0, y: -18, scale: 0.85, duration: 0.4, stagger: 0.05, ease: 'power2.in' }, exitAt);
    }

    return tl;
  }
</script>
