<template>
  <div class="cap-matrix">
    <div class="cap-matrix-text"></div>
  </div>
</template>

<style scoped>
  .cap-matrix {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 100%;
    height: 100%;
    padding: 70px;
    font-family: var(--mp-font-family, 'Inter', system-ui, -apple-system, sans-serif);
    position: relative;
    background: transparent;
  }

  .cap-matrix-text {
    font-size: 88px;
    font-weight: 800;
    line-height: 1.1;
    letter-spacing: 0.01em;
    text-align: center;
    max-width: 92%;
    color: var(--mp-color-text, #ffffff);
    text-shadow: 0 4px 22px rgba(0, 0, 0, 0.55);
  }

  .cap-matrix-text .mw {
    display: inline-block;
    white-space: nowrap;
  }

  .cap-matrix-text .mc {
    display: inline-block;
    transform-origin: center center;
  }

  .cap-matrix-text .mc.scrambling {
    color: var(--mp-color-accent, #34d399);
    /* Keep the scramble glyphs BRIGHT/high-contrast on any brand so the
       mid-decode state reads as intentional matrix glyphs, not muted noise. */
    filter: brightness(1.5) saturate(1.15);
    text-shadow:
      0 0 6px rgba(255, 255, 255, 0.55),
      0 0 12px var(--mp-color-accent, #34d399),
      0 0 26px var(--mp-color-glow, rgba(52, 211, 153, 0.7));
  }
</style>

<script>
  function createTimeline(el, data, ctx) {
    var tl = gsap.timeline();
    var textEl = el.querySelector('.cap-matrix-text');
    if (!textEl) return tl;

    var text = (data && data.text) || 'SYSTEM ONLINE';
    var glyphs = '!<>-_\\/[]{}=+*^?#01ABCDEFXZ';

    if (text.length > 22) {
      var fs = Math.max(46, Math.round(88 * (22 / text.length) + 14));
      textEl.style.fontSize = fs + 'px';
    }

    // Build per-char structure, keeping words intact (no wrapping mid-word).
    textEl.innerHTML = '';
    var words = text.split(/(\s+)/);
    var charEls = [];
    for (var w = 0; w < words.length; w++) {
      if (/^\s+$/.test(words[w])) {
        textEl.appendChild(document.createTextNode(' '));
        continue;
      }
      var wordSpan = document.createElement('span');
      wordSpan.className = 'mw';
      for (var c = 0; c < words[w].length; c++) {
        var charSpan = document.createElement('span');
        charSpan.className = 'mc';
        charSpan.setAttribute('data-final', words[w][c]);
        charSpan.textContent = words[w][c];
        wordSpan.appendChild(charSpan);
        charEls.push(charSpan);
      }
      textEl.appendChild(wordSpan);
    }
    if (charEls.length === 0) return tl;

    var speed = ctx.motion === 'minimal' ? 1.2 : ctx.motion === 'punchy' ? 0.7 : 0.9;
    var step = ctx.motion === 'minimal' ? 0.05 : ctx.motion === 'punchy' ? 0.025 : 0.04;

    gsap.set(textEl, { autoAlpha: 1 });
    gsap.set(charEls, { autoAlpha: 0 });

    var startAt = 0.2;
    var available = (ctx.duration > 2 ? ctx.duration - 0.7 : ctx.duration) - startAt;
    if (charEls.length > 1 && (charEls.length - 1) * step + speed > available) {
      step = Math.max(0.012, (available - speed) / Math.max(1, charEls.length - 1));
    }

    function randGlyph() {
      return glyphs.charAt(Math.floor(Math.random() * glyphs.length));
    }

    for (var i = 0; i < charEls.length; i++) {
      (function (cel, at) {
        var scramble = { p: 0 };
        var finalCh = cel.getAttribute('data-final');
        tl.set(cel, { autoAlpha: 1 }, at);
        cel.classList.add('scrambling');
        tl.to(scramble, {
          p: 1,
          duration: speed,
          ease: 'none',
          onStart: function () { cel.classList.add('scrambling'); },
          onUpdate: function () {
            if (scramble.p < 0.92) {
              cel.textContent = randGlyph();
            } else {
              cel.textContent = finalCh;
            }
          },
          onComplete: function () {
            cel.textContent = finalCh;
            cel.classList.remove('scrambling');
          }
        }, at);
      })(charEls[i], startAt + i * step);
    }

    if (ctx.duration > 2) {
      var exitAt = ctx.duration - 0.5;
      tl.to(charEls, { autoAlpha: 0, y: -14, duration: 0.35, stagger: 0.012, ease: 'power2.in' }, exitAt);
    }

    return tl;
  }
</script>
