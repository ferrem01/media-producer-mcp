<script>
  function createTimeline(el, data, ctx) {
    // Seeded, not Math.random: every render worker (and every seek after a
    // reload) builds the same layout. data.seed picks another one.
    var __seed = Math.abs(Math.round(Number(data && data.seed) || 7)) % 2147483646 + 1;
    var __rnd = function () { __seed = (__seed * 16807) % 2147483647; return (__seed - 1) / 2147483646; };
    var tl = gsap.timeline();
    var stage = el.querySelector('.cap-burst');
    var textEl = el.querySelector('.cap-burst-text');
    if (!textEl || !stage) return tl;

    var text = (data && data.text) || 'BURST INTO LIFE';
    var words = text.split(/\s+/).filter(function (w) { return w.length; });

    if (text.length > 22) {
      var fs = Math.max(46, Math.round(92 * (22 / text.length) + 14));
      textEl.style.fontSize = fs + 'px';
    }

    textEl.innerHTML = '';
    var wordEls = [];
    for (var i = 0; i < words.length; i++) {
      var span = document.createElement('span');
      span.className = 'bw';
      span.textContent = words[i];
      textEl.appendChild(span);
      wordEls.push(span);
    }
    if (wordEls.length === 0) return tl;

    var speed = ctx.motion === 'minimal' ? 0.7 : ctx.motion === 'punchy' ? 0.45 : 0.55;
    var step = ctx.motion === 'minimal' ? 0.28 : ctx.motion === 'punchy' ? 0.16 : 0.22;

    gsap.set(textEl, { autoAlpha: 1 });
    gsap.set(wordEls, { autoAlpha: 0, scale: 0.4, filter: 'blur(6px)' });

    var startAt = 0.2;
    var available = (ctx.duration > 2 ? ctx.duration - 0.8 : ctx.duration) - startAt;
    if (wordEls.length > 1 && (wordEls.length - 1) * step + speed > available) {
      step = Math.max(0.08, (available - speed) / Math.max(1, wordEls.length - 1));
    }
    // Legibility: every word must reach full opacity quickly so no word is left
    // mid-blur/muted in the early frames (the resting caption must read clean).
    var entranceEnd = 0.85;
    if (startAt + (wordEls.length - 1) * step + speed > entranceEnd) {
      step = Math.max(0.04, (entranceEnd - speed - startAt) / Math.max(1, wordEls.length - 1));
    }

    var sparkCount = ctx.motion === 'minimal' ? 6 : 10;

    for (var k = 0; k < wordEls.length; k++) {
      var at = startAt + k * step;
      var wEl = wordEls[k];

      // Word assembles inward from a burst.
      tl.to(wEl, {
        autoAlpha: 1, scale: 1, filter: 'blur(0px)',
        duration: speed,
        ease: 'back.out(1.8)'
      }, at);

      // Particles fly inward toward the word. Built NOW and flown ON the
      // timeline: they used to be created by a tl.call with free-running
      // tweens, so no seek (and no second render) could repeat them.
      (function (wordEl, sparkAt) {
        var sr = wordEl.getBoundingClientRect();
        var pr = stage.getBoundingClientRect();
        // Centre is transform-safe: the word's entrance scale is about its centre.
        var cx = sr.left - pr.left + sr.width / 2;
        var cy = sr.top - pr.top + sr.height / 2;
        for (var s = 0; s < sparkCount; s++) {
          var spark = document.createElement('div');
          spark.className = 'cap-burst-spark';
          stage.appendChild(spark);
          var ang = (Math.PI * 2 * s) / sparkCount + __rnd() * 0.6;
          var dist = 90 + __rnd() * 110;
          var sx = cx + Math.cos(ang) * dist, sy = cy + Math.sin(ang) * dist;
          gsap.set(spark, { left: sx, top: sy, scale: 0.4 + __rnd() * 0.8, autoAlpha: 0 });
          tl.to(spark, { autoAlpha: 1, duration: 0.12, ease: 'power1.out' }, sparkAt);
          tl.to(spark, { left: cx, top: cy, scale: 0, duration: speed * 0.9, ease: 'power2.in' }, sparkAt);
          tl.to(spark, { autoAlpha: 0, duration: speed * 0.3, ease: 'power1.in' }, sparkAt + speed * 0.6);
        }
      })(wEl, at);
    }

    if (ctx.duration > 2) {
      var exitAt = ctx.duration - 0.5;
      tl.to(wordEls, { autoAlpha: 0, scale: 0.7, filter: 'blur(5px)', duration: 0.35, stagger: 0.04, ease: 'power2.in' }, exitAt);
    }

    return tl;
  }
</script>
