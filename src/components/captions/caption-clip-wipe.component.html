<template>
  <div class="cap-wipe">
    <div class="cap-wipe-text"></div>
  </div>
</template>

<style scoped>

    align-items: center;

    height: 100%;
    padding: 70px;
    font-family: var(--mp-font-family, 'Inter', system-ui, -apple-system, sans-serif);

  .cap-wipe-text {
    font-size: 92px;

    line-height: 1.08;
    letter-spacing: -0.01em;
    text-align: center;
    max-width: 92%;
    color: var(--mp-color-text, #ffffff);
    text-shadow: 0 4px 22px rgba(0, 0, 0, 0.5);
  }

  .cap-wipe-text .wl {
    display: block;
    position: relative;
    overflow: hidden;
  }

  .cap-wipe-text .wl-inner {
    display: inline-block;
  }

  .cap-wipe-text .wl-bar {
    position: absolute;
    top: 0;
    bottom: 0;
    left: -10%;
    width: 14%;
    background: var(--mp-color-accent, #38bdf8);
    box-shadow: 0 0 30px var(--mp-color-glow, rgba(56, 189, 248, 0.8));
    pointer-events: none;
    z-index: 2;
  }
</style>

<script>
  function createTimeline(el, data, ctx) {
    var tl = gsap.timeline();
    var textEl = el.querySelector('.cap-wipe-text');
    if (!textEl) return tl;

    var text = (data && data.text) || 'CLEAN EDITORIAL CUT';

    if (text.length > 22) {
      var fs = Math.max(46, Math.round(92 * (22 / text.length) + 14));
      textEl.style.fontSize = fs + 'px';
    }

    // Split into lines of a few words each for an editorial stacked look.
    var words = text.split(/\s+/).filter(function (w) { return w.length; });
    var perLine = words.length > 5 ? 3 : (words.length > 2 ? 2 : 1);
    var lines = [];
    for (var i = 0; i < words.length; i += perLine) {
      lines.push(words.slice(i, i + perLine).join(' '));
    }
    if (lines.length === 0) lines = [text];

    textEl.innerHTML = '';
    var lineWraps = [];
    var inners = [];
    var bars = [];
    for (var l = 0; l < lines.length; l++) {
      var wrap = document.createElement('span');
      wrap.className = 'wl';
      var inner = document.createElement('span');
      inner.className = 'wl-inner';
      inner.textContent = lines[l];
      var bar = document.createElement('span');
      bar.className = 'wl-bar';
      wrap.appendChild(inner);
      wrap.appendChild(bar);
      textEl.appendChild(wrap);
      lineWraps.push(wrap);
      inners.push(inner);
      bars.push(bar);
    }

    var speed = ctx.motion === 'minimal' ? 0.75 : ctx.motion === 'punchy' ? 0.45 : 0.6;
    var step = ctx.motion === 'minimal' ? 0.28 : ctx.motion === 'punchy' ? 0.16 : 0.22;

    gsap.set(textEl, { autoAlpha: 1 });
    gsap.set(inners, { clipPath: 'inset(0 100% 0 0)' });
    gsap.set(bars, { autoAlpha: 0, left: '-14%' });

    var startAt = 0.2;
    var available = (ctx.duration > 2 ? ctx.duration - 0.7 : ctx.duration) - startAt;
    if (lines.length > 1 && (lines.length - 1) * step + speed > available) {
      step = Math.max(0.08, (available - speed) / Math.max(1, lines.length - 1));
    }

    for (var k = 0; k < lineWraps.length; k++) {
      var at = startAt + k * step;
      // Bar sweeps across, revealing the text behind it.
      tl.set(bars[k], { autoAlpha: 1 }, at);
      tl.fromTo(bars[k], { left: '-14%' }, { left: '100%', duration: speed, ease: 'power2.inOut' }, at);
      tl.to(inners[k], { clipPath: 'inset(0 0% 0 0)', duration: speed, ease: 'power2.inOut' }, at);
      tl.to(bars[k], { autoAlpha: 0, duration: 0.18, ease: 'power1.out' }, at + speed * 0.85);
    }

    if (ctx.duration > 2) {
      var exitAt = ctx.duration - 0.5;
      tl.to(inners, { clipPath: 'inset(0 0 0 100%)', duration: 0.4, stagger: 0.05, ease: 'power2.in' }, exitAt);
    }

    return tl;
  }
</script>
