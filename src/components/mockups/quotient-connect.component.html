<script>
  function createTimeline(el, data, ctx) {
    var tl = gsap.timeline();
    var q = function(s) { return el.querySelector(s); };
    var win = q('.qcn-window');

    var LOGO_TOKEN = 'pk_B_cdrQLyTkSFPzSMm52goQ';
    function logoUrl(svc) {
      if (svc.icon_url) return svc.icon_url;
      return 'https://img.logo.dev/' + (svc.domain || (String(svc.name || '').toLowerCase().replace(/\s+/g, '') + '.com')) +
        '?token=' + LOGO_TOKEN + '&format=png&size=64&fallback=monogram';
    }

    // Sidebar icons (tiny generic glyphs, matched to the real screen's weight)
    var NAV_ICON = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M19.1 4.9 17 7M7 17l-2.1 2.1"/></svg>';
    // The settings sidebar is part of the SETTINGS surface (it replaces the
    // main nav in the real app), so it stays by default -- but hide it when
    // composing inside quotient-app-shell's content region.
    if (data.show_sidebar === false) q('.qcn-side').style.display = 'none';
    var active = data.active_nav || 'MCP Servers';
    Array.prototype.forEach.call(el.querySelectorAll('.qcn-nav'), function(n) {
      var label = n.getAttribute('data-nav');
      n.innerHTML = NAV_ICON;
      n.appendChild(document.createTextNode(label));
      if (label === active) n.classList.add('is-active');
    });

    var DEFAULT_CONNECTED = [
      { name: 'GitHub', domain: 'github.com', desc: 'Pull development activity for changelogs and release notes', status: 'connected' },
      { name: 'Linear', domain: 'linear.app', desc: 'Access issues, projects, and comments from Linear', status: 'connected' },
      { name: 'Canva', domain: 'canva.com', desc: 'Create and manage designs, templates, and assets', status: 'connected' },
      { name: 'Attio', domain: 'attio.com', desc: 'Search, create, and manage CRM records, notes, and tasks', status: 'connected' },
    ];
    var DEFAULT_MARKET = [
      { name: 'Fathom', domain: 'fathom.video', desc: 'Access AI meeting recordings, transcripts, and summaries' },
      { name: 'Zapier', domain: 'zapier.com', desc: 'Automate workflows across 8,000+ apps' },
      { name: 'Notion', domain: 'notion.so', desc: 'Access pages, databases, and comments from Notion' },
      { name: 'Stripe', domain: 'stripe.com', desc: 'Access payment data, customers, and subscriptions' },
      { name: 'Granola', domain: 'granola.ai', desc: 'Search meeting notes and transcripts from Granola' },
    ];
    var connected = data.connected || DEFAULT_CONNECTED;
    var market = data.marketplace || DEFAULT_MARKET;

    var PILL_LABEL = { connected: 'Connected', failed: 'Failed', pending: 'Pending' };
    var PILL_CLASS = { connected: 'is-ok', failed: 'is-fail', pending: 'is-pend' };

    function buildRow(svc, section) {
      var row = document.createElement('div');
      row.className = 'qcn-row';
      var img = document.createElement('img');
      img.className = 'qcn-logo';
      img.src = logoUrl(svc);
      img.onerror = function() { this.style.visibility = 'hidden'; };
      row.appendChild(img);
      var info = document.createElement('div');
      info.className = 'qcn-info';
      var nm = document.createElement('div');
      nm.className = 'qcn-name';
      nm.textContent = svc.name;
      var ds = document.createElement('div');
      ds.className = 'qcn-desc';
      ds.textContent = svc.desc || '';
      info.appendChild(nm);
      info.appendChild(ds);
      row.appendChild(info);
      if (section === 'connected') {
        var pill = document.createElement('span');
        pill.className = 'qcn-pill ' + (PILL_CLASS[svc.status] || 'is-ok');
        pill.innerHTML = '<span class="qcn-pill-dot"></span>' + (PILL_LABEL[svc.status] || 'Connected');
        row.appendChild(pill);
        var kb = document.createElement('span');
        kb.className = 'qcn-kebab';
        kb.textContent = '⋮';
        row.appendChild(kb);
      } else {
        // Marketplace rows carry BOTH end states prebuilt: the chevron
        // (default) and a hidden Connected pill the connect action reveals --
        // the flip is a reversible timeline crossfade, never a DOM mutation.
        var pill2 = document.createElement('span');
        pill2.className = 'qcn-pill is-ok';
        pill2.innerHTML = '<span class="qcn-pill-dot"></span>Connected';
        pill2.style.visibility = 'hidden';
        pill2.style.opacity = '0';
        row.appendChild(pill2);
        var ch = document.createElement('span');
        ch.className = 'qcn-chev';
        ch.textContent = '›';
        row.appendChild(ch);
        row._pill = pill2;
        row._chev = ch;
      }
      return row;
    }

    var connectedList = q('.qcn-connected');
    var marketList = q('.qcn-marketplace');
    if (!connected.length) q('.qcn-connected-lbl').style.display = 'none';
    connected.forEach(function(svc) { connectedList.appendChild(buildRow(svc, 'connected')); });
    var marketRows = {};
    market.forEach(function(svc) {
      var row = buildRow(svc, 'market');
      marketList.appendChild(row);
      marketRows[String(svc.name).toLowerCase()] = { row: row, svc: svc };
    });

    // ── Entrance ──
    gsap.set(win, { autoAlpha: 0, y: 14 });
    tl.to(win, { autoAlpha: 1, y: 0, duration: 0.35, ease: 'power2.out' }, 0.05);
    var rows = el.querySelectorAll('.qcn-row');
    gsap.set(rows, { autoAlpha: 0, y: 8 });
    tl.to(rows, { autoAlpha: 1, y: 0, duration: 0.3, stagger: 0.035, ease: 'power2.out' }, 0.2);

    // ── Cursor targets (measured at build; modal is laid out but invisible) ──
    var shade = q('.qcn-shade');
    var modal = q('.qcn-modal');
    var allowBtn = q('.qcn-btn-dark');
    function pctTarget(node) {
      var r = node.getBoundingClientRect();
      var w = el.getBoundingClientRect();
      if (!r.width || !w.width) return null;
      return { x: ((r.left + r.width / 2 - w.left) / w.width * 100) + '%',
               y: ((r.top + r.height / 2 - w.top) / w.height * 100) + '%' };
    }
    var cursorTargets = data.cursor_targets || {};
    Object.keys(marketRows).forEach(function(k) {
      if (!cursorTargets[k]) {
        var t = pctTarget(marketRows[k].row);
        if (t) cursorTargets[k] = t;
      }
    });
    if (!cursorTargets['allow']) {
      var ta = pctTarget(allowBtn);
      if (ta) cursorTargets['allow'] = ta;
    }

    // ── Script ──
    if (Array.isArray(data.script) && data.script.length) {
      runScript(tl, el, data.script, cursorTargets, ctx, {
        'connect': function(tl2, ctr, action, at) {
          var key = String(action.service || 'fathom').toLowerCase();
          var entry = marketRows[key];
          if (!entry) return;
          var svc = entry.svc;
          q('.qcn-modal-logo').src = logoUrl(svc);
          q('.qcn-modal-title').textContent = 'Connect ' + svc.name;
          q('.qcn-modal-text').textContent = 'Quotient will be able to ' +
            ((svc.desc || 'use this service').charAt(0).toLowerCase() + (svc.desc || 'use this service').slice(1)) + '.';
          // row press flash
          tl2.fromTo(entry.row, { backgroundColor: 'rgba(236,235,248,0)' },
            { backgroundColor: '#ecebf8', duration: 0.14, yoyo: true, repeat: 1, immediateRender: false }, at);
          // OAuth modal in
          tl2.to(shade, { autoAlpha: 1, duration: 0.2 }, at + 0.3);
          tl2.fromTo(modal, { autoAlpha: 0, y: 8, scale: 0.98 },
            { autoAlpha: 1, y: 0, scale: 1, duration: 0.28, ease: 'power2.out', immediateRender: false }, at + 0.32);
          // authorize press + modal out
          var t2 = at + (action.authorize_after != null ? action.authorize_after : 1.3);
          tl2.fromTo(allowBtn, { scale: 1 }, { scale: 0.95, duration: 0.1, yoyo: true, repeat: 1 }, t2);
          tl2.to(modal, { autoAlpha: 0, y: -6, duration: 0.2, ease: 'power2.in' }, t2 + 0.25);
          tl2.to(shade, { autoAlpha: 0, duration: 0.2 }, t2 + 0.28);
          // chevron -> Connected pill (reversible crossfade)
          tl2.to(entry.row._chev, { autoAlpha: 0, duration: 0.15 }, t2 + 0.45);
          tl2.fromTo(entry.row._pill, { autoAlpha: 0, scale: 0.85 },
            { autoAlpha: 1, scale: 1, duration: 0.3, ease: 'back.out(2)', immediateRender: false }, t2 + 0.5);
          tl2.fromTo(entry.row, { backgroundColor: 'rgba(52,168,83,0)' },
            { backgroundColor: 'rgba(52,168,83,0.07)', duration: 0.3, yoyo: true, repeat: 1, immediateRender: false }, t2 + 0.5);
        },
      });
    }

    return tl;
  }
</script>
