    font-weight: 600;
    color: #41501f;
    background: #eef4d8;
    border-radius: 999px;
    padding: 8px 14px;
    white-space: nowrap;
  }
  .dsc-chart-chips { display: flex; gap: 10px; margin-top: 20px; }
  .dsc-chip { flex: 1; background: #f3f5ea; border-radius: 14px; padding: 12px 14px; }
  .dsc-chip span {
    display: block;
    font-size: 10.5px;
    font-weight: 600;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    color: rgba(24, 28, 16, 0.45);
  }
  .dsc-chip b { display: block; font-size: 17px; font-weight: 700; margin-top: 3px; }
  .dsc-chart-plot { margin-top: auto; }
  .dsc-chart-svg { position: relative; }
  .dsc-chart-svg svg { display: block; width: 100%; height: 230px; }
  .dsc-chart-svg::after {
    /* soft fade of the area fill toward the baseline (gradient look, no defs) */
    content: '';
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
    height: 42%;
    background: linear-gradient(180deg, rgba(255, 255, 255, 0) 0%, #ffffff 92%);
    pointer-events: none;
  }
  .dsc-chart-grid { stroke: rgba(24, 28, 16, 0.08); stroke-width: 0.5; fill: none; }
  .dsc-chart-days {
    display: flex;
    justify-content: space-between;
    margin-top: 10px;
    padding: 0 2px;
    font-size: 10.5px;
    font-weight: 600;
    color: rgba(24, 28, 16, 0.4);
  }

  /* ── Duo layout: MacBook center-left, iPhone overlapping front-right. ── */
  .dsc.dsc-duo .dsc-unit-macbook { transform: translateX(-90px); }
  .dsc.dsc-duo .dsc-unit-iphone {
    position: absolute;
    right: -40px;
    bottom: -60px;
    transform: scale(0.62) translateZ(120px);
    transform-origin: 100% 100%;
    z-index: 2;
  }
</style>

<script>
  function createTimeline(el, data, ctx) {
    var tl = gsap.timeline();
    data = data || {};

    var root = el.querySelector('.dsc');
    var glow = el.querySelector('.dsc-glow');
    var unitMac = el.querySelector('.dsc-unit-macbook');
    var unitPhone = el.querySelector('.dsc-unit-iphone');
    if (!root || !unitMac || !unitPhone) return tl;

    var mode = data.device === 'macbook' ? 'macbook'
      : data.device === 'duo' ? 'duo' : 'iphone';
    var theme = data.theme === 'light' ? 'light' : 'dark';
    if (theme === 'light') root.classList.add('dsc-light');
    if (mode === 'duo') root.classList.add('dsc-duo');
    if (mode === 'iphone') unitMac.style.display = 'none';
    if (mode === 'macbook') unitPhone.style.display = 'none';

    function setShot(unit, url) {
      if (!url) return;
      var shot = unit.querySelector('.dsc-shot');
      var ph = unit.querySelector('.dsc-ph');
      var app = unit.querySelector('.dsc-app');
      if (!shot) return;
      shot.src = String(url);
      shot.style.display = 'block';
      if (ph) ph.style.display = 'none';
      if (app) app.style.display = 'none';
    }
    // screenshot_url dresses the mode's lead device (MacBook in duo);
    // screenshot_url_2 dresses the duo's iPhone.
    var lead = mode === 'iphone' ? unitPhone : unitMac;
    setShot(lead, data.screenshot_url);
    if (mode === 'duo') setShot(unitPhone, data.screenshot_url_2);

    // data.screen picks a designed fitness-app preset for the iPhone screen
    // (real content, not the generic skeleton). A screenshot always wins.
    var screenKey = data.screen === 'app-hero' ? 'hero'
      : data.screen === 'app-stats' ? 'stats'
      : data.screen === 'app-chart' ? 'chart' : null;
    var phoneShot = mode === 'iphone' ? data.screenshot_url
      : mode === 'duo' ? data.screenshot_url_2 : null;
    if (screenKey && mode !== 'macbook' && !phoneShot) {
      root.classList.add('dsc-scr-' + screenKey);
      var app = unitPhone.querySelector('.dsc-app');
      var panel = unitPhone.querySelector('.dsc-app-' + screenKey);
      var phoneGeneric = unitPhone.querySelector('.dsc-ph');
      if (app && panel) {
        app.style.display = 'block';
        panel.style.display = 'flex';
        if (phoneGeneric) phoneGeneric.style.display = 'none';
        if (data.screen_title != null && data.screen_title !== '') {
          var titleEl = panel.querySelector('.dsc-hero-title');
          if (titleEl) titleEl.textContent = String(data.screen_title);
        }
        if (data.screen_value != null && data.screen_value !== '') {
          var valEl = panel.querySelector('.dsc-ring-value') || panel.querySelector('.dsc-chart-num');
          if (valEl) valEl.textContent = String(data.screen_value);
        }
        // Preset screens are placement-aware: fit the phone to its box so a
        // side-by-side trio can size each phone by its box (middle taller).
        // Measured once at build time from layout -- no wall clocks.
        var stage = el.querySelector('.dsc-stage');
        if (stage && root.clientWidth > 0 && root.clientHeight > 0) {
          var fit = Math.min(root.clientWidth / 380, root.clientHeight / 800);
          fit = Math.max(0.5, Math.min(1.6, fit));
          gsap.set(stage, { scale: fit });
        }
        // The ambient glow tints the whole (overflow-hidden) placement box and
        // shows its clipped edges on light scene backgrounds -- the designed
        // screens carry the color themselves, so drop it.
        if (glow) glow.style.display = 'none';
      }
    }

    // Fan tilt: rotate the whole stage (deg) so a trio can splay like a hand
    // of cards. GSAP-set so it composes with the fit scale above and nothing
    // else tweens the stage.
    if (data.rotate) {
      var stageRot = el.querySelector('.dsc-stage');
      if (stageRot) gsap.set(stageRot, { rotation: Number(data.rotate) });
    }

    var units = mode === 'duo' ? [unitMac, unitPhone]
      : mode === 'macbook' ? [unitMac] : [unitPhone];
    var at = Math.max(0, Number(data.at) || 0.3);
    var dur = ctx && ctx.duration ? ctx.duration : 8;

    if (glow) {
      gsap.set(glow, { autoAlpha: 0, scale: 0.6 });
      tl.to(glow, { autoAlpha: 1, scale: 1, duration: 1.0, ease: 'power2.out' }, at);
    }

    units.forEach(function (unit, i) {
      var device = unit.querySelector('.dsc-device');
      var shadow = unit.querySelector('.dsc-shadow');
      var spec = unit.querySelector('.dsc-spec');
      var start = at + i * 0.18;
      var baseY = mode === 'duo' && unit === unitPhone ? -6 : -10;
      var baseX = 4;

      // Entrance: rise + settle, the grounding shadow blooming underneath.
      gsap.set(unit, { autoAlpha: 0, y: 110 });
      gsap.set(device, { rotateY: baseY - 14, rotateX: baseX + 8, z: -160, transformPerspective: 1600 });
      if (shadow) gsap.set(shadow, { autoAlpha: 0, scaleX: 0.55, scaleY: 0.7 });
      if (spec) gsap.set(spec, { xPercent: -55 });

      tl.to(unit, { autoAlpha: 1, y: 0, duration: 1.15, ease: 'power3.out' }, start);
      tl.to(device, { rotateY: baseY, rotateX: baseX, z: 0, duration: 1.3, ease: 'power3.out' }, start);
      if (shadow) tl.to(shadow, { autoAlpha: 1, scaleX: 1, scaleY: 1, duration: 1.15, ease: 'power3.out' }, start);
      if (spec) tl.to(spec, { xPercent: 55, duration: 1.4, ease: 'power2.inOut' }, start + 0.15);

      // Float: gentle timeline-driven sway (yoyo sine repeats span the scene;
      // never wall-clock, so every seeked frame is deterministic).
      if (data.float !== false) {
        var settleAt = start + 1.3;
        var phase = i * 0.7; // duo devices drift out of phase
        tl.to(device, {
          rotateY: baseY + 7,
          rotateX: baseX - 3,
          duration: 2.8 + phase,
          ease: 'sine.inOut',
          yoyo: true,
          repeat: -1
        }, settleAt);
        tl.to(unit, {
          y: -12,
          duration: 2.3 + phase,
          ease: 'sine.inOut',
          yoyo: true,
          repeat: -1
        }, settleAt);
        if (shadow) tl.to(shadow, {
          scaleX: 0.92,
          opacity: 0.8,
          duration: 2.3 + phase,
          ease: 'sine.inOut',
          yoyo: true,
          repeat: -1
        }, settleAt);
        if (spec) tl.to(spec, {
          xPercent: 20,
          duration: 2.8 + phase,
          ease: 'sine.inOut',
          yoyo: true,
          repeat: -1
        }, settleAt);
      }
    });

    // Exit: drop back into depth before the cut.
    if (dur > 3) {
      var exitAt = dur - 0.6;
      units.forEach(function (unit) {
        var device = unit.querySelector('.dsc-device');
        tl.to(unit, { autoAlpha: 0, y: 40, duration: 0.45, ease: 'power2.in' }, exitAt);
        tl.to(device, { z: -140, duration: 0.45, ease: 'power2.in' }, exitAt);
      });
      if (glow) tl.to(glow, { autoAlpha: 0, duration: 0.45, ease: 'power2.in' }, exitAt);
    }

    return tl;
  }
</script>
