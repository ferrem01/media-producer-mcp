      var ct = hit && hit.el && hit.el.getAttribute('data-cursor-target');

    });
    if (rest.length) runScript(tl, el, rest, data.cursor_targets || {}, ctx, {});

    // ── ENTRANCE: everything a tween on tl (scrub-safe). Built AFTER the
    // script so cursor targets are measured at rest, not mid-entrance. ──
    var countUp = function (o, at, dur) {
      var prox = { n: 0 };
      o.write(0, false);
      tl.to(prox, { n: o.to, duration: dur, ease: 'power2.out', onUpdate: function () { o.write(prox.n, prox.n >= o.to, o.k, o.display); } }, at);
    };
    if (!entranceNone) {
      gsap.set(card, { autoAlpha: 0, y: 16 });
      tl.to(card, { autoAlpha: 1, y: 0, duration: 0.35, ease: 'power3.out' }, P(0.05));
      var barEl = el.querySelector('.qmc-bar');
      gsap.set(barEl, { autoAlpha: 0 });
      tl.to(barEl, { autoAlpha: 1, duration: 0.35, ease: 'power1.out' }, P(0.15));
      tiles.forEach(function (o, i) {
        var at = 0.3 + i * 0.08;
        gsap.set(o.tile, { autoAlpha: 0, y: 12 });
        tl.to(o.tile, { autoAlpha: 1, y: 0, duration: 0.4, ease: 'power2.out' }, P(at));
        countUp(o, P(at + 0.05), 1.2);
      });
      [trafficCard, delivCard].forEach(function (c, i) {
        gsap.set(c, { autoAlpha: 0, y: 18 });
        tl.to(c, { autoAlpha: 1, y: 0, duration: 0.45, ease: 'power3.out' }, P(0.7 + i * 0.1));
      });
      paths.forEach(function (p, i) {
        gsap.set(p, { strokeDasharray: 1, strokeDashoffset: 1 });
        tl.to(p, { strokeDashoffset: 0, duration: 1.5, ease: 'power2.inOut' }, P(1.0 + i * 0.15));
      });
      bars.forEach(function (b, i) {
        gsap.set(b.fill, { scaleY: 0 });
        tl.to(b.fill, { scaleY: 1, duration: 0.65, ease: 'power3.out' }, P(1.1 + i * 0.06));
      });
      if (footer) {
        gsap.set(footerEl, { autoAlpha: 0, y: 14 });
        tl.to(footerEl, { autoAlpha: 1, y: 0, duration: 0.45, ease: 'power3.out' }, P(1.45));
      }
    }

    return tl;
  }
