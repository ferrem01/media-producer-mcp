<script>
  function createTimeline(el, data, ctx) {
    var tl = gsap.timeline();
    var root = el.querySelector('.qls');
    var card = el.querySelector('.qls-card');
    var docked = !!data.docked;
    if (docked) root.classList.add('is-docked');
    if (data.show_header === false) root.classList.add('no-header');
    var num = function (v, d) { var n = Number(v); return isFinite(n) ? n : d; };
    var norm = function (s) { return String(s == null ? '' : s).toLowerCase().replace(/[^a-z0-9%]+/g, ' ').trim(); };
    var slug = function (s) { return norm(s).replace(/\s+/g, '-'); };
    var esc = function (s) { return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); };
    var accent = data.accent || '#393bf5';
    root.style.setProperty('--qls-accent', accent);
    if (data.score_color) root.style.setProperty('--qls-score', data.score_color);
    if (data.card_background) card.style.background = data.card_background;

    // ── which tab, and the layout of the People tab ──
    var tab = norm(data.tab || 'people') === 'rules' ? 'rules' : 'people';
    var w0 = el.clientWidth || 1600, h0 = el.clientHeight || 900;
    var tall = h0 > w0 * 1.1;
    var layout = data.layout || (tall ? 'stack' : 'split');
    if (['split', 'stack', 'detail', 'list'].indexOf(layout) < 0) layout = 'split';
    if (layout !== 'split') root.classList.add('is-' + layout);
    if (tall) root.classList.add('is-tall');

    // ── Size: 1u = one CSS px of the real screen. Wide: the People split is
    // ~1040 across, Rules ~1300. Tall: ~600 across so a phone reads it. ──
    var BASE = { split: [1040, 640], stack: [560, 1000], detail: [520, 700], list: [460, 640] };
    var fit = function () {
      var w = el.clientWidth || root.clientWidth || 1600, h = el.clientHeight || root.clientHeight || 900;
      var b = tab === 'rules' ? (tall ? [640, 900] : [1300, 760]) : BASE[layout];
      var u = Math.max(0.5, Math.min(w / b[0], h / b[1]) * num(data.scale, 1));

    };
    fit();
    if (typeof ResizeObserver !== 'undefined') new ResizeObserver(function () { fit(); }).observe(el);

    var tabs = [].slice.call(el.querySelectorAll('.qls-tab')).map(function (t) { return { el: t, name: t.getAttribute('data-tab') }; });
    var views = { people: el.querySelector('.qls-people'), rules: el.querySelector('.qls-rules') };
    var showTab = function (name) {
      tabs.forEach(function (t) { t.el.classList.toggle('is-active', t.name === name); });

      views.rules.classList.toggle('is-on', name === 'rules');

    var findRule = function (t) { var n = norm(t); return rules.filter(function (o) { return o.name === n; })[0] || rules.filter(function (o) { return n && o.name.indexOf(n) >= 0; })[0] || null; };
