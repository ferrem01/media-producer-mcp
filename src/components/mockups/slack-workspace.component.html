    border-left: 1px solid #e0e0e0; border-right: 1px solid #e0e0e0;
    padding: 0 4px; margin: 0 4px;
  }
  .toolbar-spacer { flex: 1; }
  .send-btn {
    width: 32px; height: 32px; border-radius: 4px;
    background: #007a5a; border: none; cursor: default;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0; opacity: 0; transition: opacity 0.15s;
  }
  .send-btn.visible { opacity: 1; }

  /* ── Thread Panel ── */
  .thread-panel {
    width: 0; overflow: hidden;
    border-left: 1px solid #e0e0e0;
    display: flex; flex-direction: column;
    background: #fff; flex-shrink: 0;
  }
  .thread-header {
    height: 52px; min-height: 52px;
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 16px;
    border-bottom: 1px solid #e0e0e0;
    flex-shrink: 0;
  }
  .thread-title-area { display: flex; flex-direction: column; }
  .thread-title { font-size: 16px; font-weight: 700; color: #1d1c1d; }
  .thread-channel { font-size: 12px; color: #616061; }
  .thread-close {
    width: 28px; height: 28px; border-radius: 6px;
    background: transparent; border: none;
    display: flex; align-items: center; justify-content: center;
    cursor: default;
  }
  .thread-close:hover { background: #f1f1f1; }
  .thread-messages {
    padding: 16px;
    border-bottom: none;
    flex-shrink: 0;
  }
  .thread-divider {
    display: flex; align-items: center; gap: 8px;
    padding: 0 16px;
    flex-shrink: 0;
  }
  .thread-divider::before, .thread-divider::after {
    content: ''; flex: 1; height: 1px; background: #e0e0e0;
  }
  .thread-reply-count {
    font-size: 13px; color: #616061; font-weight: 500;
    white-space: nowrap;
  }
  .thread-replies {
    flex: 1; overflow-y: auto;
    padding: 12px 16px;
    display: flex; flex-direction: column;
  }
  .thread-composer-wrapper { padding: 8px 12px 12px; flex-shrink: 0; }
  .thread-composer-box {
    display: flex; flex-direction: column;
    border: 1px solid #ccc; border-radius: 8px;
    min-height: 38px; background: #fff;
    overflow: hidden;
  }
  .thread-composer-input {
    padding: 8px 12px 4px; font-size: 14px;
    color: #1d1c1d; line-height: 1.5;
    min-height: 20px; outline: none; border: none;
    background: transparent; font-family: inherit;
    white-space: pre-wrap; word-wrap: break-word;
  }
  .thread-composer-input:empty::before {
    content: 'Reply...'; color: #9e9e9e;
  }
  .thread-composer-toolbar {
    display: flex; align-items: center;
    padding: 2px 8px 6px;
  }
  .thread-send-btn {
    width: 28px; height: 28px; border-radius: 4px;
    background: #007a5a;
  }
</style>

<script>
  function createTimeline(el, data, ctx) {
    var tl = gsap.timeline();
    var chat = el.querySelector('.slack-workspace');
    var messagesArea = el.querySelector('.messages-area');
    var composerInput = el.querySelector('.composer-input');
    var sendBtn = el.querySelector('[data-target="send-button"]');
    var threadPanel = el.querySelector('[data-target="thread-panel"]');
    var threadMessages = el.querySelector('[data-target="thread-messages"]');
    var threadReplies = el.querySelector('[data-target="thread-replies"]');
    var threadDivider = el.querySelector('[data-target="thread-divider"]');
    var threadReplyCount = el.querySelector('[data-target="thread-reply-count"]');
    var threadComposerInput = el.querySelector('[data-target="thread-composer-input"]');
    var threadChannel = el.querySelector('[data-target="thread-channel"]');
    var typingBar = el.querySelector('[data-target="typing-bar"]');
    var typingWho = el.querySelector('[data-target="typing-who"]');
    var channelNameHeader = el.querySelector('[data-target="channel-name-header"]');
    var channelTopicEl = el.querySelector('[data-target="channel-topic"]');
    var channelList = el.querySelector('[data-target="channel-list"]');
    var dmList = el.querySelector('[data-target="dm-list"]');
    var wsNameEl = el.querySelector('.workspace-name');
    var searchTextEl = el.querySelector('.search-text');
    var membersCountEl = el.querySelector('.members-count');

    // ── Data ──
    var workspaceName = data.workspace_name || 'Quotient';
    var channelName = data.channel_name ||
      (typeof data.channel === 'string' ? data.channel.replace(/^#/, '') : '') || 'product';
    var channelTopic = data.channel_topic || '';
    var channels = data.channels || [
      {name:'general'}, {name:'product'}, {name:'engineering'}, {name:'design'}, {name:'random'}
    ];
    var directMessages = data.direct_messages || [
      {name:'Marc Ferrentino', avatar_color:'#6366f1', online:true, initials:'MF'},
      {name:'Quotient Bot', avatar_color:'#7c3aed', online:true, initials:'QB'},
      {name:'Ed', avatar_color:'#2bac76', online:true, initials:'Ed'}
    ];
    // Normalize message field aliases: LLM-authored data drifts from the
    // schema ({author, time, body, from} for {name, timestamp, text}), and a
    // missing name used to throw in createMessageEl -- killing the whole
    // timeline and rendering an EMPTY channel. Tolerate the common aliases.
    var messages = (data.messages || []).map(function(m) {
      return {
        role: m.role || (/(bot|quotient|app)/i.test(m.name || m.author || '') ? 'bot' : 'user'),
        name: m.name || m.author || m.from || 'Teammate',
        avatar_color: m.avatar_color || m.color,
        initials: m.initials,
        text: m.text || m.body || m.message || '',
        timestamp: m.timestamp || m.time || '',
        reactions: m.reactions,
        replies: m.replies,
        unfurl: m.unfurl,
      };
    });
    var activeChannel = data.active_channel || channelName;
    var showThread = data.show_thread || false;

    // Track message elements for indexing
    var messageEls = [];
    var messageData = [];
    var threadReplyEls = [];
    var threadParentIdx = -1;
    var replyCountNum = 0;

    // ── Setup sidebar ──
    wsNameEl.textContent = workspaceName;
    searchTextEl.textContent = 'Search ' + workspaceName;
    channelNameHeader.textContent = channelName;
    if (channelTopic) channelTopicEl.textContent = channelTopic;
    composerInput.setAttribute('data-placeholder', 'Message #' + channelName);

    // Build channel list
    channels.forEach(function(ch) {
      var item = document.createElement('div');
      item.className = 'channel-item' + (ch.name === activeChannel ? ' active' : '');
      item.setAttribute('data-target', 'sidebar-channel-' + ch.name);
      var html = '<span class="ch-hash">#</span><span class="ch-name">' + ch.name + '</span>';
      if (ch.unread_count) html += '<span class="ch-badge">' + ch.unread_count + '</span>';
      item.innerHTML = html;
      channelList.appendChild(item);
    });

    // Build DM list
    directMessages.forEach(function(dm) {
      var item = document.createElement('div');
      item.className = 'dm-item';
      item.innerHTML = '<div class="dm-avatar" style="background:' + dm.avatar_color + '">' +
        (dm.initials || dm.name.charAt(0)) +
        '<div class="dm-status ' + (dm.online ? 'online' : 'offline') + '"></div></div>' +
        '<span class="dm-name">' + dm.name + '</span>';
      dmList.appendChild(item);
    });

    // ── Markdown parser ──
    function parseMd(text) {
      var html = text;
      // Code (inline)
      html = html.replace(/`([^`]+)`/g, '<code>$1</code>');
      // Bold
      html = html.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
      // Italic
      html = html.replace(/\*([^*]+)\*/g, '<em>$1</em>');
      // Strikethrough
      html = html.replace(/~([^~]+)~/g, '<s>$1</s>');
      // Links
      html = html.replace(/<(https?:\/\/[^>|]+)\|([^>]+)>/g, '<a href="$1">$2</a>');
      html = html.replace(/<(https?:\/\/[^>]+)>/g, '<a href="$1">$1</a>');
      // Newlines
      html = html.replace(/\n/g, '<br>');
      return html;
    }

    // ── Create message element ──
    function createMessageEl(msg, showFull) {
      var block = document.createElement('div');
      block.className = 'msg-block' + (showFull ? ' has-gap' : '');

      if (showFull) {
        var header = document.createElement('div');
        header.className = 'msg-header';
        var avatar = document.createElement('div');
        avatar.className = 'msg-avatar';
        avatar.style.background = msg.avatar_color || '#6366f1';
        avatar.textContent = msg.initials || String(msg.name || '?').charAt(0);
        header.appendChild(avatar);

        var meta = document.createElement('div');
        meta.className = 'msg-meta';
        meta.innerHTML = '<span class="msg-name">' + msg.name + '</span>' +
          (msg.role === 'bot' ? '<span class="msg-app-badge">APP</span>' : '') +
          '<span class="msg-time">' + (msg.timestamp || '') + '</span>';
        header.appendChild(meta);
        block.appendChild(header);
      }

      var textEl = document.createElement('div');
      textEl.className = showFull ? 'msg-text' : 'msg-text-compact';
      textEl.innerHTML = parseMd(msg.text || '');
      block.appendChild(textEl);

      // Reactions
      if (msg.reactions && msg.reactions.length > 0) {
        var rRow = document.createElement('div');
        rRow.className = 'reactions-row';
        msg.reactions.forEach(function(r) {
          var pill = document.createElement('div');
          pill.className = 'reaction-pill' + (r.active ? ' active' : '');
          pill.innerHTML = '<span class="reaction-emoji">' + r.emoji + '</span>' +
            '<span class="reaction-count">' + r.count + '</span>';
          rRow.appendChild(pill);
        });
        block.appendChild(rRow);
      }

      // Reply indicator
      if (msg.replies && msg.replies.count > 0) {
        var ri = document.createElement('div');
        ri.className = 'reply-indicator';
        var avStack = '<div class="reply-avatars">';
        (msg.replies.avatars || []).forEach(function(a) {
          avStack += '<div class="reply-avatar" style="background:' + a.color + '">' + (a.initials || '') + '</div>';
        });
        avStack += '</div>';
        ri.innerHTML = avStack +
          '<span class="reply-text">' + msg.replies.count + ' repl' + (msg.replies.count === 1 ? 'y' : 'ies') + '</span>' +
          '<span class="reply-time">Last reply ' + (msg.replies.last_reply || '') + '</span>';
        block.appendChild(ri);
      }

      // Unfurl
      if (msg.unfurl) {
        block.appendChild(createUnfurlEl(msg.unfurl));
      }

      return block;
    }

    function createUnfurlEl(u) {
      var card = document.createElement('div');
      card.className = 'unfurl-card';
      card.innerHTML = '<div class="unfurl-accent" style="background:' + (u.color || '#1264a3') + '"></div>' +
        '<div class="unfurl-body">' +
          '<div class="unfurl-site">' +
            (u.favicon ? '<img class="unfurl-favicon" src="' + u.favicon + '"/>' : '') +
            '<span>' + (u.site_name || '') + '</span>' +
          '</div>' +
          '<div class="unfurl-title">' + (u.title || '') + '</div>' +
          (u.description ? '<div class="unfurl-desc">' + u.description + '</div>' : '') +
        '</div>' +
        (u.thumbnail ? '<img class="unfurl-thumb" src="' + u.thumbnail + '"/>' : '');
      return card;
    }

    // ── Add message to channel ──
    function addMessage(msg, animate) {
      var showFull = true;
      // Check if previous message is from same user (compact mode)
      if (messageData.length > 0) {
        var prev = messageData[messageData.length - 1];
        if (prev.name === msg.name && prev.role === msg.role) {
          showFull = false;
        }
      }
      var el = createMessageEl(msg, showFull);
      messagesArea.appendChild(el);
      messageEls.push(el);
      messageData.push(msg);
      if (animate) {
        gsap.from(el, { autoAlpha: 0, y: 12, duration: 0.35, ease: 'power2.out' });
      }
      scrollToBottom();
      return el;
    }

    function scrollToBottom() {
      messagesArea.scrollTop = messagesArea.scrollHeight;
    }

    function scrollThreadToBottom() {
      threadReplies.scrollTop = threadReplies.scrollHeight;
    }

    // ── Render initial messages ──
    messages.forEach(function(msg) {
      addMessage(msg, false);
    });

    // No script? PERFORM the thread instead of rendering a static screenshot:
    // each initial message pops in in sequence, with the typing bar showing
    // who is writing before it lands. A script, when present, owns all the
    // choreography and expects the initial messages as an instant backdrop.
    var hasScript = data.script && data.script.length > 0;
    if (!hasScript && messageEls.length > 0) {
      var perfSpan = Math.min((ctx.duration || 10) * 0.6, 2.0 + messageEls.length * 1.7);
      var perfT0 = 0.5;
      var perfStep = messageEls.length > 1 ? (perfSpan - perfT0) / (messageEls.length - 1) : 0;
      var typingDots = typingBar ? typingBar.querySelectorAll('.typing-dot') : null;
      messageEls.forEach(function(mEl, mi) {
        var mAt = perfT0 + mi * perfStep;
        tl.fromTo(mEl, { autoAlpha: 0, y: 14 }, { autoAlpha: 1, y: 0, duration: 0.38, ease: 'power2.out' }, mAt);
        tl.call(scrollToBottom, null, mAt + 0.05);
        if (typingBar && typingWho && perfStep > 0.9) {
          var whoName = (messageData[mi] && messageData[mi].name) || 'Someone';
          var tAt = Math.max(0.05, mAt - Math.min(perfStep * 0.55, 1.1));
          tl.call(function() { typingWho.textContent = whoName + ' is typing'; }, null, tAt);
          tl.to(typingBar, { opacity: 1, duration: 0.15 }, tAt);
          if (typingDots && typingDots.length) {
            tl.to(typingDots, { y: -4, duration: 0.3, stagger: 0.12, ease: 'power1.inOut', yoyo: true, repeat: 3 }, tAt + 0.1);
          }
          tl.to(typingBar, { opacity: 0, duration: 0.12 }, mAt - 0.05);
        }
      });
    }

    // ── Thread helpers ──
    function renderThreadParent(idx) {
      var msg = messageData[idx];
      if (!msg) return;
      threadMessages.innerHTML = '';
      var el = createMessageEl(msg, true);
      el.classList.remove('has-gap');
      threadMessages.appendChild(el);
      threadChannel.textContent = '#' + channelName;
    }

    function addThreadReply(msg, animate) {
      var el = createMessageEl(msg, true);
      el.classList.remove('has-gap');
      threadReplies.appendChild(el);
      threadReplyEls.push(msg);
      replyCountNum = threadReplyEls.length;
      threadReplyCount.textContent = replyCountNum + ' repl' + (replyCountNum === 1 ? 'y' : 'ies');
      if (animate) {
        gsap.from(el, { autoAlpha: 0, y: 12, duration: 0.35, ease: 'power2.out' });
      }
      scrollThreadToBottom();
      return el;
    }

    // ── Add reaction to a message ──
    function addReactionToMsg(idx, emoji, count, active) {
      if (idx < 0) idx = messageEls.length + idx;
      var msgEl = messageEls[idx];
      if (!msgEl) return;
      var rRow = msgEl.querySelector('.reactions-row');
      if (!rRow) {
        rRow = document.createElement('div');
        rRow.className = 'reactions-row';
        // Insert after msg-text
        var textEl = msgEl.querySelector('.msg-text') || msgEl.querySelector('.msg-text-compact');
        if (textEl && textEl.nextSibling) {
          msgEl.insertBefore(rRow, textEl.nextSibling);
        } else {
          msgEl.appendChild(rRow);
        }
      }
      var pill = document.createElement('div');
      pill.className = 'reaction-pill' + (active ? ' active' : '');
      pill.innerHTML = '<span class="reaction-emoji">' + emoji + '</span>' +
        '<span class="reaction-count">' + (count || 1) + '</span>';
      rRow.appendChild(pill);
      gsap.from(pill, { scale: 0, duration: 0.3, ease: 'back.out(1.7)' });
    }

    // ── Add unfurl to a message ──
    function addUnfurlToMsg(idx, unfurl) {
      if (idx < 0) idx = messageEls.length + idx;
      var msgEl = messageEls[idx];
      if (!msgEl) return;
      var card = createUnfurlEl(unfurl);
      msgEl.appendChild(card);
      gsap.from(card, { autoAlpha: 0, y: 10, height: 0, duration: 0.4, ease: 'power2.out' });
      scrollToBottom();
    }

    // ── Initial state ──
    gsap.set(chat, { autoAlpha: 0 });
    var initMsgEls = messageEls.slice();
    gsap.set(initMsgEls, { autoAlpha: 0, y: 12 });

    var speed = ctx.motion === 'minimal' ? 0.4 : ctx.motion === 'punchy' ? 0.6 : 0.8;

    tl.to(chat, { autoAlpha: 1, duration: speed * 0.5, ease: 'power2.out' }, 0.2);
    var t = 0.4;
    initMsgEls.forEach(function(mel) {
      tl.to(mel, { autoAlpha: 1, y: 0, duration: 0.3, ease: 'power2.out' }, t);
      t += 0.15;
    });
    tl.call(function() { scrollToBottom(); }, null, t);

    // ── Cursor targets ──
    var cursorTargets = data.cursor_targets || {
      'composer': function() {
        var b = composerInput.getBoundingClientRect();
        var p = chat.getBoundingClientRect();
        return { x: ((b.left + b.width/2 - p.left) / p.width * 100) + '%',
                 y: ((b.top + b.height/2 - p.top) / p.height * 100) + '%' };
      },
      'send-button': function() {
        var b = sendBtn.getBoundingClientRect();
        var p = chat.getBoundingClientRect();
        return { x: ((b.left + b.width/2 - p.left) / p.width * 100) + '%',
                 y: ((b.top + b.height/2 - p.top) / p.height * 100) + '%' };
      },
      'thread-composer': function() {
        var b = threadComposerInput.getBoundingClientRect();
        var p = chat.getBoundingClientRect();
        return { x: ((b.left + b.width/2 - p.left) / p.width * 100) + '%',
                 y: ((b.top + b.height/2 - p.top) / p.height * 100) + '%' };
      },
      'thread-send': function() {
        var b = el.querySelector('[data-target="thread-send"]').getBoundingClientRect();
        var p = chat.getBoundingClientRect();
        return { x: ((b.left + b.width/2 - p.left) / p.width * 100) + '%',
                 y: ((b.top + b.height/2 - p.top) / p.height * 100) + '%' };
      },
      'message-last': function() {
        var last = messageEls[messageEls.length - 1];
        if (!last) return { x: '50%', y: '50%' };
        var b = last.getBoundingClientRect();
        var p = chat.getBoundingClientRect();
        return { x: ((b.left + b.width/2 - p.left) / p.width * 100) + '%',
                 y: ((b.top + b.height/2 - p.top) / p.height * 100) + '%' };
      }
    };

    // Add sidebar channel targets
    channels.forEach(function(ch) {
      cursorTargets['sidebar-channel-' + ch.name] = { x: '7%', y: '60%' };
    });

    // ── Script actions ──
    if (data.script && data.script.length > 0) {
      runScript(tl, el, data.script, cursorTargets, ctx, {
        'type-message': function(tl, ctr, action, at) {
          var input = ctr.querySelector('[data-target="composer-input"]');
          var sb = ctr.querySelector('[data-target="send-button"]');
          if (!input) return;
          tl.call(function() { if (sb) sb.classList.add('visible'); }, null, at);
          typeText(tl, input, action.text || '', at, action.speed || 30);
        },
        'send-message': function(tl, ctr, action, at) {
          var input = ctr.querySelector('[data-target="composer-input"]');
          var sb = ctr.querySelector('[data-target="send-button"]');
          if (!input) return;
          tl.call(function() {
            var msgText = input.textContent;
            if (!msgText) return;
            addMessage({
              role: 'user',
              name: action.name || 'You',
              avatar_color: action.avatar_color || '#2bac76',
              initials: action.initials || 'Y',
              text: msgText,
              timestamp: action.timestamp || ''
            }, true);
            input.textContent = '';
            if (sb) sb.classList.remove('visible');
          }, null, at);
        },
        'bot-message': function(tl, ctr, action, at) {
          tl.call(function() {
            // Hide typing bar
            gsap.to(typingBar, { opacity: 0, duration: 0.15 });
            var dots = typingBar.querySelectorAll('.typing-dot');
            gsap.killTweensOf(dots);
            gsap.set(dots, { y: 0 });
            addMessage({
              role: action.role || 'bot',
              name: action.name || 'Bot',
              avatar_color: action.avatar_color || '#7c3aed',
              initials: action.initials || 'B',
              text: action.text || '',
              timestamp: action.timestamp || ''
            }, true);
          }, null, at);
        },
        'add-reaction': function(tl, ctr, action, at) {
          tl.call(function() {
            var idx = action.message_index !== undefined ? action.message_index : -1;
            addReactionToMsg(idx, action.emoji || '👍', action.count || 1, action.active !== false);
          }, null, at);
        },
        'open-thread': function(tl, ctr, action, at) {
          var tp = ctr.querySelector('[data-target="thread-panel"]');
          if (!tp) return;
          tl.call(function() {
            var idx = action.message_index !== undefined ? action.message_index : messageEls.length - 1;
            threadParentIdx = idx;
            threadReplyEls = [];
            replyCountNum = 0;
            threadReplies.innerHTML = '';
            renderThreadParent(idx);
            threadDivider.style.display = 'none';
          }, null, at);
          tl.to(tp, { width: 380, duration: 0.4, ease: 'power2.out' }, at);
        },
        'close-thread': function(tl, ctr, action, at) {
          var tp = ctr.querySelector('[data-target="thread-panel"]');
          if (!tp) return;
          tl.to(tp, { width: 0, duration: 0.3, ease: 'power2.in' }, at);
        },
        'thread-reply': function(tl, ctr, action, at) {
          tl.call(function() {
            threadDivider.style.display = 'flex';
            addThreadReply({
              role: action.role || 'user',
              name: action.name || 'User',
              avatar_color: action.avatar_color || '#6366f1',
              initials: action.initials || 'U',
              text: action.text || '',
              timestamp: action.timestamp || ''
            }, true);
          }, null, at);
        },
        'type-thread': function(tl, ctr, action, at) {
          var input = ctr.querySelector('[data-target="thread-composer-input"]');
          if (!input) return;
          typeText(tl, input, action.text || '', at, action.speed || 30);
        },
        'send-thread': function(tl, ctr, action, at) {
          var input = ctr.querySelector('[data-target="thread-composer-input"]');
          if (!input) return;
          tl.call(function() {
            var msgText = input.textContent;
            if (!msgText) return;
            threadDivider.style.display = 'flex';
            addThreadReply({
              role: 'user',
              name: action.name || 'You',
              avatar_color: action.avatar_color || '#2bac76',
              initials: action.initials || 'Y',
              text: msgText,
              timestamp: action.timestamp || ''
            }, true);
            input.textContent = '';
          }, null, at);
        },
        'unfurl-link': function(tl, ctr, action, at) {
          tl.call(function() {
            var idx = action.message_index !== undefined ? action.message_index : -1;
            addUnfurlToMsg(idx, {
              color: action.color || '#1264a3',
              site_name: action.site_name || '',
              title: action.title || '',
              description: action.description || '',
              favicon: action.favicon || '',
              thumbnail: action.thumbnail || ''
            });
          }, null, at);
        },
        'show-typing-indicator': function(tl, ctr, action, at) {
          var bar = ctr.querySelector('[data-target="typing-bar"]');
          var who = ctr.querySelector('[data-target="typing-who"]');
          if (!bar) return;
          var dots = bar.querySelectorAll('.typing-dot');
          tl.call(function() {
            if (who) who.textContent = (action.name || 'Someone') + ' is typing';
          }, null, at);
          tl.to(bar, { opacity: 1, duration: 0.15 }, at);
          tl.to(dots, {
            y: -4, duration: 0.3, stagger: 0.12,
            ease: 'power1.inOut', yoyo: true, repeat: -1
          }, at + 0.1);
        },
        'hide-typing-indicator': function(tl, ctr, action, at) {
          var bar = ctr.querySelector('[data-target="typing-bar"]');
          if (!bar) return;
          var dots = bar.querySelectorAll('.typing-dot');
          tl.to(bar, { opacity: 0, duration: 0.15 }, at);
          tl.call(function() {
            gsap.killTweensOf(dots);
            gsap.set(dots, { y: 0 });
          }, null, at + 0.15);
        },
        'switch-channel': function(tl, ctr, action, at) {
          tl.call(function() {
            var newCh = action.channel || 'general';
            // Update sidebar active
            var items = ctr.querySelectorAll('.channel-item');
            items.forEach(function(item) {
              item.classList.remove('active');
              if (item.querySelector('.ch-name').textContent === newCh) {
                item.classList.add('active');
              }
            });
            // Update header
            channelNameHeader.textContent = newCh;
            composerInput.setAttribute('data-placeholder', 'Message #' + newCh);
          }, null, at);
        }
      });
    }

    return tl;
  }
</script>
