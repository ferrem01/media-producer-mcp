          td.className = 'channel-tab' + (tn === activeTab ? ' is-active' : '');
          td.textContent = tn;
          tabsEl.appendChild(td);
        });
        var plusTab = document.createElement('div');
        plusTab.className = 'channel-tab tab-plus';
        plusTab.textContent = '+';
        tabsEl.appendChild(plusTab);
      }
    }
    var searchPill = el.querySelector('[data-target="search-pill"]');
    if (searchPill && data.show_search_pill) searchPill.style.display = 'flex';
    var alsoSendLabel = el.querySelector('[data-target="thread-alsosend-label"]');
    if (alsoSendLabel) alsoSendLabel.textContent = 'Also send to #' + channelName;

    // Build channel list
    channels.forEach(function(ch) {
      var item = document.createElement('div');
      item.className = 'channel-item' + (ch.name === activeChannel ? ' active' : '');
      item.setAttribute('data-target', 'sidebar-channel-' + ch.name);
      var html = '<span class="ch-hash">#</span><span class="ch-name">' + ch.name + '</span>';
      if (ch.unread_count) html += '<span class="ch-badge">' + ch.unread_count + '</span>';
      item.innerHTML = html;
      channelList.appendChild(item);
    });

    // Build DM list
    directMessages.forEach(function(dm) {
      var item = document.createElement('div');
      item.className = 'dm-item';
      var dmUrl = dm.avatar_url || dm.avatar_image || '';
      item.innerHTML = '<div class="dm-avatar" style="' + avatarCss(dmUrl, dm.avatar_color) + '">' +
        (dm.initials || dm.name.charAt(0)) + avaImg(dmUrl) +
        '<div class="dm-status ' + (dm.online ? 'online' : 'offline') + '"></div></div>' +
        '<span class="dm-name">' + dm.name + '</span>';
      dmList.appendChild(item);
    });

    // Build Agents & apps list (the modern sidebar section). Defaults show a
    // believable roster with Quotient selected; override via data.agents_apps
    // ([{name, badge, color, active}]).
    var appsList = el.querySelector('[data-target="apps-list"]');
    var agentsApps = data.agents_apps || [
      { name: 'Brex', badge: '9+', color: '#1f1f1f', icon_url: LOGO_DEV('brex.com') },
      { name: 'Google Drive', badge: '2', color: '#0F9D58', icon_url: LOGO_DEV('google.com') },
      { name: 'Quotient', color: '#393bf5', icon_url: LOGO_DEV('getquotient.ai'), active: data.active_app !== undefined ? data.active_app === 'Quotient' : false },
      { name: 'Calendly', color: '#006BFF', icon_url: LOGO_DEV('calendly.com') },
      { name: 'Slack', color: '#611f69', icon_url: LOGO_DEV('slack.com') },
    ];
    if (appsList) agentsApps.forEach(function(app) {
      var item = document.createElement('div');
      item.className = 'app-item' + (app.active ? ' active' : '') + (app.badge && !app.active ? ' unread' : '');
      item.setAttribute('data-target', 'sidebar-app-' + app.name);
      var appUrl = app.icon_url || app.avatar_url || '';
      var html = '<div class="app-ico" style="' + avatarCss(appUrl, app.color || '#611f69') + '">' +
        String(app.name).charAt(0) + avaImg(appUrl) + '</div>' +
        '<span class="app-name">' + app.name + '</span>';
      if (app.badge) html += '<span class="app-badge">' + app.badge + '</span>';
      item.innerHTML = html;
      appsList.appendChild(item);
    });

    // Image-over-initial avatars: the colored initial block ALWAYS renders;
    // when a url is given an <img> child covers it once loaded and removes
    // itself on error -- slow or failed loads degrade to the classic look
    // instead of an invisible white square.
    function avatarCss(url, color) {
      return 'position:relative;background:' + (color || '#6366f1');
    }
    function avaImg(url) {
      return url ? '<img class="ava-img" src="' + url + '" onerror="this.remove()"/>' : '';
    }

    // ── Markdown parser ──
    function parseMd(text) {
      var html = text;
      // Code (inline)
      html = html.replace(/`([^`]+)`/g, '<code>$1</code>');
      // Bold
      html = html.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
      // Italic
      html = html.replace(/\*([^*]+)\*/g, '<em>$1</em>');
      // Strikethrough
      html = html.replace(/~([^~]+)~/g, '<s>$1</s>');
      // Links
      html = html.replace(/<(https?:\/\/[^>|]+)\|([^>]+)>/g, '<a href="$1">$2</a>');
      html = html.replace(/<(https?:\/\/[^>]+)>/g, '<a href="$1">$1</a>');
      // Mentions: @channel/@here/@everyone get the gold broadcast pill,
      // @Name gets the blue member pill (real Slack treatment).
      html = html.replace(/(^|[\s(])@(channel|here|everyone)\b/g, '$1<span class="mention mention-bcast">@$2</span>');
      html = html.replace(/(^|[\s(])@(?!channel\b|here\b|everyone\b)([A-Za-z][A-Za-z0-9._-]*(?: [A-Z][A-Za-z0-9._-]*)?)/g, '$1<span class="mention">@$2</span>');
      // Newlines
      html = html.replace(/\n/g, '<br>');
      return html;
    }

    // ── Create message element ──
    function createMessageEl(msg, showFull) {
      var block = document.createElement('div');
      block.className = 'msg-block' + (showFull ? ' has-gap' : '');

      if (showFull) {
        var header = document.createElement('div');
        header.className = 'msg-header';
        var avatar = document.createElement('div');
        avatar.className = 'msg-avatar';
        avatar.style.cssText = avatarCss(msg.avatar_url, msg.avatar_color);
        avatar.textContent = msg.initials || String(msg.name || '?').charAt(0);
        if (msg.avatar_url) avatar.insertAdjacentHTML('beforeend', avaImg(msg.avatar_url));
        header.appendChild(avatar);

        var meta = document.createElement('div');
        meta.className = 'msg-meta';
        meta.innerHTML = '<span class="msg-name">' + msg.name + '</span>' +
          (msg.role === 'bot' ? '<span class="msg-app-badge">APP</span>' : '') +
          '<span class="msg-time">' + (msg.timestamp || '') + '</span>';
        header.appendChild(meta);
        block.appendChild(header);
      }

      // App-notification grammar (real Slack): bold TITLE line, body, then a
      // blue action link on its own line ("View in Quotient").
      if (msg.title) {
        var titleEl = document.createElement('div');
        titleEl.className = 'msg-title';
        titleEl.textContent = msg.title;
        block.appendChild(titleEl);
      }
      var textEl = document.createElement('div');
      textEl.className = showFull && !msg.title ? 'msg-text' : 'msg-text-compact';
      textEl.innerHTML = parseMd(msg.text || '');
      block.appendChild(textEl);
      if (msg.link_text) {
        var linkEl = document.createElement('div');
        linkEl.className = 'msg-action-link';
        linkEl.textContent = msg.link_text;
        block.appendChild(linkEl);
      }

      // Image attachment (filename row + collapse chevron + rounded image).
      // No src -> a labeled gradient placeholder stands in for the asset.
      if (msg.attachment) {
        var att = typeof msg.attachment === 'string' ? { filename: msg.attachment } : msg.attachment;
        var ab = document.createElement('div');
        ab.className = 'attach-block';
        var chev = '<svg width="10" height="10" viewBox="0 0 12 12" fill="none" stroke="#616061" stroke-width="1.6" stroke-linecap="round"><path d="M3 4.5l3 3 3-3"/></svg>';
        ab.innerHTML = '<div class="attach-meta">' + (att.filename || 'image.png') + ' ' + chev + '</div>' +
          (att.src
            ? '<img class="attach-img" src="' + att.src + '"/>'
            : '<div class="attach-img attach-ph" style="background:linear-gradient(135deg,' +
                (att.color1 || '#7c5cff') + ',' + (att.color2 || '#3b82f6') + ')">' + (att.label || '') + '</div>');
        block.appendChild(ab);
      }

      // Reactions
      if (msg.reactions && msg.reactions.length > 0) {
        var rRow = document.createElement('div');
        rRow.className = 'reactions-row';
        msg.reactions.forEach(function(r) {
          var pill = document.createElement('div');
          pill.className = 'reaction-pill' + (r.active ? ' active' : '');
          pill.innerHTML = '<span class="reaction-emoji">' + r.emoji + '</span>' +
            '<span class="reaction-count">' + r.count + '</span>';
          rRow.appendChild(pill);
        });
        block.appendChild(rRow);
      }

      // Reply indicator
      if (msg.replies && msg.replies.count > 0) {
        var ri = document.createElement('div');
        ri.className = 'reply-indicator';
        var avStack = '<div class="reply-avatars">';
        (msg.replies.avatars || []).forEach(function(a) {
          var aUrl = a.avatar_url || a.src || '';
          avStack += '<div class="reply-avatar" style="' + avatarCss(aUrl, a.color) + '">' + (a.initials || '') + avaImg(aUrl) + '</div>';
        });
        avStack += '</div>';
        ri.innerHTML = avStack +
          '<span class="reply-text">' + msg.replies.count + ' repl' + (msg.replies.count === 1 ? 'y' : 'ies') + '</span>' +
          '<span class="reply-time">Last reply ' + (msg.replies.last_reply || '') + '</span>';
        block.appendChild(ri);
      }

      // Unfurl
      if (msg.unfurl) {
        block.appendChild(createUnfurlEl(msg.unfurl));
      }

      return block;
    }

    function createUnfurlEl(u) {
      // Rich app unfurl (the real Quotient campaign card): "Quotient v" label
      // above a white bordered card with app icon, bold title, subtitle,
      // labeled field chips (Start Date / End Date / Owner) and an "As of"
      // footer. Triggered by fields/subtitle/card; plain link unfurls keep
      // the legacy accent-bar card below.
      if (u.fields || u.subtitle || u.card === 'campaign') {
        var wrap = document.createElement('div');
        wrap.className = 'q-unfurl';
        var appName = u.app_name || u.site_name || 'Quotient';
        var chevSm = '<svg width="10" height="10" viewBox="0 0 12 12" fill="none" stroke="#616061" stroke-width="1.6" stroke-linecap="round"><path d="M3 4.5l3 3 3-3"/></svg>';
        var fieldsHtml = (u.fields || []).map(function(f) {
          var val;
          if (f.avatar || f.avatar_color) {
            val = '<span class="quf-chip"><span class="quf-ava" style="background:' + (f.avatar_color || '#6366f1') + '">' +
              (f.avatar || String(f.value || '?').charAt(0)) + '</span>' + (f.value || '') + '</span>';
          } else {
            val = '<span class="quf-chip">' + (f.value || '') + '</span>';
          }
          return '<div class="quf-field"><div class="quf-label">' + (f.label || '') + '</div>' + val + '</div>';
        }).join('');
        var qufIconUrl = u.icon_url !== undefined ? u.icon_url : (appName === 'Quotient' ? LOGO_DEV('getquotient.ai') : '');
        wrap.innerHTML = '<div class="quf-app">' + appName + ' ' + chevSm + '</div>' +
          '<div class="quf-card">' +
            '<div class="quf-head">' +
              '<div class="quf-ico" style="' + avatarCss(qufIconUrl, u.icon_color || u.color || '#393bf5') + '">' + String(appName).charAt(0) + avaImg(qufIconUrl) + '</div>' +
              '<div class="quf-titles">' +
                '<div class="quf-title">' + (u.title || '') + '</div>' +
                '<div class="quf-sub">' + (u.subtitle || 'Campaign in ' + appName) + '</div>' +
              '</div>' +
            '</div>' +
            (fieldsHtml ? '<div class="quf-fields">' + fieldsHtml + '</div>' : '') +
            (u.footer ? '<div class="quf-footer">' + u.footer + '</div>' : '') +
          '</div>';
        return wrap;
      }
      var card = document.createElement('div');
      card.className = 'unfurl-card';
      card.innerHTML = '<div class="unfurl-accent" style="background:' + (u.color || '#1264a3') + '"></div>' +
        '<div class="unfurl-body">' +
          '<div class="unfurl-site">' +
            (u.favicon ? '<img class="unfurl-favicon" src="' + u.favicon + '"/>' : '') +
            '<span>' + (u.site_name || '') + '</span>' +
          '</div>' +
          '<div class="unfurl-title">' + (u.title || '') + '</div>' +
          (u.description ? '<div class="unfurl-desc">' + u.description + '</div>' : '') +
        '</div>' +
        (u.thumbnail ? '<img class="unfurl-thumb" src="' + u.thumbnail + '"/>' : '');
      return card;
    }

    // ── Date divider (white pill on hairline; forces full header after) ──
    var forceFullNext = false;
    function addDivider(label) {
      var d = document.createElement('div');
      d.className = 'date-divider';
      d.innerHTML = '<span class="date-pill">' + label +
        ' <svg width="10" height="10" viewBox="0 0 12 12" fill="none" stroke="#1d1c1d" stroke-width="1.6" stroke-linecap="round"><path d="M3 4.5l3 3 3-3"/></svg></span>';
      messagesArea.appendChild(d);
      forceFullNext = true;
      return d;
    }

    // ── Add message to channel ──
    function addMessage(msg, animate) {
      var showFull = true;
      // Check if previous message is from same user (compact mode)
      if (messageData.length > 0) {
        var prev = messageData[messageData.length - 1];
        if (prev.name === msg.name && prev.role === msg.role) {
          showFull = false;
        }
      }
      if (forceFullNext) { showFull = true; forceFullNext = false; }
      var el = createMessageEl(msg, showFull);
      el.__mpName = msg.name;
      messagesArea.appendChild(el);
      messageEls.push(el);
      messageData.push(msg);
      if (animate) {
        gsap.from(el, { autoAlpha: 0, y: 12, duration: 0.35, ease: 'power2.out' });
      }
      scrollToBottom();
      return el;
    }

    function scrollToBottom() {
      messagesArea.scrollTop = messagesArea.scrollHeight;
    }

    function scrollThreadToBottom() {
      threadReplies.scrollTop = threadReplies.scrollHeight;
    }

    // ── Render initial messages ──
    messages.forEach(function(msg) {
      if (msg.divider) { addDivider(msg.divider); return; }
      addMessage(msg, false);
    });

    // ── Thread helpers ──
    function renderThreadParent(idx) {
      var msg = messageData[idx];
      if (!msg) return;
      threadMessages.innerHTML = '';
      var el = createMessageEl(msg, true);
      el.classList.remove('has-gap');
      threadMessages.appendChild(el);
      threadChannel.textContent = '#' + channelName;
    }

    function addThreadReply(msg, animate) {
      var el = createMessageEl(msg, true);
      el.classList.remove('has-gap');
      threadReplies.appendChild(el);
      threadReplyEls.push(msg);
      replyCountNum = threadReplyEls.length;
      threadReplyCount.textContent = replyCountNum + ' repl' + (replyCountNum === 1 ? 'y' : 'ies');
      syncReplyIndicator(msg);
      if (animate) {
        gsap.from(el, { autoAlpha: 0, y: 12, duration: 0.35, ease: 'power2.out' });
      }
      scrollThreadToBottom();
      return el;
    }

    // Keep the CHANNEL message's reply indicator in lockstep with the live
    // thread: same count as the panel divider, "last reply just now", and the
    // replier's avatar joins the stack. The seeded (static) stack is reset on
    // the first live reply so both surfaces tell one story.
    var riSynced = false;
    function syncReplyIndicator(msg) {
      if (threadParentIdx < 0) return;
      var parentEl = messageEls[threadParentIdx];
      if (!parentEl) return;
      var ri = parentEl.querySelector('.reply-indicator');
      if (!ri) {
        ri = document.createElement('div');
        ri.className = 'reply-indicator';
        ri.innerHTML = '<div class="reply-avatars"></div>' +
          '<span class="reply-text"></span><span class="reply-time"></span>';
        parentEl.appendChild(ri);
      }
      var stack = ri.querySelector('.reply-avatars');
      if (!riSynced && stack) { stack.innerHTML = ''; riSynced = true; }
      var txt = ri.querySelector('.reply-text');
      if (txt) txt.textContent = replyCountNum + ' repl' + (replyCountNum === 1 ? 'y' : 'ies');
      var tm = ri.querySelector('.reply-time');
      if (tm) tm.textContent = 'Last reply just now';
      if (stack && msg) {
        var rn = String(msg.name || '?');
        var seen = false;
        for (var si = 0; si < stack.children.length; si++) {
          if (stack.children[si].getAttribute('data-rn') === rn) { seen = true; break; }
        }
        if (!seen && stack.children.length < 5) {
          var d = document.createElement('div');
          d.className = 'reply-avatar';
          d.setAttribute('data-rn', rn);
          d.style.cssText = avatarCss(msg.avatar_url, msg.avatar_color);
          d.textContent = msg.initials || rn.charAt(0);
          if (msg.avatar_url) d.insertAdjacentHTML('beforeend', avaImg(msg.avatar_url));
          stack.appendChild(d);
        }
      }
    }

    // ── Add reaction to a message ──
    function addReactionToMsg(idx, emoji, count, active) {
      if (idx < 0) idx = messageEls.length + idx;
      var msgEl = messageEls[idx];
      if (!msgEl) return;
      var rRow = msgEl.querySelector('.reactions-row');
      if (!rRow) {
        rRow = document.createElement('div');
        rRow.className = 'reactions-row';
        // Insert after msg-text
        var textEl = msgEl.querySelector('.msg-text') || msgEl.querySelector('.msg-text-compact');
        if (textEl && textEl.nextSibling) {
          msgEl.insertBefore(rRow, textEl.nextSibling);
        } else {
          msgEl.appendChild(rRow);
        }
      }
      var pill = document.createElement('div');
      pill.className = 'reaction-pill' + (active ? ' active' : '');
      pill.innerHTML = '<span class="reaction-emoji">' + emoji + '</span>' +
        '<span class="reaction-count">' + (count || 1) + '</span>';
      rRow.appendChild(pill);
      gsap.from(pill, { scale: 0, duration: 0.3, ease: 'back.out(1.7)' });
    }

    // ── Add unfurl to a message ──
    function addUnfurlToMsg(idx, unfurl) {
      if (idx < 0) idx = messageEls.length + idx;
      var msgEl = messageEls[idx];
      if (!msgEl) return;
      var card = createUnfurlEl(unfurl);
      msgEl.appendChild(card);
      gsap.from(card, { autoAlpha: 0, y: 10, height: 0, duration: 0.4, ease: 'power2.out' });
      scrollToBottom();
    }

    // ── Bot "thinking" indicator (agent processing before it replies) ──
    var thinkingEl = null;
    function showThinking(opts) {
      opts = opts || {};
      removeThinking();
      var inThread = !!opts.in_thread;
      var name = opts.name || 'Quotient';
      var block = document.createElement('div');
      block.className = 'msg-block has-gap thinking-block';
      var thinkUrl = opts.avatar_url !== undefined ? opts.avatar_url : botAvatarUrl;
      block.innerHTML = '<div class="msg-header">' +
        '<div class="msg-avatar" style="' + avatarCss(thinkUrl, opts.avatar_color || '#393bf5') + '">' +
          (opts.initials || String(name).charAt(0)) + avaImg(thinkUrl) + '</div>' +
        '<div class="msg-meta"><span class="msg-name">' + name + '</span>' +
          '<span class="msg-app-badge">APP</span></div></div>' +
        '<div class="msg-text thinking-text"><em>' + (opts.text || 'Thinking') + '</em>' +
          '<span class="think-dots"><span>.</span><span>.</span><span>.</span></span></div>';
      var host = inThread ? threadReplies : messagesArea;
      host.appendChild(block);
      thinkingEl = block;
      gsap.from(block, { autoAlpha: 0, y: 10, duration: 0.3, ease: 'power2.out' });
      var dots = block.querySelectorAll('.think-dots span');
      gsap.set(dots, { opacity: 0.2 });
      gsap.to(dots, { opacity: 1, duration: 0.4, stagger: 0.18, repeat: -1, yoyo: true, ease: 'power1.inOut' });
      if (inThread) { scrollThreadToBottom(); } else { scrollToBottom(); }
    }
    function removeThinking() {
      if (!thinkingEl) return;
      gsap.killTweensOf(thinkingEl.querySelectorAll('.think-dots span'));
      if (thinkingEl.parentNode) thinkingEl.parentNode.removeChild(thinkingEl);
      thinkingEl = null;
    }

    // ── Hover toolbar (floating message actions card) ──
    function hoverMsg(idx) {
      if (idx < 0) idx = messageEls.length + idx;
      var msgEl = messageEls[idx];
      if (!msgEl) return;
      unhoverAll();
      msgEl.classList.add('is-hovered');
      var tb = document.createElement('div');
      tb.className = 'hover-toolbar';
      tb.innerHTML =
        '<span class="ht-btn"><svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"><circle cx="7" cy="8" r="5.5"/><path d="M4.8 9.3c.6.8 1.3 1.1 2.2 1.1s1.6-.3 2.2-1.1"/><circle cx="5.3" cy="6.8" r=".7" fill="currentColor"/><circle cx="8.7" cy="6.8" r=".7" fill="currentColor"/><path d="M13 3.5v4M11 5.5h4"/></svg></span>' +
        '<span class="ht-btn"><svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 3.5h11a1 1 0 011 1v6a1 1 0 01-1 1H6l-3.5 2.5V4.5a1 1 0 011-1z"/></svg></span>' +
        '<span class="ht-btn"><svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"><path d="M8.5 3.5L13.5 8l-5 4.5V10C5 10 3 11.5 2 13.5c0-4 2-7 6.5-7.5V3.5z"/></svg></span>' +
        '<span class="ht-btn"><svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 2.5h7v11L8 10.5 4.5 13.5v-11z"/></svg></span>' +
        '<span class="ht-btn"><svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3"><circle cx="3.5" cy="8" r="1.1" fill="currentColor" stroke="none"/><circle cx="8" cy="8" r="1.1" fill="currentColor" stroke="none"/><circle cx="12.5" cy="8" r="1.1" fill="currentColor" stroke="none"/></svg></span>';
      msgEl.appendChild(tb);
      gsap.from(tb, { autoAlpha: 0, y: 4, duration: 0.2, ease: 'power2.out' });
    }
    function unhoverAll() {
      messageEls.forEach(function(m) {
        m.classList.remove('is-hovered');
        var tb = m.querySelector('.hover-toolbar');
        if (tb) tb.remove();
      });
    }

    // ── Initial state ──
    gsap.set(chat, { autoAlpha: 0 });
    // Intro animates ALL initial children of the messages area (messages AND
    // date dividers) in document order; script-index bookkeeping (messageEls)
    // stays message-only so message_index addressing is unaffected.
    var initMsgEls = Array.prototype.slice.call(messagesArea.children);
    gsap.set(initMsgEls, { autoAlpha: 0, y: 12 });

    var speed = ctx.motion === 'minimal' ? 0.4 : ctx.motion === 'punchy' ? 0.6 : 0.8;

    tl.to(chat, { autoAlpha: 1, duration: speed * 0.5, ease: 'power2.out' }, 0.2);
    // With a script, initial messages are a fast backdrop (the script owns
    // the choreography). Without one, PERFORM the thread: pace the messages
    // across the scene's opening so the conversation reads as happening,
    // with the typing bar showing who is writing before each lands.
    var hasScript = data.script && data.script.length > 0;
    var introT0 = 0.4;
    var introStep = 0.15;
    if (!hasScript && initMsgEls.length > 1) {
      var perfSpan = Math.min((ctx.duration || 10) * 0.6, 2.0 + initMsgEls.length * 1.7);
      introStep = Math.max(0.15, (perfSpan - introT0) / (initMsgEls.length - 1));
    }
    var typingDotsEls = typingBar ? typingBar.querySelectorAll('.typing-dot') : null;
    var t = introT0;
    initMsgEls.forEach(function(mel, mi) {
      if (!hasScript && typingBar && typingWho && introStep > 0.9 && mel.__mpName) {
        var whoName = mel.__mpName || 'Someone';
        var tAt = Math.max(0.05, t - Math.min(introStep * 0.55, 1.1));
        tl.call(function() { typingWho.textContent = whoName + ' is typing'; }, null, tAt);
        tl.to(typingBar, { opacity: 1, duration: 0.15 }, tAt);
        if (typingDotsEls && typingDotsEls.length) {
          tl.to(typingDotsEls, { y: -4, duration: 0.3, stagger: 0.12, ease: 'power1.inOut', yoyo: true, repeat: 3 }, tAt + 0.1);
        }
        tl.to(typingBar, { opacity: 0, duration: 0.12 }, t - 0.05);
      }
      tl.to(mel, { autoAlpha: 1, y: 0, duration: 0.3, ease: 'power2.out' }, t);
      tl.call(scrollToBottom, null, t + 0.05);
      t += introStep;
    });

    // ── Cursor targets ──
    var cursorTargets = data.cursor_targets || {
      'composer': function() {
        var b = composerInput.getBoundingClientRect();
        var p = chat.getBoundingClientRect();
        return { x: ((b.left + b.width/2 - p.left) / p.width * 100) + '%',
                 y: ((b.top + b.height/2 - p.top) / p.height * 100) + '%' };
      },
      'send-button': function() {
        var b = sendBtn.getBoundingClientRect();
        var p = chat.getBoundingClientRect();
        return { x: ((b.left + b.width/2 - p.left) / p.width * 100) + '%',
                 y: ((b.top + b.height/2 - p.top) / p.height * 100) + '%' };
      },
      'thread-composer': function() {
        var b = threadComposerInput.getBoundingClientRect();
        var p = chat.getBoundingClientRect();
        return { x: ((b.left + b.width/2 - p.left) / p.width * 100) + '%',
                 y: ((b.top + b.height/2 - p.top) / p.height * 100) + '%' };
      },
      'thread-send': function() {
        var b = el.querySelector('[data-target="thread-send"]').getBoundingClientRect();
        var p = chat.getBoundingClientRect();
        return { x: ((b.left + b.width/2 - p.left) / p.width * 100) + '%',
                 y: ((b.top + b.height/2 - p.top) / p.height * 100) + '%' };
      },
      'message-last': function() {
        var last = messageEls[messageEls.length - 1];
        if (!last) return { x: '50%', y: '50%' };
        var b = last.getBoundingClientRect();
        var p = chat.getBoundingClientRect();
        return { x: ((b.left + b.width/2 - p.left) / p.width * 100) + '%',
                 y: ((b.top + b.height/2 - p.top) / p.height * 100) + '%' };
      }
    };

    // Add sidebar channel targets
    channels.forEach(function(ch) {
      cursorTargets['sidebar-channel-' + ch.name] = { x: '7%', y: '60%' };
    });

    // ── Script actions ──
        // Declarative shorthand -> script compilation. Storyboard LLMs reliably
    // write intent keys (composer_text, typing_indicator, bot_reply) rather
    // than script action arrays -- observed across three generations. Compile
    // the sanctioned shorthand into real script actions when no explicit
    // script is provided; an explicit script always wins.
    if ((!data.script || !data.script.length)) {
      var synth = [];
      var sDur = ctx.duration || 10;
      if (data.typing_indicator) {
        var whoT = typeof data.typing_indicator === 'string' ? data.typing_indicator : ((messages[0] || {}).name || 'Someone');
        synth.push({ action: 'show-typing-indicator', at: Math.max(0.6, sDur * 0.12), name: whoT });
        synth.push({ action: 'hide-typing-indicator', at: Math.max(1.6, sDur * 0.2) });
      }
      var sendDone = 0;
      if (data.composer_text) {
        var tAt2 = Math.max(1.0, sDur * 0.35);
        var typeDur = Math.min(2.6, Math.max(1.2, String(data.composer_text).length * 0.07));
        synth.push({ action: 'type-message', at: tAt2, text: String(data.composer_text), duration: typeDur });
        synth.push({ action: 'send-message', at: tAt2 + typeDur + 0.4 });
        sendDone = tAt2 + typeDur + 0.4;
      }
      if (data.bot_reply && (data.bot_reply.text || typeof data.bot_reply === 'string')) {
        var br = typeof data.bot_reply === 'string' ? { text: data.bot_reply } : data.bot_reply;
        var brAt = Math.max(sendDone + 1.2, Math.min(sDur - 2, sDur * 0.62));
        // bot_thinking: the agent visibly processes before it answers
        // (bot-message auto-removes the indicator when the reply lands).
        if (data.bot_thinking) {
          var bt = typeof data.bot_thinking === 'object' ? data.bot_thinking : {};
          synth.push({ action: 'thinking', at: Math.max(0.8, sendDone + 0.5), name: bt.name || br.name || 'Quotient' });
        }
        synth.push({ action: 'bot-message', at: brAt, name: br.name || 'Quotient', text: br.text });
      }
      if (synth.length) data.script = synth;
    }
    // Shared handlers for aliased script actions. The unfurl action passes
    // the whole action object through so the rich campaign-card fields
    // (subtitle, fields, footer, app_name) reach createUnfurlEl; a plain
    // {site_name, title, description} still renders the legacy link card.
    var unfurlAction = function(tl, ctr, action, at) {
      tl.call(function() {
        var idx = action.message_index !== undefined ? action.message_index : -1;
        addUnfurlToMsg(idx, action.unfurl || action);
      }, null, at);
    };
    var thinkingAction = function(tl, ctr, action, at) {
      tl.call(function() { showThinking(action); }, null, at);
    };
    if (data.script && data.script.length > 0) {
      runScript(tl, el, data.script, cursorTargets, ctx, {
        'type-message': function(tl, ctr, action, at) {
          var input = ctr.querySelector('[data-target="composer-input"]');
          var sb = ctr.querySelector('[data-target="send-button"]');
          if (!input) return;
          tl.call(function() { if (sb) sb.classList.add('visible'); }, null, at);
          typeText(tl, input, action.text || '', at, action.speed || 30);
        },
        'send-message': function(tl, ctr, action, at) {
          var input = ctr.querySelector('[data-target="composer-input"]');
          var sb = ctr.querySelector('[data-target="send-button"]');
          if (!input) return;
          tl.call(function() {
            var msgText = input.textContent;
            if (!msgText) return;
            addMessage({
              role: 'user',
              name: action.name || 'You',
              avatar_url: action.avatar_url || data.self_avatar_url || '',
              avatar_color: action.avatar_color || '#2bac76',
              initials: action.initials || 'Y',
              text: msgText,
              timestamp: action.timestamp || ''
            }, true);
            input.textContent = '';
            if (sb) sb.classList.remove('visible');
          }, null, at);
        },
        'bot-message': function(tl, ctr, action, at) {
          tl.call(function() {
            // Hide typing bar + any thinking indicator (the reply replaces it)
            removeThinking();
            gsap.to(typingBar, { opacity: 0, duration: 0.15 });
            var dots = typingBar.querySelectorAll('.typing-dot');
            gsap.killTweensOf(dots);
            gsap.set(dots, { y: 0 });
            addMessage({
              role: action.role || 'bot',
              name: action.name || 'Bot',
              avatar_url: action.avatar_url !== undefined ? action.avatar_url : ((action.role || 'bot') === 'bot' ? botAvatarUrl : ''),
              avatar_color: action.avatar_color || '#7c3aed',
              initials: action.initials || 'B',
              text: action.text || '',
              timestamp: action.timestamp || ''
            }, true);
          }, null, at);
        },
        'add-reaction': function(tl, ctr, action, at) {
          tl.call(function() {
            var idx = action.message_index !== undefined ? action.message_index : -1;
            addReactionToMsg(idx, action.emoji || '👍', action.count || 1, action.active !== false);
          }, null, at);
        },
        'open-thread': function(tl, ctr, action, at) {
          var tp = ctr.querySelector('[data-target="thread-panel"]');
          if (!tp) return;
          tl.call(function() {
            var idx = action.message_index !== undefined ? action.message_index : messageEls.length - 1;
            threadParentIdx = idx;
            threadReplyEls = [];
            replyCountNum = 0;
            riSynced = false;
            threadReplies.innerHTML = '';
            renderThreadParent(idx);
            threadDivider.style.display = 'none';
          }, null, at);
          tl.to(tp, { width: 380, duration: 0.4, ease: 'power2.out' }, at);
        },
        'close-thread': function(tl, ctr, action, at) {
          var tp = ctr.querySelector('[data-target="thread-panel"]');
          if (!tp) return;
          tl.to(tp, { width: 0, duration: 0.3, ease: 'power2.in' }, at);
        },
        'thread-reply': function(tl, ctr, action, at) {
          tl.call(function() {
            removeThinking();
            threadDivider.style.display = 'flex';
            addThreadReply({
              role: action.role || 'user',
              name: action.name || 'User',
              avatar_url: action.avatar_url !== undefined ? action.avatar_url : (action.role === 'bot' && !action.avatar_color ? botAvatarUrl : ''),
              avatar_color: action.avatar_color || '#6366f1',
              initials: action.initials || 'U',
              text: action.text || '',
              timestamp: action.timestamp || ''
            }, true);
          }, null, at);
        },
        'type-thread': function(tl, ctr, action, at) {
          var input = ctr.querySelector('[data-target="thread-composer-input"]');
          if (!input) return;
          typeText(tl, input, action.text || '', at, action.speed || 30);
        },
        'send-thread': function(tl, ctr, action, at) {
          var input = ctr.querySelector('[data-target="thread-composer-input"]');
          if (!input) return;
          tl.call(function() {
            var msgText = input.textContent;
            if (!msgText) return;
            threadDivider.style.display = 'flex';
            addThreadReply({
              role: 'user',
              name: action.name || 'You',
              avatar_url: action.avatar_url || data.self_avatar_url || '',
              avatar_color: action.avatar_color || '#2bac76',
              initials: action.initials || 'Y',
              text: msgText,
              timestamp: action.timestamp || ''
            }, true);
            input.textContent = '';
          }, null, at);
        },
        'unfurl-link': unfurlAction,
        'unfurl': unfurlAction,
        'thinking': thinkingAction,
        'show-thinking': thinkingAction,
        'hide-thinking': function(tl, ctr, action, at) {
          tl.call(removeThinking, null, at);
        },
        'hover-message': function(tl, ctr, action, at) {
          tl.call(function() {
            var idx = action.message_index !== undefined ? action.message_index : -1;
            hoverMsg(idx);
          }, null, at);
        },
        'unhover-message': function(tl, ctr, action, at) {
          tl.call(unhoverAll, null, at);
        },
        'show-typing-indicator': function(tl, ctr, action, at) {
          var bar = ctr.querySelector('[data-target="typing-bar"]');
          var who = ctr.querySelector('[data-target="typing-who"]');
          if (!bar) return;
          var dots = bar.querySelectorAll('.typing-dot');
          tl.call(function() {
            if (who) who.textContent = (action.name || 'Someone') + ' is typing';
          }, null, at);
          tl.to(bar, { opacity: 1, duration: 0.15 }, at);
          tl.to(dots, {
            y: -4, duration: 0.3, stagger: 0.12,
            ease: 'power1.inOut', yoyo: true, repeat: -1
          }, at + 0.1);
        },
        'hide-typing-indicator': function(tl, ctr, action, at) {
          var bar = ctr.querySelector('[data-target="typing-bar"]');
          if (!bar) return;
          var dots = bar.querySelectorAll('.typing-dot');
          tl.to(bar, { opacity: 0, duration: 0.15 }, at);
          tl.call(function() {
            gsap.killTweensOf(dots);
            gsap.set(dots, { y: 0 });
          }, null, at + 0.15);
        },
        'switch-channel': function(tl, ctr, action, at) {
          tl.call(function() {
            var newCh = action.channel || 'general';
            // Update sidebar active
            var items = ctr.querySelectorAll('.channel-item');
            items.forEach(function(item) {
              item.classList.remove('active');
              if (item.querySelector('.ch-name').textContent === newCh) {
                item.classList.add('active');
              }
            });
            // Update header
            channelNameHeader.textContent = newCh;
            composerInput.setAttribute('data-placeholder', 'Message #' + newCh);
          }, null, at);
        }
      });
    }

    return tl;
  }
</script>
