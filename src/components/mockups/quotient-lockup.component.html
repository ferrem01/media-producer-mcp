     loader builds it -- a + spins into x, on into -, grows two dots into a
     division sign, turns on its side and swells into the mark (a half-circle
     and a dot: a Q, a sideways division sign, a face) -- then "Quotient"
     cuts in one letter at a time beside it. An end card. */

</style>

<script>
  function createTimeline(el, data, ctx) {
    var tl = gsap.timeline();
    data = data || {};
    var root = el.querySelector('.ql'), svg = el.querySelector('.ql-svg');
    if (!root || !svg) return tl;
    var num = function (v, d) { var n = Number(v); return (v === null || v === undefined || v === '' || typeof v === 'boolean' || !isFinite(n)) ? d : n; };

    var DUR = num(ctx && ctx.duration, 5);
    var INK = String(data.color || '#31231D');
    if (data.background && data.background !== 'none') root.style.background = String(data.background);
    svg.setAttribute('fill', INK);
    // Size and place: the lockup's width as a fraction of the box, centred on (x, y).
    var LW = 989.75, LH = 176.53, MARKONLY = data.wordmark === false;
    var vw = MARKONLY ? 166.32 : LW;
    var w = W * num(data.width, MARKONLY ? 0.14 : 0.46), k = w / vw, h = LH * k;
    if (MARKONLY) svg.setAttribute('viewBox', '0 0 166.32 176.53');
    svg.style.width = w.toFixed(1) + 'px'; svg.style.height = h.toFixed(1) + 'px';
    var cx = W * num(data.x, 0.5), cy = H * num(data.y, 0.5);
    svg.style.left = (cx - w / 2).toFixed(1) + 'px'; svg.style.top = (cy - h / 2).toFixed(1) + 'px';
    var q = function (s) { return el.querySelector(s); };
    var sym = q('.ql-symbol'), stem = q('.ql-stem'), sdots = el.querySelectorAll('.ql-sdot');
    var mark = q('.ql-mark'), half = q('.ql-half'), plug = q('.ql-plug'), dot = q('.ql-dot');
    var letters = Array.prototype.slice.call(el.querySelectorAll('.ql-letter'));
    if (MARKONLY) q('.ql-word').style.display = 'none';
    var tag = q('.ql-tag');
    var TG = data.tag ? (typeof data.tag === 'object' ? data.tag : { text: data.tag }) : null;
    if (TG) {
      var tfs = Math.min(W, H) * num(TG.size, 0.03);
      tag.textContent = String(TG.text || '');
      tag.style.fontFamily = "'" + String(TG.font || 'JetBrains Mono').replace(/['"\\]/g, '') + "', ui-monospace, monospace";
      tag.style.fontSize = tfs.toFixed(1) + 'px';
      tag.style.color = String(TG.color || INK);
      tag.style.borderLeftColor = String(TG.bar || '#A34735');
      tag.style.borderLeftWidth = Math.max(2, tfs * 0.22).toFixed(1) + 'px';
      tag.style.padding = '0 ' + (tfs * 0.4).toFixed(1) + 'px 0 ' + (tfs * 0.45).toFixed(1) + 'px';
      if (TG.background) tag.style.background = String(TG.background);
      tag.style.left = (cx - tag.offsetWidth / 2).toFixed(1) + 'px';
      tag.style.top = (cy + h / 2 + h * num(TG.gap, 0.45)).toFixed(1) + 'px';

    // The loader's keyframes (percent of its 4.8 s loop, up to the mark landing

    var AT = num(data.at, 0), BUILD = Math.max(0.4, num(data.build, 2.2));
    var back = function (p, s) { p = clamp01(p); s = s || 1.7; var q2 = p - 1; return q2 * q2 * ((s + 1) * q2 + s) + 1; };

      var c = clamp01((t - AT) / BUILD) * 78;  // the loop's percent

      // "Quotient", one letter per beat.

      if (TG) tag.style.visibility = t >= num(TG.at, LAT + letters.length * LSTEP + 0.2) ? 'inherit' : 'hidden';
