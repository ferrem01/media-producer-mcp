    var metaWrap = el.querySelector('.qmv-meta');
    var metaRows = meta.map(function (m) {
      var r = document.createElement('div');
      r.className = 'qmv-mrow';
      r.innerHTML = '<div class="qmv-mlab">' + icon(m.icon || 'info') + '<span>' + esc(m.label) + '</span></div><div class="qmv-mval">' + esc(m.value) + '</div>';
      metaWrap.appendChild(r);
      addThing(m.label, r, 'meta');
      addThing(m.value, r.querySelector('.qmv-mval'), 'text');
      return r;
    });

    // Tabs
    var tabsWrap = el.querySelector('.qmv-tabs');
    var tabEls = tabs.map(function (t) {
      var a = document.createElement('div');
      a.className = 'qmv-tab';
      a.innerHTML = icon(t.icon) + '<span>' + esc(t.label) + '</span>';
      tabsWrap.appendChild(a);
      addThing(t.label, a, 'tab');
      addThing('tab ' + t.label, a, 'tab');
      return a;
    });
    var tabIndex = function (name) {
      var n = norm(name);
      for (var i = 0; i < tabs.length; i++) if (norm(tabs[i].label) === n) return i;
      return -1;
    };
    var setTab = function (i) { tabEls.forEach(function (t, j) { t.classList.toggle('is-active', j === i); }); };
    var curTab = tabIndex(activeTab);
    setTab(curTab);

    // KPI tiles
    var kWrap = el.querySelector('.qmv-kpis');
    var tiles = kpis.map(function (k) {
      var t = document.createElement('div');
      t.className = 'qmv-card2 qmv-kpi';
      t.innerHTML = '<div class="qmv-kpi-head"><div class="qmv-kpi-label">' + esc(k.label) + '</div>' + icon(k.icon || 'users', color(k.color, '#155dfc')) + '</div>' +
        '<div class="qmv-kpi-value"></div><p class="qmv-kpi-cap">' + esc(k.caption || '') + '</p>';
      kWrap.appendChild(t);
      var n = { el: t.querySelector('.qmv-kpi-value'), to: num(k.value, 0), spec: k, display: k.display, host: t };
      numbers.push(n);
      addThing(k.label, t, 'kpi', { num: n, scope: 'kpis' });
      return t;
    });

    // Rate cards
    var rateCard = function (host, c, scope) {
      host.innerHTML = '<h3 class="qmv-rate-title">' + icon(c.icon) + '<span>' + esc(c.title) + '</span></h3>' +
        '<div class="qmv-rate-big" style="color:' + esc(color(c.color, '#009966')) + '"></div>' +
        '<p class="qmv-rate-cap">' + esc(c.caption || '') + '</p><div class="qmv-rows"></div>';
      var spec = Object.assign({ format: 'percent' }, c.rate_format ? { format: c.rate_format } : {}, { decimals: c.decimals, prefix: c.prefix, suffix: c.suffix });
      var big = { el: host.querySelector('.qmv-rate-big'), to: num(c.rate, 0), spec: spec, display: c.display, host: host };
      numbers.push(big);
      addThing(c.title, host, 'rate', { num: big, scope: scope });
      addThing(scope, host, 'rate', { num: big, scope: scope });
      var rw = host.querySelector('.qmv-rows');
      var rows = (c.rows || []).map(function (r, i, arr) {
        var d = document.createElement('div');
        var isTotal = r.total != null ? !!r.total : (i === arr.length - 1 && arr.length > 2);
        d.className = 'qmv-row' + (isTotal ? ' is-total' : '');
        d.innerHTML = '<span class="qmv-row-lab">' + esc(r.label) + '</span><span class="qmv-row-val"></span>';
        rw.appendChild(d);
        var n = { el: d.querySelector('.qmv-row-val'), to: num(r.value, 0), spec: r, display: r.display, host: d, row: true };
        numbers.push(n);
        addThing(r.label, d, 'row', { num: n, scope: scope });
        return d;
      });
      return { host: host, big: big, rows: rows };
    };
    var att = rateCard(el.querySelector('.qmv-rate-att'), attendance, 'attendance');
    var reg = rateCard(el.querySelector('.qmv-rate-reg'), registration, 'registration');

    // Breakdown (below the fold)
    var bWrap = el.querySelector('.qmv-break');
    var bRows = [];
    if (!breakdown) bWrap.style.display = 'none';
    else {
      el.querySelector('.qmv-break-title').textContent = breakdown.title || '';
      addThing(breakdown.title, bWrap, 'card', { scope: 'breakdown' });
      var base = num(breakdown.total, 0) || Math.max.apply(null, (breakdown.rows || []).map(function (r) { return num(r.value, 0); }).concat([1]));
      var rowsHost = el.querySelector('.qmv-break-rows');
      bRows = (breakdown.rows || []).map(function (r, i) {
        var d = document.createElement('div');
        d.className = 'qmv-brow';
        d.innerHTML = '<div class="qmv-brow-top"><span class="qmv-brow-lab">' + esc(r.label) + '</span><span class="qmv-brow-val"></span></div>' +
          '<div class="qmv-track"><div class="qmv-fill"></div></div>';
        rowsHost.appendChild(d);
        var fill = d.querySelector('.qmv-fill');
        fill.style.background = color(r.color, '#bedbff');
        var pctOf = function (v) { return r.pct != null && v === num(r.value, 0) ? num(r.pct, 0) : (v / base) * 100; };
        var valEl = d.querySelector('.qmv-brow-val');
        var n = {
          el: valEl, to: num(r.value, 0), spec: r, display: r.display, host: d, fill: fill,
          write: function (v) { valEl.textContent = fmt(Math.round(v), r) + ' (' + Math.round(pctOf(v)) + '%)'; },
          pct: function (v) { return Math.max(0, Math.min(100, pctOf(v))); }
        };
        numbers.push(n);
        addThing(r.label, d, 'brow', { num: n, scope: 'breakdown' });
        return n;
      });
    }
    numbers.forEach(function (n) {
      if (!n.write) n.write = function (v) { n.el.textContent = fmt(n.spec.format === 'percent' || (n.spec.decimals > 0) ? v : Math.round(v), n.spec); };
      n.settle = function () { if (n.display != null) n.el.textContent = String(n.display); else n.write(n.to); };
      n.settle();
    });
    bRows.forEach(function (n) { n.fill.style.width = n.pct(n.to) + '%'; });

    // ── Fit: 1em = 10 capture px. Width drives it; the height caps it so the
    // page down to the rate cards stands in the box (the breakdown is below). ──
    var fit = function () {
      var w = el.clientWidth || 1799, h = el.clientHeight || 961;
      var inW = w - (data.docked ? 0 : 8), inH = h - (data.docked ? 0 : 12);
      var FOLD_EM = 71.5;
      var em = Math.min(inW / 128.6, inH / FOLD_EM) * num(data.scale, 1);
      root.style.fontSize = Math.max(6, em) + 'px';
    };
    fit();
    if (typeof ResizeObserver !== 'undefined') new ResizeObserver(function () { fit(); }).observe(el);
    var emPx = function () { return parseFloat(root.style.fontSize) || 14; };

    // ── Scroll (the page slides inside the card; scrub-safe via a proxy in em) ──
    var scrollState = { y: 0 };
    var writeScroll = function () { page.style.transform = 'translate3d(0,' + (-scrollState.y) + 'em,0)'; };
    var maxScroll = function () { return Math.max(0, (page.offsetHeight - card.clientHeight) / emPx()); };
    var scrollTo = function (to) {
      if (typeof to === 'number') return Math.max(0, Math.min(maxScroll(), to));
      var n = norm(to);
      if (n === 'top' || n === '') return 0;
      if (n === 'bottom' || n === 'end') return maxScroll();
      var tgt = page.querySelector('[data-anchor="' + n + '"]') || (find(to) || {}).el;
      if (!tgt) return 0;
      var r = tgt.getBoundingClientRect(), pr = page.getBoundingClientRect();
      var z = el.offsetWidth ? el.getBoundingClientRect().width / el.offsetWidth : 1;
      return Math.max(0, Math.min(maxScroll(), ((r.top - pr.top) / z) / emPx() - 2.4));
    };

    // ── Find a thing by its words: exact name first (kpis before rows), then contains. ──
    var KIND_ORDER = { kpi: 1, rate: 2, tab: 3, button: 4, card: 5, meta: 6, row: 7, brow: 8, text: 9 };
    function find(target, scope, wantNum) {
      if (target == null) return null;
      var n = norm(target), sc = scope ? norm(scope) : null;
      var dot = /^(attendance|registration|breakdown|kpis)\s*[.>]\s*(.+)$/.exec(n);
      if (dot) { sc = dot[1]; n = dot[2]; }
      var pool = things.filter(function (t) { return (!sc || t.scope === sc) && (!wantNum || t.num); });
      pool.sort(function (a, b) { return (KIND_ORDER[a.kind] || 9) - (KIND_ORDER[b.kind] || 9); });
      for (var i = 0; i < pool.length; i++) if (pool[i].name === n) return pool[i];
      for (var j = 0; j < pool.length; j++) if (pool[j].name.indexOf(n) >= 0) return pool[j];
      if (!wantNum) {
        var an = el.querySelector('[data-anchor="' + n.replace(/"/g, '') + '"]');
        if (an) return { el: an, kind: 'card', name: n };
      }
      return null;
    }

    // Where a thing sits (box px) at a timeline moment -- the cursor aims here.
    var scrollAt = [];   // [{at, dur, from, to}] in timeline order
    var scrollYAt = function (t) {
      var y = num(data.scroll_em, 0);
      scrollAt.forEach(function (s) { if (t >= s.at + s.dur) y = s.to; else if (t > s.at) y = s.from + (s.to - s.from) * ((t - s.at) / s.dur); });
      return y;
    };
    var boxOf = function (target) {
      var th = find(target);
      if (!th) return null;
      var c = el.getBoundingClientRect(), r = th.el.getBoundingClientRect();
      var z = el.offsetWidth ? c.width / el.offsetWidth : 1;
      if (!z || !isFinite(z)) z = 1;
      return { x: ((r.left - c.left) + r.width / 2) / z, y: ((r.top - c.top) + r.height / 2) / z, w: r.width / z, h: r.height / z, y0: scrollState.y };
    };

    // Initial scroll (data.scroll: 'top' | 'breakdown' | anchor | em number)
    if (data.scroll != null) scrollState.y = scrollTo(data.scroll);
    writeScroll();

    // ── Measure cursor targets BEFORE any entrance offsets are set ──
    var script = Array.isArray(data.script) ? data.script.slice() : [];
    var CURSOR = { 'move-cursor': 1, click: 1, 'double-click': 1, hover: 1, 'right-click': 1, 'hide-cursor': 1, 'show-cursor': 1, wait: 1, drag: 1, parallel: 1 };
    var OWN = { count: 1, highlight: 1, 'switch-tab': 1, scroll: 1, 'set-text': 1 };
    // Scroll schedule first (cursor aims depend on it).
    script.filter(function (a) { return a && a.action === 'scroll'; })
      .sort(function (a, b) { return num(a.at, 0) - num(b.at, 0); })
      .forEach(function (a) {
        var prev = scrollAt.length ? scrollAt[scrollAt.length - 1].to : scrollState.y;
        scrollAt.push({ at: num(a.at, 0), dur: num(a.duration, 0.9), from: prev, to: scrollTo(a.to != null ? a.to : a.target), ease: a.ease });
      });
    var cursorTargets = Object.assign({}, data.cursor_targets || {});
    var measured = {};
    script.forEach(function (a) {
      if (!a || !CURSOR[a.action] || !a.target || has(cursorTargets, a.target)) return;
      var b = boxOf(a.target);
      if (!b) return;
      measured[a.target] = b;
      cursorTargets[a.target] = (function (bx) {
        return function (at) { return { x: bx.x, y: bx.y + (bx.y0 - scrollYAt(at)) * emPx(), w: bx.w, h: bx.h }; };
      })(b);
    });

    // ── Entrance performance (everything ON the timeline; scrub-safe) ──
    var AT = num(data.at, 0);
    var P = function (t) { return Math.max(0, t + AT); };
    var still = data.entrance === 'none';
    var roll = function (n, at, dur, from) {
      var o = { v: from == null ? 0 : from };
      tl.to(o, { v: n.to, duration: dur, ease: 'power2.out',
        onUpdate: function () { if (o.v >= n.to && n.display != null) n.el.textContent = String(n.display); else n.write(o.v); } }, at);
      if (n.fill) {
        gsap.set(n.fill, { width: '0%' });
        tl.to(n.fill, { width: n.pct(n.to) + '%', duration: dur, ease: 'power3.out' }, at);
      }
      n.write(from == null ? 0 : from);
    };
    if (!still) {
      if (!data.docked) {
        gsap.set(card, { autoAlpha: 0, y: 16 });
        tl.to(card, { autoAlpha: 1, y: 0, duration: 0.35, ease: 'power3.out' }, P(0.05));
      }
      var headBits = [titleEl, el.querySelector('.qmv-actions')].concat(metaRows);
      gsap.set(headBits, { autoAlpha: 0, y: 8 });
      tl.to(headBits, { autoAlpha: 1, y: 0, duration: 0.4, ease: 'power2.out', stagger: 0.06 }, P(0.12));
      gsap.set(ringFill, { strokeDashoffset: ringOff(0) });
      tl.to(ringFill, { strokeDashoffset: ringOff(campPct), duration: 0.8, ease: 'power2.inOut' }, P(0.4));
      gsap.set(tabsWrap, { autoAlpha: 0, y: 6 });
      tl.to(tabsWrap, { autoAlpha: 1, y: 0, duration: 0.35, ease: 'power2.out' }, P(0.3));

      tiles.forEach(function (t, i) {
        var at = 0.45 + i * 0.1;
        gsap.set(t, { autoAlpha: 0, y: 14 });
        tl.to(t, { autoAlpha: 1, y: 0, duration: 0.45, ease: 'power3.out' }, P(at));
        roll(numbers.filter(function (n) { return n.host === t; })[0], P(at + 0.08), 1.2);
      });
      [att, reg].forEach(function (c, i) {
        var at = 0.9 + i * 0.12;
        gsap.set(c.host, { autoAlpha: 0, y: 16 });
        tl.to(c.host, { autoAlpha: 1, y: 0, duration: 0.5, ease: 'power3.out' }, P(at));
        roll(c.big, P(at + 0.12), 1.3);
        c.rows.forEach(function (r, j) {
          var rat = at + 0.35 + j * 0.09;
          gsap.set(r, { autoAlpha: 0, x: -10 });
          tl.to(r, { autoAlpha: 1, x: 0, duration: 0.35, ease: 'power2.out' }, P(rat));
          roll(numbers.filter(function (n) { return n.host === r; })[0], P(rat), 0.8);
        });
      });
      if (breakdown) {
        gsap.set(bWrap, { autoAlpha: 0, y: 16 });
        tl.to(bWrap, { autoAlpha: 1, y: 0, duration: 0.5, ease: 'power3.out' }, P(1.25));
        bRows.forEach(function (n, i) { roll(n, P(1.45 + i * 0.1), 1.0); });
      }
    }

    // ── Script: own verbs here, cursor verbs to the shared runner ──
    var step = function (at, fwd, back) {
      var o = { p: 0 };
      tl.to(o, { p: 1, duration: 0.02, ease: 'none', onUpdate: function () { if (o.p >= 1) fwd(); else back(); } }, at);
    };
    var running = new Map();   // number -> value it holds after the previous count
    script.slice().sort(function (a, b) { return num(a.at, 0) - num(b.at, 0); }).forEach(function (a) {
      if (!a || !OWN[a.action]) return;
      var at = num(a.at, 0);
      if (a.action === 'count') {
        var th = find(a.target, a.scope, true);
        if (!th) return;
        var n = th.num, from = running.has(n) ? running.get(n) : n.to, to = num(a.to, from);
        var o = { v: from }, disp = a.display, spec = a.format ? Object.assign({}, n.spec, { format: a.format }) : n.spec;
        var w = function (v) { if (n.fill) n.write(v); else n.el.textContent = fmt(spec.format === 'percent' || spec.decimals > 0 ? v : Math.round(v), spec); };
        var dur = num(a.duration, 1.2);
        tl.to(o, { v: to, duration: dur, ease: a.ease || 'power2.out', immediateRender: false,
          onUpdate: function () { if (disp != null && o.v === to) n.el.textContent = String(disp); else w(o.v); } }, at);
        if (n.fill) tl.fromTo(n.fill, { width: n.pct(from) + '%' }, { width: n.pct(to) + '%', duration: dur, ease: a.ease || 'power2.out', immediateRender: false }, at);
        running.set(n, to);
        if (a.highlight) a = Object.assign({}, a, { action: 'highlight', duration: dur + 0.8 });
        else return;
      }
      if (a.action === 'highlight') {
        var h = find(a.target, a.scope);
        if (!h) return;
        var ring = document.createElement('div');
        ring.className = 'qmv-hl';
        if (a.color) { ring.style.borderColor = a.color; ring.style.background = rgba(a.color, 0.08); }
        h.el.appendChild(ring);
        var hold = num(a.duration, 1.6);
        tl.fromTo(ring, { autoAlpha: 0, scale: 1.04 }, { autoAlpha: 1, scale: 1, duration: 0.3, ease: 'power2.out', immediateRender: false }, at);
        tl.to(ring, { autoAlpha: 0, duration: 0.4, ease: 'power2.in' }, at + 0.3 + hold);
        return;
      }
      if (a.action === 'switch-tab') {
        var ti = tabIndex(a.to != null ? a.to : a.target);
        if (ti < 0) return;
        var prevTab = curTab;
        step(at, function () { setTab(ti); }, function () { setTab(prevTab); });
        curTab = ti;
        return;
      }
      if (a.action === 'scroll') {
        var s = scrollAt.filter(function (x) { return x.at === at; })[0];
        if (!s) return;
        tl.fromTo(scrollState, { y: s.from }, { y: s.to, duration: s.dur, ease: s.ease || 'power2.inOut', immediateRender: false, onUpdate: writeScroll }, at);
        return;
      }
      if (a.action === 'set-text') {
        var st = find(a.target != null ? a.target : a.text);
        if (!st) return;
        var tEl = st.el.querySelector('.qmv-kpi-label, .qmv-rate-title span, .qmv-row-lab, .qmv-brow-lab, .qmv-chip-name, .qmv-threads-txt, .qmv-mval, .qmv-tab span') || st.el;
        if (st.kind === 'meta') tEl = st.el.querySelector('.qmv-mval');
        var before = tEl.textContent, after = String(a.to != null ? a.to : '');
        step(at, function () { tEl.textContent = after; }, function () { tEl.textContent = before; });
      }
    });
    var cursorScript = script.filter(function (a) { return a && CURSOR[a.action]; });
    if (cursorScript.length) runScript(tl, el, cursorScript, cursorTargets, ctx, {});

    // Published for films/tests: where the numbers settle, and the anchors.
    root.setAttribute('data-anchors', 'header,tabs,kpis,attendance,registration' + (breakdown ? ',breakdown' : ''));
    return tl;
  }
</script>
