<template>
  <div class="pls-root">
    <div class="pls-stage">
      <div class="pls-label"></div>
      <div class="pls-clock">
        <div class="pls-date"></div>
        <div class="pls-time"></div>
      </div>
      <div class="pls-stack"></div>
      <div class="pls-stamp"></div>
    </div>
  </div>
</template>

<style>
  /* A phone's lock screen, designed at 1080px wide (a 9x16 frame) and
     scaled to its box: the clock, a stack of notifications that land one by
     one (newest on top, the way a phone stacks them), and an optional stamp
     that slams onto the newest one -- the "this went wrong" beat. */
  /* The scene's `.mp-component * { max-width: 100% }` squeezed the
     1080-wide stage to a half-width box before the scale applied: two
     phones side by side came out with sliver notifications. */
  .pls-root, .pls-root * { max-width: none; }
  .pls-root { position: relative; width: 100%; height: 100%; overflow: hidden; border-radius: inherit; }
  .pls-label {
    position: absolute; top: 96px; left: 0; width: 100%; text-align: center;
    font-size: 104px; font-weight: 800; letter-spacing: -2px; line-height: 1;
  }
  .pls-stage {
    position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; transform-origin: 0 0;
    font-family: Inter, -apple-system, 'SF Pro Display', 'Segoe UI', Roboto, sans-serif; color: #fff;
  }
  .pls-clock { position: absolute; top: 250px; width: 100%; text-align: center; }
  .pls-date { font-size: 42px; font-weight: 500; opacity: 0.92; letter-spacing: 0.2px; }
  .pls-time { font-size: 224px; font-weight: 600; letter-spacing: -7px; line-height: 1; margin-top: 4px; }
  .pls-stack { position: absolute; top: 760px; left: 48px; right: 48px; display: flex; flex-direction: column; }
  .pls-card {
    overflow: hidden;
  }
  .pls-card-in {
    margin-bottom: 26px; border-radius: 48px; padding: 34px 38px;
    background: rgba(246, 246, 248, 0.86); color: #111;
    box-shadow: 0 18px 48px rgba(0, 0, 0, 0.22);
  }
  .pls-hd { display: flex; align-items: center; gap: 18px; margin-bottom: 12px; }
  .pls-icon {
    width: 60px; height: 60px; border-radius: 15px; flex: none; display: flex; align-items: center; justify-content: center;
    font-size: 34px; color: #fff; font-weight: 700; overflow: hidden;
  }
  .pls-icon img { width: 100%; height: 100%; object-fit: cover; }
  .pls-app { font-size: 26px; font-weight: 600; color: #3a3a3c; text-transform: uppercase; letter-spacing: 1.2px; }
  .pls-ago { margin-left: auto; font-size: 28px; color: #6e6e73; }
  .pls-title { font-size: 44px; font-weight: 700; line-height: 1.2; color: #111; }
  .pls-body { font-size: 40px; line-height: 1.3; color: #222; margin-top: 6px; }
  .pls-stamp {
    position: absolute; left: 50%; top: 0; transform-origin: 50% 50%;
    border: 10px solid currentColor; border-radius: 20px; padding: 16px 36px;
    font-size: 72px; font-weight: 800; letter-spacing: 3px; white-space: nowrap;
    background: rgba(20, 16, 44, 0.35); visibility: hidden;
  }
</style>

<script>
  function createTimeline(el, data, ctx) {
    var tl = gsap.timeline();
    data = data || {};
    var stage = el.querySelector('.pls-stage');
    var stack = el.querySelector('.pls-stack');
    var stampEl = el.querySelector('.pls-stamp');

    // ---- Wallpaper: a CSS background, or two colors for the default glow ----
    var c1 = data.wallpaper_from || '#6b7cff', c2 = data.wallpaper_to || '#171335';
    el.querySelector('.pls-root').style.background = data.wallpaper ||
      ('radial-gradient(120% 80% at 30% 20%, ' + c1 + ' 0%, ' + c2 + ' 100%)');

    el.querySelector('.pls-date').textContent = data.date || 'Wednesday, September 23';
    // A big label over the phone ("Company A"): who this phone belongs to
    // when two stand side by side. The clock steps down to make room.
    var labelEl = el.querySelector('.pls-label');
    if (data.label) {
      labelEl.textContent = data.label;
      labelEl.style.color = data.label_color || '#fff';
      el.querySelector('.pls-clock').style.top = '330px';
    } else labelEl.style.display = 'none';
    el.querySelector('.pls-time').textContent = data.time || '9:41';

    // ---- Notifications: built now, newest on top; each opens from nothing
    // at its `at`, so the older ones slide down under it ----
    var notes = (Array.isArray(data.notifications) ? data.notifications : []).filter(Boolean)
      .map(function (n, i) { return { n: n, at: Number(n.at) || 0, i: i }; })
      .sort(function (a, b) { return a.at - b.at || a.i - b.i; });
    var cards = [];
    notes.forEach(function (item) {
      var n = item.n;
      var card = document.createElement('div');
      card.className = 'pls-card';
      var inner = document.createElement('div');
      inner.className = 'pls-card-in';
      var hd = document.createElement('div');
      hd.className = 'pls-hd';
      var icon = document.createElement('div');
      icon.className = 'pls-icon';
      icon.style.background = n.icon_color || '#6366f1';
      if (n.icon_url) { var img = document.createElement('img'); img.src = n.icon_url; img.alt = ''; icon.appendChild(img); }
      else icon.textContent = n.icon || String(n.app || '?').charAt(0).toUpperCase();
      var app = document.createElement('span'); app.className = 'pls-app'; app.textContent = n.app || '';
      var ago = document.createElement('span'); ago.className = 'pls-ago'; ago.textContent = n.ago || 'now';
      hd.appendChild(icon); hd.appendChild(app); hd.appendChild(ago);
      var title = document.createElement('div'); title.className = 'pls-title'; title.textContent = n.title || '';
      inner.appendChild(hd); inner.appendChild(title);
      if (n.body) { var body = document.createElement('div'); body.className = 'pls-body'; body.textContent = n.body; inner.appendChild(body); }
      card.appendChild(inner);
      stack.insertBefore(card, stack.firstChild);
      cards.push({ card: card, inner: inner, at: item.at });
    });

    // ---- Scale the 1080-wide design to the box (cover the width; a 9x16
    // box is exact) ----
    var fit = function () {
      var s = (el.clientWidth || 1080) / 1080;
      stage.style.transform = 'scale(' + s + ')';
    };
    fit();
    if (typeof ResizeObserver !== 'undefined') new ResizeObserver(fit).observe(el);

    cards.forEach(function (c) {
      var h = c.card.offsetHeight;
      gsap.set(c.card, { height: 0 });
      gsap.set(c.inner, { autoAlpha: 0, y: -40, scale: 0.96, transformOrigin: '50% 0%' });
      tl.to(c.card, { height: h, duration: 0.42, ease: 'power3.out' }, c.at);
      tl.to(c.inner, { autoAlpha: 1, y: 0, scale: 1, duration: 0.5, ease: 'back.out(1.6)' }, c.at);
    });

    // ---- The stamp: slams onto the newest notification ----
    var st = data.stamp;
    if (st && st.text) {
      stampEl.textContent = st.text;
      stampEl.style.color = st.color || '#ff5a4f';
      var rot = st.rotation != null ? Number(st.rotation) : -7;
      var sAt = Number(st.at) || (cards.length ? cards[cards.length - 1].at + 1 : 0.5);
      // Where it lands: ON the newest notification (the wrong email itself),
      // over its body so its title still reads. Not across the boundary
      // (it hid "Deal moved" on the card under it) and not under the stack
      // (that is the platform's caption band on a Reel). stamp.place:
      // "below" puts it under the stack instead.
      var newestH = cards.length ? cards[cards.length - 1].card.scrollHeight - 26 : 280;
      var landY;
      if (st.place === 'below') {
        var stackH = 0;
        cards.forEach(function (c) { stackH += c.card.scrollHeight; });
        landY = 760 + stackH + 36;
      } else {
        landY = 760 + Math.max(120, newestH - 150);
        // On a light card a dark wash reads as mud: paper under the ink.
        stampEl.style.background = 'rgba(255, 255, 255, 0.82)';
      }
      gsap.set(stampEl, { y: landY, xPercent: -50, rotation: rot, autoAlpha: 0, scale: 2.4 });
      tl.to(stampEl, { autoAlpha: 1, scale: 1, duration: 0.2, ease: 'power4.in' }, sAt);
      // The hit: the stack jolts under it.
      tl.fromTo(stack, { x: 0 }, { keyframes: [{ x: -14, duration: 0.05 }, { x: 11, duration: 0.05 }, { x: -6, duration: 0.05 }, { x: 0, duration: 0.05 }], immediateRender: false }, sAt + 0.2);
    }
    return tl;
  }
</script>
