<script>
  function createTimeline(el, data, ctx) {
    var tl = gsap.timeline();
    var chat = el.querySelector('.quotient-chat');
    var messagesArea = el.querySelector('.messages-area');
    var composerInput = el.querySelector('.composer-input');
    var sendBtn = el.querySelector('.send-btn');
    var tabName = el.querySelector('.tab-name');
    var badgeEl = el.querySelector('.badge-count');
    var progressBar = el.querySelector('.progress-bar');
    var progressFill = el.querySelector('.progress-fill');
    var typingIndicator = el.querySelector('.typing-indicator');
    var scrollDownBtn = el.querySelector('.scroll-down-btn');

    // ── Data ──
    var title = data.conversation_title || 'New Conversation';
    var messages = data.messages || [];
    var userAvatar = data.user_avatar || '';
    var userAvatarColor = data.user_avatar_color || '#6366f1';
    var badgeCount = data.badge_count || 0;
    var mode = data.mode || 'panel';
    var showProgress = data.show_progress !== undefined ? data.show_progress : true;
    var placeholder = data.composer_placeholder || 'Type a message...';

    // ── Setup ──
    tabName.textContent = title;
    composerInput.setAttribute('data-placeholder', placeholder);
    if (badgeCount > 0) badgeEl.textContent = badgeCount;
    if (!showProgress) progressBar.classList.add('hidden');
    sendBtn.classList.add('disabled');

    // ── Markdown parser ──
    function parseMd(text) {
      // Code blocks first
      var html = text.replace(/```([\s\S]*?)```/g, function(m, code) {
        return '<pre><code>' + code.replace(/</g, '&lt;').replace(/>/g, '&gt;').trim() + '</code></pre>';
      });
      // Inline code
      html = html.replace(/`([^`]+)`/g, '<code>$1</code>');
      // Bold
      html = html.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
      // Italic
      html = html.replace(/\*([^*]+)\*/g, '<em>$1</em>');
      // Bullet lists
      html = html.replace(/(^|\n)- (.+)/g, function(m, pre, item) {
        return pre + '<li>' + item + '</li>';
      });
      html = html.replace(/(<li>.*<\/li>)/gs, '<ul>$1</ul>');
      // Clean up duplicate nested <ul>
      html = html.replace(/<\/ul>\s*<ul>/g, '');
      // Line breaks
      html = html.replace(/\n/g, '<br>');
      return html;
    }

    // ── Create user avatar element ──
    function makeUserAvatar() {
      var av = document.createElement('div');
      av.className = 'user-avatar';
      av.style.background = userAvatarColor;
      if (userAvatar && (userAvatar.startsWith('http') || userAvatar.startsWith('/'))) {
        var img = document.createElement('img');
        img.src = userAvatar;
        av.appendChild(img);
      } else {
        av.textContent = userAvatar || 'U';
      }
      return av;
    }

    // ── Add user message ──
    function addUserMessage(text) {
      var row = document.createElement('div');
      row.className = 'msg-row user';
      var bubble = document.createElement('div');
      bubble.className = 'msg-bubble';
      bubble.textContent = text;
      row.appendChild(makeUserAvatar());
      row.appendChild(bubble);
      messagesArea.appendChild(row);
      scrollToBottom();
      return row;
    }

    // ── Add agent message ──
    function addAgentMessage(text) {
      var row = document.createElement('div');
      row.className = 'msg-row agent';
      var content = document.createElement('div');
      content.className = 'msg-content';
      content.innerHTML = parseMd(text);
      row.appendChild(content);
      messagesArea.appendChild(row);
      scrollToBottom();
      return row;
    }

    // ── Add tool use ──
    function addToolUse(action, service) {
      var row = document.createElement('div');
      row.className = 'tool-use-row';
      row.innerHTML = '<span class="tool-emoji">🟢</span> Used <span class="tool-action">' + action + '</span> on <span class="tool-service">' + service + '</span>';
      messagesArea.appendChild(row);
      scrollToBottom();
      return row;
    }

    // ── Add asset card ──
    function addAssetCard(cardTitle, subtitle) {
      var card = document.createElement('div');
      card.className = 'asset-card';
      card.innerHTML = '<div class="asset-card-icon"><svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="#64748b" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 3h8l4 4v10a1 1 0 01-1 1H4a1 1 0 01-1-1V4a1 1 0 011-1z"/><path d="M12 3v4h4"/><path d="M7 10h6M7 13h4"/></svg></div><div class="asset-card-info"><div class="asset-card-title">' + cardTitle + '</div><div class="asset-card-subtitle">' + (subtitle || 'Asset') + '</div></div>';
      messagesArea.appendChild(card);
      scrollToBottom();
      return card;
    }

    function scrollToBottom() {
      messagesArea.scrollTop = messagesArea.scrollHeight;
    }

    // ── Render initial messages ──
    var messageEls = [];
    messages.forEach(function(msg) {
      var el;
      if (msg.role === 'user') {
        el = addUserMessage(msg.text || '');
      } else {
        el = addAgentMessage(msg.text || '');
      }
      messageEls.push(el);
    });

    // ── Initial state ──
    gsap.set(chat, { autoAlpha: 0 });
    gsap.set(messageEls, { autoAlpha: 0, y: 12 });

    var speed = ctx.motion === 'minimal' ? 0.4 : ctx.motion === 'punchy' ? 0.6 : 0.8;

    tl.to(chat, { autoAlpha: 1, duration: speed * 0.5, ease: 'power2.out' }, 0.2);
    var t = 0.2 + speed * 0.5 + 0.15;
    messageEls.forEach(function(mel) {
      tl.to(mel, { autoAlpha: 1, y: 0, duration: 0.3, ease: 'power2.out' }, t);
      t += 0.2;
    });

    // ── Script actions ──
    if (data.script && data.script.length > 0) {
      var cursorTargets = data.cursor_targets || {
        'composer': { x: '50%', y: '82%' },
        'send-button': { x: '93%', y: '90%' },
        'expand-btn': { x: '88%', y: '3%' }
      };

      runScript(tl, el, data.script, cursorTargets, ctx, {
        'type': function(tl, ctr, action, at) {
          var input = ctr.querySelector('[data-target="composer-input"]');
          if (!input) return;
          var sb = ctr.querySelector('.send-btn');
          tl.call(function() { if (sb) sb.classList.remove('disabled'); }, null, at);
          typeText(tl, input, action.text || '', at, action.speed || 28);
        },
        'send-message': function(tl, ctr, action, at) {
          var input = ctr.querySelector('[data-target="composer-input"]');
          var area = ctr.querySelector('.messages-area');
          var sb = ctr.querySelector('.send-btn');
          if (!input || !area) return;
          tl.call(function() {
            var msgText = input.textContent;
            if (!msgText) return;
            var row = addUserMessage(msgText);
            gsap.from(row, { autoAlpha: 0, y: 14, duration: 0.35, ease: 'power2.out' });
            input.textContent = '';
            if (sb) sb.classList.add('disabled');
          }, null, at);
        },
        'agent-message': function(tl, ctr, action, at) {
          tl.call(function() {
            // Hide typing indicator if visible
            gsap.to(typingIndicator, { opacity: 0, duration: 0.1 });
            var row = addAgentMessage(action.text || '');
            gsap.from(row, { autoAlpha: 0, y: 14, duration: 0.4, ease: 'power2.out' });
          }, null, at);
        },
        'tool-use': function(tl, ctr, action, at) {
          tl.call(function() {
            var row = addToolUse(action.action || 'action', action.service || 'Service');
            gsap.from(row, { autoAlpha: 0, y: 8, duration: 0.3, ease: 'power2.out' });
          }, null, at);
        },
        'asset-card': function(tl, ctr, action, at) {
          tl.call(function() {
            var card = addAssetCard(action.title || 'Untitled', action.subtitle || 'Asset');
            gsap.from(card, { autoAlpha: 0, y: 10, scale: 0.97, duration: 0.35, ease: 'power2.out' });
          }, null, at);
        },
        'show-typing': function(tl, ctr, action, at) {
          var ind = ctr.querySelector('[data-target="typing-indicator"]');
          if (!ind) return;
          var dots = ind.querySelectorAll('.typing-dot');
          tl.to(ind, { opacity: 1, duration: 0.15 }, at);
          tl.to(dots, {
            y: -5, duration: 0.3, stagger: 0.12,
            ease: 'power2.out', yoyo: true, repeat: -1
          }, at + 0.1);
        },
        'hide-typing': function(tl, ctr, action, at) {
          var ind = ctr.querySelector('[data-target="typing-indicator"]');
          if (!ind) return;
          tl.to(ind, { opacity: 0, duration: 0.15 }, at);
          tl.call(function() {
            gsap.killTweensOf(ind.querySelectorAll('.typing-dot'));
            gsap.set(ind.querySelectorAll('.typing-dot'), { y: 0 });
          }, null, at + 0.15);
        },
        'scroll-to-bottom': function(tl, ctr, action, at) {
          tl.call(function() { scrollToBottom(); }, null, at);
        }
      });
    }

    return tl;
  }
</script>
