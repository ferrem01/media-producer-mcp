          'verb-line': function(tl2, ctr, action, at) { var ev = next('verb-line'); if (ev) reveal(tl2, ev, at); },
          'task-status': function(tl2, ctr, action, at) { var ev = next('task-status'); if (ev) reveal(tl2, ev, at); },
          'summarized': function(tl2, ctr, action, at) { var ev = next('summarized'); if (ev) reveal(tl2, ev, at); },
          'tool-use': function(tl2, ctr, action, at) { var ev = next('tool-use'); if (ev) reveal(tl2, ev, at); },
          'asset-card': function(tl2, ctr, action, at) { var ev = next('asset-card'); if (ev) reveal(tl2, ev, at); },
          'error-line': function(tl2, ctr, action, at) { var ev = next('error-line'); if (ev) reveal(tl2, ev, at); },
          'todo-list': function(tl2, ctr, action, at) { var ev = next('todo-list'); if (ev) reveal(tl2, ev, at); },
          'check-todo': function(tl2, ctr, action, at) {
            // Flip one to-do row's state and tick the ring counter. States
            // are compile-time tracked so the paired boundaries restore the
            // TRUE prior state on reverse crossings (no-op flips skipped).
            var todo = todoNodes[action.todo_index || 0];
            if (!todo) return;
            var rows = todo.querySelectorAll('.qch-todo-item');
            var row = rows[action.index || 0];
            if (!row) return;
            var states = todo._todoItems;
            var prev = states[action.index || 0];
            var nextState = action.state || 'done';
            if (prev === nextState) return;
            classAt(tl2, row, at, ['is-' + nextState], ['is-' + prev]);
            states[action.index || 0] = nextState;
            var doneNow = states.filter(function(s) { return s === 'done'; }).length;
            var prevCount = todo._countStr || todo._todoCount.textContent;
            var nextCount = doneNow + '/' + states.length;
            textAt(tl2, todo._todoCount, at, nextCount, prevCount);
            todo._countStr = nextCount;
          },
          'search-card': function(tl2, ctr, action, at) { var ev = next('search-card'); if (ev) reveal(tl2, ev, at); },
          'show-typing': function(tl2, ctr, action, at) {
            var ev = next('show-typing');
            if (!ev) return;
            reveal(tl2, ev, at);
            if (ev.hideAt != null && ev.hideAt > at) hide(tl2, ev, ev.hideAt - 0.05);
          },
          'hide-typing': function() { /* handled by the paired show-typing */ },
          'content-card': function(tl2, ctr, action, at) {
            var ev = next('content-card');
            if (!ev) return;
            var dur = action.duration || 3.0;
            var bodywrap = ev.node.querySelector('.qch-cc-bodywrap');
            tl2.set(ev.node, { display: ev.naturalDisplay }, at);
            tl2.fromTo(ev.node, { autoAlpha: 0, y: 9 },
              { autoAlpha: 1, y: 0, duration: 0.28, ease: 'power2.out', immediateRender: false }, at);
            // STREAM: the body grows from a sliver to its measured height
            // while the transcript scrolls in lockstep -- pure tweens, so a
            // scrub through the stream shows exactly the right partial card.
            tl2.fromTo(bodywrap, { height: 34 },
              { height: ev.bodyH, duration: dur, ease: 'none', immediateRender: false }, at + 0.25);
            var paras = ev.node.querySelectorAll('.qch-cc-content p');
            for (var pi = 0; pi < paras.length; pi++) {
              tl2.fromTo(paras[pi], { autoAlpha: 0 },
                { autoAlpha: 1, duration: 0.3, immediateRender: false },
                at + 0.25 + dur * (pi / Math.max(1, paras.length)));
            }
            var scrollStart = Math.max(0, ev.scrollAfter - (ev.bodyH - 34));
            tl2.fromTo(msgs, { scrollTop: scrollStart },
              { scrollTop: ev.scrollAfter, duration: dur, ease: 'none', immediateRender: false }, at + 0.25);
            if (action.collapse_delay) {
              var ct = at + dur + action.collapse_delay;
              classAt(tl2, ev.node, ct, [], ['open']);
              tl2.to(bodywrap, { height: 0, duration: 0.3, ease: 'power2.inOut' }, ct);
              tl2.to(msgs, { scrollTop: Math.max(0, ev.scrollAfter - ev.bodyH), duration: 0.3 }, ct);
            }
          },
          'open-references': function(tl2, ctr, action, at) {
            // Rows are built at BUILD (this handler runs during compile).
            var items = action.items || [];
            el.querySelector('.qch-refs-title').textContent = 'References (' + items.length + ')';
            var rows = el.querySelector('.qch-refs-rows');
            rows.innerHTML = '';
            items.forEach(function(it) {
              var r = document.createElement('div');
              r.className = 'qch-ref-row';
              r.innerHTML = entIcon(it.entity) + '<span class="qch-ref-name">' + esc(it.title || '') + '</span>' +
                '<span class="qch-ref-kind">' + esc(it.kind || '') + '</span>';
              rows.appendChild(r);
            });
            refs.style.display = 'block';
            gsap.set(refs, { autoAlpha: 0 });
            tl2.fromTo(refs, { autoAlpha: 0, y: -6 },
              { autoAlpha: 1, y: 0, duration: 0.22, ease: 'power2.out', immediateRender: false }, at);
          },
          'close-references': function(tl2, ctr, action, at) {
            tl2.to(refs, { autoAlpha: 0, y: -6, duration: 0.16, ease: 'power2.in' }, at);
          },
          'switch-tab': function(tl2, ctr, action, at) {
            // Compile-time prior-state tracking: only the two CHANGING tabs
            // get boundary pairs, so no-op tabs never flash on reverse scrubs.
            var idx = action.index || 0;
            if (idx === compiledActiveTab) return;
            classAt(tl2, tabEls[compiledActiveTab], at, [], ['active']);
            classAt(tl2, tabEls[idx], at, ['active'], []);
            compiledActiveTab = idx;
          },
          'scroll-messages': function(tl2, ctr, action, at) {
            tl2.to(msgs, { scrollTop: Math.max(0, msgs.scrollHeight - viewH), duration: 0.3 }, at);
          },
          'scroll-to-bottom': function(tl2, ctr, action, at) {
            tl2.to(msgs, { scrollTop: Math.max(0, msgs.scrollHeight - viewH), duration: 0.3 }, at);
          }
        };
      })());
    }

    return tl;
  }
</script>
