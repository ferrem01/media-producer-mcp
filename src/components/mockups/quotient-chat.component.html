      }).join('');
      d.innerHTML = '<div class="qch-task-row">Marked ' + (a.count || (a.tasks || []).length || 1) +
        ' task(s) as <span class="qch-task-status"><span class="qch-task-half"></span> ' + esc(a.status || 'In review') + '</span></div>' + items;
      return d;
    }
    function agentEl(text) {
      var d = document.createElement('div');
      d.className = 'qch-agent';
      d.innerHTML = String(text).split(/\n\n+/).map(function(p) { return '<p>' + md(p) + '</p>'; }).join('');
      return d;
    }
    function userEl(text) {
      var d = document.createElement('div');
      d.className = 'qch-user';
      var ava = '<div class="qch-user-ava">' + esc(userInitials) +
        (userAvatarUrl ? '<img src="' + esc(userAvatarUrl) + '" onerror="this.remove()"/>' : '') + '</div>';
      d.innerHTML = ava + '<div class="qch-user-bubble">' + esc(text) + '</div>';
      return d;
    }
    function summarizedEl(label) {
      var d = document.createElement('div');
      d.className = 'qch-summarized';
      d.textContent = label || 'Conversation summarized';
      return d;
    }
    function renderContent(card, text) {
      var body = card.querySelector('.qch-cc-body');
      var c = card.querySelector('.qch-cc-content');
      c.innerHTML = String(text).split(/\n\n+/).map(function(p) { return '<p>' + md(p) + '</p>'; }).join('');
      if (body.scrollHeight > 250) body.classList.remove('short');
    }

    // ── History ──
    (data.history || []).forEach(function(h) {
      if (h.type === 'user') addBlock(userEl(h.text), false);
      else if (h.type === 'agent') addBlock(agentEl(h.text), false);
      else if (h.type === 'verb-line') addBlock(verbEl(h), false);
      else if (h.type === 'content-card') {
        var c = addBlock(contentCardEl(h), false);
        if (h.content) renderContent(c, h.content);
        if (h.open === false) c.classList.remove('open');
      }
      else if (h.type === 'task-status') addBlock(taskEl(h), false);
      else if (h.type === 'summarized') addBlock(summarizedEl(h.label), false);
    });
    scrollDown();

    // ── Entrance ──
    gsap.set(root, { autoAlpha: 0, x: 14 });
    tl.to(root, { autoAlpha: 1, x: 0, duration: 0.3, ease: 'power3.out' }, 0.08);

    var typingNode = null;

    // ── Script ──
    if (data.script && data.script.length > 0) {
      var cursorTargets = data.cursor_targets || {
        'composer': { x: '50%', y: '86%' },
        'copies': { x: '86%', y: '4%' }
      };

      runScript(tl, el, data.script, cursorTargets, ctx, {
        'type-message': function(tl, ctr, action, at) {
          var text = action.text || '';
          var speed = action.speed || 0.035;
          tl.call(function() { input.classList.add('filled', 'typing'); }, null, at);
          for (var i = 1; i <= text.length; i++) {
            (function(n) { tl.call(function() { inputText.textContent = text.slice(0, n); }, null, at + n * speed); })(i);
          }
          tl.call(function() { input.classList.remove('typing'); }, null, at + text.length * speed + 0.15);
        },
        'send-message': function(tl, ctr, action, at) {
          tl.call(function() {
            var text = inputText.textContent;
            inputText.textContent = '';
            input.classList.remove('filled', 'typing');
            if (text) addBlock(userEl(text));
          }, null, at);
        },
        'user-message': function(tl, ctr, action, at) {
          tl.call(function() { addBlock(userEl(action.text || '')); }, null, at);
        },
        'agent-message': function(tl, ctr, action, at) {
          tl.call(function() {
            if (typingNode) { typingNode.remove(); typingNode = null; }
            addBlock(agentEl(action.text || ''));
          }, null, at);
        },
        'verb-line': function(tl, ctr, action, at) {
          tl.call(function() {
            if (typingNode) { typingNode.remove(); typingNode = null; }
            addBlock(verbEl(action));
          }, null, at);
        },
        'content-card': function(tl, ctr, action, at) {
          // THE streaming box: content streams into the card while older
          // lines slide up under the top fade -- the live-edit treatment.
          var content = action.content || '';
          var dur = action.duration || 3.0;
          var cardRef = { el: null };
          tl.call(function() {
            if (typingNode) { typingNode.remove(); typingNode = null; }
            cardRef.el = addBlock(contentCardEl(action));
            scrollBtn.style.display = 'flex';
            gsap.fromTo(scrollBtn, { autoAlpha: 0 }, { autoAlpha: 1, duration: 0.25 });
          }, null, at);
          var words = content.split(/(\s+)/);
          var steps = 24;
          for (var s = 1; s <= steps; s++) {
            (function(k) {
              tl.call(function() {
                if (!cardRef.el) return;
                var upto = Math.round(words.length * k / steps);
                renderContent(cardRef.el, words.slice(0, upto).join(''));
                scrollDown();
              }, null, at + 0.25 + (dur - 0.25) * k / steps);
            })(s);
          }
          tl.call(function() {
            gsap.to(scrollBtn, { autoAlpha: 0, duration: 0.25, onComplete: function() { scrollBtn.style.display = 'none'; } });
          }, null, at + dur + 0.6);
          if (action.collapse_delay) {
            tl.call(function() { if (cardRef.el) cardRef.el.classList.remove('open'); }, null, at + dur + action.collapse_delay);
          }
        },
        'task-status': function(tl, ctr, action, at) {
          tl.call(function() { addBlock(taskEl(action)); }, null, at);
        },
        'summarized': function(tl, ctr, action, at) {
          tl.call(function() { addBlock(summarizedEl(action.label)); }, null, at);
        },
        'open-references': function(tl, ctr, action, at) {
          tl.call(function() {
            var items = action.items || [];
            el.querySelector('.qch-refs-title').textContent = 'References (' + items.length + ')';
            var rows = el.querySelector('.qch-refs-rows');
            rows.innerHTML = '';
            items.forEach(function(it) {
              var r = document.createElement('div');
              r.className = 'qch-ref-row';
              r.innerHTML = entIcon(it.entity) + '<span class="qch-ref-name">' + esc(it.title || '') + '</span>' +
                '<span class="qch-ref-kind">' + esc(it.kind || '') + '</span>';
              rows.appendChild(r);
            });
            refs.style.display = 'block';
            gsap.fromTo(refs, { autoAlpha: 0, y: -6 }, { autoAlpha: 1, y: 0, duration: 0.22, ease: 'power2.out' });
          }, null, at);
        },
        'close-references': function(tl, ctr, action, at) {
          tl.call(function() {
            gsap.to(refs, { autoAlpha: 0, y: -6, duration: 0.16, onComplete: function() { refs.style.display = 'none'; } });
          }, null, at);
        },
        'switch-tab': function(tl, ctr, action, at) {
          tl.call(function() {
            var idx = action.index || 0;
            tabEls.forEach(function(t, i) { t.classList.toggle('active', i === idx); });
          }, null, at);
        },
        'show-typing': function(tl, ctr, action, at) {
          tl.call(function() {
            if (typingNode) return;
            typingNode = document.createElement('div');
            typingNode.className = 'qch-typing';
            typingNode.innerHTML = '<i></i><i></i><i></i>';
            addBlock(typingNode);
          }, null, at);
        },
        'hide-typing': function(tl, ctr, action, at) {
          tl.call(function() { if (typingNode) { typingNode.remove(); typingNode = null; } }, null, at);
        },
        'scroll-messages': function(tl, ctr, action, at) {
          tl.call(scrollDown, null, at);
        },
        // LEGACY aliases (pre-rebuild scenes)
        'tool-use': function(tl, ctr, action, at) {
          tl.call(function() {
            if (typingNode) { typingNode.remove(); typingNode = null; }
            var t = String(action.tool_name || action.action_name || '');
            var ent = /campaign/.test(t) ? 'campaign' : /social|post/.test(t) ? 'linkedin' : /email|broadcast/.test(t) ? 'email' : /blog/.test(t) ? 'blog' : /task/.test(t) ? 'task' : 'doc';
            addBlock(verbEl({ verb: 'Used', entity: ent, inline_title: true, title: t + ' on ' + (action.service || 'Quotient') }));
          }, null, at);
        },
        'asset-card': function(tl, ctr, action, at) {
          tl.call(function() {
            addBlock(verbEl({ verb: 'Created', entity: 'doc', title: action.title || 'Asset' }));
          }, null, at);
        },
        'scroll-to-bottom': function(tl, ctr, action, at) {
          tl.call(scrollDown, null, at);
        }
      });
    }

    return tl;
  }
</script>
