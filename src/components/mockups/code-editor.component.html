<script>
  function createTimeline(el, data, ctx) {
    var tl = gsap.timeline();
    var frame = el.querySelector('.editor-frame');
    var tabName = el.querySelector('.tab-name');
    var fileTree = el.querySelector('.file-tree');
    var lineNumbers = el.querySelector('.line-numbers');
    var codeText = el.querySelector('.code-text');
    var cursor = el.querySelector('.cursor-blink');

    var filename = data.filename || 'index.ts';
    var code = data.code || '';
    var language = data.language || 'typescript';

    tabName.textContent = filename;

    // Build file tree
    var treeFiles = [
      { name: 'src', icon: '📁', indent: 0 },
      { name: filename, icon: '📄', indent: 1, active: true },
      { name: 'package.json', icon: '📄', indent: 0 },
      { name: 'tsconfig.json', icon: '📄', indent: 0 }
    ];
    for (var f = 0; f < treeFiles.length; f++) {
      var fi = document.createElement('div');
      fi.className = 'file-item' + (treeFiles[f].active ? ' active-file' : '');
      fi.style.paddingLeft = (8 + treeFiles[f].indent * 16) + 'px';
      var icon = document.createElement('span');
      icon.className = 'file-icon';
      icon.textContent = treeFiles[f].icon;
      fi.appendChild(icon);
      var name = document.createElement('span');
      name.textContent = treeFiles[f].name;
      fi.appendChild(name);
      fileTree.appendChild(fi);
    }

    // Split code into lines
    var lines = code.split('\n');
    var totalLines = lines.length;

    // Build line numbers
    for (var ln = 1; ln <= totalLines; ln++) {
      lineNumbers.textContent += ln + '\n';
    }

    // Simple syntax highlighting
    function highlightLine(line) {
      var result = line;
      // Escape HTML
      result = result.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
      // Comments
      result = result.replace(/(\/\/.*)$/gm, '<span class="syn-comment">$1</span>');
      // Strings
      result = result.replace(/("(?:[^"\\]|\\.)*"|'(?:[^'\\]|\\.)*'|`(?:[^`\\]|\\.)*`)/g, '<span class="syn-string">$1</span>');
      // Keywords
      result = result.replace(/\b(import|export|from|const|let|var|function|return|if|else|for|while|class|extends|new|async|await|try|catch|throw|interface|type|enum|default)\b/g, '<span class="syn-keyword">$1</span>');
      // Numbers
      result = result.replace(/\b(\d+\.?\d*)\b/g, '<span class="syn-number">$1</span>');
      // Types (capitalized words)
      result = result.replace(/\b([A-Z][a-zA-Z0-9]+)\b/g, '<span class="syn-type">$1</span>');
      return result;
    }

    // Initial states
    gsap.set(frame, { autoAlpha: 0, scale: 0.94, filter: 'blur(4px)' });
    gsap.set(cursor, { autoAlpha: 0 });

    var speed = ctx.motion === 'minimal' ? 0.4 : ctx.motion === 'punchy' ? 0.6 : 0.8;

    // Frame entrance
    tl.to(frame, {
      autoAlpha: 1, scale: 1, filter: 'blur(0px)',
      duration: speed,
      ease: 'power3.out'
    }, 0.3);

    // Show cursor
    tl.to(cursor, { autoAlpha: 1, duration: 0.1 }, 0.3 + speed);

    // Type code line by line
    var currentLine = 0;
    var lineDelay = Math.min(0.35, (ctx.duration - 2) / Math.max(totalLines, 1));

    for (var i = 0; i < totalLines; i++) {
      (function(idx, offset) {
        tl.call(function() {
          var displayedLines = [];
          for (var d = 0; d <= idx; d++) {
            displayedLines.push(highlightLine(lines[d]));
          }
          codeText.innerHTML = displayedLines.join('\n');
        }, null, 0.3 + speed + 0.2 + offset);
      })(i, i * lineDelay);
    }

    // Blink cursor
    tl.to(cursor, {
      autoAlpha: 0,
      duration: 0.4,
      repeat: -1,
      yoyo: true,
      ease: 'steps(1)'
    }, 0.3 + speed + 0.1);

    // Exit
    if (ctx.duration > 2) {
      var exitAt = ctx.duration - 0.6;
      tl.to(frame, {
        autoAlpha: 0, scale: 0.97,
        duration: 0.5,
        ease: 'power2.in'
      }, exitAt);
    }


    // Run interactive script if provided
    if (data.script && data.script.length > 0) {
      runScript(tl, el, data.script, data.cursor_targets || {}, ctx);
    }

    return tl;
  }
</script>
