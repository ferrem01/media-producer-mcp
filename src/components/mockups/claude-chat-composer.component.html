<script>
  function createTimeline(el, data, ctx) {
    var tl = gsap.timeline();
    var chat = el.querySelector('.claude-chat');
    var sidebar = el.querySelector('.claude-sidebar');
    var messagesArea = el.querySelector('.messages-area');
    var composerWrapper = el.querySelector('.composer-wrapper');
    var composerBar = el.querySelector('.composer-bar');
    var composerInput = el.querySelector('.composer-input');
    var sendBtn = el.querySelector('.send-btn');
    var plusBtn = el.querySelector('.plus-btn');
    var plusMenu = el.querySelector('.plus-menu');
    var plusMenuHeader = el.querySelector('.plus-menu-header');
    var plusMenuItems = el.querySelector('.plus-menu-items');
    var typingIndicator = el.querySelector('.typing-indicator');
    var modelLabel = el.querySelector('.composer-model-label');

    // ── Data defaults ──

    var messages = data.messages || [];
    var assistantName = data.assistant_name || 'Claude';
    var avatarColor = data.assistant_avatar_color || '#D97706';
    var placeholder = data.composer_placeholder || ('Message ' + assistantName + '...');
    var menuTitle = data.menu_title || 'Tools & integrations';
    var menuItems = data.menu_items || [];
    var showSidebar = data.show_sidebar !== undefined ? data.show_sidebar : false;

    // ── Setup ──

    composerInput.setAttribute('data-placeholder', placeholder);
    sendBtn.className = 'send-btn ghost';
    modelLabel.textContent = assistantName + ' 4 Sonnet';

    if (!showSidebar) {
      sidebar.classList.add('hidden');
    } else {
      // Populate sidebar conversation stubs
      var convos = el.querySelector('.sidebar-conversations');
      var convoLabels = ['Current conversation', 'API integration help', 'Code review notes'];
      for (var c = 0; c < convoLabels.length; c++) {
        var ci = document.createElement('div');
        ci.className = 'sidebar-convo-item' + (c === 0 ? ' active' : '');
        ci.textContent = convoLabels[c];
        convos.appendChild(ci);
      }
    }

    // ── Build messages ──

    var messageEls = [];
    for (var i = 0; i < messages.length; i++) {
      var msg = messages[i];
      var role = msg.role || 'user';
      var row = document.createElement('div');
      row.className = 'msg-row ' + role;

      if (role === 'assistant') {
        var avatarEl = document.createElement('div');
        avatarEl.className = 'msg-avatar assistant';
        avatarEl.style.background = avatarColor;
        avatarEl.innerHTML = '<svg viewBox="0 0 24 24" fill="none"><path d="M15 5l-3.5 7L15 19h-2.5L9 12l3.5-7H15zM10 5L6.5 12 10 19H7.5L4 12 7.5 5H10z" fill="#fff"/></svg>';
        row.appendChild(avatarEl);
      }

      var content = document.createElement('div');
      content.className = 'msg-content';
      var text = document.createElement('div');
      text.className = 'msg-text';
      text.textContent = msg.text || '';
      content.appendChild(text);
      row.appendChild(content);

      messagesArea.appendChild(row);
      messageEls.push(row);
    }

    // ── Build plus menu ──

    plusMenuHeader.textContent = menuTitle;
    var menuItemEls = [];
    for (var m = 0; m < menuItems.length; m++) {
      var mi = menuItems[m];
      var item = document.createElement('div');
      item.className = 'menu-item';
      item.setAttribute('data-target', 'menu-item-' + m);

      var icon = document.createElement('div');
      icon.className = 'menu-item-icon';
      icon.textContent = mi.icon || '🔌';
      item.appendChild(icon);

      var info = document.createElement('div');
      info.className = 'menu-item-info';
      var nameEl = document.createElement('div');
      nameEl.className = 'menu-item-name';
      nameEl.textContent = mi.name || mi.label || 'Tool';
      info.appendChild(nameEl);
      if (mi.description) {
        var descEl = document.createElement('div');
        descEl.className = 'menu-item-desc';
        descEl.textContent = mi.description;
        info.appendChild(descEl);
      }
      item.appendChild(info);

      var connected = mi.connected !== undefined ? mi.connected : false;
      var status = document.createElement('div');
      status.className = 'menu-item-status ' + (connected ? 'connected' : 'disconnected');
      item.appendChild(status);

      var toggle = document.createElement('div');
      toggle.className = 'menu-item-toggle' + (connected ? ' on' : '');
      toggle.setAttribute('data-target', 'toggle-' + m);
      var knob = document.createElement('div');
      knob.className = 'menu-item-toggle-knob';
      toggle.appendChild(knob);
      item.appendChild(toggle);

      plusMenuItems.appendChild(item);
      menuItemEls.push({ el: item, toggle: toggle, status: status, connected: connected });
    }

    // ── Position plus menu above the + button ──

    gsap.set(plusMenu, { autoAlpha: 0, y: 10, scale: 0.97 });
    gsap.set(typingIndicator, { autoAlpha: 0 });

    // Position menu at bottom-left of main area, above the composer
    var _positionMenu = function() {
      var chatRect = chat.getBoundingClientRect();
      var btnRect = plusBtn.getBoundingClientRect();
      var menuH = plusMenu.offsetHeight || 200;
      plusMenu.style.left = (btnRect.left - chatRect.left) + 'px';
      plusMenu.style.bottom = (chatRect.bottom - btnRect.top + 8) + 'px';
      plusMenu.style.top = 'auto';
    };

    // ── Initial states ──

    gsap.set(chat, { autoAlpha: 0 });
    gsap.set(messageEls, { autoAlpha: 0, y: 16 });

    var speed = ctx.motion === 'minimal' ? 0.4 : ctx.motion === 'punchy' ? 0.6 : 0.8;

    // ── Entrance ──

    tl.to(chat, {
      autoAlpha: 1,
      duration: speed * 0.6,
      ease: 'power2.out'
    }, 0.2);

    // Messages appear one by one
    var t = 0.2 + speed * 0.6 + 0.2;
    for (var j = 0; j < messageEls.length; j++) {
      tl.to(messageEls[j], {
        autoAlpha: 1, y: 0,
        duration: 0.35,
        ease: 'power2.out'
      }, t);
      t += 0.25;
    }

    // ── Exit ──

    if (ctx.duration > 2) {
      var exitAt = ctx.duration - 0.5;
      tl.to(chat, {
        autoAlpha: 0,
        duration: 0.4,
        ease: 'power2.in'
      }, exitAt);
    }

    // ── Script handling ──

    if (data.script && data.script.length > 0) {
      var cursorTargets = data.cursor_targets || {
        'chat-input': { x: '50%', y: '92%' },
        'send-button': { x: '95%', y: '92%' },
        'plus-button': { x: '5%', y: '92%' }
      };

      runScript(tl, el, data.script, cursorTargets, ctx, {

        'type': function(tl, container, action, at, dur) {
          var input = container.querySelector('[data-target="chat-input"]');
          if (!input) return;
          var txt = action.text || '';
          var spd = action.speed || 25;
          typeText(tl, input, txt, at, spd);
          // Activate send button when text is typed
          var sBtn = container.querySelector('.send-btn');
          tl.call(function() {
            sBtn.className = 'send-btn active';
          }, null, at + 0.1);
        },

        'click': function(tl, container, action, at, dur) {
          var target = action.target || 'send-button';
          if (target === 'send-button' || target === 'send') {
            var input = container.querySelector('[data-target="chat-input"]');
            var sBtn = container.querySelector('.send-btn');
            var area = container.querySelector('.messages-area');
            if (input && area) {
              var msgText = input.textContent;
              tl.call(function() {
                if (!msgText) return;
                // Create user message
                var row = document.createElement('div');
                row.className = 'msg-row user';
                var content = document.createElement('div');
                content.className = 'msg-content';
                var textEl = document.createElement('div');
                textEl.className = 'msg-text';
                textEl.textContent = msgText;
                content.appendChild(textEl);
                row.appendChild(content);
                area.appendChild(row);
                gsap.from(row, { autoAlpha: 0, y: 12, duration: 0.3, ease: 'power2.out' });
                // Clear input
                input.textContent = '';
                sBtn.className = 'send-btn ghost';
              }, null, at);
            }
          } else if (target === 'plus-button' || target === 'plus') {
            // Delegate to open-menu
          }
        },

        'open-menu': function(tl, container, action, at, dur) {
          var menu = container.querySelector('.plus-menu');
          var items = container.querySelectorAll('.menu-item');
          tl.call(_positionMenu, null, at);
          tl.to(menu, {
            autoAlpha: 1, y: 0, scale: 1,
            duration: 0.3,
            ease: 'power3.out'
          }, at + 0.05);
          // Stagger reveal items
          if (items.length) {
            gsap.set(items, { autoAlpha: 0, y: 8 });
            tl.to(items, {
              autoAlpha: 1, y: 0,
              duration: 0.25,
              stagger: 0.06,
              ease: 'power2.out'
            }, at + 0.15);
          }
        },

        'close-menu': function(tl, container, action, at, dur) {
          var menu = container.querySelector('.plus-menu');
          tl.to(menu, {
            autoAlpha: 0, y: 10, scale: 0.97,
            duration: 0.2,
            ease: 'power2.in'
          }, at);
        },

        'toggle-item': function(tl, container, action, at, dur) {
          var idx = action.index != null ? action.index : 0;
          var toggleEl = container.querySelector('[data-target="toggle-' + idx + '"]');
          var statusEl = toggleEl ? toggleEl.parentElement.querySelector('.menu-item-status') : null;
          if (toggleEl) {
            tl.call(function() {
              var isOn = toggleEl.classList.contains('on');
              if (isOn) {
                toggleEl.classList.remove('on');
                if (statusEl) {
                  statusEl.classList.remove('connected');
                  statusEl.classList.add('disconnected');
                }
              } else {
                toggleEl.classList.add('on');
                if (statusEl) {
                  statusEl.classList.remove('disconnected');
                  statusEl.classList.add('connected');
                }
              }
            }, null, at);
          }
        },

        'show-typing': function(tl, container, action, at, dur) {
          var indicator = container.querySelector('.typing-indicator');
          var area = container.querySelector('.messages-area');
          if (!indicator || !area) return;
          // Position the indicator at the bottom of messages area
          var areaRect = area.getBoundingClientRect();
          indicator.style.bottom = (container.querySelector('.composer-wrapper').offsetHeight + 8) + 'px';
          tl.to(indicator, { autoAlpha: 1, duration: 0.2 }, at);
          // Bounce dots
          var dots = indicator.querySelectorAll('.typing-dot');
          tl.to(dots, {
            y: -4, duration: 0.3, stagger: 0.1,
            ease: 'power2.out', yoyo: true, repeat: 3
          }, at + 0.1);
          // Hide after duration
          var typeDur = dur || 1.5;
          tl.to(indicator, { autoAlpha: 0, duration: 0.15 }, at + typeDur);
        },

        'show-response': function(tl, container, action, at, dur) {
          var area = container.querySelector('.messages-area');
          var aColor = data.assistant_avatar_color || '#D97706';
          if (!area) return;

          // Hide typing indicator first
          var indicator = container.querySelector('.typing-indicator');
          if (indicator) {
            tl.to(indicator, { autoAlpha: 0, duration: 0.1 }, at);
          }

          tl.call(function() {
            var row = document.createElement('div');
            row.className = 'msg-row assistant';

            var avatar = document.createElement('div');
            avatar.className = 'msg-avatar assistant';
            avatar.style.background = aColor;
            avatar.innerHTML = '<svg viewBox="0 0 24 24" fill="none"><path d="M15 5l-3.5 7L15 19h-2.5L9 12l3.5-7H15zM10 5L6.5 12 10 19H7.5L4 12 7.5 5H10z" fill="#fff"/></svg>';
            row.appendChild(avatar);

            var content = document.createElement('div');
            content.className = 'msg-content';
            var textEl = document.createElement('div');
            textEl.className = 'msg-text';
            textEl.textContent = action.text || 'Hello! How can I help you today?';
            content.appendChild(textEl);
            row.appendChild(content);

            area.appendChild(row);
            gsap.from(row, { autoAlpha: 0, y: 12, duration: 0.35, ease: 'power2.out' });
          }, null, at + 0.15);
        }
      });
    }

    return tl;
  }
</script>
