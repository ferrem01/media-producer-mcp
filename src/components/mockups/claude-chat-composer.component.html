    var typingIndicator = el.querySelector('.typing-indicator');

    // ── Data ──
    var messages = data.messages || [];
    var assistantName = data.assistant_name || 'Claude';
    var avatarColor = data.assistant_avatar_color || '#D97706';
    var placeholder = data.composer_placeholder || ('Message ' + assistantName + '...');
    var menuItems = data.menu_items || [];
    var showSidebar = data.show_sidebar !== undefined ? data.show_sidebar : false;
    var modelLabelText = data.model_label || 'Sonnet 4.6 Low';

    // ── Setup ──
    composerInput.setAttribute('data-placeholder', placeholder);

    // Model selector: "Sonnet 4.6" bold + "Low" muted + chevron
    var mParts = modelLabelText.split(' ');
    if (mParts.length >= 2) {
      var nameSpan = document.createElement('span');
      nameSpan.className = 'model-name';
      nameSpan.textContent = mParts.slice(0, -1).join(' ');
      var qualSpan = document.createElement('span');
      qualSpan.className = 'model-quality';
      qualSpan.textContent = ' ' + mParts[mParts.length - 1];
      var chevSpan = document.createElement('span');
      chevSpan.className = 'model-chevron';
      chevSpan.textContent = ' \u25BE';
      modelSelector.appendChild(nameSpan);
      modelSelector.appendChild(qualSpan);
      modelSelector.appendChild(chevSpan);
    } else {
      modelSelector.textContent = modelLabelText;
    }

    if (!showSidebar) sidebar.classList.add('hidden');
    else {
      var convos = el.querySelector('.sidebar-conversations');
      ['Current conversation','API integration help','Code review notes'].forEach(function(label, i) {
        var ci = document.createElement('div');
        ci.className = 'sidebar-convo-item' + (i === 0 ? ' active' : '');
        ci.textContent = label;
        convos.appendChild(ci);

    // ── Messages ──
    var messageEls = [];
    messages.forEach(function(msg) {
      var role = msg.role || 'user';
      var row = document.createElement('div');
      row.className = 'msg-row ' + role;
      if (role === 'assistant') {
        var av = document.createElement('div');
        av.className = 'msg-avatar assistant';

      t.textContent = msg.text || '';

      row.appendChild(c);
      messagesArea.appendChild(row);

      globe: '<svg viewBox="0 0 22 22" fill="none" stroke="currentColor" stroke-width="1.4"><circle cx="11" cy="11" r="8"/><path d="M3 11h16M11 3c2.5 2.5 2.5 13.5 0 16M11 3c-2.5 2.5-2.5 13.5 0 16"/></svg>',

    var pmDef = [
      { label: 'Add files or photos', icon: 'paperclip', shortcut: '\u2318U' },
      { label: 'Add to project', icon: 'tray', chevron: true },
      { divider: true },
      { label: 'Skills', icon: 'skills', chevron: true },
      { label: 'Connectors', icon: 'connector', chevron: true, id: 'connectors' },
      { label: 'Add plugins\u2026', icon: 'plug' },
      { divider: true },
      { label: 'Research', icon: 'research' },
      { label: 'Web search', icon: 'globe', check: true },
      { label: 'Use style', icon: 'pen', chevron: true }
    ];

    var connectorsItemEl = null;
    pmDef.forEach(function(def) {
      if (def.divider) {
        var d = document.createElement('div');
        d.className = 'pm-divider';
        pmContainer.appendChild(d);
        return;
      }
      var row = document.createElement('div');
      row.className = 'pm-item';
      if (def.id) row.setAttribute('data-target', 'pm-' + def.id);

      var ic = document.createElement('div');
      ic.className = 'pm-item-icon';
      ic.innerHTML = pmIcons[def.icon] || '';
      row.appendChild(ic);

      var lb = document.createElement('span');
      lb.className = 'pm-item-label';

      row.appendChild(lb);

      var rt = document.createElement('span');

      if (def.shortcut) { var s = document.createElement('span'); s.className = 'shortcut'; s.textContent = def.shortcut; rt.appendChild(s); }

      if (def.id === 'connectors') connectorsItemEl = row;

      row.className = 'sm-row';

      var ic = document.createElement('div');
      ic.className = 'sm-footer-icon';
      ic.innerHTML = fd.icon;
      row.appendChild(ic);

      if (fd.sub) {
        var wrap = document.createElement('div');
        wrap.className = 'sm-footer-label';
        var main = document.createElement('span');
        main.className = 'sm-label-main';
        main.textContent = fd.label;
        var sub = document.createElement('span');
        sub.className = 'sm-label-sub';
        sub.textContent = fd.sub;
        wrap.appendChild(main);
        wrap.appendChild(sub);
        row.appendChild(wrap);
      } else {
        var lb = document.createElement('span');
        lb.className = 'sm-label';
        lb.style.color = '#1a1a1a'; lb.style.fontWeight = '450';
        lb.textContent = fd.label;
        row.appendChild(lb);
      }

      if (fd.chevron) {
        var rt = document.createElement('span');
        rt.className = 'sm-row-right';
        rt.textContent = '\u203A';
        row.appendChild(rt);
      }

      smFooter.appendChild(row);
    });

    // ── Position menus relative to + button ──
    gsap.set(plusMenu, { autoAlpha: 0, y: 10, scale: 0.97 });
    gsap.set(submenu, { autoAlpha: 0, x: -8, scale: 0.97 });
    gsap.set(typingIndicator, { autoAlpha: 0 });

    var _posMenus = function() {
      var chatR = chat.getBoundingClientRect();
      var btnR = plusBtn.getBoundingClientRect();
      plusMenu.style.left = (btnR.left - chatR.left) + 'px';
      plusMenu.style.bottom = (chatR.bottom - btnR.top + 8) + 'px';
      plusMenu.style.top = 'auto';
      var pmR = plusMenu.getBoundingClientRect();
      submenu.style.left = (pmR.right - chatR.left - 2) + 'px';
      if (connectorsItemEl) {
        var ciR = connectorsItemEl.getBoundingClientRect();
        var subH = submenu.offsetHeight || 200;
        submenu.style.bottom = (chatR.bottom - ciR.bottom - subH + 40) + 'px';
      } else {
        submenu.style.bottom = plusMenu.style.bottom;
      }
      submenu.style.top = 'auto';
    };

    // ── Initial state ──
    gsap.set(chat, { autoAlpha: 0 });
    gsap.set(messageEls, { autoAlpha: 0, y: 16 });
    var speed = ctx.motion === 'minimal' ? 0.4 : ctx.motion === 'punchy' ? 0.6 : 0.8;

    tl.to(chat, { autoAlpha: 1, duration: speed * 0.6, ease: 'power2.out' }, 0.2);
    var t = 0.2 + speed * 0.6 + 0.2;
    messageEls.forEach(function(mel) {
      tl.to(mel, { autoAlpha: 1, y: 0, duration: 0.35, ease: 'power2.out' }, t);
      t += 0.25;
    });

    if (ctx.duration > 2) {
      tl.to(chat, { autoAlpha: 0, duration: 0.4, ease: 'power2.in' }, ctx.duration - 0.5);
    }

    // ── Script actions ──
    if (data.script && data.script.length > 0) {
      var cursorTargets = data.cursor_targets || {
        'chat-input': { x: '50%', y: '46%' },
        'send-button': { x: '67%', y: '53%' },
        'plus-button': { x: '34%', y: '54%' },
        'mic-button': { x: '65%', y: '53%' },
        'connectors-item': { x: '36%', y: '31%' },
        'quotient-toggle': { x: '60%', y: '25%' }
      };

      runScript(tl, el, data.script, cursorTargets, ctx, {
        'type': function(tl, ctr, action, at) {
          var input = ctr.querySelector('[data-target="chat-input"]');
          if (!input) return;
          typeText(tl, input, action.text || '', at, action.speed || 25);
        },
        'click': function(tl, ctr, action, at) {
          var target = action.target || 'send-button';
          if (target === 'send-button' || target === 'send') {
            var input = ctr.querySelector('[data-target="chat-input"]');
            var area = ctr.querySelector('.messages-area');
            if (input && area) {
              tl.call(function() {
                var msgText = input.textContent;
                if (!msgText) return;
                var row = document.createElement('div');
                row.className = 'msg-row user';
                var cnt = document.createElement('div'); cnt.className = 'msg-content';
                var txt = document.createElement('div'); txt.className = 'msg-text';
                txt.textContent = msgText; cnt.appendChild(txt); row.appendChild(cnt);
                area.appendChild(row);
                gsap.from(row, { autoAlpha: 0, y: 12, duration: 0.3, ease: 'power2.out' });
                input.textContent = '';
              }, null, at);
            }
          } else if (target === 'plus-button' || target === 'plus') {
            var pb = ctr.querySelector('.plus-btn');
            if (pb) { tl.call(function() { pb.classList.add('active'); }, null, at); tl.call(function() { pb.classList.remove('active'); }, null, at + 0.4); }
          }
        },
        'open-menu': function(tl, ctr, action, at) {
          var menu = ctr.querySelector('.plus-menu');
          var items = ctr.querySelectorAll('.pm-item');
          tl.call(_posMenus, null, at);
          tl.to(menu, { autoAlpha: 1, y: 0, scale: 1, duration: 0.25, ease: 'back.out(1.2)' }, at + 0.05);
          if (items.length) {
            gsap.set(items, { autoAlpha: 0, y: 6 });
            tl.to(items, { autoAlpha: 1, y: 0, duration: 0.2, stagger: 0.035, ease: 'power2.out' }, at + 0.1);
          }
        },
        'close-menu': function(tl, ctr, action, at) {
          tl.to(ctr.querySelector('.connectors-submenu'), { autoAlpha: 0, x: -8, scale: 0.97, duration: 0.15, ease: 'power2.in' }, at);
          tl.to(ctr.querySelector('.plus-menu'), { autoAlpha: 0, y: 10, scale: 0.97, duration: 0.2, ease: 'power2.in' }, at + 0.05);
        },
        'hover-plus': function(tl, ctr, action, at) {
          var pb = ctr.querySelector('.plus-btn');
          if (pb) {
            tl.call(function() { pb.classList.add('hovered'); }, null, at);
          }
        },
        'unhover-plus': function(tl, ctr, action, at) {
          var pb = ctr.querySelector('.plus-btn');
          if (pb) {
            tl.call(function() { pb.classList.remove('hovered'); }, null, at);
          }
        },
        'hover-connectors': function(tl, ctr, action, at) {
          var pb = ctr.querySelector('.plus-btn');
          if (pb) tl.call(function() { pb.classList.remove('hovered'); }, null, at);
          var ci = ctr.querySelector('[data-target="pm-connectors"]');
          if (ci) tl.call(function() { ci.classList.add('hovered'); }, null, at);
        },
        'show-connectors': function(tl, ctr, action, at) {
          var sm = ctr.querySelector('.connectors-submenu');
          var rows = sm.querySelectorAll('.sm-row');
          tl.call(_posMenus, null, at);
          tl.to(sm, { autoAlpha: 1, x: 0, scale: 1, duration: 0.25, ease: 'back.out(1.2)' }, at + 0.05);
          if (rows.length) {
            gsap.set(rows, { autoAlpha: 0, x: -6 });
            tl.to(rows, { autoAlpha: 1, x: 0, duration: 0.2, stagger: 0.035, ease: 'power2.out' }, at + 0.1);
          }
        },
        'toggle-item': function(tl, ctr, action, at) {
          var idx = action.index != null ? action.index : null;
          var targetName = action.target || '';
          var toggleEl = null;
          if (idx !== null) {
            toggleEl = ctr.querySelector('[data-target="toggle-' + idx + '"]');
          } else if (targetName) {
            for (var i = 0; i < menuItems.length; i++) {
              var n = (menuItems[i].name || menuItems[i].label || '').toLowerCase();
              var id = (menuItems[i].id || '').toLowerCase();
              if (n === targetName.toLowerCase() || id === targetName.toLowerCase()) {
                toggleEl = ctr.querySelector('[data-target="toggle-' + i + '"]');
                break;
              }
            }
          }
          if (toggleEl) {
            tl.call(function() {
              toggleEl.classList.toggle('on');
            }, null, at);
          }
        },
        'show-typing': function(tl, ctr, action, at, dur) {
          var ind = ctr.querySelector('.typing-indicator');
          if (!ind) return;
          ind.style.bottom = (ctr.querySelector('.composer-wrapper').offsetHeight + 8) + 'px';
          tl.to(ind, { autoAlpha: 1, duration: 0.2 }, at);
          var dots = ind.querySelectorAll('.typing-dot');
          tl.to(dots, { y: -4, duration: 0.3, stagger: 0.1, ease: 'power2.out', yoyo: true, repeat: 3 }, at + 0.1);
          tl.to(ind, { autoAlpha: 0, duration: 0.15 }, at + (dur || 1.5));
        },
        'show-response': function(tl, ctr, action, at) {
          var area = ctr.querySelector('.messages-area');
          var aColor = data.assistant_avatar_color || '#D97706';
          if (!area) return;
          var ind = ctr.querySelector('.typing-indicator');
          if (ind) tl.to(ind, { autoAlpha: 0, duration: 0.1 }, at);
          tl.call(function() {
            var row = document.createElement('div');
            row.className = 'msg-row assistant';
            var av = document.createElement('div'); av.className = 'msg-avatar assistant';
            av.style.background = aColor;
            av.innerHTML = '<svg viewBox="0 0 24 24" fill="none"><path d="M15 5l-3.5 7L15 19h-2.5L9 12l3.5-7H15zM10 5L6.5 12 10 19H7.5L4 12 7.5 5H10z" fill="#fff"/></svg>';
            row.appendChild(av);
            var cnt = document.createElement('div'); cnt.className = 'msg-content';
            var txt = document.createElement('div'); txt.className = 'msg-text';
            txt.textContent = action.text || 'Hello! How can I help you today?';
            cnt.appendChild(txt); row.appendChild(cnt);
            area.appendChild(row);
            gsap.from(row, { autoAlpha: 0, y: 12, duration: 0.35, ease: 'power2.out' });
          }, null, at + 0.15);
        }
      });
    }
    return tl;
  }
</script>
