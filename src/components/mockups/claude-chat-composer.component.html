<script>
  function createTimeline(el, data, ctx) {
    var tl = gsap.timeline();
    var chat = el.querySelector('.claude-chat');
    var sidebar = el.querySelector('.claude-sidebar');
    var messagesArea = el.querySelector('.messages-area');
    var composerBar = el.querySelector('.composer-bar');
    var composerInput = el.querySelector('.composer-input');
    var sendBtn = el.querySelector('.send-btn');
    var plusBtn = el.querySelector('.plus-btn');
    var plusMenu = el.querySelector('.plus-menu');
    var plusMenuItemsContainer = el.querySelector('.plus-menu-items');
    var connectorsSubmenu = el.querySelector('.connectors-submenu');
    var submenuItemsContainer = el.querySelector('.submenu-items');
    var typingIndicator = el.querySelector('.typing-indicator');
    var modelSelector = el.querySelector('.model-selector');
    var modelLabel = el.querySelector('.composer-model-label');

    // ── Data defaults ──
    var messages = data.messages || [];
    var assistantName = data.assistant_name || 'Claude';
    var avatarColor = data.assistant_avatar_color || '#D97706';
    var placeholder = data.composer_placeholder || ('Message ' + assistantName + '...');
    var menuItems = data.menu_items || [];
    var showSidebar = data.show_sidebar !== undefined ? data.show_sidebar : false;
    var modelLabelText = data.model_label || 'Sonnet 4.6 Low';

    // ── Setup ──
    composerInput.setAttribute('data-placeholder', placeholder);
    sendBtn.className = "send-btn active";

    // Model selector in composer bar
    var parts = modelLabelText.split(' ');
    if (parts.length >= 2) {
      var nameSpan = document.createElement('span');
      nameSpan.className = 'model-name';
      nameSpan.textContent = parts.slice(0, -1).join(' ');
      modelSelector.appendChild(nameSpan);
      modelSelector.appendChild(document.createTextNode(' ' + parts[parts.length - 1]));
    } else {
      modelSelector.textContent = modelLabelText;
    }

    if (!showSidebar) {
      sidebar.classList.add('hidden');
    } else {
      var convos = el.querySelector('.sidebar-conversations');
      var convoLabels = ['Current conversation', 'API integration help', 'Code review notes'];
      for (var c = 0; c < convoLabels.length; c++) {
        var ci = document.createElement('div');
        ci.className = 'sidebar-convo-item' + (c === 0 ? ' active' : '');
        ci.textContent = convoLabels[c];
        convos.appendChild(ci);
      }
    }

    // ── Build messages ──
    var messageEls = [];
    for (var i = 0; i < messages.length; i++) {
      var msg = messages[i];
      var role = msg.role || 'user';
      var row = document.createElement('div');
      row.className = 'msg-row ' + role;
      if (role === 'assistant') {
        var avatarEl = document.createElement('div');
        avatarEl.className = 'msg-avatar assistant';
        avatarEl.style.background = avatarColor;
        avatarEl.innerHTML = '<svg viewBox="0 0 24 24" fill="none"><path d="M15 5l-3.5 7L15 19h-2.5L9 12l3.5-7H15zM10 5L6.5 12 10 19H7.5L4 12 7.5 5H10z" fill="#fff"/></svg>';
        row.appendChild(avatarEl);
      }
      var content = document.createElement('div');
      content.className = 'msg-content';
      var text = document.createElement('div');
      text.className = 'msg-text';
      text.textContent = msg.text || '';
      content.appendChild(text);
      row.appendChild(content);
      messagesArea.appendChild(row);
      messageEls.push(row);
    }

    // ── Build primary + menu ──
    var primaryMenuDef = [
      { label: 'Add files or photos', icon: 'paperclip', shortcut: '⌘U' },
      { label: 'Add to project', icon: 'tray', chevron: true },
      { divider: true },
      { label: 'Skills', icon: 'doc', chevron: true },
      { label: 'Connectors', icon: 'connector', chevron: true, id: 'connectors' },
      { label: 'Add plugins...', icon: 'plug' },
      { divider: true },
      { label: 'Research', icon: 'research' },
      { label: 'Web search', icon: 'globe', check: true },
      { label: 'Use style', icon: 'pen', chevron: true }
    ];

    var svgIcons = {
      paperclip: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"><path d="M13.5 7.5l-6 6a3 3 0 01-4.24-4.24l6-6a2 2 0 012.83 2.83l-6 6a1 1 0 01-1.42-1.42l6-6"/></svg>',
      tray: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"><rect x="2" y="3" width="12" height="10" rx="2"/><path d="M2 10h4l1 2h2l1-2h4"/></svg>',
      doc: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"><rect x="3" y="1.5" width="10" height="13" rx="1.5"/><path d="M6 5h4M6 8h4M6 11h2"/></svg>',
      connector: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"><rect x="1.5" y="1.5" width="5" height="5" rx="1"/><rect x="9.5" y="9.5" width="5" height="5" rx="1"/><path d="M6.5 4H9.5M12 6.5V9.5"/></svg>',
      plug: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"><path d="M6 2v4M10 2v4M4 6h8v2a4 4 0 01-8 0V6zM8 12v2.5"/></svg>',
      research: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"><circle cx="7" cy="7" r="4.5"/><path d="M10.5 10.5L14 14"/><path d="M5 7h4"/></svg>',
      globe: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3"><circle cx="8" cy="8" r="6"/><path d="M2 8h12M8 2c2 2 2 10 0 12M8 2c-2 2-2 10 0 12"/></svg>',
      pen: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"><path d="M8 2.5c1.5-1 3 0 3.5 1s-.5 3-2 5-4 4-5 4c-1.5 0-2-1-1.5-2.5s2-3.5 3.5-5.5z"/><path d="M4.5 12.5l1-3"/></svg>'
    };

    var connectorsItemEl = null;
    var pmItemEls = [];
    for (var p = 0; p < primaryMenuDef.length; p++) {
      var def = primaryMenuDef[p];
      if (def.divider) {
        var div = document.createElement('div');
        div.className = 'pm-divider';
        plusMenuItemsContainer.appendChild(div);
        continue;
      }
      var pmItem = document.createElement('div');
      pmItem.className = 'pm-item';
      if (def.id) pmItem.setAttribute('data-target', 'pm-' + def.id);

      var pmIcon = document.createElement('div');
      pmIcon.className = 'pm-item-icon';
      pmIcon.innerHTML = svgIcons[def.icon] || '';
      pmItem.appendChild(pmIcon);

      var pmLabel = document.createElement('span');
      pmLabel.className = 'pm-item-label';
      pmLabel.textContent = def.label;
      pmItem.appendChild(pmLabel);

      var pmRight = document.createElement('span');
      pmRight.className = 'pm-item-right';
      if (def.shortcut) {
        var sc = document.createElement('span');
        sc.className = 'shortcut';
        sc.textContent = def.shortcut;
        pmRight.appendChild(sc);
      }
      if (def.check) {
        var ck = document.createElement('span');
        ck.className = 'check';
        ck.textContent = '✓';
        pmRight.appendChild(ck);
      }
      if (def.chevron) {
        var ch = document.createElement('span');
        ch.className = 'chevron';
        ch.textContent = '›';
        pmRight.appendChild(ch);
      }
      pmItem.appendChild(pmRight);

      plusMenuItemsContainer.appendChild(pmItem);
      pmItemEls.push(pmItem);
      if (def.id === 'connectors') connectorsItemEl = pmItem;
    }

    // ── Build connectors submenu items ──
    var connectorIcons = { 'Canva': '🎨', 'HubSpot': '🟠', 'HyperFrames by HeyGen': '🎬', 'Quotient': '💜', 'Claude in Chrome': '🌐', 'gmail': '✉️' };
    var smItemEls = [];
    for (var m = 0; m < menuItems.length; m++) {
      var mi = menuItems[m];
      var smItem = document.createElement('div');
      smItem.className = 'sm-item';
      smItem.setAttribute('data-target', 'sm-item-' + m);

      var smIcon = document.createElement('div');
      smIcon.className = 'sm-item-icon';
      var itemName = mi.name || mi.label || 'Tool';
      smIcon.textContent = mi.icon || connectorIcons[itemName] || '🔌';
      smItem.appendChild(smIcon);

      var smName = document.createElement('span');
      smName.className = 'sm-item-name';
      smName.textContent = itemName;
      smItem.appendChild(smName);

      var enabled = mi.connected || mi.enabled || false;
      var smToggle = document.createElement('div');
      smToggle.className = 'sm-toggle' + (enabled ? ' on' : '');
      smToggle.setAttribute('data-target', 'toggle-' + m);
      var smKnob = document.createElement('div');
      smKnob.className = 'sm-toggle-knob';
      smToggle.appendChild(smKnob);
      smItem.appendChild(smToggle);

      submenuItemsContainer.appendChild(smItem);
      smItemEls.push({ el: smItem, toggle: smToggle, enabled: enabled });
    }

    // ── Position menus ──
    gsap.set(plusMenu, { autoAlpha: 0, y: 10, scale: 0.97 });
    gsap.set(connectorsSubmenu, { autoAlpha: 0, x: -8, scale: 0.97 });
    gsap.set(typingIndicator, { autoAlpha: 0 });

    var _positionMenus = function() {
      var chatRect = chat.getBoundingClientRect();
      var btnRect = plusBtn.getBoundingClientRect();
      // Primary menu above + button
      plusMenu.style.left = (btnRect.left - chatRect.left) + 'px';
      plusMenu.style.bottom = (chatRect.bottom - btnRect.top + 8) + 'px';
      plusMenu.style.top = 'auto';
      // Connectors submenu to the right of primary menu
      var pmRect = plusMenu.getBoundingClientRect();
      connectorsSubmenu.style.left = (pmRect.right - chatRect.left + 4) + 'px';
      // Align submenu roughly to connectors row
      if (connectorsItemEl) {
        var ciRect = connectorsItemEl.getBoundingClientRect();
        var subH = connectorsSubmenu.offsetHeight || 300;
        connectorsSubmenu.style.bottom = (chatRect.bottom - ciRect.bottom - subH/2 + 20) + 'px';
      } else {
        connectorsSubmenu.style.bottom = plusMenu.style.bottom;
      }
      connectorsSubmenu.style.top = 'auto';
    };

    // ── Initial states ──
    gsap.set(chat, { autoAlpha: 0 });
    gsap.set(messageEls, { autoAlpha: 0, y: 16 });

    var speed = ctx.motion === 'minimal' ? 0.4 : ctx.motion === 'punchy' ? 0.6 : 0.8;

    // ── Entrance ──
    tl.to(chat, { autoAlpha: 1, duration: speed * 0.6, ease: 'power2.out' }, 0.2);

    var t = 0.2 + speed * 0.6 + 0.2;
    for (var j = 0; j < messageEls.length; j++) {
      tl.to(messageEls[j], { autoAlpha: 1, y: 0, duration: 0.35, ease: 'power2.out' }, t);
      t += 0.25;
    }

    // ── Exit ──
    if (ctx.duration > 2) {
      var exitAt = ctx.duration - 0.5;
      tl.to(chat, { autoAlpha: 0, duration: 0.4, ease: 'power2.in' }, exitAt);
    }

    // ── Script handling ──
    if (data.script && data.script.length > 0) {
      var cursorTargets = data.cursor_targets || {
        'chat-input': { x: '50%', y: '88%' },
        'send-button': { x: '95%', y: '88%' },
        'plus-button': { x: '8%', y: '88%' },
        'mic-button': { x: '90%', y: '88%' },
        'connectors-item': { x: '28%', y: '68%' }
      };

      runScript(tl, el, data.script, cursorTargets, ctx, {

        'type': function(tl, container, action, at, dur) {
          var input = container.querySelector('[data-target="chat-input"]');
          if (!input) return;
          var txt = action.text || '';
          var spd = action.speed || 25;
          typeText(tl, input, txt, at, spd);
          var sBtn = container.querySelector('.send-btn');
          tl.call(function() { sBtn.className = 'send-btn active'; }, null, at + 0.1);
        },

        'click': function(tl, container, action, at, dur) {
          var target = action.target || 'send-button';
          if (target === 'send-button' || target === 'send') {
            var input = container.querySelector('[data-target="chat-input"]');
            var sBtn = container.querySelector('.send-btn');
            var area = container.querySelector('.messages-area');
            if (input && area) {
              var msgText = input.textContent;
              tl.call(function() {
                if (!msgText) return;
                var row = document.createElement('div');
                row.className = 'msg-row user';
                var cnt = document.createElement('div');
                cnt.className = 'msg-content';
                var textEl = document.createElement('div');
                textEl.className = 'msg-text';
                textEl.textContent = msgText;
                cnt.appendChild(textEl);
                row.appendChild(cnt);
                area.appendChild(row);
                gsap.from(row, { autoAlpha: 0, y: 12, duration: 0.3, ease: 'power2.out' });
                input.textContent = '';
                sBtn.className = 'send-btn ghost';
              }, null, at);
            }
          } else if (target === 'plus-button' || target === 'plus') {
            // Visual click feedback on + button
            var pb = container.querySelector('.plus-btn');
            if (pb) {
              tl.call(function() { pb.classList.add('active'); }, null, at);
              tl.call(function() { pb.classList.remove('active'); }, null, at + 0.3);
            }
          }
        },

        'open-menu': function(tl, container, action, at, dur) {
          var menu = container.querySelector('.plus-menu');
          var items = container.querySelectorAll('.pm-item');
          tl.call(_positionMenus, null, at);
          tl.to(menu, { autoAlpha: 1, y: 0, scale: 1, duration: 0.25, ease: 'power3.out' }, at + 0.05);
          if (items.length) {
            gsap.set(items, { autoAlpha: 0, y: 6 });
            tl.to(items, { autoAlpha: 1, y: 0, duration: 0.2, stagger: 0.04, ease: 'power2.out' }, at + 0.12);
          }
        },

        'close-menu': function(tl, container, action, at, dur) {
          var menu = container.querySelector('.plus-menu');
          var submenu = container.querySelector('.connectors-submenu');
          tl.to(submenu, { autoAlpha: 0, x: -8, scale: 0.97, duration: 0.15, ease: 'power2.in' }, at);
          tl.to(menu, { autoAlpha: 0, y: 10, scale: 0.97, duration: 0.2, ease: 'power2.in' }, at + 0.05);
        },

        'hover-connectors': function(tl, container, action, at, dur) {
          var cItem = container.querySelector('[data-target="pm-connectors"]');
          if (cItem) {
            tl.call(function() { cItem.classList.add('hovered'); }, null, at);
          }
        },

        'show-connectors': function(tl, container, action, at, dur) {
          var submenu = container.querySelector('.connectors-submenu');
          var items = container.querySelectorAll('.sm-item');
          tl.call(_positionMenus, null, at);
          tl.to(submenu, { autoAlpha: 1, x: 0, scale: 1, duration: 0.25, ease: 'power3.out' }, at + 0.05);
          if (items.length) {
            gsap.set(items, { autoAlpha: 0, x: -6 });
            tl.to(items, { autoAlpha: 1, x: 0, duration: 0.2, stagger: 0.04, ease: 'power2.out' }, at + 0.12);
          }
        },

        'toggle-item': function(tl, container, action, at, dur) {
          // Support both index and target name
          var idx = action.index != null ? action.index : null;
          var targetName = action.target || '';
          var toggleEl = null;

          if (idx !== null) {
            toggleEl = container.querySelector('[data-target="toggle-' + idx + '"]');
          } else if (targetName) {
            // Find by connector name/id
            for (var ti = 0; ti < menuItems.length; ti++) {
              var tiName = (menuItems[ti].name || menuItems[ti].label || '').toLowerCase();
              var tiId = (menuItems[ti].id || '').toLowerCase();
              if (tiName === targetName.toLowerCase() || tiId === targetName.toLowerCase()) {
                toggleEl = container.querySelector('[data-target="toggle-' + ti + '"]');
                break;
              }
            }
          }

          if (toggleEl) {
            tl.call(function() {
              var isOn = toggleEl.classList.contains('on');
              if (isOn) {
                toggleEl.classList.remove('on');
              } else {
                toggleEl.classList.add('on');
              }
            }, null, at);
          }
        },

        'show-typing': function(tl, container, action, at, dur) {
          var indicator = container.querySelector('.typing-indicator');
          var area = container.querySelector('.messages-area');
          if (!indicator || !area) return;
          indicator.style.bottom = (container.querySelector('.composer-wrapper').offsetHeight + 8) + 'px';
          tl.to(indicator, { autoAlpha: 1, duration: 0.2 }, at);
          var dots = indicator.querySelectorAll('.typing-dot');
          tl.to(dots, { y: -4, duration: 0.3, stagger: 0.1, ease: 'power2.out', yoyo: true, repeat: 3 }, at + 0.1);
          var typeDur = dur || 1.5;
          tl.to(indicator, { autoAlpha: 0, duration: 0.15 }, at + typeDur);
        },

        'show-response': function(tl, container, action, at, dur) {
          var area = container.querySelector('.messages-area');
          var aColor = data.assistant_avatar_color || '#D97706';
          if (!area) return;
          var indicator = container.querySelector('.typing-indicator');
          if (indicator) tl.to(indicator, { autoAlpha: 0, duration: 0.1 }, at);
          tl.call(function() {
            var row = document.createElement('div');
            row.className = 'msg-row assistant';
            var avatar = document.createElement('div');
            avatar.className = 'msg-avatar assistant';
            avatar.style.background = aColor;
            avatar.innerHTML = '<svg viewBox="0 0 24 24" fill="none"><path d="M15 5l-3.5 7L15 19h-2.5L9 12l3.5-7H15zM10 5L6.5 12 10 19H7.5L4 12 7.5 5H10z" fill="#fff"/></svg>';
            row.appendChild(avatar);
            var cnt = document.createElement('div');
            cnt.className = 'msg-content';
            var textEl = document.createElement('div');
            textEl.className = 'msg-text';
            textEl.textContent = action.text || 'Hello! How can I help you today?';
            cnt.appendChild(textEl);
            row.appendChild(cnt);
            area.appendChild(row);
            gsap.from(row, { autoAlpha: 0, y: 12, duration: 0.35, ease: 'power2.out' });
          }, null, at + 0.15);
        }
      });
    }

    return tl;
  }
</script>
