  /* A Quotient flow, drawn from a list of steps in the product's own look
     (measured off a capture of the real flow editor: 192px cards, 10px
     radius, the soft two-layer shadow, grey bezier connectors, True/False
     pills, the dotted canvas). It lays itself out, unfurls step by step,
     and takes a script: highlight (with a twinkle), a path that runs
     through the flow, and camera focus. */
  /* The scene's `.mp-component * { max-width: 100% }` would squeeze every
     card to the zero-width world layer that holds it. */
  .qf-root, .qf-root * { max-width: none; }
  .qf-root { position: relative; width: 100%; height: 100%; overflow: hidden; background: #f9f9fb; border-radius: inherit; }
  .qf-stage {
    position: absolute; left: 0; top: 0; transform-origin: 0 0; overflow: hidden;
    font-family: Inter, -apple-system, 'Segoe UI', Roboto, sans-serif; color: rgb(23, 23, 28);
  }
  .qf-cam { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
  .qf-dots {
    position: absolute; left: -3000px; top: -3000px; width: 7000px; height: 9000px;
    background-image: radial-gradient(circle, #cfcfdd 1.1px, transparent 1.5px); background-size: 20px 20px;
  }
  .qf-world { position: absolute; left: 0; top: 0; }

      no: { bg: '#fef6f6', border: 'rgba(220, 38, 38, 0.2)', dot: '#fde2e2', icon: '#dc2626', text: '#991b1b', glyph: 'x' },

    order.forEach(function (id) {

        var hd = document.createElement('div'); hd.className = 'qf-hd';
        var ic = document.createElement('div'); ic.className = 'qf-ic'; ic.innerHTML = iconHtml(n.icon);
        var tt = document.createElement('span'); tt.textContent = n.title;
        hd.appendChild(ic); hd.appendChild(tt);
        if (n.step.ai) { var ai = document.createElement('div'); ai.className = 'qf-ic'; ai.innerHTML = iconHtml('quotient'); hd.appendChild(ai); }

        if (n.subtitle) { var sub = document.createElement('p'); sub.className = 'qf-sub'; sub.textContent = n.subtitle; card.appendChild(sub); }

          var cl = document.createElement('span'); cl.textContent = n.chip; chip.appendChild(cl);

      var glow = document.createElement('div'); glow.className = 'qf-glow'; glow.style.color = ACC;
      glow.style.boxShadow = '0 0 0 4px ' + rgba(ACC, 0.14) + ', 0 10px 28px ' + rgba(ACC, 0.28);
      var lit = document.createElement('div'); lit.className = 'qf-lit'; lit.style.color = ACC;
      var ring = document.createElement('div'); ring.className = 'qf-ring'; ring.style.color = ACC;
      card.appendChild(lit); card.appendChild(glow); card.appendChild(ring);
      box.appendChild(card);
      nodesEl.appendChild(box);
      n.box = box; n.card = card; n.glow = glow; n.lit = lit; n.ring = ring;

    });

      var n = G[id];
      if (order.some(function (o) { return G[o].parents.indexOf(id) !== -1; })) {

      }
    });

    function rgba(hex, a) {
      var h = String(hex).replace('#', '');
      if (h.length === 3) h = h.split('').map(function (c) { return c + c; }).join('');

    // ---- Edges: the product's bezier (vertical tangents at both ends) ----
    var EDGES = {};
    function bez(x1, y1, x2, y2) {
      var ym = (y1 + y2) / 2;
      return { d: 'M' + x1 + ',' + y1 + ' C' + x1 + ',' + ym + ' ' + x2 + ',' + ym + ' ' + x2 + ',' + y2, p: [x1, y1, x1, ym, x2, ym, x2, y2] };

    function bezPoint(p, t) {

      return {
        x: u * u * u * p[0] + 3 * u * u * t * p[2] + 3 * u * t * t * p[4] + t * t * t * p[6],
        y: u * u * u * p[1] + 3 * u * u * t * p[3] + 3 * u * t * t * p[5] + t * t * t * p[7]
      };
    }
    function samples(p) {
      var pts = [], len = 0, prev = null;
      for (var i = 0; i <= 24; i++) {
        var q = bezPoint(p, i / 24);
        if (prev) len += Math.sqrt((q.x - prev.x) * (q.x - prev.x) + (q.y - prev.y) * (q.y - prev.y));
        pts.push(q); prev = q;
      }

    }
    order.forEach(function (id) {
      var n = G[id];
      n.parents.forEach(function (pid) {
        var p = G[pid];
        var b = bez(p.x, p.y + p.h, n.x, n.y);
        var path = document.createElementNS(SVGNS, 'path');
        path.setAttribute('d', b.d); path.setAttribute('fill', 'none');
        path.setAttribute('stroke', 'rgb(208, 208, 226)'); path.setAttribute('stroke-width', '1.5');
        edgesSvg.appendChild(path);
        var s = samples(b.p);
        EDGES[pid + '>' + id] = { from: pid, to: id, el: path, bez: b, pts: s.pts, len: s.len };
      });
    });

    // ---- Stage + camera: a design stage 1000 wide at the box's aspect,
    // scaled to the box; the camera frames the flow inside it ----
    var bw0 = el.clientWidth || 1000, bh0 = el.clientHeight || 562;
    var DW = 1000, DH = Math.round(1000 * bh0 / bw0);
    stage.style.width = DW + 'px'; stage.style.height = DH + 'px';
    var fit = function () { stage.style.transform = 'scale(' + ((el.clientWidth || DW) / DW) + ')'; };
    fit();
    if (typeof ResizeObserver !== 'undefined') new ResizeObserver(fit).observe(el);

    var PAD = num(data.padding, 60);
    var fw = B.r - B.l, fh = B.b - B.t;
    var MAXZ = num(data.max_zoom, 1.8);
    var fitZ = Math.min((DW - 2 * PAD) / fw, (DH - 2 * PAD) / fh, MAXZ);
    function view(fx, fy, z) {
      // Keep the flow in frame: never pan past its edges (plus padding).
      var halfW = DW / 2 / z, halfH = DH / 2 / z;
      var minX = B.l - PAD / z + halfW, maxX = B.r + PAD / z - halfW;
      var minY = B.t - PAD / z + halfH, maxY = B.b + PAD / z - halfH;
      fx = minX > maxX ? (B.l + B.r) / 2 : Math.max(minX, Math.min(maxX, fx));
      fy = minY > maxY ? (B.t + B.b) / 2 : Math.max(minY, Math.min(maxY, fy));
      return { x: DW / 2 - fx * z, y: DH / 2 - fy * z, scale: z };
    }
    var FIT = view((B.l + B.r) / 2, (B.t + B.b) / 2, fitZ);
    var mode = data.camera === 'follow' ? 'follow' : 'fit';
    var followZ = num(data.zoom, Math.min(MAXZ, Math.max(fitZ, 1.35)));
    var keys = [];

    // ---- Unfurl: row by row (branches together), the edge draws in, the
    // step pops; a step's own `at` (seconds or a word) overrides its slot ----
    var UNF = data.unfurl !== false;
    var U_AT = num(data.unfurl_at, 0.15), PACE = num(data.pace, 0.16);
    order.forEach(function (id) {
      var n = G[id];
      var own = n.at !== undefined && n.at !== null && n.at !== '' && isFinite(Number(n.at)) ? Number(n.at) : null;
      n.t = own !== null ? own : U_AT + n.rank * PACE;
    });
    // A pill lands with (or just before) the step it labels.
    order.forEach(function (id) {
      var n = G[id];
      if (n.type !== 'pill') return;
      order.forEach(function (o) { if (G[o].parents.indexOf(id) !== -1) n.t = Math.min(n.t, G[o].t - PACE * 0.5); });
      var p = G[n.parents[0]];
      if (p) n.t = Math.max(n.t, p.t + 0.05);
    });
    if (UNF) {
      order.forEach(function (id) {
        var n = G[id];
        gsap.set(n.box, { autoAlpha: 0, scale: 0.86, y: -8, transformOrigin: '50% 30%' });
        tl.to(n.box, { autoAlpha: 1, scale: 1, y: 0, duration: 0.38, ease: 'back.out(1.7)' }, n.t);
        n.parents.forEach(function (pid) {
          var e = EDGES[pid + '>' + id];
          if (!e) return;
          gsap.set(e.el, { attr: { 'stroke-dasharray': e.len, 'stroke-dashoffset': e.len } });
          var st = Math.max(G[pid].t + 0.12, n.t - 0.16);
          tl.to(e.el, { attr: { 'stroke-dashoffset': 0 }, duration: Math.max(0.12, n.t + 0.06 - st), ease: 'power1.out' }, st);
        });
      });
    }
    if (mode === 'follow') {
      // The frontier: each row, framed in the lower part of the view.
      var seenRow = {};
      order.slice().sort(function (a, b) { return G[a].t - G[b].t; }).forEach(function (id) {
        var n = G[id];
        if (seenRow[n.rank]) return;
        seenRow[n.rank] = true;
        keys.push({ t: UNF ? n.t : 0, v: view((B.l + B.r) / 2, n.y + n.h - (DH / 2 / followZ) * 0.55, followZ) });
      });
    }

    // ---- The script ----
    var script = Array.isArray(data.script) ? data.script.filter(function (s) { return s && typeof s === 'object'; }) : [];
    function stepsOf(s) {
      var ids = Array.isArray(s.steps) ? s.steps : (s.step !== undefined ? [s.step] : []);
      return ids.map(String).filter(function (id) { return G[id]; });
    }
    var sparkN = 0;
    function twinkle(n, at, until) {
      // Four-point stars around the card, each on its own phase: finite
      // repeats up to `until` so the timeline keeps a real length.
      var w = n.card.offsetWidth || 192, h = n.h;
      var spots = [[-8, -8, 26], [w + 8, 6, 18], [w - 16, h + 10, 22], [6, h + 6, 15], [w / 2 + 44, -12, 13]];
      spots.forEach(function (sp, i) {
        var s = document.createElementNS(SVGNS, 'svg');
        s.setAttribute('viewBox', '0 0 24 24'); s.setAttribute('class', 'qf-spark');
        s.style.left = sp[0] + 'px'; s.style.top = sp[1] + 'px';
        s.style.width = sp[2] + 'px'; s.style.height = sp[2] + 'px';
        s.style.margin = (-sp[2] / 2) + 'px 0 0 ' + (-sp[2] / 2) + 'px';
        s.style.filter = 'drop-shadow(0 0 3px ' + rgba(ACC, 0.55) + ')';
        var p = document.createElementNS(SVGNS, 'path');
        p.setAttribute('d', 'M12 0C12.9 8 16 11.1 24 12C16 12.9 12.9 16 12 24C11.1 16 8 12.9 0 12C8 11.1 11.1 8 12 0Z');
        p.setAttribute('fill', i % 2 ? '#ffffff' : ACC);
        if (i % 2) { p.setAttribute('stroke', ACC); p.setAttribute('stroke-width', '1.5'); }
        s.appendChild(p);
        n.card.appendChild(s);
        var start = at + 0.1 + ((i * 0.37 + sparkN * 0.13) % 0.9);
        var cycle = 0.95 + (i % 3) * 0.15;
        var reps = Math.max(0, Math.floor((until - start) / (cycle + 0.2)) - 1);
        if (start >= until) return;
        gsap.set(s, { autoAlpha: 0, scale: 0, rotation: 0, transformOrigin: '50% 50%' });

          { autoAlpha: 1, scale: 1, rotation: 45, duration: cycle / 2, ease: 'power2.out' },

    function pulse(n, at) {

      tl.fromTo(n.ring, { autoAlpha: 0.7, scale: 1 }, { autoAlpha: 0, scale: 1.18, duration: 0.55, ease: 'power2.out', immediateRender: false }, at);
      tl.to(n.card, { keyframes: [{ scale: 1.05, duration: 0.14, ease: 'power2.out' }, { scale: 1, duration: 0.3, ease: 'power2.inOut' }] }, at);

    script.forEach(function (s) {
      var act = String(s.action || s.do || '').toLowerCase();
      var at = num(s.at, 0);
      if (act === 'highlight' || act === 'twinkle') {
        var until = Math.min(DUR, num(s.until, DUR));
        stepsOf(s).forEach(function (id) {
          var n = G[id];
          tl.to(n.glow, { autoAlpha: 1, duration: 0.3, ease: 'power2.out' }, at);
          pulse(n, at);
          if (s.twinkle !== false && act !== 'glow') twinkle(n, at, until);
          if (s.until !== undefined && until < DUR) tl.to(n.glow, { autoAlpha: 0, duration: 0.3 }, until);
        });
      } else if (act === 'path') {
        var ids = stepsOf(s);
        if (ids.length < 2) return;
        var hop = num(s.hop, 0.42);
        // A path rides in close when the whole flow is too small to read
        // (a wide flow on a phone frame): unless the board pins camera "fit".
        var ride = mode === 'follow' || s.follow === true || (s.follow !== false && data.camera !== 'fit' && fitZ < 1.5);
        var rideZ = num(s.zoom, mode === 'follow' ? followZ : Math.min(MAXZ + 0.6, 2.2));
        var col = s.color || ACC;
        var dot = document.createElement('div');
        dot.className = 'qf-dot'; dot.style.background = col;
        dot.style.boxShadow = '0 0 0 4px ' + rgba(col, 0.18) + ', 0 0 14px ' + rgba(col, 0.6);
        runner.appendChild(dot);
        gsap.set(dot, { autoAlpha: 0 });
        var t = at;
        tl.to(G[ids[0]].lit, { autoAlpha: 1, duration: 0.2 }, t);
        pulse(G[ids[0]], t);
        if (ride) keys.push({ t: t, v: view(G[ids[0]].x, G[ids[0]].y + G[ids[0]].h / 2, rideZ) });

        var first = true;
        for (var i = 1; i < ids.length; i++) {
          var a = ids[i - 1], b = ids[i];
          var chain = EDGES[a + '>' + b] ? [EDGES[a + '>' + b]]
            : (EDGES[a + '>pill:' + b] && EDGES['pill:' + b + '>' + b]) ? [EDGES[a + '>pill:' + b], EDGES['pill:' + b + '>' + b]] : null;
          if (!chain) continue;

          chain.forEach(function (e) { total += e.len; });

            tr.setAttribute('stroke', col); tr.setAttribute('stroke-width', '2.5'); tr.setAttribute('stroke-linecap', 'round');

            if (first) { gsap.set(dot, { x: e.pts[0].x, y: e.pts[0].y }); first = false; }
            frames.push({ x: e.pts[0].x, y: e.pts[0].y, duration: 0.001 });
            for (var k = 1; k < e.pts.length; k++) frames.push({ x: e.pts[k].x, y: e.pts[k].y, duration: d / (e.pts.length - 1), ease: 'none' });
            t += d;
            if (e.to.indexOf('pill:') === 0) pulse(G[e.to], t);
          });
          tl.to(G[b].lit, { autoAlpha: 1, duration: 0.2 }, t);
          pulse(G[b], t);
          if (ride) keys.push({ t: t, v: view(G[b].x, G[b].y + G[b].h / 2, rideZ) });

        if (frames.length) {
          tl.to(dot, { autoAlpha: 1, duration: 0.12 }, at);
          tl.to(dot, { keyframes: frames }, at);

        var fid = stepsOf(s)[0];
        if (fid) keys.push({ t: at, v: view(G[fid].x, G[fid].y + G[fid].h / 2, num(s.zoom, 1.8)), ease: true });

    // ---- Camera keys: a smooth move between consecutive frames ----
    keys.sort(function (a, b) { return a.t - b.t; });

    gsap.set(cam, { x: start.x, y: start.y, scale: start.scale, transformOrigin: '0 0' });
    var prevT = 0, prevV = start;
    keys.forEach(function (k) {
      var same = Math.abs(k.v.x - prevV.x) < 2 && Math.abs(k.v.y - prevV.y) < 2 && Math.abs(k.v.scale - prevV.scale) < 0.005;
      if (same) { prevT = Math.max(prevT, k.t); return; }
      var gap = k.t - prevT;
      var d = k.ease ? 0.9 : Math.max(0.2, Math.min(0.8, gap));
      var st = k.ease ? k.t : Math.max(prevT, k.t - d);
      tl.to(cam, { x: k.v.x, y: k.v.y, scale: k.v.scale, duration: d, ease: 'power2.inOut' }, st);
      prevT = st + d; prevV = k.v;
    });
    return tl;
  }
