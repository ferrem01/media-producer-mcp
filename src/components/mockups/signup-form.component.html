<style>

<script>
  function createTimeline(el, data, ctx) {
    var tl = gsap.timeline();
    data = data || {};
    var q = function (s) { return el.querySelector(s); };
    var num = function (v, d) { var n = Number(v); return (v === null || v === undefined || v === '' || !isFinite(n)) ? d : n; };
    var root = q('.sf-root'), stage = q('.sf-stage');
    function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }

    // ---- The design stage: 1440 wide at the box's aspect, scaled to the box ----
    var bw = el.clientWidth || 1440, bh = el.clientHeight || 810;
    var DW = 1440, DH = Math.max(560, Math.round(DW * bh / bw));
    stage.style.width = DW + 'px'; stage.style.height = DH + 'px';
    var S = bw / DW;
    stage.style.transform = 'scale(' + S + ')';
    if (DH * S > bh + 1) { S = bh / DH; stage.style.transform = 'translateX(' + ((bw - DW * S) / 2) + 'px) scale(' + S + ')'; }

    if (data.accent) root.style.setProperty('--sf-acc', String(data.accent));
    if (data.button_color) root.style.setProperty('--sf-btn', String(data.button_color));
    if (data.background) root.style.setProperty('--sf-bg', String(data.background));
    if (data.ink) root.style.setProperty('--sf-ink', String(data.ink));
    if (data.chrome === false) root.classList.add('nochrome');
    q('.sf-url-t').textContent = String(data.url || 'example.com/newsletter');
    if (data.logo_url) { var lg = q('.sf-logo'); lg.src = String(data.logo_url); lg.style.display = 'block'; }
    q('.sf-brand-t').textContent = data.logo_url ? '' : String(data.brand || '');
    q('.sf-eyebrow').textContent = data.eyebrow ? String(data.eyebrow) : '';
    q('.sf-title').innerHTML = esc(data.headline || 'Get the newsletter').replace(/\*([^*]+)\*/g, '<em>$1</em>');
    q('.sf-sub').textContent = data.subtitle ? String(data.subtitle) : '';
    q('.sf-ph').textContent = String(data.placeholder || 'you@company.com');
    q('.sf-btn-t').textContent = String(data.button_text || 'Subscribe');
    q('.sf-done-t').textContent = String(data.success_text || "You're in. Check your inbox.");
    q('.sf-fine').textContent = data.fine_print ? String(data.fine_print) : '';

    var email = String(data.email || 'sarah@northwind.co');
    var AT = num(data.at, 0.1);
    var TYPE_AT = num(data.type_at, AT + 0.4);
    var SPEED = num(data.type_speed, 0.045);
    var PRESS = num(data.press_at, TYPE_AT + email.length * SPEED + 0.35);
    var DONE = num(data.success_at, PRESS + 0.3);

    // Entrance: the block rises in (still:true = whole from frame one).
    var parts = ['.sf-eyebrow', '.sf-title', '.sf-sub', '.sf-form', '.sf-fine'].map(q).filter(function (x) { return x && getComputedStyle(x).display !== 'none'; });
    if (data.still !== true) {
      gsap.set(parts, { autoAlpha: 0, y: 22 });
      tl.to(parts, { autoAlpha: 1, y: 0, duration: 0.5, stagger: 0.07, ease: 'power3.out' }, AT);
    }

    // Typing: the field focuses, the placeholder goes, the email lands
    // character by character (one span, its text set per step: tl.set
    // renders on any seek, unlike a callback).
    var field = q('.sf-field'), val = q('.sf-val'), caret = q('.sf-caret'), ph = q('.sf-ph');
    tl.set(field, { className: 'sf-field on' }, TYPE_AT - 0.08);
    tl.set(ph, { autoAlpha: 0 }, TYPE_AT);
    tl.set(caret, { visibility: 'visible' }, TYPE_AT - 0.08);
    for (var i = 1; i <= email.length; i++) tl.set(val, { textContent: email.slice(0, i) }, TYPE_AT + (i - 1) * SPEED);

    // The press: a cursor comes in to the button, the button dips.
    var btn = q('.sf-button'), cur = q('.sf-cursor');
    if (data.cursor !== false) {
      var bx = 0, by = 0;
      // Button centre on the stage, measured once laid out.
      var br = btn.getBoundingClientRect(), sr = stage.getBoundingClientRect();
      var sc = sr.width / DW || 1;
      bx = (br.left - sr.left) / sc + (br.width / sc) * 0.55; by = (br.top - sr.top) / sc + (br.height / sc) * 0.6;
      gsap.set(cur, { x: bx + 260, y: by + 220, autoAlpha: 0 });
      tl.set(cur, { visibility: 'visible' }, PRESS - 0.6);
      tl.to(cur, { autoAlpha: 1, duration: 0.15 }, PRESS - 0.6);
      tl.to(cur, { x: bx, y: by, duration: 0.5, ease: 'power3.inOut' }, PRESS - 0.55);
      tl.to(cur, { scale: 0.85, duration: 0.08, transformOrigin: '0 0' }, PRESS);
      tl.to(cur, { scale: 1, duration: 0.15 }, PRESS + 0.08);
      tl.to(cur, { autoAlpha: 0, duration: 0.2 }, DONE + 0.4);
    }
    tl.to(btn, { scale: 0.95, duration: 0.08, ease: 'power2.in' }, PRESS);
    tl.to(btn, { scale: 1, duration: 0.18, ease: 'power2.out' }, PRESS + 0.08);

    // Success: the form folds away, the check pops with the line.
    var form = q('.sf-form'), done = q('.sf-done');
    if (data.success !== false) {
      tl.to(form, { autoAlpha: 0, scale: 0.96, duration: 0.2, ease: 'power2.in' }, DONE);
      tl.set(done, { visibility: 'visible' }, DONE);
      // Same slot as the form: the done line takes its place.
      var fr = form.getBoundingClientRect(), pr = q('.sf-block').getBoundingClientRect();
      var k = (stage.getBoundingClientRect().width / DW) || 1;
      done.style.top = ((fr.top - pr.top) / k) + 'px';
      q('.sf-block').style.position = 'relative';
      gsap.set(done, { autoAlpha: 0, y: 10, left: '50%', xPercent: -50 });
      tl.to(done, { autoAlpha: 1, y: 0, duration: 0.3, ease: 'power3.out' }, DONE + 0.12);
      tl.from(q('.sf-check'), { scale: 0, duration: 0.45, ease: 'back.out(2.4)' }, DONE + 0.12);
    }
    return tl;
  }
</script>
