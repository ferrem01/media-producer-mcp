<script>
  function createTimeline(el, data, ctx) {
    var tl = gsap.timeline();
    var sim = el.querySelector('.chat-simulator');
    var sidebar = el.querySelector('.chat-sidebar');
    var channelList = el.querySelector('.channel-list');
    var headerName = el.querySelector('.chat-header-name');
    var workspaceName = el.querySelector('.workspace-name');
    var messagesArea = el.querySelector('.messages-area');
    var typingIndicator = el.querySelector('.typing-indicator');

    var platform = data.platform || 'slack';
    var channel = data.channel || 'general';
    var messages = data.messages || [];

    // Set workspace and channel info
    workspaceName.textContent = 'Workspace';
    headerName.textContent = channel;

    // Build sidebar channels
    var channels = ['general', 'random', 'engineering'];
    if (channels.indexOf(channel) === -1) channels.unshift(channel);
    for (var c = 0; c < channels.length; c++) {
      var item = document.createElement('div');
      item.className = 'channel-item' + (channels[c] === channel ? ' active' : '');
      var hash = document.createElement('span');
      hash.className = 'channel-hash';
      hash.textContent = '#';
      item.appendChild(hash);
      var name = document.createElement('span');
      name.textContent = channels[c];
      item.appendChild(name);
      channelList.appendChild(item);
    }

    // Default avatar colors
    var defaultColors = ['#E0434C', '#2BAC76', '#1D9BD1', '#E9A820', '#A78BFA', '#F97316'];

    // Build message elements (hidden)
    var messageEls = [];
    for (var i = 0; i < messages.length; i++) {
      var msg = messages[i];
      var row = document.createElement('div');
      row.className = 'message-row';

      var avatarWrap = document.createElement('div');
      avatarWrap.style.position = 'relative';
      var avatar = document.createElement('div');
      avatar.className = 'message-avatar';
      avatar.style.background = msg.avatar_color || defaultColors[i % defaultColors.length];
      avatar.textContent = (msg.user || '?')[0].toUpperCase();
      avatarWrap.appendChild(avatar);

      var onlineDot = document.createElement('div');
      onlineDot.className = 'online-dot';
      avatarWrap.appendChild(onlineDot);
      row.appendChild(avatarWrap);

      var body = document.createElement('div');
      body.className = 'message-body';
      var meta = document.createElement('div');
      meta.className = 'message-meta';
      var user = document.createElement('span');
      user.className = 'message-user';
      user.textContent = msg.user || 'User';
      meta.appendChild(user);
      if (msg.time) {
        var time = document.createElement('span');
        time.className = 'message-time';
        time.textContent = msg.time;
        meta.appendChild(time);
      }
      body.appendChild(meta);

      var text = document.createElement('div');
      text.className = 'message-text';
      text.textContent = msg.text || '';
      body.appendChild(text);

      row.appendChild(body);
      messagesArea.appendChild(row);
      messageEls.push(row);
    }

    // Initial states
    gsap.set(sim, { autoAlpha: 0, scale: 0.94, filter: 'blur(4px)' });
    gsap.set(messageEls, { autoAlpha: 0, y: 20 });
    gsap.set(typingIndicator, { autoAlpha: 0 });

    var speed = ctx.motion === 'minimal' ? 0.4 : ctx.motion === 'punchy' ? 0.6 : 0.8;

    // Frame entrance
    tl.to(sim, {
      autoAlpha: 1, scale: 1, filter: 'blur(0px)',
      duration: speed,
      ease: 'power3.out'
    }, 0.3);

    // Messages appear one by one with typing indicator
    var t = 0.3 + speed + 0.3;
    for (var j = 0; j < messageEls.length; j++) {
      (function(idx, startTime) {
        // Show typing indicator
        tl.to(typingIndicator, { autoAlpha: 1, duration: 0.15 }, startTime);

        // Bounce typing dots
        var dots = typingIndicator.querySelectorAll('.typing-dot');
        tl.to(dots, {
          y: -4, duration: 0.25, stagger: 0.08,
          ease: 'power2.out', yoyo: true, repeat: 1
        }, startTime + 0.05);

        // Hide typing, show message
        tl.to(typingIndicator, { autoAlpha: 0, duration: 0.1 }, startTime + 0.6);
        tl.to(messageEls[idx], {
          autoAlpha: 1, y: 0,
          duration: 0.35,
          ease: 'power2.out'
        }, startTime + 0.65);
      })(j, t);
      t += 0.9;
    }

    // Exit
    if (ctx.duration > 2) {
      var exitAt = ctx.duration - 0.6;
      tl.to(sim, {
        autoAlpha: 0, scale: 0.97,
        duration: 0.5,
        ease: 'power2.in'
      }, exitAt);
    }

    return tl;
  }
</script>
