    // Sidebar lists -- Scheduled + Pinned sections with the real app's
    // artifact glyph per row (the numbered chips were a mock-ism).
    var ARTIFACT_ICO = '<svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="2.5" width="12" height="11" rx="2.5"/><path d="M5.5 8.6l1.8 1.8 3.4-3.8"/></svg>';
    var CLOCKROW_ICO = '<svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"><circle cx="8" cy="8" r="5.6"/><path d="M8 5v3.2l2 1.2"/></svg>';
    var scheduled = Array.isArray(data.scheduled) ? data.scheduled : [
      { title: 'Quotient weekly burn report', tag: 'Weekly' },
    ];
    var pinned = Array.isArray(data.pinned) && data.pinned.length ? data.pinned : [
      'Quotient Weekly Burn', 'Steve Goldberg Tracker', 'Quotient Usecase Picker',
      'Quotient Time Savings Calculator', 'Quotient Process', 'Gtm Credits Onepager',
      'Quotient Stack Consolidation Case Study', 'Quotient Positioning Onepager',
    ];
    var schedList = q('[data-target="sched-list"]');
    var pinList = q('[data-target="pin-list"]');
    function rowEl(item, ico) {
      var title = item && item.title ? item.title : String(item);
      var tag = item && item.tag ? item.tag : '';
      var d = document.createElement('div');
      d.className = 'cwh-session';
      d.innerHTML = '<span class="cwh-sess-ico">' + ico + '</span>' +
        '<span class="cwh-sess-title">' + title + '</span>' +
        (tag ? '<span class="cwh-sess-tag">' + tag + '</span>' : '');
      return d;
    }
    scheduled.forEach(function (t) { schedList.appendChild(rowEl(t, CLOCKROW_ICO)); });
    pinned.forEach(function (t) { pinList.appendChild(rowEl(t, ARTIFACT_ICO)); });

    // Ideas -- line-icon tiles like the real app (icon names map to built-in
    // pictograms; any other string renders as-is, e.g. an emoji).
    var IDEA_ICONS = {
      sunrise: '<svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="#57544c" stroke-width="1.2" stroke-linecap="round"><path d="M2 11h12M4.5 11a3.5 3.5 0 017 0M8 3.5V5M3.5 6l1 1M12.5 6l-1 1M2 13.5h12"/></svg>',
      inbox: '<svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="#57544c" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 5.5a2 2 0 012-2h4a2 2 0 012 2v2a2 2 0 01-2 2H6l-2 1.5v-1.5a2 2 0 01-1.5-2v-2z"/><path d="M12 6.5h.5a2 2 0 011.5 2v2a1.7 1.7 0 01-1.3 1.8V14l-2-1.5H8.5"/></svg>',
      doc: '<svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="#57544c" stroke-width="1.2" stroke-linecap="round"><path d="M4 1.5h5.5L13 5v9.5a1 1 0 01-1 1H4a1 1 0 01-1-1v-12a1 1 0 011-1z"/><path d="M5.5 8h5M5.5 10.5h5M9 13l1.5-1.5"/></svg>',
    };
    // Ideas only render when a scene passes them explicitly -- the real home
    // (Cowork mode) doesn't show the "Ideas for you" block by default.
    var ideas = Array.isArray(data.ideas) ? data.ideas : [];
    var ideaSection = q('.cwh-ideas');
    if (!ideas.length && ideaSection && ideaSection.parentNode) {
      ideaSection.parentNode.removeChild(ideaSection);
      ideaSection = null;
    }
    var ideaList = q('[data-target="idea-list"]');
    var ideaEls = [];
    ideas.forEach(function (it, i) {
      var d = document.createElement('div');
      d.className = 'cwh-idea';
      d.setAttribute('data-target', 'idea-' + i);
      var ico = IDEA_ICONS[it.icon] || it.icon || '✦';
      d.innerHTML = '<span class="cwh-idea-ico">' + ico + '</span>' +
        '<span class="cwh-idea-label">' + (it.label || String(it)) + '</span>';
      ideaList.appendChild(d);
      ideaEls.push(d);
    });

    // Mode toggle
    var modeChat = q('[data-target="mode-chat"]');
    var modeCowork = q('[data-target="mode-cowork"]');
    function setMode(mode) {
      var cowork = String(mode || 'cowork').toLowerCase() !== 'chat';
      modeCowork.classList.toggle('is-active', cowork);
      modeChat.classList.toggle('is-active', !cowork);
    }
    if (data.mode) setMode(data.mode);

    // Working ✳ under the composer (after send)
    var workingEl = null;
    function showWorking(opts) {
      opts = opts || {};
      removeWorking();
      var d = document.createElement('div');
      d.className = 'cwh-working';
      d.innerHTML = '<span class="star">✳</span>' +
        (opts.text ? '<span class="cwh-working-verb">' + opts.text + '</span>' : '');
      composer.parentNode.insertBefore(d, composer.nextSibling);
      workingEl = d;
      gsap.from(d, { autoAlpha: 0, y: 6, duration: 0.3 });
      gsap.to(d.querySelector('.star'), { rotation: 360, duration: 2.6, repeat: -1, ease: 'none', transformOrigin: '50% 50%' });
    }
    function removeWorking() {
      if (!workingEl) return;
      gsap.killTweensOf(workingEl.querySelector('.star'));
      if (workingEl.parentNode) workingEl.parentNode.removeChild(workingEl);
      workingEl = null;
    }

    // Entrance: greeting, composer, ideas stagger in
    gsap.set(win, { autoAlpha: 0, y: 24 });
    tl.to(win, { autoAlpha: 1, y: 0, duration: 0.5, ease: 'power3.out' }, 0.15);
    var reveal = [q('[data-target="greeting"]'), composer, q('.cwh-ideas')].filter(Boolean);
    gsap.set(reveal, { autoAlpha: 0, y: 14 });
    reveal.forEach(function (r, i) {
      tl.to(r, { autoAlpha: 1, y: 0, duration: 0.5, ease: 'power3.out' }, 0.4 + i * 0.18);
    });

    var cursorTargets = data.cursor_targets || {
      'composer': function () {
        var b = composer.getBoundingClientRect();
        var p = el.getBoundingClientRect();
        return { x: ((b.left + b.width / 2 - p.left) / p.width * 100) + '%',
                 y: ((b.top + b.height / 2 - p.top) / p.height * 100) + '%' };
      },
    };
    ideas.forEach(function (it, i) {
      cursorTargets['idea-' + i] = function () {
        var b = ideaEls[i].getBoundingClientRect();
        var p = el.getBoundingClientRect();
        return { x: ((b.left + b.width / 2 - p.left) / p.width * 100) + '%',
                 y: ((b.top + b.height / 2 - p.top) / p.height * 100) + '%' };
      };
    });

    // Shorthand: prompt_text types + sends + works
    if ((!data.script || !data.script.length) && data.prompt_text) {
      var pTxt = String(data.prompt_text);
      var tAt = Math.max(1.2, dur * 0.15);
      var typeDur = Math.min(2.6, Math.max(1.0, pTxt.length * 0.045));
      data.script = [
        { action: 'type-prompt', at: tAt, text: pTxt },
        { action: 'send-prompt', at: tAt + typeDur + 0.4 },
      ];
    }

    if (data.script && data.script.length > 0) {
      runScript(tl, el, data.script, cursorTargets, ctx, {
        'type-prompt': function (tl, ctr, action, at) {
          // The send button pops in with the first keystroke, like the app.
          // TIMELINE tweens (not call() callbacks): the scrubber renders the
          // correct state at any playhead position in either direction --
          // edge-triggered callbacks left the button hidden when arriving
          // into the typed region from the right.
          tl.fromTo(sendBtn, { autoAlpha: 0, scale: 0.6 },
            { autoAlpha: 1, scale: 1, duration: 0.3, ease: 'back.out(2.5)' }, at);
          typeText(tl, inputEl, action.text || '', at, action.speed || 30);
        },
        'send-prompt': function (tl, ctr, action, at) {
          // The press: push-down/spring-back, THEN (0.22s later) the button
          // hides and the composer clears -- the click reads before its
          // consequence. All state on the timeline, scrub-safe.
          tl.fromTo(sendBtn, { scale: 0.82 },
            { scale: 1, duration: 0.32, ease: 'back.out(3)', immediateRender: false }, at);
          tl.set(sendBtn, { autoAlpha: 0 }, at + 0.22);
          tl.call(function () {
            inputEl.textContent = '';
            showWorking({ text: action.working_text || '' });
          }, null, at + 0.22);
        },
        'working': function (tl, ctr, action, at) {
          tl.call(function () { showWorking(action); }, null, at);
        },
        'stop-working': function (tl, ctr, action, at) { tl.call(removeWorking, null, at); },
        'switch-mode': function (tl, ctr, action, at) {
          tl.call(function () { setMode(action.mode); }, null, at);
        },
        'open-plus-menu': function (tl, ctr, action, at) {
          tl.call(function () {
            var m = ctr.querySelector('[data-target="plus-menu"]');
            var plusBtn = ctr.querySelector('[data-target="plus-btn"]');
            if (!m) return;
            if (plusBtn) {
              // Position from the + button in window-relative %, scale-safe.
              var pb = plusBtn.getBoundingClientRect();
              var wb = win.getBoundingClientRect();
              m.style.left = ((pb.left - wb.left) / wb.width * 100) + '%';
              m.style.top = ((pb.bottom - wb.top) / wb.height * 100 + 1) + '%';
            }
            m.classList.add('is-open');
            gsap.from(m, { autoAlpha: 0, y: -6, duration: 0.25, ease: 'power2.out' });
          }, null, at);
          if (action.duration !== 0) {
            tl.call(function () {
              var m = ctr.querySelector('[data-target="plus-menu"]');
              if (m) m.classList.remove('is-open');
            }, null, at + (action.duration || 2.4));
          }
        },
        'close-plus-menu': function (tl, ctr, action, at) {
          tl.call(function () {
            var m = ctr.querySelector('[data-target="plus-menu"]');
            if (m) m.classList.remove('is-open');
          }, null, at);
        },
        'choose-idea': function (tl, ctr, action, at) {
          tl.call(function () {
            var idx = Number(action.index) || 0;
            ideaEls.forEach(function (d, i) { d.classList.toggle('is-hot', i === idx); });
          }, null, at);
        },
      });
    }

    return tl;
  }
</script>
