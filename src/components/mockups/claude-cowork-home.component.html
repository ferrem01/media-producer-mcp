<script>
  function createTimeline(el, data, ctx) {
    var tl = gsap.timeline();
    var q = function (s) { return el.querySelector(s); };
    var win = q('.cwh-win');
    var inputEl = q('[data-target="input"]');
    var composer = q('[data-target="composer"]');
    var dur = ctx.duration || 10;

    q('[data-target="greeting-text"]').textContent = data.greeting || 'Afternoon, Marc';
    q('[data-target="model-label"]').textContent = data.model_label || 'Opus 4.8';
    q('[data-target="effort-label"]').textContent = data.effort_label || 'High';
    q('[data-target="usage-text"]').textContent = data.usage_label || '2× more usage until August 5';
    if (data.account_name) q('[data-target="account-name"]').textContent = data.account_name;
    if (data.account_name) q('[data-target="account-avatar"]').textContent = String(data.account_name).charAt(0).toUpperCase();
    inputEl.setAttribute('data-placeholder', data.placeholder || 'How can I help you today?');

    // Sidebar lists
    var pinned = Array.isArray(data.pinned) ? data.pinned : ['Canva Design Hub'];
    var recents = Array.isArray(data.recents) && data.recents.length ? data.recents : [
      'Email access question', 'Seniority Healthcare partnership', 'Getquotient MCP integration',
      'Quotient customer information sources', 'Head of growth role and responsibilities',
      'Canva launch image', 'Creative projects',
    ];
    var pinList = q('[data-target="pin-list"]');
    var recentList = q('[data-target="recent-list"]');
    var num = 1;
    function rowEl(title) {
      var d = document.createElement('div');
      d.className = 'cwh-session';
      d.innerHTML = '<span class="cwh-sess-num">' + (num++) + '</span>' +
        '<span class="cwh-sess-title">' + title + '</span>';
      return d;
    }
    pinned.forEach(function (t) { pinList.appendChild(rowEl(t)); });
    recents.forEach(function (t) { recentList.appendChild(rowEl(t)); });

    // Ideas
    var ideas = Array.isArray(data.ideas) && data.ideas.length ? data.ideas : [
      { icon: '🌅', label: 'Send me a daily briefing' },
      { icon: '📥', label: 'Organize my inbox' },
      { icon: '📝', label: 'Customize Cowork for me' },
    ];
    var ideaList = q('[data-target="idea-list"]');
    var ideaEls = [];
    ideas.forEach(function (it, i) {
      var d = document.createElement('div');
      d.className = 'cwh-idea';
      d.setAttribute('data-target', 'idea-' + i);
      d.innerHTML = '<span class="cwh-idea-ico">' + (it.icon || '✦') + '</span>' +
        '<span class="cwh-idea-label">' + (it.label || String(it)) + '</span>';
      ideaList.appendChild(d);
      ideaEls.push(d);
    });

    // Mode toggle
    var modeChat = q('[data-target="mode-chat"]');
    var modeCowork = q('[data-target="mode-cowork"]');
    function setMode(mode) {
      var cowork = String(mode || 'cowork').toLowerCase() !== 'chat';
      modeCowork.classList.toggle('is-active', cowork);
      modeChat.classList.toggle('is-active', !cowork);
    }
    if (data.mode) setMode(data.mode);

    // Working ✳ under the composer (after send)
    var workingEl = null;
    function showWorking(opts) {
      opts = opts || {};
      removeWorking();
      var d = document.createElement('div');
      d.className = 'cwh-working';
      d.innerHTML = '<span class="star">✳</span>' +
        (opts.text ? '<span class="cwh-working-verb">' + opts.text + '</span>' : '');
      composer.parentNode.insertBefore(d, composer.nextSibling);
      workingEl = d;
      gsap.from(d, { autoAlpha: 0, y: 6, duration: 0.3 });
      gsap.to(d.querySelector('.star'), { rotation: 360, duration: 2.6, repeat: -1, ease: 'none', transformOrigin: '50% 50%' });
    }
    function removeWorking() {
      if (!workingEl) return;
      gsap.killTweensOf(workingEl.querySelector('.star'));
      if (workingEl.parentNode) workingEl.parentNode.removeChild(workingEl);
      workingEl = null;
    }

    // Entrance: greeting, composer, ideas stagger in
    gsap.set(win, { autoAlpha: 0, y: 24 });
    tl.to(win, { autoAlpha: 1, y: 0, duration: 0.5, ease: 'power3.out' }, 0.15);
    var reveal = [q('[data-target="greeting"]'), composer, q('.cwh-ideas')];
    gsap.set(reveal, { autoAlpha: 0, y: 14 });
    reveal.forEach(function (r, i) {
      tl.to(r, { autoAlpha: 1, y: 0, duration: 0.5, ease: 'power3.out' }, 0.4 + i * 0.18);
    });

    var cursorTargets = data.cursor_targets || {
      'composer': function () {
        var b = composer.getBoundingClientRect();
        var p = el.getBoundingClientRect();
        return { x: ((b.left + b.width / 2 - p.left) / p.width * 100) + '%',
                 y: ((b.top + b.height / 2 - p.top) / p.height * 100) + '%' };
      },
    };
    ideas.forEach(function (it, i) {
      cursorTargets['idea-' + i] = function () {
        var b = ideaEls[i].getBoundingClientRect();
        var p = el.getBoundingClientRect();
        return { x: ((b.left + b.width / 2 - p.left) / p.width * 100) + '%',
                 y: ((b.top + b.height / 2 - p.top) / p.height * 100) + '%' };
      };
    });

    // Shorthand: prompt_text types + sends + works
    if ((!data.script || !data.script.length) && data.prompt_text) {
      var pTxt = String(data.prompt_text);
      var tAt = Math.max(1.2, dur * 0.15);
      var typeDur = Math.min(2.6, Math.max(1.0, pTxt.length * 0.045));
      data.script = [
        { action: 'type-prompt', at: tAt, text: pTxt },
        { action: 'send-prompt', at: tAt + typeDur + 0.4 },
      ];
    }

    if (data.script && data.script.length > 0) {
      runScript(tl, el, data.script, cursorTargets, ctx, {
        'type-prompt': function (tl, ctr, action, at) {
          typeText(tl, inputEl, action.text || '', at, action.speed || 30);
        },
        'send-prompt': function (tl, ctr, action, at) {
          tl.call(function () {
            inputEl.textContent = '';
            showWorking({ text: action.working_text || '' });
          }, null, at);
        },
        'working': function (tl, ctr, action, at) {
          tl.call(function () { showWorking(action); }, null, at);
        },
        'stop-working': function (tl, ctr, action, at) { tl.call(removeWorking, null, at); },
        'switch-mode': function (tl, ctr, action, at) {
          tl.call(function () { setMode(action.mode); }, null, at);
        },
        'choose-idea': function (tl, ctr, action, at) {
          tl.call(function () {
            var idx = Number(action.index) || 0;
            ideaEls.forEach(function (d, i) { d.classList.toggle('is-hot', i === idx); });
          }, null, at);
        },
      });
    }

    return tl;
  }
</script>
