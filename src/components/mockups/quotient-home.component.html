<script>
  function createTimeline(el, data, ctx) {
    var tl = gsap.timeline();
    var q = function (s) { return el.querySelector(s); };

    var orbImg = q('.qhome-orb-img');
    orbImg.src = data.logo_url ||
      'https://img.logo.dev/getquotient.ai?token=pk_B_cdrQLyTkSFPzSMm52goQ&format=png&size=256';
    orbImg.onerror = function () {
      orbImg.style.display = 'none';
      q('.qhome-orb-fallback').style.display = 'block';
    };

    q('.qhome-h1').textContent = data.heading || 'What should we create today?';
    q('.qhome-ph').textContent = data.placeholder || 'Type a message...';
    q('.qhome-model-name').textContent = data.model || 'Opus 4.7';

    // Chips: simple line icons keyed by name; unknown keys fall back to a dot.
    var ICONS = {
      megaphone: 'M3 11v3l4 1 11 5V4L7 9zM7 15v4',
      calendar: 'M4 6h16v15H4zM4 10h16M8 3v5M16 3v5',
      pen: 'M4 20l4-1L20 7l-3-3L5 16zM14 6l3 3',
      share: 'M7 12a3 3 0 1 0 0 .01M17 6a3 3 0 1 0 0 .01M17 18a3 3 0 1 0 0 .01M9.6 10.6l5-3M9.6 13.4l5 3',
      search: 'M10.5 4a6.5 6.5 0 1 0 0 13 6.5 6.5 0 0 0 0-13zM15.5 15.5L21 21',
      trend: 'M3 17l6-6 4 4 8-8M15 7h6v6',
      rocket: 'M12 15c5-4 7-8 7-12-4 0-8 2-12 7l-3 1 4 4 1-3zM6 18c-1 1-2 3-2 3s2-1 3-2',
    };
    var chips = Array.isArray(data.chips) && data.chips.length ? data.chips : [
      { label: 'Campaigns', icon: 'megaphone' },
      { label: 'Events', icon: 'calendar' },
      { label: 'Content & SEO', icon: 'pen' },
      { label: 'Social', icon: 'share' },
      { label: 'Competitive Research', icon: 'search' },
      { label: 'Sales Enablement', icon: 'trend' },
      { label: 'Product & Launch', icon: 'rocket' },
    ];
    var chipWrap = q('.qhome-chips');
    var chipEls = {};
    chips.forEach(function (c) {
      var d = document.createElement('div');
      d.className = 'qhome-chip';
      d.innerHTML = '<svg viewBox="0 0 24 24"><path d="' + (ICONS[c.icon] || 'M12 12h.01') +
        '" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>' +
        '<span></span>';
      d.querySelector('span').textContent = c.label;
      chipWrap.appendChild(d);
      chipEls[String(c.label).toLowerCase()] = d;
    });

    // ── Entrance: orb pops, hero line rises, card rises, chips stagger in. ──
    var orb = q('.qhome-orb'), h1 = q('.qhome-h1'), card = q('.qhome-card');
    gsap.set(orb, { autoAlpha: 0, scale: 0.7 });
    gsap.set([h1, card], { autoAlpha: 0, y: 14 });
    tl.to(orb, { autoAlpha: 1, scale: 1, duration: 0.45, ease: 'back.out(1.6)' }, 0.1);
    tl.to(h1, { autoAlpha: 1, y: 0, duration: 0.4, ease: 'power3.out' }, 0.25);
    tl.to(card, { autoAlpha: 1, y: 0, duration: 0.4, ease: 'power3.out' }, 0.38);
    var chipNodes = chipWrap.children;
    for (var ci = 0; ci < chipNodes.length; ci++) {
      gsap.set(chipNodes[ci], { autoAlpha: 0, y: 10 });
      tl.to(chipNodes[ci], { autoAlpha: 1, y: 0, duration: 0.3, ease: 'power2.out' }, 0.5 + ci * 0.05);
    }

    // Caret blinks on a standalone repeating tween (blink phase needn't
    // scrub-sync); it only exists while the field is empty or typing.
    var caret = q('.qhome-caret');
    gsap.to(caret, { opacity: 0, duration: 0.45, repeat: -1, yoyo: true, ease: 'steps(1)' });

    // ── Script ──
    var chars = q('.qhome-chars'), ph = q('.qhome-ph'), send = q('.qhome-send');
    var script = Array.isArray(data.script) ? data.script.slice().sort(function (a, b) { return (a.at || 0) - (b.at || 0); }) : [];
    script.forEach(function (a) {
      var at = Number(a.at) || 0;
      if (a.action === 'type-message') {
        // Same scrub-safe contract as composer: every char is a pre-built
        // hidden span revealed by pure tl.set; the placeholder hides on the
        // first char and the send orb tweens live -- all timeline-owned, so
        // any crossing direction lands the right state.
        var speed = Number(a.speed) > 0 ? Number(a.speed) : 0.03;
        var pendingSpace = '';
        var spans = [];
        String(a.text || '').split('').forEach(function (ch) {
          if (ch === ' ') { pendingSpace = ' '; return; }
          var s = document.createElement('span');
          s.textContent = pendingSpace + ch;
          pendingSpace = '';
          s.style.display = 'none';
          chars.appendChild(s);
          spans.push(s);
        });
        spans.forEach(function (s, i) {
          tl.set(s, { display: 'inline' }, at + i * speed);
        });
        tl.set(ph, { display: 'none' }, at);
        tl.to(send, { backgroundColor: '#17171c', duration: 0.25 }, at + 0.1);
      } else if (a.action === 'send-message') {
        tl.to(send, { scale: 0.84, duration: 0.09, ease: 'power2.in' }, at);
        tl.to(send, { scale: 1, duration: 0.16, ease: 'power2.out' }, at + 0.09);
      } else if (a.action === 'highlight-chip') {
        var chip = chipEls[String(a.label || '').toLowerCase()];
        if (chip) {
          tl.to(chip, { scale: 1.06, borderColor: '#7a5cff', duration: 0.22, ease: 'power2.out' }, at);
          tl.to(chip, { scale: 1, borderColor: '#e6e4ee', duration: 0.3, ease: 'power2.inOut' }, at + 0.5);
        }
      }
    });

    if (window.mpCameraPush) mpCameraPush(tl, q('.qhome'), ctx.duration || 5, 1.03);
    return tl;
  }
</script>
