      { heading: 'Accounts', bullets: ['Max Davish — LinkedIn + X', 'Marc Ferrentino — LinkedIn + X', 'Quotient Company — LinkedIn + X'] },
      { heading: 'Messaging Themes', paragraphs: [
        "The central tension: Quotient has been using its own AI platform to run all of its marketing, but AI has a ceiling. It can't build relationships, own strategy, or represent the brand in a room. This is the human hire that takes it the rest of the way."
      ]}
    ];
    var tasks = data.tasks || [
      { text: 'Write LinkedIn post for Marc: Founding Marketer', due: 'Jul 5', priority: 'high', owner: 'Marc F...', avatar_url: AVA.marc, platform: 'linkedin', deliverable: 'Marc LinkedI...' },
      { text: 'Write X post for Quotient: Founding Marketer', due: 'Jul 5', priority: 'high', owner: 'Max D...', avatar_url: AVA.max, platform: 'x', deliverable: 'Quotient X: F...' },
      { text: 'Write X post for Marc: Founding Marketer', due: 'Jul 5', priority: 'high', owner: 'Marc F...', avatar_url: AVA.marc, platform: 'x', deliverable: 'Marc X: Fou...' },
      { text: 'Write X post for Max: Founding Marketer', due: 'Jul 5', priority: 'high', owner: 'Max D...', avatar_url: AVA.max, platform: 'x', deliverable: 'Max X: Foun...' },
      { text: 'Write LinkedIn post for Quotient: Founding Marketer', due: 'Jul 5', priority: 'high', owner: 'Max D...', avatar_url: AVA.max, platform: 'linkedin', deliverable: 'Quotient Lin...' },
      { text: 'Write LinkedIn post for Max: Founding Marketer', due: 'Jul 5', priority: 'high', owner: 'Max D...', avatar_url: AVA.max, platform: 'linkedin', deliverable: 'Max LinkedI...' }
    ];
    var calendar = data.calendar || {
      hours: [{ label: '6 AM', pct: 12 }, { label: '9 AM', pct: 34 }, { label: '12 PM', pct: 62 }, { label: '3 PM', pct: 88 }],
      days: 5,
      events: [
        { day: 1, top: 30, type: 'Social Post', platform: 'linkedin', title: 'Max LinkedIn: Founding Marketer', time: '9:00 AM', status: 'published', avatar_url: AVA.max },
        { day: 1, top: 56, type: 'Social Post', platform: 'x', title: 'Max X: Founding Marketer', time: '9:00 AM', status: 'published', avatar_url: AVA.max },
        { day: 2, top: 30, type: 'Social Post', platform: 'linkedin', title: 'Quotient LinkedIn: Founding Marketer', time: '9:00 AM', status: 'published', avatar_url: AVA.max },
        { day: 3, top: 30, type: 'Social Post', platform: 'linkedin', title: 'Marc LinkedIn - Marketing Busywork...', time: '9:00 AM', status: 'draft', avatar_url: AVA.marc },
        { day: 0, top: 66, type: 'Social Post', platform: 'linkedin', title: 'Quotient LinkedIn: Analyze Your...', time: '10:00 AM', status: 'draft', avatar_url: AVA.max },
        { day: 3, top: 66, type: 'Email Broadcast', platform: 'email', title: 'Quotient Changelog: July 2, 2026', time: '10:00 AM', status: 'launched', avatar_url: AVA.max }
      ]
    };
    var deliverables = data.deliverables || [
      { platform: 'linkedin', kind: 'Social Post', name: 'Max LinkedIn: Founding Marketer', status: 'published', date: 'Jul 7, 2026', task: 'Write LinkedIn post ...' },
      { platform: 'linkedin', kind: 'Social Post', name: 'Marc LinkedIn: Founding Marketer', status: 'published', date: 'Jul 7, 2026', task: 'Write LinkedIn post ...' },
      { platform: 'linkedin', kind: 'Social Post', name: 'Quotient LinkedIn: Founding Marketer', status: 'published', date: 'Jul 8, 2026', task: 'Write LinkedIn post ...' },
      { platform: 'x', kind: 'Social Post', name: 'Max X: Founding Marketer', status: 'published', date: 'Jul 7, 2026', task: 'Write X post for Ma...' },
      { platform: 'x', kind: 'Social Post', name: 'Marc X: Founding Marketer', status: 'published', date: 'Jul 7, 2026', task: 'Write X post for Ma...' },
      { platform: 'x', kind: 'Social Post', name: 'Quotient X: Founding Marketer', status: 'draft', date: 'Jul 8, 2026', task: 'Write X post for Qu...' }
    ];

    // ── Populate brief ──
    el.querySelector('.qcp-updated').textContent = updated;
    el.querySelector('.qcp-title').textContent = title;
    el.querySelector('.qcp-date-from').textContent = dateFrom;
    el.querySelector('.qcp-date-to').textContent = dateTo;
    el.querySelector('.qcp-owner-name').textContent = owner.name || '';
    el.querySelector('.qcp-owner-ava').innerHTML = owner.avatar_url ? '<img src="' + esc(owner.avatar_url) + '" onerror="this.remove()"/>' : '';
    var secWrap = el.querySelector('.qcp-sections');
    sections.forEach(function(s) {
      if (s.heading) {
        var h = document.createElement('h2');
        h.className = 'qcp-section-h';
        h.textContent = s.heading;
        secWrap.appendChild(h);
      }
      (s.paragraphs || []).forEach(function(p) {
        var pe = document.createElement('p');
        pe.className = 'qcp-section-p';
        pe.textContent = p;
        secWrap.appendChild(pe);
      });
      if (s.bullets && s.bullets.length) {
        var ul = document.createElement('ul');
        ul.className = 'qcp-section-ul';
        s.bullets.forEach(function(b) {
          var li = document.createElement('li');
          li.textContent = b;
          ul.appendChild(li);
        });
        secWrap.appendChild(ul);
      }
    });

    // ── Populate tasks ──
    var doneCount = tasks.filter(function(t) { return t.done; }).length;
    function refreshCounts() {
      el.querySelector('.qcp-completed-count').textContent = doneCount + '/' + tasks.length;
      el.querySelector('.qcp-group-count').textContent = String(tasks.length - doneCount);
    }
    refreshCounts();
    var taskRows = el.querySelector('.qcp-task-rows');
    tasks.forEach(function(t) {
      var row = document.createElement('div');
      row.className = 'qcp-row qcp-task-grid';
      var pri = (t.priority || 'high').toLowerCase();
      row.innerHTML =
        '<span class="qcp-cell"><span class="qcp-ring ' + (t.done ? 'done' : 'dashed') + '"></span><span class="qcp-cell-txt qcp-task-name">' + esc(t.text) + '</span></span>' +
        '<span class="qcp-cell">' + CAL_ICO + '<span>' + esc(t.due || '') + '</span></span>' +
        '<span class="qcp-cell"><span class="qcp-pri ' + pri + '"><i></i><i></i><i></i></span><span>' + esc(pri.charAt(0).toUpperCase() + pri.slice(1)) + '</span></span>' +
        '<span class="qcp-cell">' + avaEl(t.avatar_url) + '<span class="qcp-cell-txt">' + esc(t.owner || '') + '</span></span>' +
        '<span class="qcp-cell">' + platEl(t.platform) + '<span class="qcp-cell-txt">' + esc(t.deliverable || '') + '</span></span>' +
        '<span class="qcp-cell"><span class="qcp-chat-chip"><img src="' + QUOTIENT_ICON + '" onerror="this.remove()"/>Get Started</span></span>';
      taskRows.appendChild(row);
    });

    // ── Populate calendar ──
    var gutter = el.querySelector('.qcp-cal-gutter');
    (calendar.hours || []).forEach(function(h) {
      var s = document.createElement('span');
      s.className = 'qcp-cal-hour';
      s.style.top = h.pct + '%';
      s.textContent = h.label;
      gutter.appendChild(s);
    });
    var daysWrap = el.querySelector('.qcp-cal-days');
    var nDays = calendar.days || 5;
    for (var d = 0; d < nDays; d++) {
      var col = document.createElement('div');
      col.className = 'qcp-cal-day';
      daysWrap.appendChild(col);
    }
    (calendar.hours || []).forEach(function(h) {
      var line = document.createElement('div');
      line.className = 'qcp-cal-line';
      line.style.top = h.pct + '%';
      daysWrap.appendChild(line);
    });
    var evEls = [];
    (calendar.events || []).forEach(function(ev) {
      var day = Math.min(nDays - 1, ev.day || 0);
      var node = document.createElement('div');
      node.className = 'qcp-ev';
      node.style.left = (day * (100 / nDays) + 0.6) + '%';
      node.style.width = (100 / nDays - 1.2) + '%';
      node.style.top = (ev.top || 30) + '%';
      node.innerHTML =
        '<div class="qcp-ev-head"><span class="qcp-ev-kind">' + platEl(ev.platform) + esc(ev.type || 'Social Post') + '</span>' + avaEl(ev.avatar_url) + '</div>' +
        '<div class="qcp-ev-title">' + esc(ev.title || '') + '</div>' +
        '<div class="qcp-ev-time">' + esc(ev.time || '') + '</div>' +
        '<div class="qcp-ev-foot">' + statusEl(ev.status) + platEl(ev.platform) + '</div>';
      daysWrap.appendChild(node);
      evEls.push(node);
    });

    // ── Populate deliverables ──
    var delRows = el.querySelector('.qcp-del-rows');
    var delEls = [];
    deliverables.forEach(function(dv) {
      var row = document.createElement('div');
      row.className = 'qcp-row qcp-del-grid';
      row.innerHTML =
        '<span class="qcp-cell">' + platEl(dv.platform) + '<span class="qcp-type-label">' + esc(dv.kind || 'Social Post') + '</span></span>' +
        '<span class="qcp-cell"><span class="qcp-del-name">' + esc(dv.name || '') + '</span></span>' +
        '<span class="qcp-cell qcp-del-status">' + statusEl(dv.status) + '</span>' +
        '<span class="qcp-cell">' + CAL_ICO + '<span>' + esc(dv.date || '') + '</span></span>' +
        '<span class="qcp-cell">' + DASHED + '<span class="qcp-cell-txt">' + esc(dv.task || '') + '</span></span>';
      delRows.appendChild(row);
      delEls.push(row);
    });

    // ── Tab switching ──
    var tabs = el.querySelectorAll('.qcp-tab');
    var views = el.querySelectorAll('.qcp-view');
    function setTab(name) {
      tabs.forEach(function(t) { t.classList.toggle('active', t.dataset.tab === name); });
      views.forEach(function(v) {
        var on = v.dataset.view === name;
        v.classList.toggle('active', on);
        if (on) gsap.fromTo(v, { autoAlpha: 0, y: 8 }, { autoAlpha: 1, y: 0, duration: 0.28, ease: 'power2.out' });
      });
    }
    setTab(activeTab);

    // ── Entrance ──
    gsap.set(card, { autoAlpha: 0, y: 16 });
    tl.to(card, { autoAlpha: 1, y: 0, duration: 0.3, ease: 'power3.out' }, 0.1);

    // ── Script ──
    if (data.script && data.script.length > 0) {
      var cursorTargets = data.cursor_targets || {
        'tabs': { x: '30%', y: '8%' },
        'table': { x: '50%', y: '45%' }
      };

      runScript(tl, el, data.script, cursorTargets, ctx, {
        'switch-tab': function(tl, ctr, action, at) {
          var tab = el.querySelector('.qcp-tab[data-tab="' + action.tab + '"]');
          if (tab) {
            tl.to(tab, { scale: 0.95, duration: 0.09, ease: 'power2.in' }, at);
            tl.to(tab, { scale: 1, duration: 0.12, ease: 'power2.out' }, at + 0.09);
          }
          tl.call(function() { setTab(action.tab); }, null, at + 0.16);
        },
        'complete-task': function(tl, ctr, action, at) {
          var idx = action.index || 0;
          tl.call(function() {
            var row = taskRows.children[idx];
            if (!row) return;
            var ring = row.querySelector('.qcp-ring');
            ring.classList.remove('dashed');
            ring.classList.add('done');
            gsap.fromTo(ring, { scale: 0.6 }, { scale: 1, duration: 0.3, ease: 'back.out(2.5)' });
            doneCount++;
            refreshCounts();
          }, null, at);
        },
        'move-event': function(tl, ctr, action, at) {
          var idx = action.index || 0;
          var node = evEls[idx];
          if (!node) return;
          var toDay = Math.min(nDays - 1, action.day !== undefined ? action.day : 0);
          var toTop = action.top;
          tl.call(function() {
            gsap.to(node, { scale: 1.04, boxShadow: '0 10px 28px rgba(0,0,0,0.16)', zIndex: 9, duration: 0.18, ease: 'power2.out' });
            var target = { left: (toDay * (100 / nDays) + 0.6) + '%', duration: 0.65, ease: 'power2.inOut', delay: 0.2 };
            if (toTop !== undefined) target.top = toTop + '%';
            gsap.to(node, target);
            gsap.to(node, { scale: 1, boxShadow: '0 1px 6px rgba(0,0,0,0.05)', duration: 0.25, ease: 'power2.out', delay: 0.9 });
          }, null, at);
        },
        'set-event-status': function(tl, ctr, action, at) {
          var idx = action.index || 0;
          tl.call(function() {
            var node = evEls[idx];
            if (!node) return;
            var stEl = node.querySelector('.qcp-status');
            if (stEl) stEl.outerHTML = statusEl(action.status || 'published');
            gsap.fromTo(node, { scale: 1 }, { scale: 1.03, duration: 0.2, yoyo: true, repeat: 1, ease: 'power2.out' });
          }, null, at);
        },
        'set-deliverable-status': function(tl, ctr, action, at) {
          var idx = action.index || 0;
          tl.call(function() {
            var row = delEls[idx];
            if (!row) return;
            var cell = row.querySelector('.qcp-del-status');
            cell.innerHTML = statusEl(action.status || 'published');
            gsap.fromTo(cell, { scale: 0.9 }, { scale: 1, duration: 0.3, ease: 'back.out(2)' });
          }, null, at);
        },
        'scroll-view': function(tl, ctr, action, at) {
          var view = el.querySelector('.qcp-view.active');
          if (!view) return;
          tl.to(view, { scrollTop: '+=' + (action.amount || 300), duration: action.duration || 1.6, ease: 'power1.inOut' }, at);
        }
      });
    }

    return tl;
  }
