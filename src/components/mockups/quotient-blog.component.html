<script>
  function createTimeline(el, data, ctx) {
    if (data.docked) el.querySelector('.qbl').classList.add('is-docked');
    var tl = gsap.timeline();
    var q = function(s) { return el.querySelector(s); };
    var win = q('.qbl-window');

    // ── Doc chrome ──
    var title = data.title || 'The Hidden Cost of Manual Marketing Execution';
    var campaign = data.campaign || 'Weekly Blog Post';
    q('.qbl-camp-name').textContent = campaign;
    if (data.campaign_progress) {
      q('.qbl-camp-count').textContent = data.campaign_progress;
      q('.qbl-camp-prog').style.display = 'inline-flex';
    }
    q('.qbl-threads').textContent = data.threads_count != null ? data.threads_count : 2;

    // ── Status pill: BOTH faces prebuilt; publish flips via crossfade ──
    var draftFace = q('.qbl-status-draft');
    var pubFace = q('.qbl-status-pub');
    var statusPillEl = q('.qbl-status');
    var status = data.status || 'draft';
    q('.qbl-pub-text').textContent = 'Published ' + (data.published_when || 'just now');
    // Measure both faces at build (pub face is hidden but laid out), then
    // absolutize; the container takes the ACTIVE face's width and publish
    // tweens width + colors, so the flip is layout-stable and scrub-safe.
    pubFace.style.visibility = 'visible';
    var wDraftC = Math.ceil(draftFace.getBoundingClientRect().width) + 4;
    var wPubC = Math.ceil(pubFace.getBoundingClientRect().width) + 4;
    pubFace.style.visibility = '';
    statusPillEl.classList.add('is-sized');
    if (status === 'published') {
      statusPillEl.style.width = wPubC + 'px';
      statusPillEl.style.background = '#fff';
      statusPillEl.style.borderColor = '#e9e7f0';
      gsap.set(draftFace, { autoAlpha: 0 });
      gsap.set(pubFace, { autoAlpha: 1 });
    } else {
      statusPillEl.style.width = wDraftC + 'px';
    }

    // ── Document ──
    var hero = q('.qbl-hero');
    if (data.hero_url) { hero.src = data.hero_url; hero.onerror = function() { this.removeAttribute('src'); }; }
    q('.qbl-title').textContent = title;
    q('.qbl-dek').textContent = data.dek || "When every blog post, email, and social post requires you personally to execute it, your marketing has a hard ceiling. Here's what manual execution actually costs — in time, money, and growth.";
    var authors = data.authors || [{ name: 'Marc Ferrentino' }];
    var authWrap = q('.qbl-authors');
    authors.forEach(function(a) {
      var chip = document.createElement('span');
      chip.className = 'qbl-avachip';
      if (a.avatar_url) {
        var im = document.createElement('img');
        im.src = a.avatar_url;
        im.onerror = function() { this.remove(); };
        chip.appendChild(im);
      }
      chip.appendChild(document.createTextNode(a.name));
      var x = document.createElement('span');
      x.className = 'qbl-x';
      x.textContent = '✕';
      chip.appendChild(x);
      authWrap.appendChild(chip);
    });
    q('.qbl-slug').textContent = data.slug || title.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
    var tagWrap = q('.qbl-tags');
    (data.tags || ['AI', 'Marketing', 'Agents', 'Strategy']).forEach(function(t) {
      var chip = document.createElement('span');
      chip.className = 'qbl-tagchip';
      chip.appendChild(document.createTextNode(t));
      var x = document.createElement('span');
      x.className = 'qbl-x';
      x.textContent = '✕';
      chip.appendChild(x);
      tagWrap.appendChild(chip);
    });
    q('.qbl-pubdate').textContent = data.publish_date || 'Jul 14, 2026';
    q('.qbl-wc').textContent = 'Word Count: ' + (data.word_count != null ? data.word_count : 888);
    var body = q('.qbl-body');
    (data.body || [
      { type: 'p', text: "There's a cost that doesn't show up on any marketing budget: the cost of your marketing depending entirely on you to execute it." },
      { type: 'p', text: "It shows up in subtler ways. The blog post that sat in draft for two weeks because you didn't have time to format and publish it. The email campaign that went out three days late because the queue backed up." },
      { type: 'h2', text: 'The time cost: more than you think' },
      { type: 'p', text: "These aren't failures of strategy or creativity. They're the predictable output of an operation where every step depends on a person to manually complete it." },
    ]).forEach(function(blk) {
      var node = document.createElement(blk.type === 'h2' ? 'h2' : 'p');
      node.textContent = blk.text;
      body.appendChild(node);
    });

    // ── Entrance ──
    gsap.set(win, { autoAlpha: 0, y: 14 });
    tl.to(win, { autoAlpha: 1, y: 0, duration: 0.35, ease: 'power2.out' }, 0.05);
    var doc = q('.qbl-doc');
    gsap.set(doc, { autoAlpha: 0, y: 16 });
    tl.to(doc, { autoAlpha: 1, y: 0, duration: 0.4, ease: 'power2.out' }, 0.22);

    // ── Script ──
    var statusPill = q('.qbl-status');
    var scroll = q('.qbl-scroll');
    if (Array.isArray(data.script) && data.script.length) {
      var cursorTargets = data.cursor_targets || {
        'status': { x: '93%', y: '12%' },
        'hero': { x: '55%', y: '42%' },
      };
      runScript(tl, el, data.script, cursorTargets, ctx, {
        'publish-blog': function(tl2, ctr, action, at) {
          if (action.published_when) q('.qbl-pub-text').textContent = 'Published ' + action.published_when;
          // Press the black Publish CTA, then it becomes the white
          // green-rocket Published pill: width + colors tween with the
          // face crossfade (all timeline-owned).
          tl2.to(statusPill, { scale: 0.94, duration: 0.1, ease: 'power2.in' }, at);
          tl2.to(statusPill, { scale: 1, duration: 0.18, ease: 'power2.out' }, at + 0.1);
          tl2.to(draftFace, { autoAlpha: 0, duration: 0.15 }, at + 0.2);
          tl2.fromTo(statusPill, { width: wDraftC, backgroundColor: '#17171c', borderColor: '#17171c' },
            { width: wPubC, backgroundColor: '#ffffff', borderColor: '#e9e7f0',
              duration: 0.35, ease: 'power2.inOut', immediateRender: false }, at + 0.2);
          tl2.fromTo(pubFace, { autoAlpha: 0 },
            { autoAlpha: 1, duration: 0.28, immediateRender: false }, at + 0.38);
        },
        'highlight-hero': function(tl2, ctr, action, at) {
          tl2.fromTo(hero, { scale: 1 }, { scale: 1.015, duration: 0.3, ease: 'power2.out' }, at);
          tl2.to(hero, { scale: 1, duration: 0.35, ease: 'power2.inOut' }, at + 0.5);
        },
        'scroll-doc': function(tl2, ctr, action, at) {
          tl2.to(scroll, { scrollTop: '+=' + (action.amount || 320), duration: action.duration || 1.6,
            ease: 'power1.inOut' }, at);
        },
      });
    }

    return tl;
  }
</script>
