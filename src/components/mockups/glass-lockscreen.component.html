      var track = -0.045 * fs;
      var adv = digits.map(function (d) { return mc.measureText(d.textContent).width; });
      var tot = adv.reduce(function (a, b) { return a + b; }, 0) + track * (adv.length - 1);
      return { adv: adv, tot: tot, track: track };
    }

    // ── Cursor ──
    var CS = Math.round(U * 0.026), cur = null, ring = null;
    if (useCursor) {
      if (typeof createCursor === 'function') cur = createCursor(root, { color: '#0b0b0c', size: CS, zIndex: 50 });
      else {
        cur = document.createElement('div');
        cur.style.cssText = 'position:absolute;left:0;top:0;width:' + CS + 'px;height:' + CS + 'px;z-index:50';
        cur.innerHTML = '<svg width="' + CS + '" height="' + CS + '" viewBox="0 0 24 24"><path d="M5.5 3.21V20.8c0 .45.54.67.85.35l4.86-4.86a.5.5 0 0 1 .35-.15h6.87c.45 0 .67-.53.35-.85L5.85 2.35a.5.5 0 0 0-.35.86z" fill="#0b0b0c" stroke="#fff" stroke-width="1.5"/></svg>';
        root.appendChild(cur);
      }
      cur.classList.add('gls-cursor');
      ring = cur.querySelector('.mp-cursor-ring');
      gsap.set(cur, { autoAlpha: 1, transformOrigin: (5.5 / 24 * 100) + '% ' + (3.2 / 24 * 100) + '%' });
    }

    var E = { io2: gsap.parseEase('power2.inOut'), io3: gsap.parseEase('power3.inOut'), o2: gsap.parseEase('power2.out'), o3: gsap.parseEase('power3.out'),
      i2: gsap.parseEase('power2.in'), back: gsap.parseEase('back.out(2)'), back1: gsap.parseEase('back.out(1.25)') };
    var cl = function (v, a, b) { return v < a ? a : v > b ? b : v; };
    var P01 = function (t, t0, d) { return cl((t - t0) / d, 0, 1); };
    var lerp = function (a, b, p) { return a + (b - a) * p; };

    // Layout of the lock screen in a screen box (sw x sh): a = 0 square, 1 phone.
    function layout(sw, sh, ox, oy) {
      var a = cl((sh / sw - 1) / (ASPECT - 1), 0, 1);
      return {
        a: a, cx: ox + sw / 2,
        dateY: oy + sh * lerp(0.105, 0.098, a), dateFs: sw * lerp(0.036, 0.05, a),
        clockY: oy + sh * lerp(0.262, 0.19, a), clockFs: sw * lerp(0.29, 0.34, a),
        pCx: ox + sw * 0.5, pCy: oy + sh * lerp(0.855, 0.845, a), pW: sw * lerp(0.64, 0.88, a), pH: sw * lerp(0.12, 0.17, a), pR: sw * lerp(0.036, 0.05, a),
        hY: oy + sh * lerp(0.972, 0.975, a), hW: sw * lerp(0.13, 0.34, a), hH: sw * lerp(0.0075, 0.013, a)
      };
    }

    function render(t) {
      // ── phone / screen box ──
      var pp = E.io3(P01(t, T.pull, T.pullEnd - T.pull));
      var ow = lerp(W, PH.w, pp), oh = lerp(H, PH.h, pp), ocx = lerp(W / 2, PH.cx, pp), ocy = lerp(H / 2, PH.cy, pp);
      var br = PH.b * E.o2(P01(t, T.pull + 0.05, 0.4));
      var orr = lerp(0, PH.r, E.o2(pp));
      phone.style.left = (ocx - ow / 2) + 'px'; phone.style.top = (ocy - oh / 2) + 'px';
      phone.style.width = ow + 'px'; phone.style.height = oh + 'px';
      phone.style.borderRadius = orr + 'px';
      phone.style.boxShadow = pp > 0 ? '0 ' + (U * 0.03 * pp) + 'px ' + (U * 0.06 * pp) + 'px rgba(20,24,60,' + (0.28 * pp) + '), 0 ' + (U * 0.004 * pp) + 'px ' + (U * 0.01 * pp) + 'px rgba(20,24,60,' + (0.2 * pp) + ')' : 'none';
      var sw = ow - 2 * br, sh = oh - 2 * br;
      screen.style.left = br + 'px'; screen.style.top = br + 'px'; screen.style.width = sw + 'px'; screen.style.height = sh + 'px';
      screen.style.borderRadius = Math.max(0, orr - br) + 'px';
      // Lay the lock screen out in the part of the screen the frame shows.
      var sx0 = ocx - ow / 2 + br, sy0 = ocy - oh / 2 + br;
      var vx = Math.max(0, FX - sx0), vy = Math.max(0, FY - sy0);
      var vw = Math.min(sw, FX + FW - sx0) - vx, vh = Math.min(sh, FY + FH - sy0) - vy;
      if (vw < 10 || vh < 10) { vx = 0; vy = 0; vw = sw; vh = sh; }
      var L = layout(vw, vh, vx, vy);

      // ── date + glass clock ──
      var dIn = E.o3(P01(t, T.clock + 0.1, 0.4));
      dateEl.style.fontSize = L.dateFs + 'px';
      var dw = dateEl.offsetWidth, dh = dateEl.offsetHeight;
      gsap.set(dateEl, { x: L.cx - dw / 2, y: L.dateY - dh / 2 + (1 - dIn) * L.dateFs * 0.9, autoAlpha: t >= T.clock + 0.1 ? 1 : 0 });
      dateEl.style.clipPath = 'inset(-20% -5% ' + ((1 - dIn) * 100) + '% -5%)';

      glassSize(gD, sw, sh); glassSize(gP, sw, sh);
      var m = measure(L.clockFs), x = L.cx - m.tot / 2, any = false;
      var base = L.clockY + L.clockFs * 0.355;
      for (var i = 0; i < digits.length; i++) {
        var tp = T.clock + i * 0.06, s = t < tp ? 0 : E.back(P01(t, tp, 0.36));
        var cx = x + m.adv[i] / 2;
        x += m.adv[i] + m.track;
        if (s <= 0.001) { digits[i].setAttribute('display', 'none'); continue; }
        any = true;
        digits[i].removeAttribute('display');
        A(digits[i], { x: cx, y: base, 'font-size': L.clockFs, transform: 'translate(' + cx + ' ' + L.clockY + ') scale(' + s + ') translate(' + (-cx) + ' ' + (-L.clockY) + ')' });
      }
      gD.svg.style.display = any ? 'block' : 'none';
      if (any) {
        var fs = L.clockFs;
        glassParams(gD, { E: fs * 0.04, S: fs * 0.2, ch: 0.22, frost: fs * 0.012, tint: 0.2, ss: 3, spec: 0.9, rim: Math.max(0.8, fs * 0.006), rimTop: 0.85, rimBot: 0.35, shadow: 0.12, shBlur: fs * 0.03, shY: fs * 0.015, sat: 1.25, bright: 1.12, lift: 0.05 });
        magnify(gD, L.cx, L.clockY, 1.05);
        region(gD, L.cx - m.tot / 2, L.clockY - fs * 0.5, L.cx + m.tot / 2, L.clockY + fs * 0.5, fs * 0.2);
      }

      // ── home bar -> glass player ──
      var hs = E.back(P01(t, T.bar, 0.25));
      home.style.display = hs > 0.001 ? 'block' : 'none';
      home.style.width = L.hW + 'px'; home.style.height = L.hH + 'px';
      gsap.set(home, { x: L.cx - L.hW / 2, y: L.hY - L.hH / 2, scaleX: hs, scaleY: Math.min(1, hs * 1.4) });
      var R = null;
      if (t >= T.player) {
        var sp = P01(t, T.player, T.bar + 0.4 - T.player);
        var ew = E.back1(sp), eh = E.o3(cl(sp * 1.15, 0, 1)), ey = E.io2(cl(sp * 1.3, 0, 1));
        R = { cx: L.pCx, cy: lerp(L.hY, L.pCy, ey), w: lerp(L.hW, L.pW, ew), h: lerp(L.hH, L.pH, eh), r: lerp(L.hH / 2, L.pR, eh) };
      }
      if (R) {
        gP.svg.style.display = 'block';
        A(pill, { x: R.cx - R.w / 2, y: R.cy - R.h / 2, width: R.w, height: R.h, rx: Math.min(R.r, R.h / 2), ry: Math.min(R.r, R.h / 2) });
        var gs = vw / U;
        glassParams(gP, { E: U * 0.008 * gs, S: U * 0.04 * gs, ch: 0.2, frost: 2.2 * gs, tint: 0.12, ss: 3, spec: 0.75, rim: Math.max(0.7, 1.4 * gs), rimTop: 0.8, rimBot: 0.35, shadow: 0.2, shBlur: U * 0.008 * gs, shY: U * 0.005 * gs, sat: 1.35, bright: 1.1, lift: 0.04 });
        magnify(gP, R.cx, R.cy, 1.04);
        region(gP, R.cx - R.w / 2, R.cy - R.h / 2, R.cx + R.w / 2, R.cy + R.h / 2, U * 0.04 * gs);
        // player content, anchored to the final pill, revealed by the pill's own box
        player.style.display = 'block';
        player.style.left = (R.cx - R.w / 2) + 'px'; player.style.top = (R.cy - R.h / 2) + 'px';
        player.style.width = R.w + 'px'; player.style.height = R.h + 'px';
        player.style.borderRadius = Math.min(R.r, R.h / 2) + 'px';
        var ox = (L.pCx - L.pW / 2) - (R.cx - R.w / 2), oy = (L.pCy - L.pH / 2) - (R.cy - R.h / 2);
        var pad = L.pW * 0.06, cIn = E.o3(P01(t, T.bar + 0.28, 0.3));
        var tFs = L.pH * 0.2;
        meta.style.fontSize = tFs + 'px';
        gsap.set(meta, { x: ox + pad, y: oy + L.pH * 0.2 + (1 - cIn) * L.pH * 0.3, autoAlpha: cIn > 0 ? 1 : 0 });
        var bs = L.pH * 0.2, gap = bs * 0.9;
        btns.forEach(function (b, bi) { b.style.width = b.style.height = (bi === 1 ? bs * 1.15 : bs) + 'px'; b.style.marginLeft = bi ? gap + 'px' : '0'; });
        var cw = bs * 3.15 + gap * 2;
        var bIn = E.back(P01(t, T.bar + 0.32, 0.3));
        gsap.set(ctrls, { x: ox + L.pW - pad - cw, y: oy + L.pH * 0.42 - bs * 0.575, height: bs * 1.15, scale: bIn, transformOrigin: '50% 50%', autoAlpha: bIn > 0.01 ? 1 : 0 });
        var playing = t >= T.click + 0.06;
        iPlay.style.display = playing ? 'none' : 'block';
        iPause.style.display = playing ? 'block' : 'none';
        var pop = 1 - 0.2 * Math.sin(Math.PI * P01(t, T.click, 0.16));
        gsap.set(playBtn, { scale: pop });
        var pw = L.pW - pad * 2, ph = Math.max(1.5, L.pH * 0.035);
        prog.style.width = pw + 'px'; prog.style.height = ph + 'px';
        gsap.set(prog, { x: ox + pad, y: oy + L.pH * 0.8 - ph / 2, scaleX: E.o3(P01(t, T.bar + 0.3, 0.35)), transformOrigin: '0 50%' });
        var prog0 = 0.34 + (playing ? (t - T.click) * 0.02 : 0);
        progFill.style.width = (cl(prog0, 0, 1) * 100) + '%';
      } else { gP.svg.style.display = 'none'; player.style.display = 'none'; }

      // ── Dynamic Island ──
      var ip = showIsland ? E.back1(P01(t, T.pull + 0.22, 0.28)) : 0;
      island.style.display = ip > 0.001 ? 'block' : 'none';
      var iw = sw * 0.3 * ip, ih = sw * 0.085 * Math.min(1, ip * 1.3);
      island.style.width = Math.max(0, iw) + 'px'; island.style.height = Math.max(0, ih) + 'px';
      gsap.set(island, { x: sw / 2 - iw / 2, y: sw * 0.035 });

      // ── Cursor ──
      if (cur) {
        // the play button's centre in the final player layout (root px)
        var bsz = L.pH * 0.2, bgap = bsz * 0.9, bpad = L.pW * 0.06, bcw = bsz * 3.15 + bgap * 2;
        var tgt = { x: (ocx - ow / 2) + br + L.pCx + L.pW / 2 - bpad - bcw + bsz + bgap + bsz * 0.575 + bsz * 0.1,
                    y: (ocy - oh / 2) + br + L.pCy - L.pH / 2 + L.pH * 0.42 + bsz * 0.15 };
        var p1 = E.io2(P01(t, T.click - 0.4, 0.36)), p2 = E.io2(P01(t, T.click + 0.18, T.pull + 0.1 - T.click - 0.18));
        var cx2 = lerp(lerp(FX + FW * cFrom[0], tgt.x, p1), FX + FW * cTo[0], p2), cy2 = lerp(lerp(FY + FH * cFrom[1], tgt.y, p1), FY + FH * cTo[1], p2);
        var press = (t >= T.click && t < T.click + 0.16) ? 1 - 0.15 * Math.sin(Math.PI * (t - T.click) / 0.16) : 1;
        gsap.set(cur, { x: cx2 - CS * 5.5 / 24, y: cy2 - CS * 3.2 / 24, scale: press });
        if (ring) {
          if (t >= T.click && t < T.click + 0.42) { var rq = E.o2((t - T.click) / 0.42); gsap.set(ring, { autoAlpha: 0.8 * (1 - rq), scale: 0.25 + 1.3 * rq }); }
          else gsap.set(ring, { autoAlpha: 0 });
        }
      }
    }

    var clock = { t: 0 };
    render(0);
    tl.to(clock, { t: END, duration: END, ease: 'none', onUpdate: function () { render(clock.t); } }, 0);
    return tl;
  }
</script>
