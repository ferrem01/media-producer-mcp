    var tl = gsap.timeline();
    var card = el.querySelector('.gmr-card');

    el.querySelector('.gmr-sender-email').textContent = data.sender_email ? '<' + data.sender_email + '>' : '';

    el.querySelector('.gmr-avatar-txt').textContent = senderName.split(/\s+/).slice(0, 2)
      .map(function(w) { return (w[0] || '').toUpperCase(); }).join('') || 'S';
    var count = typeof data.inbox_count === 'number' ? data.inbox_count : 2008;
    el.querySelector('.gmr-nav-count').textContent = count.toLocaleString('en-US');
    el.querySelector('.gmr-pager').textContent = data.pager || '5 of 4,946';
    if (data.external === false) el.querySelector('.gmr-chip-external').style.display = 'none';

    // Body: paragraphs split on newlines; the money quote is marked with
    // *asterisks* or named via data.highlight_quote (substring match). If
    // neither matches, the mail renders un-highlighted.
    var bodyEl = el.querySelector('.gmr-body');
    var bodyText = data.body ||
      'Just wanted to say: the launch went perfectly.\n\nThis is the first product launch that actually felt like magic instead of chaos.\n\nThank you!';
    var hq = typeof data.highlight_quote === 'string' ? data.highlight_quote.trim() : '';
    // Style variants: 'marker' (default) or 'underline'. A custom color is
    // honored only when it parses as a color (the cert sampler feeds prose).
    var underline = data.highlight_style === 'underline';
    var hlColor = typeof data.highlight_color === 'string' && /^(#[0-9a-fA-F]{3,8}|rgb)/.test(data.highlight_color.trim())
      ? data.highlight_color.trim() : (underline ? '#393bf5' : '');
    var hlSpans = [];
    bodyText.split(/\n+/).filter(Boolean).forEach(function(paraText) {
      var p = document.createElement('p');
      var marked = paraText;
      if (paraText.indexOf('*') === -1 && hq && paraText.indexOf(hq) !== -1) {
        marked = paraText.split(hq).join('*' + hq + '*');
      }
      var re = /\*([^*]+)\*|([^*]+)/g, m;
      while ((m = re.exec(marked)) !== null) {
        if (m[1] !== undefined) {
          var hl = document.createElement('span');
          hl.className = 'gmr-hl' + (underline ? ' is-underline' : '');
          if (hlColor) hl.style.backgroundImage = 'linear-gradient(' + hlColor + ', ' + hlColor + ')';
          hl.textContent = m[1];
          p.appendChild(hl);
          hlSpans.push(hl);
        } else {

        }
      }
      bodyEl.appendChild(p);
    });

      el.querySelector('.gmr-sidebar'),
      el.querySelector('.gmr-toolbar'),
      el.querySelector('.gmr-message')

    tl.to(regions, {
      autoAlpha: 1, y: 0, duration: 0.4, stagger: 0.08, ease: 'power2.out'
    }, 0.25 + speed * 0.4);

      var sweepAt = Math.min(0.25 + speed + 0.9, ctx.duration * 0.45);
      tl.to(hlSpans, {
        backgroundSize: underline ? '100% 3px' : '100% 100%',
        duration: 0.9, stagger: 0.15, ease: 'power2.inOut'

      tl.to(card, {
        autoAlpha: 0, scale: 0.96, y: -15,
        duration: 0.4, ease: 'power2.in'
