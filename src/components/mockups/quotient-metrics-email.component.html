    var campaign = data.campaign != null ? data.campaign : 'Q3 Flows Launch';
    el.querySelector('.qme-camp-label').textContent = campaign;
    var prog = String(data.campaign_progress != null ? data.campaign_progress : '4/4');
    el.querySelector('.qme-camp-count').textContent = prog;
    var pm = prog.match(/(\d+)\s*\/\s*(\d+)/);
    var frac = data.campaign_ring != null ? num(data.campaign_ring, 1) : (pm && +pm[2] ? +pm[1] / +pm[2] : 1);
    frac = Math.max(0, Math.min(1, frac));
    var arc = el.querySelector('.qme-ring-arc'), C = 2 * Math.PI * 5.5;
    arc.style.strokeDasharray = C.toFixed(3);
    arc.style.strokeDashoffset = (C * (1 - frac)).toFixed(3);
    if (data.campaign === false) el.querySelector('.qme-camp').style.display = 'none';
    var threadsLabel = data.threads_label || ('Threads (' + (data.threads != null ? data.threads : 3) + ')');
    el.querySelector('.qme-threads-label').textContent = threadsLabel;
    if (data.threads === false) el.querySelector('.qme-threads').style.display = 'none';
    el.querySelector('.qme-status-label').textContent = data.status != null ? data.status : 'Sent 3 days ago';
    if (data.status === false) el.querySelector('.qme-status').style.display = 'none';

    // ── KPI tiles ──
    var kpiDefs = Array.isArray(data.kpis) && data.kpis.length ? data.kpis : [
      { label: 'Total Emails Sent', icon: 'send', value: 18400 },
      { label: 'Delivery Rate', icon: 'check', value: 99.2, format: 'percent' },
      { label: 'Open Rate', icon: 'open', value: 52.4, format: 'percent' },
      { label: 'Click Rate', icon: 'click', value: 11.8, format: 'percent' }
    ];
    var DEFAULT_KPI_ICONS = ['send', 'check', 'open', 'click'];
    var kpiWrap = el.querySelector('.qme-kpis');
    root.style.setProperty('--qme-cols', String(Math.min(6, kpiDefs.length)));
    if (data.tile_height) root.style.setProperty('--qme-tile-h', String(num(data.tile_height, 124)));
    var kpis = kpiDefs.map(function (k, i) {
      var spec = specOf(k);
      var tile = document.createElement('div');
      tile.className = 'qme-kpi';
      tile.setAttribute('data-anchor', 'kpi-' + i);
      tile.setAttribute('data-cursor-target', 'kpi-' + i);
      var icon = k.icon === false ? '' : svg(k.icon || DEFAULT_KPI_ICONS[i] || 'trending');
      tile.innerHTML = '<div class="qme-kpi-label">' + icon + '<span>' + esc(k.label || '') + '</span></div>' +
        '<div class="qme-kpi-value"></div>';
      kpiWrap.appendChild(tile);
      var valueEl = tile.querySelector('.qme-kpi-value');
      var finalText = k.display != null ? String(k.display) : fmt(spec, spec.value);
      valueEl.textContent = finalText;
      return { tile: tile, valueEl: valueEl, spec: spec, label: norm(k.label), finalText: finalText,
        start: k.from != null ? parseVal(k.from).n : 0, last: spec.value, lastText: finalText };
    });

    // ── funnel ──
    el.querySelector('.qme-ftitle').textContent = data.funnel_title != null ? data.funnel_title : 'Broadcast Engagement Funnel';
    var stageDefs = Array.isArray(data.funnel) && data.funnel.length ? data.funnel : [
      { label: 'Sent', value: 18400 },
      { label: 'Delivered', value: 18253 },
      { label: 'Opened', value: 9565 },
      { label: 'Clicked', value: 2154 }
    ];
    var stages = stageDefs.map(function (s, i) {
      var v = parseVal(s.value).n;
      var lbl = String(s.label || '');
      var shown = (data.number_stages === false || /^\s*\d+\./.test(lbl)) ? lbl : (i + 1) + '. ' + lbl;
      return { v: v, label: shown, name: norm(lbl) };
    });
    // Nice axis like recharts: 4 intervals of a 1/2/2.5/5/7.5 x 10^n step.
    var peak = Math.max.apply(null, stages.map(function (s) { return s.v; }).concat([1]));
    var intervals = Math.max(1, Math.round(num(data.axis_ticks, 4)));
    var axisMax = num(data.axis_max, 0);
    if (!(axisMax > 0)) {
      var raw = peak / intervals, mag = Math.pow(10, Math.floor(Math.log10(raw))), steps = [1, 2, 2.5, 5, 7.5, 10], step = 10 * mag;
      for (var si = 0; si < steps.length; si++) { if (steps[si] * mag >= raw - 1e-9) { step = steps[si] * mag; break; } }
      axisMax = step * intervals;
    }
    var axisFmt = function (v) { return data.axis_format === 'compact' ? fmt({ format: 'compact', decimals: 0 }, v) : data.axis_format === 'comma' ? group(v, 0) : String(Math.round(v * 100) / 100); };
    var grid = el.querySelector('.qme-grid'), yaxis = el.querySelector('.qme-yaxis');
    var gridEls = [], tickEls = [];
    for (var ti = 0; ti <= intervals; ti++) {
      var pct = (ti / intervals) * 100;
      var gl = document.createElement('div'); gl.className = 'qme-gl'; gl.style.bottom = pct + '%'; grid.appendChild(gl); gridEls.push(gl);
      var yt = document.createElement('div'); yt.className = 'qme-yt'; yt.style.top = (100 - pct) + '%'; yt.textContent = axisFmt(axisMax * ti / intervals); yaxis.appendChild(yt); tickEls.push(yt);
    }
    var barsWrap = el.querySelector('.qme-bars'), xaxis = el.querySelector('.qme-xaxis');
    var showVals = !!data.bar_values;
    var hPct = function (v) { return Math.max(0, Math.min(100, (v / axisMax) * 100)); };
    stages.forEach(function (s, i) {
      var col = document.createElement('div'); col.className = 'qme-col';
      col.style.left = (i / stages.length * 100) + '%'; col.style.width = (100 / stages.length) + '%';
      col.setAttribute('data-anchor', 'stage-' + i);
      col.setAttribute('data-cursor-target', 'stage-' + i);
      var bar = document.createElement('div'); bar.className = 'qme-bar'; col.appendChild(bar);
      if (showVals) { var bv = document.createElement('div'); bv.className = 'qme-bar-val'; bar.appendChild(bv); s.valEl = bv; bv.textContent = group(s.v, 0); }
      barsWrap.appendChild(col);
      var xt = document.createElement('div'); xt.className = 'qme-xt'; xt.textContent = s.label; xaxis.appendChild(xt);
      s.col = col; s.bar = bar; s.last = s.v;
      bar.style.height = hPct(s.v) + '%';
    });

    // ── footer card (below the product's fold) ──
    var foot = data.footer || {};
    var footEl = el.querySelector('.qme-foot');
    if (data.show_footer === false || data.footer === false) footEl.style.display = 'none';
    el.querySelector('.qme-foot-title').textContent = foot.title != null ? foot.title : 'Want to dig deeper?';
    el.querySelector('.qme-foot-text').textContent = foot.text != null ? foot.text : 'Ask the agent a question about these numbers, or build a report of your own.';
    el.querySelector('.qme-foot-sec').textContent = foot.secondary != null ? foot.secondary : 'Open reports';
    el.querySelector('.qme-foot-pri').textContent = foot.primary != null ? foot.primary : 'Ask the agent';

    // ── ENTRANCE: tiles land and ROLL UP, the funnel bars GROW from the
    // baseline one after another. All tweens on tl (scrub-safe). ──
    var AT = num(data.at, 0);
    var P = function (t) { return Math.max(0, t + AT); };
    var entrance = data.entrance || 'rise';
    var uPx = function () { return parseFloat(getComputedStyle(root).getPropertyValue('--u')) || 1; };
    if (entrance !== 'none') {
      var u = uPx();
      if (!docked) {
        gsap.set(card, { autoAlpha: 0, y: 16 * u });
        tl.to(card, { autoAlpha: 1, y: 0, duration: 0.35, ease: 'power3.out' }, P(0.05));
      }
      var topBits = [].slice.call(el.querySelectorAll('.qme-tab, .qme-actions > *'));
      gsap.set(topBits, { autoAlpha: 0, y: 6 * u });
      tl.to(topBits, { autoAlpha: 1, y: 0, duration: 0.35, ease: 'power2.out', stagger: 0.035 }, P(0.15));
      gsap.set(arc, { strokeDashoffset: C });
      tl.to(arc, { strokeDashoffset: C * (1 - frac), duration: 0.8, ease: 'power2.inOut' }, P(0.45));

      kpis.forEach(function (k, i) {
        var at = 0.3 + i * 0.1;
        gsap.set(k.tile, { autoAlpha: 0, y: 14 * u });
        tl.to(k.tile, { autoAlpha: 1, y: 0, duration: 0.45, ease: 'power3.out' }, P(at));
        var o = { v: k.start };
        k.valueEl.textContent = fmt(k.spec, k.start);
        tl.fromTo(o, { v: k.start }, { v: k.spec.value, duration: 1.2, ease: 'power2.out', immediateRender: false,
          onUpdate: function () { k.valueEl.textContent = this.progress() >= 1 ? k.finalText : fmt(k.spec, o.v); } }, P(at + 0.08));
      });

      var funnel = el.querySelector('.qme-funnel');
      gsap.set(funnel, { autoAlpha: 0, y: 14 * u });
      tl.to(funnel, { autoAlpha: 1, y: 0, duration: 0.45, ease: 'power3.out' }, P(0.6));
      gsap.set(gridEls.concat(tickEls), { autoAlpha: 0 });
      tl.to(gridEls.concat(tickEls), { autoAlpha: 1, duration: 0.4, stagger: 0.03 }, P(0.75));
      stages.forEach(function (s, i) {
        var at = 0.95 + i * 0.22;
        gsap.set(s.bar, { height: '0%' });
        tl.to(s.bar, { height: hPct(s.v) + '%', duration: 0.75, ease: 'power3.out' }, P(at));
        if (s.valEl) {
          var o = { v: 0 };
          s.valEl.textContent = '0';
          tl.fromTo(o, { v: 0 }, { v: s.v, duration: 0.75, ease: 'power3.out', immediateRender: false,
            onUpdate: function () { s.valEl.textContent = group(Math.round(o.v), 0); } }, P(at));
        }
      });
      if (footEl.style.display !== 'none') {
        gsap.set(footEl, { autoAlpha: 0, y: 12 * u });
        tl.to(footEl, { autoAlpha: 1, y: 0, duration: 0.45, ease: 'power3.out' }, P(1.75));
      }
    }

    // ── SCRIPT ──
    var findKpi = function (t) {
      if (t == null) return null;
      var m = String(t).match(/^kpi-(\d+)$/); if (m) return kpis[+m[1]] || null;
      var n = norm(t);
      return kpis.filter(function (k) { return k.label === n; })[0] || kpis.filter(function (k) { return n && k.label.indexOf(n) >= 0; })[0] || null;
    };
    var findStage = function (t) {
      if (t == null) return null;
      var m = String(t).match(/^stage-(\d+)$/); if (m) return stages[+m[1]] || null;
      var n = norm(t);
      return stages.filter(function (s) { return s.name === n; })[0] || null;
    };
    var findTab = function (t) { var n = norm(t); return tabs.filter(function (x) { return x.name === n; })[0] || null; };
    var REGIONS = { kpis: '.qme-kpis', funnel: '.qme-funnel', chart: '.qme-chart', tabs: '.qme-tabs', header: '.qme-top', footer: '.qme-foot',
      campaign: '.qme-camp', threads: '.qme-threads', status: '.qme-status', share: '[data-cursor-target="share"]',
      'open reports': '[data-cursor-target="open-reports"]', 'ask the agent': '[data-cursor-target="ask-agent"]' };
    var findEl = function (t) {
      var k = findKpi(t); if (k) return k.tile;
      var s = findStage(t); if (s) return s.col;
      var tb = findTab(t); if (tb) return tb.el;
      var r = REGIONS[norm(t)]; if (r) return el.querySelector(r);
      var n = norm(t); if (!n) return null;
      var all = el.querySelectorAll('.qme-card *'), best = null;
      for (var i = 0; i < all.length; i++) {
        if (all[i].children.length === 0 && norm(all[i].textContent) === n) { best = all[i]; break; }
      }
      return best;
    };
    // Slug for the shared cursor runner: "Ask the agent" -> its marked element.
    var cursorSlug = function (t) {
      if (t == null) return t;
      var k = findKpi(t); if (k) return k.tile.getAttribute('data-cursor-target');
      var s = findStage(t); if (s) return s.col.getAttribute('data-cursor-target');
      var tb = findTab(t); if (tb) return tb.el.getAttribute('data-cursor-target');
      var e = findEl(t);
      while (e && e !== root) { if (e.getAttribute && e.getAttribute('data-cursor-target')) return e.getAttribute('data-cursor-target'); e = e.parentNode; }
      return t;
    };

    var script = (Array.isArray(data.script) ? data.script : []).filter(Boolean).slice()
      .sort(function (a, b) { return num(a.at, 0) - num(b.at, 0); });
    var passOn = [];
    script.forEach(function (a) {
      var at = Math.max(0, num(a.at, 0));
      var act = a.action;
      if (act === 'count' || act === 'count-up') {
        var tgt = a.target != null ? a.target : a.text;
        var k = findKpi(tgt);
        var dur = num(a.duration, 1.2);
        if (k) {
          var toSpec = parseVal(a.to), to = toSpec.n, from = k.last, fromText = k.lastText;
          var endText = a.display != null ? String(a.display) : fmt(k.spec, to);
          var o = { v: from };
          tl.fromTo(o, { v: from }, { v: to, duration: dur, ease: a.ease || 'power2.out', immediateRender: false,
            onUpdate: function () { var p = this.progress(); k.valueEl.textContent = p >= 1 ? endText : p <= 0 ? fromText : fmt(k.spec, o.v); } }, at);
          k.last = to; k.lastText = endText;
          return;
        }
        var s = findStage(tgt);
        if (s) {
          var sTo = parseVal(a.to).n, sFrom = s.last;
          tl.fromTo(s.bar, { height: hPct(sFrom) + '%' }, { height: hPct(sTo) + '%', duration: dur, ease: a.ease || 'power2.out', immediateRender: false }, at);
          if (s.valEl) {
            var so = { v: sFrom }, ve = s.valEl;
            tl.fromTo(so, { v: sFrom }, { v: sTo, duration: dur, ease: a.ease || 'power2.out', immediateRender: false,
              onUpdate: function () { ve.textContent = group(Math.round(so.v), 0); } }, at);
          }
          s.last = sTo;
        }
        return;
      }
      if (act === 'highlight') {
        var host = findEl(a.target != null ? a.target : a.text);
        if (!host) return;
        if (getComputedStyle(host).position === 'static') host.style.position = 'relative';
        var ring = document.createElement('div'); ring.className = 'qme-hl';
        var col = a.color || accent;
        ring.style.borderColor = col;
        ring.style.background = (function (c) {
          var m = /^#?([0-9a-f]{6})$/i.exec(c); if (!m) return 'transparent';
          var n = parseInt(m[1], 16); return 'rgba(' + (n >> 16 & 255) + ',' + (n >> 8 & 255) + ',' + (n & 255) + ',0.07)';
        })(col);
        if (host.classList.contains('qme-col')) {
          var sv = stages.filter(function (x) { return x.col === host; })[0];
          ring.style.bottom = '-' + (6 * uPx()) + 'px';
          ring.style.height = 'calc(' + hPct(sv ? sv.last : 0) + '% + ' + (12 * uPx()) + 'px)';
        }
        host.appendChild(ring);
        var hold = num(a.duration, 1.6);
        tl.fromTo(ring, { autoAlpha: 0, scale: 1.04 }, { autoAlpha: 1, scale: 1, duration: 0.25, ease: 'power2.out', immediateRender: false }, at);
        if (a.hold !== true) tl.to(ring, { autoAlpha: 0, duration: 0.35, ease: 'power1.in' }, at + 0.25 + hold);
        return;
      }
      if (act === 'switch-tab') {
        var target = findTab(a.to != null ? a.to : a.target);
        if (!target) return;
        tabs.forEach(function (t) {
          var on = t === target;
          tl.to(t.el, { color: on ? '#17171c' : '#54545f', borderBottomColor: on ? '#17171c' : 'rgba(23,23,28,0)', duration: 0.2, ease: 'power1.out' }, at);
        });
        return;
      }
      if (act === 'set-text') {
        var te = findEl(a.target != null ? a.target : a.text);
        if (!te) return;
        var was = te.textContent, now = String(a.to != null ? a.to : '');
        var sw = { p: 0 };
        tl.fromTo(sw, { p: 0 }, { p: 1, duration: 0.01, immediateRender: false,
          onUpdate: function () { te.textContent = this.progress() > 0 ? now : was; } }, at);
        return;
      }
      var copy = {}; for (var key in a) copy[key] = a[key];
      if (copy.target != null) copy.target = cursorSlug(copy.target);
      passOn.push(copy);
    });
    if (passOn.length) runScript(tl, el, passOn, data.cursor_targets || {}, ctx, {});

    return tl;
  }
</script>
