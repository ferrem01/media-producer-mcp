<script>
  function createTimeline(el, data, ctx) {
    var tl = gsap.timeline();
    var card = el.querySelector('.emrd-card');
    var subjectEl = el.querySelector('.emrd-subject');
    var nameEl = el.querySelector('.emrd-sender-name');
    var emailEl = el.querySelector('.emrd-sender-email');
    var timeEl = el.querySelector('.emrd-time');
    var avatarEl = el.querySelector('.emrd-avatar-txt');
    var bodyEl = el.querySelector('.emrd-body');

    var senderName = data.sender_name || 'Sarah Chen';
    subjectEl.textContent = data.subject || 'You have to hear this';
    nameEl.textContent = senderName;
    emailEl.textContent = data.sender_email ? '<' + data.sender_email + '>' : '';
    timeEl.textContent = data.timestamp || '9:42 AM';
    avatarEl.textContent = senderName.split(/\s+/).slice(0, 2)
      .map(function(w) { return (w[0] || '').toUpperCase(); }).join('') || 'S';

    // Body: paragraphs split on newlines. The money quote is either marked
    // inline with *asterisks* or named via data.highlight_quote (matched as a
    // substring); if neither matches, the mail simply renders un-highlighted.
    var bodyText = data.body ||
      'Just wanted to say: the launch went perfectly.\n\nThis is the first product launch that actually felt like magic instead of chaos.\n\nThank you!';
    var hq = typeof data.highlight_quote === 'string' ? data.highlight_quote.trim() : '';
    // Style variants: 'marker' (default) or 'underline'. A custom color is
    // honored only when it parses as a color (the cert sampler feeds prose).
    var underline = data.highlight_style === 'underline';
    var hlColor = typeof data.highlight_color === 'string' && /^(#[0-9a-fA-F]{3,8}|rgb)/.test(data.highlight_color.trim())
      ? data.highlight_color.trim() : (underline ? '#393bf5' : '');
    var hlSpans = [];
    bodyText.split(/\n+/).filter(Boolean).forEach(function(paraText) {
      var p = document.createElement('p');
      var marked = paraText;
      if (paraText.indexOf('*') === -1 && hq && paraText.indexOf(hq) !== -1) {
        marked = paraText.split(hq).join('*' + hq + '*');
      }
      var re = /\*([^*]+)\*|([^*]+)/g, m;
      while ((m = re.exec(marked)) !== null) {
        if (m[1] !== undefined) {
          var hl = document.createElement('span');
          hl.className = 'emrd-hl' + (underline ? ' is-underline' : '');
          if (hlColor) hl.style.backgroundImage = 'linear-gradient(' + hlColor + ', ' + hlColor + ')';
          hl.textContent = m[1];
          p.appendChild(hl);
          hlSpans.push(hl);
        } else {
          p.appendChild(document.createTextNode(m[2]));
        }
      }
      bodyEl.appendChild(p);
    });

    var speed = ctx.motion === 'minimal' ? 0.5 : ctx.motion === 'punchy' ? 0.7 : 0.9;

    // Card entrance (the family gesture: rise + sharpen).
    gsap.set(card, { autoAlpha: 0, scale: 0.93, y: 34, filter: 'blur(4px)' });
    tl.to(card, {
      autoAlpha: 1, scale: 1, y: 0, filter: 'blur(0px)',
      duration: speed, ease: 'power3.out'
    }, 0.3);

    // Inner content settles in a beat behind the card.
    var inner = [
      el.querySelector('.emrd-subject-row'),
      el.querySelector('.emrd-sender-row')
    ].concat(Array.prototype.slice.call(bodyEl.children));
    gsap.set(inner, { autoAlpha: 0, y: 12 });
    tl.to(inner, {
      autoAlpha: 1, y: 0, duration: 0.45, stagger: 0.09, ease: 'power2.out'
    }, 0.3 + speed * 0.45);

    // The marker sweep: the quote gets found. Left-to-right, one beat after
    // the mail has settled.
    if (hlSpans.length > 0) {
      var sweepAt = Math.min(0.3 + speed + 0.9, ctx.duration * 0.45);
      tl.to(hlSpans, {
        backgroundSize: underline ? '100% 3px' : '100% 100%',
        duration: 0.9, stagger: 0.15, ease: 'power2.inOut'
      }, sweepAt);
    }

    // Exit
    if (ctx.duration > 2) {
      var exitAt = ctx.duration - 0.6;
      tl.to(card, {
        autoAlpha: 0, scale: 0.96, y: -15,
        duration: 0.4, ease: 'power2.in'
      }, exitAt);
    }

    // Run interactive script if provided
    if (data.script && data.script.length > 0) {
      runScript(tl, el, data.script, data.cursor_targets || {}, ctx);
    }

    return tl;
  }
</script>
