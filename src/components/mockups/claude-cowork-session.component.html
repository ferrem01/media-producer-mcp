  .cws-conn.is-live { border-color: rgba(217, 119, 87, 0.55); background: #fdf3ee; }
  .cws-conn-ico { width: 18px; height: 18px; border-radius: 5px; flex-shrink: 0; position: relative;
    display: flex; align-items: center; justify-content: center; font-size: 10px; font-weight: 700;
    color: #fff; overflow: hidden; }
  .cws-conn-img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
</style>

<script>
  function createTimeline(el, data, ctx) {
    var tl = gsap.timeline();
    var q = function (s) { return el.querySelector(s); };
    var win = q('.cws-win');
    var transcript = q('[data-target="transcript"]');
    var inputEl = q('[data-target="input"]');
    var inputBox = q('[data-target="input-box"]');
    var dur = ctx.duration || 10;

    q('[data-target="title"]').textContent = data.title || 'Launch campaign plan';
    q('[data-target="model-label"]').textContent = data.model_label || 'Opus 4.8';
    q('[data-target="effort-label"]').textContent = data.effort_label || 'High';
    if (data.account_name) q('[data-target="account-name"]').textContent = data.account_name;
    if (data.account_name) q('[data-target="account-avatar"]').textContent = String(data.account_name).charAt(0).toUpperCase();
    inputEl.setAttribute('data-placeholder', data.placeholder || 'Write a message…');

    // Sidebar lists (task rows get the checklist glyph, chats the bubble)
    var TASK_ICO = '<svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"><path d="M3 4.5l1 1 2-2M3 8.5l1 1 2-2M3 12.5l1 1 2-2M9 4.5h5M9 8.5h5M9 12.5h5" transform="scale(0.95)"/></svg>';
    var CHAT_ICO = '<svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"><circle cx="8" cy="8" r="6"/></svg>';
    var pinned = Array.isArray(data.pinned) ? data.pinned : ['Canva Design Hub'];
    var recents = Array.isArray(data.recents) && data.recents.length ? data.recents : [
      { title: 'Email access question', kind: 'task' },
      { title: 'Seniority Healthcare partnership requirements', kind: 'task' },
      { title: 'Getquotient MCP integration', kind: 'task' },
      { title: 'Quotient customer information sources', kind: 'task' },
      { title: 'Integrating Quotient with Boomerang', kind: 'chat' },
      { title: 'Head of growth role and responsibilities', kind: 'chat' },
      { title: 'Canva launch image', kind: 'task' },
    ];
    var activeIdx = Number(data.active_recent) || 1;
    var pinList = q('[data-target="pin-list"]');
    var recentList = q('[data-target="recent-list"]');
    function rowEl(item, active) {
      var it = typeof item === 'string' ? { title: item } : item;
      var d = document.createElement('div');
      d.className = 'cws-session' + (active ? ' is-active' : '');
      d.innerHTML = '<span class="cws-sess-ico">' + (it.kind === 'chat' ? CHAT_ICO : TASK_ICO) + '</span>' +
        '<span class="cws-sess-title">' + (it.title || '') + '</span>';
      return d;
    }
    pinned.forEach(function (t) { pinList.appendChild(rowEl(t, false)); });
    recents.forEach(function (t, i) { recentList.appendChild(rowEl(t, i === activeIdx)); });

    // ── Right rail ──
    var progressCount = q('[data-target="progress-count"]');
    var progressSteps = q('[data-target="progress-steps"]');
    var progress = data.progress || { current: 0, total: 3 };
    var steps = Array.isArray(data.progress_steps) ? data.progress_steps.slice() : [];
    function renderProgress() {
      progressCount.textContent = progress.total ? (progress.current + ' of ' + progress.total) : '';
      progressSteps.innerHTML = '';
      steps.forEach(function (s, i) {
        var d = document.createElement('div');
        var done = i < progress.current;
        var active = i === progress.current && progress.current < (progress.total || steps.length);
        d.className = 'cws-step' + (done ? ' done' : '') + (active ? ' active' : '');
        d.innerHTML = '<span class="cws-step-dot"></span><span>' + (s.text || s) + '</span>';
        progressSteps.appendChild(d);
      });
    }
    renderProgress();

    var outputsEl = q('[data-target="outputs"]');
    var DOC_ICO = '<svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"><path d="M4 1.5h5.5L13 5v9.5a1 1 0 01-1 1H4a1 1 0 01-1-1v-12a1 1 0 011-1z"/><path d="M9.5 1.5V5H13"/></svg>';
    function addOutput(o, animate) {
      var d = document.createElement('div');
      d.className = 'cws-output';
      d.innerHTML = '<span class="cws-output-ico">' + DOC_ICO + '</span>' +
        '<span>' + (o.name || String(o)) + '</span>';
      outputsEl.appendChild(d);
      if (animate !== false) gsap.from(d, { autoAlpha: 0, x: 14, duration: 0.35, ease: 'power2.out' });
      return d;
    }
    (Array.isArray(data.outputs) ? data.outputs : []).forEach(function (o) { addOutput(o, false); });

    var LOGO_DEV = function (domain) {
      return 'https://img.logo.dev/' + domain + '?token=pk_B_cdrQLyTkSFPzSMm52goQ&format=png&size=64&fallback=monogram';
    };
    var GLOBE_ICO = '<svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="#57544c" stroke-width="1.2" stroke-linecap="round"><circle cx="8" cy="8" r="6"/><path d="M2 8h12M8 2c1.8 1.7 2.7 3.7 2.7 6S9.8 12.3 8 14c-1.8-1.7-2.7-3.7-2.7-6S6.2 3.7 8 2z"/></svg>';
    var connectorsEl = q('[data-target="connectors"]');
    var connectors = Array.isArray(data.connectors) && data.connectors.length ? data.connectors : [
      { name: 'Quotient', icon_url: LOGO_DEV('getquotient.ai') },
      { name: 'Web Search', globe: true },
    ];
    var connEls = {};
    connectors.forEach(function (c) {
      var d = document.createElement('div');
      d.className = 'cws-conn';
      var ico;
      if (c.globe) ico = '<span class="cws-conn-ico" style="background:transparent">' + GLOBE_ICO + '</span>';
      else if (c.icon_url) ico = '<span class="cws-conn-ico" style="background:' + (c.color || '#393bf5') + '">' +
        String(c.name || '?').charAt(0) + '<img class="cws-conn-img" src="' + c.icon_url + '" onerror="this.remove()"/></span>';
      else ico = '<span class="cws-conn-ico" style="background:' + (c.color || '#57544c') + '">' + String(c.name || '?').charAt(0) + '</span>';
      d.innerHTML = ico + '<span>' + (c.name || '') + '</span>';
      connectorsEl.appendChild(d);
      connEls[String(c.name || '').toLowerCase()] = d;
    });
    var skillsEl = q('[data-target="skills"]');
    var skillsLabel = q('[data-target="skills-label"]');
    (Array.isArray(data.skills) ? data.skills : []).forEach(function (s) {
      skillsLabel.style.display = '';
      var d = document.createElement('div');
      d.className = 'cws-conn';
      d.innerHTML = '<span class="cws-conn-ico" style="background:#57544c">' + String(s).charAt(0).toUpperCase() + '</span><span>' + s + '</span>';
      skillsEl.appendChild(d);
    });

    // ── Transcript blocks ──
    function scrollDown() { transcript.scrollTop = transcript.scrollHeight; }
    function addBlock(node, animate) {
      transcript.appendChild(node);
      if (animate !== false) {
        gsap.set(node, { autoAlpha: 0, y: 8 });
        gsap.to(node, { autoAlpha: 1, y: 0, duration: 0.3, ease: 'power2.out' });
      }
      scrollDown();
      return node;
    }
    function md(text) {
      var h = String(text || '');
      h = h.replace(/`([^`]+)`/g, '<code>$1</code>');
      h = h.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
      return h;
    }
    function textEl(text, heading) {
      var d = document.createElement('div');
      d.className = heading ? 'cws-htext' : 'cws-text';
      d.innerHTML = md(text);
      return d;
    }
    function userEl(text) {
      var d = document.createElement('div'); d.className = 'cws-user'; d.textContent = String(text || ''); return d;
    }
    // Tool-call rows: pop in running (spinner + the matching rail chip
    // lights up), flip to done (green check + result) after `duration`.
    function connIconHtml(name, size) {
      var key = String(name || '').toLowerCase();
      var c = null;
      connectors.forEach(function (cc) { if (String(cc.name || '').toLowerCase() === key) c = cc; });
      if (c && c.globe) return '<span class="cws-tcall-ico" style="background:transparent">' + GLOBE_ICO + '</span>';
      if (c && c.icon_url) return '<span class="cws-tcall-ico" style="background:' + (c.color || '#393bf5') + '">' +
        String(c.name).charAt(0) + '<img class="cws-conn-img" src="' + c.icon_url + '" onerror="this.remove()"/></span>';
      return '<span class="cws-tcall-ico" style="background:#57544c">' + String(name || '?').charAt(0).toUpperCase() + '</span>';
    }
    function humanize(tool) {
      return String(tool || 'Tool').split(/[-_]/).map(function (w) {
        return w.charAt(0).toUpperCase() + w.slice(1);
      }).join(' ');
    }
    var CLOCK_ICO = '<svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="#8a887f" stroke-width="1.3" stroke-linecap="round"><circle cx="8" cy="8" r="6"/><path d="M8 4.5V8l2.2 1.4"/></svg>';
    var DONECHK_ICO = '<svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="#57544c" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="8" r="6"/><path d="M5.5 8l1.8 1.8L10.8 6.3"/></svg>';
    function toolGroupEl(a) {
      var d = document.createElement('div');
      d.className = 'cws-tgroup';
      var title = a.title || humanize(a.tool);
      var thinkHtml = '';
      if (a.thinking) {
        thinkHtml = '<div class="cws-tg-row"><span class="cws-tg-glyph">' + CLOCK_ICO + '</span>' +
          '<div class="cws-tg-think">' + String(a.thinking).replace(/`([^`]+)`/g, '<code>$1</code>') + '</div></div>';
      }
      d.innerHTML = '<div class="cws-tg-title">' + title + '</div>' +
        '<div class="cws-tg-body">' + thinkHtml +
          '<div class="cws-tg-row"><span class="cws-tg-glyph">' + connIconHtml(a.connector).replace('cws-tcall-ico', 'cws-tg-ico') + '</span>' +
            '<div class="cws-tg-toolname">' + title + '</div>' +
            '<div class="cws-tg-result"><span>Result</span></div></div>' +
          '<div class="cws-tg-row cws-tg-usingrow"><div class="cws-tg-using"><span class="cws-tg-spin"></span>Using ' + (a.connector || 'tools') + '…</div></div>' +
          '<div class="cws-tg-row"><span class="cws-tg-glyph">' + DONECHK_ICO + '</span>' +
            '<div class="cws-tg-done">' + (a.done_label || 'Done') + '</div></div>' +
        '</div>' +
        '<div class="cws-tg-collapsed">' + title + ' <span class="chev">›</span></div>';
      return d;
    }
    function setConnLive(name, live) {
      var d = connEls[String(name || '').toLowerCase()];
      if (!d) return;
      if (live) { d.classList.add('is-live'); gsap.from(d, { scale: 1.12, duration: 0.35, ease: 'back.out(2)' }); }
      else d.classList.remove('is-live');
    }

    // Working ✳ in the transcript ("✳ Working on it…" after a user message,
    // like the real app). Elements are created at BUILD (hidden) and
    // shown/hidden by timeline set()s -- state as a function of playhead
    // position, so the scrubber can never strand or duplicate the line.
    var lastWorking = null;
    function makeWorking(text) {
      var d = document.createElement('div');
      d.className = 'cws-working';
      d.innerHTML = '<span class="star">✳</span>' +
        '<span class="cws-working-verb">' + (text || 'Working on it…') + '</span>';
      transcript.appendChild(d);
      gsap.set(d, { display: 'none', autoAlpha: 0 });
      gsap.to(d.querySelector('.star'), { rotation: 360, duration: 2.6, repeat: -1, ease: 'none', transformOrigin: '50% 50%' });
      return d;
    }
    function scheduleWorking(tlRef, text, at) {
      var prev = lastWorking;
      var d = makeWorking(text);
      lastWorking = d;
      if (prev) tlRef.set(prev, { display: 'none', autoAlpha: 0 }, at);
      tlRef.set(d, { display: 'flex', autoAlpha: 1 }, at);
      tlRef.call(scrollDown, null, at);
      return d;
    }
    function scheduleStopWorking(tlRef, at) {
      var target = lastWorking;
      if (target) tlRef.set(target, { display: 'none', autoAlpha: 0 }, at);
    }
    function streamText(tlRef, text, at, secs, heading) {
      var d = textEl('', heading);
      var words = String(text || '').split(/(\s+)/);
      var full = md(text);
      scheduleStopWorking(tlRef, at);
      tlRef.call(function () { if (!d.isConnected) addBlock(d); }, null, at);
      var proxy = { n: 0 };
      tlRef.to(proxy, {
        n: words.length, duration: Math.max(0.6, secs || Math.min(3.2, words.length * 0.05)), ease: 'none',
        onUpdate: function () { d.innerHTML = md(words.slice(0, Math.ceil(proxy.n)).join('')); scrollDown(); },
        onComplete: function () { d.innerHTML = full; scrollDown(); },
      }, at + 0.05);
    }

    // ── Initial history ──
    (Array.isArray(data.history) ? data.history : []).forEach(function (h) {
      if (h.type === 'user') addBlock(userEl(h.text), false);
      else if (h.type === 'heading') addBlock(textEl(h.text, true), false);
      else addBlock(textEl(h.text), false);
    });

    // ── Entrance ──
    gsap.set(win, { autoAlpha: 0, y: 24 });
    tl.to(win, { autoAlpha: 1, y: 0, duration: 0.5, ease: 'power3.out' }, 0.15);
    var cards = Array.prototype.slice.call(el.querySelectorAll('.cws-card'));
    gsap.set(cards, { autoAlpha: 0, x: 18 });
    cards.forEach(function (c, i) {
      tl.to(c, { autoAlpha: 1, x: 0, duration: 0.45, ease: 'power3.out' }, 0.5 + i * 0.14);
    });
    var initBlocks = Array.prototype.slice.call(transcript.children);
    if (initBlocks.length) {
      gsap.set(initBlocks, { autoAlpha: 0, y: 8 });
      initBlocks.forEach(function (b, i) {
        tl.to(b, { autoAlpha: 1, y: 0, duration: 0.3, ease: 'power2.out' }, 0.45 + i * 0.1);
      });
    }

    var cursorTargets = data.cursor_targets || {
      'input': function () {
        var b = inputBox.getBoundingClientRect();
        var p = el.getBoundingClientRect();
        return { x: ((b.left + b.width / 2 - p.left) / p.width * 100) + '%',
                 y: ((b.top + b.height / 2 - p.top) / p.height * 100) + '%' };
      },
    };

    // ── Script ──
    if (data.script && data.script.length > 0) {
      runScript(tl, el, data.script, cursorTargets, ctx, {
        'type-message': function (tl, ctr, action, at) {
          tl.call(function () { inputBox.classList.add('is-active'); }, null, at);
          typeText(tl, inputEl, action.text || '', at, action.speed || 30);
        },
        // Scrub-safety rule for every block-adding handler below: the node is
        // created ONCE (at build, or memoized on first fire) and the call only
        // attaches it if it isn't already in the DOM. GSAP re-fires call()s
        // whenever the playhead crosses them -- Studio's scrubber was minting
        // a fresh tool-call card per pass and stacking duplicates.
        'send-message': function (tl, ctr, action, at) {
          var bubble = null;
          tl.call(function () {
            if (!bubble) {
              var txt = inputEl.textContent;
              if (!txt) return;
              bubble = userEl(txt);
            }
            if (!bubble.isConnected) addBlock(bubble);
            inputEl.textContent = '';
            inputBox.classList.remove('is-active');
          }, null, at);
        },
        'working': function (tl, ctr, action, at) {
          scheduleWorking(tl, action.text, at);
        },
        'stop-working': function (tl, ctr, action, at) { scheduleStopWorking(tl, at); },
        'respond': function (tl, ctr, action, at) {
          streamText(tl, action.text || '', at, action.duration, action.heading);
        },
        'claude-text': function (tl, ctr, action, at) {
          var node = textEl(action.text || '', action.heading);
          scheduleStopWorking(tl, at);
          tl.call(function () { if (!node.isConnected) addBlock(node); }, null, at);
        },
        'tool-call': function (tl, ctr, action, at) {
          var block = toolGroupEl(action);
          scheduleStopWorking(tl, at);
          tl.call(function () {
            if (!block.isConnected) addBlock(block);
            gsap.killTweensOf(block.querySelector('.cws-tg-spin'));
            gsap.to(block.querySelector('.cws-tg-spin'),
              { rotation: 360, duration: 1.4, repeat: -1, ease: 'none', transformOrigin: '50% 50%' });
            if (action.connector) setConnLive(action.connector, true);
          }, null, at);
          var doneAt = at + (action.duration || 1.8);
          tl.call(function () {
            gsap.killTweensOf(block.querySelector('.cws-tg-spin'));
            block.classList.add('is-done');
            gsap.from(block.querySelector('.cws-tg-done'), { autoAlpha: 0, y: 4, duration: 0.3, ease: 'power2.out' });
            if (action.connector && action.keep_live !== true) setConnLive(action.connector, false);
            scrollDown();
          }, null, doneAt);
          if (action.then_working) scheduleWorking(tl, null, doneAt + 0.05);
          // The real UI tucks finished tool work behind a one-liner with a
          // chevron ("List Social Posts ›") -- auto-collapse unless told not to.
          if (action.collapse !== false) {
            tl.call(function () {
              if (block.classList.contains('is-collapsed')) return;
              var h = block.offsetHeight;
              block.style.height = h + 'px';
              block.classList.add('is-collapsed');
              var target = block.querySelector('.cws-tg-collapsed');
              gsap.set(block, { height: h });
              gsap.to(block, { height: target.offsetHeight, duration: 0.45, ease: 'power2.inOut',
                onComplete: function () { block.style.height = ''; scrollDown(); } });
              gsap.from(target, { autoAlpha: 0, duration: 0.3, delay: 0.15 });
            }, null, doneAt + (action.collapse_delay || 1.0));
          }
        },
        'set-progress': function (tl, ctr, action, at) {
          tl.call(function () {
            if (action.total != null) progress.total = Number(action.total);
            if (action.current != null) progress.current = Number(action.current);
            if (Array.isArray(action.steps)) steps = action.steps.slice();
            renderProgress();
            gsap.from(progressCount, { scale: 1.35, duration: 0.35, ease: 'back.out(2)', transformOrigin: '100% 50%' });
          }, null, at);
        },
        'add-output': function (tl, ctr, action, at) {
          var node = null;
          tl.call(function () {
            if (node && node.isConnected) return;
            if (node) { outputsEl.appendChild(node); return; }
            node = addOutput(action);
          }, null, at);
        },
        'use-connector': function (tl, ctr, action, at) {
          tl.call(function () { setConnLive(action.name, true); }, null, at);
          if (action.duration !== 0) {
            tl.call(function () { setConnLive(action.name, false); }, null, at + (action.duration || 2.2));
          }
        },
      });
    }

    return tl;
  }
</script>
