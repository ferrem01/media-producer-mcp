</style>

<script>
  function createTimeline(el, data, ctx) {
    var tl = gsap.timeline();
    var q = function (s) { return el.querySelector(s); };
    var win = q('.cws-win');
    var track = q('[data-target="track"]');
    var viewport = q('[data-target="viewport"]');
    var inputBox = q('[data-target="inputbox"]');
    var inputEl = q('[data-target="input"]');
    var sendBtn = q('[data-target="send-btn"]');
    var stopBtn = q('[data-target="stop-btn"]');
    var dur = ctx.duration || 8;

    q('[data-target="title"]').textContent = data.title || 'Work flow test';
    q('[data-target="model-label"]').textContent = data.model_label || 'Opus 5';
    q('[data-target="effort-label"]').textContent = data.effort_label || 'High';
    if (data.account_name) q('[data-target="account-name"]').textContent = data.account_name;
    if (data.account_name) q('[data-target="account-avatar"]').textContent = String(data.account_name).charAt(0).toUpperCase();

    // ── Sidebar lists (same defaults as cowork-home) ──
    var ARTIFACT_ICO = '<svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="2.5" width="12" height="11" rx="2.5"/><path d="M5.5 8.6l1.8 1.8 3.4-3.8"/></svg>';
    var TASK_ICO = '<svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"><path d="M3 4.5h2M7 4.5h6M3 8h2M7 8h6M3 11.5h2M7 11.5h6"/></svg>';
    var pinned = Array.isArray(data.pinned) && data.pinned.length ? data.pinned : [
      'Quotient Weekly Burn', 'Steve Goldberg Tracker', 'Quotient Usecase Picker',
      'Quotient Time Savings Calculator', 'Quotient Process', 'Gtm Credits Onepager',
    ];
    var recents = Array.isArray(data.recents) && data.recents.length ? data.recents : [
      { title: data.title || 'Work flow test' }, { title: 'Canva launch image' },
    ];
    var activeRecent = data.active_recent != null ? Number(data.active_recent) : 0;
    var pinList = q('[data-target="pin-list"]');
    var recentList = q('[data-target="recent-list"]');
    function sideRow(item, ico, active) {
      var title = item && item.title ? item.title : String(item);
      var d = document.createElement('div');
      d.className = 'cws-sessrow' + (active ? ' is-active' : '');
      d.innerHTML = '<span class="cws-sessrow-ico">' + ico + '</span>' +
        '<span class="cws-sessrow-title">' + title + '</span>';
      return d;
    }
    pinned.forEach(function (t) { pinList.appendChild(sideRow(t, ARTIFACT_ICO, false)); });
    recents.forEach(function (t, i) { recentList.appendChild(sideRow(t, TASK_ICO, i === activeRecent)); });

    // ── Rail: progress / outputs / connectors ──
    var progress = data.progress || null;
    var progressCount = q('[data-target="progress-count"]');
    function renderProgress() {
      progressCount.textContent = progress && progress.total ? (progress.current || 0) + ' of ' + progress.total : '';
    }
    renderProgress();
    var outputsEl = q('[data-target="outputs"]');
    var DOC_ICO = '<svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="#57544c" stroke-width="1.3" stroke-linecap="round"><path d="M4 1.5h5.5L13 5v9.5a1 1 0 01-1 1H4a1 1 0 01-1-1v-12a1 1 0 011-1z"/><path d="M5.5 8h5M5.5 10.5h5"/></svg>';
    function addOutput(o, animate) {
      var d = document.createElement('div');
      d.className = 'cws-output';
      d.innerHTML = '<span>' + DOC_ICO + '</span><span>' + (o.name || String(o)) + '</span>';
      outputsEl.appendChild(d);
      if (animate !== false) gsap.from(d, { autoAlpha: 0, x: 14, duration: 0.35, ease: 'power2.out' });
      return d;
    }
    (Array.isArray(data.outputs) ? data.outputs : []).forEach(function (o) { addOutput(o, false); });

    // Connectors: chips join the Context card when first used (like the app),
    // unless connectors[].present === true (already in the rail at open).
    var LOGO_DEV = function (domain) {
      return 'https://img.logo.dev/' + domain + '?token=pk_B_cdrQLyTkSFPzSMm52goQ&format=png&size=64&fallback=monogram';
    };
    var GLOBE_ICO = '<svg width="12" height="12" viewBox="0 0 16 16" fill="none" stroke="#57544c" stroke-width="1.2" stroke-linecap="round"><circle cx="8" cy="8" r="6"/><path d="M2 8h12M8 2c1.8 1.7 2.7 3.7 2.7 6S9.8 12.3 8 14c-1.8-1.7-2.7-3.7-2.7-6S6.2 3.7 8 2z"/></svg>';
    var connectorsEl = q('[data-target="connectors"]');
    var connLabel = q('[data-target="conn-label"]');
    var ctxPlaceholder = q('[data-target="ctx-placeholder"]');
    var connectors = Array.isArray(data.connectors) ? data.connectors : [];
    var connEls = {};
    function connDef(name) {
      var key = String(name || '').toLowerCase();
      for (var i = 0; i < connectors.length; i++) {
        if (String(connectors[i].name || '').toLowerCase() === key) return connectors[i];
      }
      return null;
    }
    function connChipEl(c) {
      var d = document.createElement('div');
      d.className = 'cws-conn';
      var ico;
      if (c.globe) ico = '<span class="cws-conn-ico" style="background:transparent">' + GLOBE_ICO + '</span>';
      else if (c.icon_url) ico = '<span class="cws-conn-ico" style="background:' + (c.color || '#393bf5') + '">' +
        String(c.name || '?').charAt(0) + '<img class="cws-conn-img" src="' + c.icon_url + '" onerror="this.remove()"/></span>';
      else ico = '<span class="cws-conn-ico" style="background:' + (c.color || '#57544c') + '">' + String(c.name || '?').charAt(0) + '</span>';
      d.innerHTML = ico + '<span>' + (c.name || '') + '</span>';
      return d;
    }
    function ensureChip(name) {
      var key = String(name || '').toLowerCase();
      if (connEls[key]) return connEls[key];
      var c = connDef(name) || { name: name };
      var d = connChipEl(c);
      gsap.set(d, { display: 'none' });
      connectorsEl.appendChild(d);
      connEls[key] = d;
      return d;
    }
    // Chips scheduled at build, shown by timeline sets (scrub-safe).
    var railRevealed = false;
    function scheduleChipJoin(tlRef, name, at) {
      var d = ensureChip(name);
      if (!railRevealed) {
        railRevealed = true;
        tlRef.set(ctxPlaceholder, { display: 'none' }, at);
        tlRef.set(connLabel, { display: 'block' }, at);
      }
      tlRef.set(d, { display: 'inline-flex' }, at);
      tlRef.fromTo(d, { scale: 0.7, autoAlpha: 0 }, { scale: 1, autoAlpha: 1, duration: 0.35, ease: 'back.out(2)', immediateRender: false }, at);
    }
    function setConnLive(name, live) {
      var d = connEls[String(name || '').toLowerCase()];
      if (!d) return;
      d.classList.toggle('is-live', !!live);
    }
    // present:true chips are in the rail from frame one.
    connectors.forEach(function (c) {
      if (c.present) {
        var d = ensureChip(c.name);
        gsap.set(d, { display: 'inline-flex' });
        gsap.set(ctxPlaceholder, { display: 'none' });
        gsap.set(connLabel, { display: 'block' });
        railRevealed = true;
      }
    });

    // ── Markdown-lite for prose ──
    function md(text) {
      var h = String(text || '');
      h = h.replace(/`([^`]+)`/g, '<code>$1</code>');
      h = h.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
      h = h.replace(/__([^_]+)__/g, '<u>$1</u>');
      // Mid-stream a pair can be split across the slice point -- strip any
      // unmatched leftover markers so "**" never renders literally.
      h = h.replace(/\*\*/g, '').replace(/__/g, '').replace(/`/g, '');
      return h;
    }

    // ── Block builders (each returns a .cws-block element) ──
    function blockWrap(inner) {
      var d = document.createElement('div');
      d.className = 'cws-block';
      if (inner) d.appendChild(inner);
      return d;
    }
    function userBlock(text) {
      var w = document.createElement('div');
      w.className = 'cws-block cws-user-wrap';
      w.innerHTML = '<div class="cws-user"></div>' +
        '<span class="cws-user-copy"><svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3"><rect x="5" y="5" width="8" height="8" rx="1.5"/><path d="M3 10.5V4a1 1 0 011-1h6.5"/></svg></span>';
      w.querySelector('.cws-user').textContent = String(text || '');
      return w;
    }
    function textBlock(text, heading) {
      var d = document.createElement('div');
      d.className = 'cws-block ' + (heading ? 'cws-htext' : 'cws-text');
      d.innerHTML = md(text);
      return d;
    }
    function actionsBlock() {
      var d = document.createElement('div');
      d.className = 'cws-block cws-actions';
      d.innerHTML =
        '<svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3"><rect x="5" y="5" width="8" height="8" rx="1.5"/><path d="M3 10.5V4a1 1 0 011-1h6.5"/></svg>' +
        '<svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6v4h2.5L9 13V3L5.5 6H3z"/><path d="M11 6a3 3 0 010 4"/></svg>' +
        '<svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 7.5v6M2 8.5v4a1 1 0 001 1h7.6a1.4 1.4 0 001.4-1.2l.8-4a1.4 1.4 0 00-1.4-1.6H8.6l.6-3a1.5 1.5 0 00-2.7-1.1L4.5 7.5H2z"/></svg>' +
        '<svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" transform="rotate(180)"><path d="M4.5 7.5v6M2 8.5v4a1 1 0 001 1h7.6a1.4 1.4 0 001.4-1.2l.8-4a1.4 1.4 0 00-1.4-1.6H8.6l.6-3a1.5 1.5 0 00-2.7-1.1L4.5 7.5H2z"/></svg>';
      return d;
    }
    function idleStarBlock() {
      var d = document.createElement('div');
      d.className = 'cws-block cws-idlestar';
      d.textContent = '✳';
      return d;
    }
    function statusBlock(text) {
      var d = document.createElement('div');
      d.className = 'cws-block cws-status';
      d.innerHTML = '<span class="star">✳</span>' +
        '<span class="cws-status-verb"></span><span class="cws-status-secs"></span>';
      d.querySelector('.cws-status-verb').textContent = String(text || 'Working on it…');
      gsap.to(d.querySelector('.star'), { rotation: 360, duration: 3.2, repeat: -1, ease: 'none', transformOrigin: '50% 50%' });
      return d;
    }
    var FOUND_ICO = '<svg width="15" height="15" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"><circle cx="6" cy="6" r="4.5"/><path d="M9.5 9.5l3 3"/></svg>';
    function toolConnIco(name) {
      var c = connDef(name);
      if (c && c.globe) return GLOBE_ICO;
      if (c && c.icon_url) return '<span class="cws-conn-ico" style="background:' + (c.color || '#393bf5') + ';width:16px;height:16px">' +
        String(c.name || '?').charAt(0) + '<img class="cws-conn-img" src="' + c.icon_url + '" onerror="this.remove()"/></span>';
      return GLOBE_ICO;
    }
    // Tool-use block: summary line stays; the detail (found tools -> query row
    // -> optional results panel) collapses away when done, like the app.
    function toolBlock(a) {
      var d = document.createElement('div');
      d.className = 'cws-block';
      var summary = document.createElement('div');
      summary.className = 'cws-tsum';
      summary.textContent = a.summary || ('Loaded tools, used ' + (a.connector || 'tools'));
      var caret = document.createElement('span');
      caret.className = 'cws-tsum-caret';
      caret.textContent = '›';
      summary.appendChild(caret);
      d.appendChild(summary);
      var detail = document.createElement('div');
      detail.className = 'cws-tdetail';
      var html = '<div class="cws-trow"><span class="cws-trow-ico">' + FOUND_ICO + '</span>Found tools</div>';
      if (a.detail) html += '<div class="cws-trow" style="margin-left:29px;color:#6b6861;font-size:14.5px">' + a.detail + '</div>';
      html += '<div class="cws-tstem"></div>';
      if (a.query) {
        html += '<div class="cws-trow"><span class="cws-trow-ico">' + toolConnIco(a.connector) + '</span>' +
          '<span>' + a.query + '</span>' +
          (a.results_count ? '<span class="cws-trow-count">' + a.results_count + '</span>' : '') + '</div>';
      }
      if (Array.isArray(a.results) && a.results.length) {
        html += '<div class="cws-tresults">' + a.results.map(function (r) {
          var fav = (r.domain || '?').charAt(0).toUpperCase();
          return '<div class="cws-tres-row"><span class="cws-tres-fav">' + fav + '</span>' +
            '<span class="cws-tres-title">' + (r.title || '') + '</span>' +
            '<span class="cws-tres-domain">' + (r.domain || '') + '</span></div>';
        }).join('') + '</div>';
      }
      detail.innerHTML = html;
      d.appendChild(detail);
      return { el: d, detail: detail, caret: caret };
    }

    // ── History: final-state blocks, visible from frame one ──
    var history = Array.isArray(data.history) ? data.history : [];
    history.forEach(function (h) {
      var t = h.type || 'text';
      if (t === 'user') track.appendChild(userBlock(h.text));
      else if (t === 'heading') track.appendChild(textBlock(h.text, true));
      else if (t === 'tool-summary') {
        var s = document.createElement('div');
        s.className = 'cws-block cws-tsum';
        s.textContent = h.text || 'Loaded tools';
        var hc = document.createElement('span');
        hc.className = 'cws-tsum-caret';
        hc.textContent = '›';
        hc.style.display = 'inline';
        s.appendChild(hc);
        track.appendChild(s);
      }
      else if (t === 'actions') track.appendChild(actionsBlock());
      else if (t === 'idle-star') track.appendChild(idleStarBlock());
      else track.appendChild(textBlock(h.text, false));
    });

    // ── Script compiler: build every scripted node NOW, measure, then drive
    //    reveals + the scroll entirely with timeline sets/tweens. ──
    var script = Array.isArray(data.script) ? data.script.slice() : [];
    script.sort(function (a, b) { return (a.at || 0) - (b.at || 0); });

    var events = [];   // {t, node, kind:'show'|'stream'|'collapse'|'hide', extra}
    var pending = [];  // nodes to hide (display:none) after measuring
    var activeStatus = null; // {node, t} awaiting replacement
    function addNode(node) { track.appendChild(node); pending.push(node); return node; }
    function closeStatus(t) {
      if (!activeStatus) return null;
      var s = activeStatus; activeStatus = null;
      events.push({ t: t, node: s.node, kind: 'hide' });
      return s;
    }

    var workOn = [];   // [start, end] windows -> stop button visible
    var typingAt = null;

    script.forEach(function (a) {
      var at = a.at || 0;
      var act = a.action;
      if (act === 'type-message') {
        typingAt = at;
        events.push({ t: at, kind: 'send-show' });
        tl.call(function () { inputBox.classList.add('is-active'); }, null, at);
        typeText(tl, inputEl, a.text || '', at, a.speed || 30);
      } else if (act === 'send-message') {
        var bubble = addNode(userBlock(a.text || inputEl.textContent || ''));
        // The bubble's text is known at build only if passed; fall back to the
        // typed text captured at fire time.
        if (!a.text) {
          var bEl = bubble.querySelector('.cws-user');
          tl.call(function () { if (inputEl.textContent) bEl.textContent = inputEl.textContent; inputEl.textContent = ''; inputBox.classList.remove('is-active'); }, null, at);
        } else {
          tl.call(function () { inputEl.textContent = ''; inputBox.classList.remove('is-active'); }, null, at);
        }
        events.push({ t: at, node: bubble, kind: 'show' });
        events.push({ t: at, kind: 'send-hide' });
      } else if (act === 'working' || act === 'status') {
        closeStatus(at);
        var s = addNode(statusBlock(a.text));
        activeStatus = { node: s, t: at };
        events.push({ t: at, node: s, kind: 'show' });
        if (a.counter !== false) {
          var secsEl = s.querySelector('.cws-status-secs');
          var proxy = { n: 0 };
          var cdur = a.duration || Math.max(1, dur - at - 0.3);
          tl.to(proxy, { n: cdur, duration: cdur, ease: 'none',
            onUpdate: function () { var v = Math.floor(proxy.n); secsEl.textContent = v >= 1 ? v + 's' : ''; } }, at);
        }
        workOn.push([at, null]);
      } else if (act === 'stop-working') {
        closeStatus(at);
        events.push({ t: at, kind: 'work-end' });
      } else if (act === 'respond' || act === 'claude-text') {
        closeStatus(at);
        var sdur = act === 'respond' ? (a.duration || Math.min(3.2, String(a.text || '').split(/\s+/).length * 0.05)) : 0;
        var nodes = [];
        if (a.heading) nodes.push(addNode(textBlock(a.heading === true ? a.text : a.heading, true)));
        var body = (a.heading === true) ? null : addNode(textBlock(a.text, false));
        if (body) nodes.push(body);
        nodes.forEach(function (n) { events.push({ t: at, node: n, kind: 'show' }); });
        if (act === 'respond' && body) {
          // Stream words into a block whose FINAL height is reserved, while the
          // scroll creeps linearly -- measured once, scrub-correct.
          var words = String(a.text || '').split(/(\s+)/);
          var full = md(a.text);
          var proxy2 = { n: 0 };
          tl.to(proxy2, { n: words.length, duration: Math.max(0.6, sdur), ease: 'none',
            onUpdate: function () { body.innerHTML = md(words.slice(0, Math.ceil(proxy2.n)).join('')); },
            onComplete: function () { body.innerHTML = full; } }, at + 0.03);
          events.push({ t: at, kind: 'stream', node: body, dur: Math.max(0.6, sdur) });
          workOn.push([at, at + Math.max(0.6, sdur)]);
        }
        if (a.then_actions !== false && act === 'respond') {
          var ar = addNode(actionsBlock());
          events.push({ t: at + Math.max(0.6, sdur) + 0.25, node: ar, kind: 'show' });
        }
      } else if (act === 'tool-use' || act === 'tool-call') {
        closeStatus(at);
        var ta = act === 'tool-call' ? {
          summary: a.label ? ('Loaded tools, ' + a.label.charAt(0).toLowerCase() + a.label.slice(1)) : ('Loaded tools, used ' + (a.connector || 'tools')),
          connector: a.connector, query: a.result || a.tool, detail: a.detail,
        } : a;
        var tb = toolBlock(ta);
        addNode(tb.el);
        events.push({ t: at, node: tb.el, kind: 'show' });
        var tdur = a.duration || 1.6;
        var collapseAt = a.collapse === false ? null : (at + tdur + (a.collapse_delay || 0.9));
        if (collapseAt != null && collapseAt < dur - 0.2) {
          events.push({ t: collapseAt, node: tb.detail, kind: 'collapse', parent: tb.el, caret: tb.caret });
        }
        if (a.connector) {
          scheduleChipJoin(tl, a.connector, at);
          tl.call(function () { setConnLive(a.connector, true); }, null, at);
          tl.call(function () { setConnLive(a.connector, false); }, null, at + tdur);
        }
        workOn.push([at, at + tdur]);
      } else if (act === 'idle-star') {
        var st = addNode(idleStarBlock());
        events.push({ t: at, node: st, kind: 'show' });
        events.push({ t: at, kind: 'work-end' });
      } else if (act === 'actions-row') {
        var arr = addNode(actionsBlock());
        events.push({ t: at, node: arr, kind: 'show' });
      } else if (act === 'join-connector') {
        scheduleChipJoin(tl, a.name, at);
      } else if (act === 'set-progress') {
        tl.call(function () {
          if (!progress) progress = {};
          if (a.total != null) progress.total = Number(a.total);
          if (a.current != null) progress.current = Number(a.current);
          renderProgress();
          gsap.from(progressCount, { scale: 1.35, duration: 0.35, ease: 'back.out(2)', transformOrigin: '100% 50%' });
        }, null, at);
      } else if (act === 'add-output') {
        var node = null;
        tl.call(function () {
          if (node && node.isConnected) return;
          if (node) { outputsEl.appendChild(node); return; }
          node = addOutput(a);
        }, null, at);
      } else if (act === 'use-connector') {
        scheduleChipJoin(tl, a.name, at);
        tl.call(function () { setConnLive(a.name, true); }, null, at);
        if (a.duration !== 0) tl.call(function () { setConnLive(a.name, false); }, null, at + (a.duration || 2.2));
      }
    });
    // A status still open at the end of the script keeps running to the cut.

    // ── Measure everything, then hide the future ──
    // All nodes are in the DOM (visible) right now; measure block heights
    // including their margins, then display:none the scripted ones.
    var BLOCK_GAP = 0; // margins are part of offsetHeight? No -- measure via rects.
    function outerH(n) {
      var r = n.getBoundingClientRect();
      var cs = getComputedStyle(n);
      return r.height + (parseFloat(cs.marginTop) || 0) + (parseFloat(cs.marginBottom) || 0);
    }
    var viewH = viewport.getBoundingClientRect().height || 400;
    var PAD = 16;
    var heights = new Map();
    var collapseDelta = new Map();
    events.forEach(function (e) {
      if (e.kind === 'show' && e.node && !heights.has(e.node)) heights.set(e.node, outerH(e.node));
      if (e.kind === 'collapse' && e.node && !collapseDelta.has(e.node)) collapseDelta.set(e.node, outerH(e.node));
    });
    var historyH = 0;
    Array.prototype.slice.call(track.children).forEach(function (c) {
      if (pending.indexOf(c) === -1) historyH += outerH(c);
    });
    var trackPad = 36; // track's own top+bottom padding
    pending.forEach(function (n) { gsap.set(n, { display: 'none' }); });

    function scrollFor(contentH) {
      return Math.max(0, contentH + trackPad - viewH + PAD);
    }
    var contentH = historyH;
    // Open pre-scrolled to the bottom of history (continuity between scenes).
    if (data.start_scrolled !== false) gsap.set(track, { y: -scrollFor(contentH) });

    // Chronological scroll + reveal choreography.
    events.sort(function (a, b) { return a.t - b.t; });
    events.forEach(function (e) {
      if (e.kind === 'show') {
        contentH += heights.get(e.node) || 0;
        tl.set(e.node, { display: 'block' }, e.t);
        tl.fromTo(e.node, { autoAlpha: 0, y: 10 }, { autoAlpha: 1, y: 0, duration: 0.35, ease: 'power2.out', immediateRender: false }, e.t);
        tl.to(track, { y: -scrollFor(contentH), duration: 0.55, ease: 'power2.out' }, e.t);
      } else if (e.kind === 'hide') {
        contentH -= heights.get(e.node) || 0;
        tl.set(e.node, { display: 'none' }, e.t);
        tl.to(track, { y: -scrollFor(contentH), duration: 0.4, ease: 'power2.out' }, e.t);
      } else if (e.kind === 'collapse') {
        var dh = collapseDelta.get(e.node) || 0;
        contentH -= dh;
        tl.to(e.node, { height: 0, autoAlpha: 0, marginTop: 0, duration: 0.45, ease: 'power2.inOut' }, e.t);
        tl.to(track, { y: -scrollFor(contentH), duration: 0.45, ease: 'power2.inOut' }, e.t);
        // The collapsed line grows its "you could reopen this" caret.
        if (e.caret) tl.set(e.caret, { display: 'inline' }, e.t + 0.3);
      } else if (e.kind === 'stream') {
        // The block was revealed at full (reserved) height; creep the scroll
        // linearly across the stream so the text writes at the reading line.
        tl.to(track, { y: -scrollFor(contentH), duration: e.dur, ease: 'none' }, e.t);
      } else if (e.kind === 'send-show') {
        tl.fromTo(sendBtn, { autoAlpha: 0, scale: 0.6 },
          { autoAlpha: 1, scale: 1, duration: 0.3, ease: 'back.out(2.5)' }, e.t);
      } else if (e.kind === 'send-hide') {
        tl.set(sendBtn, { autoAlpha: 0 }, e.t);
      }
    });

    // Stop button: visible across the union of work windows. Continuity rule:
    // when the scene's work begins almost immediately (a mid-session cut with
    // the agent still going), the stop button is on from frame one -- the
    // previous scene ended with it showing, and a 0.15s flicker at the cut
    // reads as a glitch.
    if (workOn.length) {
      var wStart = workOn[0][0];
      if (wStart <= 0.6) wStart = 0;
      var wEnd = 0;
      workOn.forEach(function (w) { wEnd = Math.max(wEnd, w[1] == null ? dur : w[1]); });
      if (wStart === 0) gsap.set(stopBtn, { display: 'flex' });
      else tl.set(stopBtn, { display: 'flex' }, wStart);
      if (wEnd < dur - 0.15) tl.set(stopBtn, { display: 'none' }, wEnd);
    }

    // ── Entrance: settled by default for match-cut continuity; pass
    //    data.entrance='rise' for the classic window rise. ──
    if (data.entrance === 'rise') {
      gsap.set(win, { autoAlpha: 0, y: 24 });
      tl.to(win, { autoAlpha: 1, y: 0, duration: 0.5, ease: 'power3.out' }, 0.1);
    }

    var cursorTargets = data.cursor_targets || {
      'input': function () {
        var b = inputBox.getBoundingClientRect();
        var p = el.getBoundingClientRect();
        return { x: ((b.left + b.width / 2 - p.left) / p.width * 100) + '%',
                 y: ((b.top + b.height / 2 - p.top) / p.height * 100) + '%' };
      },
    };
    if (data.script && data.script.length > 0) {
      runScript(tl, el, [], cursorTargets, ctx);
    }

    return tl;
  }
</script>
