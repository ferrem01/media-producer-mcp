  .page-count { font-size: 12px; color: #666; }
</style>

<script>
  function createTimeline(el, data, ctx) {
    var tl = gsap.timeline();
    var editor = el.querySelector('.canva-editor');
    var sidebarItems = el.querySelector('.sidebar-items');
    var canvasContent = el.querySelector('.canvas-content');
    var planLabel = el.querySelector('[data-target="plan-label"]');
    var userAvatar = el.querySelector('[data-target="user-avatar"]');
    var zoomLabel = el.querySelector('[data-target="zoom-label"]');
    var pageCount = el.querySelector('[data-target="page-count"]');

    // ── Data ──
    var plan = data.plan_name || 'Canva Hero';
    var avatarInitials = data.avatar_initials || 'MF';
    var avatarColor = data.avatar_color || '#8B3DFF';
    var zoom = data.zoom || '88%';
    var pages = data.pages || '1 / 1';
    var designTitle = data.design_title || 'Quotient Agent for Canva';
    var designOverline = data.design_overline || 'INTRODUCING';
    var designBg = data.design_bg || '#0f172a';
    var showPlay = data.show_play !== false;
    var logoName = data.logo_name || 'Quotient';
    var logoIcon = data.logo_icon || 'Q';
    var logoColor = data.logo_color || 'linear-gradient(135deg, #6366f1, #8b5cf6)';
    var partnerLogos = data.partner_logos || [
      { text: 'Canva', color: '#00C4CC', textColor: '#fff' },
      { text: 'Q\u2022', color: 'linear-gradient(135deg, #6366f1, #8b5cf6)', textColor: '#fff' }
    ];
    var activeSidebarItem = data.active_sidebar || null;

    // ── Setup toolbar ──
    planLabel.textContent = plan;
    userAvatar.textContent = avatarInitials;
    userAvatar.style.background = avatarColor;
    zoomLabel.textContent = zoom;
    pageCount.textContent = pages;

    // ── Sidebar icons ──
    var sbDef = [
      { id: 'canva-ai', label: 'Canva AI', cls: 'sb-item-canva',
        icon: '<svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="10" stroke="#00C4CC" stroke-width="1.5"/><path d="M8 14c1-3 3-5 5-5s3 2 3 3-1 2-2 2-2-1-2-2" stroke="#00C4CC" stroke-width="1.5" stroke-linecap="round"/></svg>' },
      { id: 'templates', label: 'Templates',
        icon: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><rect x="3" y="3" width="8" height="8" rx="1.5"/><rect x="13" y="3" width="8" height="8" rx="1.5"/><rect x="3" y="13" width="8" height="8" rx="1.5"/><rect x="13" y="13" width="8" height="8" rx="1.5"/></svg>' },
      { id: 'elements', label: 'Elements',
        icon: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><circle cx="8" cy="8" r="4"/><rect x="13" y="4" width="8" height="8" rx="1"/><path d="M8 16l4 6 4-6z"/></svg>' },
      { id: 'text', label: 'Text',
        icon: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M6 4h12M12 4v16M8 20h8"/></svg>' },
      { id: 'brand', label: 'Brand',
        icon: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2l2.5 5 5.5.8-4 3.9.9 5.3-4.9-2.6L7.1 17l.9-5.3-4-3.9 5.5-.8z"/></svg>' },
      { id: 'uploads', label: 'Uploads',
        icon: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M4 16v2a2 2 0 002 2h12a2 2 0 002-2v-2"/><path d="M12 14V4M8 8l4-4 4 4"/></svg>' },
      { id: 'tools', label: 'Tools',
        icon: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M3 21l8-8M14.5 5.5a4.95 4.95 0 014 4l-3 1 1 3a4.95 4.95 0 01-4-4l3-1-1-3z"/></svg>' },
      { id: 'projects', label: 'Projects',
        icon: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7V5a2 2 0 012-2h4l2 2h8a2 2 0 012 2v10a2 2 0 01-2 2H5a2 2 0 01-2-2V7z"/></svg>' },
      { id: 'apps', label: 'Apps',
        icon: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/><line x1="17.5" y1="14" x2="17.5" y2="21"/><line x1="14" y1="17.5" x2="21" y2="17.5"/></svg>' }
    ];

    sbDef.forEach(function(item) {
      var el = document.createElement('div');
      el.className = 'sb-item' + (item.cls ? ' ' + item.cls : '') + (activeSidebarItem === item.id ? ' active' : '');
      el.setAttribute('data-target', 'sb-' + item.id);
      var icon = document.createElement('div');
      icon.className = 'sb-icon';
      icon.innerHTML = item.icon;
      el.appendChild(icon);
      var label = document.createElement('span');
      label.className = 'sb-label';
      label.textContent = item.label;
      el.appendChild(label);
      sidebarItems.appendChild(el);
    });

    // ── Canvas content ──
    var frame = el.querySelector('.canvas-frame');
    frame.style.background = designBg;

    // Logo
    var logoDiv = document.createElement('div');
    logoDiv.className = 'design-logo';
    var logoIconDiv = document.createElement('div');
    logoIconDiv.className = 'design-logo-icon';
    logoIconDiv.style.background = logoColor;
    logoIconDiv.textContent = logoIcon;
    logoDiv.appendChild(logoIconDiv);
    var logoText = document.createElement('span');
    logoText.textContent = logoName;
    logoDiv.appendChild(logoText);
    canvasContent.appendChild(logoDiv);

    // Overline
    if (designOverline) {
      var overline = document.createElement('div');
      overline.className = 'design-overline';
      overline.textContent = designOverline;
      canvasContent.appendChild(overline);
    }

    // Title
    var title = document.createElement('div');
    title.className = 'design-title';
    title.textContent = designTitle;
    canvasContent.appendChild(title);

    // Play button
    if (showPlay) {
      var play = document.createElement('div');
      play.className = 'design-play';
      play.innerHTML = '<svg width="28" height="28" viewBox="0 0 28 28" fill="rgba(255,255,255,0.8)"><path d="M8 4l18 10L8 24z"/></svg>';
      canvasContent.appendChild(play);
    }

    // Partner logos
    if (partnerLogos && partnerLogos.length > 0) {
      var logosRow = document.createElement('div');
      logosRow.className = 'design-logos';
      partnerLogos.forEach(function(pl, idx) {
        if (idx > 0) {
          var plus = document.createElement('span');
          plus.className = 'design-plus';
          plus.textContent = '+';
          logosRow.appendChild(plus);
        }
        var plogo = document.createElement('div');
        plogo.className = 'design-partner-logo';
        plogo.style.background = pl.color;
        plogo.style.color = pl.textColor || '#fff';
        plogo.textContent = pl.text;
        logosRow.appendChild(plogo);
      });
      canvasContent.appendChild(logosRow);
    }

    // Wave decoration
    var wave = document.createElement('div');
    wave.className = 'design-wave';
    canvasContent.appendChild(wave);

    // ── Animation ──
    gsap.set(editor, { autoAlpha: 0 });
    tl.to(editor, { autoAlpha: 1, duration: 0.5, ease: 'power2.out' }, 0.2);

    if (ctx.duration > 2) {
      tl.to(editor, { autoAlpha: 0, duration: 0.4, ease: 'power2.in' }, ctx.duration - 0.5);
    }

    // ── Script ──
    if (data.script && data.script.length > 0) {
      var cursorTargets = data.cursor_targets || {
        'canvas-center': { x: '55%', y: '50%' },
        'share-btn': { x: '95%', y: '3%' },
        'sidebar-templates': { x: '3%', y: '20%' },
        'sidebar-elements': { x: '3%', y: '28%' },
        'sidebar-text': { x: '3%', y: '36%' },
        'sidebar-apps': { x: '3%', y: '80%' }
      };

      runScript(tl, el, data.script, cursorTargets, ctx, {
        'hover-sidebar': function(tl, ctr, action, at) {
          var target = action.target || '';
          var item = ctr.querySelector('[data-target="sb-' + target + '"]');
          var all = ctr.querySelectorAll('.sb-item.hovered');
          tl.call(function() {
            for (var i = 0; i < all.length; i++) all[i].classList.remove('hovered');
            if (item) item.classList.add('hovered');
          }, null, at);
        },
        'click-sidebar': function(tl, ctr, action, at) {
          var target = action.target || '';
          var item = ctr.querySelector('[data-target="sb-' + target + '"]');
          var all = ctr.querySelectorAll('.sb-item.active, .sb-item.hovered');
          tl.call(function() {
            for (var i = 0; i < all.length; i++) { all[i].classList.remove('active'); all[i].classList.remove('hovered'); }
            if (item) item.classList.add('active');
          }, null, at);
        },
        'show-panel': function(tl, ctr, action, at) {
          var panel = ctr.querySelector('.side-panel');
          var panelContent = ctr.querySelector('[data-target="panel-content"]');
          var panelType = action.panel || 'text';
          tl.call(function() {
            // Clear previous content
            panelContent.innerHTML = '';
            if (panelType === 'text') {
              // Search bar
              var search = document.createElement('div');
              search.className = 'sp-search';
              search.innerHTML = '<svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><circle cx="8" cy="8" r="5.5"/><path d="M12.5 12.5L16 16"/></svg><span>Search fonts and combinations</span>';
              panelContent.appendChild(search);
              // Add a text box button
              var addBtn = document.createElement('button');
              addBtn.className = 'sp-add-text-btn';
              addBtn.innerHTML = '<svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round"><path d="M5 4h8M9 4v10M6.5 14h5"/></svg>Add a text box';
              panelContent.appendChild(addBtn);
              // Magic Write button
              var magicBtn = document.createElement('button');
              magicBtn.className = 'sp-magic-write-btn';
              magicBtn.innerHTML = '<svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="#fff" stroke-width="1.4" stroke-linecap="round"><path d="M3 15l1.5-5L13 1.5 16.5 5 8 13.5z"/><path d="M11 4l3 3"/></svg>Magic Write';
              panelContent.appendChild(magicBtn);
              // Brand Kit row
              var brandRow = document.createElement('div');
              brandRow.className = 'sp-brand-row';
              brandRow.innerHTML = '<span class="sp-brand-left"><svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="#1a1a1a" stroke-width="1.3" stroke-linecap="round"><rect x="2" y="2" width="6" height="6" rx="1"/><rect x="10" y="2" width="6" height="6" rx="1"/><rect x="2" y="10" width="6" height="6" rx="1"/><rect x="10" y="10" width="6" height="6" rx="1"/></svg>Brand Kit</span><span class="sp-brand-edit">Edit</span>';
              panelContent.appendChild(brandRow);
              // Text presets
              var presets = [
                { cls: 'sp-preset-heading', text: 'Heading' },
                { cls: 'sp-preset-subheading', text: 'Subheading' },
                { cls: 'sp-preset-body', text: 'Body' }
              ];
              presets.forEach(function(p) {
                var box = document.createElement('div');
                box.className = 'sp-text-preset';
                var label = document.createElement('span');
                label.className = p.cls;
                label.textContent = p.text;
                box.appendChild(label);
                panelContent.appendChild(box);
              });
              // Dynamic text section
              var dynTitle = document.createElement('div');
              dynTitle.className = 'sp-section-title';
              dynTitle.textContent = 'Dynamic text';
              panelContent.appendChild(dynTitle);
              // Page numbers
              var pageNums = document.createElement('div');
              pageNums.className = 'sp-page-numbers';
              pageNums.innerHTML = '<div class="sp-page-thumb"><span>1</span><span style="font-size:10px;margin-left:1px">2</span></div><span class="sp-page-label">Page numbers</span>';
              panelContent.appendChild(pageNums);
              // Apps section
              var appsHeader = document.createElement('div');
              appsHeader.className = 'sp-apps-header';
              appsHeader.innerHTML = '<span class="sp-apps-title">Apps</span><span class="sp-apps-see-all">See all</span>';
              panelContent.appendChild(appsHeader);
              var appsRow = document.createElement('div');
              appsRow.className = 'sp-apps-row';
              var apps = [
                { name: 'TypeStudio', bg: 'linear-gradient(135deg, #FF6B6B, #4ECDC4)' },
                { name: 'TypeCraft', bg: 'linear-gradient(135deg, #FF4757, #2F3542)' },
                { name: 'MotionText', bg: 'linear-gradient(135deg, #A78BFA, #6366F1)' }
              ];
              apps.forEach(function(app) {
                var card = document.createElement('div');
                card.className = 'sp-app-card';
                var thumb = document.createElement('div');
                thumb.className = 'sp-app-thumb';
                thumb.style.background = app.bg;
                thumb.textContent = app.name.charAt(0);
                card.appendChild(thumb);
                var name = document.createElement('span');
                name.className = 'sp-app-name';
                name.textContent = app.name;
                card.appendChild(name);
                appsRow.appendChild(card);
              });
              panelContent.appendChild(appsRow);
            }
          }, null, at);
          tl.to(panel, { width: 300, duration: 0.3, ease: 'power2.out' }, at + 0.05);
        },
        'hide-panel': function(tl, ctr, action, at) {
          var panel = ctr.querySelector('.side-panel');
          tl.to(panel, { width: 0, duration: 0.25, ease: 'power2.in' }, at);
        },
        'add-text': function(tl, ctr, action, at) {
          var frame = ctr.querySelector('.canvas-frame');
          var preset = action.preset || 'heading';
          var x = action.x || '15%';
          var y = action.y || '25%';
          tl.call(function() {
            var box = document.createElement('div');
            box.className = 'canvas-text-box';
            box.setAttribute('data-target', 'text-box-' + (action.id || '1'));
            box.style.left = x;
            box.style.top = y;
            box.style.opacity = '0';
            // Handles
            ['tl','tr','bl','br','ml','mr'].forEach(function(h) {
              var handle = document.createElement('div');
              handle.className = 'handle handle-' + h;
              box.appendChild(handle);
            });
            var content = document.createElement('div');
            content.className = 'text-content ' + preset;
            content.setAttribute('data-target', 'text-input-' + (action.id || '1'));
            box.appendChild(content);
            frame.appendChild(box);
            gsap.to(box, { opacity: 1, duration: 0.2, ease: 'power2.out' });
          }, null, at);
        },
        'type-canvas': function(tl, ctr, action, at) {
          var inputId = action.id || '1';
          var text = action.text || 'Add a heading';
          var speed = action.speed || 20;
          var charDelay = 1 / speed;
          tl.call(function() {
            var input = ctr.querySelector('[data-target="text-input-' + inputId + '"]');
            if (!input) return;
            // Add blinking cursor
            var cursor = document.createElement('span');
            cursor.className = 'canvas-text-cursor';
            cursor.style.height = (input.classList.contains('heading') ? '32px' : input.classList.contains('subheading') ? '20px' : '14px');
            input.appendChild(cursor);
          }, null, at);
          for (var i = 0; i < text.length; i++) {
            (function(char, idx) {
              tl.call(function() {
                var input = ctr.querySelector('[data-target="text-input-' + inputId + '"]');
                if (!input) return;
                var cursor = input.querySelector('.canvas-text-cursor');
                if (cursor) input.removeChild(cursor);
                input.appendChild(document.createTextNode(char));
                var newCursor = document.createElement('span');
                newCursor.className = 'canvas-text-cursor';
                newCursor.style.height = (input.classList.contains('heading') ? '32px' : input.classList.contains('subheading') ? '20px' : '14px');
                input.appendChild(newCursor);
              }, null, at + 0.15 + idx * charDelay);
            })(text[i], i);
          }
        },
        'remove-text-cursor': function(tl, ctr, action, at) {
          var inputId = action.id || '1';
          tl.call(function() {
            var input = ctr.querySelector('[data-target="text-input-' + inputId + '"]');
            if (!input) return;
            var cursor = input.querySelector('.canvas-text-cursor');
            if (cursor) input.removeChild(cursor);
          }, null, at);
        },
        'hover-toolbar': function(tl, ctr, action, at) {
          var target = action.target || '';
          var btn = ctr.querySelector('[data-target="' + target + '"]');
          tl.call(function() {
            var prev = ctr.querySelectorAll('.tb-text-btn.hovered, .tb-icon-btn.hovered, .share-btn.hovered');
            for (var i = 0; i < prev.length; i++) prev[i].classList.remove('hovered');
            if (btn) btn.classList.add('hovered');
          }, null, at);
        }
      });
    }
    return tl;
  }
</script>
