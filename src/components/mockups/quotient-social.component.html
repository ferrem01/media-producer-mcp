          if (media.style.display === 'none') return;
          tl.fromTo(media, { scale: 1 }, { scale: 1.015, duration: 0.3, ease: 'power2.out' }, at);
          tl.to(media, { scale: 1, duration: 0.35, ease: 'power2.inOut' }, at + 0.5);
        },
        'show-reactions': function(tl, ctr, action, at) {
          tl.fromTo(card, { scale: 1 }, { scale: 1.008, duration: 0.25, ease: 'power2.out' }, at);
          tl.to(card, { scale: 1, duration: 0.3, ease: 'power2.inOut' }, at + 0.3);
        },
        'open-schedule-menu': function(tl, ctr, action, at) {
          tl.to(schedBtn, { scale: 0.96, duration: 0.1, ease: 'power2.in' }, at);
          tl.to(schedBtn, { scale: 1, duration: 0.14, ease: 'power2.out' }, at + 0.1);
          openMenu(tl, at + 0.15);
        },
        'close-schedule-menu': function(tl, ctr, action, at) {
          closeMenu(tl, at);
        },
        'publish-post': function(tl, ctr, action, at) {
          var dateStr = (action && action.published_date) || publishedDate;
          var row = schedMenu.querySelector('[data-menu="publish"]');
          tl.fromTo(row, { backgroundColor: 'rgba(0,0,0,0)' },
            { backgroundColor: '#eeede9', duration: 0.15, yoyo: true, repeat: 1, immediateRender: false }, at);
          closeMenu(tl, at + 0.45);
          var layer = buildStatusLayer('published', dateStr);
          var t = at + 0.7;
          tl.to(statusBar, { backgroundColor: '#47934f', color: '#ffffff',
            borderBottomColor: 'rgba(232,231,228,0)', duration: 0.2, ease: 'power2.out' }, t);
          tl.to(statusLeft, { autoAlpha: 0, duration: 0.12 }, t);
          tl.to(layer, { autoAlpha: 1, duration: 0.18 }, t + 0.04);
          tl.set(actions, { display: 'none' }, t);
          if (data.show_engagement !== false) tl.set(engage, { display: 'flex' }, t);
          tl.set(schedBtn, { display: 'none' }, t);
          tl.set(viewBtn, { display: 'flex' }, t);
          tl.fromTo(statusBar, { scale: 1 }, { scale: 1.02, duration: 0.3, ease: 'power2.out' }, t);
          tl.to(statusBar, { scale: 1, duration: 0.25, ease: 'back.out(2)' }, t + 0.3);
        },
        'schedule-post': function(tl, ctr, action, at) {
          var scheduledDate = (action && action.scheduled_date) || 'Jul 15, 2026 at 10:00 AM';
          tl.to(schedBtn, { scale: 0.96, duration: 0.1, ease: 'power2.in' }, at);
          tl.to(schedBtn, { scale: 1, duration: 0.14, ease: 'power2.out' }, at + 0.1);
          var layer = buildStatusLayer('scheduled', scheduledDate);
          tl.to(statusBar, { backgroundColor: '#5b8fc2', color: '#ffffff',
            borderBottomColor: 'rgba(232,231,228,0)', duration: 0.2, ease: 'power2.out' }, at + 0.4);
          tl.to(statusLeft, { autoAlpha: 0, duration: 0.12 }, at + 0.4);
          tl.to(layer, { autoAlpha: 1, duration: 0.18 }, at + 0.44);
          tl.fromTo(statusBar, { scale: 1 }, { scale: 1.02, duration: 0.3, ease: 'power2.out' }, at + 0.4);
          tl.to(statusBar, { scale: 1, duration: 0.25, ease: 'back.out(2)' }, at + 0.7);
        }
      });
    }

    // Exit only when unscripted (scripted scenes control their own ending)
    if (!hasScript && ctx.duration > 2) {
      tl.to(card, { autoAlpha: 0, y: -12, duration: 0.4, ease: 'power2.in' }, ctx.duration - 0.5);
    }

    return tl;
  }
</script>
