    width: 16px; height: 16px;
    background: #0A66C2;
    border-radius: 4px;
    display: flex; align-items: center; justify-content: center;
    border: 1.5px solid #fff;
  }
  .footer-avatar-badge svg { width: 9px; height: 9px; }
  .footer-info {
    min-width: 0;
  }
  .footer-name-row {
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .footer-name {
    font-size: 15px;
    font-weight: 700;
    color: #1a1a1a;
  }
  .footer-linkedin-badge {
    display: flex; align-items: center;
  }
  .author-tag {
    font-size: 11px;
    font-weight: 500;
    color: #666;
    background: #f0f0f0;
    padding: 2px 8px;
    border-radius: 4px;
  }
  .footer-url {
    font-size: 13px;
    color: #444;
    margin-top: 3px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .footer-url svg {
    vertical-align: middle;
    margin-right: 4px;
  }

  /* ── Scrollbar ── */
  .post-content::-webkit-scrollbar { width: 6px; }
  .post-content::-webkit-scrollbar-track { background: transparent; }
  .post-content::-webkit-scrollbar-thumb { background: #d0d0d0; border-radius: 3px; }
</style>

<script>
  function createTimeline(el, data, ctx) {
    var tl = gsap.timeline();
    var social = el.querySelector('.quotient-social');
    var toolbar = el.querySelector('.toolbar');
    var postCard = el.querySelector('.post-card');
    var statusBar = el.querySelector('.status-bar');
    var authorHeader = el.querySelector('.author-header');
    var postBody = el.querySelector('.post-body');
    var embedCard = el.querySelector('.embed-card');
    var engagementBar = el.querySelector('.engagement-bar');
    var footerAuthor = el.querySelector('.footer-author');
    var postContent = el.querySelector('.post-content');

    // ── Data ──
    var postTitle = data.post_title || 'June 2 Changelog - Max LinkedIn';
    var status = data.status || 'published';
    var publishedDate = data.published_date || 'Jun 2, 2026 at 4:06 PM';
    var authorName = data.author_name || 'Max Davish';
    var authorAvatarUrl = data.author_avatar_url || '';
    var authorInitials = data.author_initials || 'MD';
    var defaultPostText = 'This week\'s running story has been about companies blowing past their AI budgets with insane token bills. I heard one about a guy who accidentally racked up a $500k Claude bill.\n\nI have no idea if that\'s true \u2014 it probably isn\'t \u2014 and I think most of these stories are totally overblown. At Quotient, we\'re some of the most hardcore AI users on the planet and we rarely spend more than a few thousand bucks per person on tokens each month.\n\nThat said, I was a little surprised when I saw a $2,000 Quotient bill last month. Yes, we pay for our own software. It\'s called eating your own dogfood. Maybe you\'ve heard of it. And apparently we were using it a LOT, because we blew straight through our plan\'s token allotment.\n\nNot exactly a $500k nightmare. But still \u2014 a surprise.\n\nSo we immediately shipped spending caps and usage notifications, so our customers never have surprise bills.\n\nThese kinds of controls are going to be crucial now that software is evolving past the seat-based model. Every company is going to spend more and more on tokens in the future, and I think that\'s money well spent. We just need to make sure the controls are in place \u2014 so nobody ends up like the guy who almost bankrupted his company with a Claude bill.';
    var postText = data.post_text || defaultPostText;
    var charCount = data.char_count || 1243;
    var charLimit = data.char_limit || 3000;
    var embedHeadline = data.embed_headline || 'Spending Caps';
    var embedSubtext = data.embed_subtext || '';
    var embedUiCard = data.embed_ui_card || null;
    var authorUrl = data.author_url || '';
    var tagName = data.tag_name || 'Quotient Changelog';
    var tagProgress = data.tag_progress || '0/1';
    var threadCount = data.thread_count || 2;

    // ── Populate toolbar ──
    el.querySelector('.toolbar-title').textContent = postTitle;
    el.querySelector('.tag-name').textContent = tagName;
    el.querySelector('.tag-progress').textContent = tagProgress;
    el.querySelector('.threads-label').textContent = 'Threads (' + threadCount + ')';

    // ── Status bar ──
    var statusTextEl = el.querySelector('.status-text');
    var charCountEl = el.querySelector('.char-count');
    if (status === 'published') {
      statusTextEl.textContent = 'Post published on ' + publishedDate;
    } else if (status === 'draft') {
      statusBar.classList.add('draft');
      statusTextEl.textContent = 'Draft';
    } else if (status === 'scheduled') {
      statusBar.classList.add('scheduled');
      statusTextEl.textContent = 'Scheduled for ' + publishedDate;
    }
    charCountEl.textContent = charCount.toLocaleString() + '/' + charLimit.toLocaleString();

    // ── Author avatar ──
    function setAvatar(container, url, initials) {
      if (url) {
        var img = document.createElement('img');
        img.src = url;
        container.appendChild(img);
      } else {
        container.textContent = initials;
      }
    }
    setAvatar(el.querySelector('.author-avatar'), authorAvatarUrl, authorInitials);
    setAvatar(el.querySelector('.footer-avatar'), authorAvatarUrl, authorInitials);

    // ── Author name ──
    el.querySelector('[data-target="author-name"]').textContent = authorName;
    el.querySelector('.footer-name').textContent = authorName;

    // ── Post body (split by double newline into paragraphs) ──
    var paragraphs = postText.split(/\n\n+/);
    paragraphs.forEach(function(p) {
      var pEl = document.createElement('p');
      pEl.textContent = p.replace(/\n/g, ' ');
      postBody.appendChild(pEl);
    });

    // ── Embed card ──
    el.querySelector('.embed-headline').textContent = embedHeadline;
    el.querySelector('.embed-subtext').textContent = embedSubtext;

    // ── Embed UI card ──
    if (embedUiCard) {
      var uiTitle = el.querySelector('.ui-card-title');
      var uiSubtitle = el.querySelector('.ui-card-subtitle');
      var uiOptions = el.querySelector('.ui-card-options');
      uiTitle.textContent = embedUiCard.title || 'Spending Cap';
      uiSubtitle.textContent = embedUiCard.subtitle || '';

      var opts = embedUiCard.options || [
        { label: 'Default ($100)', description: 'Pause usage at the default spending cap for your plan.', selected: false },
        { label: 'Set a custom spending cap', description: 'Pause usage once overage charges reach this amount.', selected: true, input_prefix: '$', input_value: '200', input_suffix: 'per billing period' },
        { label: 'No cap (unlimited overage)', description: 'Continue accruing overage charges with no limit.', selected: false },
        { label: 'Block all overage', description: 'Pause usage the moment your included allotment is reached.', selected: false }
      ];

      opts.forEach(function(opt) {
        var optEl = document.createElement('div');
        optEl.className = 'ui-option' + (opt.selected ? ' selected' : '');
        var html = '<div class="ui-radio"><div class="ui-radio-dot"></div></div>';
        html += '<div class="ui-option-content">';
        html += '<div class="ui-option-label">' + (opt.label || '') + '</div>';
        html += '<div class="ui-option-desc">' + (opt.description || '') + '</div>';
        if (opt.input_value) {
          html += '<div class="ui-option-input">';
          if (opt.input_prefix) html += '<span>' + opt.input_prefix + '</span>';
          html += '<span class="input-box">' + opt.input_value + '</span>';
          if (opt.input_suffix) html += '<span>' + opt.input_suffix + '</span>';
          html += '</div>';
        }
        html += '</div>';
        optEl.innerHTML = html;
        uiOptions.appendChild(optEl);
      });
    } else {
      // Default UI card
      var uiTitle = el.querySelector('.ui-card-title');
      var uiSubtitle = el.querySelector('.ui-card-subtitle');
      var uiOptions = el.querySelector('.ui-card-options');
      uiTitle.textContent = 'Spending Cap';
      uiSubtitle.textContent = 'Choose how overage on the Pro plan is handled once included usage is exhausted.';
      var defaultOpts = [
        { label: 'Default ($100)', description: 'Pause usage at the default spending cap for your plan.', selected: false },
        { label: 'Set a custom spending cap', description: 'Pause usage once overage charges reach this amount.', selected: true, input_prefix: '$', input_value: '200', input_suffix: 'per billing period' },
        { label: 'No cap (unlimited overage)', description: 'Continue accruing overage charges with no limit.', selected: false },
        { label: 'Block all overage', description: 'Pause usage the moment your included allotment is reached.', selected: false }
      ];
      defaultOpts.forEach(function(opt) {
        var optEl = document.createElement('div');
        optEl.className = 'ui-option' + (opt.selected ? ' selected' : '');
        var html = '<div class="ui-radio"><div class="ui-radio-dot"></div></div>';
        html += '<div class="ui-option-content">';
        html += '<div class="ui-option-label">' + (opt.label || '') + '</div>';
        html += '<div class="ui-option-desc">' + (opt.description || '') + '</div>';
        if (opt.input_value) {
          html += '<div class="ui-option-input">';
          if (opt.input_prefix) html += '<span>' + opt.input_prefix + '</span>';
          html += '<span class="input-box">' + opt.input_value + '</span>';
          if (opt.input_suffix) html += '<span>' + opt.input_suffix + '</span>';
          html += '</div>';
        }
        html += '</div>';
        optEl.innerHTML = html;
        uiOptions.appendChild(optEl);
      });
    }

    // ── Embed image URL override ──
    if (data.embed_image_url) {
      var embedImageDiv = el.querySelector('.embed-image');
      if (embedImageDiv) {
        embedImageDiv.innerHTML = '<img class="embed-image-real" src="' + data.embed_image_url + '" alt="" />';
      }
    }

    // ── Footer URL ──
    var footerUrlEl = el.querySelector('.footer-url');
    if (authorUrl) {
      footerUrlEl.innerHTML = '<svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="#0A66C2" stroke-width="1.3" stroke-linecap="round"><path d="M6.5 9.5a3 3 0 004.24 0l2-2a3 3 0 00-4.24-4.24l-1 1"/><path d="M7.5 4.5a3 3 0 00-4.24 0l-2 2a3 3 0 004.24 4.24l1-1"/></svg>' + authorUrl;
    }

    // ── Animation ──
    var speed = ctx.motion === 'minimal' ? 0.3 : ctx.motion === 'punchy' ? 0.5 : 0.7;

    gsap.set(social, { autoAlpha: 0 });
    gsap.set(postCard, { autoAlpha: 0, y: 24 });
    gsap.set(statusBar, { autoAlpha: 0 });
    gsap.set(authorHeader, { autoAlpha: 0, x: -12 });
    gsap.set(postBody, { autoAlpha: 0 });
    gsap.set(embedCard, { autoAlpha: 0, scale: 0.97 });
    gsap.set(engagementBar, { autoAlpha: 0 });
    gsap.set(footerAuthor, { autoAlpha: 0 });

    // Entrance - fast staggered reveal
    tl.to(social, { autoAlpha: 1, duration: 0.15, ease: 'power2.out' }, 0.05);
    tl.to(postCard, { autoAlpha: 1, y: 0, duration: 0.25, ease: 'power3.out' }, 0.08);
    tl.to(statusBar, { autoAlpha: 1, duration: 0.15, ease: 'power2.out' }, 0.12);
    tl.to(authorHeader, { autoAlpha: 1, x: 0, duration: 0.2, ease: 'power2.out' }, 0.15);
    tl.to(postBody, { autoAlpha: 1, duration: 0.2, ease: 'power2.out' }, 0.18);
    tl.to(embedCard, { autoAlpha: 1, scale: 1, duration: 0.25, ease: 'power2.out' }, 0.22);
    tl.to(engagementBar, { autoAlpha: 1, duration: 0.15, ease: 'power2.out' }, 0.28);
    tl.to(footerAuthor, { autoAlpha: 1, duration: 0.15, ease: 'power2.out' }, 0.32);

    // Auto scroll post content to show full post
    if (ctx.duration > 3) {
      tl.to(postContent, {
        scrollTop: function() { return postContent.scrollHeight - postContent.clientHeight; },
        duration: ctx.duration * 0.5,
        ease: 'power1.inOut'
      }, 2.0);
    }

    // Exit
    if (ctx.duration > 2) {
      var exitAt = ctx.duration - 0.5;
      tl.to(postCard, {
        autoAlpha: 0, y: -12,
        duration: 0.4,
        ease: 'power2.in'
      }, exitAt);
    }

    // ── Script actions ──
    if (data.script && data.script.length > 0) {
      var cursorTargets = data.cursor_targets || {
        'status-bar': { x: '50%', y: '8%' },
        'post-body': { x: '50%', y: '50%' },
        'embed-card': { x: '50%', y: '75%' },
        'like-btn': { x: '20%', y: '88%' },
        'view-btn': { x: '92%', y: '3%' }
      };

      runScript(tl, el, data.script, cursorTargets, ctx, {
        'scroll-post': function(tl, ctr, action, at) {
          var content = ctr.querySelector('.post-content');
          if (!content) return;
          var amt = action.amount || 300;
          var dur = action.duration || 2;
          tl.to(content, { scrollTop: '+=' + amt, duration: dur, ease: 'power1.inOut' }, at);
        },
        'highlight-status': function(tl, ctr, action, at) {
          var bar = ctr.querySelector('.status-bar');
          if (!bar) return;
          tl.to(bar, { boxShadow: '0 0 20px rgba(91,169,116,0.5)', duration: 0.3, ease: 'power2.out' }, at);
          tl.to(bar, { boxShadow: '0 0 0px rgba(91,169,116,0)', duration: 0.5, ease: 'power2.in' }, at + 0.5);
        },
        'highlight-embed': function(tl, ctr, action, at) {
          var card = ctr.querySelector('.embed-card');
          if (!card) return;
          tl.to(card, { boxShadow: '0 0 24px rgba(124,58,237,0.4)', duration: 0.3, ease: 'power2.out' }, at);
          tl.to(card, { boxShadow: '0 0 0px rgba(124,58,237,0)', duration: 0.6, ease: 'power2.in' }, at + 0.5);
        },
        'show-reactions': function(tl, ctr, action, at) {
          var btns = ctr.querySelectorAll('.engage-btn');
          gsap.set(btns, { autoAlpha: 0, y: 8 });
          btns.forEach(function(btn, i) {
            tl.to(btn, { autoAlpha: 1, y: 0, duration: 0.3, ease: 'power2.out' }, at + i * 0.1);
          });
        },
        'schedule-post': function(tl, ctr, action, at) {
          var schedBtn = ctr.querySelector('.schedule-btn');
          var bar = ctr.querySelector('.status-bar');
          var statusText = ctr.querySelector('.status-text');
          var scheduledDate = (action && action.scheduled_date) || 'Jun 12, 2026 at 10:00 AM';
          if (schedBtn) {
            tl.to(schedBtn, { borderColor: '#0A66C2', color: '#0A66C2', scale: 1.06, duration: 0.25, ease: 'power2.out' }, at);
            tl.to(schedBtn, { scale: 1, duration: 0.2, ease: 'power2.inOut' }, at + 0.25);
          }
          if (bar) {
            tl.call(function() {
              bar.classList.remove('draft', 'scheduled');
              bar.classList.add('scheduled');
              if (statusText) statusText.textContent = 'Scheduled for ' + scheduledDate;
            }, null, at + 0.5);
            tl.to(bar, { backgroundColor: '#5b8fc2', scale: 1.02, duration: 0.35, ease: 'power2.out' }, at + 0.5);
            tl.to(bar, { scale: 1, duration: 0.25, ease: 'back.out(2)' }, at + 0.85);
          }
        }
      });
    }

    return tl;
  }
</script>
