      ? '<svg width="16" height="16" viewBox="0 0 24 24" fill="#fff"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg>'
      : '<svg width="17" height="17" viewBox="0 0 24 24" fill="#fff"><path d="M20.447 20.452h-3.554v-5.569c0-1.328-.027-3.037-1.852-3.037-1.853 0-2.136 1.445-2.136 2.939v5.667H9.351V9h3.414v1.561h.046c.477-.9 1.637-1.85 3.37-1.85 3.601 0 4.267 2.37 4.267 5.455v6.286zM5.337 7.433a2.062 2.062 0 01-2.063-2.065 2.064 2.064 0 112.063 2.065zm1.782 13.019H3.555V9h3.564v11.452zM22.225 0H1.771C.792 0 0 .774 0 1.729v20.542C0 23.227.792 24 1.771 24h20.451C23.2 24 24 23.227 24 22.271V1.729C24 .774 23.2 0 22.222 0h.003z"/></svg>';
    el.querySelector('.qsp-title').textContent = postTitle;
    el.querySelector('.qsp-tag-name').textContent = tagName;
    el.querySelector('.qsp-tag-prog').textContent = tagProgress;
    var progParts = String(tagProgress).split('/');
    var progFrac = (parseFloat(progParts[0]) || 0) / (parseFloat(progParts[1]) || 1);
    el.querySelector('.qsp-tag-arc').setAttribute('stroke-dashoffset', String(39 * (1 - Math.min(1, progFrac))));

    if (data.show_app_bar) appbar.style.display = 'flex';

    // ── Status bar ──
    var statusIcon = el.querySelector('.qsp-status-icon');
    var statusText = el.querySelector('.qsp-status-text');
    var CHECK_SVG = '<svg width="16" height="16" viewBox="0 0 18 18" fill="none"><circle cx="9" cy="9" r="8" fill="rgba(255,255,255,0.25)"/><path d="M5.5 9.5l2 2 5-5" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>';
    var DRAFT_SVG = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#777" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M17 3a2.85 2.85 0 114 4L7.5 20.5 2 22l1.5-5.5z"/></svg>';
    function applyStatus(st, dateStr) {
      statusBar.classList.remove('published', 'draft', 'scheduled');
      statusBar.classList.add(st);
      if (st === 'published') {
        statusIcon.innerHTML = CHECK_SVG;
        statusText.textContent = 'Post published on ' + dateStr;
      } else if (st === 'scheduled') {
        statusIcon.innerHTML = CHECK_SVG;
        statusText.textContent = 'Scheduled for ' + dateStr;
      } else {
        statusIcon.innerHTML = DRAFT_SVG;
        statusText.textContent = 'Draft';
      }
    }
    applyStatus(status, publishedDate);
    el.querySelector('.qsp-charcount').textContent = charCount.toLocaleString() + '/' + charLimit.toLocaleString();

    // Published posts show View instead of Schedule
    if (status === 'published') {
      schedBtn.style.display = 'none';
      viewBtn.style.display = 'flex';
    }

    // ── Author ──
    var ava = el.querySelector('.qsp-ava');
    ava.textContent = authorInitials;
    if (authorAvatarUrl) {
      var img = document.createElement('img');
      img.className = 'qsp-ava-img';
      img.src = authorAvatarUrl;
      img.onerror = function() { this.remove(); };
      ava.appendChild(img);
    }
    var avaBadge = el.querySelector('.qsp-ava-badge');
    avaBadge.classList.add(isX ? 'x' : 'linkedin');
    avaBadge.innerHTML = isX
      ? '<svg width="10" height="10" viewBox="0 0 24 24" fill="#fff"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg>'
      : '<svg width="10" height="10" viewBox="0 0 24 24" fill="#fff"><path d="M20.447 20.452h-3.554v-5.569c0-1.328-.027-3.037-1.852-3.037-1.853 0-2.136 1.445-2.136 2.939v5.667H9.351V9h3.414v1.561h.046c.477-.9 1.637-1.85 3.37-1.85 3.601 0 4.267 2.37 4.267 5.455v6.286zM5.337 7.433a2.062 2.062 0 01-2.063-2.065 2.064 2.064 0 112.063 2.065zm1.782 13.019H3.555V9h3.564v11.452zM22.225 0H1.771C.792 0 0 .774 0 1.729v20.542C0 23.227.792 24 1.771 24h20.451C23.2 24 24 23.227 24 22.271V1.729C24 .774 23.2 0 22.222 0h.003z"/></svg>';

    el.querySelector('.qsp-author-name').textContent = authorName;
    if (verified && isX) el.querySelector('.qsp-verified').style.display = 'flex';
    if (!isX) el.querySelector('.qsp-inbadge').style.display = 'flex';
    if (authorHandle) {
      var h = el.querySelector('.qsp-handle');
      h.textContent = authorHandle;
      h.style.display = 'block';
    }

    // ── Body ──
    postText.split(/\n\n+/).forEach(function(p) {
      var pEl = document.createElement('p');
      pEl.textContent = p.replace(/\n/g, ' ');
      body.appendChild(pEl);
    });

    // ── Media ──
    var FILE_COLORS = { PDF: '#d64545', DOC: '#3b7dd8', FILE: '#7a7a7a', XLS: '#2f9e6e', PPT: '#e07b39' };
    if (mediaItems && mediaItems.length) {
      media.style.display = 'grid';
      if (mediaItems.length === 1) media.classList.add('single');
      mediaItems.slice(0, 2).forEach(function(m) {
        var cardEl = document.createElement('div');
        cardEl.className = 'qsp-media-card';
        if (m.kind === 'files' || m.files) {
          var wrap = document.createElement('div');
          wrap.className = 'qsp-media-files';
          (m.files || ['PDF', 'DOC', 'FILE']).slice(0, 3).forEach(function(f) {
            var chip = document.createElement('div');
            chip.className = 'qsp-filechip';
            var ft = document.createElement('span');
            ft.className = 'qsp-filetype';
            ft.style.background = FILE_COLORS[f.toUpperCase()] || FILE_COLORS.FILE;
            ft.textContent = f.toUpperCase();
            chip.appendChild(ft);
            var nm = document.createElement('span');
            nm.textContent = m.label || 'Attachment';
            chip.appendChild(nm);
            wrap.appendChild(chip);
          });
          cardEl.appendChild(wrap);
        } else if (m.image_url) {
          var im = document.createElement('img');
          im.src = m.image_url;
          im.onerror = function() {
            this.remove();
            var g = document.createElement('div');
            g.className = 'qsp-media-grad';
            g.innerHTML = '<p class="qsp-media-headline"></p>';
            g.querySelector('.qsp-media-headline').textContent = m.headline || '';
            cardEl.appendChild(g);
          };
          cardEl.appendChild(im);
        } else {
          var g = document.createElement('div');
          g.className = 'qsp-media-grad';
          var hl = document.createElement('p');
          hl.className = 'qsp-media-headline';
          hl.textContent = m.headline || '';
          g.appendChild(hl);
          if (m.subtext) {
            var sb = document.createElement('p');
            sb.className = 'qsp-media-sub';
            sb.textContent = m.subtext;
            g.appendChild(sb);
          }
          cardEl.appendChild(g);
        }
        media.appendChild(cardEl);
      });
    }

    // ── Schedule menu helpers ──
    function openMenu(tlRef, at) {
      tlRef.call(function() {
        var rootRect = root.getBoundingClientRect();
        var btnRect = schedBtn.getBoundingClientRect();
        var leftPct = ((btnRect.right - rootRect.left) / rootRect.width) * 100;
        var topPct = ((btnRect.bottom - rootRect.top) / rootRect.height) * 100;
        schedMenu.style.right = (100 - leftPct) + '%';
        schedMenu.style.left = 'auto';
        schedMenu.style.top = 'calc(' + topPct + '% + 6px)';
        schedMenu.style.display = 'block';
        gsap.fromTo(schedMenu, { autoAlpha: 0, y: -6 }, { autoAlpha: 1, y: 0, duration: 0.22, ease: 'power2.out' });
      }, null, at);
    }
    function closeMenu(tlRef, at) {
      tlRef.call(function() {
        gsap.to(schedMenu, { autoAlpha: 0, y: -6, duration: 0.16, ease: 'power2.in', onComplete: function() { schedMenu.style.display = 'none'; } });
      }, null, at);
    }

    // ── Entrance ──
    var speed = ctx.motion === 'minimal' ? 0.3 : ctx.motion === 'punchy' ? 0.5 : 0.7;
    gsap.set(root, { autoAlpha: 0 });
    gsap.set(card, { autoAlpha: 0, y: 22 });
    gsap.set([statusBar, author, body], { autoAlpha: 0 });
    if (media.style.display !== 'none') gsap.set(media, { autoAlpha: 0, scale: 0.98 });

    tl.to(root, { autoAlpha: 1, duration: 0.15, ease: 'power2.out' }, 0.05);
    tl.to(card, { autoAlpha: 1, y: 0, duration: 0.28, ease: 'power3.out' }, 0.08);
    tl.to(statusBar, { autoAlpha: 1, duration: 0.15 }, 0.14);
    tl.to(author, { autoAlpha: 1, duration: 0.2 }, 0.18);
    tl.to(body, { autoAlpha: 1, duration: 0.2 }, 0.22);
    if (media.style.display !== 'none') {
      tl.to(media, { autoAlpha: 1, scale: 1, duration: 0.25, ease: 'power2.out' }, 0.28);
    }

    var hasScript = data.script && data.script.length > 0;

    // Auto scroll long posts when unscripted
    if (!hasScript && ctx.duration > 3) {
      tl.to(scroll, {
        scrollTop: function() { return scroll.scrollHeight - scroll.clientHeight; },
        duration: ctx.duration * 0.5,
        ease: 'power1.inOut'
      }, 2.0);
    }

    // ── Script actions ──
    if (hasScript) {
      var cursorTargets = data.cursor_targets || {
        'status': { x: '50%', y: '18%' },
        'schedule': { x: '88%', y: '9%' },
        'media': { x: '50%', y: '70%' }
      };

      runScript(tl, el, data.script, cursorTargets, ctx, {
        'scroll-post': function(tl, ctr, action, at) {
          var content = ctr.querySelector('.qsp-scroll');
          if (!content) return;
          var amt = action.amount || 300;
          var dur = action.duration || 2;
          tl.to(content, { scrollTop: '+=' + amt, duration: dur, ease: 'power1.inOut' }, at);
        },
        'highlight-status': function(tl, ctr, action, at) {
          tl.fromTo(statusBar, { boxShadow: '0 0 0px rgba(71,147,79,0)' },
            { boxShadow: '0 0 22px rgba(71,147,79,0.5)', duration: 0.3, ease: 'power2.out' }, at);
          tl.to(statusBar, { boxShadow: '0 0 0px rgba(71,147,79,0)', duration: 0.5, ease: 'power2.in' }, at + 0.6);
        },
        'highlight-media': function(tl, ctr, action, at) {
          if (media.style.display === 'none') return;
          tl.fromTo(media, { scale: 1 }, { scale: 1.015, duration: 0.3, ease: 'power2.out' }, at);
          tl.to(media, { scale: 1, duration: 0.35, ease: 'power2.inOut' }, at + 0.5);
        },
        'highlight-embed': function(tl, ctr, action, at) {
          if (media.style.display === 'none') return;
          tl.fromTo(media, { scale: 1 }, { scale: 1.015, duration: 0.3, ease: 'power2.out' }, at);
          tl.to(media, { scale: 1, duration: 0.35, ease: 'power2.inOut' }, at + 0.5);
        },
        'show-reactions': function(tl, ctr, action, at) {
          tl.fromTo(card, { scale: 1 }, { scale: 1.008, duration: 0.25, ease: 'power2.out' }, at);
          tl.to(card, { scale: 1, duration: 0.3, ease: 'power2.inOut' }, at + 0.3);
        },
        'open-schedule-menu': function(tl, ctr, action, at) {
          tl.to(schedBtn, { scale: 0.96, duration: 0.1, ease: 'power2.in' }, at);
          tl.to(schedBtn, { scale: 1, duration: 0.14, ease: 'power2.out' }, at + 0.1);
          openMenu(tl, at + 0.15);
        },
        'close-schedule-menu': function(tl, ctr, action, at) {
          closeMenu(tl, at);
        },
        'publish-post': function(tl, ctr, action, at) {
          var dateStr = (action && action.published_date) || publishedDate;
          var menuVisible = true;
          tl.call(function() {
            var row = schedMenu.querySelector('[data-menu="publish"]');
            if (schedMenu.style.display === 'none') { menuVisible = false; return; }
            gsap.fromTo(row, { backgroundColor: 'rgba(0,0,0,0)' },
              { backgroundColor: '#eeede9', duration: 0.15, yoyo: true, repeat: 1 });
          }, null, at);
          closeMenu(tl, at + 0.45);
          tl.call(function() {
            applyStatus('published', dateStr);
            schedBtn.style.display = 'none';
            viewBtn.style.display = 'flex';
          }, null, at + 0.7);
          tl.fromTo(statusBar, { scale: 1 }, { scale: 1.02, duration: 0.3, ease: 'power2.out' }, at + 0.7);
          tl.to(statusBar, { scale: 1, duration: 0.25, ease: 'back.out(2)' }, at + 1.0);
        },
        'schedule-post': function(tl, ctr, action, at) {
          var scheduledDate = (action && action.scheduled_date) || 'Jul 15, 2026 at 10:00 AM';
          tl.to(schedBtn, { scale: 0.96, duration: 0.1, ease: 'power2.in' }, at);
          tl.to(schedBtn, { scale: 1, duration: 0.14, ease: 'power2.out' }, at + 0.1);
          tl.call(function() {
            applyStatus('scheduled', scheduledDate);
          }, null, at + 0.4);
          tl.fromTo(statusBar, { scale: 1 }, { scale: 1.02, duration: 0.3, ease: 'power2.out' }, at + 0.4);
          tl.to(statusBar, { scale: 1, duration: 0.25, ease: 'back.out(2)' }, at + 0.7);
        }
      });
    }

    // Exit only when unscripted (scripted scenes control their own ending)
    if (!hasScript && ctx.duration > 2) {
      tl.to(card, { autoAlpha: 0, y: -12, duration: 0.4, ease: 'power2.in' }, ctx.duration - 0.5);
    }

    return tl;
  }
</script>
