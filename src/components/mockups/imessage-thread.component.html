<script>
  function createTimeline(el, data, ctx) {
    var tl = gsap.timeline();
    data = data || {};
    ctx = ctx || {};
    var num = function (v, d) { var n = Number(v); return (v === null || v === undefined || v === '' || !isFinite(n)) ? d : n; };
    var DUR = ctx.duration || 8;
    var root = el.querySelector('.imt-root'), scr = el.querySelector('.imt-screen');
    var DARK = data.theme === 'dark';
    if (DARK) root.classList.add('imt-dark');
    if (data.service === 'sms') root.classList.add('imt-sms');
    scr.style.setProperty('--imt-bg', DARK ? '#000000' : '#ffffff');

    // ---- Fit: iPhone points (390 wide), as tall as the box allows ----
    var BW = el.clientWidth || 1080, BH = el.clientHeight || 1920;
    var K = BW / 390;
    var SH = BH / K;
    scr.style.height = SH + 'px';
    scr.style.transform = 'scale(' + K + ')';
    if (data.status_bar === false) el.querySelector('.imt-status').style.display = 'none';

    // ---- Contact ----
    var c = data.contact || {};
    var cname = String(c.name || 'Sarah');
    el.querySelector('.imt-name').textContent = cname;
    var av = el.querySelector('.imt-avatar');
    if (c.photo) av.style.backgroundImage = 'url("' + String(c.photo).replace(/"/g, '%22') + '")';
    else av.textContent = String(c.initials || cname.split(/\s+/).filter(function (w) { return /^[A-Za-z0-9]/.test(w); }).map(function (w) { return w[0]; }).join('').slice(0, 2)).toUpperCase();

    // ---- Keyboard (built only when asked) ----
    var KB = data.keyboard === true;
    var kb = el.querySelector('.imt-kb'), keys = {};
    var KBH = 291;
    if (KB) {
      ['qwertyuiop', 'asdfghjkl', 'zxcvbnm'].forEach(function (r, ri) {
        var row = document.createElement('div'); row.className = 'imt-row';
        if (ri === 2) { var sh = document.createElement('div'); sh.className = 'imt-key wide'; sh.innerHTML = '&#x21E7;'; row.appendChild(sh); }
        r.split('').forEach(function (ch) { var k = document.createElement('div'); k.className = 'imt-key'; k.textContent = ch; keys[ch] = k; row.appendChild(k); });
        if (ri === 2) { var bk = document.createElement('div'); bk.className = 'imt-key wide'; bk.innerHTML = '&#x232B;'; row.appendChild(bk); }
        kb.appendChild(row);
      });
      var last = document.createElement('div'); last.className = 'imt-row';
      last.innerHTML = '<div class="imt-key wide">123</div><div class="imt-key wide">&#x1F600;</div>';
      var sp = document.createElement('div'); sp.className = 'imt-key space'; sp.textContent = 'space'; keys[' '] = sp; last.appendChild(sp);
      var rt = document.createElement('div'); rt.className = 'imt-key ret'; rt.textContent = 'return'; last.appendChild(rt);
      kb.appendChild(last);
    }

    // ---- Messages ----
    var col = el.querySelector('.imt-col'), view = el.querySelector('.imt-view');
    if (data.timestamp !== false) {
      var ts = document.createElement('div'); ts.className = 'imt-ts';
      ts.innerHTML = '<b>' + String(data.timestamp || 'Today') + '</b> ' + String(data.time || '9:41 AM');
      col.appendChild(ts);
    }
    var msgs = (Array.isArray(data.messages) ? data.messages : []).filter(Boolean).map(function (m) {
      return { from: m.from === 'them' || m.from === 'contact' ? 'them' : 'me', text: m.text ? String(m.text) : '', emoji: m.emoji ? String(m.emoji) : '',
        image: m.image, link: m.link, reaction: m.reaction ? String(m.reaction) : '', at: m.at, reaction_at: m.reaction_at };
    });
    var isEmojiOnly = function (t) { return t && t.length <= 8 && !/[A-Za-z0-9]/.test(t); };
    msgs.forEach(function (m, i) {
      var next = msgs[i + 1], prev = msgs[i - 1];
      var wrap = document.createElement('div');
      wrap.className = 'imt-msg ' + m.from + (prev && prev.from !== m.from ? ' gap' : '');
      var b = document.createElement('div');
      b.className = 'imt-b';
      var txt = m.emoji || m.text;
      if (m.image) {
        b.className += ' media';
        var im = document.createElement('div'); im.className = 'imt-img';
        if (typeof m.image === 'string' && m.image !== 'true') im.style.backgroundImage = 'url("' + m.image.replace(/"/g, '%22') + '")';
        b.appendChild(im);
      } else if (m.link) {
        b.className += ' media';
        var L = typeof m.link === 'object' ? m.link : { title: String(m.link) };
        var card = document.createElement('div'); card.className = 'imt-link';
        var li = document.createElement('div'); li.className = 'imt-link-img';
        if (L.image) li.style.backgroundImage = 'url("' + String(L.image).replace(/"/g, '%22') + '")';
        var lt = document.createElement('div'); lt.className = 'imt-link-t'; lt.textContent = L.title || '';
        var ld = document.createElement('div'); ld.className = 'imt-link-d'; ld.textContent = L.domain || '';
        card.appendChild(li); card.appendChild(lt); card.appendChild(ld); b.appendChild(card);
      } else if (m.emoji || isEmojiOnly(txt)) {
        b.className += ' emoji'; b.textContent = txt;
      } else {
        b.textContent = txt;
        if (!next || next.from !== m.from) b.className += ' tail';
      }
      wrap.appendChild(b);
      if (m.reaction) {
        var rx = document.createElement('div'); rx.className = 'imt-react'; rx.textContent = m.reaction; b.appendChild(rx); m.rx = rx;
      }
      if (m.from === 'me') { var rc = document.createElement('div'); rc.className = 'imt-rcpt'; rc.textContent = 'Delivered'; wrap.appendChild(rc); m.rc = rc; }
      col.appendChild(wrap);
      m.wrap = wrap; m.b = b;
    });
    // Their replies each get typing dots, in the reply's own slot.
    msgs.forEach(function (m) {
      if (m.from !== 'them') return;
      var ty = document.createElement('div');
      ty.className = 'imt-msg them' + (m.wrap.classList.contains('gap') ? ' gap' : '');
      ty.innerHTML = '<div class="imt-typing"><i></i><i></i><i></i></div>';
      ty.style.display = 'none'; // measured without it: the reply takes its slot
      col.insertBefore(ty, m.wrap);
      m.typing = ty;
    });
    // Layout once, everything present: where each message's bottom sits.
    msgs.forEach(function (m) { m.bottom = m.wrap.offsetTop + m.wrap.offsetHeight + (m.rc ? 16 : 0); });
    var headH = el.querySelector('.imt-status').offsetHeight + el.querySelector('.imt-head').offsetHeight;
    var barH = el.querySelector('.imt-bar').offsetHeight;
    var viewH = SH - headH - barH - (KB ? KBH : 0);

    // ---- Timing: each message on its `at`, else in sequence ----
    var CPS = num(data.type_speed, 16);
    var t = num(data.start_at, 0.5);
    if (KB) {
      gsap.set(kb, { height: 0 });
      tl.to(kb, { height: KBH, duration: 0.35, ease: 'power3.out' }, Math.max(0, t - 0.3));
    }
    var draft = el.querySelector('.imt-draft'), ph = el.querySelector('.imt-ph'), caret = el.querySelector('.imt-caret'), send = el.querySelector('.imt-send');
    var lastRc = null, scrollY = 0;
    gsap.set(msgs.map(function (m) { return m.wrap; }), { autoAlpha: 0 });
    function scrollTo(bottom, at) {
      var want = Math.max(0, bottom - viewH + 10);
      if (want > scrollY + 1) { tl.to(col, { y: -want, duration: 0.35, ease: 'power2.out' }, at); scrollY = want; }
    }
    msgs.forEach(function (m, i) {
      var start = m.at !== undefined && m.at !== null && m.at !== '' ? num(m.at, t) : t;
      var shown;
      if (m.from === 'them') {
        // Typing dots first (in the reply's slot), then the reply pops from its corner.
        var tt = Math.max(0, start - 0.9), typing = m.typing, dots = typing.querySelectorAll('i');
        tl.set(typing, { display: 'flex' }, tt);
        tl.fromTo(typing, { autoAlpha: 0, scale: 0.7, transformOrigin: '0% 100%' }, { autoAlpha: 1, scale: 1, duration: 0.18, immediateRender: false }, tt);
        for (var d = 0; d < 3; d++) {
          tl.to(dots[d], { keyframes: [{ y: -3, opacity: 1, duration: 0.15 }, { y: 0, opacity: 0.5, duration: 0.15 }] }, tt + 0.1 + d * 0.1);
          tl.to(dots[d], { keyframes: [{ y: -3, opacity: 1, duration: 0.15 }, { y: 0, opacity: 0.5, duration: 0.15 }] }, tt + 0.5 + d * 0.1);
        }
        // Scroll to the DOTS (the top of the reply's slot), not the reply
        // yet to come -- measured: the view overshot past your last message.
        scrollTo(m.wrap.offsetTop + 46, tt);
        tl.set(typing, { display: 'none' }, start);
        shown = start;
        tl.fromTo(m.wrap, { autoAlpha: 0 }, { autoAlpha: 1, duration: 0.01, immediateRender: false }, shown);
        tl.fromTo(m.b, { scale: 0.6 }, { scale: 1, duration: 0.32, ease: 'back.out(1.8)', immediateRender: false }, shown);
      } else {
        var body = m.emoji || m.text;
        shown = start;
        if (KB && body && !m.image && !m.link) {
          // Types into the field, key by key, then sends.
          var chars = body.split('');
          var step = 1 / CPS;
          tl.set(ph, { display: 'none' }, start);
          tl.set(caret, { opacity: 1 }, start);
          tl.to(send, { scale: 1, duration: 0.15, ease: 'back.out(2)' }, start + step);
          chars.forEach(function (ch, k) {
            var at = start + k * step;
            tl.set(draft, { textContent: body.slice(0, k + 1) }, at);
            var key = keys[ch.toLowerCase()];
            if (key) { tl.set(key, { backgroundColor: DARK ? '#9a9a9e' : '#c9ccd4' }, at); tl.set(key, { backgroundColor: '' }, at + step * 0.8); }
          });
          shown = start + chars.length * step + 0.25;
          tl.to(send, { scale: 0.85, duration: 0.06 }, shown - 0.08);
          tl.set(draft, { textContent: '' }, shown);
          tl.set(ph, { display: 'inline' }, shown);
          tl.set(caret, { opacity: 0 }, shown);
          tl.to(send, { scale: 0, duration: 0.12 }, shown);
        }
        tl.fromTo(m.wrap, { autoAlpha: 0 }, { autoAlpha: 1, duration: 0.01, immediateRender: false }, shown);
        tl.fromTo(m.b, { y: 26, scale: 0.92 }, { y: 0, scale: 1, duration: 0.3, ease: 'power3.out', immediateRender: false }, shown);
        // "Delivered" rides under your latest message only.
        if (lastRc) tl.to(lastRc, { opacity: 0, height: 0, duration: 0.15 }, shown);
        tl.to(m.rc, { opacity: 1, height: 14, duration: 0.2 }, shown + 0.35);
        lastRc = m.rc;
      }
      scrollTo(m.bottom, shown);
      if (m.rx) {
        var ra = m.reaction_at !== undefined ? num(m.reaction_at, shown + 1) : shown + 0.9;
        tl.fromTo(m.rx, { scale: 0, autoAlpha: 0 }, { scale: 1, autoAlpha: 1, duration: 0.3, ease: 'back.out(2.4)', immediateRender: false }, ra);
      }
      t = shown + (m.from === 'them' ? 1.6 : 1.2);
    });
    gsap.set(kb.querySelectorAll('.imt-key'), { backgroundColor: '' });
    return tl;
  }
</script>
