<script>
  function createTimeline(el, data, ctx) {
    var tl = gsap.timeline();
    var q = function(s) { return el.querySelector(s); };
    var win = q('.vcall-window');
    var grid = q('.vcall-grid');
    var dur = ctx.duration || 5;

    q('.vcall-title').textContent = data.title || 'Weekly demo call';
    q('.vcall-timer').textContent = data.timer || '31:42';

    var AVA_GRADS = [
      'linear-gradient(135deg, #4c5aa8, #7a4ca8)',
      'linear-gradient(135deg, #a8632f, #a83f57)',
    ];
    var participants = (data.participants && data.participants.length ? data.participants : [
      { name: 'Sarah Chen', initials: 'SC' },
      { name: 'Marcus Webb', initials: 'MW' },
    ]).slice(0, 2);

    // Build tiles ONCE at build; every later state change is a timeline tween.
    var tiles = participants.map(function(p, i) {
      var tile = document.createElement('div');
      tile.className = 'vcall-tile';
      if (p.avatar_url) {
        var img = document.createElement('img');
        img.src = p.avatar_url;
        img.onerror = function() { this.remove(); };
        tile.appendChild(img);
      } else {
        var fb = document.createElement('div');
        fb.className = 'vcall-fallback';
        fb.style.background = 'radial-gradient(ellipse at 50% 30%, #262630, #14141a)';
        var ava = document.createElement('div');
        ava.className = 'vcall-ava';
        ava.style.background = AVA_GRADS[i % AVA_GRADS.length];
        ava.textContent = p.initials || (p.name || '?').split(/\s+/).map(function(w) { return w[0]; }).join('').slice(0, 2).toUpperCase();
        fb.appendChild(ava);
        tile.appendChild(fb);
      }
      var glow = document.createElement('div');
      glow.className = 'vcall-glow';
      tile.appendChild(glow);
      var tag = document.createElement('div');
      tag.className = 'vcall-nametag';
      var wave = document.createElement('span');
      wave.className = 'vcall-wave';
      for (var b = 0; b < 4; b++) wave.appendChild(document.createElement('span'));
      tag.appendChild(wave);
      var nm = document.createElement('span');
      nm.textContent = p.name || 'Guest';
      tag.appendChild(nm);
      tile.appendChild(tag);
      grid.appendChild(tile);
      return { tile: tile, glow: glow, wave: wave };
    });

    // Recorder bot tile
    var rec = data.recorder || {};
    var bot = document.createElement('div');
    bot.className = 'vcall-bot';
    var bimg = document.createElement('img');
    bimg.src = rec.icon_url || 'https://img.logo.dev/fathom.video?token=pk_B_cdrQLyTkSFPzSMm52goQ&format=png&size=64&fallback=monogram';
    bimg.onerror = function() { this.remove(); };
    bot.appendChild(bimg);
    var bcol = document.createElement('div');
    var bname = document.createElement('div');
    bname.className = 'vcall-bot-name';
    bname.textContent = rec.name || 'Fathom Notetaker';
    var bsub = document.createElement('div');
    bsub.className = 'vcall-bot-sub';
    var bdot = document.createElement('span');
    bdot.className = 'vcall-bot-dot';
    bsub.appendChild(bdot);
    bsub.appendChild(document.createTextNode(rec.status || 'Recording'));
    bcol.appendChild(bname);
    bcol.appendChild(bsub);
    bot.appendChild(bcol);
    grid.appendChild(bot);

    // ── Ambient life, all on the master timeline (deterministic per frame) ──
    // REC dots blink; speaking waveform bars bounce; avatar breathing.
    var period = 1.1;
    var reps = Math.max(1, Math.ceil(dur / period));
    [q('.vcall-rec-dot'), bdot].forEach(function(d) {
      tl.fromTo(d, { opacity: 1 }, { opacity: 0.25, duration: period / 2, yoyo: true, repeat: reps * 2, ease: 'sine.inOut' }, 0);
    });
    tiles.forEach(function(t, i) {
      var bars = t.wave.children;
      for (var b2 = 0; b2 < bars.length; b2++) {
        tl.fromTo(bars[b2], { height: 3 + (b2 % 2) * 2 }, {
          height: 9 + ((b2 + i) % 3) * 3, duration: 0.28 + (b2 % 3) * 0.07,
          yoyo: true, repeat: Math.ceil(dur / 0.3), ease: 'sine.inOut',
        }, 0);
      }
      var face = t.tile.querySelector('img') || t.tile.querySelector('.vcall-fallback');
      if (face) tl.fromTo(face, { scale: 1.015 }, { scale: 1.05, duration: dur, ease: 'sine.inOut' }, 0);
    });

    // Active speaker: glow overlays crossfade on the timeline.
    var first = (data.first_speaker != null ? data.first_speaker : 0);
    tiles.forEach(function(t, i) { gsap.set(t.glow, { autoAlpha: i === first ? 1 : 0 }); });

    // ── Entrance ──
    gsap.set(win, { autoAlpha: 0, scale: 0.985 });
    tl.to(win, { autoAlpha: 1, scale: 1, duration: 0.35, ease: 'power2.out' }, 0.05);
    gsap.set(bot, { autoAlpha: 0, y: 10 });
    tl.to(bot, { autoAlpha: 1, y: 0, duration: 0.3, ease: 'power2.out' }, 0.5);

    // ── Script actions ──
    var capzone = q('.vcall-capzone');
    if (Array.isArray(data.script) && data.script.length) {
      var cursorTargets = data.cursor_targets || {
        'recorder': { x: '84%', y: '76%' },
        'end': { x: '94%', y: '95%' },
      };
      runScript(tl, el, data.script, cursorTargets, ctx, {
        'set-speaker': function(tl2, ctr, action, at) {
          var idx = action.index || 0;
          tiles.forEach(function(t, i) {
            tl2.to(t.glow, { autoAlpha: i === idx ? 1 : 0, duration: 0.25, ease: 'power2.out' }, at);
          });
        },
        'show-caption': function(tl2, ctr, action, at) {
          // Caption nodes are created at BUILD (this handler runs during
          // timeline construction, not playback) and revealed by tweens.
          var cap = document.createElement('div');
          cap.className = 'vcall-cap';
          if (action.speaker != null && participants[action.speaker]) {
            var bb = document.createElement('b');
            bb.textContent = (participants[action.speaker].name || '').split(/\s+/)[0] + ':';
            cap.appendChild(bb);
          }
          cap.appendChild(document.createTextNode(action.text || ''));
          capzone.appendChild(cap);
          gsap.set(cap, { autoAlpha: 0, y: 8 });
          var hold = action.duration || 2.2;
          tl2.to(cap, { autoAlpha: 1, y: 0, duration: 0.25, ease: 'power2.out' }, at);
          tl2.to(cap, { autoAlpha: 0, duration: 0.2, ease: 'power2.in' }, at + hold);
        },
        'pulse-recorder': function(tl2, ctr, action, at) {
          tl2.fromTo(bot, { scale: 1 }, { scale: 1.06, duration: 0.28, ease: 'power2.out' }, at);
          tl2.to(bot, { scale: 1, duration: 0.3, ease: 'back.out(2)' }, at + 0.3);
        },
      });
    }

    return tl;
  }
</script>
