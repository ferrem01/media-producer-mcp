<script>
  function createTimeline(el, data, ctx) {
    var tl = gsap.timeline();
    var q = function (s) { return el.querySelector(s); };
    var win = q('.cds-win');
    var transcript = q('[data-target="transcript"]');
    var inputEl = q('[data-target="input"]');
    var inputBox = q('[data-target="input-box"]');
    var sessionList = q('[data-target="session-list"]');
    var paneHead = q('[data-target="pane-head"]');
    var dur = ctx.duration || 10;

    q('[data-target="app-title"]').textContent = data.app_title || 'Claude Code';
    q('[data-target="model-label"]').textContent = data.model_label || '';
    inputEl.setAttribute('data-placeholder', data.placeholder || 'Reply to Claude…');

    // ── Sessions sidebar ──
    var sessions = Array.isArray(data.sessions) && data.sessions.length ? data.sessions : [
      { project: 'acme-api', title: 'Fix flaky auth tests', status: 'working' },
      { project: 'marketing-site', title: 'Ship pricing page', status: 'input' },
      { project: 'mobile-app', title: 'Migrate to SDK v3', status: 'done' },
    ];
    var activeIdx = Number(data.active_session) || 0;
    var sessionEls = [];
    var STATUS_BADGE = { working: 'running', input: 'needs input', done: 'done' };
    function renderSessionRow(s, i) {
      var d = document.createElement('div');
      d.className = 'cds-session' + (i === activeIdx ? ' is-active' : '');
      d.setAttribute('data-target', 'session-' + i);
      var badge = s.status && STATUS_BADGE[s.status]
        ? '<span class="cds-sess-badge ' + s.status + '">' + STATUS_BADGE[s.status] + '</span>' : '';
      d.innerHTML = '<div class="cds-sess-top">' +
          '<span class="cds-sess-status ' + (s.status || 'idle') + '"></span>' +
          '<span class="cds-sess-project">' + (s.project || 'project') + '</span>' + badge +
        '</div>' +
        '<div class="cds-sess-title">' + (s.title || '') + '</div>';
      return d;
    }
    sessions.forEach(function (s, i) {
      var d = renderSessionRow(s, i);
      sessionList.appendChild(d);
      sessionEls.push(d);
    });
    function setPaneHead(i) {
      var s = sessions[i] || {};
      paneHead.textContent = (s.project || 'project') + (s.title ? ' — ' + s.title : '');
    }
    setPaneHead(activeIdx);

    function setSessionStatus(i, status) {
      var s = sessions[i];
      var elRow = sessionEls[i];
      if (!s || !elRow) return;
      s.status = status;
      var fresh = renderSessionRow(s, i);
      fresh.className = 'cds-session' + (elRow.classList.contains('is-active') ? ' is-active' : '');
      elRow.replaceWith(fresh);
      sessionEls[i] = fresh;
      var dot = fresh.querySelector('.cds-sess-status');
      gsap.from(dot, { scale: 0, duration: 0.35, ease: 'back.out(2)' });
    }

    // ── Transcript blocks ──
    function scrollDown() { transcript.scrollTop = transcript.scrollHeight; }
    function addBlock(node, animate) {
      transcript.appendChild(node);
      if (animate !== false) {
        gsap.set(node, { autoAlpha: 0, y: 8 });
        gsap.to(node, { autoAlpha: 1, y: 0, duration: 0.3, ease: 'power2.out' });
      }
      scrollDown();
      return node;
    }
    function md(text) {
      var h = String(text || '');
      h = h.replace(/`([^`]+)`/g, '<code>$1</code>');
      h = h.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
      return h;
    }
    function userEl(text) {
      var d = document.createElement('div'); d.className = 'cds-user'; d.textContent = String(text || ''); return d;
    }
    function textEl(text) {
      var d = document.createElement('div'); d.className = 'cds-text'; d.innerHTML = md(text); return d;
    }
    function toolEl(t) {
      var d = document.createElement('div');
      d.className = 'cds-tool';
      var html = '<div class="cds-tool-head"><span class="tdot">⏺</span><span class="tname">' +
        (t.tool || 'Bash') + '</span><span class="targ">(' + (t.target || '') + ')</span></div>';
      if (t.result) html += '<div class="cds-tool-result">' + String(t.result) + '</div>';
      d.innerHTML = html;
      if (t.diff && t.diff.length) {
        var diff = document.createElement('div');
        diff.className = 'cds-diff';
        t.diff.forEach(function (ln) {
          var row = document.createElement('div');
          var kind = typeof ln === 'string'
            ? (ln.charAt(0) === '+' ? 'add' : ln.charAt(0) === '-' ? 'del' : 'ctx')
            : (ln.kind || 'ctx');
          row.className = 'cds-diff-line ' + kind;
          row.textContent = typeof ln === 'string' ? ln.replace(/^[+-]\s?/, '') : (ln.text || '');
          diff.appendChild(row);
        });
        d.appendChild(diff);
      }
      return d;
    }

    // ── Working spinner + master-timeline counter (scrub-safe) ──
    var workingEl = null;
    function showWorking(opts) {
      opts = opts || {};
      removeWorking();
      var d = document.createElement('div');
      d.className = 'cds-working';
      d.innerHTML = '<span class="star">✳</span><span class="cds-working-verb">' +
        (opts.text || 'Working…') + '</span><span class="cds-working-meta"></span>';
      addBlock(d);
      workingEl = d;
      gsap.to(d.querySelector('.star'), { rotation: 360, duration: 2.4, repeat: -1, ease: 'none', transformOrigin: '50% 50%' });
    }
    function removeWorking() {
      if (!workingEl) return;
      gsap.killTweensOf(workingEl.querySelector('.star'));
      if (workingEl.parentNode) workingEl.parentNode.removeChild(workingEl);
      workingEl = null;
    }
    function addWorkingCounter(tlRef, at, opts) {
      var proxy = { t: 0 };
      var rate = Number((opts || {}).tokens_per_s) || 260;
      var span = Math.max(0.5, dur - at);
      tlRef.to(proxy, {
        t: span, duration: span, ease: 'none',
        onUpdate: function () {
          if (!workingEl) return;
          var meta = workingEl.querySelector('.cds-working-meta');
          if (!meta) return;
          var s = Math.floor(proxy.t);
          var tok = proxy.t * rate;
          var tokLabel = tok >= 1000 ? (tok / 1000).toFixed(1) + 'k' : String(Math.floor(tok));
          meta.textContent = '(' + s + 's · ↑ ' + tokLabel + ' tokens · esc to interrupt)';
        },
      }, at);
    }
    function streamText(tlRef, text, at, secs) {
      var d = textEl('');
      var words = String(text || '').split(/(\s+)/);
      var full = md(text);
      tlRef.call(function () { removeWorking(); addBlock(d); }, null, at);
      var proxy = { n: 0 };
      tlRef.to(proxy, {
        n: words.length, duration: Math.max(0.6, secs || Math.min(2.8, words.length * 0.045)), ease: 'none',
        onUpdate: function () { d.innerHTML = md(words.slice(0, Math.ceil(proxy.n)).join('')); scrollDown(); },
        onComplete: function () { d.innerHTML = full; scrollDown(); },
      }, at + 0.05);
    }

    // ── Initial history for the active pane ──
    (Array.isArray(data.history) ? data.history : []).forEach(function (h) {
      if (h.type === 'user') addBlock(userEl(h.text), false);
      else if (h.type === 'tool') addBlock(toolEl(h), false);
      else addBlock(textEl(h.text), false);
    });

    // ── Entrance ──
    gsap.set(win, { autoAlpha: 0, y: 24 });
    tl.to(win, { autoAlpha: 1, y: 0, duration: 0.5, ease: 'power3.out' }, 0.15);
    var initRows = sessionEls.concat(Array.prototype.slice.call(transcript.children));
    gsap.set(initRows, { autoAlpha: 0, y: 8 });
    initRows.forEach(function (b, i) {
      tl.to(b, { autoAlpha: 1, y: 0, duration: 0.3, ease: 'power2.out' }, 0.4 + i * 0.1);
    });

    var cursorTargets = data.cursor_targets || {
      'input': function () {
        var b = inputBox.getBoundingClientRect();
        var p = el.getBoundingClientRect();
        return { x: ((b.left + b.width / 2 - p.left) / p.width * 100) + '%',
                 y: ((b.top + b.height / 2 - p.top) / p.height * 100) + '%' };
      },
    };
    sessions.forEach(function (s, i) {
      cursorTargets['session-' + i] = function () {
        var b = sessionEls[i].getBoundingClientRect();
        var p = el.getBoundingClientRect();
        return { x: ((b.left + b.width / 2 - p.left) / p.width * 100) + '%',
                 y: ((b.top + b.height / 2 - p.top) / p.height * 100) + '%' };
      };
    });

    // ── Script ──
    if (data.script && data.script.length > 0) {
      runScript(tl, el, data.script, cursorTargets, ctx, {
        'type-prompt': function (tl, ctr, action, at) {
          tl.call(function () { inputBox.classList.add('is-active'); }, null, at);
          typeText(tl, inputEl, action.text || '', at, action.speed || 30);
        },
        'send-prompt': function (tl, ctr, action, at) {
          tl.call(function () {
            var txt = inputEl.textContent;
            if (!txt) return;
            addBlock(userEl(txt));
            inputEl.textContent = '';
            inputBox.classList.remove('is-active');
          }, null, at);
        },
        'working': function (tl, ctr, action, at) {
          tl.call(function () { showWorking(action); }, null, at);
          addWorkingCounter(tl, at, action);
        },
        'stop-working': function (tl, ctr, action, at) { tl.call(removeWorking, null, at); },
        'tool-call': function (tl, ctr, action, at) {
          tl.call(function () {
            removeWorking();
            addBlock(toolEl(action));
            if (action.then_working !== false) showWorking({ text: action.working_text || 'Working…' });
          }, null, at);
          if (action.then_working !== false) addWorkingCounter(tl, at + 0.05, action);
        },
        'respond': function (tl, ctr, action, at) { streamText(tl, action.text || '', at, action.duration); },
        'claude-text': function (tl, ctr, action, at) {
          tl.call(function () { removeWorking(); addBlock(textEl(action.text || '')); }, null, at);
        },
        'switch-session': function (tl, ctr, action, at) {
          tl.call(function () {
            var idx = Number(action.index) || 0;
            removeWorking();
            sessionEls.forEach(function (row, i) { row.classList.toggle('is-active', i === idx); });
            activeIdx = idx;
            setPaneHead(idx);
            if (action.clear !== false) transcript.innerHTML = '';
            (action.history || []).forEach(function (h) {
              if (h.type === 'user') addBlock(userEl(h.text), false);
              else if (h.type === 'tool') addBlock(toolEl(h), false);
              else addBlock(textEl(h.text), false);
            });
            gsap.from(transcript.children.length ? transcript.children : transcript,
              { autoAlpha: 0, y: 8, duration: 0.3, stagger: 0.06, ease: 'power2.out' });
          }, null, at);
        },
        'session-status': function (tl, ctr, action, at) {
          tl.call(function () { setSessionStatus(Number(action.index) || 0, action.status || 'done'); }, null, at);
        },
      });
    }

    return tl;
  }
</script>
