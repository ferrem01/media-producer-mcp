<style scoped>

<script>
  function createTimeline(el, data, ctx) {
    var tl = gsap.timeline();
    var root = el.querySelector('.aia');
    var W = el.clientWidth || 1600, H = el.clientHeight || 800;
    var num = function (v, d) { var n = Number(v); return v !== undefined && v !== null && v !== '' && isFinite(n) ? n : d; };
    var esc = function (s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); };
    var search = data.search && typeof data.search === 'object' && Array.isArray(data.search.results) && data.search.results.length ? data.search : null;
    if (!search) root.classList.add('no-serp');
    // One type scale for the whole prop, from the box it was given.
    root.style.fontSize = Math.max(11, Math.min(30, Math.min(W / (search ? 62 : 40), H / 30))) + 'px';
    if (data.accent) root.style.setProperty('--aia-accent', String(data.accent));
    var AT = Math.max(0, num(data.at, 0.3));
    var chat = el.querySelector('.aia-chat'), serp = el.querySelector('.aia-serp');

    // The cards arrive.
    gsap.set(chat, { autoAlpha: 0, y: H * 0.04 });
    tl.to(chat, { autoAlpha: 1, y: 0, duration: 0.5, ease: 'power3.out' }, AT);

    // The question, typed.
    var qt = el.querySelector('.aia-qt'), q = String(data.question || 'What is the best way to do this?');
    var qs = Math.max(0.012, num(data.type_speed, 0.03)), qAt = AT + 0.35;
    q.split('').forEach(function (ch, i) {
      var s = document.createElement('span'); s.textContent = ch; s.style.display = 'none'; qt.appendChild(s);
      tl.set(s, { display: 'inline' }, qAt + i * qs);
    });
    var qEnd = qAt + q.length * qs;

    // The answer, written out word by word; [1] becomes a citation chip.
    var ans = el.querySelector('.aia-a'), words = String(data.answer || '').split(/\s+/).filter(Boolean);
    var ws = Math.max(0.015, num(data.word_speed, 0.045)), aAt = qEnd + 0.35;
    words.forEach(function (w, i) {
      var m = w.match(/^\[(\d+)\]([.,;:!?]*)$/), s = document.createElement('span'); s.className = 'aia-w';
      if (m) { s.className += ' aia-wc'; s.innerHTML = '<span class="aia-cite">' + m[1] + '</span>' + esc(m[2]) + ' '; }
      else s.textContent = w + ' ';
      ans.appendChild(s);
      tl.set(s, { display: 'inline' }, aAt + i * ws);
    });
    var aEnd = aAt + words.length * ws;

    // The sources: the cited one is yours -- ringed, labelled.
    var srcs = Array.isArray(data.sources) && data.sources.length ? data.sources.slice(0, 3) : [{ domain: 'yourbrand.com', title: 'Your article' }];
    var cite = Math.max(0, Math.min(srcs.length - 1, Math.round(num(data.cite, 0))));
    var box = el.querySelector('.aia-srcs'), FAV = ['#393bf5', '#16b364', '#e2187b', '#f59e0b'];
    var ours = null;
    srcs.forEach(function (s, i) {
      var d = document.createElement('div'); d.className = 'aia-src' + (i === cite ? ' is-ours' : '');
      d.innerHTML = (s.image ? '<img src="' + esc(s.image) + '" alt="">' : '<span class="aia-fav" style="background:' + FAV[i % FAV.length] + '">' + esc(String(s.domain || '?').charAt(0).toUpperCase()) + '</span>')
        + '<div class="aia-st"><b>' + esc(s.title) + '</b><span>' + esc(s.domain) + '</span></div>';
      box.appendChild(d);
      gsap.set(d, { autoAlpha: 0, y: 12 });
      tl.to(d, { autoAlpha: 1, y: 0, duration: 0.35, ease: 'power3.out' }, aEnd + 0.1 + i * 0.1);
      if (i === cite) ours = d;
    });
    var litAt = aEnd + 0.1 + srcs.length * 0.1 + 0.2;
    if (ours) {
      var ring = document.createElement('div'); ring.className = 'aia-ring'; ours.appendChild(ring);
      var badge = document.createElement('div'); badge.className = 'aia-badge'; badge.textContent = String(data.highlight_label || 'Your post'); ours.appendChild(badge);
      gsap.set(badge, { autoAlpha: 0, scale: 0.6 });
      tl.to(ring, { opacity: 1, duration: 0.25 }, litAt);
      tl.to(ring, { scale: 1.06, opacity: 0, duration: 0.7, ease: 'power2.out' }, litAt + 0.25);
      tl.to(ours, { scale: 1.04, duration: 0.25, ease: 'back.out(3)' }, litAt);
      tl.to(badge, { autoAlpha: 1, scale: 1, duration: 0.3, ease: 'back.out(2.5)' }, litAt + 0.05);
    }

    // The search: the same question, your result climbing to the top.
    if (search) {
      el.querySelector('.aia-query').textContent = String(search.query || q);
      var rows = el.querySelector('.aia-rows'), res = search.results.slice(0, 5);
      var mine = Math.max(0, Math.min(res.length - 1, Math.round(num(search.ours, 0))));
      var start = Math.max(1, Math.min(res.length - 1, Math.round(num(search.from, res.length - 1))));
      // The order before: yours at `start`, the others in theirs.
      var others = res.filter(function (_, i) { return i !== mine; });
      var before = others.slice(0, start).concat([res[mine]]).concat(others.slice(start));
      var rh = 4.9, els = [];
      before.forEach(function (r, k) {
        var d = document.createElement('div'); d.className = 'aia-row' + (r === res[mine] ? ' is-ours' : '');
        d.innerHTML = '<span class="aia-rank">' + (k + 1) + '</span><div class="aia-rt"><span>' + esc(r.domain) + '</span><b>' + esc(r.title) + '</b><i>' + esc(r.snippet || '') + '</i></div>';
        d.style.top = (k * rh) + 'em';
        rows.appendChild(d); els.push({ el: d, r: r });
      });
      var sAt = num(search.at, NaN); if (!isFinite(sAt)) sAt = AT + 0.4;
      gsap.set(serp, { autoAlpha: 0, y: H * 0.04 });
      tl.to(serp, { autoAlpha: 1, y: 0, duration: 0.5, ease: 'power3.out' }, sAt);
      var climb = num(search.climb_at, NaN); if (!isFinite(climb)) climb = litAt + 0.2;
      els.forEach(function (o, k) {
        var to = o.r === res[mine] ? 0 : (k < start ? k + 1 : k);
        if (to === k) return;
        tl.to(o.el, { top: (to * rh) + 'em', duration: 0.8, ease: 'power3.inOut' }, climb);
        // The new rank swaps in mid-move (two numbers, toggled: scrub-safe).
        var rk = o.el.querySelector('.aia-rank');
        rk.innerHTML = '<span class="aia-r0">' + (k + 1) + '</span><span class="aia-r1" style="display:none">' + (to + 1) + '</span>';
        tl.set(rk.querySelector('.aia-r0'), { display: 'none' }, climb + 0.4);
        tl.set(rk.querySelector('.aia-r1'), { display: 'inline' }, climb + 0.4);
      });
      var mineEl = els.filter(function (o) { return o.r === res[mine]; })[0];
      if (mineEl) tl.to(mineEl.el, { scale: 1.03, duration: 0.25, yoyo: true, repeat: 1, ease: 'power2.out' }, climb + 0.8);
    }
    return tl;
  }
</script>
