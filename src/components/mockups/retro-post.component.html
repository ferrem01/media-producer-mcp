<script>
  function createTimeline(el, data, ctx) {
    var tl = gsap.timeline();
    var card = el.querySelector('.rpost-card');
    var typed = el.querySelector('.rpost-typed');
    var caret = el.querySelector('.rpost-caret');
    var share = el.querySelector('.rpost-share');

    var text = String(data.text || '');
    var at = data.at !== undefined ? Number(data.at) : 0.4;
    // chars per second, matching typewriter (NOT composer's seconds-per-char).
    var speed = Number(data.speed) > 0 ? Number(data.speed) : 26;
    // Same continuation contract as typewriter.pretyped: a prefix (string or
    // count) standing from frame one, typing picks up mid-sentence -- the era
    // jump carries the SAME sentence, it never restarts it.
    var pre = typeof data.pretyped === 'string' ? data.pretyped.length : Math.floor(Number(data.pretyped) || 0);
    pre = Math.max(0, Math.min(text.length, pre));

    var spans = [];
    for (var i = 0; i < text.length; i++) {
      var sp = document.createElement('span');
      sp.textContent = text[i];
      if (i < pre) sp.style.visibility = 'visible';
      typed.appendChild(sp);
      spans.push(sp);
    }
    var per = 1 / speed;
    for (var j = pre; j < text.length; j++) {
      tl.set(spans[j], { visibility: 'visible' }, at + (j - pre) * per);
    }
    var typedEnd = at + (text.length - pre) * per;

    // Card rises in; caret blinks deterministically; Share pops when typed.
    gsap.set(card, { autoAlpha: 0, y: 14 });
    tl.to(card, { autoAlpha: 1, y: 0, duration: 0.4, ease: 'power3.out' }, Math.max(0, at - 0.35));
    tl.to(caret, { opacity: 0, duration: 0.05, repeat: 13, yoyo: true, repeatDelay: 0.38, ease: 'none' }, 0.2);
    gsap.set(share, { autoAlpha: 0, scale: 0.85 });
    tl.to(share, { autoAlpha: 1, scale: 1, duration: 0.3, ease: 'back.out(2)' }, Math.min(typedEnd + 0.2, ctx.duration - 0.6));

    return tl;
  }
</script>
