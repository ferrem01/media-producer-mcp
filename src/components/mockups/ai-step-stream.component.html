<template>
  <div class="as-root">
    <div class="as-stage">
      <div class="as-wire as-wire-in"></div>
      <div class="as-wire as-wire-out"></div>
      <div class="as-lanes"></div>
      <div class="as-step">
        <div class="as-chip"><span class="as-chip-ic"></span><span class="as-chip-t">Step</span></div>
        <div class="as-hd"><span class="as-ic"></span><span class="as-title"></span></div>
        <div class="as-sub"></div>
        <div class="as-shine"></div>
      </div>
    </div>
  </div>
</template>

<style>
  /* AI STEP STREAM: one AI step, a different output for every person. Lead
     cards (photo, name, company, what they did) stream in from the left and
     pass into a single flow step drawn in the product's own card look; the
     step shimmers while it thinks, and out the right comes that person's own
     email (To, subject, first line). The first few go one at a time, slow
     enough to read; then the gaps shrink and it becomes a stream. The AI
     beat of an automation film: a template sends everyone the same thing,
     this writes for each person. 1440-wide design stage at the box's aspect,
     scaled to the box. */
  .as-root, .as-root * { max-width: none; }
  .as-root { position: relative; width: 100%; height: 100%; overflow: hidden; border-radius: inherit; }
  .as-stage {
    position: absolute; left: 0; top: 0; transform-origin: 0 0; overflow: hidden;
    background-color: var(--as-bg, #f9f9fb);
    background-image: radial-gradient(rgba(23, 23, 28, 0.13) 1.4px, transparent 1.6px);
    background-size: 26px 26px;
    color: #17171c; font-family: var(--mp-font-family, 'Inter', system-ui, -apple-system, sans-serif);
  }
  .as-wire { position: absolute; height: 2px; background: #d6d6e0; }
  .as-step {
    position: absolute; box-sizing: border-box; width: 300px; padding: 20px 18px;
    display: flex; flex-direction: column; align-items: center; gap: 6px; overflow: visible;
    background: #fff; border: 1.5px solid rgb(232, 233, 242); border-radius: 16px;
    box-shadow: 0 14px 30px rgba(12, 12, 66, 0.06), 0 1px 3px rgba(40, 28, 65, 0.06);
  }
  .as-chip {
    position: absolute; left: 50%; top: -34px; transform: translateX(-50%); display: flex; align-items: center; gap: 6px;
    height: 34px; box-sizing: border-box; padding: 4px 14px; white-space: nowrap;
    border: 1.5px solid rgb(232, 233, 242); border-bottom: 0; border-radius: 14px 14px 0 0;
    background: #f9f9fb; font-size: 18px; color: #3b3b46;
  }
  .as-chip-ic svg, .as-ic svg { display: block; }
  .as-hd { display: flex; align-items: center; gap: 8px; font-size: 24px; font-weight: 600; }
  .as-sub { font-size: 19px; color: rgb(84, 84, 95); text-align: center; }
  .as-sub:empty { display: none; }
  .as-shine {
    position: absolute; inset: 0; border-radius: inherit; pointer-events: none; overflow: hidden; opacity: 0;
  }
  .as-shine:before {
    content: ""; position: absolute; top: -20%; bottom: -20%; width: 45%; left: -50%;
    background: linear-gradient(100deg, transparent, color-mix(in srgb, var(--as-acc, #393bf5) 22%, transparent), transparent);
    transform: translateX(var(--as-sx, 0%));
  }
  .as-lanes { position: absolute; inset: 0; }
  .as-lead, .as-mail {
    position: absolute; left: 0; top: 0; box-sizing: border-box; background: #fff;
    border: 1.5px solid #ececf3; box-shadow: 0 10px 24px rgba(20, 20, 60, 0.07);
    visibility: hidden;
  }
  .as-lead { width: 300px; padding: 20px 22px; border-radius: 18px; }
  .as-lr { display: flex; align-items: center; gap: 14px; }
  .as-ph { width: 54px; height: 54px; flex: none; border-radius: 50%; background: #e9e9ef center 22% / 128% no-repeat; }
  .as-nm { font-size: 22px; font-weight: 700; letter-spacing: -0.01em; white-space: nowrap; }
  .as-co { font-size: 17px; color: #8a8a96; margin-top: 2px; white-space: nowrap; }
  .as-did { margin-top: 14px; font-size: 18px; font-weight: 700; color: var(--as-acc2, #393bf5); }
  .as-mail { width: 400px; padding: 20px 24px 22px; border-radius: 16px; }
  .as-to { display: flex; align-items: center; gap: 10px; font-size: 16px; color: #8a8a96; }
  .as-to .as-ph { width: 30px; height: 30px; }
  .as-to b { color: #3b3b46; font-weight: 600; }
  .as-sj { margin-top: 12px; font-size: 21px; font-weight: 700; letter-spacing: -0.01em; }
  .as-ln { margin-top: 6px; font-size: 17px; line-height: 1.45; color: #54545f; }
</style>

<script>
  function createTimeline(el, data, ctx) {
    var tl = gsap.timeline();
    data = data || {};
    var q = function (s) { return el.querySelector(s); };
    var num = function (v, d) { var n = Number(v); return (v === null || v === undefined || v === '' || !isFinite(n)) ? d : n; };
    var root = q('.as-root'), stage = q('.as-stage');
    var DUR = (ctx && ctx.duration) || 6;

    var bw = el.clientWidth || 1440, bh = el.clientHeight || 810;
    var DW = 1440, DH = Math.max(700, Math.round(DW * bh / bw));
    stage.style.width = DW + 'px'; stage.style.height = DH + 'px';
    var S = bw / DW;
    if (DH * S > bh + 1) { S = bh / DH; stage.style.transform = 'translateX(' + ((bw - DW * S) / 2) + 'px) scale(' + S + ')'; }
    else stage.style.transform = 'scale(' + S + ')';
    var ACC = String(data.accent || '#393bf5');
    root.style.setProperty('--as-acc', ACC);
    if (data.background) root.style.setProperty('--as-bg', String(data.background));
    if (data.lead_accent) root.style.setProperty('--as-acc2', String(data.lead_accent));

    var SPARK = '<svg viewBox="0 0 24 24" width="26" height="26" fill="' + ACC + '"><path d="M9.937 15.5A2 2 0 0 0 8.5 14.063l-6.135-1.582a.5.5 0 0 1 0-.962L8.5 9.936A2 2 0 0 0 9.937 8.5l1.582-6.135a.5.5 0 0 1 .963 0L14.063 8.5A2 2 0 0 0 15.5 9.937l6.135 1.581a.5.5 0 0 1 0 .964L15.5 14.063a2 2 0 0 0-1.437 1.437l-1.582 6.135a.5.5 0 0 1-.963 0z"/></svg>';
    var ZAP = '<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="#3b3b46" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 14a1 1 0 0 1-.78-1.63l9.9-10.2a.5.5 0 0 1 .86.46l-1.92 6.02A1 1 0 0 0 13 10h7a1 1 0 0 1 .78 1.63l-9.9 10.2a.5.5 0 0 1-.86-.46l1.92-6.02A1 1 0 0 0 11 14z"/></svg>';
    q('.as-ic').innerHTML = SPARK;
    q('.as-chip-ic').innerHTML = ZAP;
    q('.as-chip-t').textContent = String(data.chip || 'Step');
    q('.as-title').textContent = String(data.title || 'AI Email');
    q('.as-sub').textContent = data.subtitle !== undefined ? String(data.subtitle || '') : 'Written for each person';

    // Geometry on the stage: the step in the middle, the lanes either side.
    var CY = Math.round(DH / 2);
    var step = q('.as-step');
    gsap.set(step, { left: DW / 2 - 150, top: CY - 62 });
    var SX = DW / 2, LQ = 250, MX = DW - 300;   // lead queue x (centre), mail rest x (centre)
    gsap.set(q('.as-wire-in'), { left: LQ + 150, top: CY, width: SX - 150 - LQ - 150 });
    gsap.set(q('.as-wire-out'), { left: SX + 150, top: CY, width: MX - 200 - SX - 150 });

    var people = (Array.isArray(data.leads) ? data.leads : []).filter(function (p) { return p && typeof p === 'object'; });
    if (!people.length) people = [
      { name: 'Sarah Chen', company: 'Northwind', did: 'Signed up', subject: 'Welcome, Sarah', line: 'Since Northwind is a small team, start with the issue on finding your first ten accounts.' },
      { name: 'Daniel Fischer', company: 'Meridian', did: 'Viewed pricing 3 times', subject: 'Growth or Scale, Daniel?', line: 'You have been comparing plans this week. For a team your size, Growth covers it.' },
      { name: 'Tom Lee', company: 'Copperline', did: 'Quiet for 6 months', subject: 'Still rebuilding the funnel?', line: 'Last spring you were rebuilding it at Copperline. Here is what changed since.' }
    ];

    // The schedule: `slow` items one at a time (`slow_gap` apart, readable),
    // then `fast_gap` apart (cycling the people) until `until`.
    var AT = num(data.at, 0.15), SLOW = Math.max(0, Math.round(num(data.slow, 3)));
    var SG = num(data.slow_gap, 0.9), FG = Math.max(0.08, num(data.fast_gap, 0.18));
    var UNTIL = Math.min(DUR, num(data.until, DUR));
    var times = [];
    for (var i = 0; i < SLOW; i++) times.push(AT + i * SG);
    // A fast item's email comes out sooner after it starts (1.1 s slow vs
    // 0.55 s fast), so hold the stream back by the difference: the last slow
    // email gets its full slow_gap on screen before the next one pushes it.
    var LAT = 1.1, FLAT = 0.55;
    var tf = AT + SLOW * SG + (SLOW ? LAT - FLAT : 0);
    for (; tf < UNTIL - 0.5; tf += FG) times.push(tf);

    var lanes = q('.as-lanes');
    function photo(url) { return url ? 'background-image:url("' + String(url).replace(/"/g, '%22') + '")' : ''; }
    function card(cls, html) { var d = document.createElement('div'); d.className = cls; d.innerHTML = html; lanes.appendChild(d); return d; }
    function esc(s) { var d = document.createElement('div'); d.textContent = String(s || ''); return d.innerHTML; }

    var shine = q('.as-shine');
    var mails = [];
    times.forEach(function (t, k) {
      var p = people[k % people.length];
      var f = k < SLOW ? 1 : 0.5;                        // fast items move at twice the speed
      // The stream spreads over rows that converge into the step and fan out
      // again (one row while it is slow: a single readable line).
      var ROWS = [0, -1, 1, -2, 2, -0.5, 1.5, -1.5, 0.5];
      var dy = k < SLOW ? 0 : ROWS[(k - SLOW) % ROWS.length] * Math.min(150, DH * 0.17);
      var lead = card('as-lead', '<div class="as-lr"><div class="as-ph" style=\'' + photo(p.photo) + '\'></div><div><div class="as-nm">' + esc(p.name) + '</div><div class="as-co">' + esc(p.company) + '</div></div></div>' +
        (p.did ? '<div class="as-did">' + esc(p.did) + '</div>' : ''));
      var mail = card('as-mail', '<div class="as-to"><div class="as-ph" style=\'' + photo(p.photo) + '\'></div><span>To <b>' + esc(p.name) + '</b></span></div>' +
        '<div class="as-sj">' + esc(p.subject) + '</div><div class="as-ln">' + esc(p.line) + '</div>');
      // Lead: in from the left edge, a beat in the queue, then into the step.
      var ly = CY - 60;
      gsap.set(lead, { x: -340, y: ly + dy, scale: 1, autoAlpha: 0 });
      tl.set(lead, { visibility: 'visible' }, t);
      tl.fromTo(lead, { x: -340, autoAlpha: 1 }, { x: LQ - 150, duration: 0.35 * f, ease: 'power3.out', immediateRender: false }, t);
      var into = t + 0.35 * f + 0.15 * f;
      tl.to(lead, { x: SX - 150, y: ly, scale: 0.35, autoAlpha: 0, duration: 0.3 * f, ease: 'power2.in' }, into);
      // The step thinks: a glow and a sheen across it.
      var think = into + 0.25 * f;
      tl.fromTo(step, { boxShadow: '0 0 0 0px ' + ACC + '00, 0 14px 30px rgba(12,12,66,0.06)' },
        { boxShadow: '0 0 0 4px ' + ACC + '55, 0 14px 30px rgba(12,12,66,0.06)', duration: 0.12 * f, yoyo: true, repeat: 1, immediateRender: false }, think);
      tl.fromTo(shine, { opacity: 1, '--as-sx': '0%' }, { '--as-sx': '330%', duration: 0.4 * f, ease: 'power1.inOut', immediateRender: false }, think);
      tl.set(shine, { opacity: 0 }, think + 0.4 * f);
      // The person's own email comes out the right and rests in the lane.
      var out = think + 0.35 * f;
      var my = CY - 80;
      gsap.set(mail, { x: SX - 200, y: my, scale: 0.4, autoAlpha: 0 });
      tl.set(mail, { visibility: 'visible' }, out);
      tl.fromTo(mail, { x: SX - 200, y: my, scale: 0.4, autoAlpha: 0 }, { x: MX - 200, y: my + dy, scale: 1, autoAlpha: 1, duration: 0.4 * f, ease: 'power3.out', immediateRender: false }, out);
      mails.push({ el: mail, out: out, f: f });
    });
    // Each email leaves when the next one arrives (or at the end): one at a
    // time while it is slow, a stream when it is fast.
    mails.forEach(function (m, k) {
      var next = mails[k + 1];
      var leave = next ? next.out + 0.05 : UNTIL + 1;
      if (leave >= DUR) return;
      tl.to(m.el, { x: DW + 60, autoAlpha: 0.0, duration: 0.45 * (next ? next.f : 1), ease: 'power2.in' }, leave);
    });

    // Entrance of the step itself.
    if (data.still !== true) tl.from(step, { autoAlpha: 0, scale: 0.92, duration: 0.35, ease: 'power3.out' }, Math.max(0, AT - 0.15));
    return tl;
  }
</script>
