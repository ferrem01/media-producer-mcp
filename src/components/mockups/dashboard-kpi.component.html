<script>
  function createTimeline(el, data, ctx) {
    var tl = gsap.timeline();
    var frame = el.querySelector('.dashboard-frame');
    var topbar = el.querySelector('.dashboard-topbar');
    var grid = el.querySelector('.kpi-grid');
    var titleEl = el.querySelector('.topbar-title');

    titleEl.textContent = data.title || 'Dashboard';

    var metrics = data.metrics || [];
    var cols = metrics.length <= 2 ? metrics.length : metrics.length <= 3 ? 3 : metrics.length <= 4 ? 2 : 3;
    grid.style.gridTemplateColumns = 'repeat(' + cols + ', 1fr)';

    var cardEls = [];
    var counterObjs = [];

    for (var i = 0; i < metrics.length; i++) {
      var m = metrics[i];
      var card = document.createElement('div');
      card.className = 'kpi-card';

      // Label row with status dot
      var labelRow = document.createElement('div');
      labelRow.className = 'kpi-label-row';

      var label = document.createElement('div');
      label.className = 'kpi-label';
      label.textContent = m.label || '';
      labelRow.appendChild(label);

      // Status dot based on change
      var dot = document.createElement('div');
      var dotColor = m.change === undefined ? 'green' : m.change >= 5 ? 'green' : m.change >= 0 ? 'yellow' : 'red';
      dot.className = 'kpi-status-dot ' + dotColor;
      labelRow.appendChild(dot);

      card.appendChild(labelRow);

      var valueRow = document.createElement('div');
      valueRow.className = 'kpi-value-row';

      var valueEl = document.createElement('div');
      valueEl.className = 'kpi-value';
      valueEl.textContent = (m.prefix || '') + '0' + (m.suffix || '');
      valueRow.appendChild(valueEl);

      if (m.change !== undefined && m.change !== null) {
        var changeEl = document.createElement('div');
        changeEl.className = 'kpi-change ' + (m.change >= 0 ? 'up' : 'down');
        var arrow = m.change >= 0 ? '▲ ' : '▼ ';
        changeEl.textContent = arrow + (m.change >= 0 ? '+' : '') + m.change + '%';
        valueRow.appendChild(changeEl);
      }
      card.appendChild(valueRow);

      // Sparkline chart
      var chartData = m.chart_data;
      if (chartData && chartData.length > 1) {
        var svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
        svg.setAttribute('class', 'kpi-sparkline');
        svg.setAttribute('viewBox', '0 0 200 40');
        svg.setAttribute('preserveAspectRatio', 'none');

        var min = Math.min.apply(null, chartData);
        var max = Math.max.apply(null, chartData);
        var range = max - min || 1;
        var points = [];
        for (var p = 0; p < chartData.length; p++) {
          var x = (p / (chartData.length - 1)) * 200;
          var y = 38 - ((chartData[p] - min) / range) * 34;
          points.push(x + ',' + y);
        }

        var strokeColor = (m.change !== undefined && m.change < 0) ? '#f87171' : '#A78BFA';

        var fillPath = document.createElementNS('http://www.w3.org/2000/svg', 'path');
        fillPath.setAttribute('class', 'spark-fill');
        fillPath.setAttribute('d', 'M0,40 L' + points.join(' L') + ' L200,40 Z');
        fillPath.setAttribute('fill', strokeColor);
        svg.appendChild(fillPath);

        var linePath = document.createElementNS('http://www.w3.org/2000/svg', 'path');
        linePath.setAttribute('d', 'M' + points.join(' L'));
        linePath.setAttribute('stroke', strokeColor);
        svg.appendChild(linePath);

        card.appendChild(svg);
      }

      grid.appendChild(card);
      cardEls.push(card);
      counterObjs.push({
        el: valueEl,
        target: m.value || 0,
        prefix: m.prefix || '',
        suffix: m.suffix || ''
      });
    }

    // Initial states
    gsap.set(topbar, { autoAlpha: 0, y: -15 });
    gsap.set(cardEls, { autoAlpha: 0, y: 30, scale: 1.05, filter: 'blur(4px)' });

    var speed = ctx.motion === 'minimal' ? 0.4 : ctx.motion === 'punchy' ? 0.6 : 0.8;
    var stagger = ctx.motion === 'minimal' ? 0.06 : 0.1;

    // Topbar entrance
    tl.to(topbar, {
      autoAlpha: 1, y: 0,
      duration: speed * 0.6,
      ease: 'power2.out'
    }, 0.3);

    // Cards entrance
    tl.to(cardEls, {
      autoAlpha: 1, y: 0, scale: 1, filter: 'blur(0px)',
      duration: speed,
      stagger: stagger,
      ease: 'power3.out'
    }, 0.5);

    // Count up numbers
    for (var k = 0; k < counterObjs.length; k++) {
      (function(obj, idx) {
        var counter = { val: 0 };
        tl.to(counter, {
          val: obj.target,
          duration: speed * 1.5,
          ease: 'power2.out',
          onUpdate: function() {
            var v = obj.target >= 1000
              ? Math.round(counter.val).toLocaleString()
              : counter.val % 1 !== 0
                ? counter.val.toFixed(1)
                : Math.round(counter.val).toString();
            obj.el.textContent = obj.prefix + v + obj.suffix;
          }
        }, 0.5 + idx * stagger);
      })(counterObjs[k], k);
    }

    // Exit
    if (ctx.duration > 2) {
      var exitAt = ctx.duration - 0.7;
      tl.to([topbar].concat(cardEls), {
        autoAlpha: 0, y: -15,
        duration: 0.4,
        stagger: 0.03,
        ease: 'power2.in'
      }, exitAt);
    }

    return tl;
  }
</script>
