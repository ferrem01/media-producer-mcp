<script>
  function createTimeline(el, data, ctx) {
    var tl = gsap.timeline();
    var container = el.querySelector('.notification-container');
    var notifications = data.notifications || [];
    var position = data.position || 'top-right';

    container.classList.add(position);

    var isRight = position.indexOf('right') !== -1;
    var isBottom = position.indexOf('bottom') !== -1;
    var slideX = isRight ? 60 : -60;

    var defaultIcons = {
      success: '✓',
      error: '✕',
      info: 'ℹ',
      warning: '⚠'
    };

    var cardEls = [];

    for (var i = 0; i < notifications.length; i++) {
      var n = notifications[i];
      var type = n.type || 'info';

      var card = document.createElement('div');
      card.className = 'notification-card';

      // Accent stripe
      var accent = document.createElement('div');
      accent.className = 'notification-accent accent-' + type;
      card.appendChild(accent);

      // Icon
      var iconWrap = document.createElement('div');
      iconWrap.className = 'notification-icon icon-' + type;
      iconWrap.textContent = n.icon || defaultIcons[type] || 'ℹ';
      card.appendChild(iconWrap);

      // Body
      var body = document.createElement('div');
      body.className = 'notification-body';

      var header = document.createElement('div');
      header.className = 'notification-header';

      var title = document.createElement('div');
      title.className = 'notification-title';
      title.textContent = n.title || '';
      header.appendChild(title);

      if (n.time) {
        var time = document.createElement('span');
        time.className = 'notification-time';
        time.textContent = n.time;
        header.appendChild(time);
      }
      body.appendChild(header);

      if (n.body) {
        var text = document.createElement('div');
        text.className = 'notification-text';
        text.textContent = n.body;
        body.appendChild(text);
      }

      card.appendChild(body);

      // Insert at top or bottom depending on position
      if (isBottom) {
        container.insertBefore(card, container.firstChild);
      } else {
        container.appendChild(card);
      }
      cardEls.push(card);
    }

    // Initial states
    gsap.set(cardEls, { autoAlpha: 0, x: slideX, scale: 1.05 });

    var speed = ctx.motion === 'minimal' ? 0.3 : ctx.motion === 'punchy' ? 0.4 : 0.55;
    var stagger = ctx.motion === 'minimal' ? 0.15 : 0.3;

    // Slide in one by one
    tl.to(cardEls, {
      autoAlpha: 1, x: 0, scale: 1,
      duration: speed,
      stagger: stagger,
      ease: 'power3.out'
    }, 0.4);

    // Subtle settle glow
    tl.to(cardEls, {
      boxShadow: '0 20px 50px rgba(0, 0, 0, 0.4), 0 0 0 1px rgba(255, 255, 255, 0.06)',
      duration: 0.3,
      stagger: stagger * 0.5
    }, '-=0.2');

    // Exit
    if (ctx.duration > 2) {
      var exitAt = ctx.duration - 0.5;
      tl.to(cardEls, {
        autoAlpha: 0, x: slideX * 0.5,
        duration: 0.3,
        stagger: 0.05,
        ease: 'power2.in'
      }, exitAt);
    }

    return tl;
  }
</script>
