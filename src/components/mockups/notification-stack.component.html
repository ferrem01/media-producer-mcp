<style scoped>

  /* Fill: the cards ARE the box -- no corner inset, the box's own width.

  .notification-stack.fill .notification-container {

<script>
  function createTimeline(el, data, ctx) {
    var tl = gsap.timeline();
    var container = el.querySelector('.notification-container');
    var notifications = data.notifications || [];
    var position = data.position || 'top-right';

    container.classList.add(position);
    var solid = data.surface === 'solid';
    if (solid) el.querySelector('.notification-stack').classList.add('surface-solid');
    if (data.fill) el.querySelector('.notification-stack').classList.add('fill');

    var isRight = position.indexOf('right') !== -1;
    var isBottom = position.indexOf('bottom') !== -1;
    var slideX = isRight ? 60 : -60;

    // The glyph each type falls back to when the notification names none
    // (or names an emoji with no house glyph).
    var defaultIcons = { success: 'check', error: 'x', info: 'bell', warning: 'alert' };
    var icons = (typeof window !== 'undefined' && window.mpIcons) || null;

    var cardEls = [];

    for (var i = 0; i < notifications.length; i++) {
      var n = notifications[i];
      var type = n.type || 'info';

      var card = document.createElement('div');
      card.className = 'notification-card';

      // Icon: a drawn glyph on a filled app tile. A saved emoji maps to
      // its glyph; text that maps to none is kept as written.
      var iconWrap = document.createElement('div');
      iconWrap.className = 'notification-icon icon-' + type;
      var glyph = icons && (icons.resolve(n.icon) || (!n.icon ? defaultIcons[type] : null));
      if (glyph) iconWrap.innerHTML = icons.svg(glyph, { stroke: 2.1 });
      else {
        var gt = document.createElement('span');
        gt.className = 'nf-glyph-text';
        gt.textContent = n.icon || '•';
        iconWrap.appendChild(gt);
      }
      card.appendChild(iconWrap);

      // Body
      var body = document.createElement('div');
      body.className = 'notification-body';

      var header = document.createElement('div');
      header.className = 'notification-header';

      var title = document.createElement('div');
      title.className = 'notification-title';
      title.textContent = n.title || '';
      header.appendChild(title);

      if (n.time) {
        var time = document.createElement('span');
        time.className = 'notification-time';
        time.textContent = n.time;
        header.appendChild(time);
      }
      body.appendChild(header);

      if (n.body) {
        var text = document.createElement('div');
        text.className = 'notification-text';
        text.textContent = n.body;
        body.appendChild(text);
      }

      card.appendChild(body);

      // Insert at top or bottom depending on position
      if (isBottom) {
        container.insertBefore(card, container.firstChild);
      } else {
        container.appendChild(card);
      }
      cardEls.push(card);
    }

    var speed = ctx.motion === 'minimal' ? 0.3 : ctx.motion === 'punchy' ? 0.4 : 0.55;
    var stagger = ctx.motion === 'minimal' ? 0.15 : 0.3;
    // The component's clock is the scene's: arrive when the box appears
    // (data.at, else the box's own entrance), not at second 0.4 while the
    // box is still hidden -- the landing used to play unseen.
    var startAt = typeof data.at === 'number' ? data.at
      : (typeof ctx.enter_at === 'number' ? ctx.enter_at : 0.4);

    if (data.fill) {
      // A card placed by geometry LANDS: tipped back in depth, a little low
      // and soft, settling flat and sharp -- weight, not a slide.
      gsap.set(cardEls, { autoAlpha: 0, y: 26, rotationX: 24, scale: 0.96, filter: 'blur(5px)' });
      tl.to(cardEls, {
        autoAlpha: 1, y: 0, rotationX: 0, scale: 1, filter: 'blur(0px)',
        duration: speed + 0.1, stagger: stagger, ease: 'power3.out'
      }, startAt);
    } else {
      gsap.set(cardEls, { autoAlpha: 0, x: slideX, scale: 1.04, filter: 'blur(4px)' });
      tl.to(cardEls, {
        autoAlpha: 1, x: 0, scale: 1, filter: 'blur(0px)',
        duration: speed, stagger: stagger, ease: 'power3.out'
      }, startAt);
    }

    // Exit: half a second before the scene ends by default. hold keeps the
    // cards up to the cut (the wrapper's own exit, or the scene's end, takes
    // them off): a stack that lands late in a scene was fading out a moment
    // after it arrived (Marc, Oct 14).
    var exitAt = data.hold ? null : (ctx.duration > 2 ? ctx.duration - 0.5 : null);
    if (exitAt !== null) {
      tl.to(cardEls, {
        autoAlpha: 0, x: slideX * 0.5,
        duration: 0.3,
        stagger: 0.05,
        ease: 'power2.in'
      }, exitAt);
    }

    return tl;
  }
</script>
