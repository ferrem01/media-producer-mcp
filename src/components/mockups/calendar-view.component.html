<script>
  function createTimeline(el, data, ctx) {
    var tl = gsap.timeline();
    var card = el.querySelector('.calendar-card');
    var monthEl = el.querySelector('.calendar-month');
    var grid = el.querySelector('.calendar-grid');
    var events = data.events || [];
    var month = data.month || 'June 2025';

    monthEl.textContent = month;

    // Build calendar grid (generic 35 cells starting on Monday-ish)
    var startDay = 1; // offset for first day
    var daysInMonth = 30;
    var today = 15;

    // Create event lookup
    var eventsByDay = {};
    for (var e = 0; e < events.length; e++) {
      var day = events[e].day;
      if (!eventsByDay[day]) eventsByDay[day] = [];
      eventsByDay[day].push(events[e]);
    }

    for (var i = 0; i < 35; i++) {
      var cell = document.createElement('div');
      cell.className = 'calendar-cell';
      var dayNum = i - startDay + 1;

      var numEl = document.createElement('div');
      numEl.className = 'day-number';

      if (dayNum >= 1 && dayNum <= daysInMonth) {
        numEl.textContent = dayNum;
        if (dayNum === today) cell.classList.add('today');

        // Add events for this day
        if (eventsByDay[dayNum]) {
          for (var ev = 0; ev < eventsByDay[dayNum].length; ev++) {
            var pill = document.createElement('div');
            pill.className = 'event-pill';
            pill.textContent = eventsByDay[dayNum][ev].title;
            var color = eventsByDay[dayNum][ev].color || '#A78BFA';
            pill.style.background = color + '33';
            pill.style.color = color;
            cell.appendChild(pill);
          }
        }
      } else {
        cell.classList.add('empty');
      }

      cell.insertBefore(numEl, cell.firstChild);
      grid.appendChild(cell);
    }

    var cells = grid.querySelectorAll('.calendar-cell:not(.empty)');
    var pills = grid.querySelectorAll('.event-pill');

    var speed = ctx.motion === 'minimal' ? 0.4 : ctx.motion === 'punchy' ? 0.6 : 0.8;

    // Initial state
    gsap.set(card, { autoAlpha: 0, scale: 0.92, y: 30, filter: 'blur(4px)' });
    gsap.set(pills, { autoAlpha: 0, scale: 0.7 });

    // Card entrance
    tl.to(card, {
      autoAlpha: 1, scale: 1, y: 0, filter: 'blur(0px)',
      duration: speed,
      ease: 'power3.out'
    }, 0.3);

    // Event pills appear with stagger
    tl.to(pills, {
      autoAlpha: 1, scale: 1,
      duration: speed * 0.6,
      stagger: 0.08,
      ease: 'back.out(1.4)'
    }, 0.3 + speed * 0.6);

    // Exit
    if (ctx.duration > 2) {
      var exitAt = ctx.duration - 0.6;
      tl.to(card, {
        autoAlpha: 0, scale: 0.95, y: -15,
        duration: 0.4,
        ease: 'power2.in'
      }, exitAt);
    }

    return tl;
  }
</script>
