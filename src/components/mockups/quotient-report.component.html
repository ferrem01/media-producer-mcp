<script>
  function createTimeline(el, data, ctx) {
    if (data.docked) el.querySelector('.qrp').classList.add('is-docked');
    var tl = gsap.timeline();
    var card = el.querySelector('.qrp-card');
    var esc = function(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); };

    var title = data.title || 'Inbound Funnel — Last 30 Days';
    var range = data.range || 'Aug 8 – Sep 8';
    var kpis = data.kpis || [
      { label: 'Impressions', value: 128400, display: '128K', delta: '+38%' },
      { label: 'Site Sessions', value: 9412, delta: '+24%' },
      { label: 'Signups', value: 486, delta: '+31%' }
    ];
    var chart = data.chart || {
      title: 'Sessions per day',
      points: [12, 18, 15, 24, 30, 26, 38, 34, 47, 52, 44, 61, 58, 74, 69, 83, 90, 86, 97],
      labels: ['Aug 8', 'Aug 15', 'Aug 22', 'Aug 29', 'Sep 5']
    };
    var sources = data.sources || [
      { name: 'Social', pct: 84, value: '4,120' },
      { name: 'Email', pct: 58, value: '2,860' },
      { name: 'Direct', pct: 39, value: '1,910' }
    ];

    el.querySelector('.qrp-title').textContent = title;
    el.querySelector('.qrp-range').textContent = range;
    el.querySelector('.qrp-chart-title').textContent = chart.title || '';

    var kpiWrap = el.querySelector('.qrp-kpis');
    var counters = [];
    kpis.forEach(function(k) {
      var tile = document.createElement('div');
      tile.className = 'qrp-kpi';
      var deltaCls = /^[-−↓]/.test(String(k.delta || '')) ? ' down' : '';
      tile.innerHTML =
        '<div class="qrp-kpi-label">' + esc(k.label || '') + '</div>' +
        '<div class="qrp-kpi-row"><span class="qrp-kpi-value">0</span>' +
        (k.delta ? '<span class="qrp-kpi-delta' + deltaCls + '">' + esc(k.delta) + '</span>' : '') + '</div>';
      kpiWrap.appendChild(tile);
      counters.push({ tile: tile, valueEl: tile.querySelector('.qrp-kpi-value'), to: Number(k.value) || 0, display: k.display });
    });

    // Chart geometry is owned here (plain numbers in, straight segments out),
    // so the draw length is exact segment math -- no getTotalLength needed.
    var svg = el.querySelector('.qrp-chart');
    var line = null, area = null, lineLen = 0;
    (function() {
      var pts = chart.points || [];
      if (pts.length < 2) return;
      var W = 720, H = 240, PAD = 6;
      var maxV = Math.max.apply(null, pts) || 1;
      var xy = pts.map(function(v, i) {
        return [PAD + i * ((W - 2 * PAD) / (pts.length - 1)), H - PAD - (v / maxV) * (H - 2 * PAD)];
      });
      var dLine = xy.map(function(p, i) { return (i ? 'L' : 'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1); }).join(' ');
      for (var i = 1; i < xy.length; i++) {
        lineLen += Math.hypot(xy[i][0] - xy[i - 1][0], xy[i][1] - xy[i - 1][1]);
      }
      svg.innerHTML =
        '<path class="qrp-area" d="' + dLine + ' L' + xy[xy.length - 1][0].toFixed(1) + ' ' + (H - PAD) + ' L' + PAD + ' ' + (H - PAD) + ' Z" style="fill:rgba(23,23,28,0.07);stroke:none"/>' +
        '<path class="qrp-line" d="' + dLine + '" style="fill:none;stroke:#17171c;stroke-width:2.6"/>';
      line = svg.querySelector('.qrp-line');
      area = svg.querySelector('.qrp-area');
      line.style.strokeDasharray = lineLen;
    })();
    var labelsWrap = el.querySelector('.qrp-chart-labels');
    (chart.labels || []).forEach(function(l) {
      var s = document.createElement('span');
      s.textContent = l;
      labelsWrap.appendChild(s);
    });

    var srcWrap = el.querySelector('.qrp-source-rows');
    var srcFills = [];
    sources.forEach(function(s) {
      var row = document.createElement('div');
      row.className = 'qrp-source-row';
      row.innerHTML =
        '<span class="qrp-source-name">' + esc(s.name || '') + '</span>' +
        '<span class="qrp-source-track"><span class="qrp-source-fill"></span></span>' +
        '<span class="qrp-source-val">' + esc(s.value || '') + '</span>';
      srcWrap.appendChild(row);
      srcFills.push({ fill: row.querySelector('.qrp-source-fill'), pct: Math.max(0, Math.min(100, Number(s.pct) || 0)) });
    });

    // ── Entrance performance: card rises, KPIs land + count, the line DRAWS,
    // channel bars fill. Everything lives ON the timeline (scrub-safe). ──
    gsap.set(card, { autoAlpha: 0, y: 16 });
    tl.to(card, { autoAlpha: 1, y: 0, duration: 0.3, ease: 'power3.out' }, 0.1);

    counters.forEach(function(c, i) {
      var at = 0.45 + i * 0.12;
      gsap.set(c.tile, { autoAlpha: 0, y: 10 });
      tl.to(c.tile, { autoAlpha: 1, y: 0, duration: 0.35, ease: 'power2.out' }, at);
      var prox = { n: 0 };
      tl.to(prox, {
        n: c.to, duration: 1.0, ease: 'power2.out',
        onUpdate: function() {
          c.valueEl.textContent = (c.display != null && prox.n >= c.to)
            ? String(c.display)
            : Math.round(prox.n).toLocaleString('en-US');
        }
      }, at + 0.05);
    });

    if (line) {
      gsap.set(line, { strokeDashoffset: lineLen });
      gsap.set(area, { autoAlpha: 0 });
      tl.to(line, { strokeDashoffset: 0, duration: 1.3, ease: 'power2.inOut' }, 0.7);
      tl.to(area, { autoAlpha: 1, duration: 0.6 }, 1.5);
    }

    srcFills.forEach(function(s, i) {
      tl.to(s.fill, { width: s.pct + '%', duration: 0.7, ease: 'power3.out' }, 1.4 + i * 0.14);
    });

    // Cursor verbs (move-cursor / click / wait) via the shared runner.
    if (data.script && data.script.length > 0) {
      var cursorTargets = data.cursor_targets || {
        'refresh': { x: '78%', y: '9%' },
        'chart': { x: '60%', y: '45%' }
      };
      runScript(tl, el, data.script, cursorTargets, ctx, {});
    }

    return tl;
  }
</script>
