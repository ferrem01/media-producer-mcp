<style scoped>

<script>
  function createTimeline(el, data, ctx) {
    var tl = gsap.timeline();
    data = data || {};
    ctx = ctx || {};
    var DUR = ctx.duration || 6;
    var num = function (v, d) { var n = Number(v); return (v === null || v === undefined || v === '' || !isFinite(n)) ? d : n; };
    var q = function (s) { return el.querySelector(s); };
    var root = q('.ec-root'), win = q('.ec-win');
    var cs = getComputedStyle(el);

    // ---- Theme from the ground ----
    var lum = function (c) {
      var m = String(c || '').trim().match(/^#([0-9a-f]{3}|[0-9a-f]{6})$/i);
      if (!m) return null;
      var h = m[1].length === 3 ? m[1].replace(/./g, '$&$&') : m[1];
      return (0.2126 * parseInt(h.slice(0, 2), 16) + 0.7152 * parseInt(h.slice(2, 4), 16) + 0.0722 * parseInt(h.slice(4, 6), 16)) / 255;
    };
    var g = lum(cs.getPropertyValue('--mp-color-background'));
    var dark = data.theme === 'dark' || (data.theme !== 'light' && g !== null && g < 0.45);
    var ACC = data.accent || cs.getPropertyValue('--mp-color-primary').trim() || '#393bf5';
    var T = dark
      ? { bg: '#16161d', bar: '#1f1f28', ink: '#f2f2f6', mute: 'rgba(242,242,246,0.55)', line: 'rgba(255,255,255,0.08)', chip: 'rgba(255,255,255,0.08)' }
      : { bg: '#ffffff', bar: '#f4f4f8', ink: '#17171c', mute: 'rgba(23,23,28,0.5)', line: 'rgba(23,23,28,0.08)', chip: '#eef0f6' };
    root.style.setProperty('--ec-bg', T.bg); root.style.setProperty('--ec-bar', T.bar); root.style.setProperty('--ec-ink', T.ink);
    root.style.setProperty('--ec-mute', T.mute); root.style.setProperty('--ec-line', T.line); root.style.setProperty('--ec-chip', T.chip);
    root.style.setProperty('--ec-acc', ACC); root.style.setProperty('--ec-acc-soft', 'color-mix(in srgb, ' + ACC + ' 16%, transparent)');
    var W = el.clientWidth || 1000, H = el.clientHeight || 700;
    root.style.setProperty('--ec-fs', Math.round(Math.max(14, Math.min(W / 50, H / 27))) + 'px');

    // ---- Fields ----
    var from = String(data.from || 'you@company.com');
    q('.ec-from').textContent = from;
    var colors = [ACC, '#12a594', '#e8590c', '#b45cf0'];
    String(data.to || 'team@company.com').split(/\s*[,;]\s*/).filter(Boolean).slice(0, 3).forEach(function (addr, i) {
      var chip = document.createElement('span'); chip.className = 'ec-chip';
      var av = document.createElement('span'); av.className = 'ec-av'; av.style.background = colors[i % colors.length];
      av.textContent = (addr.replace(/[^A-Za-z]/g, '')[0] || '?').toUpperCase();
      chip.appendChild(av); chip.appendChild(document.createTextNode(addr));
      q('.ec-to').appendChild(chip);
    });
    (Array.isArray(data.attachments) ? data.attachments : []).slice(0, 3).forEach(function (a) {
      var f = document.createElement('span'); f.className = 'ec-file'; f.innerHTML = '<b></b>'; f.appendChild(document.createTextNode(String(a))); q('.ec-attach').appendChild(f);
    });

    // A scripted type into a field is the script's to perform; the component
    // types the fields the script leaves alone.
    var script = Array.isArray(data.script) ? data.script : [];
    var scripted = {};
    script.forEach(function (a) { if (a && a.action === 'type' && a.target) scripted[a.target] = true; });
    var sendClick = script.filter(function (a) { return a && a.action === 'click' && a.target === 'send-button'; })[0];

    // Pre-laid characters revealed by tl.set: seek-exact typing.
    function lay(host, text) {
      var spans = [];
      for (var i = 0; i < text.length; i++) { var sp = document.createElement('span'); sp.textContent = text[i]; host.appendChild(sp); spans.push(sp); }
      return spans;
    }
    var caret = document.createElement('span'); caret.className = 'ec-caret';
    var AT = num(data.at, 0.3);
    gsap.set(win, { autoAlpha: 0, y: 24, scale: 0.97 });
    tl.to(win, { autoAlpha: 1, y: 0, scale: 1, duration: 0.55, ease: 'power3.out' }, AT);
    var t = AT + 0.5;
    var subj = String(data.subject || '');
    var body = String(data.body || '');
    var CPS = num(data.type_speed, 38);
    // A known send moment is the typing deadline: the draft finishes before Send.
    var sendAt = data.send_at !== undefined && data.send_at !== null && data.send_at !== '' ? num(data.send_at, -1)
      : sendClick ? num(sendClick.at, -1) : (data.send === true ? -2 : -1);
    if (subj && !scripted['subject-field']) {
      var ss = lay(q('.ec-subj'), subj);
      var step = Math.min(1 / CPS, 1.0 / ss.length);
      ss.forEach(function (sp, i) { tl.set(sp, { display: 'inline' }, t + i * step); });
      t += ss.length * step + 0.2;
    }
    if (data.ai) {
      var ai = document.createElement('div'); ai.className = 'ec-ai';
      ai.textContent = '✦ ' + (typeof data.ai === 'string' ? data.ai : 'Drafted with Quotient');
      q('.ec-body').appendChild(ai); q('.ec-body').appendChild(document.createElement('br'));
      gsap.set(ai, { autoAlpha: 0, y: 6 });
      tl.to(ai, { autoAlpha: 1, y: 0, duration: 0.3, ease: 'back.out(2)' }, t);
      t += 0.25;
    }
    if (body && !scripted['body-field']) {
      var bs = lay(q('.ec-body'), body);
      q('.ec-body').appendChild(caret);
      // The body types fast and never runs past the scene (an AI draft pours in).
      var deadline = sendAt >= 0 ? sendAt - 0.35 : DUR * 0.85;
      var bstep = Math.min(1 / (CPS * 1.6), Math.max(0.004, (deadline - t) / bs.length));
      bs.forEach(function (sp, i) { tl.set(sp, { display: 'inline' }, t + i * bstep); });
      t += bs.length * bstep + 0.2;
    }
    // FIT the body: the finished email must fit its area (measured: a
    // three-paragraph body showed only "Hi there," -- the rest overflowed).
    var bodyEl = q('.ec-body');
    var hidden = Array.prototype.slice.call(bodyEl.querySelectorAll('span')).filter(function (x) { return x.style.display !== 'inline' && x !== caret; });
    hidden.forEach(function (x) { x.style.display = 'inline'; });
    var bfs = parseFloat(getComputedStyle(bodyEl).fontSize) || 22;
    for (var fi = 0; fi < 16 && bodyEl.scrollHeight > bodyEl.clientHeight + 2 && bfs > 11; fi++) { bfs *= 0.92; bodyEl.style.fontSize = bfs.toFixed(1) + 'px'; }
    hidden.forEach(function (x) { x.style.display = ''; });
    gsap.set(caret, { autoAlpha: 0 });
    tl.set(caret, { autoAlpha: 1 }, AT + 0.5);
    tl.set(caret, { autoAlpha: 0 }, t);

    // ---- Send: the button presses, the window lifts away, "Sent" lands ----
    if (sendAt === -2) sendAt = Math.min(DUR - 1.2, t + 0.5);
    var btn = q('.ec-send');
    if (sendAt >= 0) {
      tl.to(btn, { scale: 0.92, duration: 0.08, ease: 'power2.in' }, sendAt);
      tl.to(btn, { scale: 1, duration: 0.14, ease: 'power2.out' }, sendAt + 0.08);
      tl.to(win, { y: -40, scale: 0.9, autoAlpha: 0, duration: 0.45, ease: 'power2.in' }, sendAt + 0.22);
      var toast = q('.ec-toast');
      if (data.sent_label) q('.ec-toast-t').textContent = String(data.sent_label);
      tl.fromTo(toast, { autoAlpha: 0, scale: 0.8 }, { autoAlpha: 1, scale: 1, duration: 0.35, ease: 'back.out(2.2)', immediateRender: false }, sendAt + 0.55);
    } else if (DUR > 2.5) {
      tl.to(win, { autoAlpha: 0, y: -12, duration: 0.4, ease: 'power2.in' }, DUR - 0.55);
    }

    if (script.length && typeof runScript === 'function') runScript(tl, el, script, data.cursor_targets || {}, ctx);
    return tl;
  }
</script>
