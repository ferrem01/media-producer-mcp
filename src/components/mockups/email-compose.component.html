<script>
  function createTimeline(el, data, ctx) {
    var tl = gsap.timeline();
    var client = el.querySelector('.email-client');
    var fromEl = el.querySelector('.from-value');
    var toEl = el.querySelector('.to-value');
    var subjectEl = el.querySelector('.subject-value');
    var bodyEl = el.querySelector('.body-text');
    var sendBtn = el.querySelector('.send-button');

    var fromText = data.from || 'you@company.com';
    var toText = data.to || 'team@company.com';
    var subjectText = data.subject || 'Quick Update';
    var bodyText = data.body || 'Hey team,\n\nJust wanted to share a quick update on the project.';

    var speed = ctx.motion === 'minimal' ? 0.4 : ctx.motion === 'punchy' ? 0.6 : 0.8;

    // Initial state
    gsap.set(client, { autoAlpha: 0, scale: 0.92, y: 30, filter: 'blur(4px)' });

    // Client entrance
    tl.to(client, {
      autoAlpha: 1, scale: 1, y: 0, filter: 'blur(0px)',
      duration: speed,
      ease: 'power3.out'
    }, 0.3);

    // Helper: type text into element
    function typeField(element, text, startTime, charDelay) {
      var cursor = document.createElement('span');
      cursor.className = 'email-cursor';

      tl.call(function() {
        element.textContent = '';
        element.appendChild(cursor);
      }, null, startTime);

      for (var c = 0; c < text.length; c++) {
        (function(charIdx) {
          tl.call(function() {
            element.textContent = text.substring(0, charIdx + 1);
            element.appendChild(cursor);
          }, null, startTime + 0.1 + charIdx * charDelay);
        })(c);
      }

      var endTime = startTime + 0.1 + text.length * charDelay + 0.15;
      tl.call(function() {
        if (cursor.parentNode) cursor.parentNode.removeChild(cursor);
      }, null, endTime);

      return endTime;
    }

    // Type fields sequentially
    var t = 0.3 + speed + 0.2;
    t = typeField(fromEl, fromText, t, 0.03);
    t = typeField(toEl, toText, t + 0.15, 0.03);
    t = typeField(subjectEl, subjectText, t + 0.15, 0.04);
    t = typeField(bodyEl, bodyText, t + 0.2, 0.03);

    // Send button glow at the end
    tl.to(sendBtn, {
      boxShadow: '0 0 24px rgba(167, 139, 250, 0.4), 0 0 48px rgba(167, 139, 250, 0.15)',
      background: 'rgba(167, 139, 250, 0.25)',
      duration: 0.5,
      ease: 'power2.out'
    }, t + 0.3);

    tl.to(sendBtn, {
      boxShadow: '0 0 12px rgba(167, 139, 250, 0.2)',
      duration: 0.8,
      yoyo: true,
      repeat: 1,
      ease: 'sine.inOut'
    }, t + 0.8);

    // Exit
    if (ctx.duration > 2) {
      var exitAt = ctx.duration - 0.6;
      tl.to(client, {
        autoAlpha: 0, scale: 0.95, y: -15,
        duration: 0.4,
        ease: 'power2.in'
      }, exitAt);
    }


    // Run interactive script if provided
    if (data.script && data.script.length > 0) {
      runScript(tl, el, data.script, data.cursor_targets || {}, ctx);
    }

    return tl;
  }
</script>
