    var crumbsEl = el.querySelector('.qas-crumbs');

      s.className = 'qas-crumb' + (i === crumbs.length - 1 ? ' last' : '');

      return d;
    }
    function toolCardEl(a) {
      var d = document.createElement('div');
      d.className = 'qas-toolcard' + (a.open !== false ? ' open' : '');
      var previewHtml = '';
      if (a.preview) {
        var paras = String(a.preview).split(/\n\n+/).map(function(p) { return '<p>' + md(p) + '</p>'; }).join('');
        previewHtml = '<div class="qas-toolcard-body"><div class="qas-toolcard-preview">' + paras + '</div></div>';
      }
      d.innerHTML = '<div class="qas-toolcard-head">' +
        '<div><div class="qas-toolcard-verb">' + esc(a.verb || 'Updated') + ' ' + platIco(a.platform || 'linkedin') +
        ' ' + esc(a.noun || 'LinkedIn post') + '</div>' +
        '<div class="qas-toolcard-title">' + esc(a.title || '') + '</div></div>' +
        '<div class="qas-toolcard-chev"><svg viewBox="0 0 24 24" style="fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round"><path d="M6 9l6 6 6-6"/></svg></div>' +
        '</div>' + previewHtml;
      return d;
    }
    function agentEl(text) {
      var d = document.createElement('div');
      d.className = 'qas-agent-msg';
      d.innerHTML = String(text).split(/\n\n+/).map(function(p) { return '<p style="margin:0 0 10px">' + md(p) + '</p>'; }).join('');
      return d;
    }
    function userEl(text) {
      var d = document.createElement('div');
      d.className = 'qas-user-msg';
      d.textContent = text;
      return d;
    }
    function scrollDown() {
      msgs.scrollTop = msgs.scrollHeight;
    }
    function addMsg(node, animate) {
      msgs.appendChild(node);
      if (animate !== false) {
        gsap.fromTo(node, { autoAlpha: 0, y: 10 }, { autoAlpha: 1, y: 0, duration: 0.3, ease: 'power2.out', onUpdate: scrollDown, onComplete: scrollDown });
      }
      scrollDown();
      return node;
    }

    // ── History at open ──
    (data.history || []).forEach(function(h) {
      if (h.type === 'user') addMsg(userEl(h.text), false);
      else if (h.type === 'agent') addMsg(agentEl(h.text), false);
      else if (h.type === 'tool-card') addMsg(toolCardEl(h), false);
      else if (h.type === 'reviewed') addMsg(reviewedEl(h.verb, h.platform, h.title, h.noun), false);
    });

    // ── Entrance ──
    gsap.set(root, { autoAlpha: 0 });
    gsap.set(rail, { x: -14, autoAlpha: 0 });
    gsap.set(header, { y: -10, autoAlpha: 0 });
    if (showPanel) gsap.set(panel, { x: 22, autoAlpha: 0 });
    tl.to(root, { autoAlpha: 1, duration: 0.15, ease: 'power2.out' }, 0.05);
    tl.to(rail, { x: 0, autoAlpha: 1, duration: 0.28, ease: 'power3.out' }, 0.1);
    tl.to(header, { y: 0, autoAlpha: 1, duration: 0.25, ease: 'power2.out' }, 0.14);
    if (showPanel) tl.to(panel, { x: 0, autoAlpha: 1, duration: 0.3, ease: 'power3.out' }, 0.18);

    var typingNode = null;

    // ── Script ──
    if (data.script && data.script.length > 0) {
      var cursorTargets = data.cursor_targets || {
        'composer': { x: '83%', y: '86%' },
        'send': { x: '96%', y: '90%' }
      };

      runScript(tl, el, data.script, cursorTargets, ctx, {
        'type-message': function(tl, ctr, action, at) {
          var text = action.text || '';
          var speed = action.speed || 0.035;
          tl.call(function() { input.classList.add('filled', 'typing'); }, null, at);
          for (var i = 1; i <= text.length; i++) {
            (function(n) {
              tl.call(function() { inputText.textContent = text.slice(0, n); }, null, at + n * speed);
            })(i);
          }
          tl.call(function() { input.classList.remove('typing'); }, null, at + text.length * speed + 0.15);
        },
        'send-message': function(tl, ctr, action, at) {
          tl.call(function() {
            var text = inputText.textContent;
            inputText.textContent = '';
            input.classList.remove('filled', 'typing');
            if (text) addMsg(userEl(text));
          }, null, at);
        },
        'user-message': function(tl, ctr, action, at) {
          tl.call(function() { addMsg(userEl(action.text || '')); }, null, at);
        },
        'agent-message': function(tl, ctr, action, at) {
          tl.call(function() {
            if (typingNode) { typingNode.remove(); typingNode = null; }
            addMsg(agentEl(action.text || ''));
          }, null, at);
        },
        'reviewed-line': function(tl, ctr, action, at) {
          tl.call(function() { addMsg(reviewedEl(action.verb, action.platform, action.title, action.noun)); }, null, at);
        },
        'tool-card': function(tl, ctr, action, at) {
          tl.call(function() {
            if (typingNode) { typingNode.remove(); typingNode = null; }
            addMsg(toolCardEl(action));
          }, null, at);
          if (action.collapse_delay) {
            tl.call(function() {
              var cards = msgs.querySelectorAll('.qas-toolcard');
              var card = cards[cards.length - 1];
              if (card) card.classList.remove('open');
            }, null, at + action.collapse_delay);
          }
        },
        'show-typing': function(tl, ctr, action, at) {
          tl.call(function() {
            if (typingNode) return;
            typingNode = document.createElement('div');
            typingNode.className = 'qas-typing';
            typingNode.innerHTML = '<i></i><i></i><i></i>';
            addMsg(typingNode);
          }, null, at);
        },
        'hide-typing': function(tl, ctr, action, at) {
          tl.call(function() {
            if (typingNode) { typingNode.remove(); typingNode = null; }
          }, null, at);
        },
        'scroll-messages': function(tl, ctr, action, at) {
          tl.call(scrollDown, null, at);
        }
      });
    }

    return tl;
  }
</script>
