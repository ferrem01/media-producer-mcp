  .qas-placeholder { color: #6b6a75; position: absolute; left: 0; top: 0; }
  .qas-input.filled .qas-placeholder { display: none; }
  .qas-caret {
    display: none; width: 1.5px; height: 15px; background: #1a1a1a;
    vertical-align: -2px; margin-left: 1px;
  }
  .qas-input.typing .qas-caret { display: inline-block; animation: qasCaret 1s steps(1) infinite; }
  @keyframes qasCaret { 50% { opacity: 0; } }
  .qas-input-row {
    display: flex; align-items: center; justify-content: space-between;
    margin-top: 12px;
  }
  .qas-ir-left { display: flex; align-items: center; gap: 9px; color: #55565e; }
  .qas-clip { width: 16px; height: 16px; }
  .qas-mode { font-size: 13px; color: #55565e; }
  .qas-mode-chev { width: 13px; height: 13px; }
  .qas-ir-right { display: flex; align-items: center; gap: 11px; color: #55565e; }
  .qas-mic { width: 16px; height: 16px; }
  .qas-send {
    width: 30px; height: 30px; border-radius: 50%;
    background: #17171c; color: #fff;
    display: flex; align-items: center; justify-content: center;
  }
  .qas-send svg { width: 14px; height: 14px; }
</style>

<script>
  function createTimeline(el, data, ctx) {
    var tl = gsap.timeline();
    var root = el.querySelector('.qas');
    var rail = el.querySelector('.qas-rail');
    var header = el.querySelector('.qas-header');
    var panel = el.querySelector('.qas-panel');
    var msgs = el.querySelector('.qas-msgs');
    var input = el.querySelector('.qas-input');
    var inputText = el.querySelector('.qas-input-text');

    // ── Data ──
    var crumbs = data.breadcrumbs || ['Campaigns', 'Marketing Busywork Tax', 'Marc LinkedIn - Marketing Busywor...'];
    var badgeCount = data.badge_count !== undefined ? data.badge_count : 480;
    var panelTab = data.panel_tab || 'Draft LinkedIn POV Post';
    var copiesBadge = data.copies_badge !== undefined ? data.copies_badge : 2;
    var navActive = data.nav_active || 'campaigns';
    var userAvatarUrl = data.user_avatar_url || 'https://i.pravatar.cc/128?img=12';
    var userInitials = data.user_initials || 'M';
    var showPanel = data.show_panel !== false;

    // ── Populate chrome ──
    var crumbsEl = el.querySelector('.qas-crumbs');
    crumbs.forEach(function(c, i) {
      var s = document.createElement('span');
      s.className = 'qas-crumb' + (i === crumbs.length - 1 ? ' last' : '');
      s.textContent = c;
      crumbsEl.appendChild(s);
      if (i < crumbs.length - 1) {
        var sep = document.createElement('span');
        sep.className = 'qas-crumb-sep';
        sep.textContent = '›';
        crumbsEl.appendChild(sep);
      }
    });
    el.querySelector('.qas-bell-badge').textContent = badgeCount;
    el.querySelector('.qas-tab-label').textContent = panelTab;
    el.querySelector('.qas-pi-badge').textContent = copiesBadge;
    var activeBtn = el.querySelector('.qas-rail-btn[data-nav="' + navActive + '"]');

    // ── Expanded left nav (data.nav_open): labeled rows built from the rail's
    // own icons, so the two navs can never drift apart. ──
    if (data.nav_open) {
      var NAV_LABELS = { home: 'Home', history: 'Chat History', campaigns: 'Campaigns', social: 'Social',
        blog: 'Blog', email: 'Email', assets: 'Assets', docs: 'Documents', flows: 'Flows',
        calendar: 'Events', audience: 'Audience', analytics: 'Analytics', scheduled: 'Jobs', memory: 'Memory' };
      var NAV_CHEVRON = { campaigns: 1, email: 1, audience: 1, analytics: 1 };
      var nav = el.querySelector('.qas-nav');
      var rows = nav.querySelector('.qas-nav-rows');
      el.querySelectorAll('.qas-rail-btn[data-nav]').forEach(function(btn) {
        var key = btn.getAttribute('data-nav');
        if (!NAV_LABELS[key]) return;
        var row = document.createElement('div');
        row.className = 'qas-nav-row' + (key === navActive ? ' active' : '');
        row.appendChild(btn.querySelector('svg').cloneNode(true));
        var lbl = document.createElement('span');
        lbl.textContent = NAV_LABELS[key];
        row.appendChild(lbl);
        if (NAV_CHEVRON[key]) {
          row.insertAdjacentHTML('beforeend', '<svg class="qas-nav-chev" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg>');
        }
        rows.appendChild(row);
      });
      var navLogo = nav.querySelector('.qas-nav-logo');
      navLogo.src = data.logo_url || 'https://img.logo.dev/getquotient.ai?token=pk_B_cdrQLyTkSFPzSMm52goQ&format=png&size=64';
      navLogo.onerror = function() { navLogo.style.display = 'none'; };
      var navAva = nav.querySelector('.qas-nav-ava');
      navAva.textContent = userInitials;
      if (userAvatarUrl) navAva.innerHTML = '<img src="' + userAvatarUrl.replace(/"/g, '') + '" onerror="this.remove()"/>' ;
      nav.querySelector('.qas-nav-name').textContent = data.user_name || 'Marc Ferrentino';
      nav.querySelector('.qas-nav-mail').textContent = data.user_email || 'marc@getquotient.ai';
      nav.style.display = 'flex';
      rail.style.display = 'none';
    }
    if (activeBtn) activeBtn.classList.add('active');
    var avaEl = el.querySelector('.qas-rail-ava');
    avaEl.textContent = userInitials;
    if (userAvatarUrl) {
      var img = document.createElement('img');
      img.src = userAvatarUrl;
      img.onerror = function() { this.remove(); };
      avaEl.appendChild(img);
    }
    if (!showPanel) panel.style.display = 'none';

    // ── Message builders ──
    var IN_SVG = '<svg viewBox="0 0 24 24" style="fill:#0A66C2;stroke:none"><path d="M20.447 20.452h-3.554v-5.569c0-1.328-.027-3.037-1.852-3.037-1.853 0-2.136 1.445-2.136 2.939v5.667H9.351V9h3.414v1.561h.046c.477-.9 1.637-1.85 3.37-1.85 3.601 0 4.267 2.37 4.267 5.455v6.286zM5.337 7.433a2.062 2.062 0 01-2.063-2.065 2.064 2.064 0 112.063 2.065zm1.782 13.019H3.555V9h3.564v11.452zM22.225 0H1.771C.792 0 0 .774 0 1.729v20.542C0 23.227.792 24 1.771 24h20.451C23.2 24 24 23.227 24 22.271V1.729C24 .774 23.2 0 22.222 0h.003z"/></svg>';
    var X_SVG = '<svg viewBox="0 0 24 24" style="fill:#000;stroke:none"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg>';
    function platIco(p) {
      if (p === 'linkedin') return '<span class="qas-plat-ico">' + IN_SVG + '</span>';
      if (p === 'x') return '<span class="qas-plat-ico">' + X_SVG + '</span>';
      return '';
    }
    function esc(s) {
      return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }
    function md(s) {
      return esc(s)
        .replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>')
        .replace(/`([^`]+)`/g, '<code>$1</code>');
    }
    function reviewedEl(verb, platform, title, noun) {
      var d = document.createElement('div');
      d.className = 'qas-reviewed';
      d.innerHTML = '<div class="qas-reviewed-verb">' + esc(verb || 'Reviewed') + ' ' + platIco(platform) +
        ' ' + esc(noun || 'LinkedIn post') + '</div>' +
        (title ? '<div class="qas-reviewed-title">' + esc(title) + '</div>' : '');
      return d;
    }
    function toolCardEl(a) {
      var d = document.createElement('div');
      d.className = 'qas-toolcard' + (a.open !== false ? ' open' : '');
      var previewHtml = '';
      if (a.preview) {
        var paras = String(a.preview).split(/\n\n+/).map(function(p) { return '<p>' + md(p) + '</p>'; }).join('');
        previewHtml = '<div class="qas-toolcard-body"><div class="qas-toolcard-preview">' + paras + '</div></div>';
      }
      d.innerHTML = '<div class="qas-toolcard-head">' +
        '<div><div class="qas-toolcard-verb">' + esc(a.verb || 'Updated') + ' ' + platIco(a.platform || 'linkedin') +
        ' ' + esc(a.noun || 'LinkedIn post') + '</div>' +
        '<div class="qas-toolcard-title">' + esc(a.title || '') + '</div></div>' +
        '<div class="qas-toolcard-chev"><svg viewBox="0 0 24 24" style="fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round"><path d="M6 9l6 6 6-6"/></svg></div>' +
        '</div>' + previewHtml;
      return d;
    }
    function agentEl(text) {
      var d = document.createElement('div');
      d.className = 'qas-agent-msg';
      d.innerHTML = String(text).split(/\n\n+/).map(function(p) { return '<p style="margin:0 0 10px">' + md(p) + '</p>'; }).join('');
      return d;
    }
    function userEl(text) {
      var d = document.createElement('div');
      d.className = 'qas-user-msg';
      d.textContent = text;
      return d;
    }
    function scrollDown() {
      msgs.scrollTop = msgs.scrollHeight;
    }
    function addMsg(node, animate) {
      msgs.appendChild(node);
      if (animate !== false) {
        gsap.fromTo(node, { autoAlpha: 0, y: 10 }, { autoAlpha: 1, y: 0, duration: 0.3, ease: 'power2.out', onUpdate: scrollDown, onComplete: scrollDown });
      }
      scrollDown();
      return node;
    }

    // ── History at open ──
    (data.history || []).forEach(function(h) {
      if (h.type === 'user') addMsg(userEl(h.text), false);
      else if (h.type === 'agent') addMsg(agentEl(h.text), false);
      else if (h.type === 'tool-card') addMsg(toolCardEl(h), false);
      else if (h.type === 'reviewed') addMsg(reviewedEl(h.verb, h.platform, h.title, h.noun), false);
    });

    // ── Entrance ──
    gsap.set(root, { autoAlpha: 0 });
    gsap.set(rail, { x: -14, autoAlpha: 0 });
    gsap.set(header, { y: -10, autoAlpha: 0 });
    if (showPanel) gsap.set(panel, { x: 22, autoAlpha: 0 });
    tl.to(root, { autoAlpha: 1, duration: 0.15, ease: 'power2.out' }, 0.05);
    tl.to(rail, { x: 0, autoAlpha: 1, duration: 0.28, ease: 'power3.out' }, 0.1);
    tl.to(header, { y: 0, autoAlpha: 1, duration: 0.25, ease: 'power2.out' }, 0.14);
    if (showPanel) tl.to(panel, { x: 0, autoAlpha: 1, duration: 0.3, ease: 'power3.out' }, 0.18);

    var typingNode = null;

    // ── Script ──
    if (data.script && data.script.length > 0) {
      var cursorTargets = data.cursor_targets || {
        'composer': { x: '83%', y: '86%' },
        'send': { x: '96%', y: '90%' }
      };

      runScript(tl, el, data.script, cursorTargets, ctx, {
        'type-message': function(tl, ctr, action, at) {
          var text = action.text || '';
          var speed = action.speed || 0.035;
          tl.call(function() { input.classList.add('filled', 'typing'); }, null, at);
          for (var i = 1; i <= text.length; i++) {
            (function(n) {
              tl.call(function() { inputText.textContent = text.slice(0, n); }, null, at + n * speed);
            })(i);
          }
          tl.call(function() { input.classList.remove('typing'); }, null, at + text.length * speed + 0.15);
        },
        'send-message': function(tl, ctr, action, at) {
          tl.call(function() {
            var text = inputText.textContent;
            inputText.textContent = '';
            input.classList.remove('filled', 'typing');
            if (text) addMsg(userEl(text));
          }, null, at);
        },
        'user-message': function(tl, ctr, action, at) {
          tl.call(function() { addMsg(userEl(action.text || '')); }, null, at);
        },
        'agent-message': function(tl, ctr, action, at) {
          tl.call(function() {
            if (typingNode) { typingNode.remove(); typingNode = null; }
            addMsg(agentEl(action.text || ''));
          }, null, at);
        },
        'reviewed-line': function(tl, ctr, action, at) {
          tl.call(function() { addMsg(reviewedEl(action.verb, action.platform, action.title, action.noun)); }, null, at);
        },
        'tool-card': function(tl, ctr, action, at) {
          tl.call(function() {
            if (typingNode) { typingNode.remove(); typingNode = null; }
            addMsg(toolCardEl(action));
          }, null, at);
          if (action.collapse_delay) {
            tl.call(function() {
              var cards = msgs.querySelectorAll('.qas-toolcard');
              var card = cards[cards.length - 1];
              if (card) card.classList.remove('open');
            }, null, at + action.collapse_delay);
          }
        },
        'show-typing': function(tl, ctr, action, at) {
          tl.call(function() {
            if (typingNode) return;
            typingNode = document.createElement('div');
            typingNode.className = 'qas-typing';
            typingNode.innerHTML = '<i></i><i></i><i></i>';
            addMsg(typingNode);
          }, null, at);
        },
        'hide-typing': function(tl, ctr, action, at) {
          tl.call(function() {
            if (typingNode) { typingNode.remove(); typingNode = null; }
          }, null, at);
        },
        'scroll-messages': function(tl, ctr, action, at) {
          tl.call(scrollDown, null, at);
        }
      });
    }

    return tl;
  }
</script>
