<script>
  function createTimeline(el, data, ctx) {
    var tl = gsap.timeline({ paused: true });

    var badge = el.querySelector('.badge');
    var title = el.querySelector('.title');
    var subtitle = el.querySelector('.subtitle');

    var elements = [badge, title, subtitle].filter(function(e) {
      return e && e.textContent.trim();
    });

    // Start invisible
    gsap.set(elements, { autoAlpha: 0, y: 40 });

    // Determine motion intensity
    var speed = ctx.motion === 'minimal' ? 0.4 : ctx.motion === 'punchy' ? 0.5 : 0.7;
    var stagger = ctx.motion === 'minimal' ? 0.1 : ctx.motion === 'punchy' ? 0.12 : 0.18;
    var ease = ctx.motion === 'punchy' ? 'back.out(1.2)' : 'power3.out';

    // Entrance
    tl.to(elements, {
      autoAlpha: 1,
      y: 0,
      duration: speed,
      stagger: stagger,
      ease: ease
    }, 0.3);

    // Exit (if scene is long enough)
    if (ctx.duration > 2) {
      var exitAt = ctx.duration - 0.8;
      tl.to(elements, {
        autoAlpha: 0,
        y: -20,
        duration: 0.4,
        stagger: 0.05,
        ease: 'power2.in'
      }, exitAt);
    }

    return tl;
  }
</script>
