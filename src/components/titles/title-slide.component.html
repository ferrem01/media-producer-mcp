<script>
  function createTimeline(el, data, ctx) {
    var tl = gsap.timeline();

    var badge = el.querySelector('.badge');
    var title = el.querySelector('.title');
    var subtitle = el.querySelector('.subtitle');

    var elements = [badge, title, subtitle].filter(function(e) {
      return e && e.textContent.trim();
    });

    // Start invisible with scale + blur for dramatic entrance
    gsap.set(elements, { autoAlpha: 0, scale: 1.1, filter: 'blur(8px)' });

    // Determine motion intensity
    var speed = ctx.motion === 'minimal' ? 0.5 : ctx.motion === 'punchy' ? 0.6 : 0.8;
    var stagger = ctx.motion === 'minimal' ? 0.12 : ctx.motion === 'punchy' ? 0.15 : 0.2;
    var ease = ctx.motion === 'punchy' ? 'back.out(1.2)' : 'power3.out';

    // Entrance - scale down from 1.1 + clear blur
    tl.to(elements, {
      autoAlpha: 1,
      scale: 1,
      filter: 'blur(0px)',
      duration: speed,
      stagger: stagger,
      ease: ease
    }, 0.3);

    // Exit (if scene is long enough)
    if (ctx.duration > 2) {
      var exitAt = ctx.duration - 0.8;
      tl.to(elements, {
        autoAlpha: 0,
        scale: 0.95,
        filter: 'blur(4px)',
        duration: 0.4,
        stagger: 0.05,
        ease: 'power2.in'
      }, exitAt);
    }

    return tl;
  }
</script>
