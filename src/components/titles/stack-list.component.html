<style scoped>
  /* THE STACKING LIST (the Scale Army cut, recipe founder-selfie-punch-cards):
     a small lead line, then short items rising one per spoken word, flush
     left in the brand colour. On a white card first; then the SAME list
     rides over the person as the film cuts back (cast it again on the next
     scene with ground 'none' and settled true -- it opens already landed). */
  .stl {
    position: absolute;
    inset: 0;
    overflow: hidden;
    background: var(--stl-ground, #ffffff);
    font-family: var(--mp-font-family, 'Inter', system-ui, -apple-system, sans-serif);
  }
  .stl-col {
    position: absolute;
    left: 7%;
    top: 8%;
    right: 7%;
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 0.12em;
    font-size: 88px;
    color: var(--stl-ink, var(--mp-color-primary, #f0643a));
  }
  .stl-lead {
    font-size: 0.42em;
    font-weight: 600;
    letter-spacing: -0.01em;
    margin-bottom: 0.3em;
  }
  .stl-items {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 0.06em;
  }
  .stl-item {
    font-weight: 800;
    line-height: 1.04;
    letter-spacing: -0.03em;
    white-space: nowrap;
  }
  /* Over live picture the words carry their own ground: a soft dark halo
     so the brand colour still reads on a bright room. */
  .stl.over .stl-col {
    text-shadow: 0 2px 10px rgba(0, 0, 0, 0.45), 0 6px 26px rgba(0, 0, 0, 0.35);
  }
</style>

<script>
  function createTimeline(el, data, ctx) {
    var tl = gsap.timeline();
    var root = el.querySelector('.stl');
    var col = el.querySelector('.stl-col');
    var leadEl = el.querySelector('.stl-lead');
    var itemsEl = el.querySelector('.stl-items');
    if (!root || !col) return tl;
    var items = (data && Array.isArray(data.items)) ? data.items.map(function (it) { return typeof it === 'string' ? { text: it } : (it || {}); }).filter(function (it) { return String(it.text || '').trim(); }) : [];
    var lead = String((data && data.lead) || '');
    if (!items.length && !lead) return tl;

    var ground = String((data && data.ground) || 'white');
    if (ground === 'none') { root.style.background = 'transparent'; root.classList.add('over'); }
    else if (ground !== 'white') root.style.setProperty('--stl-ground', ground);
    if (data && data.ink) root.style.setProperty('--stl-ink', String(data.ink));
    if (data && data.align === 'right') { col.style.alignItems = 'flex-end'; itemsEl.style.alignItems = 'flex-end'; col.style.textAlign = 'right'; }

    var W = el.clientWidth || 1080, H = el.clientHeight || 1920;
    var fs = Math.round(W * (typeof data.size === 'number' ? data.size : 0.08));
    col.style.fontSize = fs + 'px';
    if (lead) leadEl.textContent = lead; else leadEl.style.display = 'none';
    var nodes = items.map(function (it) {
      var d = document.createElement('div');
      d.className = 'stl-item';
      d.textContent = String(it.text);
      itemsEl.appendChild(d);
      return d;
    });
    // Fit: the column stays inside its box (width and height).
    var guard = 0;
    while (guard++ < 30 && fs > 20 && (col.scrollWidth > W * 0.86 + 1 || col.offsetHeight > H * 0.84)) { fs = Math.round(fs * 0.92); col.style.fontSize = fs + 'px'; }

    // Settled (the carry-over onto the person): everything already landed.
    if (data && data.settled) return tl;

    var at = data && data.at != null ? Number(data.at) : 0.15;
    var step = data && data.step != null ? Number(data.step) : 0.4;
    if (lead) tl.fromTo(leadEl, { autoAlpha: 0, y: 12 }, { autoAlpha: 1, y: 0, duration: 0.25, ease: 'power2.out', immediateRender: true }, at);
    nodes.forEach(function (n, i) {
      var t = items[i].at != null ? Number(items[i].at) : at + (lead ? 0.45 : 0) + i * step;
      tl.fromTo(n, { autoAlpha: 0, y: 22 }, { autoAlpha: 1, y: 0, duration: 0.26, ease: 'back.out(1.8)', immediateRender: true }, t);
    });
    return tl;
  }
</script>
