<style scoped>

<script>
  function createTimeline(el, data, ctx) {
    var tl = gsap.timeline();
    var q = function (s) { return el.querySelector(s); };
    var root = q('.qb-root'), card = q('.qb-card');
    var DUR = (ctx && ctx.duration) || 5;
    var gl = window.mpGroundLum ? mpGroundLum() : null;
    var surface = data.surface === 'card' ? 'card' : 'none';
    // On the bare ground the ink follows the MEASURED ground; on a card, the card.
    var theme = data.theme === 'dark' || data.theme === 'light' ? data.theme : (typeof gl === 'number' && gl < 0.18 ? 'dark' : 'light');
    root.classList.add('t-' + theme, 'surface-' + surface);
    if (data.align === 'left') root.classList.add('align-left');

    // Quote as word spans (the highlight phrase takes the accent: emphasis is color only).
    var quote = String(data.quote || '').replace(/^["“]|["”]$/g, '');
    var hi = String(data.highlight || '').trim();
    var hs = hi ? quote.toLowerCase().indexOf(hi.toLowerCase()) : -1;
    var qEl = q('.qb-quote');
    var words = [], pos = 0;
    quote.split(/(\s+)/).forEach(function (part) {
      if (!part) return;
      if (/^\s+$/.test(part)) { if (words.length) words[words.length - 1].textContent += part; pos += part.length; return; }
      var w = document.createElement('span'); w.className = 'qb-w'; w.textContent = part;
      if (hs >= 0 && pos >= hs && pos < hs + hi.length) w.classList.add('hl');
      qEl.appendChild(w); words.push(w); pos += part.length;
    });
    q('.qb-author').textContent = String(data.author || '');
    q('.qb-role').textContent = String(data.role || '');
    if (!data.author && !data.role) q('.qb-attr').style.display = 'none';
    if (data.avatar) {
      var img = document.createElement('img'); img.src = String(data.avatar); img.alt = '';
      img.onerror = function () { img.remove(); };
      q('.qb-avatar').appendChild(img);
    }

    // SIZE: display type from the box, shrink until the whole quote fits.
    var W0 = el.clientWidth || 900, H0 = el.clientHeight || 520, pad = Math.round(Math.min(W0, H0) * 0.06);
    // Shadows are sized from this margin so the slot (which clips) never cuts them.
    root.style.setProperty('--pad', pad + 'px');
    // A full-frame slot overhangs the frame (the camera layer is larger than
    // the canvas; measured: cards 9px from the edge), so the margin is kept
    // inside what is SEEN.
    var rc = el.getBoundingClientRect(), sc = rc.width / W0 || 1;
    var ox = Math.max(0, -rc.left, rc.right - window.innerWidth) / sc, oy = Math.max(0, -rc.top, rc.bottom - window.innerHeight) / sc;
    var W = W0 - 2 * (pad + ox), H = H0 - 2 * (pad + oy);
    card.style.maxWidth = W + 'px';
    card.style.width = W + 'px';
    var u = Math.min(W / 760, H / 400);
    for (var i = 0; i < 34; i++) {
      root.style.setProperty('--u', u.toFixed(3) + 'px');
      if (card.scrollHeight <= H + 1 && card.scrollWidth <= card.clientWidth + 1) break;
      u *= 0.95;
    }
    // Balance the lines (same count, even lengths) before grouping them.
    qEl.style.textWrap = 'balance';
    var lines = [], lastTop = null;
    words.forEach(function (w) { var t = w.offsetTop; if (lastTop === null || Math.abs(t - lastTop) > 2) { lines.push([]); lastTop = t; } lines[lines.length - 1].push(w); });
    var lineEls = lines.map(function (ws) {
      var ln = document.createElement('span'); ln.className = 'qb-line';
      qEl.insertBefore(ln, ws[0]); ws.forEach(function (w) { ln.appendChild(w); });
      return ln;
    });

    // MOTION: glyph lands, lines rise in reading order, the rule draws,
    // the attribution lands. The card (if any) rises first.
    var AT = Number(data.at) || 0.2;
    if (surface === 'card') {
      gsap.set(card, { autoAlpha: 0, y: 28 });
      tl.to(card, { autoAlpha: 1, y: 0, duration: 0.55, ease: 'power3.out' }, AT);
      AT += 0.15;
    }
    gsap.set(q('.qb-glyph'), { autoAlpha: 0, y: 10 });
    tl.to(q('.qb-glyph'), { autoAlpha: 1, y: 0, duration: 0.4, ease: 'power3.out' }, AT);
    if (window.mpLineRise) mpLineRise(tl, lineEls, AT + 0.15, { stagger: 0.12, duration: 0.42, rise: 14 });
    var t = AT + 0.35 + lineEls.length * 0.12;
    gsap.set(q('.qb-rule'), { scaleX: 0 });
    tl.to(q('.qb-rule'), { scaleX: 1, duration: 0.4, ease: 'power2.inOut' }, t);
    var who = [q('.qb-avatar'), q('.qb-who')];
    gsap.set(who, { autoAlpha: 0, x: -8 });
    tl.to(who, { autoAlpha: 1, x: 0, duration: 0.4, stagger: 0.06, ease: 'power3.out' }, t + 0.2);
    if (data.exit === true && DUR > 2) tl.to(card, { autoAlpha: 0, y: -16, duration: 0.4, ease: 'power2.in' }, DUR - 0.5);
    return tl;
  }
</script>
