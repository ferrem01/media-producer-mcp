    <div class="quote-mark close">&rdquo;</div>
    <div class="attribution">
      <span class="author">{{author}}</span>
      <span class="role">{{role}}</span>
    </div>
  </div>
</template>

<style scoped>

    display: none;

<script>
  function createTimeline(el, data, ctx) {
    var tl = gsap.timeline();

    var openMark = el.querySelector('.quote-mark.open');
    var closeMark = el.querySelector('.quote-mark.close');
    var quoteText = el.querySelector('.quote-text');
    var attribution = el.querySelector('.attribution');

    var allElements = [openMark, quoteText, closeMark, attribution].filter(function(e) {
      return e && e.textContent.trim();
    });

    var speed = ctx.motion === 'minimal' ? 0.4 : ctx.motion === 'punchy' ? 0.5 : 0.7;
    var ease = ctx.motion === 'punchy' ? 'back.out(1.2)' : 'power3.out';

    gsap.set(openMark, { autoAlpha: 0, scale: 0.5 });
    gsap.set(closeMark, { autoAlpha: 0, scale: 0.5 });
    gsap.set(quoteText, { autoAlpha: 0, y: 30 });
    gsap.set(attribution, { autoAlpha: 0, y: 20 });

    tl.to(openMark, {
      autoAlpha: 0.3,
      scale: 1,
      duration: speed,
      ease: ease
    }, 0.2);

    tl.to(quoteText, {
      autoAlpha: 1,
      y: 0,
      duration: speed,
      ease: ease
    }, 0.4);

    tl.to(closeMark, {
      autoAlpha: 0.3,
      scale: 1,
      duration: speed,
      ease: ease
    }, 0.5);

    tl.to(attribution, {
      autoAlpha: 1,
      y: 0,
      duration: speed * 0.8,
      ease: ease
    }, 0.7);

    if (ctx.duration > 2.5) {
      var exitAt = ctx.duration - 0.7;
      tl.to(allElements, {
        autoAlpha: 0,
        y: -15,
        duration: 0.4,
        stagger: 0.04,
        ease: 'power2.in'
      }, exitAt);
    }

    return tl;
  }
</script>
