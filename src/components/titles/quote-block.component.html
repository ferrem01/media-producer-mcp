      </div>
    </div>
  </div>
</template>

<script>
  function createTimeline(el, data, ctx) {
    var tl = gsap.timeline();

    var card = el.querySelector('.quote-card');
    var openMark = el.querySelector('.quote-mark.open');
    var closeMark = el.querySelector('.quote-mark.close');
    var quoteText = el.querySelector('.quote-text');
    var attribution = el.querySelector('.attribution');

    var speed = ctx.motion === 'minimal' ? 0.4 : ctx.motion === 'punchy' ? 0.55 : 0.75;
    var ease = ctx.motion === 'punchy' ? 'back.out(1.2)' : 'power3.out';

    // Initial states
    gsap.set(card, { autoAlpha: 0, y: 40, scale: 1.05, filter: 'blur(4px)' });
    gsap.set(openMark, { autoAlpha: 0, scale: 0.6 });
    gsap.set(closeMark, { autoAlpha: 0, scale: 0.6 });
    gsap.set(quoteText, { autoAlpha: 0, y: 20 });
    gsap.set(attribution, { autoAlpha: 0, y: 15 });

    // Card entrance
    tl.to(card, {
      autoAlpha: 1, y: 0, scale: 1, filter: 'blur(0px)',
      duration: speed,
      ease: ease
    }, 0.2);

    // Quote marks
    tl.to(openMark, {
      autoAlpha: 0.25, scale: 1,
      duration: speed * 0.7,
      ease: ease
    }, 0.3 + speed * 0.3);

    // Quote text
    tl.to(quoteText, {
      autoAlpha: 1, y: 0,
      duration: speed * 0.8,
      ease: ease
    }, 0.3 + speed * 0.4);

    tl.to(closeMark, {
      autoAlpha: 0.25, scale: 1,
      duration: speed * 0.7,
      ease: ease
    }, 0.3 + speed * 0.5);

    // Attribution
    tl.to(attribution, {
      autoAlpha: 1, y: 0,
      duration: speed * 0.6,
      ease: 'power2.out'
    }, 0.3 + speed * 0.7);

    // Exit
    if (ctx.duration > 2) {
      var exitAt = ctx.duration - 0.7;
      tl.to(card, {
        autoAlpha: 0, y: -20,
        duration: 0.45,
        ease: 'power2.in'
      }, exitAt);
    }

    return tl;
  }
</script>
