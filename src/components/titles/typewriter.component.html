<template>
  <div class="typewriter">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Special+Elite&family=IBM+Plex+Mono:wght@400;500&display=swap">
    <div class="ambient-glow"></div>
    <div class="text-area">
      <span class="tw-prompt"></span><span class="typed-text"></span><span class="cursor">|</span>
    </div>
  </div>
</template>

<style scoped>
  /* ── typewriter: character-by-character type-on with a riding cursor.
     Three voices via data.style:
       glass (default) -- the house dark glass card (original look)
       print -- ink on the world's surface, typewriter slab, block cursor
       cli   -- monospace prompt line with a chevron and thin caret
     SCRUB-SAFE: characters are PRE-LAID as hidden spans revealed by tl.set
     (hidden chars collapse to zero width, so the cursor rides the frontier).
     The old build mutated textContent from an onUpdate -- GSAP suppresses
     callbacks on seek jumps, which froze the text under Studio scrubbing. */
  .typewriter {
    display: flex; align-items: center; justify-content: center;
    height: 100%; width: 100%; position: relative; overflow: hidden;
    font-family: 'JetBrains Mono', 'Fira Code', 'SF Mono', monospace;
    padding: 80px;
  }
  .ambient-glow {
    position: absolute; width: 600px; height: 400px; border-radius: 50%;
    background: radial-gradient(ellipse, rgba(167,139,250,0.05) 0%, rgba(139,92,246,0.02) 40%, transparent 70%);
    pointer-events: none; z-index: 0;
  }
  .text-area {
    font-size: 42px; font-weight: 500; color: var(--mp-color-text, #ffffff);
    text-align: center; max-width: 80%; line-height: 1.5; letter-spacing: -0.01em;
    position: relative; z-index: 1;
    background: rgba(255,255,255,0.02);
    border: 1px solid rgba(255,255,255,0.04);
    border-radius: 20px; padding: 48px 56px;
    backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    box-shadow: 0 25px 60px rgba(0,0,0,0.3), 0 0 0 1px rgba(255,255,255,0.03);
    text-shadow: 0 0 40px rgba(167,139,250,0.08);
  }
  .typed-text { white-space: pre-wrap; }
  .typed-text span { display: none; }
  .tw-prompt { display: none; }
  .cursor { color: var(--mp-color-accent, #A78BFA); font-weight: 300;
    text-shadow: 0 0 20px rgba(167,139,250,0.5); }

  /* print: type sits IN the world -- no card, no glow, warm ink, slab face */
  .typewriter.is-print { padding: 0; }
  .is-print .ambient-glow { display: none; }
  .is-print .text-area {
    background: transparent; border: 0; border-radius: 0; padding: 0;
    backdrop-filter: none; -webkit-backdrop-filter: none;
    box-shadow: none; text-shadow: none;
    font-family: 'Special Elite', 'Courier New', monospace;
    font-weight: 400; color: var(--mp-ink, #3b342a); letter-spacing: 0.01em;
  }
  .is-print .cursor { color: var(--mp-ink, #3b342a); text-shadow: none; font-weight: 400; }

  /* cli: a command line -- chevron prompt, mono, thin caret */
  .typewriter.is-cli { padding: 0; }
  .is-cli .ambient-glow { display: none; }
  .is-cli .text-area {
    background: transparent; border: 0; border-radius: 0; padding: 0;
    backdrop-filter: none; -webkit-backdrop-filter: none;
    box-shadow: none; text-shadow: none; text-align: left;
    font-family: 'IBM Plex Mono', monospace; font-weight: 400;
    color: var(--mp-ink, #3b342a); letter-spacing: 0;
  }
  .is-cli .tw-prompt { display: inline; margin-right: 0.45em; opacity: 0.55; }
  .is-cli .cursor { color: currentColor; text-shadow: none; font-weight: 400; }
</style>

<script>
  function createTimeline(el, data, ctx) {
    var tl = gsap.timeline();
    var root = el.querySelector('.typewriter');
    var typedText = el.querySelector('.typed-text');
    var cursor = el.querySelector('.cursor');
    var textArea = el.querySelector('.text-area');
    var glow = el.querySelector('.ambient-glow');
    var style = data.style === 'print' || data.style === 'cli' ? data.style : 'glass';
    if (style !== 'glass') root.classList.add('is-' + style);
    if (style === 'cli') {
      el.querySelector('.tw-prompt').textContent = data.prompt || '❯';
      cursor.textContent = '▍';
    }
    if (data.font_size) textArea.style.fontSize = data.font_size;
    if (data.cursor_color) { cursor.style.color = data.cursor_color;
      if (style === 'glass') cursor.style.textShadow = '0 0 20px ' + data.cursor_color; }

    var text = String(data.text || '');
    var speed = Number(data.speed) > 0 ? Number(data.speed) : (style === 'glass' ? 30 : 16);
    var at = data.at !== undefined ? Number(data.at) : (style === 'glass' ? 0.6 : 0.4);

    // Pre-laid characters: hidden spans revealed by tl.set -- pure data on
    // the timeline, correct at any seek position.
    var spans = [];
    for (var i = 0; i < text.length; i++) {
      var sp = document.createElement('span');
      sp.textContent = text[i];
      typedText.appendChild(sp);
      spans.push(sp);
    }
    // THE CARRIAGE IS FIXED. Hidden characters collapse to zero width (that is
    // what lets the cursor ride the typing frontier), so in a box sized by its
    // content the line grows in BOTH directions and every character already
    // typed slides left as the next one lands -- measured at 167px of slide on
    // a 20-character line. On screen it reads as text shuffling in place, not
    // as a line being typed out.
    //
    // Reserve the FINISHED line's width up front and left-align inside it: the
    // block still sits wherever the composition puts it (centred, docked,
    // wherever the scene positioned the component), but it can no longer grow,
    // so the origin never moves and the line types rightward like a carriage.
    // offsetWidth is used deliberately -- it is layout px and ignores the
    // .mp-camera Ken Burns transform, which getBoundingClientRect would fold in.
    spans.forEach(function (sp) { sp.style.display = 'inline'; });
    var reserved = textArea.offsetWidth;
    spans.forEach(function (sp) { sp.style.display = ''; });
    if (reserved) {
      textArea.style.boxSizing = 'border-box';
      textArea.style.minWidth = reserved + 'px';
      textArea.style.textAlign = 'left';
    }

    // PRETYPED: the first N characters (or the length of a given prefix
    // string) are standing from frame one, and typing continues from there.
    // This is what lets a sentence CONTINUE across a boundary or an era flip
    // -- pen-script writes "Writing has always been", fades, and the
    // typewriter picks up mid-sentence instead of visibly retyping the part
    // the viewer just watched being written.
    var pre = typeof data.pretyped === 'string' ? data.pretyped.length : Math.floor(Number(data.pretyped) || 0);
    pre = Math.max(0, Math.min(text.length, pre));
    for (var pi = 0; pi < pre; pi++) spans[pi].style.display = 'inline';

    var remaining = text.length - pre;
    var typeDuration = remaining / speed;
    var maxTypeDuration = Math.max(ctx.duration * 0.7, ctx.duration - 1.5);
    if (typeDuration > maxTypeDuration && remaining) {
      typeDuration = maxTypeDuration;
    }
    var per = remaining ? typeDuration / remaining : 0;
    spans.forEach(function (sp, i) {
      if (i < pre) return;
      tl.set(sp, { display: 'inline' }, at + (i - pre) * per);
    });
    var typedEnd = at + typeDuration;

    if (style === 'glass') {
      gsap.set(textArea, { autoAlpha: 0, y: 30, scale: 1.05, filter: 'blur(5px)' });
      gsap.set(glow, { autoAlpha: 0, scale: 0.6 });
      tl.to(glow, { autoAlpha: 1, scale: 1, duration: 0.8, ease: 'power2.out' }, 0.1);
      tl.to(textArea, { autoAlpha: 1, y: 0, scale: 1, filter: 'blur(0px)', duration: 0.6, ease: 'power3.out' }, 0.2);
    } else {
      gsap.set(textArea, { autoAlpha: 0 });
      tl.to(textArea, { autoAlpha: 1, duration: 0.25 }, Math.max(0, at - 0.25));
    }

    // Cursor blink after typing completes -- deterministic yoyo tween, not a
    // CSS animation (CSS runs on the wall clock and breaks seek determinism).
    var blinks = data.hold_cursor === false ? 0 : 4;
    if (blinks) {
      tl.to(cursor, { opacity: 0, duration: 0.05, repeat: blinks * 2 - 1, yoyo: true,
        repeatDelay: 0.4, ease: 'none' }, typedEnd + 0.3);
    }

    // Exit (glass keeps its house exit; print/cli hold for the scene)
    if (style === 'glass' && ctx.duration > typeDuration + 1.5) {
      var exitAt = ctx.duration - 0.7;
      tl.to(textArea, { autoAlpha: 0, y: -15, scale: 0.97, duration: 0.45, ease: 'power2.in' }, exitAt);
      tl.to(glow, { autoAlpha: 0, duration: 0.4, ease: 'power2.in' }, exitAt);
    }

    return tl;
  }
</script>
