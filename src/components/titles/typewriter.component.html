<template>
  <div class="typewriter">
    <div class="text-area">
      <span class="typed-text"></span>
      <span class="cursor">|</span>
    </div>
  </div>
</template>

<style scoped>
  .typewriter {
    display: flex;
    align-items: center;
    justify-content: center;
    height: 100%;
    width: 100%;
    font-family: 'JetBrains Mono', 'Fira Code', 'SF Mono', monospace;

  }

  .text-area {
    font-size: 42px;

  }

    white-space: pre-wrap;
  }

  .cursor {
    color: var(--mp-color-accent, #A78BFA);
    font-weight: 300;
    text-shadow: 0 0 20px rgba(167, 139, 250, 0.5);
    animation: blink 0.6s step-end infinite;
  }

  @keyframes blink {
    0%, 100% { opacity: 1; }
    50% { opacity: 0; }
  }
</style>

<script>
  function createTimeline(el, data, ctx) {
    var tl = gsap.timeline();
    var typedText = el.querySelector('.typed-text');
    var cursor = el.querySelector('.cursor');
    var textArea = el.querySelector('.text-area');
    var text = data.text || '';
    var speed = data.speed || 30;

    if (data.cursor_color) {
      cursor.style.color = data.cursor_color;
      cursor.style.textShadow = '0 0 20px ' + data.cursor_color;
    }

    var typeDuration = text.length / speed;
    var maxTypeDuration = Math.max(ctx.duration * 0.7, ctx.duration - 1.5);
    if (typeDuration > maxTypeDuration) {
      typeDuration = maxTypeDuration;
    }

    var counter = { index: 0 };

    // Initial state
    gsap.set(textArea, { autoAlpha: 0, y: 20 });
    typedText.textContent = '';

    // Fade in text area
    tl.to(textArea, {
      autoAlpha: 1,
      y: 0,
      duration: 0.5,
      ease: 'power3.out'
    }, 0.2);

    // Type characters
    tl.to(counter, {
      index: text.length,
      duration: typeDuration,
      ease: 'steps(' + text.length + ')',
      onUpdate: function() {
        typedText.textContent = text.substring(0, Math.round(counter.index));
      }
    }, 0.5);

    // Exit
    if (ctx.duration > typeDuration + 1.5) {
      var exitAt = ctx.duration - 0.6;
      tl.to(textArea, {
        autoAlpha: 0,
        y: -15,
        duration: 0.4,
        ease: 'power2.in'
      }, exitAt);
    }

    return tl;
  }
</script>
