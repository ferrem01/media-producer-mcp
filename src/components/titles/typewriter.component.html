<template>
  <div class="typewriter">
    <div class="ambient-glow"></div>
    <div class="text-area">
      <span class="typed-text"></span>
      <span class="cursor">|</span>
    </div>
  </div>
</template>

<style scoped>
  .typewriter {
    display: flex;
    align-items: center;
    justify-content: center;
    height: 100%;
    width: 100%;
    font-family: 'JetBrains Mono', 'Fira Code', 'SF Mono', monospace;
    padding: 80px;
    position: relative;
    overflow: hidden;
  }

  .ambient-glow {
    position: absolute;
    width: 600px;
    height: 400px;
    border-radius: 50%;
    background: radial-gradient(
      ellipse,
      rgba(167, 139, 250, 0.05) 0%,
      rgba(139, 92, 246, 0.02) 40%,
      transparent 70%
    );
    pointer-events: none;
    z-index: 0;
  }

  .text-area {
    font-size: 42px;
    font-weight: 500;
    color: var(--mp-color-text, #ffffff);
    text-align: center;
    max-width: 80%;
    line-height: 1.5;
    letter-spacing: -0.01em;
    position: relative;
    z-index: 1;
    background: rgba(255, 255, 255, 0.02);
    border: 1px solid rgba(255, 255, 255, 0.04);
    border-radius: 20px;
    padding: 48px 56px;
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    box-shadow:
      0 25px 60px rgba(0, 0, 0, 0.3),
      0 0 0 1px rgba(255, 255, 255, 0.03);
    text-shadow: 0 0 40px rgba(167, 139, 250, 0.08);
  }

  .typed-text {
    white-space: pre-wrap;
  }

  .cursor {
    color: var(--mp-color-accent, #A78BFA);
    font-weight: 300;
    text-shadow: 0 0 20px rgba(167, 139, 250, 0.5);
    animation: blink 0.6s step-end infinite;
  }

  @keyframes blink {
    0%, 100% { opacity: 1; }
    50% { opacity: 0; }
  }
</style>

<script>
  function createTimeline(el, data, ctx) {
    var tl = gsap.timeline();
    var typedText = el.querySelector('.typed-text');
    var cursor = el.querySelector('.cursor');
    var textArea = el.querySelector('.text-area');
    var glow = el.querySelector('.ambient-glow');
    var text = data.text || '';
    var speed = data.speed || 30;

    if (data.cursor_color) {
      cursor.style.color = data.cursor_color;
      cursor.style.textShadow = '0 0 20px ' + data.cursor_color;
    }

    var typeDuration = text.length / speed;
    var maxTypeDuration = Math.max(ctx.duration * 0.7, ctx.duration - 1.5);
    if (typeDuration > maxTypeDuration) {
      typeDuration = maxTypeDuration;
    }

    var counter = { index: 0 };

    // Initial state
    gsap.set(textArea, { autoAlpha: 0, y: 30, scale: 1.05, filter: 'blur(5px)' });
    gsap.set(glow, { autoAlpha: 0, scale: 0.6 });
    typedText.textContent = '';

    // Ambient glow
    tl.to(glow, {
      autoAlpha: 1, scale: 1,
      duration: 0.8,
      ease: 'power2.out'
    }, 0.1);

    // Fade in text area with scale + blur
    tl.to(textArea, {
      autoAlpha: 1,
      y: 0,
      scale: 1,
      filter: 'blur(0px)',
      duration: 0.6,
      ease: 'power3.out'
    }, 0.2);

    // Type characters
    tl.to(counter, {
      index: text.length,
      duration: typeDuration,
      ease: 'steps(' + text.length + ')',
      onUpdate: function() {
        typedText.textContent = text.substring(0, Math.round(counter.index));
      }
    }, 0.6);

    // Exit
    if (ctx.duration > typeDuration + 1.5) {
      var exitAt = ctx.duration - 0.7;
      tl.to(textArea, {
        autoAlpha: 0,
        y: -15,
        scale: 0.97,
        duration: 0.45,
        ease: 'power2.in'
      }, exitAt);
      tl.to(glow, {
        autoAlpha: 0,
        duration: 0.4,
        ease: 'power2.in'
      }, exitAt);
    }

    return tl;
  }
</script>
