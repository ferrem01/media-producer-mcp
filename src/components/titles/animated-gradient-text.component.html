<template>
  <div class="gradient-text-wrap">
    <h1 class="gradient-text"></h1>
  </div>
</template>

<style scoped>
  .gradient-text-wrap {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 100%;
    height: 100%;
    padding: 80px;
    font-family: var(--mp-font-family, 'Inter', system-ui, -apple-system, sans-serif);
    overflow: hidden;
  }

  .gradient-text {
    font-size: 100px;
    font-weight: 800;
    text-align: center;
    margin: 0;
    line-height: 1.05;
    letter-spacing: -0.03em;
    max-width: 90%;
    background-size: 300% 100%;
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    animation-timing-function: linear;
    animation-iteration-count: infinite;
  }

  @keyframes gradientShift {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }
</style>

<script>
  function createTimeline(el, data, ctx) {
    var tl = gsap.timeline();
    var textEl = el.querySelector('.gradient-text');

    textEl.textContent = data.text || '';

    // Set up gradient colors
    var colors = data.colors || ['#A78BFA', '#F472B6', '#60A5FA', '#34D399', '#A78BFA'];
    if (colors.length < 2) colors.push('#A78BFA');
    // Ensure seamless loop by repeating first color at end
    if (colors[colors.length - 1] !== colors[0]) {
      colors.push(colors[0]);
    }

    var gradientStr = 'linear-gradient(90deg, ' + colors.join(', ') + ')';
    textEl.style.backgroundImage = gradientStr;

    // Animation speed
    var speed = data.speed || 3;
    textEl.style.animationName = 'gradientShift';
    textEl.style.animationDuration = speed + 's';

    // Entrance: scale from large + blur
    gsap.set(textEl, {
      autoAlpha: 0,
      scale: 1.8,
      filter: 'blur(16px)'
    });

    var entranceSpeed = ctx.motion === 'minimal' ? 0.5 : ctx.motion === 'punchy' ? 0.7 : 1.2;

    tl.to(textEl, {
      autoAlpha: 1,
      scale: 1,
      filter: 'blur(0px)',
      duration: entranceSpeed,
      ease: 'power3.out'
    }, 0.2);

    // Exit
    if (ctx.duration > 2) {
      var exitAt = ctx.duration - 0.7;
      tl.to(textEl, {
        autoAlpha: 0,
        scale: 0.9,
        filter: 'blur(10px)',
        duration: 0.6,
        ease: 'power2.in'
      }, exitAt);
    }

    return tl;
  }
</script>
