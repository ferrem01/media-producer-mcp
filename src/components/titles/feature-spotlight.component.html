<script>
  function createTimeline(el, data, ctx) {
    var tl = gsap.timeline();
    var titleEl = el.querySelector('.spotlight-title');
    var descEl = el.querySelector('.spotlight-description');
    var visualWrap = el.querySelector('.spotlight-visual');
    var iconEl = el.querySelector('.visual-icon');
    var glowEl = el.querySelector('.visual-glow');

    if (data.title) titleEl.textContent = data.title;
    if (data.description) descEl.textContent = data.description;
    if (data.icon) iconEl.textContent = data.icon;
    if (data.visual) iconEl.textContent = data.visual;

    // The description sits on the PAGE: hardcoded #94a3b8 measured 2.24:1 on
    // a white ground (cert, needs 4.5:1 at 20px). Pick muted ink from the
    // measured ground instead.
    var lum = window.mpGroundLum ? mpGroundLum() : null;
    if (typeof lum === 'number') {
      descEl.style.color = lum < 0.18 ? '#e6e9f2' : '#4d5461';
    }

    // The icon slot expects a glyph; if longer copy lands in it, shrink to
    // fit the 140px circle instead of overflowing the frame.
    if (iconEl.textContent && iconEl.scrollWidth > iconEl.clientWidth) {
      var ifs = parseFloat(getComputedStyle(iconEl).fontSize) || 56;
      iconEl.style.fontSize = Math.max(16, Math.floor(ifs * iconEl.clientWidth / iconEl.scrollWidth)) + 'px';
    }

    var speed = ctx.motion === 'minimal' ? 0.5 : ctx.motion === 'punchy' ? 0.7 : 1.0;

    // Initial states
    gsap.set(titleEl, { autoAlpha: 0, x: -40, filter: 'blur(4px)' });
    gsap.set(descEl, { autoAlpha: 0, x: -30 });
    gsap.set(visualWrap, { autoAlpha: 0, scale: 0.7, filter: 'blur(6px)' });
    gsap.set(glowEl, { scale: 0.5, autoAlpha: 0 });

    // Text entrance from left
    tl.to(titleEl, {
      autoAlpha: 1, x: 0, filter: 'blur(0px)',
      duration: speed,
      ease: 'power3.out'
    }, 0.3);

    tl.to(descEl, {
      autoAlpha: 1, x: 0,
      duration: speed * 0.8,
      ease: 'power2.out'
    }, 0.5);

    // Visual entrance from right (scale in)
    tl.to(visualWrap, {
      autoAlpha: 1, scale: 1, filter: 'blur(0px)',
      duration: speed * 1.1,
      ease: 'back.out(1.4)'
    }, 0.4);

    // Glow pulses in
    tl.to(glowEl, {
      scale: 1, autoAlpha: 1,
      duration: speed * 1.2,
      ease: 'power2.out'
    }, 0.5);

    // Subtle glow pulse
    tl.to(glowEl, {
      scale: 1.15,
      duration: 1.5,
      yoyo: true,
      repeat: 1,
      ease: 'sine.inOut'
    }, 0.5 + speed);

    // Exit
    if (ctx.duration > 2) {
      var exitAt = ctx.duration - 0.7;
      tl.to([titleEl, descEl], {
        autoAlpha: 0, x: -20,
        duration: 0.4,
        stagger: 0.05,
        ease: 'power2.in'
      }, exitAt);
      tl.to(visualWrap, {
        autoAlpha: 0, scale: 0.9,
        duration: 0.4,
        ease: 'power2.in'
      }, exitAt);
    }

    return tl;
  }
</script>
