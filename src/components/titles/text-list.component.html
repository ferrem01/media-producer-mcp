<template>
  <div class="text-list">
    <h2 class="list-title">{{title}}</h2>
    <ul class="list-container"></ul>
  </div>
</template>

<style scoped>
  .text-list {
    display: flex;
    flex-direction: column;
    justify-content: center;
    height: 100%;
    width: 100%;
    font-family: var(--mp-font-family, 'Inter', system-ui, -apple-system, sans-serif);
    padding: 100px 120px;
  }

  .list-title {
    font-size: 44px;
    font-weight: 700;

    margin: 0 0 44px 0;
    letter-spacing: -0.02em;

  }

  .list-title:empty {
    display: none;
  }

  .list-container {
    list-style: none;
    padding: 0;
    margin: 0;
    display: flex;
    flex-direction: column;
    gap: 20px;
    max-width: 60%;
  }

  .list-item {
    display: flex;
    align-items: flex-start;
    gap: 16px;
    font-size: 20px;
    color: #cbd5e1;

  }

  .list-marker {
    flex-shrink: 0;
    color: var(--mp-color-accent, #A78BFA);

    content: '\25CF';
    font-size: 12px;
  }

  .list-marker.check::before {
    content: '\2713';
    font-size: 18px;
  }

  .list-text {
    font-weight: 400;
    letter-spacing: 0.005em;
  }
</style>

<script>
  function createTimeline(el, data, ctx) {
    var tl = gsap.timeline();
    var container = el.querySelector('.list-container');
    var titleEl = el.querySelector('.list-title');
    var items = data.items || [];
    var style = data.style || 'bullet';

    // Cap at 6 items
    if (items.length > 6) items = items.slice(0, 6);

    container.innerHTML = '';

    var itemEls = [];
    items.forEach(function(item, i) {
      var li = document.createElement('li');
      li.className = 'list-item';

      var marker = document.createElement('span');
      marker.className = 'list-marker';

      if (style === 'number') {
        marker.textContent = (i + 1) + '.';
      } else {
        marker.classList.add(style === 'check' ? 'check' : 'bullet');
      }

      var text = document.createElement('span');
      text.className = 'list-text';
      text.textContent = item;

      li.appendChild(marker);
      li.appendChild(text);
      container.appendChild(li);
      itemEls.push(li);
    });

    var speed = ctx.motion === 'minimal' ? 0.3 : ctx.motion === 'punchy' ? 0.45 : 0.55;
    var stagger = ctx.motion === 'minimal' ? 0.08 : ctx.motion === 'punchy' ? 0.1 : 0.15;
    var ease = ctx.motion === 'punchy' ? 'back.out(1.2)' : 'power3.out';

    // Title entrance
    if (titleEl && titleEl.textContent.trim()) {
      gsap.set(titleEl, { autoAlpha: 0, y: 25, filter: 'blur(4px)' });
      tl.to(titleEl, {
        autoAlpha: 1, y: 0, filter: 'blur(0px)',
        duration: speed,
        ease: ease
      }, 0.2);
    }

    // Items entrance with scale + blur
    gsap.set(itemEls, { autoAlpha: 0, y: 20, scale: 1.06, filter: 'blur(4px)' });

    tl.to(itemEls, {
      autoAlpha: 1, y: 0, scale: 1, filter: 'blur(0px)',
      duration: speed,
      stagger: stagger,
      ease: ease
    }, titleEl && titleEl.textContent.trim() ? 0.5 : 0.2);

    // Exit
    if (ctx.duration > 2) {
      var exitAt = ctx.duration - 0.6;
      var exitEls = [];
      if (titleEl && titleEl.textContent.trim()) exitEls.push(titleEl);
      exitEls = exitEls.concat(itemEls);
      tl.to(exitEls, {
        autoAlpha: 0,
        duration: 0.35,
        stagger: 0.03,
        ease: 'power2.in'
      }, exitAt);
    }

    return tl;
  }
</script>
