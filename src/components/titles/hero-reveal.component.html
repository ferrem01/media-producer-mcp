    <p class="hero-subtitle"></p>
  </div>
</template>

<style scoped>
  .hero-reveal {

    display: none;

</style>

<script>
  function createTimeline(el, data, ctx) {
    var tl = gsap.timeline();
    var textEl = el.querySelector('.hero-text');
    var subtitleEl = el.querySelector('.hero-subtitle');

    textEl.textContent = data.text || '';
    if (data.subtitle) subtitleEl.textContent = data.subtitle;

    var speed = ctx.motion === 'minimal' ? 0.6 : ctx.motion === 'punchy' ? 0.9 : 1.4;

    // Initial: massive scale with heavy blur
    gsap.set(textEl, {
      autoAlpha: 0,
      scale: 2.2,
      filter: 'blur(20px)'
    });
    gsap.set(subtitleEl, { autoAlpha: 0, y: 30 });

    // Dramatic zoom-in reveal with CustomEase if available
    var heroEase = 'power3.out';
    if (typeof CustomEase !== 'undefined') {
      CustomEase.create('heroReveal', 'M0,0 C0.084,0.61 0.214,1.03 0.39,1.03 0.624,1.03 0.658,0.964 1,1');
      heroEase = 'heroReveal';
    }

    tl.to(textEl, {
      autoAlpha: 1,
      scale: 1,
      filter: 'blur(0px)',
      duration: speed,
      ease: heroEase
    }, 0.2);

    // Subtitle fade in after text settles
    if (data.subtitle) {
      tl.to(subtitleEl, {
        autoAlpha: 1,
        y: 0,
        duration: speed * 0.5,
        ease: 'power2.out'
      }, 0.2 + speed * 0.7);
    }

    // Exit
    if (ctx.duration > 2) {
      var exitAt = ctx.duration - 0.7;
      var exitEls = [textEl];
      if (data.subtitle) exitEls.push(subtitleEl);
      tl.to(exitEls, {
        autoAlpha: 0,
        scale: 0.9,
        filter: 'blur(8px)',
        duration: 0.6,
        stagger: 0.05,
        ease: 'power2.in'
      }, exitAt);
    }

    return tl;
  }
</script>
