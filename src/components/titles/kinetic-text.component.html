<template>
  <div class="kinetic-text">
    <div class="text-container"></div>
  </div>
</template>

<style scoped>
  /* House type system: editorial type gets THREE sanctioned entrances.
     1. line-rise (default): the whole line rises ~10px and fades in.
     2. type-on: words appear IN PLACE in reading order on a fixed interval;
        hidden words take no space, so a centered line reflows as it grows
        (the tempo-cut build-up look). No motion paths, no per-word styling --
        the only variable is TIME. Emphasis is color only (*stars*).
     3. assemble: each word ENTERS FROM BELOW THE FRAME and rides up into
        its slot in reading order -- visible for the whole climb, tilted in
        flight, straightening as it lands ("Behind the Craft" 8-10s,
        confirmed against Marc's stills: "the words come in the bottom").
        The *starred* word lands with its letters still wavy, then settles.
        Font-agnostic: spans + transforms only, data.font passes through.
     And ONE sanctioned exit beyond the default fade: exit:"smear-up" -- the
     *starred* word LEADS: its letters roll up in a wave, then the rest of
     the sentence drifts apart and floats up out of frame after it. */
  .kinetic-text {
    display: flex;
    align-items: center;
    justify-content: center;
    height: 100%;
    width: 100%;
    font-family: var(--mp-font-family, 'Inter', system-ui, -apple-system, sans-serif);
    padding: 24px;
    position: relative;
    overflow: hidden;
  }

  .text-container {
    font-size: 60px;
    font-weight: 700;
    color: var(--mp-color-text, #ffffff);
    text-align: center;
    line-height: 1.12;
    letter-spacing: -0.02em;
    max-width: 92%;
  }

  /* Ink hangs outside the word it marks: the scene's max-width:100% clamp
     squeezed a phrase's circle to its first word (measured). */
  .kinetic-text .kt-ink { max-width: none; }

  .text-container .kt-accent {
    color: var(--mp-color-primary, #4f46e5);
  }
</style>

<script>
  function createTimeline(el, data, ctx) {
    var tl = gsap.timeline();
    var container = el.querySelector('.text-container');
    // Display-scale override: hero numerals/headlines size to the shot
    // ("52" at 16vw), not the 60px caption default.
    if (data.font_size) container.style.fontSize = data.font_size;
    // Typeface/tracking overrides: mono terminal lines, letterspaced labels.
    if (data.font) container.style.fontFamily = data.font;
    if (data.letter_spacing) container.style.letterSpacing = data.letter_spacing;
    if (data.font_weight) container.style.fontWeight = String(data.font_weight);
    // align: 'left'/'right' turns the centered caption into a flush block
    // (terminal checklists, editorial column type).
    if (data.align === 'left' || data.align === 'right') {
      container.style.textAlign = data.align;
      el.querySelector('.kinetic-text').style.justifyContent = data.align === 'left' ? 'flex-start' : 'flex-end';
      container.style.maxWidth = '100%';
    }
    var text = String(data.text || '');
    // ~~old=>new~~ strikes a word and brings its replacement in after it
    // ("Reports take ~~hours=>minutes~~"); ~~old~~ alone just strikes. The
    // pair rides through every entrance as one placeholder token, swapped
    // for its real elements once the entrance has built the line.
    var strikes = [];

      var p = body.split('=>');
      strikes.push({ old: p[0].trim(), neu: (p[1] || '').trim() });
      return '\u2063S' + (strikes.length - 1) + '\u2063';
    });

    if (data.color) container.style.color = data.color;
    // Over live pixels (a camera take, b-roll) no single ink is safe: the
    // room behind the words is whatever it is. A plate carries the type.
    if (data.plate) {
      container.style.background = 'rgba(8, 8, 12, 0.58)';
      container.style.padding = '0.14em 0.42em';
      container.style.borderRadius = '0.18em';
      container.style.textShadow = '0 2px 14px rgba(0, 0, 0, 0.45)';
      if (!data.color) container.style.color = '#f5f6fa';

    container.innerHTML = '';
    var re = /\*([^*]+)\*|([^*]+)/g;
    var m;

    if (data.entrance === 'assemble') {
      // Words climb in FROM BELOW THE FRAME, reading order, overlapped: word
      // i is still rising as word i+1 enters. Rise distance is measured per
      // word from its own slot to past the stage bottom (multiline lines
      // higher up climb further), so the behaviour holds for any font, size
      // or layout. Drift/tilt come from a deterministic index hash -- no
      // Math.random, renders must repeat. The starred word is built
      // per-character: its letters land wavy and settle, and the smear-up
      // exit peels them back off.
      var awords = [];
      while ((m = re.exec(text)) !== null) {
        var isAcc = m[1] !== undefined;
        String(isAcc ? m[1] : m[2]).split(/\s+/).forEach(function (w) {
          if (w) awords.push({ w: w, accent: isAcc });
        });
      }
      var aAt = data.at !== undefined ? Number(data.at) : 0.3;
      var aStep = Number(data.word_interval) > 0 ? Number(data.word_interval) : 0.2;
      var rnd = function (i, k) { var v = Math.sin(i * 127.1 + k * 311.7) * 43758.5453; return v - Math.floor(v); };
      // Travelling words must be visible OUTSIDE the caption box.
      el.querySelector('.kinetic-text').style.overflow = 'visible';
      var spansA = [];
      awords.forEach(function (it, i) {
        var span = document.createElement('span');
        if (it.accent) span.className = 'kt-accent';
        span.style.display = 'inline-block';
        span.style.whiteSpace = 'pre';
        if (it.accent) {
          ((i > 0 ? ' ' : '') + it.w).split('').forEach(function (ch) {
            var c = document.createElement('span');
            c.textContent = ch;
            c.style.display = 'inline-block';
            c.style.whiteSpace = 'pre';
            span.appendChild(c);
          });
        } else {
          span.textContent = (i > 0 ? ' ' : '') + it.w;
        }
        container.appendChild(span);
        spansA.push({ span: span, it: it });
      });
      // Measure AFTER layout, BEFORE transforms: each word's climb starts
      // just past the stage bottom, wherever its slot is.
      var stageH = (ctx.canvas && ctx.canvas.height) || 1080;
      // MOTION BLUR ON THE TRAVEL (data.blur, default on): a word in flight
      // streaks along its own axis and is sharp the moment it lands -- the
      // After Effects tell the naano launch film has and a plain transform
      // tween lacks. One SVG filter per word, its vertical stdDeviation
      // tweened to zero with the climb, then the filter is dropped so the
      // landed line costs nothing and renders crisp.
      var mbOn = data.blur !== false && stageH > 0;
      window.__ktmb = (window.__ktmb || 0) + 1; // unique per instance, stable per boot
      var mbId = 'ktmb' + window.__ktmb;
      var mbSvg = null;
      if (mbOn) {
        mbSvg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
        mbSvg.setAttribute('width', '0');
        mbSvg.setAttribute('height', '0');
        mbSvg.style.cssText = 'position:absolute;width:0;height:0;overflow:hidden;';
        el.querySelector('.kinetic-text').appendChild(mbSvg);
      }
      spansA.forEach(function (o, i) {
        var slotTop = o.span.getBoundingClientRect().top;
        var rise = Math.max(120, stageH * 1.1 - slotTop);
        var when = aAt + i * aStep;
        gsap.set(o.span, {
          y: rise,
          x: (rnd(i, 1) - 0.5) * 180,
          rotation: (rnd(i, 3) - 0.5) * 14,
        });
        tl.to(o.span, { y: 0, x: 0, rotation: 0, duration: 0.8, ease: 'power2.out' }, when);
        if (mbSvg) {
          var f = document.createElementNS('http://www.w3.org/2000/svg', 'filter');
          f.setAttribute('id', mbId + '-' + i);
          f.setAttribute('x', '-40%'); f.setAttribute('y', '-120%');
          f.setAttribute('width', '180%'); f.setAttribute('height', '340%');
          f.setAttribute('color-interpolation-filters', 'sRGB');
          var fb = document.createElementNS('http://www.w3.org/2000/svg', 'feGaussianBlur');
          fb.setAttribute('stdDeviation', '0 0');
          f.appendChild(fb);
          mbSvg.appendChild(f);

          // frame smears more than one rising a line.
          var smear = Math.min(28, Math.max(10, rise * 0.024));
          tl.set(o.span, { filter: 'url(#' + mbId + '-' + i + ')' }, when);

          tl.fromTo(fb, { attr: { stdDeviation: '0 ' + smear } }, { attr: { stdDeviation: '0 0' }, duration: 0.8, ease: 'power1.out' }, when);
          tl.set(o.span, { filter: 'none' }, when + 0.8);
        }
        if (o.it.accent && o.span.children.length) {
          // Land wavy, then settle letter by letter.
          Array.prototype.slice.call(o.span.children).forEach(function (c, ci) {
            gsap.set(c, { y: (ci % 2 ? -1 : 1) * (6 + rnd(ci, 5) * 8), rotation: (rnd(ci, 6) - 0.5) * 10 });
            tl.to(c, { y: 0, rotation: 0, duration: 0.45, ease: 'power2.out' }, when + 0.55 + ci * 0.05);
          });
        }
      });
    } else if (data.entrance === 'type-on') {
      // Word-by-word build-up. Every word is in the DOM up front but takes
      // no space until its beat, so the line re-centers as it grows. Words
      // APPEAR -- no fade, no travel; scrub-safe (pure tl.set).
      var words = [];
      while ((m = re.exec(text)) !== null) {
        var isAccent = m[1] !== undefined;
        String(isAccent ? m[1] : m[2]).split(/\s+/).forEach(function (w) {
          if (w) words.push({ w: w, accent: isAccent });
        });
      }
      var at = data.at !== undefined ? Number(data.at) : 0.3;
      var step = Number(data.word_interval) > 0 ? Number(data.word_interval) : 0.14;
      words.forEach(function (it, i) {
        var span = document.createElement('span');
        if (it.accent) span.className = 'kt-accent';
        // The joining space lives INSIDE the span so hidden words add none.
        span.textContent = (i > 0 ? ' ' : '') + it.w;
        span.style.display = 'none';
        container.appendChild(span);
        var when = Array.isArray(data.word_times) && data.word_times[i] !== undefined
          ? Number(data.word_times[i]) : at + i * step;
        tl.set(span, { display: 'inline' }, when);
      });
    } else if (data.entrance === 'focus') {
      // Focus pull, word by word: each word is in its final place from the
      // start and comes INTO FOCUS on its beat -- blur to sharp, faint to
      // full (the Cosmos line reveal). The line never reflows.
      var fwords = [];
      while ((m = re.exec(text)) !== null) {
        var fAcc = m[1] !== undefined;
        String(fAcc ? m[1] : m[2]).split(/\s+/).forEach(function (w) { if (w) fwords.push({ w: w, accent: fAcc }); });
      }
      var fAt = data.at !== undefined ? Number(data.at) : 0.3;
      var fStep = Number(data.word_interval) > 0 ? Number(data.word_interval) : 0.16;
      fwords.forEach(function (it, i) {
        if (i > 0) container.appendChild(document.createTextNode(' '));
        var span = document.createElement('span');
        if (it.accent) span.className = 'kt-accent';
        span.style.display = 'inline-block';
        span.textContent = it.w;
        container.appendChild(span);
        var when = Array.isArray(data.word_times) && data.word_times[i] !== undefined ? Number(data.word_times[i]) : fAt + i * fStep;
        gsap.set(span, { autoAlpha: 0, filter: 'blur(14px)', scale: 1.04 });
        tl.to(span, { autoAlpha: 1, filter: 'blur(0px)', scale: 1, duration: 0.55, ease: 'power2.out' }, when);
      });
    } else {
      while ((m = re.exec(text)) !== null) {
        if (m[1] !== undefined) {
          var span = document.createElement('span');
          span.className = 'kt-accent';
          span.textContent = m[1];
          container.appendChild(span);
        } else {
          container.appendChild(document.createTextNode(m[2]));
        }
      }

      if (window.mpLineRise) {
        mpLineRise(tl, container, 0.25);
      } else {
        gsap.set(container, { autoAlpha: 0, y: 10 });
        tl.to(container, { autoAlpha: 1, y: 0, duration: 0.3, ease: 'power3.out' }, 0.25);
      }
    }

    // ---- Marks and strikes: hand-drawn ink on the finished line ----
    var entranceEnd = tl.duration() || 0.6;
    var fontPx = parseFloat(getComputedStyle(container).fontSize) || 60;
    var inkW = Math.max(2, fontPx * 0.055);
    var INK = data.mark_color || 'var(--mp-color-secondary, var(--mp-color-primary, #f59e0b))';
    var hash = function (i, k) { var v = Math.sin((i + 1) * 91.7 + k * 47.3) * 43758.5453; return v - Math.floor(v); };
    container.style.isolation = 'isolate'; // a highlight sits behind the ink, above any plate
    // Ink is drawn in real pixels, measured off the word: a stretched
    // viewBox with a non-scaling stroke dashes in SCREEN units, so the pen
    // line broke into segments (measured). Paths are written on a 0..100
    // grid and scaled into the box here.
    var measured = null;
    function sizeOf(host) {
      if (!measured) {
        // Hidden type-on words take no space until their beat: show them
        // for one measure pass so every word has its real box.
        measured = new Map();
        var hidden = Array.prototype.slice.call(container.querySelectorAll('span')).filter(function (x) { return x.style.display === 'none'; });
        hidden.forEach(function (x) { x.style.display = 'inline'; });
        Array.prototype.slice.call(container.querySelectorAll('.kt-accent, .kt-old')).forEach(function (x) { measured.set(x, { w: x.offsetWidth, h: x.offsetHeight }); });
        hidden.forEach(function (x) { x.style.display = 'none'; });
      }
      return measured.get(host) || { w: host.offsetWidth || fontPx * 2, h: host.offsetHeight || fontPx };
    }
    function inkSvg(host, box, d, size) {
      var hs = size || sizeOf(host);
      var L = box.l * hs.w, T = box.t * hs.h, W = Math.max(4, box.w * hs.w), H = Math.max(4, box.h);
      var k = 0;
      var pd = d.replace(/-?\d+(\.\d+)?/g, function (n) { var v = (k++ % 2 === 0 ? Number(n) * W : Number(n) * H) / 100; return v.toFixed(1); });
      var svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
      svg.setAttribute('viewBox', '0 0 ' + W.toFixed(1) + ' ' + H.toFixed(1));
      svg.setAttribute('class', 'kt-ink');
      svg.style.cssText = 'position:absolute;overflow:visible;pointer-events:none;left:' + L.toFixed(1) + 'px;top:' + T.toFixed(1) + 'px;width:' + W.toFixed(1) + 'px;height:' + H.toFixed(1) + 'px;';
      var path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
      path.setAttribute('d', pd);
      path.setAttribute('fill', 'none');
      path.setAttribute('stroke', INK);
      path.setAttribute('stroke-width', inkW.toFixed(1));
      path.setAttribute('stroke-linecap', 'round');
      path.setAttribute('stroke-linejoin', 'round');
      svg.appendChild(path);
      host.appendChild(svg);
      var len = W + H;
      try { len = path.getTotalLength() || len; } catch (eL) {}
      // Hidden until its stroke starts: a round cap on an empty dash still
      // prints a dot (measured).
      gsap.set(path, { strokeDasharray: len + 2, strokeDashoffset: len + 2, opacity: 0 });
      return path;
    }
    function draw(path, t0, dur, ease) {
      tl.set(path, { opacity: 1 }, t0);
      tl.to(path, { strokeDashoffset: 0, duration: dur, ease: ease }, t0);
    }
    function wob(i, k, amt) { return ((hash(i, k) - 0.5) * amt).toFixed(1); }

    // Strikes: swap each placeholder for the struck word + its replacement.
    var strikeEls = [];
    if (strikes.length) {
      var walker = document.createTreeWalker(container, NodeFilter.SHOW_TEXT);
      var tnodes = [];
      while (walker.nextNode()) tnodes.push(walker.currentNode);
      tnodes.forEach(function (n) {
        var parts = n.nodeValue.split(/\u2063S(\d+)\u2063/);
        if (parts.length < 2) return;
        var frag = document.createDocumentFragment();
        parts.forEach(function (part, k) {
          if (k % 2 === 0) { if (part) frag.appendChild(document.createTextNode(part)); return; }
          var st = strikes[Number(part)];
          var oldEl = document.createElement('span');
          oldEl.className = 'kt-old';
          oldEl.textContent = st.old;
          oldEl.style.position = 'relative';
          oldEl.style.whiteSpace = 'nowrap';
          frag.appendChild(oldEl);
          var newEl = null;
          if (st.neu) {
            newEl = document.createElement('span');
            newEl.className = 'kt-new';
            newEl.style.display = 'none';
            newEl.style.whiteSpace = 'pre';
            newEl.appendChild(document.createTextNode(' '));
            var w = document.createElement('span');
            w.className = 'kt-accent';
            w.textContent = st.neu;
            w.style.display = 'inline-block';
            newEl.appendChild(w);
            frag.appendChild(newEl);
          }
          strikeEls.push({ old: oldEl, neu: newEl });
        });
        n.parentNode.replaceChild(frag, n);
      });
    }
    var strikeAt = data.strike_at !== undefined ? Number(data.strike_at) : entranceEnd + 0.2;
    strikeEls.forEach(function (o, i) {
      var t0 = strikeAt + i * 0.5;
      // A quick, slightly rising pen line through the middle of the word.
      var line = inkSvg(o.old, { l: -0.04, t: 0.4, w: 1.08, h: fontPx * 0.22 },
        'M 0 ' + (62 + +wob(i, 1, 10)) + ' C 30 ' + (48 + +wob(i, 2, 14)) + ', 70 ' + (56 + +wob(i, 3, 14)) + ', 100 ' + (36 + +wob(i, 4, 10)));
      draw(line, t0, 0.28, 'power2.in');
      tl.to(o.old, { opacity: 0.42, duration: 0.25, ease: 'power1.out' }, t0 + 0.2);
      if (o.neu) {
        var w = o.neu.lastChild;
        tl.set(o.neu, { display: 'inline' }, t0 + 0.34);
        tl.fromTo(w, { y: '0.35em', opacity: 0, scale: 0.9 }, { y: 0, opacity: 1, scale: 1, duration: 0.42, ease: 'back.out(2.2)', immediateRender: false }, t0 + 0.34);
      }
    });

    // Marks on the *starred* words: highlight | underline | scribble |
    // circle | box -- drawn once the line has landed (or on mark_at).
    var MARK = String(data.mark || '').toLowerCase();
    if (MARK) {
      var markAt = data.mark_at !== undefined ? Number(data.mark_at) : entranceEnd + 0.15 + (strikeEls.length ? 0.4 + strikeEls.length * 0.5 : 0);
      var targets = Array.prototype.slice.call(container.querySelectorAll('.kt-accent')).filter(function (a) { return !a.closest('.kt-new'); });
      // Adjacent starred words (type-on/assemble build one span per word)
      // are ONE phrase: one mark around the run, if it sits on one line.
      var groups = [];
      targets.forEach(function (a) {
        var g = groups[groups.length - 1];
        var prev = g && g[g.length - 1];
        if (prev && prev.nextElementSibling === a && prev.parentNode === a.parentNode) g.push(a); else groups.push([a]);
      });
      sizeOf(targets[0] || container);
      var runs = [];
      groups.forEach(function (g) {
        var hidden = g.filter(function (x) { return x.style.display === 'none'; });
        hidden.forEach(function (x) { x.style.display = 'inline'; });
        var sameLine = g.every(function (x) { return Math.abs(x.offsetTop - g[0].offsetTop) < 2; });

        // A leading joining space belongs to the gap, not the word.
        var lead = /^\s/.test(g[0].textContent || '') ? fontPx * 0.26 : 0;
        hidden.forEach(function (x) { x.style.display = 'none'; });
        if (sameLine && g.length > 1) runs.push({ host: g[0], lead: lead, size: { w: span - lead, h: sizeOf(g[0]).h }, text: g.map(function (x) { return x.textContent; }).join('') });
        else g.forEach(function (x) { var ld = /^\s/.test(x.textContent || '') ? fontPx * 0.26 : 0; var sz = sizeOf(x); runs.push({ host: x, lead: ld, size: { w: sz.w - ld, h: sz.h }, text: x.textContent }); });
      });
      runs.forEach(function (r, i) {
        var a = r.host;
        var t0 = markAt + i * 0.22;
        a.style.position = 'relative';
        if (MARK === 'highlight') {
          var hl = document.createElement('span');
          hl.className = 'kt-ink';
          hl.style.cssText = 'position:absolute;left:' + (r.lead - fontPx * 0.12).toFixed(1) + 'px;width:' + (r.size.w + fontPx * 0.24).toFixed(1) + 'px;top:18%;bottom:6%;z-index:-1;border-radius:0.14em 0.3em 0.18em 0.34em;'
            + 'background:' + INK + ';opacity:0.34;transform-origin:0 50%;transform:skewX(-8deg) scaleX(0);';
          a.appendChild(hl);
          tl.to(hl, { scaleX: 1, duration: 0.42, ease: 'power2.out' }, t0);
        } else if (MARK === 'underline') {
          var u = inkSvg(a, { l: -0.03 + r.lead / r.size.w, t: 0.9, w: 1.06, h: fontPx * 0.2 },
            'M 0 ' + (40 + +wob(i, 5, 20)) + ' C 30 ' + (70 + +wob(i, 6, 20)) + ', 65 ' + (30 + +wob(i, 7, 20)) + ', 100 ' + (55 + +wob(i, 8, 20)), r.size);
          draw(u, t0, 0.4, 'power2.inOut');
        } else if (MARK === 'scribble') {
          var n = Math.max(5, Math.min(16, Math.round((r.text || '').length * 0.9)));
          var d = 'M 0 50';
          for (var k = 1; k <= n; k++) d += ' Q ' + ((k - 0.5) / n * 100).toFixed(1) + ' ' + (k % 2 ? 0 : 100) + ' ' + (k / n * 100).toFixed(1) + ' 50';
          var sc = inkSvg(a, { l: -0.02 + r.lead / r.size.w, t: 0.88, w: 1.04, h: fontPx * 0.2 }, d, r.size);
          draw(sc, t0, 0.55, 'power1.inOut');
        } else if (MARK === 'circle') {
          var c = inkSvg(a, { l: -0.1 + r.lead / r.size.w, t: -0.28, w: 1.2, h: r.size.h * 1.56 },
            'M 10 ' + (54 + +wob(i, 9, 8)) + ' C 6 20, 40 4, 64 7 C 90 10, 99 32, 95 55 C 91 84, 56 97, 30 93 C 9 89, 1 66, 14 44 L 22 34', r.size);
          draw(c, t0, 0.6, 'power2.inOut');
        } else if (MARK === 'box') {
          var bx = inkSvg(a, { l: -0.06 + r.lead / r.size.w, t: -0.1, w: 1.12, h: r.size.h * 1.2 },
            'M 4 ' + (8 + +wob(i, 10, 6)) + ' L 97 4 L ' + (96 + +wob(i, 11, 4)) + ' 95 L 3 97 L 5 1', r.size);

    // primary (e.g. the indigo package token in a mono terminal line).
    if (data.accent_color) {
      el.querySelectorAll('.kt-accent').forEach(function (s) { s.style.color = data.accent_color; });
    }

    // Exit: fade by default. exit:"smear-up" is the gathering in reverse,
    // frame-checked against the reference (10.1-11.1s): the *starred* word
    // LEADS -- its letters roll upward in a wave, one by one -- and then the
    // whole sentence drifts apart and floats up out of frame, each word on
    // its own scattered path. No stretch, no scale: the words simply rise
    // and go. Same deterministic hash as the entrance for the scatter.
    if (ctx.duration > 2) {
