<template>
  <div class="kinetic-text">
    <div class="text-container"></div>
  </div>
</template>

<style scoped>
  /* House type system: editorial type gets THREE sanctioned entrances.
     1. line-rise (default): the whole line rises ~10px and fades in.
     2. type-on: words appear IN PLACE in reading order on a fixed interval;
        hidden words take no space, so a centered line reflows as it grows
        (the tempo-cut build-up look). No motion paths, no per-word styling --
        the only variable is TIME. Emphasis is color only (*stars*).
     3. assemble: the words appear SCATTERED around the line's neighbourhood
        (each at its own offset, mostly below) and CONVERGE up into their
        slots -- a sentence gathering itself, near-simultaneous rather than
        reading-order ("Behind the Craft" 8.5-9.3s, frame-checked: the words
        pop in at staggered positions and travel to the line).
     And ONE sanctioned exit beyond the default fade: exit:"smear-up" -- the
     *starred* word LEADS: its letters roll up in a wave, then the whole
     sentence drifts apart and floats up out of frame, the gathering in
     reverse (10.1-11.1s: "volume" peels up letter by letter first, no
     stretch, no scale -- the words simply scatter upward and go). */
  .kinetic-text {
    display: flex;
    align-items: center;
    justify-content: center;
    height: 100%;
    width: 100%;
    font-family: var(--mp-font-family, 'Inter', system-ui, -apple-system, sans-serif);
    padding: 24px;
    position: relative;
    overflow: hidden;
  }

  .text-container {
    font-size: 60px;
    font-weight: 700;
    color: var(--mp-color-text, #ffffff);
    text-align: center;
    line-height: 1.12;
    letter-spacing: -0.02em;
    max-width: 92%;
  }

  .text-container .kt-accent {
    color: var(--mp-color-primary, #4f46e5);
  }
</style>

<script>
  function createTimeline(el, data, ctx) {
    var tl = gsap.timeline();
    var container = el.querySelector('.text-container');
    // Display-scale override: hero numerals/headlines size to the shot
    // ("52" at 16vw), not the 60px caption default.
    if (data.font_size) container.style.fontSize = data.font_size;
    // Typeface/tracking overrides: mono terminal lines, letterspaced labels.
    if (data.font) container.style.fontFamily = data.font;
    if (data.letter_spacing) container.style.letterSpacing = data.letter_spacing;
    if (data.font_weight) container.style.fontWeight = String(data.font_weight);
    // align: 'left'/'right' turns the centered caption into a flush block
    // (terminal checklists, editorial column type).
    if (data.align === 'left' || data.align === 'right') {
      container.style.textAlign = data.align;
      el.querySelector('.kinetic-text').style.justifyContent = data.align === 'left' ? 'flex-start' : 'flex-end';
      container.style.maxWidth = '100%';
    }
    var text = String(data.text || '');

    if (data.color) container.style.color = data.color;

    // *stars* mark accent words -- color only, they move with their line.
    container.innerHTML = '';
    var re = /\*([^*]+)\*|([^*]+)/g;
    var m;

    if (data.entrance === 'assemble') {
      // The sentence GATHERS ITSELF: the line is laid out from frame one
      // (inline-block spans hold their space), each word starts at its own
      // scattered offset -- mostly below, each a different distance and
      // drift -- and converges up into its slot. Near-simultaneous, not
      // reading-order. Offsets come from a deterministic hash of the word
      // index (no Math.random -- renders must repeat); timeline tweens only,
      // scrub-safe under the seek-driven master.
      var awords = [];
      while ((m = re.exec(text)) !== null) {
        var isAcc = m[1] !== undefined;
        String(isAcc ? m[1] : m[2]).split(/\s+/).forEach(function (w) {
          if (w) awords.push({ w: w, accent: isAcc });
        });
      }
      var aAt = data.at !== undefined ? Number(data.at) : 0.3;
      var aStep = Number(data.word_interval) > 0 ? Number(data.word_interval) : 0.07;
      var rnd = function (i, k) { var v = Math.sin(i * 127.1 + k * 311.7) * 43758.5453; return v - Math.floor(v); };
      awords.forEach(function (it, i) {
        var span = document.createElement('span');
        if (it.accent) span.className = 'kt-accent';
        span.style.display = 'inline-block';
        span.style.whiteSpace = 'pre';
        if (it.accent) {
          // The starred word is built per-CHARACTER so the exit can roll it
          // up letter by letter -- it LEADS the smear (the reference's
          // "volume" peels upward first).
          ((i > 0 ? ' ' : '') + it.w).split('').forEach(function (ch) {
            var c = document.createElement('span');
            c.textContent = ch;
            c.style.display = 'inline-block';
            c.style.whiteSpace = 'pre';
            span.appendChild(c);
          });
        } else {
          span.textContent = (i > 0 ? ' ' : '') + it.w;
        }
        container.appendChild(span);
        var when = aAt + i * aStep;
        gsap.set(span, {
          x: (rnd(i, 1) - 0.5) * 160,
          y: 40 + rnd(i, 2) * 110,
          rotation: (rnd(i, 3) - 0.5) * 7,
          autoAlpha: 0,
        });
        tl.to(span, { autoAlpha: 1, duration: 0.18, ease: 'none' }, when);
        tl.to(span, { x: 0, y: 0, rotation: 0, duration: 0.6, ease: 'power2.out' }, when + 0.05);
      });
    } else if (data.entrance === 'type-on') {
      // Word-by-word build-up. Every word is in the DOM up front but takes
      // no space until its beat, so the line re-centers as it grows. Words
      // APPEAR -- no fade, no travel; scrub-safe (pure tl.set).
      var words = [];
      while ((m = re.exec(text)) !== null) {
        var isAccent = m[1] !== undefined;
        String(isAccent ? m[1] : m[2]).split(/\s+/).forEach(function (w) {
          if (w) words.push({ w: w, accent: isAccent });
        });
      }
      var at = data.at !== undefined ? Number(data.at) : 0.3;
      var step = Number(data.word_interval) > 0 ? Number(data.word_interval) : 0.14;
      words.forEach(function (it, i) {
        var span = document.createElement('span');
        if (it.accent) span.className = 'kt-accent';
        // The joining space lives INSIDE the span so hidden words add none.
        span.textContent = (i > 0 ? ' ' : '') + it.w;
        span.style.display = 'none';
        container.appendChild(span);
        var when = Array.isArray(data.word_times) && data.word_times[i] !== undefined
          ? Number(data.word_times[i]) : at + i * step;
        tl.set(span, { display: 'inline' }, when);
      });
    } else {
      while ((m = re.exec(text)) !== null) {
        if (m[1] !== undefined) {
          var span = document.createElement('span');
          span.className = 'kt-accent';
          span.textContent = m[1];
          container.appendChild(span);
        } else {
          container.appendChild(document.createTextNode(m[2]));
        }
      }

      if (window.mpLineRise) {
        mpLineRise(tl, container, 0.25);
      } else {
        gsap.set(container, { autoAlpha: 0, y: 10 });
        tl.to(container, { autoAlpha: 1, y: 0, duration: 0.3, ease: 'power3.out' }, 0.25);
      }
    }

    // Accent override: *starred* words take this color instead of the brand
    // primary (e.g. the indigo package token in a mono terminal line).
    if (data.accent_color) {
      el.querySelectorAll('.kt-accent').forEach(function (s) { s.style.color = data.accent_color; });
    }

    // Exit: fade by default. exit:"smear-up" is the gathering in reverse,
    // frame-checked against the reference (10.1-11.1s): the *starred* word
    // LEADS -- its letters roll upward in a wave, one by one -- and then the
    // whole sentence drifts apart and floats up out of frame, each word on
    // its own scattered path. No stretch, no scale: the words simply rise
    // and go. Same deterministic hash as the entrance for the scatter.
    if (ctx.duration > 2) {
      var exitAt = data.exit_at !== undefined ? Number(data.exit_at) : ctx.duration - (data.exit === 'smear-up' ? 1.2 : 0.5);
      if (data.exit === 'smear-up') {
        var xr = function (i, k) { var v = Math.sin(i * 269.5 + k * 183.3) * 43758.5453; return v - Math.floor(v); };
        var wordEls = Array.prototype.slice.call(container.children);
        // Phase 1: the accent word's letters peel upward in a wave.
        var lead = container.querySelector('.kt-accent');
        if (lead && lead.children.length) {
          Array.prototype.slice.call(lead.children).forEach(function (c, i) {
            tl.to(c, { y: -320, rotation: 6 + i * 2, autoAlpha: 0, duration: 0.6, ease: 'power2.in' },
              exitAt + i * 0.05);
          });
        }
        // Phase 2: the rest of the sentence scatters and floats up after it.
        var follow = exitAt + 0.3;
        wordEls.forEach(function (w, i) {
          if (w === lead) return;
          tl.to(w, {
            x: (xr(i, 1) - 0.5) * 220,
            y: -(260 + xr(i, 2) * 160),
            rotation: (xr(i, 3) - 0.5) * 12,
            autoAlpha: 0,
            duration: 0.7, ease: 'power2.in',
          }, follow + xr(i, 4) * 0.2);
        });
        if (!wordEls.length) tl.to(container, { y: -260, autoAlpha: 0, duration: 0.6, ease: 'power2.in' }, exitAt);
      } else {
        tl.to(container, { autoAlpha: 0, duration: 0.3, ease: 'power2.in' }, exitAt);
      }
    }

    return tl;
  }
</script>
