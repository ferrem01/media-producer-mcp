<template>
  <div class="stat-card">

      <span class="stat-number">0</span>
      <span class="stat-suffix"></span>
    </div>
    <div class="stat-label"></div>
  </div>
</template>

<style scoped>

    position: absolute;

    pointer-events: none;

    top: 50%;

    transform: translate(-50%, -50%);
  }
</style>

<script>
  function createTimeline(el, data, ctx) {
    var tl = gsap.timeline();

    var numberEl = el.querySelector('.stat-number');
    var prefixEl = el.querySelector('.stat-prefix');
    var suffixEl = el.querySelector('.stat-suffix');
    var labelEl = el.querySelector('.stat-label');
    var wrap = el.querySelector('.stat-number-wrap');
    var card = el.querySelector('.stat-card');

    // Add glow element
    var glow = document.createElement('div');
    glow.className = 'stat-glow';
    wrap.appendChild(glow);

    // Auto-scale font to fit container
    var containerW = el.offsetWidth || 1920;
    var containerH = el.offsetHeight || 1080;
    var scale = Math.min(containerW / 1920, containerH / 1080);
    if (scale < 0.9) {
      var numSize = Math.round(160 * Math.min(scale * 2.5, 1));
      var suffSize = Math.round(100 * Math.min(scale * 2.5, 1));
      var labelSize = Math.round(20 * Math.min(scale * 2.5, 1));
      numberEl.style.fontSize = numSize + 'px';
      prefixEl.style.fontSize = suffSize + 'px';
      suffixEl.style.fontSize = suffSize + 'px';
      labelEl.style.fontSize = labelSize + 'px';
      labelEl.style.marginTop = Math.round(36 * scale * 2) + 'px';
    }

    // Set content
    if (data.prefix) prefixEl.textContent = data.prefix;
    if (data.suffix) suffixEl.textContent = data.suffix;
    if (data.label) labelEl.textContent = data.label;

    var targetValue = data.value || 0;
    var decimals = data.decimals !== undefined ? data.decimals : 0;

    // Initial states
    gsap.set([wrap, labelEl], { autoAlpha: 0 });
    gsap.set(wrap, { scale: 0.8, y: 40 });
    gsap.set(labelEl, { y: 20 });
    gsap.set(glow, { scale: 0.3, autoAlpha: 0 });

    var speed = ctx.motion === 'minimal' ? 0.5 : ctx.motion === 'punchy' ? 0.7 : 1.0;

    // Glow expands first
    tl.to(glow, {
      scale: 1.2, autoAlpha: 1,
      duration: speed * 1.2,
      ease: 'power2.out'
    }, 0.15);

    // Number reveal with scale
    tl.to(wrap, {
      autoAlpha: 1, scale: 1, y: 0,
      duration: speed,
      ease: ctx.motion === 'punchy' ? 'back.out(1.3)' : 'power3.out'
    }, 0.3);

    // Count up animation
    var counter = { val: 0 };
    tl.to(counter, {
      val: targetValue,
      duration: speed * 1.8,
      ease: 'power2.out',
      onUpdate: function() {
        var formatted;
        if (decimals > 0) {
          formatted = counter.val.toFixed(decimals);
        } else {
          formatted = Math.round(counter.val).toLocaleString();
        }
        numberEl.textContent = formatted;
      }
    }, 0.3);

    // Label fade in
    tl.to(labelEl, {
      autoAlpha: 1, y: 0,
      duration: speed * 0.5,
      ease: 'power2.out'
    }, 0.3 + speed * 0.6);

    // Gentle glow pulse
    tl.to(glow, {
      scale: 1.4,
      autoAlpha: 0.6,
      duration: 2,
      ease: 'sine.inOut',
      yoyo: true,
      repeat: -1
    }, 0.3 + speed);

    // Exit
    if (ctx.duration > 2) {
      var exitAt = ctx.duration - 0.7;
      tl.to(glow, {
        autoAlpha: 0, scale: 0.5,
        duration: 0.5,
        ease: 'power2.in'
      }, exitAt);
      tl.to([wrap, labelEl], {
        autoAlpha: 0, y: -25,
        duration: 0.4,
        stagger: 0.05,
        ease: 'power2.in'
      }, exitAt + 0.05);
    }

    return tl;
  }
</script>
