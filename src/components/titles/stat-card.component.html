<template>
  <div class="stat-card">
    <div class="stat-number-wrap">
      <span class="stat-prefix"></span>
      <span class="stat-number">0</span>
      <span class="stat-suffix"></span>
    </div>
    <div class="stat-label"></div>
  </div>
</template>

<style scoped>
  .stat-card {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    width: 100%;
    height: 100%;

  }

  .stat-label:empty {
    display: none;
  }
</style>

<script>
  function createTimeline(el, data, ctx) {
    var tl = gsap.timeline();

    var numberEl = el.querySelector('.stat-number');
    var prefixEl = el.querySelector('.stat-prefix');
    var suffixEl = el.querySelector('.stat-suffix');
    var labelEl = el.querySelector('.stat-label');
    var wrap = el.querySelector('.stat-number-wrap');

    // Set content
    if (data.prefix) prefixEl.textContent = data.prefix;
    if (data.suffix) suffixEl.textContent = data.suffix;
    if (data.label) labelEl.textContent = data.label;

    var targetValue = data.value || 0;
    var decimals = data.decimals !== undefined ? data.decimals : 0;

    // Initial states
    gsap.set([wrap, labelEl], { autoAlpha: 0 });
    gsap.set(wrap, { scale: 0.85, y: 30 });
    gsap.set(labelEl, { y: 15 });

    var speed = ctx.motion === 'minimal' ? 0.5 : ctx.motion === 'punchy' ? 0.7 : 1.0;

    // Number reveal with scale
    tl.to(wrap, {
      autoAlpha: 1, scale: 1, y: 0,
      duration: speed,
      ease: ctx.motion === 'punchy' ? 'back.out(1.3)' : 'power3.out'
    }, 0.3);

    // Count up animation
    var counter = { val: 0 };
    tl.to(counter, {
      val: targetValue,
      duration: speed * 1.8,
      ease: 'power2.out',
      onUpdate: function() {
        var formatted;
        if (decimals > 0) {
          formatted = counter.val.toFixed(decimals);
        } else {
          formatted = Math.round(counter.val).toLocaleString();
        }
        numberEl.textContent = formatted;
      }
    }, 0.3);

    // Label fade in
    tl.to(labelEl, {
      autoAlpha: 1, y: 0,
      duration: speed * 0.5,
      ease: 'power2.out'
    }, 0.3 + speed * 0.6);

    // Exit
    if (ctx.duration > 2) {
      var exitAt = ctx.duration - 0.6;
      tl.to([wrap, labelEl], {
        autoAlpha: 0, y: -20,
        duration: 0.4,
        stagger: 0.05,
        ease: 'power2.in'
      }, exitAt);
    }

    return tl;
  }
</script>
