<template>
  <div class="stat-card">
    <div class="value-row">
      <span class="prefix">{{prefix}}</span>
      <span class="value">0</span>
      <span class="suffix">{{suffix}}</span>
    </div>
    <p class="label">{{label}}</p>
  </div>
</template>

<style scoped>

    font-size: 24px;

    margin-top: 20px;
    text-transform: uppercase;
    letter-spacing: 0.1em;
  }
</style>

<script>
  function createTimeline(el, data, ctx) {
    var tl = gsap.timeline();
    var valueEl = el.querySelector('.value');
    var card = el.querySelector('.stat-card');
    var targetValue = data.value || 0;
    var decimals = data.decimals || 0;

    gsap.set(card, { autoAlpha: 0, scale: 0.9, filter: 'blur(6px)' });

    var speed = ctx.motion === 'minimal' ? 0.3 : ctx.motion === 'punchy' ? 0.4 : 0.5;
    var ease = ctx.motion === 'punchy' ? 'back.out(1.3)' : 'power3.out';

    tl.to(card, {
      autoAlpha: 1,
      scale: 1,
      filter: 'blur(0px)',
      duration: speed,
      ease: ease
    }, 0.2);

    var counter = { val: 0 };
    var countDuration = ctx.motion === 'minimal' ? 0.8 : ctx.motion === 'punchy' ? 1.0 : 1.4;

    tl.to(counter, {
      val: targetValue,
      duration: countDuration,
      ease: 'power2.out',
      onUpdate: function() {
        valueEl.textContent = counter.val.toFixed(decimals);
      }
    }, 0.2 + speed * 0.5);

    if (ctx.duration > 2.5) {
      var exitAt = ctx.duration - 0.7;
      tl.to(card, {
        autoAlpha: 0,
        scale: 0.95,
        filter: 'blur(4px)',
        duration: 0.4,
        ease: 'power2.in'
      }, exitAt);
    }

    return tl;
  }
</script>
