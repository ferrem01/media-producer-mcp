<template>
  <div class="number-counter-row">
    <div class="stats-container"></div>
  </div>
</template>

<style scoped>
  .number-counter-row {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 100%;
    height: 100%;
    padding: 80px;
    font-family: var(--mp-font-family, 'Inter', system-ui, -apple-system, sans-serif);
  }

  .stats-container {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 0;
    max-width: 1100px;
    width: 100%;
  }

  .stat-item {
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    flex: 1;
    padding: 32px 40px;
    position: relative;
  }

  .stat-divider {
    width: 1px;
    height: 80px;
    background: linear-gradient(
      180deg,
      rgba(255, 255, 255, 0) 0%,
      rgba(255, 255, 255, 0.08) 30%,
      rgba(167, 139, 250, 0.2) 50%,
      rgba(255, 255, 255, 0.08) 70%,
      rgba(255, 255, 255, 0) 100%
    );
    backdrop-filter: blur(4px);
    -webkit-backdrop-filter: blur(4px);

  }

  .stat-value {
    font-size: 72px;
    font-weight: 800;
    color: var(--mp-color-text, #ffffff);

  }

  .stat-label {
    font-size: 16px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.14em;
    color: #64748b;
    margin-top: 16px;
  }
</style>

<script>
  function createTimeline(el, data, ctx) {
    var tl = gsap.timeline();
    var container = el.querySelector('.stats-container');
    var stats = data.stats || [];

    if (stats.length > 6) stats = stats.slice(0, 6);

    // HERO SCALE (data-story: the number is the protagonist). The fixed 72px
    // default is 6.7% of a 1080p frame -- fine for a supporting stat row,
    // invisible as a money number. data.font_size overrides directly
    // ("24vh", "18vw"); data.hero sizes the row so ONE stat fills ~1/4 of
    // the frame height and a multi-stat row shares it proportionally.
    // The flag counts wherever the author put it: the storyboard writes
    // "hero": true INSIDE the stat object as naturally as at the data root
    // (measured on proj_b75ca862 -- every counter carried it at stat level
    // and the scale never applied).
    var hero = !!data.hero || stats.some(function (s) { return s && s.hero; });
    var heroSize = data.font_size ? String(data.font_size)
      : hero ? (stats.length <= 1 ? '26vh' : stats.length === 2 ? '18vh' : '13vh')
      : null;

    // Build stat items with dividers
    for (var i = 0; i < stats.length; i++) {
      if (i > 0) {
        var divider = document.createElement('div');
        divider.className = 'stat-divider';
        container.appendChild(divider);
      }

      var item = document.createElement('div');
      item.className = 'stat-item';

      var valueEl = document.createElement('div');
      valueEl.className = 'stat-value';
      valueEl.textContent = (stats[i].prefix || '') + '0' + (stats[i].suffix || '');
      valueEl.setAttribute('data-target', stats[i].value || 0);
      valueEl.setAttribute('data-prefix', stats[i].prefix || '');
      valueEl.setAttribute('data-suffix', stats[i].suffix || '');
      if (heroSize) valueEl.style.fontSize = heroSize;
      if (data.color) valueEl.style.color = data.color;
      item.appendChild(valueEl);

      var labelEl = document.createElement('div');
      labelEl.className = 'stat-label';
      labelEl.textContent = stats[i].label || '';
      // The fixed slate (#64748b) measures ~3.4:1 on BOTH light and dark
      // grounds. The label rides the ink at reduced presence instead: the
      // composited color clears 4.5:1 wherever the value itself does.
      labelEl.style.color = data.color ? String(data.color) : 'var(--mp-color-text, #ffffff)';
      labelEl.style.opacity = '0.72';
      item.appendChild(labelEl);

      container.appendChild(item);
    }

    var items = container.querySelectorAll('.stat-item');
    var dividers = container.querySelectorAll('.stat-divider');
    var values = container.querySelectorAll('.stat-value');

    // FIT: hero type never overflows the component's OWN box. A 26vh value
    // in a storyboard box sized for the old 72px row clipped its digits and
    // pushed the label past the frame (proj_a0bc86f4 scene_002). Measure the
    // built row against the box and scale the type down proportionally.
    if (heroSize && el.clientHeight > 60) {
      var over = container.scrollHeight / el.clientHeight;
      if (over > 1.02) {
        values.forEach(function (v) {
          var cur = parseFloat(getComputedStyle(v).fontSize) || 72;
          v.style.fontSize = Math.floor((cur / over) * 0.95) + 'px';
        });
      }
    }

    gsap.set(items, { autoAlpha: 0, y: 30, scale: 0.95 });
    gsap.set(dividers, { autoAlpha: 0, scaleY: 0 });

    var speed = ctx.motion === 'minimal' ? 0.4 : ctx.motion === 'punchy' ? 0.6 : 0.8;
    var stagger = ctx.motion === 'minimal' ? 0.08 : ctx.motion === 'punchy' ? 0.1 : 0.15;

    // Entrance
    tl.to(items, {
      autoAlpha: 1, y: 0, scale: 1,
      duration: speed,
      stagger: stagger,
      ease: 'power3.out'
    }, 0.3);

    tl.to(dividers, {
      autoAlpha: 1, scaleY: 1,
      duration: speed * 0.6,
      stagger: stagger,
      ease: 'power2.out'
    }, 0.4);

    // Count up each number
    for (var j = 0; j < values.length; j++) {
      (function(valEl, idx) {
        var target = parseFloat(valEl.getAttribute('data-target')) || 0;
        var prefix = valEl.getAttribute('data-prefix') || '';
        var suffix = valEl.getAttribute('data-suffix') || '';
        var obj = { val: 0 };

        tl.to(obj, {
          val: target,
          duration: speed * 1.5,
          ease: 'power2.out',
          onUpdate: function() {
            var display = obj.val;
            if (target >= 1000) {
              display = (display / 1000).toFixed(1) + 'K';
            } else if (target % 1 !== 0) {
              display = display.toFixed(1);
            } else {
              display = Math.round(display);
            }
            valEl.textContent = prefix + display + suffix;
          }
        }, 0.3 + idx * stagger);
      })(values[j], j);
    }

    // Exit
    if (ctx.duration > 2) {
      var exitAt = ctx.duration - 0.6;
      tl.to(items, {
        autoAlpha: 0, y: -15,
        duration: 0.4,
        stagger: 0.04,
        ease: 'power2.in'
      }, exitAt);
      tl.to(dividers, {
        autoAlpha: 0,
        duration: 0.3,
        ease: 'power2.in'
      }, exitAt);
    }

    return tl;
  }
</script>
