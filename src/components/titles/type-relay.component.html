        scale: near ? 2.2 + 1.4 * rnd(i, 5) : 0.3 + 0.2 * rnd(i, 5), rot: (rnd(i, 6) - 0.5) * 24, lag: rnd(i, 7) * 0.12 };
    });

    // ── Render: every style from t.
    var render = function (t) {
      if (block.offsetWidth + 'x' + block.offsetHeight !== lastSig) layout();
      // Exit progress.
      var ex = t - TAT, exOn = TMODE !== 'hold' && ex >= 0;
      var sqA = 0, sqGone = false;
      if (TMODE === 'squeeze' && exOn) { sqA = clamp01(ex / (0.62 * TD)); sqGone = ex >= 0.62 * TD; }
      var liftGone = (TMODE === 'lift' || TMODE === 'scatter') && ex >= TD + 0.13;
      // Words.
      words.forEach(function (w) {
        var fs = lines[w.line]._fs, tx = 0, ty = 0, sc = 1, rot = 0, blur = 0, op = 1, vis = true;
        if (REVEAL === 'type') {
          vis = t >= w.chars[0].ts;
          w.chars.forEach(function (c) { c.el.style.visibility = t >= c.ts ? 'inherit' : 'hidden'; });
        } else if (w.instant) {
          vis = t >= F.end - 1e-4;
        } else {
          var p = (t - w.rs) / REV;
          if (p <= 0) vis = false;
          else if (REVEAL === 'lines') ty = (1 - out3(p)) * fs * LH * 1.25;
          else {
            var e = out3(p);
            ty = (1 - e) * fs * 0.34;
            if (BLUR) blur = (1 - e) * fs * 0.08;
            op = out2(p / 0.55);
          }
        }
        if (exOn && TMODE === 'lift') {
          var lp = in3((ex - w.line * 0.045) / TD);
          ty -= (w.y + w.h + 0.06 * H) * lp;
        } else if (exOn && TMODE === 'scatter') {
          var sp = in2((ex - w.sc.lag) / (TD - 0.12));
          tx += Math.cos(w.sc.ang) * w.sc.dist * sp; ty += Math.sin(w.sc.ang) * w.sc.dist * sp;
          sc = lerp(1, w.sc.scale, sp); rot = w.sc.rot * sp;
          if (w.sc.near) blur += fs * 0.05 * sp * sp; else op *= 1 - clamp01((sp - 0.55) / 0.45);
        }
        if (liftGone || sqGone || (THIDE !== null && t >= THIDE && TMODE !== 'hold')) vis = false;
        w.el.style.visibility = vis ? 'inherit' : 'hidden';
        w.el.style.transform = (tx || ty) || sc !== 1 || rot ? 'translate(' + tx.toFixed(2) + 'px,' + ty.toFixed(2) + 'px) scale(' + sc.toFixed(4) + ') rotate(' + rot.toFixed(2) + 'deg)' : 'none';
        w.el.style.filter = blur > 0.05 ? 'blur(' + blur.toFixed(2) + 'px)' : 'none';
        w.el.style.opacity = op < 0.999 ? op.toFixed(3) : '1';
      });
      // Squeeze: the whole block condenses like an accordion (letters narrow
      // faster than they shorten) into the band inside the target, taking the
      // shape's colour; two lagged copies smear it while it moves.
      if (TMODE === 'squeeze' && exOn) {
        var sq = sqAt(ex), cp = out2(sqA / 0.7), cc = mix(ink, TCOLOR, cp);
        block.style.transformOrigin = sqOrigin();
        block.style.transform = sqTransform(sq);
        block.style.color = cc;
        root.style.setProperty('--trl-accent', mix(accent, TCOLOR, cp));
        ghosts.forEach(function (g, gi) {
          var sg = sqAt(ex - SMEAR * (gi + 1));
          var mv = !sqGone && Math.abs(sg.s - sq.s) > 0.004;
          g.style.visibility = mv ? 'inherit' : 'hidden';
          if (mv) { g.style.transformOrigin = block.style.transformOrigin; g.style.transform = sqTransform(sg); g.style.color = cc; }
        });
      } else {
        block.style.transform = 'none';
        block.style.color = '';
        root.style.setProperty('--trl-accent', accent);
        ghosts.forEach(function (g) { g.style.visibility = 'hidden'; });
      }
      // The object the words came from.
      if (F && t >= F.at - 1e-4) {
        // It lands on the accent word, then pulls off it to the right like a
        // highlighter lifting, uncovering the word that was under it.
        var fe = inOut3((t - F.at) / F.dur);
        var fw = t < F.end ? 0 : inOut3((t - F.end) / F.wipe);
        var fbx = lerpBox(FROMS, FROMT, fe);
        if (fw > 0) { var cut = fbx.w * fw; fbx.x += cut; fbx.w -= cut; fbx.r = Math.min(fbx.r, fbx.w / 2); }
        // (a sliver under 0.03 em would read as a caret: it is gone by then)
        if (fw >= 1 || (fw > 0 && fbx.w < ACC.h * 0.03)) fromEl.style.visibility = 'hidden';
        else {
          put(fromEl, fbx, F.color);
          fromEl.style.visibility = 'inherit';
        }
      } else fromEl.style.visibility = 'hidden';
      // The object the words become.
      var toOn = false;
      if (TMODE === 'squeeze' && exOn && ex >= 0.62 * TD) {
        var pb = (ex - 0.62 * TD) / (0.38 * TD), sb = spring(pb, 0.62, 9);
        // It starts as the condensed text's own box and springs onto the target.
        var q0 = sqAt(0.62 * TD), bw0 = TB.w * q0.s, bh0 = TB.h * q0.sy;
        var Bb = { x: q0.cx - bw0 / 2, y: q0.cy - bh0 / 2, w: bw0, h: bh0, r: Math.min(bw0, bh0) / 2 * (SQ.T.r / (Math.min(SQ.T.w, SQ.T.h) / 2 || 1)) };
        put(toEl, lerpBox(Bb, SQ.T, sb), TCOLOR);
        toOn = true;
      } else if (TMODE === 'flood' && exOn) {
        var wipe = Math.min(0.12, TD * 0.3), fb;
        if (ex < wipe) { var we = out2(ex / wipe); fb = { x: FL.from.x, y: FL.from.y, w: FL.from.w * we, h: FL.from.h, r: FL.from.r }; }
        else fb = lerpBox(FL.from, FL.full, inOut3((ex - wipe) / (TD - wipe)));
        put(toEl, fb, TCOLOR);
        toOn = true;
      }
      if (THIDE !== null && t >= THIDE) toOn = false;
      toEl.style.visibility = toOn ? 'inherit' : 'hidden';
      // The typewriter's caret: after the last typed character, solid while typing, blinking once done.
      if (REVEAL === 'type' && caret) {
        var lastC = null;
        for (var i = 0; i < chars.length; i++) if (t >= chars[i].ts && (!lastC || chars[i].ts >= lastC.ts)) lastC = chars[i];
        var cOn = !!lastC && !exOn && t < SETTLE + 1.2 && (t < SETTLE + 0.05 || Math.floor((t - SETTLE) / 0.4) % 2 === 1);
        if (cOn) {
          var cw2 = lines[lastC.line]._fs;
          caret.style.left = (lastC.x + lastC.w + cw2 * 0.04).toFixed(2) + 'px';
          caret.style.top = (lastC.word.y + lastC.word.h * 0.14).toFixed(2) + 'px';
          caret.style.width = Math.max(2, cw2 * 0.055).toFixed(2) + 'px';
          caret.style.height = (lastC.word.h * 0.74).toFixed(2) + 'px';
        }
        caret.style.visibility = cOn ? 'inherit' : 'hidden';
      }
    };

    var END = Math.max(num(ctx && ctx.duration, 0), SETTLE + 0.5, TAT + TD + 0.5, F ? F.end + 0.5 : 0);
    var clock = { t: 0 };
    render(0);
    // A face that lands after the build re-lays the words out and redraws the current time.
    try {
      var relayout = function () { layout(); render(clock.t); };
      if (document.fonts) {
        if (document.fonts.ready) document.fonts.ready.then(relayout, function () {});
        if (document.fonts.addEventListener) document.fonts.addEventListener('loadingdone', relayout);
      }
    } catch (e) {}
    tl.fromTo(clock, { t: 0 }, { t: END, duration: END, ease: 'none', immediateRender: false,
      onUpdate: function () { render(clock.t); } }, 0);
    return tl;
  }
</script>
