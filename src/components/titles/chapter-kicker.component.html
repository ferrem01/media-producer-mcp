<template>
  <div class="ck">
    <div class="ck-kicker"><span class="ck-num"></span><span class="ck-text"></span></div>
    <div class="ck-dots"></div>
  </div>
</template>

<style scoped>
  /* ── chapter-kicker: the walkthrough's table of contents. The kicker names
     the step bottom-left, the dots count the steps bottom-right. Full-frame
     overlay; places itself with safe margins. ── */
  .ck { position: absolute; inset: 0; pointer-events: none; overflow: hidden;
    font-family: var(--mp-font-family, 'Inter', system-ui, sans-serif);
    --ck-ink: #14161d; --ck-muted: rgba(20, 22, 29, 0.38); --ck-accent: var(--mp-color-primary, #4f6df5); }
  .ck-light { --ck-ink: #ffffff; --ck-muted: rgba(255, 255, 255, 0.42); }
  .ck-kicker { position: absolute; left: 5%; bottom: 6.5%; display: flex; align-items: center; gap: 0.7vw;
    font-size: max(1.25vw, 1.2vh); font-weight: 600; letter-spacing: -0.005em; color: var(--ck-ink); white-space: nowrap; will-change: transform; }
  .ck-num { font-size: max(0.85vw, 0.8vh); font-weight: 700; letter-spacing: 0.12em; color: var(--ck-muted); }
  .ck-dots { position: absolute; right: 5%; bottom: 7.1%; display: flex; gap: max(0.55vw, 0.5vh); align-items: center; }
  .ck-right .ck-kicker { left: auto; right: 5%; flex-direction: row-reverse; }
  .ck-right .ck-dots { right: auto; left: 5%; }
  .ck-dot { width: max(0.55vw, 0.5vh); height: max(0.55vw, 0.5vh); border-radius: 50%; background: var(--ck-muted); }
  .ck-dot.on { background: var(--ck-accent); }
</style>

<script>
  function createTimeline(el, data, ctx) {
    var tl = gsap.timeline();
    var root = el.querySelector('.ck');
    var kicker = el.querySelector('.ck-kicker');
    var dots = el.querySelector('.ck-dots');
    if (!root || !kicker || !dots) return tl;
    var text = String((data && data.text) || '');
    var steps = Math.max(1, Math.min(9, Math.round(Number(data && data.steps) || 3)));
    var step = Math.max(1, Math.min(steps, Math.round(Number(data && data.step) || 1)));
    var at = (data && data.at != null) ? Math.max(0, Number(data.at) || 0) : 0.3;
    if (data && data.ink === 'light') root.classList.add('ck-light');
    if (data && data.side === 'right') root.classList.add('ck-right');
    if (data && data.accent) root.style.setProperty('--ck-accent', data.accent);
    el.querySelector('.ck-num').textContent = String(step).padStart(2, '0');
    el.querySelector('.ck-text').textContent = text;
    var dotEls = [];
    for (var i = 1; i <= steps; i++) {
      var d = document.createElement('div');
      d.className = 'ck-dot' + (i < step ? ' on' : '');
      dots.appendChild(d);
      dotEls.push(d);
    }
    // The kicker rises in; the dots are there already; this step's dot
    // fills a beat after the name lands. Everything holds to the cut.
    gsap.set(kicker, { autoAlpha: 0, y: 14 });
    gsap.set(dots, { autoAlpha: 0 });
    tl.to(dots, { autoAlpha: 1, duration: 0.3, ease: 'power2.out' }, at);
    tl.to(kicker, { autoAlpha: 1, y: 0, duration: 0.45, ease: 'power3.out' }, at);
    var cur = dotEls[step - 1];
    if (cur) {
      tl.fromTo(cur, { scale: 0.6 }, { scale: 1.25, duration: 0.22, ease: 'power2.out', onStart: function () { cur.classList.add('on'); } }, at + 0.35);
      tl.to(cur, { scale: 1, duration: 0.25, ease: 'power2.inOut' }, at + 0.57);
    }
    return tl;
  }
</script>
