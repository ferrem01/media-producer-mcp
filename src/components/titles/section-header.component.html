<script>
  function createTimeline(el, data, ctx) {
    var tl = gsap.timeline();

    var eyebrow = el.querySelector('.eyebrow');
    var title = el.querySelector('.title');
    var description = el.querySelector('.description');

    var elements = [eyebrow, title, description].filter(function(e) {
      return e && e.textContent.trim();
    });

    var speed = ctx.motion === 'minimal' ? 0.4 : ctx.motion === 'punchy' ? 0.5 : 0.7;
    var stagger = ctx.motion === 'minimal' ? 0.1 : ctx.motion === 'punchy' ? 0.12 : 0.18;
    var ease = ctx.motion === 'punchy' ? 'back.out(1.2)' : 'power3.out';
    var distance = ctx.motion === 'minimal' ? 30 : ctx.motion === 'punchy' ? 50 : 60;

    gsap.set(elements, { autoAlpha: 0, x: -distance, filter: 'blur(4px)' });

    tl.to(elements, {
      autoAlpha: 1,
      x: 0,
      filter: 'blur(0px)',
      duration: speed,
      stagger: stagger,
      ease: ease
    }, 0.2);

    if (ctx.duration > 2) {
      var exitAt = ctx.duration - 0.7;
      tl.to(elements, {
        autoAlpha: 0,
        x: -20,
        filter: 'blur(4px)',
        duration: 0.4,
        stagger: 0.05,
        ease: 'power2.in'
      }, exitAt);
    }

    return tl;
  }
</script>
