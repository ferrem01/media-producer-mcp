  <div class="section-header">
    <div class="accent-line"></div>
    <span class="eyebrow"></span>
    <h2 class="heading"></h2>
    <p class="description"></p>
  </div>
</template>

<style scoped>

    text-shadow: 0 1px 8px rgba(0, 0, 0, 0.2);
  }

  .description:empty {
    display: none;
  }
</style>

<script>
  function createTimeline(el, data, ctx) {
    var tl = gsap.timeline();

    var accentLine = el.querySelector('.accent-line');
    var eyebrow = el.querySelector('.eyebrow');
    var heading = el.querySelector('.heading');
    var description = el.querySelector('.description');

    // Inject content
    if (data.eyebrow) eyebrow.textContent = data.eyebrow;
    if (data.title) heading.textContent = data.title;
    if (data.description) description.textContent = data.description;

    // Description sits on the PAGE: hardcoded #cbd5e1 measured 1.43:1 on a
    // white ground (cert). Pick muted ink from the measured ground.
    var groundLum = window.mpGroundLum ? mpGroundLum() : null;
    if (typeof groundLum === 'number') {
      description.style.color = groundLum < 0.18 ? '#e6e9f2' : '#4d5461';
    }

    var elements = [accentLine];
    if (eyebrow && eyebrow.textContent) elements.push(eyebrow);
    if (heading && heading.textContent) elements.push(heading);
    if (description && description.textContent) elements.push(description);

    // Initial states
    gsap.set(elements, { autoAlpha: 0 });

    // Accent line: width from 0
    gsap.set(accentLine, { scaleX: 0, transformOrigin: 'left center' });

    // Eyebrow: slide from left
    if (eyebrow && eyebrow.textContent) {
      gsap.set(eyebrow, { x: -30 });
    }

    // Heading: slight blur + y
    if (heading && heading.textContent) {
      gsap.set(heading, { y: 25, filter: 'blur(4px)' });
    }

    // Description: just y
    if (description && description.textContent) {
      gsap.set(description, { y: 20 });
    }

    var speed = ctx.motion === 'minimal' ? 0.35 : ctx.motion === 'punchy' ? 0.5 : 0.7;
    var t = 0.2;

    // Accent line grows in
    tl.to(accentLine, {
      autoAlpha: 1, scaleX: 1,
      duration: speed * 0.6,
      ease: 'power3.out'
    }, t);
    t += speed * 0.15;

    // Eyebrow slides in
    if (eyebrow && eyebrow.textContent) {
      tl.to(eyebrow, {
        autoAlpha: 1, x: 0,
        duration: speed * 0.7,
        ease: 'power3.out'
      }, t);
      t += speed * 0.2;
    }

    // Heading reveals
    if (heading && heading.textContent) {
      tl.to(heading, {
        autoAlpha: 1, y: 0, filter: 'blur(0px)',
        duration: speed,
        ease: 'power3.out'
      }, t);
      t += speed * 0.3;
    }

    // Description fades up
    if (description && description.textContent) {
      tl.to(description, {
        autoAlpha: 1, y: 0,
        duration: speed * 0.6,
        ease: 'power2.out'
      }, t);
    }

    // Exit
    if (ctx.duration > 2) {
      var exitAt = ctx.duration - 0.7;
      tl.to(elements, {
        autoAlpha: 0,
        duration: 0.35,
        stagger: 0.03,
        ease: 'power2.in'
      }, exitAt);
    }

    return tl;
  }
</script>
