      <pre class="code-content"></pre>
    </div>
  </div>
</template>

<script>
  function createTimeline(el, data, ctx) {
    var tl = gsap.timeline();
    var codeContent = el.querySelector('.code-content');
    var codeWindow = el.querySelector('.code-window');
    var code = data.code || '';
    var highlightLines = data.highlight_lines || [];

    var lines = code.split('\n');
    codeContent.innerHTML = '';

    var lineEls = [];
    lines.forEach(function(line, i) {
      var span = document.createElement('span');
      span.className = 'code-line';
      if (highlightLines.indexOf(i + 1) !== -1) {
        span.className += ' highlight';
      }
      span.textContent = line || '\u00A0';
      codeContent.appendChild(span);
      lineEls.push(span);
    });

    var speed = ctx.motion === 'minimal' ? 0.3 : ctx.motion === 'punchy' ? 0.35 : 0.4;
    var stagger = ctx.motion === 'minimal' ? 0.04 : ctx.motion === 'punchy' ? 0.06 : 0.08;

    gsap.set(codeWindow, { autoAlpha: 0, y: 20 });
    gsap.set(lineEls, { autoAlpha: 0, x: -15 });

    tl.to(codeWindow, {
      autoAlpha: 1,
      y: 0,
      duration: speed,
      ease: 'power3.out'
    }, 0.2);

    tl.to(lineEls, {
      autoAlpha: 1,
      x: 0,
      duration: speed,
      stagger: stagger,
      ease: 'power2.out'
    }, 0.4);

    if (ctx.duration > 2.5) {
      var exitAt = ctx.duration - 0.6;
      tl.to(codeWindow, {
        autoAlpha: 0,
        y: -15,
        duration: 0.4,
        ease: 'power2.in'
      }, exitAt);
    }

    return tl;
  }
</script>
