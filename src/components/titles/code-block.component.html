<script>
  function createTimeline(el, data, ctx) {
    var tl = gsap.timeline();
    var codeContent = el.querySelector('.code-content');
    var lineNumbersEl = el.querySelector('.line-numbers');
    var codeWindow = el.querySelector('.code-window');
    var code = data.code || '';
    var highlightLines = data.highlight_lines || [];

    var lines = code.split('\n');
    codeContent.innerHTML = '';
    lineNumbersEl.innerHTML = '';

    var lineEls = [];
    lines.forEach(function(line, i) {
      var numSpan = document.createElement('span');
      numSpan.className = 'line-num';
      numSpan.textContent = (i + 1).toString();
      lineNumbersEl.appendChild(numSpan);

      var span = document.createElement('span');
      span.className = 'code-line';
      if (highlightLines.indexOf(i + 1) !== -1) {
        span.className += ' highlight';
      }
      span.textContent = line || '\u00A0';
      codeContent.appendChild(span);
      lineEls.push(span);
    });

    // BARE style: no window chrome -- a naked mono line/stanza on the scene's
    // own canvas (the "$ npx ..." terminal-line beat, checklists on dark).
    if (data.style === 'bare') {
      var bar = el.querySelector('.window-bar');
      if (bar) bar.style.display = 'none';
      if (lineNumbersEl) lineNumbersEl.style.display = 'none';
      codeWindow.style.background = 'transparent';
      codeWindow.style.border = 'none';
      codeWindow.style.boxShadow = 'none';
      codeWindow.style.width = 'auto';
      codeContent.style.fontSize = data.font_size || '2.1vw';
      codeContent.style.lineHeight = '1.9';
      if (data.color) codeContent.style.color = data.color;
    }

    var speed = ctx.motion === 'minimal' ? 0.35 : ctx.motion === 'punchy' ? 0.45 : 0.55;
    var stagger = ctx.motion === 'minimal' ? 0.04 : ctx.motion === 'punchy' ? 0.06 : 0.08;

    // Window entrance with scale + blur
    gsap.set(codeWindow, { autoAlpha: 0, y: 40, scale: 1.05, filter: 'blur(5px)' });
    gsap.set(lineEls, { autoAlpha: 0, x: -15 });

    tl.to(codeWindow, {
      autoAlpha: 1, y: 0, scale: 1, filter: 'blur(0px)',
      duration: speed + 0.2,
      ease: 'power3.out'
    }, 0.2);

    tl.to(lineEls, {
      autoAlpha: 1, x: 0,
      duration: speed,
      stagger: stagger,
      ease: 'power2.out'
    }, 0.4 + speed * 0.3);

    // Exit
    if (ctx.duration > 2) {
      var exitAt = ctx.duration - 0.6;
      tl.to(codeWindow, {
        autoAlpha: 0, y: -15, scale: 0.97,
        duration: 0.4,
        ease: 'power2.in'
      }, exitAt);
    }

    return tl;
  }
</script>
