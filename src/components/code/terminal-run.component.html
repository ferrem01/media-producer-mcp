<script>
  function createTimeline(el, data, ctx) {
    var tl = gsap.timeline();
    var frame = el.querySelector('.tr-frame');
    var body = el.querySelector('.tr-body');
    var titleEl = el.querySelector('.tr-title');
    if (!frame || !body) return tl;

    var theme = (data && data.theme) || 'dark';
    var THEMES = ['pro', 'ocean', 'red-sands', 'homebrew', 'novel', 'silver-aerogel', 'grass', 'clear-dark'];
    if (theme === 'light') frame.classList.add('tr-light');
    else if (THEMES.indexOf(theme) !== -1) frame.classList.add('tr-theme-' + theme);
    if (data && data.title) titleEl.textContent = data.title;

    var prompt = (data && data.prompt) || '$';
    var command = (data && data.command) || 'npm run build';
    var output = (data && data.output && data.output.length) ? data.output : [
      '> building project...',
      'compiled 142 modules in 1.8s',
      'bundle: 84.2 kB (gzip)',
      'done ✓'
    ];

    var speed = ctx.motion === 'minimal' ? 0.4 : ctx.motion === 'punchy' ? 0.55 : 0.7;

    // command line
    var cmdLine = document.createElement('div');
    cmdLine.className = 'tr-line';
    var promptSpan = document.createElement('span');
    promptSpan.className = 'tr-prompt';
    promptSpan.textContent = prompt + ' ';
    cmdLine.appendChild(promptSpan);
    var cmdSpan = document.createElement('span');
    cmdSpan.className = 'tr-cmd';
    cmdLine.appendChild(cmdSpan);
    var cursor = document.createElement('span');
    cursor.className = 'tr-cursor';
    cmdLine.appendChild(cursor);
    body.appendChild(cmdLine);

    // output lines
    var outEls = [];
    output.forEach(function(text) {
      var line = document.createElement('div');
      line.className = 'tr-line';
      var span = document.createElement('span');
      span.className = 'tr-out';
      var t = (text != null ? text : '');
      if (/done|✓|success|ok\b/i.test(t)) span.className += ' tr-accent';
      span.textContent = t || ' ';
      line.appendChild(span);
      body.appendChild(line);
      outEls.push(line);
    });

    gsap.set(frame, { autoAlpha: 0, scale: 1.04, y: 32, filter: 'blur(6px)' });
    gsap.set(cmdLine, { autoAlpha: 0 });
    gsap.set(outEls, { autoAlpha: 0, y: 8 });

    tl.to(frame, { autoAlpha: 1, scale: 1, y: 0, filter: 'blur(0px)', duration: speed, ease: 'power3.out' }, 0.2);

    // blinking cursor (finite repeats -> finite timeline)
    var blinkReps = Math.max(2, Math.ceil((ctx.duration || 6) / 0.5));
    tl.to(cursor, { autoAlpha: 0, duration: 0.5, ease: 'steps(1)', yoyo: true, repeat: blinkReps }, 0.4);

    var holdEnd = ctx.duration > 2 ? ctx.duration - 0.7 : ctx.duration;
    var typeStart = 0.2 + speed + 0.25;
    tl.set(cmdLine, { autoAlpha: 1 }, typeStart);

    // type command char-by-char
    var typeBudget = Math.min(1.4, (holdEnd - typeStart) * 0.4);
    var perChar = command.length ? Math.min(0.06, typeBudget / command.length) : 0;
    for (var c = 0; c < command.length; c++) {
      (function(ch, idx) {
        tl.call(function() { cmdSpan.textContent += ch; }, null, typeStart + idx * perChar);
      })(command[c], c);
    }
    var cmdEnd = typeStart + command.length * perChar;

    // hide cursor at "enter", stream output
    var outStart = cmdEnd + 0.35;
    tl.set(cursor, { display: 'none' }, outStart - 0.05);

    var remaining = Math.max(0.5, holdEnd - outStart - 0.2);
    var perOut = remaining / Math.max(outEls.length, 1);
    outEls.forEach(function(line, i) {
      tl.to(line, { autoAlpha: 1, y: 0, duration: Math.min(speed, perOut * 0.8), ease: 'power2.out' }, outStart + i * perOut);
    });

    if (ctx.duration > 2) {
      var exitAt = ctx.duration - 0.6;
      tl.to(frame, { autoAlpha: 0, scale: 0.97, y: -15, duration: 0.45, ease: 'power2.in' }, exitAt);
    }

    return tl;
  }
