<script>
  function createTimeline(el, data, ctx) {
    var tl = gsap.timeline();
    var win = el.querySelector('.cd-window');
    var body = el.querySelector('.cd-body');
    var titleEl = el.querySelector('.cd-title');
    if (!win || !body) return tl;

    var theme = (data && data.theme) || 'dark';
    if (theme === 'light') win.classList.add('cd-light');
    if (data && data.title) titleEl.textContent = data.title;

    var lines = (data && data.lines && data.lines.length) ? data.lines : [
      { text: "const total = items.length;", type: "ctx" },
      { text: "let sum = 0;", type: "del" },
      { text: "const sum = items.reduce((a, b) => a + b, 0);", type: "add" },
      { text: "return sum / total;", type: "ctx" }
    ];

    var lineEls = [];
    lines.forEach(function(ln) {
      var type = ln.type || 'ctx';
      var lineEl = document.createElement('div');
      lineEl.className = 'cd-line cd-' + (type === 'add' ? 'add' : type === 'del' ? 'del' : 'ctx');

      var sign = document.createElement('span');
      sign.className = 'cd-sign';
      sign.textContent = type === 'add' ? '+' : type === 'del' ? '-' : ' ';
      lineEl.appendChild(sign);

      var txt = document.createElement('span');
      txt.className = 'cd-text';
      txt.textContent = (ln.text != null ? ln.text : '') || ' ';
      lineEl.appendChild(txt);

      body.appendChild(lineEl);
      lineEls.push({ el: lineEl, type: type });
    });

    var speed = ctx.motion === 'minimal' ? 0.35 : ctx.motion === 'punchy' ? 0.45 : 0.55;
    var stagger = ctx.motion === 'minimal' ? 0.06 : 0.1;

    gsap.set(win, { autoAlpha: 0, y: 36, scale: 1.04, filter: 'blur(5px)' });
    tl.to(win, { autoAlpha: 1, y: 0, scale: 1, filter: 'blur(0px)', duration: 0.6, ease: 'power3.out' }, 0.15);

    // context lines fade in first
    lineEls.forEach(function(item) {
      if (item.type === 'ctx') gsap.set(item.el, { autoAlpha: 0, x: -10 });
      else if (item.type === 'add') gsap.set(item.el, { autoAlpha: 0, x: 40, height: 0, overflow: 'hidden' });
      else gsap.set(item.el, { autoAlpha: 0, x: -40, height: 0, overflow: 'hidden' });
    });

    var ctxStart = 0.5;
    var ctxEls = lineEls.filter(function(i){ return i.type === 'ctx'; }).map(function(i){ return i.el; });
    if (ctxEls.length) {
      tl.to(ctxEls, { autoAlpha: 1, x: 0, duration: speed, stagger: stagger, ease: 'power2.out' }, ctxStart);
    }

    // removed lines slide in (red), then added lines slide in (green)
    var diffStart = ctxStart + 0.4;
    lineEls.forEach(function(item, idx) {
      if (item.type === 'del') {
        tl.to(item.el, { autoAlpha: 1, x: 0, height: 'auto', duration: speed, ease: 'power2.out' }, diffStart + idx * stagger * 1.5);
      }
    });
    var addStart = diffStart + 0.45;
    lineEls.forEach(function(item, idx) {
      if (item.type === 'add') {
        tl.to(item.el, { autoAlpha: 1, x: 0, height: 'auto', duration: speed, ease: 'back.out(1.2)' }, addStart + idx * stagger * 1.5);
      }
    });

    if (ctx.duration > 2) {
      var exitAt = ctx.duration - 0.6;
      tl.to(win, { autoAlpha: 0, y: -15, scale: 0.97, duration: 0.45, ease: 'power2.in' }, exitAt);
    }

    return tl;
  }
</script>
