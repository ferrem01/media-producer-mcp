<script>
  function createTimeline(el, data, ctx) {
    var tl = gsap.timeline();

    var win = el.querySelector('.ct-window');
    var codeEl = el.querySelector('.ct-code');
    var numsEl = el.querySelector('.ct-nums');
    var langEl = el.querySelector('.ct-lang');
    if (!win || !codeEl || !numsEl) return tl;

    var code = (data && typeof data.code === 'string' && data.code.length) ? data.code
      : "function greet(name) {\n  // say hello\n  return \"Hi, \" + name;\n}";
    var language = (data && data.language) || 'js';
    var theme = (data && data.theme) || 'dark';
    if (theme === 'light') win.classList.add('ct-light');
    langEl.textContent = language;

    // lightweight tokenizer -> returns array of {text, cls}
    var KW = ['function','return','const','let','var','if','else','for','while','import','export','from','class','new','async','await','def','public','private','void','int','string','bool','true','false','null','undefined','this'];
    function tokenize(line) {
      var out = [];
      // whole-line comment
      var trimmed = line.replace(/^\s*/, '');
      if (trimmed.indexOf('//') === 0 || trimmed.indexOf('#') === 0) {
        out.push({ text: line, cls: 'tok-com' });
        return out;
      }
      var re = /(\"[^\"]*\"|'[^']*'|`[^`]*`)|(\/\/.*$)|(\b\d+(?:\.\d+)?\b)|([A-Za-z_$][A-Za-z0-9_$]*)|(\s+)|([^\sA-Za-z0-9_$]+)/g;
      var m;
      while ((m = re.exec(line)) !== null) {
        if (m[1]) out.push({ text: m[1], cls: 'tok-str' });
        else if (m[2]) out.push({ text: m[2], cls: 'tok-com' });
        else if (m[3]) out.push({ text: m[3], cls: 'tok-num' });
        else if (m[4]) {
          var cls = KW.indexOf(m[4]) !== -1 ? 'tok-kw' : null;
          if (!cls) {
            // function-call heuristic: followed by '('
            var after = line.slice(re.lastIndex);
            if (/^\s*\(/.test(after)) cls = 'tok-fn';
          }
          out.push({ text: m[4], cls: cls });
        }
        else if (m[5]) out.push({ text: m[5], cls: null });
        else out.push({ text: m[0], cls: null });
        if (m.index === re.lastIndex) re.lastIndex++;
      }
      return out;
    }

    var lines = code.split('\n');
    codeEl.innerHTML = '';
    numsEl.innerHTML = '';

    var lineEls = [];
    var lineTokens = [];
    lines.forEach(function(line, i) {
      var num = document.createElement('span');
      num.className = 'ct-num';
      num.textContent = (i + 1).toString();
      numsEl.appendChild(num);

      var lineEl = document.createElement('span');
      lineEl.className = 'ct-line';
      codeEl.appendChild(lineEl);
      lineEls.push(lineEl);
      lineTokens.push(tokenize(line));
    });

    // cursor lives at the end of the currently-typed line
    var cursor = document.createElement('span');
    cursor.className = 'ct-cursor';

    gsap.set(win, { autoAlpha: 0, y: 36, scale: 1.04, filter: 'blur(5px)' });
    gsap.set(numsEl, { autoAlpha: 0 });

    tl.to(win, { autoAlpha: 1, y: 0, scale: 1, filter: 'blur(0px)', duration: 0.6, ease: 'power3.out' }, 0.15);
    tl.to(numsEl, { autoAlpha: 1, duration: 0.4 }, 0.35);

    // blinking cursor (independent, finite repeats so the master timeline stays finite)
    gsap.set(cursor, { autoAlpha: 1 });
    var blinkReps = Math.max(2, Math.ceil((ctx.duration || 6) / 0.5));
    tl.to(cursor, { autoAlpha: 0, duration: 0.5, ease: 'steps(1)', yoyo: true, repeat: blinkReps }, 0.5);

    // total typing budget
    var holdEnd = ctx.duration > 2 ? ctx.duration - 0.7 : ctx.duration;
    var typeStart = 0.7;
    var typeBudget = Math.max(1.2, holdEnd - typeStart - 0.3);

    var totalChars = 0;
    lineTokens.forEach(function(toks) { toks.forEach(function(t) { totalChars += t.text.length; }); totalChars += 1; });
    if (totalChars < 1) totalChars = 1;
    var perChar = Math.min(0.05, typeBudget / totalChars);

    var t = typeStart;
    lineEls.forEach(function(lineEl, li) {
      var toks = lineTokens[li];
      (function(lineElRef) {
        tl.call(function() {
          if (cursor.parentNode) cursor.parentNode.removeChild(cursor);
          lineElRef.appendChild(cursor);
        }, null, t);
      })(lineEl);

      toks.forEach(function(tok) {
        var span = document.createElement('span');
        if (tok.cls) span.className = tok.cls;
        lineEl.insertBefore(span, cursor.parentNode === lineEl ? cursor : null);
        var chars = tok.text.split('');
        chars.forEach(function(ch) {
          (function(c) {
            tl.call(function() { span.textContent += c; }, null, t);
          })(ch);
          t += perChar;
        });
      });
      // line break pause
      t += perChar * 2;
    });

    // settle cursor blink continues; exit
    if (ctx.duration > 2) {
      var exitAt = ctx.duration - 0.6;
      tl.to(win, { autoAlpha: 0, y: -15, scale: 0.97, duration: 0.45, ease: 'power2.in' }, exitAt);
    }

    return tl;
  }
</script>
