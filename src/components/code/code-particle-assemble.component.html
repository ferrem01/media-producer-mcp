<script>
  function createTimeline(el, data, ctx) {
    var tl = gsap.timeline();
    var win = el.querySelector('.cp-window');
    var codeEl = el.querySelector('.cp-code');
    var numsEl = el.querySelector('.cp-nums');
    var langEl = el.querySelector('.cp-lang');
    if (!win || !codeEl || !numsEl) return tl;

    var code = (data && typeof data.code === 'string' && data.code.length) ? data.code
      : "import { render } from \"engine\";\n\nfunction main() {\n  render(scene);\n}";
    var theme = (data && data.theme) || 'dark';
    if (theme === 'light') win.classList.add('cp-light');
    if (data && data.language) langEl.textContent = data.language;

    var KW = ['function','return','const','let','var','if','else','for','while','import','export','from','class','new','async','await','def','public','private','void','int','string','bool','true','false','null','undefined','this'];
    function tokenize(line) {
      var out = [];
      var trimmed = line.replace(/^\s*/, '');
      if (trimmed.indexOf('//') === 0 || trimmed.indexOf('#') === 0) { out.push({ text: line, cls: 'tok-com' }); return out; }
      var re = /(\"[^\"]*\"|'[^']*'|`[^`]*`)|(\/\/.*$)|(\b\d+(?:\.\d+)?\b)|([A-Za-z_$][A-Za-z0-9_$]*)|(\s+)|([^\sA-Za-z0-9_$]+)/g;
      var m;
      while ((m = re.exec(line)) !== null) {
        if (m[1]) out.push({ text: m[1], cls: 'tok-str' });
        else if (m[2]) out.push({ text: m[2], cls: 'tok-com' });
        else if (m[3]) out.push({ text: m[3], cls: 'tok-num' });
        else if (m[4]) {
          var cls = KW.indexOf(m[4]) !== -1 ? 'tok-kw' : null;
          if (!cls && /^\s*\(/.test(line.slice(re.lastIndex))) cls = 'tok-fn';
          out.push({ text: m[4], cls: cls });
        } else if (m[5]) out.push({ text: m[5], cls: null });
        else out.push({ text: m[0], cls: null });
        if (m.index === re.lastIndex) re.lastIndex++;
      }
      return out;
    }

    var lines = code.split('\n');
    codeEl.innerHTML = '';
    numsEl.innerHTML = '';

    // collect token elements (skip pure-whitespace tokens for animation perf)
    var tokenEls = [];
    lines.forEach(function(line, li) {
      var num = document.createElement('span');
      num.className = 'cp-num';
      num.textContent = (li + 1).toString();
      numsEl.appendChild(num);

      var lineEl = document.createElement('span');
      lineEl.className = 'cp-line';
      var toks = tokenize(line);
      if (!toks.length) lineEl.textContent = ' ';
      toks.forEach(function(tok) {
        var span = document.createElement('span');
        span.className = 'cp-tok' + (tok.cls ? ' ' + tok.cls : '');
        span.textContent = tok.text;
        lineEl.appendChild(span);
        // animate only non-whitespace tokens to keep it performant
        if (/\S/.test(tok.text)) tokenEls.push({ span: span, line: li });
      });
      codeEl.appendChild(lineEl);
    });

    var speed = ctx.motion === 'minimal' ? 0.5 : ctx.motion === 'punchy' ? 0.6 : 0.75;

    gsap.set(win, { autoAlpha: 0, scale: 1.04, y: 32, filter: 'blur(6px)' });
    gsap.set(numsEl, { autoAlpha: 0 });

    // scatter tokens: random offset + blur + transparent
    tokenEls.forEach(function(item, i) {
      var ang = (i * 137.5) * Math.PI / 180; // golden-angle scatter, deterministic
      var dist = 60 + (i % 7) * 22;
      gsap.set(item.span, {
        autoAlpha: 0,
        x: Math.cos(ang) * dist,
        y: Math.sin(ang) * dist - 10,
        scale: 0.6,
        filter: 'blur(6px)',
        rotation: ((i % 5) - 2) * 6
      });
    });

    tl.to(win, { autoAlpha: 1, scale: 1, y: 0, filter: 'blur(0px)', duration: speed, ease: 'power3.out' }, 0.15);
    tl.to(numsEl, { autoAlpha: 1, duration: 0.5 }, 0.4);

    var holdEnd = ctx.duration > 2 ? ctx.duration - 0.7 : ctx.duration;
    var assembleStart = 0.55;
    var assembleSpan = Math.max(0.8, (holdEnd - assembleStart) * 0.65);
    var n = Math.max(tokenEls.length, 1);
    // group by line so it reads as lines snapping in, but stagger per token within
    var stagger = assembleSpan / n;

    tokenEls.forEach(function(item, i) {
      var at = assembleStart + i * stagger;
      tl.to(item.span, {
        autoAlpha: 1, x: 0, y: 0, scale: 1, rotation: 0, filter: 'blur(0px)',
        duration: speed,
        ease: 'power2.out'
      }, at);
    });

    if (ctx.duration > 2) {
      var exitAt = ctx.duration - 0.6;
      tl.to(win, { autoAlpha: 0, y: -15, scale: 0.97, duration: 0.45, ease: 'power2.in' }, exitAt);
    }

    return tl;
  }
</script>
