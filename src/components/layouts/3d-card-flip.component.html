          <p class="face-description front-description"></p>
        </div>
        <div class="card-face card-back">
          <h2 class="face-title back-title"></h2>
          <p class="face-description back-description"></p>
        </div>
      </div>

  </div>
</template>

<style scoped>
  .card-flip-wrap {

    display: none;
  }

<script>
  function createTimeline(el, data, ctx) {
    var tl = gsap.timeline();
    var container = el.querySelector('.card-flip-container');
    var inner = el.querySelector('.card-inner');
    var frontTitle = el.querySelector('.front-title');
    var frontDesc = el.querySelector('.front-description');
    var backTitle = el.querySelector('.back-title');
    var backDesc = el.querySelector('.back-description');

    if (data.front_title) frontTitle.textContent = data.front_title;
    if (data.front_description) frontDesc.textContent = data.front_description;
    if (data.back_title) backTitle.textContent = data.back_title;
    if (data.back_description) backDesc.textContent = data.back_description;

    var speed = ctx.motion === 'minimal' ? 0.5 : ctx.motion === 'punchy' ? 0.7 : 1.0;

    // Initial state
    gsap.set(container, { autoAlpha: 0, scale: 0.88, y: 30, filter: 'blur(4px)' });

    // Card entrance
    tl.to(container, {
      autoAlpha: 1, scale: 1, y: 0, filter: 'blur(0px)',
      duration: speed,
      ease: 'power3.out'
    }, 0.3);

    // Show front briefly, then flip at midpoint
    var flipTime = ctx.duration * 0.45;
    tl.to(inner, {
      rotateY: 180,
      duration: speed * 1.2,
      ease: 'power2.inOut'
    }, flipTime);

    // Subtle shadow shift during flip
    tl.to(container, {
      boxShadow: '0 30px 80px rgba(0, 0, 0, 0.4)',
      duration: speed * 0.6,
      ease: 'power2.in'
    }, flipTime);

    tl.to(container, {
      boxShadow: '0 24px 60px rgba(0, 0, 0, 0.35)',
      duration: speed * 0.6,
      ease: 'power2.out'
    }, flipTime + speed * 0.6);

    // Exit
    if (ctx.duration > 2) {
      var exitAt = ctx.duration - 0.7;
      tl.to(container, {
        autoAlpha: 0, scale: 0.95, y: -15,
        duration: 0.5,
        ease: 'power2.in'
      }, exitAt);
    }

    return tl;
  }
</script>
