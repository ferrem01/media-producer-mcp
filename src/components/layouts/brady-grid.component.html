    <div class="grid-container" id="grid-container"></div>
  </div>
</template>

<style scoped>
  .brady-grid {
    position: relative;
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;

    padding: 40px;

    font-family: var(--mp-font-family, 'Inter', system-ui, sans-serif);

  }

  .grid-title {
    font-size: 42px;

    color: var(--mp-color-text, #ffffff);
    letter-spacing: -0.02em;
    text-align: center;
    z-index: 2;
  }
  .grid-title:empty { display: none; }

  .grid-container {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    grid-template-rows: repeat(3, 1fr);
    gap: 8px;
    width: 85%;
    max-width: 960px;
    aspect-ratio: 1;
    /* Cert sweep: aspect-ratio makes the transferred 960px height this item's
       automatic min-height, so the column overflowed and centered overflow
       pushed the title off-canvas (title measured 0:1 clipped). Let it shrink. */
    min-height: 0;
    flex: 0 1 auto;
    z-index: 1;
  }

  .grid-cell {
    position: relative;
    border-radius: 12px;
    overflow: hidden;
    border: 2px solid color-mix(in srgb, var(--mp-color-primary, #6366f1) 40%, transparent);
    box-shadow: 0 4px 20px rgba(0,0,0,0.4);
    background: color-mix(in srgb, var(--mp-color-surface, #1e293b) 80%, transparent);
  }

  .grid-cell video {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  .grid-cell .cell-label {
    position: absolute;
    bottom: 8px;
    left: 10px;
    font-size: 11px;
    font-weight: 600;
    color: var(--mp-color-text, #ffffff);
    background: rgba(0,0,0,0.6);
    padding: 3px 8px;

  }
  .grid-cell .cell-label:empty { display: none; }
</style>

<script>
  function createTimeline(el, data, ctx) {
    var tl = gsap.timeline();
    var container = el.querySelector('#grid-container');
    var src = data.src || data.source;
    var labels = data.labels || [];
    // Default: all tiles play in sync (same start_at). Pass different offsets for staggered look.
    var defaultOffset = data.start_at || 0;
    var offsets = data.offsets || [defaultOffset, defaultOffset, defaultOffset, defaultOffset, defaultOffset, defaultOffset, defaultOffset, defaultOffset, defaultOffset];

    // Create 9 grid cells with video
    for (var i = 0; i < 9; i++) {
      var cell = document.createElement('div');
      cell.className = 'grid-cell';
      gsap.set(cell, { autoAlpha: 0, scale: 0.8 });

      if (src) {
        var startAt = offsets[i] || 0;
        loadVideoForCapture(cell, src, {
          style: 'width:100%;height:100%;object-fit:cover;display:block;',
          startAt: startAt
        });
      }

      if (labels[i]) {
        var label = document.createElement('div');
        label.className = 'cell-label';
        label.textContent = labels[i];
        cell.appendChild(label);
      }

      container.appendChild(cell);
    }

    var cells = container.querySelectorAll('.grid-cell');

    // Staggered entrance: each cell pops in
    var speed = ctx.motion === 'minimal' ? 0.3 : ctx.motion === 'punchy' ? 0.4 : 0.5;
    tl.to(cells, {
      autoAlpha: 1,
      scale: 1,
      duration: speed,
      stagger: { each: 0.12, from: 'random' },
      ease: 'back.out(1.4)'
    }, 0.3);

    // Exit
    if (ctx.duration > 3) {
      tl.to(cells, {
        autoAlpha: 0,
        scale: 0.9,
        duration: 0.4,
        stagger: { each: 0.05, from: 'random' },
        ease: 'power2.in'
      }, ctx.duration - 0.8);
    }

    return tl;
  }
</script>
