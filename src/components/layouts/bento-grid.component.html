<template>
  <div class="bento-grid-wrap">
    <div class="bento-grid"></div>
  </div>
</template>

<style scoped>
  .bento-grid-wrap {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 100%;
    height: 100%;
    padding: 80px;
    font-family: var(--mp-font-family, 'Inter', system-ui, -apple-system, sans-serif);
  }

  .bento-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    grid-auto-rows: minmax(120px, 1fr);
    gap: 16px;
    width: 100%;
    height: 100%;
    box-sizing: border-box;
  }

  .bento-card {
    background: var(--mp-color-surface, rgba(255, 255, 255, 0.03));
    border: 1px solid var(--mp-color-border, rgba(127,127,127,0.2));
    border-radius: 16px;
    padding: 32px;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    overflow: hidden;
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    box-shadow:
      0 8px 32px rgba(0, 0, 0, 0.2),
      0 0 0 1px rgba(255, 255, 255, 0.03);
    position: relative;
  }

  .bento-card::before {
    content: '';
    position: absolute;
    top: 0;
    left: 10%;
    right: 10%;
    height: 1px;
    background: linear-gradient(
      90deg,
      transparent,
      rgba(167, 139, 250, 0.2) 50%,
      transparent
    );
    opacity: 0;
    transition: opacity 0.3s;
  }

  .bento-card.size-medium {
    grid-column: span 2;
  }

  .bento-card.size-large {
    grid-column: span 2;
    grid-row: span 2;
  }

  .bento-card-icon {
    width: 48px;
    height: 48px;
    border-radius: 14px;
    background: linear-gradient(
      135deg,
      rgba(167, 139, 250, 0.15) 0%,
      rgba(139, 92, 246, 0.08) 100%
    );
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 24px;
    margin-bottom: 16px;
  }

  .bento-card-title {
    font-size: 18px;
    font-weight: 700;
    color: var(--mp-color-text, #ffffff);
    margin: 0 0 6px 0;
    line-height: 1.2;
    letter-spacing: -0.01em;
  }

  .bento-card-desc {
    font-size: 14px;
    color: var(--mp-color-text-muted, #94a3b8);
    margin: 0;
    line-height: 1.5;
    letter-spacing: 0.005em;
  }
</style>

<script>
  function createTimeline(el, data, ctx) {
    var tl = gsap.timeline();
    var grid = el.querySelector('.bento-grid');
    var cards = data.cards || [];

    for (var i = 0; i < cards.length; i++) {
      var card = document.createElement('div');
      card.className = 'bento-card';
      var size = cards[i].size || 'small';
      card.classList.add('size-' + size);
      if (cards[i].color) card.style.background = cards[i].color;

      if (cards[i].icon) {
        var iconWrap = document.createElement('div');
        iconWrap.className = 'bento-card-icon';
        iconWrap.textContent = cards[i].icon;
        card.appendChild(iconWrap);
      }

      var title = document.createElement('div');
      title.className = 'bento-card-title';
      title.textContent = cards[i].title || '';
      card.appendChild(title);

      if (cards[i].description) {
        var desc = document.createElement('div');
        desc.className = 'bento-card-desc';
        desc.textContent = cards[i].description;
        card.appendChild(desc);
      }

      grid.appendChild(card);
    }

    var cardEls = grid.querySelectorAll('.bento-card');
    var speed = ctx.motion === 'minimal' ? 0.35 : ctx.motion === 'punchy' ? 0.45 : 0.6;
    var stagger = ctx.motion === 'minimal' ? 0.06 : ctx.motion === 'punchy' ? 0.08 : 0.12;

    // Scale + blur entrance
    gsap.set(cardEls, { autoAlpha: 0, y: 25, scale: 1.06, filter: 'blur(5px)' });

    tl.to(cardEls, {
      autoAlpha: 1, y: 0, scale: 1, filter: 'blur(0px)',
      duration: speed,
      stagger: {
        each: stagger,
        from: 'start'
      },
      ease: ctx.motion === 'punchy' ? 'back.out(1.2)' : 'power3.out'
    }, 0.3);

    // Add glow accent line + elevated shadow after entrance
    tl.to(cardEls, {
      boxShadow: '0 0 30px rgba(167, 139, 250, 0.06), 0 12px 40px rgba(0, 0, 0, 0.25), 0 0 0 1px rgba(255, 255, 255, 0.04)',
      duration: 0.4,
      stagger: stagger * 0.5,
      onComplete: function() {
        for (var j = 0; j < cardEls.length; j++) {
          cardEls[j].querySelector(':before') || (cardEls[j].style.cssText += '');
        }
      }
    }, '-=0.2');

    // Reveal accent lines
    for (var k = 0; k < cardEls.length; k++) {
      (function(cardEl, idx) {
        tl.to(cardEl, {
          onStart: function() {
            cardEl.style.setProperty('--accent-visible', '1');
          }
        }, 0.3 + speed + stagger * idx);
      })(cardEls[k], k);
    }

    // Exit
    if (ctx.duration > 2) {
      var exitAt = ctx.duration - 0.6;
      tl.to(cardEls, {
        autoAlpha: 0, y: -10, scale: 0.97,
        duration: 0.35,
        stagger: 0.03,
        ease: 'power2.in'
      }, exitAt);
    }

    return tl;
  }
</script>
