    </div>
  </div>
</template>

<style scoped>

<script>
  function createTimeline(el, data, ctx) {
    var tl = gsap.timeline();
    var container = el.querySelector('.split-screen');
    var leftPanel = el.querySelector('.panel-left');
    var rightPanel = el.querySelector('.panel-right');
    var divider = el.querySelector('.divider');
    var dividerLine = el.querySelector('.divider-line');
    var dividerGlow = el.querySelector('.divider-glow');
    // Split is a 0-1 ratio. Defend against percent-style (42 -> 0.42) and
    // out-of-range values: an invalid ratio (e.g. 42 = 4200% panel width)
    // shoved both panels' content off-canvas (labels measured 0:1 clipped).
    var split = Number(data.split);
    if (!isFinite(split) || split <= 0) split = 0.5;
    if (split > 1) split = split > 100 ? 0.5 : split / 100;
    split = Math.min(0.85, Math.max(0.15, split));
    var direction = data.direction || 'horizontal';
    var isVertical = direction === 'vertical';

    if (isVertical) {
      container.classList.add('vertical');
      leftPanel.style.height = (split * 100) + '%';
      leftPanel.style.width = '100%';
      rightPanel.style.height = ((1 - split) * 100) + '%';
      rightPanel.style.width = '100%';
    } else {
      leftPanel.style.width = (split * 100) + '%';
      leftPanel.style.height = '100%';
      rightPanel.style.width = ((1 - split) * 100) + '%';
      rightPanel.style.height = '100%';
    }

    if (data.left_bg) leftPanel.style.background = data.left_bg;
    if (data.right_bg) rightPanel.style.background = data.right_bg;

    var leftContent = el.querySelector('.panel-left .panel-content');
    var rightContent = el.querySelector('.panel-right .panel-content');
    if (data.left_content) leftContent.innerHTML = data.left_content;
    if (data.right_content) rightContent.innerHTML = data.right_content;

    var speed = ctx.motion === 'minimal' ? 0.45 : ctx.motion === 'punchy' ? 0.6 : 0.8;
    var ease = ctx.motion === 'punchy' ? 'back.out(1.1)' : 'power3.out';

    // Initial states
    gsap.set(divider, { autoAlpha: 0 });
    gsap.set(dividerGlow, { autoAlpha: 0, scale: 0.5 });

    if (isVertical) {
      gsap.set(leftPanel, { yPercent: -100 });
      gsap.set(rightPanel, { yPercent: 100 });
    } else {
      gsap.set(leftPanel, { xPercent: -100 });
      gsap.set(rightPanel, { xPercent: 100 });
    }

    // Panels slide in
    tl.to(leftPanel, {
      xPercent: 0, yPercent: 0, duration: speed, ease: ease
    }, 0.2);
    tl.to(rightPanel, {
      xPercent: 0, yPercent: 0, duration: speed, ease: ease
    }, 0.3);

    // Divider fades in with glow
    tl.to(divider, {
      autoAlpha: 1, duration: 0.4, ease: 'power2.out'
    }, 0.2 + speed * 0.4);
    tl.to(dividerGlow, {
      autoAlpha: 1, scale: 1,
      duration: 0.6, ease: 'power2.out'
    }, 0.2 + speed * 0.5);

    // Content fades in with scale + blur
    var contents = el.querySelectorAll('.panel-content');
    gsap.set(contents, { autoAlpha: 0, y: 25, scale: 1.06, filter: 'blur(4px)' });
    tl.to(contents, {
      autoAlpha: 1, y: 0, scale: 1, filter: 'blur(0px)',
      duration: 0.55, stagger: 0.15, ease: 'power3.out'
    }, 0.3 + speed * 0.5);

    // Exit
    if (ctx.duration > 2) {
      var exitAt = ctx.duration - 0.7;
      tl.to([leftPanel, divider, rightPanel], {
        autoAlpha: 0, duration: 0.45, ease: 'power2.in'
      }, exitAt);
    }

    return tl;
  }
</script>
