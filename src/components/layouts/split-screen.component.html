<template>
  <div class="split-screen">
    <div class="panel panel-left">
      <div class="panel-content">{{left_content}}</div>
    </div>
    <div class="panel panel-right">
      <div class="panel-content">{{right_content}}</div>
    </div>
  </div>
</template>

<style scoped>
  .split-screen {
    display: flex;
    width: 100%;
    height: 100%;
    overflow: hidden;
    font-family: var(--mp-font-family, 'Inter', sans-serif);
  }

  .split-screen.vertical {
    flex-direction: column;
  }

  .panel {
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }

  .panel-left {
    background: var(--mp-color-surface, #1e293b);
  }

  .panel-right {
    background: var(--mp-color-background, #0f172a);
  }

  .panel-content {
    padding: 40px;
    font-size: 32px;
    font-weight: 600;
    color: var(--mp-color-text, #ffffff);
    text-align: center;
    line-height: 1.3;
  }

  .panel-content:empty {
    display: none;
  }
</style>

<script>
  function createTimeline(el, data, ctx) {
    var tl = gsap.timeline();
    var container = el.querySelector('.split-screen');
    var leftPanel = el.querySelector('.panel-left');
    var rightPanel = el.querySelector('.panel-right');
    var split = data.split || 0.5;
    var direction = data.direction || 'horizontal';
    var isVertical = direction === 'vertical';

    if (isVertical) {
      container.classList.add('vertical');
      leftPanel.style.height = (split * 100) + '%';
      leftPanel.style.width = '100%';
      rightPanel.style.height = ((1 - split) * 100) + '%';
      rightPanel.style.width = '100%';
    } else {
      leftPanel.style.width = (split * 100) + '%';
      leftPanel.style.height = '100%';
      rightPanel.style.width = ((1 - split) * 100) + '%';
      rightPanel.style.height = '100%';
    }

    if (data.left_bg) leftPanel.style.background = data.left_bg;
    if (data.right_bg) rightPanel.style.background = data.right_bg;

    var speed = ctx.motion === 'minimal' ? 0.5 : ctx.motion === 'punchy' ? 0.6 : 0.8;
    var ease = ctx.motion === 'punchy' ? 'back.out(1.1)' : 'power3.out';

    if (isVertical) {
      gsap.set(leftPanel, { yPercent: -100 });
      gsap.set(rightPanel, { yPercent: 100 });
    } else {
      gsap.set(leftPanel, { xPercent: -100 });
      gsap.set(rightPanel, { xPercent: 100 });
    }

    tl.to(leftPanel, {
      xPercent: 0, yPercent: 0, duration: speed, ease: ease
    }, 0.2);
    tl.to(rightPanel, {
      xPercent: 0, yPercent: 0, duration: speed, ease: ease
    }, 0.3);

    // Fade in content
    var contents = el.querySelectorAll('.panel-content');
    gsap.set(contents, { autoAlpha: 0 });
    tl.to(contents, {
      autoAlpha: 1, duration: 0.4, stagger: 0.1, ease: 'power2.out'
    }, 0.5 + speed * 0.5);

    // Exit
    if (ctx.duration > 2) {
      var exitAt = ctx.duration - 0.7;
      tl.to(el.children, {
        autoAlpha: 0, duration: 0.4, ease: 'power2.in'
      }, exitAt);
    }

    return tl;
  }
</script>
