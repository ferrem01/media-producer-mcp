<script>
  function createTimeline(el, data, ctx) {
    var tl = gsap.timeline();
    var panelBefore = el.querySelector('.panel-before');
    var panelAfter = el.querySelector('.panel-after');
    var divider = el.querySelector('.panel-divider');
    var beforeBadge = el.querySelector('.before-badge');
    var afterBadge = el.querySelector('.after-badge');
    var beforeItems = el.querySelector('.before-items');
    var afterItems = el.querySelector('.after-items');

    var beforeLabel = data.before_label || 'Before';
    var afterLabel = data.after_label || 'After';
    beforeBadge.textContent = beforeLabel;
    afterBadge.textContent = afterLabel;

    // Build before items
    var beforeItemEls = [];
    var beforeList = data.before_items || [];
    for (var b = 0; b < beforeList.length; b++) {
      var item = document.createElement('div');
      item.className = 'panel-item';
      var icon = document.createElement('div');
      icon.className = 'item-icon before-icon';
      icon.textContent = '✕';
      item.appendChild(icon);
      var text = document.createElement('span');
      text.className = 'before-text';
      text.textContent = beforeList[b];
      item.appendChild(text);
      beforeItems.appendChild(item);
      beforeItemEls.push(item);
    }

    // Build after items
    var afterItemEls = [];
    var afterList = data.after_items || [];
    for (var a = 0; a < afterList.length; a++) {
      var item2 = document.createElement('div');
      item2.className = 'panel-item';
      var icon2 = document.createElement('div');
      icon2.className = 'item-icon after-icon';
      icon2.textContent = '✓';
      item2.appendChild(icon2);
      var text2 = document.createElement('span');
      text2.className = 'after-text';
      text2.textContent = afterList[a];
      item2.appendChild(text2);
      afterItems.appendChild(item2);
      afterItemEls.push(item2);
    }

    // Initial states
    gsap.set(panelBefore, { autoAlpha: 0, x: -30, scale: 1.05, filter: 'blur(4px)' });
    gsap.set(panelAfter, { autoAlpha: 0, x: 30, scale: 1.05, filter: 'blur(4px)' });
    gsap.set(divider, { autoAlpha: 0, scale: 0.8 });
    gsap.set(beforeItemEls, { autoAlpha: 0, x: -15 });
    gsap.set(afterItemEls, { autoAlpha: 0, x: 15 });

    var speed = ctx.motion === 'minimal' ? 0.4 : ctx.motion === 'punchy' ? 0.6 : 0.8;

    // Before panel entrance
    tl.to(panelBefore, {
      autoAlpha: 1, x: 0, scale: 1, filter: 'blur(0px)',
      duration: speed,
      ease: 'power3.out'
    }, 0.3);

    // Before items stagger
    tl.to(beforeItemEls, {
      autoAlpha: 1, x: 0,
      duration: speed * 0.5,
      stagger: 0.08,
      ease: 'power2.out'
    }, 0.3 + speed * 0.4);

    // Divider
    tl.to(divider, {
      autoAlpha: 1, scale: 1,
      duration: speed * 0.4,
      ease: 'power2.out'
    }, 0.3 + speed * 0.6);

    // After panel wipe in
    tl.to(panelAfter, {
      autoAlpha: 1, x: 0, scale: 1, filter: 'blur(0px)',
      duration: speed,
      ease: 'power3.out'
    }, 0.3 + speed * 0.7);

    // After items stagger
    tl.to(afterItemEls, {
      autoAlpha: 1, x: 0,
      duration: speed * 0.5,
      stagger: 0.08,
      ease: 'power2.out'
    }, 0.3 + speed * 1.1);

    // Exit
    if (ctx.duration > 2) {
      var exitAt = ctx.duration - 0.6;
      tl.to([panelBefore, divider, panelAfter], {
        autoAlpha: 0, y: -15,
        duration: 0.4,
        stagger: 0.05,
        ease: 'power2.in'
      }, exitAt);
    }

    return tl;
  }
</script>
