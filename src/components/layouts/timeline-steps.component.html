<script>
  function createTimeline(el, data, ctx) {
    var tl = gsap.timeline();
    var container = el.querySelector('.timeline-container');
    var steps = data.steps || [];
    var direction = data.direction || 'horizontal';
    var isVertical = direction === 'vertical';

    if (isVertical) container.classList.add('vertical');

    // Build steps
    var stepEls = [];
    var dotEls = [];
    var connectorFills = [];
    var pulseEls = [];

    for (var i = 0; i < steps.length; i++) {
      var step = steps[i];
      var status = step.status || 'pending';

      var stepEl = document.createElement('div');
      stepEl.className = 'timeline-step';

      var dotWrap = document.createElement('div');
      dotWrap.className = 'step-dot-wrap';

      var dot = document.createElement('div');
      dot.className = 'step-dot ' + status;
      if (status === 'complete') {
        dot.innerHTML = '<span class="step-check">✓</span>';
      } else {
        dot.textContent = (i + 1).toString();
      }
      dotWrap.appendChild(dot);
      dotEls.push(dot);

      // Pulse ring for active
      if (status === 'active') {
        var pulse = document.createElement('div');
        pulse.className = 'step-pulse';
        dotWrap.appendChild(pulse);
        pulseEls.push(pulse);
      }

      stepEl.appendChild(dotWrap);

      // Connector line (except last)
      if (i < steps.length - 1) {
        var connector = document.createElement('div');
        connector.className = 'step-connector';
        var fill = document.createElement('div');
        fill.className = 'step-connector-fill';
        connector.appendChild(fill);
        stepEl.appendChild(connector);
        connectorFills.push({ fill: fill, shouldFill: status === 'complete' });
      }

      // Label
      var label = document.createElement('div');
      label.className = 'step-label';
      var title = document.createElement('div');
      title.className = 'step-title' + (status === 'pending' ? ' pending-text' : '');
      title.textContent = step.title || '';
      label.appendChild(title);

      if (step.description) {
        var desc = document.createElement('div');
        desc.className = 'step-description';
        desc.textContent = step.description;
        label.appendChild(desc);
      }

      stepEl.appendChild(label);
      container.appendChild(stepEl);
      stepEls.push(stepEl);
    }

    // Initial states
    gsap.set(stepEls, { autoAlpha: 0, y: isVertical ? 20 : 25, scale: 0.95 });

    var speed = ctx.motion === 'minimal' ? 0.3 : ctx.motion === 'punchy' ? 0.45 : 0.6;
    var stagger = ctx.motion === 'minimal' ? 0.1 : 0.18;

    // Steps entrance
    tl.to(stepEls, {
      autoAlpha: 1, y: 0, scale: 1,
      duration: speed,
      stagger: stagger,
      ease: 'power3.out'
    }, 0.4);

    // Animate connector fills
    for (var c = 0; c < connectorFills.length; c++) {
      if (connectorFills[c].shouldFill) {
        var prop = isVertical ? 'height' : 'width';
        var animObj = {};
        animObj[prop] = '100%';
        animObj.duration = speed * 0.6;
        animObj.ease = 'power2.inOut';
        tl.to(connectorFills[c].fill, animObj, 0.4 + (c + 1) * stagger);
      }
    }

    // Pulse animation for active dots
    for (var p = 0; p < pulseEls.length; p++) {
      tl.to(pulseEls[p], {
        opacity: 0.6, scale: 1.6,
        duration: 0.8,
        ease: 'power2.out',
        yoyo: true,
        repeat: -1
      }, 0.4 + stagger * 2);
    }

    // Exit
    if (ctx.duration > 2) {
      var exitAt = ctx.duration - 0.5;
      tl.to(stepEls, {
        autoAlpha: 0, y: -15,
        duration: 0.4,
        stagger: 0.04,
        ease: 'power2.in'
      }, exitAt);
    }

    return tl;
  }
</script>
