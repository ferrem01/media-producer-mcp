<template>
  <div class="pip-layout">
    <div class="pip-main">
      <div class="pip-main-content"></div>
    </div>
    <div class="pip-overlay">
      <div class="pip-overlay-content"></div>
    </div>
  </div>
</template>

<style scoped>
  .pip-layout {
    position: relative;
    width: 100%;
    height: 100%;
    overflow: hidden;
    font-family: var(--mp-font-family, 'Inter', sans-serif);

  }

    font-size: 18px;
    font-weight: 500;
    color: var(--mp-color-text, #ffffff);
    text-align: center;

    line-height: 1.3;
  }

  .pip-overlay-content:empty { display: none; }
</style>

<script>
  function createTimeline(el, data, ctx) {
    var tl = gsap.timeline();
    var main = el.querySelector('.pip-main');
    var mainContent = el.querySelector('.pip-main-content');
    var overlay = el.querySelector('.pip-overlay');
    var overlayContent = el.querySelector('.pip-overlay-content');

    // Inject content (supports HTML)
    if (data.main_content) mainContent.innerHTML = data.main_content;
    if (data.pip_content) overlayContent.innerHTML = data.pip_content;

    var position = data.pip_position || 'bottom-right';
    var size = data.pip_size || 30;

    // Size the overlay
    overlay.style.width = size + '%';
    overlay.style.height = size + '%';

    // Position the overlay
    var margin = '20px';
    var parts = position.split('-');
    overlay.style[parts[0]] = margin; // top or bottom
    overlay.style[parts[1]] = margin; // left or right

    // Determine slide direction for overlay entrance
    var slideX = parts[1] === 'right' ? 120 : -120;
    var slideY = parts[0] === 'bottom' ? 60 : -60;

    var speed = ctx.motion === 'minimal' ? 0.4 : ctx.motion === 'punchy' ? 0.5 : 0.7;
    var ease = ctx.motion === 'punchy' ? 'back.out(1.3)' : 'power3.out';

    // Main content entrance
    gsap.set(mainContent, { autoAlpha: 0, y: 20 });
    tl.to(mainContent, {
      autoAlpha: 1, y: 0, duration: speed, ease: 'power3.out'
    }, 0.2);

    // PiP slides in from corner
    gsap.set(overlay, { autoAlpha: 0, x: slideX, y: slideY, scale: 0.8 });
    tl.to(overlay, {
      autoAlpha: 1, x: 0, y: 0, scale: 1,
      duration: speed, ease: ease
    }, 0.5 + speed * 0.3);

    // Exit
    if (ctx.duration > 2) {
      var exitAt = ctx.duration - 0.7;
      tl.to(overlay, {
        autoAlpha: 0, x: slideX * 0.5, duration: 0.4, ease: 'power2.in'
      }, exitAt);
      tl.to(mainContent, {
        autoAlpha: 0, duration: 0.4, ease: 'power2.in'
      }, exitAt + 0.1);
    }

    return tl;
  }
</script>
