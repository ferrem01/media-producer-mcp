      <div class="pip-accent-line"></div>
      <div class="pip-overlay-content"></div>
    </div>
  </div>
</template>

<style scoped>

</style>

<script>
  function createTimeline(el, data, ctx) {
    var tl = gsap.timeline();
    var mainContent = el.querySelector('.pip-main-content');
    var overlay = el.querySelector('.pip-overlay');
    var overlayContent = el.querySelector('.pip-overlay-content');
    var accentLine = el.querySelector('.pip-accent-line');

    // Inject content
    if (data.main_content) mainContent.innerHTML = data.main_content;
    if (data.pip_content) overlayContent.innerHTML = data.pip_content;

    var position = data.pip_position || 'bottom-right';
    var size = data.pip_size || 30;

    // Size the overlay
    overlay.style.width = size + '%';
    overlay.style.height = size + '%';

    // Position the overlay
    var margin = '24px';
    var parts = position.split('-');
    overlay.style[parts[0]] = margin;
    overlay.style[parts[1]] = margin;

    var slideX = parts[1] === 'right' ? 120 : -120;
    var slideY = parts[0] === 'bottom' ? 60 : -60;

    var speed = ctx.motion === 'minimal' ? 0.4 : ctx.motion === 'punchy' ? 0.55 : 0.7;
    var ease = ctx.motion === 'punchy' ? 'back.out(1.3)' : 'power3.out';

    // Main content entrance with scale + blur
    gsap.set(mainContent, { autoAlpha: 0, y: 25, scale: 1.06, filter: 'blur(5px)' });
    tl.to(mainContent, {
      autoAlpha: 1, y: 0, scale: 1, filter: 'blur(0px)',
      duration: speed, ease: 'power3.out'
    }, 0.2);

    // PiP slides in from corner with scale + blur
    gsap.set(overlay, { autoAlpha: 0, x: slideX, y: slideY, scale: 0.75, filter: 'blur(6px)' });
    gsap.set(accentLine, { scaleX: 0 });

    tl.to(overlay, {
      autoAlpha: 1, x: 0, y: 0, scale: 1, filter: 'blur(0px)',
      duration: speed, ease: ease
    }, 0.4 + speed * 0.3);

    // Accent line wipes in
    tl.to(accentLine, {
      scaleX: 1,
      duration: 0.4,
      ease: 'power2.inOut'
    }, 0.4 + speed * 0.6);

    // Subtle glow pulse on overlay
    tl.to(overlay, {
      boxShadow: '0 25px 60px rgba(0, 0, 0, 0.5), 0 0 0 1px rgba(255, 255, 255, 0.05), 0 0 50px rgba(167, 139, 250, 0.07)',
      duration: 0.5,
      ease: 'power2.out'
    }, 0.4 + speed * 0.8);

    tl.to(overlay, {
      boxShadow: '0 25px 60px rgba(0, 0, 0, 0.5), 0 0 0 1px rgba(255, 255, 255, 0.05), 0 0 40px rgba(167, 139, 250, 0.04)',
      duration: 0.4,
      ease: 'power2.inOut'
    }, 0.4 + speed * 0.8 + 0.5);

    // Exit
    if (ctx.duration > 2) {
      var exitAt = ctx.duration - 0.7;
      tl.to(overlay, {
        autoAlpha: 0, x: slideX * 0.4, scale: 0.9,
        duration: 0.4, ease: 'power2.in'
      }, exitAt);
      tl.to(mainContent, {
        autoAlpha: 0, duration: 0.4, ease: 'power2.in'
      }, exitAt + 0.05);
    }

    return tl;
  }
</script>
