<script>
  function createTimeline(el, data, ctx) {
    var tl = gsap.timeline();
    var shell = el.querySelector('.device-shell');
    var screen = el.querySelector('.device-screen');
    var glow = el.querySelector('.device-glow');
    var device = data.device || 'phone';

    shell.classList.add('device-' + device);

    if (data.screenshot_url) {
      screen.style.backgroundImage = 'url(' + data.screenshot_url + ')';
      screen.style.backgroundSize = 'cover';
      screen.style.backgroundPosition = 'top center';
    } else if (data.content_html) {
      screen.innerHTML = data.content_html;
    }

    var speed = ctx.motion === 'minimal' ? 0.5 : ctx.motion === 'punchy' ? 0.65 : 0.9;
    var ease = ctx.motion === 'punchy' ? 'back.out(1.3)' : 'power3.out';

    // Dramatic 3D entrance with scale + blur
    gsap.set(shell, {
      autoAlpha: 0,
      y: 60,
      rotateX: 12,
      rotateY: -6,
      scale: 0.88,
      filter: 'blur(8px)'
    });
    gsap.set(screen, { autoAlpha: 0 });
    gsap.set(glow, { autoAlpha: 0, scale: 0.4 });

    // Ambient glow appears first
    tl.to(glow, {
      autoAlpha: 1, scale: 1,
      duration: speed * 0.8,
      ease: 'power2.out'
    }, 0.1);

    // Device floats in with 3D rotation
    tl.to(shell, {
      autoAlpha: 1, y: 0, rotateX: 0, rotateY: 0, scale: 1, filter: 'blur(0px)',
      duration: speed, ease: ease
    }, 0.3);

    // Screen content appears
    tl.to(screen, {
      autoAlpha: 1, duration: 0.5, ease: 'power2.out'
    }, 0.3 + speed * 0.5);

    // Subtle shadow glow pulse
    tl.to(shell, {
      boxShadow: '0 30px 80px rgba(0, 0, 0, 0.5), 0 0 0 1px rgba(255, 255, 255, 0.06), inset 0 1px 0 rgba(255, 255, 255, 0.08), 0 0 80px rgba(167, 139, 250, 0.08)',
      duration: 0.6,
      ease: 'power2.out'
    }, 0.3 + speed * 0.7);

    tl.to(shell, {
      boxShadow: '0 30px 80px rgba(0, 0, 0, 0.5), 0 0 0 1px rgba(255, 255, 255, 0.06), inset 0 1px 0 rgba(255, 255, 255, 0.08), 0 0 60px rgba(167, 139, 250, 0.04)',
      duration: 0.5,
      ease: 'power2.inOut'
    }, 0.3 + speed * 0.7 + 0.6);

    // Exit
    if (ctx.duration > 2) {
      var exitAt = ctx.duration - 0.7;
      tl.to(shell, {
        autoAlpha: 0, y: -25, scale: 0.96,
        duration: 0.5, ease: 'power2.in'
      }, exitAt);
      tl.to(glow, {
        autoAlpha: 0,
        duration: 0.4, ease: 'power2.in'
      }, exitAt);
    }

    return tl;
  }
</script>
