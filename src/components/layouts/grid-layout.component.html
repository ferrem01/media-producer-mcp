<template>
  <div class="grid-layout">
    <div class="grid-container"></div>
  </div>
</template>

<style scoped>

  .grid-card {
    background: rgba(255, 255, 255, 0.04);

    gap: 16px;
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    box-shadow:
      inset 0 1px 0 rgba(255, 255, 255, 0.04),
      0 4px 6px rgba(0, 0, 0, 0.1),

    position: relative;

  }

  .grid-card::before {
    content: '';

  .card-icon-wrap {
    width: 52px;

    font-size: 14px;

    letter-spacing: 0.005em;
  }
</style>

<script>
  function createTimeline(el, data, ctx) {
    var tl = gsap.timeline();
    var container = el.querySelector('.grid-container');
    var items = data.items || [];
    var columns = data.columns || 3;

    // Limit items
    if (items.length > 9) items = items.slice(0, 9);

    container.style.gridTemplateColumns = 'repeat(' + Math.min(columns, items.length) + ', 1fr)';

    // Build cards
    for (var i = 0; i < items.length; i++) {
      var item = items[i];
      var card = document.createElement('div');
      card.className = 'grid-card';

      if (item.icon) {
        var iconWrap = document.createElement('div');
        iconWrap.className = 'card-icon-wrap';
        iconWrap.textContent = item.icon;
        card.appendChild(iconWrap);
      }

      var title = document.createElement('div');
      title.className = 'card-title';
      title.textContent = item.title || '';
      card.appendChild(title);

      if (item.description) {
        var desc = document.createElement('div');
        desc.className = 'card-description';
        desc.textContent = item.description;
        card.appendChild(desc);
      }

      container.appendChild(card);
    }

    var cards = container.querySelectorAll('.grid-card');

    // Initial states
    gsap.set(cards, {
      autoAlpha: 0,
      y: 35,
      scale: 0.94
    });

    var speed = ctx.motion === 'minimal' ? 0.3 : ctx.motion === 'punchy' ? 0.4 : 0.6;
    var stagger = ctx.motion === 'minimal' ? 0.06 : ctx.motion === 'punchy' ? 0.08 : 0.12;

    // Stagger entrance
    tl.to(cards, {
      autoAlpha: 1, y: 0, scale: 1,
      duration: speed,
      stagger: {
        each: stagger,
        from: 'start'
      },
      ease: ctx.motion === 'punchy' ? 'back.out(1.2)' : 'power3.out'
    }, 0.4);

    // Elevated glow state after entrance
    tl.to(cards, {
      boxShadow: 'inset 0 1px 0 rgba(255, 255, 255, 0.06), 0 0 30px rgba(167, 139, 250, 0.06), 0 8px 32px rgba(0, 0, 0, 0.25), 0 20px 50px rgba(0, 0, 0, 0.15)',
      duration: 0.5,
      stagger: stagger * 0.5
    }, '-=0.2');

    // Exit
    if (ctx.duration > 2) {
      var exitAt = ctx.duration - 0.7;
      tl.to(cards, {
        autoAlpha: 0, scale: 0.97, y: -10,
        duration: 0.35,
        stagger: 0.03,
        ease: 'power2.in'
      }, exitAt);
    }

    return tl;
  }
</script>
