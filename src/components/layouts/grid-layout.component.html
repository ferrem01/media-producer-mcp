<template>
  <div class="grid-layout"></div>
</template>

<style scoped>
  .grid-layout {
    display: grid;
    gap: 24px;
    width: 100%;
    height: 100%;
    padding: 48px;
    box-sizing: border-box;
    align-content: center;
    font-family: var(--mp-font-family, 'Inter', sans-serif);
  }

  .grid-item {
    background: var(--mp-color-surface, #1e293b);
    border-radius: var(--mp-border-radius, 16px);
    padding: 32px;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    gap: 12px;
  }

  .grid-item-icon {
    font-size: 36px;
    line-height: 1;
  }

  .grid-item-title {
    font-size: 20px;
    font-weight: 700;
    color: var(--mp-color-text, #ffffff);
    margin: 0;
    line-height: 1.2;
  }

  .grid-item-desc {
    font-size: 14px;
    color: var(--mp-color-text-muted, #94a3b8);
    margin: 0;
    line-height: 1.4;
  }
</style>

<script>
  function createTimeline(el, data, ctx) {
    var tl = gsap.timeline();
    var grid = el.querySelector('.grid-layout');
    var items = data.items || [];
    var columns = data.columns || 3;

    grid.style.gridTemplateColumns = 'repeat(' + columns + ', 1fr)';

    for (var i = 0; i < items.length; i++) {
      var item = document.createElement('div');
      item.className = 'grid-item';

      if (items[i].icon) {
        var icon = document.createElement('div');
        icon.className = 'grid-item-icon';
        icon.textContent = items[i].icon;
        item.appendChild(icon);
      }

      var title = document.createElement('div');
      title.className = 'grid-item-title';
      title.textContent = items[i].title || '';
      item.appendChild(title);

      if (items[i].description) {
        var desc = document.createElement('div');
        desc.className = 'grid-item-desc';
        desc.textContent = items[i].description;
        item.appendChild(desc);
      }

      grid.appendChild(item);
    }

    var itemEls = grid.querySelectorAll('.grid-item');
    var speed = ctx.motion === 'minimal' ? 0.3 : ctx.motion === 'punchy' ? 0.4 : 0.6;
    var stagger = ctx.motion === 'minimal' ? 0.06 : ctx.motion === 'punchy' ? 0.08 : 0.1;

    gsap.set(itemEls, { autoAlpha: 0, y: 30 });

    tl.to(itemEls, {
      autoAlpha: 1,
      y: 0,
      duration: speed,
      stagger: stagger,
      ease: 'power3.out'
    }, 0.3);

    if (ctx.duration > 2) {
      var exitAt = ctx.duration - 0.7;
      tl.to(itemEls, {
        autoAlpha: 0,
        y: -15,
        duration: 0.4,
        stagger: 0.03,
        ease: 'power2.in'
      }, exitAt);
    }

    return tl;
  }
</script>
