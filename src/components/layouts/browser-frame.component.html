<script>
  function createTimeline(el, data, ctx) {
    var tl = gsap.timeline();
    var frame = el.querySelector('.browser-frame');
    var viewport = el.querySelector('.browser-viewport');

    if (data.screenshot_url) {
      viewport.style.backgroundImage = 'url(' + data.screenshot_url + ')';
      viewport.style.backgroundSize = 'cover';
      viewport.style.backgroundPosition = 'top center';
    }

    var speed = ctx.motion === 'minimal' ? 0.5 : ctx.motion === 'punchy' ? 0.6 : 0.8;
    var ease = ctx.motion === 'punchy' ? 'back.out(1.3)' : 'power3.out';

    gsap.set(frame, { autoAlpha: 0, scale: 0.88, y: 30 });
    gsap.set(viewport.children, { autoAlpha: 0 });

    // Frame scales up
    tl.to(frame, {
      autoAlpha: 1, scale: 1, y: 0,
      duration: speed, ease: ease
    }, 0.3);

    // Content fades in
    tl.to(viewport.children, {
      autoAlpha: 1, duration: 0.4, stagger: 0.1, ease: 'power2.out'
    }, 0.3 + speed * 0.7);

    if (ctx.duration > 2) {
      var exitAt = ctx.duration - 0.7;
      tl.to(frame, {
        autoAlpha: 0, scale: 0.95, duration: 0.5, ease: 'power2.in'
      }, exitAt);
    }

    return tl;
  }
</script>
