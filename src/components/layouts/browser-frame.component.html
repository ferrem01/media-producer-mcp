<script>
  function createTimeline(el, data, ctx) {
    var tl = gsap.timeline();
    var frame = el.querySelector('.browser-frame');
    var viewport = el.querySelector('.browser-viewport');
    var content = el.querySelector('.browser-content');
    var urlText = el.querySelector('.url-text');

    // Set URL
    if (data.url) urlText.textContent = data.url;

    // Set content: video_url > content_html > screenshot_url
    if (data.video_url) {
      var video = document.createElement('video');
      video.src = data.video_url;
      video.muted = true;
      video.playsInline = true;
      video.style.cssText = 'width:100%;height:100%;object-fit:cover;display:block';
      // data-start-at tells the scene-worker when this video begins in the timeline
      if (data.video_start_at) video.setAttribute('data-start-at', String(data.video_start_at));
      content.appendChild(video);
    } else if (data.content_html) {
      content.innerHTML = data.content_html;
    } else if (data.screenshot_url) {
      viewport.style.backgroundImage = 'url(' + data.screenshot_url + ')';
      viewport.style.backgroundSize = 'cover';
      viewport.style.backgroundPosition = 'top center';
    }

    var speed = ctx.motion === 'minimal' ? 0.5 : ctx.motion === 'punchy' ? 0.7 : 1.0;

    // Initial state: small, faded, below
    gsap.set(frame, {
      autoAlpha: 0,
      scale: 0.92,
      y: 40,
      filter: 'blur(4px)'
    });

    // Dramatic entrance
    tl.to(frame, {
      autoAlpha: 1,
      scale: 1,
      y: 0,
      filter: 'blur(0px)',
      duration: speed,
      ease: 'power3.out'
    }, 0.3);

    // Content inside fades in slightly after
    if (content.children.length > 0) {
      gsap.set(content.children, { autoAlpha: 0 });
      tl.to(content.children, {
        autoAlpha: 1,
        duration: 0.5,
        stagger: 0.08,
        ease: 'power2.out'
      }, 0.3 + speed * 0.5);
    }

    // Exit
    if (ctx.duration > 2) {
      var exitAt = ctx.duration - 0.7;
      tl.to(frame, {
        autoAlpha: 0,
        scale: 0.96,
        y: -20,
        duration: 0.5,
        ease: 'power2.in'
      }, exitAt);
    }

    return tl;
  }
</script>
