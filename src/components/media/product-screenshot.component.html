<script>
  function createTimeline(el, data, ctx) {
    var tl = gsap.timeline();
    var frame = el.querySelector('.screenshot-frame');
    var glow = el.querySelector('.glow-ring');
    var lines = el.querySelectorAll('.placeholder-line, .placeholder-block');

    var rotation = data.rotation !== undefined ? data.rotation : -6;
    frame.style.transform = 'rotateY(' + rotation + 'deg)';

    if (data.glow_color) {
      glow.style.background = 'radial-gradient(ellipse at center, ' + data.glow_color + '26 0%, ' + data.glow_color + '0f 40%, transparent 70%)';
    }

    var speed = ctx.motion === 'minimal' ? 0.5 : ctx.motion === 'punchy' ? 0.7 : 1.0;

    // Initial state
    gsap.set(frame, {
      autoAlpha: 0,
      scale: 0.85,
      y: 40,
      filter: 'blur(6px)',
      rotateY: rotation + 10
    });
    gsap.set(glow, { autoAlpha: 0, scale: 0.6 });
    gsap.set(lines, { autoAlpha: 0, x: -20 });

    // Glow appears first
    tl.to(glow, {
      autoAlpha: 1, scale: 1,
      duration: speed * 1.2,
      ease: 'power2.out'
    }, 0.2);

    // Frame entrance
    tl.to(frame, {
      autoAlpha: 1,
      scale: 1,
      y: 0,
      filter: 'blur(0px)',
      rotateY: rotation,
      duration: speed * 1.1,
      ease: 'power3.out'
    }, 0.3);

    // Content lines stagger in
    tl.to(lines, {
      autoAlpha: 1, x: 0,
      duration: 0.4,
      stagger: 0.08,
      ease: 'power2.out'
    }, 0.3 + speed * 0.5);

    // Glow pulse
    tl.to(glow, {
      scale: 1.1,
      duration: 1.5,
      yoyo: true,
      repeat: 1,
      ease: 'sine.inOut'
    }, 0.3 + speed);

    // Exit
    if (ctx.duration > 2) {
      var exitAt = ctx.duration - 0.7;
      tl.to(frame, {
        autoAlpha: 0, scale: 0.95, y: -15,
        duration: 0.5,
        ease: 'power2.in'
      }, exitAt);
      tl.to(glow, {
        autoAlpha: 0,
        duration: 0.4,
        ease: 'power2.in'
      }, exitAt);
    }

    return tl;
  }
</script>
