     never slice through each other. Every style is a pure function of the

    root.setAttribute('data-front-slot', [f4((CX + fs0.x) / W), f4((CY + fs0.y) / H), f4(cw / W), f4(ch / H)].join(','));
    root.setAttribute('data-flash-box', [f4(0.5), f4(0.5), f4(TW / W), f4(TH / H)].join(','));
    root.setAttribute('data-from', f4((FROM.x + CX) / W) + ',' + f4((FROM.y + CY) / H));
    root.setAttribute('data-to', f4((TO.x + CX) / W) + ',' + f4((TO.y + CY) / H));
    root.setAttribute('data-count', String(N));

    // ── Pose helpers.
    var lerp = function (a, b, e) { return a + (b - a) * e; };
    var lerpPose = function (a, b, e) {
      return { x: lerp(a.x, b.x, e), y: lerp(a.y, b.y, e), z: lerp(a.z, b.z, e), rx: lerp(a.rx, b.rx, e), ry: lerp(a.ry, b.ry, e),

    };
    var pointPose = function (p, ref) { return { x: p.x, y: p.y, z: 0, rx: 0, ry: 0, w: ref.w, h: ref.h, s: 0, rad: ref.rad }; };
    // The flash weight of item j at t: 0 in the carousel, 1 full frame.
    var flashOf = function (j, t) {
      for (var k = F - 1; k >= 0; k--) {
        var f = flashes[k];
        if (f.item !== j || t < f.lift) continue;
        var e;
        if (t < f.at) e = out3((t - f.lift) / FIN);
        else if (t < f.leave || (END_MODE === 'full' && k === F - 1)) e = 1;
        else if (t < f.ret) e = 1 - inOut3((t - f.leave) / FOUT);
        else continue;
        return { e: e, k: k, f: f };
      }
      return null;
    };
    var shadow = function (h, f) {
      return '0 ' + (h * 0.03).toFixed(1) + 'px ' + (h * 0.085).toFixed(1) + 'px rgba(18,18,28,' + (0.2 * f).toFixed(3) + '), 0 ' +
        (h * 0.006).toFixed(1) + 'px ' + (h * 0.018).toFixed(1) + 'px rgba(18,18,28,' + (0.12 * f).toFixed(3) + '), 0 0 0 1px rgba(18,18,28,' + (0.06 * f).toFixed(3) + ')';
    };
    var POP = data.flash_pop === true;

    function render(t) {
      var ph = phi(t);
      var keys = [];
      items.forEach(function (it) {
        var base = slotPose(wrapU(it.j - ph), cw, ch);
        base.rad = radOf(cw);
        var pose = base, boost = 0, popA = 0;
        var fl = flashOf(it.j, t);
        if (fl) {

          // Above everything while lifted; hands back to the depth sort as it seats.

          if (POP) {
            var dp = t - fl.f.at;
            popA = dp < -0.06 || dp > 0.24 ? 0 : dp < 0 ? 0.7 * (1 + dp / 0.06) : 0.7 * (1 - out2(dp / 0.24));
          }
        }
        var op = 1;
        if (ENTER === 'point' && t < enterEnd) {
          var t0 = ENTER_AT + enterRank[it.j] * ENTER_SPREAD;
          pose = lerpPose(pointPose(FROM, pose), pose, out3((t - t0) / ENTER_D));
        } else if (ENTER === 'fade' && t < enterEnd) {
          var t1 = ENTER_AT + enterRank[it.j] * ENTER_SPREAD, ef = out2((t - t1) / ENTER_D);
          op = ef; pose.y += (1 - ef) * H * 0.04;
        }
        if (END_MODE === 'collapse' && t >= END_AT) {
          var t2 = END_AT + colRank[it.j] * COL_SPREAD;
          var ec = t < t2 ? 0 : inOut3((t - t2) / COL_D) * 0.25 + in3((t - t2) / COL_D) * 0.75;
          if ((t - t2) >= COL_D) ec = 1;

          pose.rx.toFixed(3) + 'deg) rotateY(' + pose.ry.toFixed(3) + 'deg) scale(' + pose.s.toFixed(4) + ')';
        it.fog.style.opacity = FOG > 0 ? (FOG * clamp01(-pose.z / DFOG)).toFixed(3) : '0';

      flashes.forEach(function (f, k) {

        if (t < a0 || (!stays && t >= a1 + 0.18)) { f.label.style.visibility = 'hidden'; return; }
        var yIn = (t < a1 || stays) ? 1 - out3((t - a0) / 0.32) : in3((t - a1) / 0.18);
        f.label.style.visibility = 'inherit';
        var lh = f.label.offsetHeight || LFS * 2.24;
        f.label.style.transform = 'translate(' + labL.toFixed(2) + 'px,' + (labB - lh).toFixed(2) + 'px)';
        f.labelSpan.style.transform = 'translateY(' + (yIn * 105).toFixed(2) + '%)';
      });
    }

    var END = Math.max(num(ctx && ctx.duration, 0), SETTLE + 0.5);
    var st0 = { t: 0 };
    tl.to(st0, { t: END, duration: END, ease: 'none' }, 0);
    tl.eventCallback('onUpdate', function () { render(st0.t); });
    render(0);
    return tl;
  }
