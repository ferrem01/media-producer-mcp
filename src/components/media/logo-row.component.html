<template>
  <div class="logo-row">
    <h2 class="logo-row-title">{{title}}</h2>
    <div class="logo-row-logos"></div>
  </div>
</template>

<style scoped>
  .logo-row {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100%;
    width: 100%;
    font-family: var(--mp-font-family, 'Inter', system-ui, -apple-system, sans-serif);
    padding: 80px;
    gap: 48px;
  }

  .logo-row-title {
    font-size: 13px;
    font-weight: 600;
    color: #94a3b8;
    text-align: center;
    text-transform: uppercase;
    letter-spacing: 0.12em;
  }

  .logo-row-title:empty {
    display: none;
  }

  .logo-row-logos {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 24px;
    flex-wrap: wrap;
  }

  .logo-item {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
    background: rgba(255, 255, 255, 0.03);
    border: 1px solid rgba(255, 255, 255, 0.06);
    border-radius: 16px;
    padding: 20px 28px;
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    box-shadow:
      0 4px 16px rgba(0, 0, 0, 0.15),
      0 0 0 1px rgba(255, 255, 255, 0.03);
  }

  .logo-item img {
    object-fit: contain;
  }

  .logo-item-label {
    font-size: 14px;
    font-weight: 500;
    color: #94a3b8;
    letter-spacing: 0.005em;
  }
</style>

<script>
  function createTimeline(el, data, ctx) {
    var tl = gsap.timeline();
    var LOGO_TOKEN = 'pk_B_cdrQLyTkSFPzSMm52goQ';

    var domains = data.domains || [];
    var size = data.size || 64;
    var theme = data.theme || 'dark';
    var greyscale = data.greyscale !== undefined ? data.greyscale : false;
    var showLabels = data.show_labels !== undefined ? data.show_labels : false;

    var container = el.querySelector('.logo-row-logos');
    var title = el.querySelector('.logo-row-title');

    for (var i = 0; i < domains.length; i++) {
      var d = typeof domains[i] === 'string' ? { domain: domains[i] } : domains[i];
      var domain = d.domain || 'example.com';
      var label = d.label || '';

      var logoUrl = 'https://img.logo.dev/' + domain
        + '?token=' + LOGO_TOKEN
        + '&format=png'
        + '&size=' + (size * 2);
      if (greyscale) logoUrl += '&greyscale=true';
      if (theme !== 'auto') logoUrl += '&theme=' + theme;

      var item = document.createElement('div');
      item.className = 'logo-item';

      var img = document.createElement('img');
      img.src = logoUrl;
      img.style.width = size + 'px';
      img.style.height = size + 'px';
      img.alt = domain;
      item.appendChild(img);

      if (showLabels && label) {
        var lbl = document.createElement('span');
        lbl.className = 'logo-item-label';
        lbl.textContent = label;
        item.appendChild(lbl);
      }

      container.appendChild(item);
    }

    var items = container.querySelectorAll('.logo-item');
    var speed = ctx.motion === 'minimal' ? 0.35 : ctx.motion === 'punchy' ? 0.45 : 0.55;
    var stagger = ctx.motion === 'minimal' ? 0.08 : ctx.motion === 'punchy' ? 0.1 : 0.14;

    // Title entrance
    if (title && title.textContent.trim()) {
      gsap.set(title, { autoAlpha: 0, y: 15 });
      tl.to(title, {
        autoAlpha: 1, y: 0,
        duration: speed * 0.7,
        ease: 'power3.out'
      }, 0.3);
    }

    // Items: scale + blur entrance
    gsap.set(items, { autoAlpha: 0, y: 20, scale: 1.08, filter: 'blur(5px)' });

    tl.to(items, {
      autoAlpha: 1, y: 0, scale: 1, filter: 'blur(0px)',
      duration: speed,
      stagger: stagger,
      ease: ctx.motion === 'punchy' ? 'back.out(1.2)' : 'power3.out'
    }, title && title.textContent.trim() ? 0.5 : 0.3);

    // Subtle glow
    tl.to(items, {
      boxShadow: '0 0 20px rgba(167, 139, 250, 0.05), 0 4px 16px rgba(0, 0, 0, 0.15), 0 0 0 1px rgba(255, 255, 255, 0.04)',
      duration: 0.3,
      stagger: stagger * 0.5
    }, '-=0.2');

    // Exit
    if (ctx.duration > 2) {
      var exitAt = ctx.duration - 0.6;
      var exitEls = [];
      if (title && title.textContent.trim()) exitEls.push(title);
      for (var j = 0; j < items.length; j++) exitEls.push(items[j]);
      tl.to(exitEls, {
        autoAlpha: 0,
        duration: 0.35,
        stagger: 0.03,
        ease: 'power2.in'
      }, exitAt);
    }

    return tl;
  }
</script>
