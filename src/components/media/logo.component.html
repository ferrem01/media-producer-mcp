<template>
  <div class="logo-display">
    <div class="logo-img-wrap">
      <img class="logo-img" src="" alt="{{domain}}" />
    </div>
    <span class="logo-label">{{label}}</span>
  </div>
</template>

<style scoped>
  .logo-display {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100%;
    width: 100%;
    font-family: var(--mp-font-family, 'Inter', sans-serif);
    gap: 24px;
  }

  .logo-img-wrap {
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .logo-img {
    object-fit: contain;
  }

  .logo-label {
    font-size: 24px;
    font-weight: 500;
    color: var(--mp-color-text-muted, #94a3b8);
    text-align: center;
  }

  .logo-label:empty {
    display: none;
  }
</style>

<script>
  function createTimeline(el, data, ctx) {
    var tl = gsap.timeline();
    var LOGO_TOKEN = 'pk_B_cdrQLyTkSFPzSMm52goQ';

    var domain = data.domain || 'example.com';
    var size = data.size || 128;
    var format = data.format || 'png';
    var greyscale = data.greyscale || false;
    var theme = data.theme || 'dark';

    // Build logo.dev URL
    var logoUrl = 'https://img.logo.dev/' + domain
      + '?token=' + LOGO_TOKEN
      + '&format=' + format
      + '&size=' + (size * 2); // request 2x for retina
    if (greyscale) logoUrl += '&greyscale=true';
    if (theme && theme !== 'auto') logoUrl += '&theme=' + theme;

    var img = el.querySelector('.logo-img');
    img.src = logoUrl;
    img.style.width = size + 'px';
    img.style.height = size + 'px';

    var wrap = el.querySelector('.logo-img-wrap');
    var label = el.querySelector('.logo-label');

    // Start invisible
    gsap.set([wrap, label], { autoAlpha: 0 });
    gsap.set(wrap, { scale: 0.8 });

    // Determine speed from motion style
    var speed = ctx.motion === 'minimal' ? 0.4 : ctx.motion === 'punchy' ? 0.5 : 0.7;

    // Entrance
    tl.to(wrap, {
      autoAlpha: 1,
      scale: 1,
      duration: speed,
      ease: ctx.motion === 'punchy' ? 'back.out(1.4)' : 'power3.out'
    }, 0.3);

    if (label && label.textContent.trim()) {
      tl.to(label, {
        autoAlpha: 1,
        duration: 0.4,
        ease: 'power2.out'
      }, '-=0.2');
    }

    // Exit
    if (ctx.duration > 2) {
      var exitAt = ctx.duration - 0.6;
      tl.to([wrap, label], {
        autoAlpha: 0,
        scale: 0.95,
        duration: 0.4,
        ease: 'power2.in'
      }, exitAt);
    }

    return tl;
  }
</script>
