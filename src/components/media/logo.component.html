<template>
  <div class="logo-display">
    <div class="logo-img-wrap">
      <img class="logo-img" src="" alt="{{domain}}" />
    </div>
    <span class="logo-label">{{label}}</span>
  </div>
</template>

<style scoped>
  /* Layout-neutral building block: sizes to its own content so it composes
     cleanly inside a flex row or grid. Add data.prominent for the full-frame
     hero treatment (single centered logo with a dramatic reveal). */
  .logo-display {
    display: inline-flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 12px;
    font-family: var(--mp-font-family, 'Inter', system-ui, -apple-system, sans-serif);
  }

  .logo-display.prominent {
    display: flex;
    width: 100%;
    height: 100%;
    gap: 28px;
    padding: 80px;
    box-sizing: border-box;
  }

  .logo-img-wrap {
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .logo-img {
    object-fit: contain;
    display: block;
  }

  .logo-label {
    font-size: 18px;
    font-weight: 400;
    color: var(--mp-color-text-muted, #cbd5e1);
    text-align: center;
    letter-spacing: 0.005em;
  }

  .logo-label:empty {
    display: none;
  }
</style>

<script>
  function createTimeline(el, data, ctx) {
    var tl = gsap.timeline();
    // Token is injected per-render by the assembler (window.__MP_LOGODEV_TOKEN,
    // from MP_LOGODEV_TOKEN). Fall back to the bundled publishable key.
    var LOGO_TOKEN = (typeof window !== 'undefined' && window.__MP_LOGODEV_TOKEN) || 'pk_B_cdrQLyTkSFPzSMm52goQ';

    var domain = (data.domain || 'example.com').replace(/^https?:\/\//, '').replace(/\/.*$/, '');
    var size = data.size || 128;
    var format = data.format || 'png';            // png | jpg | webp
    var theme = data.theme || 'dark';             // dark | light | auto
    var greyscale = data.greyscale || false;
    // fallback=monogram makes logo.dev return a generated monogram instead of a
    // 404 when a domain has no logo -- avoids broken images in B2B logo walls.
    var fallback = data.fallback || 'monogram';   // monogram | 404
    var retina = data.retina !== false;           // request 2x by default for crispness

    var params = [
      'token=' + encodeURIComponent(LOGO_TOKEN),
      'format=' + format,
      'size=' + (retina ? size * 2 : size)
    ];
    if (greyscale) params.push('greyscale=true');
    if (theme && theme !== 'auto') params.push('theme=' + theme);
    if (fallback) params.push('fallback=' + fallback);
    var logoUrl = 'https://img.logo.dev/' + encodeURIComponent(domain) + '?' + params.join('&');

    var root = el.querySelector('.logo-display');
    var img = el.querySelector('.logo-img');
    var wrap = el.querySelector('.logo-img-wrap');
    var label = el.querySelector('.logo-label');
    var prominent = !!data.prominent;
    if (prominent && root) root.classList.add('prominent');

    img.style.width = size + 'px';
    img.style.height = size + 'px';
    // Graceful degradation: if even the fallback fails to load (network/hard
    // 404), hide the broken image rather than render a torn icon.
    img.onerror = function () { img.style.visibility = 'hidden'; };
    img.src = logoUrl;

    var speed = ctx.motion === 'minimal' ? 0.4 : ctx.motion === 'punchy' ? 0.55 : 0.7;

    if (prominent) {
      // Dramatic hero reveal (single centered logo).
      gsap.set(wrap, { autoAlpha: 0, scale: 1.1, filter: 'blur(6px)' });
      gsap.set(label, { autoAlpha: 0, y: 12 });
      tl.to(wrap, { autoAlpha: 1, scale: 1, filter: 'blur(0px)', duration: speed, ease: ctx.motion === 'punchy' ? 'back.out(1.3)' : 'power3.out' }, 0.3);
      tl.fromTo(wrap,
        { filter: 'blur(0px) drop-shadow(0 0 0px rgba(167, 139, 250, 0))' },
        { filter: 'blur(0px) drop-shadow(0 0 30px rgba(167, 139, 250, 0.25))', duration: 0.5, ease: 'power2.out' },
        0.3 + speed * 0.5);
      tl.to(wrap, { filter: 'blur(0px) drop-shadow(0 0 12px rgba(167, 139, 250, 0.1))', duration: 0.4, ease: 'power2.inOut' }, 0.3 + speed * 0.5 + 0.5);
      if (label && label.textContent.trim()) {
        tl.to(label, { autoAlpha: 1, y: 0, duration: 0.4, ease: 'power2.out' }, 0.3 + speed * 0.6);
      }
      if (ctx.duration > 2) {
        tl.to([wrap, label], { autoAlpha: 0, scale: 0.95, duration: 0.4, ease: 'power2.in' }, ctx.duration - 0.6);
      }
    } else {
      // Light composable reveal -- fades/lifts in, good when staggered in a
      // row or grid (the container/codegen sets the per-item stagger).
      gsap.set([wrap, label], { autoAlpha: 0, y: 10, scale: 0.94 });
      tl.to([wrap, label], { autoAlpha: 1, y: 0, scale: 1, duration: Math.min(0.5, speed), ease: 'power2.out' }, 0);
    }

    return tl;
  }
</script>
