<script>
  function createTimeline(el, data, ctx) {
    var tl = gsap.timeline();
    var card = el.querySelector('.app-card');
    var icon = el.querySelector('.app-icon');
    var nameEl = el.querySelector('.app-name');
    var devEl = el.querySelector('.app-developer');
    var starsEl = el.querySelector('.app-stars');
    var catEl = el.querySelector('.app-category');
    var btn = el.querySelector('.get-button');

    // Set data
    if (data.name) nameEl.textContent = data.name;
    if (data.developer) devEl.textContent = data.developer;
    if (data.category) catEl.textContent = data.category;

    // Icon color
    if (data.icon_color) {
      icon.style.background = 'linear-gradient(135deg, ' + data.icon_color + ' 0%, ' + data.icon_color + 'cc 100%)';
    }

    // Stars
    var rating = data.rating || 4.5;
    var fullStars = Math.floor(rating);
    var starStr = '';
    for (var i = 0; i < 5; i++) {
      starStr += i < fullStars ? '★' : (i < Math.ceil(rating) ? '★' : '☆');
    }
    starsEl.textContent = starStr;

    var speed = ctx.motion === 'minimal' ? 0.4 : ctx.motion === 'punchy' ? 0.6 : 0.8;

    // Initial state
    gsap.set(card, { autoAlpha: 0, scale: 0.88, y: 30, filter: 'blur(4px)' });

    // Entrance with bounce
    tl.to(card, {
      autoAlpha: 1, scale: 1, y: 0, filter: 'blur(0px)',
      duration: speed,
      ease: 'back.out(1.4)'
    }, 0.3);

    // Subtle shadow glow after entrance
    tl.to(card, {
      boxShadow: '0 24px 80px rgba(0, 0, 0, 0.4), 0 0 40px rgba(167, 139, 250, 0.08)',
      duration: 0.5,
      ease: 'power2.out'
    }, 0.3 + speed * 0.6);

    // Button pulse
    tl.to(btn, {
      boxShadow: '0 0 20px rgba(167, 139, 250, 0.3)',
      duration: 0.6,
      yoyo: true,
      repeat: 1,
      ease: 'sine.inOut'
    }, 0.3 + speed);

    // Exit
    if (ctx.duration > 2) {
      var exitAt = ctx.duration - 0.6;
      tl.to(card, {
        autoAlpha: 0, scale: 0.95, y: -15,
        duration: 0.4,
        ease: 'power2.in'
      }, exitAt);
    }

    return tl;
  }
</script>
