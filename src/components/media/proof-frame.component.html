    <div class="pf-box">

<style scoped>
  /* PROOF FRAME (SPEC-creator-formats.md): the proof placed beside the
     person instead of over them -- on a TV, a laptop, a phone, a whiteboard,
     a plated card, or bare on top for a reaction. It places itself: the
     wrapper is the whole stage, the frame goes on the side away from the
     face (or the side the need names), sized for the canvas. Until the file
     lands it is the slate: the screen says what it waits for. */
  .pf-root, .pf-root * { max-width: none; box-sizing: border-box; }
  .pf-root { position: absolute; inset: 0; pointer-events: none; font-family: var(--mp-font-family, 'Inter', system-ui, sans-serif); }
  .pf-box { position: absolute; display: flex; flex-direction: column; align-items: center; justify-content: center; }

  .pf-screen video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block; }

    background: repeating-linear-gradient(135deg, #1b1c24 0 18px, #20212b 18px 36px); }

<script>
  function createTimeline(el, data, ctx) {
    var tl = gsap.timeline();
    var q = function (s) { return el.querySelector(s); };
    var root = q('.pf-root'), box = q('.pf-box'), shell = q('.pf-shell'), screen = q('.pf-screen'), title = q('.pf-title');
    var DUR = (ctx && ctx.duration) || 6;
    var CH = { tv: 1, laptop: 1, phone: 1, whiteboard: 1, card: 1, none: 1 };
    var chrome = CH[data.chrome] ? data.chrome : 'card';
    root.classList.add('c-' + chrome);
    // THE SEEN FRAME: the wrapper may overhang it (the camera rig's
    // overscan); lay out inside what is seen, in the wrapper's own pixels.
    var rc = el.getBoundingClientRect(), cw = el.clientWidth || rc.width || 1, sc = rc.width / cw || 1;
    var OX = Math.max(0, -rc.left) / sc, OY = Math.max(0, -rc.top) / sc;
    var W = Math.min(cw - OX, (window.innerWidth || cw) / sc), H = Math.min((el.clientHeight || rc.height) - OY, (window.innerHeight || el.clientHeight) / sc);
    var tall = H > W * 1.05;
    var face = data.face && typeof data.face === 'object' ? data.face : { cx: 0.5, cy: tall ? 0.42 : 0.45, size: tall ? 0.22 : 0.3 };
    var side = data.side === 'left' || data.side === 'right' ? data.side : (Number(face.cx) >= 0.5 ? 'left' : 'right');
    var faceTop = Math.max(0.12, Number(face.cy) - Number(face.size) / 2);

    // THE SCREEN'S SHAPE: the device's own, else the picture's (16:10).
    var aspect = chrome === 'phone' ? 9 / 19.5 : chrome === 'tv' ? 16 / 9 : chrome === 'laptop' ? 16 / 10 : chrome === 'whiteboard' ? 4 / 3 : (Number(data.aspect) || 16 / 10);

    // THE BOX: the region the frame may use.
    var bx, by, bw, bh;
    if (data.place === 'split') {
      if (tall) { bx = 0; by = 0; bw = W; bh = Math.max(0.34, Math.min(0.5, faceTop - 0.03)) * H; aspect = bw / bh; }
      else { bw = W * 0.56; bh = H * 0.8; by = H * 0.1; bx = side === 'left' ? W * 0.04 : W - bw - W * 0.04; }
    } else if (tall) {
      // A tall frame has no room beside the face: the frame sits above it,
      // nudged toward its side.
      bh = Math.max(0.28, faceTop - 0.06) * H; bw = W * 0.86; by = H * 0.05;
      bx = (W - bw) / 2 + (side === 'left' ? -1 : 1) * W * 0.02;
    } else {
      bw = W * (chrome === 'phone' ? 0.26 : 0.42); bh = H * 0.74; by = (H - bh) / 2 - H * 0.02;
      bx = side === 'left' ? W * 0.05 : W - bw - W * 0.05;
    }
    // Room for the stand / deck / title inside the box.
    var extra = chrome === 'tv' ? 0.08 : chrome === 'laptop' ? 0.06 : 0;
    var sw = Math.min(bw, (bh * (1 - extra)) * aspect), sh = sw / aspect;
    if (chrome === 'none' && data.place === 'split') { sw = bw; sh = bh; }
    box.style.cssText = 'left:' + (OX + bx) + 'px;top:' + (OY + by) + 'px;width:' + bw + 'px;height:' + bh + 'px;font-size:' + Math.max(10, sw / 30).toFixed(1) + 'px';
    shell.style.width = sw + 'px'; shell.style.height = sh + 'px';
    if (chrome === 'whiteboard') {
      title.textContent = String(data.title || '');
      title.style.fontSize = (sh * 0.065).toFixed(1) + 'px';
      if (!data.title) screen.style.top = '6%';
      shell.appendChild(title);
    }

    // THE CONTENT: the file, or the slate's words.
    var at = Number(data.at), exitAt = Number(data.exit_at);
    var timed = isFinite(at) && at > 0;
    if (!isFinite(at) || at < 0) at = 0.15;
    if (!isFinite(exitAt) || exitAt <= at) exitAt = DUR;
    if (data.src && data.media === 'video' && typeof loadVideoForCapture === 'function') {
      loadVideoForCapture(screen, data.src, { style: 'position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;', startAt: timed ? -at : 0 });
    } else if (data.src) {
      var im = document.createElement('div'); im.className = 'pf-img';
      im.style.backgroundImage = 'url("' + String(data.src).replace(/"/g, '%22') + '")';
      if (chrome !== 'none' && data.fit === 'contain') im.style.backgroundSize = 'contain';
      screen.appendChild(im);
      var pre = document.createElement('img'); pre.src = String(data.src); pre.alt = '';
      pre.style.cssText = 'position:absolute;width:1px;height:1px;opacity:0'; screen.appendChild(pre);
    } else {
      var sl = document.createElement('div'); sl.className = 'pf-slate';
      sl.style.fontSize = Math.max(11, Math.min(sw, sh * 1.6) / 22).toFixed(1) + 'px';
      var b = document.createElement('b'); b.textContent = data.asset_type || 'Proof needed';
      var sp = document.createElement('span'); sp.textContent = data.text || data.need || '';
      var it = document.createElement('i'); it.textContent = data.hint || '';
      sl.appendChild(b); sl.appendChild(sp); sl.appendChild(it);
      screen.appendChild(sl);
    }

    // MOTION: it lands on its word with a small settle and leaves on the cut.
    gsap.set(box, { autoAlpha: 0, scale: 0.92, y: 18, transformOrigin: '50% 60%' });
    tl.to(box, { autoAlpha: 1, scale: 1, y: 0, duration: 0.38, ease: 'back.out(1.6)' }, at);
    if (exitAt < DUR - 0.05) tl.to(box, { autoAlpha: 0, scale: 0.96, duration: 0.18, ease: 'power2.in' }, Math.max(at + 0.4, exitAt - 0.18));
    tl.to({}, { duration: 0.01 }, DUR - 0.01);
    return tl;
  }
</script>
