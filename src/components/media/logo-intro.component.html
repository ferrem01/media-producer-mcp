<template>
  <div class="logo-intro">
    <div class="logo-text">{{text}}</div>
    <div class="tagline">{{tagline}}</div>
  </div>
</template>

<style scoped>
  .logo-intro {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    width: 100%;
    height: 100%;
    font-family: var(--mp-font-family, 'Inter', system-ui, -apple-system, sans-serif);
    padding: 80px;

  }

  .logo-text:empty {
    display: none;
  }

  .tagline {
    font-size: 24px;
    font-weight: 400;
    color: #cbd5e1;
    margin-top: 24px;
    text-align: center;
    letter-spacing: 0.005em;
    line-height: 1.4;
  }

  .tagline:empty {
    display: none;
  }
</style>

<script>
  function createTimeline(el, data, ctx) {
    var tl = gsap.timeline();
    var logo = el.querySelector('.logo-text');
    var tagline = el.querySelector('.tagline');
    var speed = ctx.motion === 'minimal' ? 0.5 : ctx.motion === 'punchy' ? 0.7 : 0.9;

    // Dramatic scale entrance with blur
    gsap.set(logo, { autoAlpha: 0, scale: 1.1, filter: 'blur(6px)' });
    tl.to(logo, {
      autoAlpha: 1, scale: 1, filter: 'blur(0px)',
      duration: speed,
      ease: ctx.motion === 'punchy' ? 'back.out(1.3)' : 'power3.out'
    }, 0.2);

    // Text glow pulse
    tl.fromTo(logo, {
      textShadow: '0 0 0px rgba(167, 139, 250, 0)'
    }, {
      textShadow: '0 0 80px rgba(167, 139, 250, 0.3), 0 0 30px rgba(167, 139, 250, 0.15)',
      duration: 0.7,
      ease: 'power2.out'
    }, 0.2 + speed * 0.4);

    tl.to(logo, {
      textShadow: '0 0 40px rgba(167, 139, 250, 0.12)',
      duration: 0.5,
      ease: 'power2.inOut'
    }, 0.2 + speed * 0.4 + 0.7);

    // Tagline fade in
    if (tagline && tagline.textContent.trim()) {
      gsap.set(tagline, { autoAlpha: 0, y: 20 });
      tl.to(tagline, {
        autoAlpha: 1, y: 0,
        duration: 0.55,
        ease: 'power2.out'
      }, 0.2 + speed * 0.7);
    }

    // Exit
    if (ctx.duration > 2) {
      var exitAt = ctx.duration - 0.6;
      var exitEls = [logo];
      if (tagline && tagline.textContent.trim()) exitEls.push(tagline);
      tl.to(exitEls, {
        autoAlpha: 0, scale: 0.97,
        duration: 0.4,
        stagger: 0.05,
        ease: 'power2.in'
      }, exitAt);
    }

    return tl;
  }
</script>
