<template>
  <div class="logo-intro">
    <div class="logo-text">{{text}}</div>
    <div class="tagline">{{tagline}}</div>
  </div>
</template>

<style scoped>
  .logo-intro {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    width: 100%;
    height: 100%;
    font-family: var(--mp-font-family, 'Inter', sans-serif);
  }

  .logo-text {
    font-size: 96px;
    font-weight: 800;
    color: var(--mp-color-text, #ffffff);
    text-align: center;
    letter-spacing: -0.02em;
  }

  .logo-text:empty {
    display: none;
  }

  .tagline {
    font-size: 28px;
    font-weight: 400;
    color: var(--mp-color-text-muted, #94a3b8);
    margin-top: 20px;
    text-align: center;
  }

  .tagline:empty {
    display: none;
  }
</style>

<script>
  function createTimeline(el, data, ctx) {
    var tl = gsap.timeline();
    var logo = el.querySelector('.logo-text');
    var tagline = el.querySelector('.tagline');
    var speed = ctx.motion === 'minimal' ? 0.5 : 0.8;

    // Logo entrance with scale and glow
    gsap.set(logo, { autoAlpha: 0, scale: 0.5 });
    tl.to(logo, {
      autoAlpha: 1,
      scale: 1,
      duration: speed,
      ease: 'back.out(1.4)'
    }, 0.2);

    // Glow effect
    tl.fromTo(logo, {
      textShadow: '0 0 0px var(--mp-color-accent, #a78bfa)'
    }, {
      textShadow: '0 0 40px var(--mp-color-accent, #a78bfa)',
      duration: 0.6,
      ease: 'power2.out'
    }, 0.2 + speed * 0.5);

    tl.to(logo, {
      textShadow: '0 0 10px var(--mp-color-accent, #a78bfa)',
      duration: 0.4,
      ease: 'power2.in'
    }, 0.2 + speed * 0.5 + 0.6);

    // Tagline fade in
    if (tagline && tagline.textContent.trim()) {
      gsap.set(tagline, { autoAlpha: 0, y: 20 });
      tl.to(tagline, {
        autoAlpha: 1,
        y: 0,
        duration: 0.5,
        ease: 'power2.out'
      }, 0.2 + speed + 0.2);
    }

    // Exit
    if (ctx.duration > 2) {
      tl.to([logo, tagline], {
        autoAlpha: 0,
        scale: 0.95,
        duration: 0.4,
        ease: 'power2.in'
      }, ctx.duration - 0.5);
    }

    return tl;
  }
</script>
