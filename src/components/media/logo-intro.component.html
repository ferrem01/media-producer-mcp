<template>
  <div class="logo-intro">
    <div class="ambient-ring"></div>
    <div class="logo-container">
      <div class="logo-image"></div>
      <div class="logo-text">{{text}}</div>
    </div>
    <div class="tagline">{{tagline}}</div>
  </div>
</template>

<style scoped>
  .logo-intro {
    display: flex;

    display: none;
  }
</style>

<script>
  function createTimeline(el, data, ctx) {
    var tl = gsap.timeline();
    var logo = el.querySelector('.logo-text');
    var logoImage = el.querySelector('.logo-image');
    var tagline = el.querySelector('.tagline');
    var ring = el.querySelector('.ambient-ring');
    var speed = ctx.motion === 'minimal' ? 0.5 : ctx.motion === 'punchy' ? 0.7 : 0.9;
    var ease = ctx.motion === 'punchy' ? 'back.out(1.3)' : 'power3.out';

    // Logo image setup
    if (data.logo_url) {
      logoImage.style.backgroundImage = 'url(' + data.logo_url + ')';
    }

    // Initial states
    gsap.set(ring, { autoAlpha: 0, scale: 0.3 });

    // Ambient ring expands first
    tl.to(ring, {
      autoAlpha: 1, scale: 1,
      duration: speed * 1.2,
      ease: 'power2.out'
    }, 0.1);

    // Logo image entrance
    if (data.logo_url) {
      gsap.set(logoImage, { autoAlpha: 0, scale: 0.7, filter: 'blur(8px)' });
      tl.to(logoImage, {
        autoAlpha: 1, scale: 1, filter: 'blur(0px)',
        duration: speed * 0.8,
        ease: ease
      }, 0.2);
    }

    // Dramatic text scale entrance with blur
    if (logo && logo.textContent.trim()) {
      gsap.set(logo, { autoAlpha: 0, scale: 1.15, filter: 'blur(8px)' });
      tl.to(logo, {
        autoAlpha: 1, scale: 1, filter: 'blur(0px)',
        duration: speed,
        ease: ease
      }, data.logo_url ? 0.3 : 0.2);

      // Text glow pulse
      var glowStart = (data.logo_url ? 0.3 : 0.2) + speed * 0.4;
      tl.fromTo(logo, {
        textShadow: '0 0 0px rgba(167, 139, 250, 0)'
      }, {
        textShadow: '0 0 80px rgba(167, 139, 250, 0.3), 0 0 30px rgba(167, 139, 250, 0.15)',
        duration: 0.7,
        ease: 'power2.out'
      }, glowStart);

      tl.to(logo, {
        textShadow: '0 0 40px rgba(167, 139, 250, 0.12)',
        duration: 0.5,
        ease: 'power2.inOut'
      }, glowStart + 0.7);
    }

    // Tagline fade in
    if (tagline && tagline.textContent.trim()) {
      gsap.set(tagline, { autoAlpha: 0, y: 20, filter: 'blur(3px)' });
      tl.to(tagline, {
        autoAlpha: 1, y: 0, filter: 'blur(0px)',
        duration: 0.55,
        ease: 'power2.out'
      }, 0.2 + speed * 0.7);
    }

    // Exit
    if (ctx.duration > 2) {
      var exitAt = ctx.duration - 0.6;
      var exitEls = [];
      if (data.logo_url) exitEls.push(logoImage);
      if (logo && logo.textContent.trim()) exitEls.push(logo);
      if (tagline && tagline.textContent.trim()) exitEls.push(tagline);
      tl.to(exitEls, {
        autoAlpha: 0, scale: 0.97,
        duration: 0.4,
        stagger: 0.05,
        ease: 'power2.in'
      }, exitAt);
      tl.to(ring, {
        autoAlpha: 0,
        duration: 0.4,
        ease: 'power2.in'
      }, exitAt);
    }

    return tl;
  }
</script>
