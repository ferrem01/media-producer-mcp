<template>
  <div class="image-component">
    <div class="bg-image"></div>
    <div class="bg-overlay"></div>
  </div>
</template>

<style scoped>
  .image-component {
    width: 100%;
    height: 100%;
    position: relative;
    overflow: hidden;
  }

  .bg-image {
    position: absolute;
    inset: 0;
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
  }

  .bg-overlay {
    position: absolute;
    inset: 0;
    pointer-events: none;
  }
</style>

<script>
  function createTimeline(el, data, ctx) {
    var tl = gsap.timeline();
    var bgImage = el.querySelector('.bg-image');
    var overlay = el.querySelector('.bg-overlay');

    // Set the background image
    if (data.src) {
      bgImage.style.backgroundImage = 'url(' + data.src + ')';
      // The capture waits for <img> elements only; a CSS background raced
      // it, so a scene that OPENS on this image rendered its first frame
      // blank (a relay join landing on a full-frame photo broke). A hidden
      // <img> of the same URL is waited on, and the background paints from
      // the cache it fills.
      var pre = document.createElement('img');
      pre.className = 'bg-preload';
      pre.alt = '';
      pre.setAttribute('aria-hidden', 'true');
      pre.style.cssText = 'position:absolute;width:1px;height:1px;opacity:0;pointer-events:none;';
      pre.src = data.src;
      el.querySelector('.image-component').appendChild(pre);
    }

    // For logos/small images: blend mode removes white backgrounds
    if (data.blend) {
      bgImage.style.mixBlendMode = data.blend; // e.g. 'multiply', 'darken'
    }

    // fit mode: contain for logos, cover for backgrounds (default)
    if (data.fit === 'contain') {
      bgImage.style.backgroundSize = 'contain';
    }

    // Optional overlay for text readability
    var overlayOpacity = data.overlay_opacity || 0;
    var overlayColor = data.overlay_color || 'var(--mp-color-background, #000000)';
    if (overlayOpacity > 0) {
      overlay.style.background = overlayColor;
      overlay.style.opacity = overlayOpacity;
    }

    var root = el.querySelector('.image-component');
    var at = Number(data.at);
    var exitAt = Number(data.exit_at);
    var timed = isFinite(at) || isFinite(exitAt);
    if (!isFinite(at) || at < 0) at = 0;
    if (!isFinite(exitAt) || exitAt <= at) exitAt = ctx.duration;

    // Optional ken-burns drift (a timed image pushes in over its window)
    var drift = data.drift !== false;
    // entrance "none": the picture STANDS from frame 0 -- no fade, no drift
    // unless asked. A relay join lands on it (the previous scene ends on
    // this exact full-frame image), so frame 0 must already be the picture.
    if (data.entrance === 'none') {
      gsap.set(root, { autoAlpha: 1 });
      if (drift && data.drift === true) tl.fromTo(bgImage, { scale: 1 }, { scale: 1.06, duration: ctx.duration, ease: 'none' }, 0);
      if (isFinite(Number(data.exit_at)) && Number(data.exit_at) < ctx.duration) tl.to(root, { autoAlpha: 0, duration: 0.02, ease: 'none' }, Number(data.exit_at));
      return tl;
    }
    if (timed && drift) {
      gsap.set(bgImage, { scale: 1 });
      tl.to(bgImage, { scale: 1.06, duration: Math.max(0.5, exitAt - at), ease: 'none' }, at);
    } else if (drift && ctx.duration > 2) {
      gsap.set(bgImage, { scale: 1.05 });
      tl.to(bgImage, {
        scale: 1,
        duration: ctx.duration,
        ease: 'none'
      }, 0);
    }

    if (timed) {
      // A TIMED image is a cut, not a fade: it takes the frame on `at` and
      // leaves on `exit_at` (SPEC-creator-cut.md, the proof on a claim).
      // Sub-frame tweens, not set(): a set() placed later in a timeline is
      // rendered immediately on creation. 0.02s is under one frame at 30fps.
      gsap.set(root, { autoAlpha: 0 });
      tl.fromTo(root, { autoAlpha: 0 }, { autoAlpha: 1, duration: 0.02, ease: 'none', immediateRender: false }, at);
      if (exitAt < ctx.duration) tl.to(root, { autoAlpha: 0, duration: 0.02, ease: 'none' }, exitAt);
      return tl;
    }

    // Fade in
    var speed = ctx.motion === 'minimal' ? 0.3 : 0.6;
    gsap.set(root, { autoAlpha: 0 });
    tl.to(root, {
      autoAlpha: 1,
      duration: speed,
      ease: 'power2.out'
    }, 0);

    return tl;
  }
</script>
