<script>
  function createTimeline(el, data, ctx) {
    var tl = gsap.timeline();
    var title = el.querySelector('.integration-title');
    var grid = el.querySelector('.logo-grid');

    var titleText = data.title || 'Integrates with';
    var domains = data.domains || [];
    var size = data.size || 64;

    var columns = data.columns || 4;
    var token = 'pk_B_cdrQLyTkSFPzSMm52goQ';

    title.textContent = titleText;
    grid.style.gridTemplateColumns = 'repeat(' + columns + ', 1fr)';

    // Create logo cards
    domains.forEach(function(domain) {
      var card = document.createElement('div');
      card.className = 'logo-card';
      var img = document.createElement('img');
      img.src = 'https://img.logo.dev/' + domain + '?token=' + token + '&size=' + size + '&format=png';
      img.alt = domain;
      img.width = size;
      img.height = size;
      card.appendChild(img);
      grid.appendChild(card);
    });

    var cards = grid.querySelectorAll('.logo-card');

    // Animate title
    tl.fromTo(title, { opacity: 0, y: 20 }, {
      opacity: 1, y: 0, duration: 0.6, ease: 'power3.out'
    }, 0.2);

    // Stagger entrance for cards
