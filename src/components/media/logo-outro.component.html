  <div class="logo-outro">
    <div class="logo-text">{{text}}</div>
    <div class="tagline">{{tagline}}</div>
    <div class="cta">{{cta}}</div>
  </div>
</template>

<style scoped>

    margin-top: 36px;

    letter-spacing: 0.08em;

    display: none;

<script>
  function createTimeline(el, data, ctx) {
    var tl = gsap.timeline();
    var logo = el.querySelector('.logo-text');
    var tagline = el.querySelector('.tagline');
    var cta = el.querySelector('.cta');
    var elements = [logo, tagline, cta].filter(function(e) { return e && e.textContent.trim(); });

    var speed = ctx.motion === 'minimal' ? 0.4 : ctx.motion === 'punchy' ? 0.55 : 0.7;

    // Initial states
    gsap.set(logo, { autoAlpha: 0, scale: 1.06, filter: 'blur(4px)' });
    gsap.set(tagline, { autoAlpha: 0, y: 20 });
    gsap.set(cta, { autoAlpha: 0, y: 15 });

    // Logo entrance
    if (logo && logo.textContent.trim()) {
      tl.to(logo, {
        autoAlpha: 1, scale: 1, filter: 'blur(0px)',
        duration: speed,
        ease: 'power3.out'
      }, 0.3);
    }

    // Tagline
    if (tagline && tagline.textContent.trim()) {
      tl.to(tagline, {
        autoAlpha: 1, y: 0,
        duration: speed * 0.7,
        ease: 'power2.out'
      }, 0.3 + speed * 0.5);
    }

    // CTA
    if (cta && cta.textContent.trim()) {
      tl.to(cta, {
        autoAlpha: 1, y: 0,
        duration: speed * 0.6,
        ease: 'power2.out'
      }, 0.3 + speed * 0.8);
    }

    // Subtle pulse on logo
    if (logo && logo.textContent.trim()) {
      tl.to(logo, {
        textShadow: '0 0 60px rgba(167, 139, 250, 0.2)',
        duration: 0.8,
        ease: 'sine.inOut',
        yoyo: true,
        repeat: 1
      }, 0.3 + speed + 0.3);
    }

    // Exit
    if (ctx.duration > 2) {
      var exitAt = ctx.duration - 0.7;
      tl.to(elements, {
        autoAlpha: 0,
        duration: 0.5,
        stagger: 0.04,
        ease: 'power2.in'
      }, exitAt);
    }

    return tl;
  }
</script>
