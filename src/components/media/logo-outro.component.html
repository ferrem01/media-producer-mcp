<script>
  function createTimeline(el, data, ctx) {
    var tl = gsap.timeline();
    var logo = el.querySelector('.logo-text');
    var tagline = el.querySelector('.tagline');
    var cta = el.querySelector('.cta');
    var elements = [logo, tagline, cta].filter(function(e) { return e && e.textContent.trim(); });

    gsap.set(elements, { autoAlpha: 0, y: 20 });

    // Entrance
    tl.to(elements, {
      autoAlpha: 1,
      y: 0,
      duration: 0.6,
      stagger: 0.15,
      ease: 'power2.out'
    }, 0.3);

    // Subtle pulse on logo
    if (logo && logo.textContent.trim()) {
      tl.to(logo, {
        scale: 1.03,
        duration: 0.8,
        ease: 'sine.inOut',
        yoyo: true,
        repeat: 1
      }, 1.2);
    }

    // Fade out
    if (ctx.duration > 2) {
      tl.to(elements, {
        autoAlpha: 0,
        duration: 0.6,
        stagger: 0.05,
        ease: 'power2.in'
      }, ctx.duration - 0.8);
    }

    return tl;
  }
</script>
