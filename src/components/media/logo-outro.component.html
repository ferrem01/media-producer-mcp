    </div>
  </div>
</template>

<style scoped>

<script>
  function createTimeline(el, data, ctx) {
    var tl = gsap.timeline();
    var logo = el.querySelector('.logo-text');
    var logoImage = el.querySelector('.logo-image');
    var tagline = el.querySelector('.tagline');
    var cta = el.querySelector('.cta');
    var ring = el.querySelector('.ambient-ring');

    var speed = ctx.motion === 'minimal' ? 0.4 : ctx.motion === 'punchy' ? 0.55 : 0.7;
    var ease = ctx.motion === 'punchy' ? 'back.out(1.2)' : 'power3.out';

    // Logo image setup
    if (data.logo_url) {
      logoImage.style.backgroundImage = 'url(' + data.logo_url + ')';
    }

    // Initial states
    gsap.set(ring, { autoAlpha: 0, scale: 0.3 });

    // Ambient ring
    tl.to(ring, {
      autoAlpha: 1, scale: 1,
      duration: speed * 1.2,
      ease: 'power2.out'
    }, 0.1);

    // Logo image
    if (data.logo_url) {
      gsap.set(logoImage, { autoAlpha: 0, scale: 0.7, filter: 'blur(6px)' });
      tl.to(logoImage, {
        autoAlpha: 1, scale: 1, filter: 'blur(0px)',
        duration: speed * 0.7,
        ease: ease
      }, 0.2);
    }

    // Logo text entrance
    if (logo && logo.textContent.trim()) {
      gsap.set(logo, { autoAlpha: 0, scale: 1.08, filter: 'blur(5px)' });
      tl.to(logo, {
        autoAlpha: 1, scale: 1, filter: 'blur(0px)',
        duration: speed,
        ease: ease
      }, data.logo_url ? 0.3 : 0.2);
    }

    // Tagline
    if (tagline && tagline.textContent.trim()) {
      gsap.set(tagline, { autoAlpha: 0, y: 20, filter: 'blur(3px)' });
      tl.to(tagline, {
        autoAlpha: 1, y: 0, filter: 'blur(0px)',
        duration: speed * 0.7,
        ease: 'power2.out'
      }, 0.3 + speed * 0.5);
    }

    // CTA pill entrance
    if (cta && cta.textContent.trim()) {
      gsap.set(cta, { autoAlpha: 0, y: 15, scale: 0.9, filter: 'blur(3px)' });
      tl.to(cta, {
        autoAlpha: 1, y: 0, scale: 1, filter: 'blur(0px)',
        duration: speed * 0.6,
        ease: ease
      }, 0.3 + speed * 0.8);

      // CTA glow pulse
      tl.to(cta, {
        boxShadow: '0 8px 24px rgba(0, 0, 0, 0.2), 0 0 30px rgba(167, 139, 250, 0.15)',
        duration: 0.6,
        ease: 'power2.out'
      }, 0.3 + speed + 0.3);

      tl.to(cta, {
        boxShadow: '0 8px 24px rgba(0, 0, 0, 0.2), 0 0 16px rgba(167, 139, 250, 0.08)',
        duration: 0.5,
        ease: 'sine.inOut'
      }, 0.3 + speed + 0.9);
    }

    // Subtle logo pulse
    if (logo && logo.textContent.trim()) {
      tl.to(logo, {
        textShadow: '0 0 60px rgba(167, 139, 250, 0.2)',
        duration: 0.8,
        ease: 'sine.inOut',
        yoyo: true,
        repeat: 1
      }, 0.3 + speed + 0.3);
    }

    // Exit
    if (ctx.duration > 2) {
      var exitAt = ctx.duration - 0.7;
      var elements = [];
      if (data.logo_url) elements.push(logoImage);
      if (logo && logo.textContent.trim()) elements.push(logo);
      if (tagline && tagline.textContent.trim()) elements.push(tagline);
      if (cta && cta.textContent.trim()) elements.push(cta);
      tl.to(elements, {
        autoAlpha: 0,
        duration: 0.5,
        stagger: 0.04,
        ease: 'power2.in'
      }, exitAt);
      tl.to(ring, {
        autoAlpha: 0,
        duration: 0.4,
        ease: 'power2.in'
      }, exitAt);
    }

    return tl;
  }
</script>
