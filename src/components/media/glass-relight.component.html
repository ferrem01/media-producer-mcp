        var k0 = knobAt(0);
        pts.push({ t: T.drag - 0.04, x: k0.x, y: k0.y });
        var cx2, cy2;
        if (t < T.drag) {
          var a2 = pts[0], b2 = pts[0];
          for (var pi = 0; pi < pts.length - 1; pi++) if (t >= pts[pi].t && t < pts[pi + 1].t) { a2 = pts[pi]; b2 = pts[pi + 1]; break; }
          if (t >= pts[pts.length - 1].t) a2 = b2 = pts[pts.length - 1];
          var pp = a2 === b2 ? 0 : E.io2((t - a2.t) / (b2.t - a2.t));
          cx2 = lerp(a2.x, b2.x, pp); cy2 = lerp(a2.y, b2.y, pp);
        } else if (t < T.expand) {
          var kk2 = carry || knobAt(p); cx2 = kk2.x; cy2 = kk2.y;
        } else {
          var rp2 = E.io2(P01(t, T.expand, T.expandEnd - T.expand));
          var from = { x: ORB.x, y: ORB.y };
          cx2 = lerp(from.x, fx(cTo[0]), rp2); cy2 = lerp(from.y, fy(cTo[1]), rp2);
        }
        // presses: like, adjust (clicks), knob (held from drag to expand)
        var press = 1;
        [T.like, T.click].forEach(function (tc) { if (t >= tc && t < tc + 0.16) press = Math.min(press, 1 - 0.15 * Math.sin(Math.PI * (t - tc) / 0.16)); });
        if (t >= T.drag && t < T.expand) press = Math.min(press, 1 - 0.15 * cl((t - T.drag) / 0.08, 0, 1) * cl((T.expand - t) / 0.08, 0, 1));
        gsap.set(cur, { x: cx2 - CS * 5.5 / 24, y: cy2 - CS * 3.2 / 24, scale: press });
        if (ring) {
          var rt = -1;
          [T.like, T.click, T.drag].forEach(function (tc) { if (t >= tc && t < tc + 0.42) rt = t - tc; });
          if (rt >= 0) { var rq = E.o2(rt / 0.42); gsap.set(ring, { autoAlpha: 0.8 * (1 - rq), scale: 0.25 + 1.3 * rq }); }
          else gsap.set(ring, { autoAlpha: 0 });
        }
      }
    }

    var clock = { t: 0 };
    render(0);
    tl.to(clock, { t: END, duration: END, ease: 'none', onUpdate: function () { render(clock.t); } }, 0);
    return tl;
  }
</script>
