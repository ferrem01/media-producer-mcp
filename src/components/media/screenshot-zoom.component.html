<template>
  <div class="screenshot-zoom">
    <div class="screenshot-frame">
      <div class="frame-glow"></div>
      <div class="screenshot-container">
        <div class="screenshot-box"></div>
        <div class="zoom-ring"></div>
      </div>
      <div class="zoom-label"></div>
    </div>
  </div>
</template>

<style scoped>
  .screenshot-zoom {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 100%;

    display: none;
  }
</style>

<script>
  function createTimeline(el, data, ctx) {
    var tl = gsap.timeline();
    var frame = el.querySelector('.screenshot-frame');
    var container = el.querySelector('.screenshot-container');
    var box = el.querySelector('.screenshot-box');
    var label = el.querySelector('.zoom-label');
    var frameGlow = el.querySelector('.frame-glow');
    var ring = el.querySelector('.zoom-ring');

    if (data.src) {
      box.style.backgroundImage = 'url(' + data.src + ')';
    } else {
      box.style.background = 'linear-gradient(135deg, var(--mp-color-surface, #1e293b), var(--mp-color-background, #0f172a))';
      if (data.alt) {
        box.innerHTML = '<div style="display:flex;align-items:center;justify-content:center;height:100%;color:var(--mp-color-text-muted,#94a3b8);font-size:24px;text-align:center;padding:20px;">' + data.alt + '</div>';
      }
    }

    if (data.label) label.textContent = data.label;

    var zoomX = data.zoom_x || 50;
    var zoomY = data.zoom_y || 50;
    var zoomScale = data.zoom_scale || 2;

    box.style.transformOrigin = zoomX + '% ' + zoomY + '%';

    // Position zoom ring at the focus point
    ring.style.left = 'calc(' + zoomX + '% - 60px)';
    ring.style.top = 'calc(' + zoomY + '% - 60px)';

    var speed = ctx.motion === 'minimal' ? 0.5 : ctx.motion === 'punchy' ? 0.6 : 0.75;

    // Frame entrance with scale + blur
    gsap.set(frame, { autoAlpha: 0, scale: 1.06, filter: 'blur(6px)' });
    gsap.set(label, { autoAlpha: 0, y: 10, filter: 'blur(3px)' });
    gsap.set(frameGlow, { autoAlpha: 0, scale: 0.7 });
    gsap.set(ring, { autoAlpha: 0, scale: 0.5 });

    tl.to(frame, {
      autoAlpha: 1, scale: 1, filter: 'blur(0px)',
      duration: speed, ease: 'power3.out'
    }, 0.2);

    // Frame glow
    tl.to(frameGlow, {
      autoAlpha: 1, scale: 1,
      duration: 0.5, ease: 'power2.out'
    }, 0.2 + speed * 0.4);

    // Zoom ring appears at focus point
    var zoomStart = Math.min(1.0, ctx.duration * 0.25);
    tl.to(ring, {
      autoAlpha: 1, scale: 1,
      duration: 0.4, ease: 'back.out(1.3)'
    }, zoomStart);

    // Smooth zoom
    var zoomDuration = ctx.duration * 0.35;

    tl.to(box, {
      scale: zoomScale,
      duration: zoomDuration,
      ease: 'power2.inOut'
    }, zoomStart + 0.2);

    // Ring fades as zoom completes
    tl.to(ring, {
      autoAlpha: 0, scale: 1.5,
      duration: 0.4, ease: 'power2.in'
    }, zoomStart + zoomDuration * 0.6);

    // Elevated shadow settles during zoom
    tl.to(container, {
      boxShadow: '0 25px 60px rgba(0, 0, 0, 0.4), 0 0 0 1px rgba(255, 255, 255, 0.05), 0 0 40px rgba(167, 139, 250, 0.05)',
      duration: 0.5,
      ease: 'power2.out'
    }, zoomStart + zoomDuration * 0.5);

    // Show label after zoom
    if (data.label) {
      tl.to(label, {
        autoAlpha: 1, y: 0, filter: 'blur(0px)',
        duration: 0.4, ease: 'power2.out'
      }, zoomStart + zoomDuration * 0.7);
    }

    // Exit
    if (ctx.duration > 2) {
      var exitAt = ctx.duration - 0.6;
      tl.to(frame, {
        autoAlpha: 0, scale: 0.97,
        duration: 0.4, ease: 'power2.in'
      }, exitAt);
    }

    return tl;
  }
</script>
