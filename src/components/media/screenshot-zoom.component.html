<template>
  <div class="screenshot-zoom">
    <div class="screenshot-container">
      <div class="screenshot-box"></div>
      <div class="zoom-label"></div>
    </div>
  </div>
</template>

<style scoped>
  .screenshot-zoom {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 100%;
    height: 100%;
    font-family: var(--mp-font-family, 'Inter', sans-serif);
    overflow: hidden;
  }

  .screenshot-container {
    width: 90%;
    height: 85%;
    overflow: hidden;
    border-radius: var(--mp-border-radius, 12px);
    position: relative;
    border: 2px solid var(--mp-color-surface, #1e293b);
  }

  .screenshot-box {
    width: 100%;
    height: 100%;
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    transform-origin: center center;
  }

  .zoom-label {
    position: absolute;
    bottom: 16px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 18px;
    font-weight: 600;
    color: var(--mp-color-text, #ffffff);
    background: var(--mp-color-primary, #6366f1);
    padding: 8px 20px;
    border-radius: 999px;
    white-space: nowrap;
  }

  .zoom-label:empty {
    display: none;
  }
</style>

<script>
  function createTimeline(el, data, ctx) {
    var tl = gsap.timeline();
    var box = el.querySelector('.screenshot-box');
    var label = el.querySelector('.zoom-label');
    var container = el.querySelector('.screenshot-container');

    // Set background or placeholder
    if (data.src) {
      box.style.backgroundImage = 'url(' + data.src + ')';
    } else {
      box.style.background = 'linear-gradient(135deg, var(--mp-color-surface, #1e293b), var(--mp-color-background, #0f172a))';
      if (data.alt) {
        box.innerHTML = '<div style="display:flex;align-items:center;justify-content:center;height:100%;color:var(--mp-color-text-muted,#94a3b8);font-size:24px;text-align:center;padding:20px;">' + data.alt + '</div>';
      }
    }

    // Label
    if (data.label) {
      label.textContent = data.label;
    }

    var zoomX = data.zoom_x || 50;
    var zoomY = data.zoom_y || 50;
    var zoomScale = data.zoom_scale || 2;

    // Set transform origin to zoom target
    box.style.transformOrigin = zoomX + '% ' + zoomY + '%';

    // Start fully visible
    gsap.set(container, { autoAlpha: 0 });
    gsap.set(label, { autoAlpha: 0, y: 10 });

    // Fade in
    tl.to(container, { autoAlpha: 1, duration: 0.5, ease: 'power2.out' }, 0.2);

    // Hold at full view, then zoom
    var zoomStart = Math.min(1.0, ctx.duration * 0.3);
    var zoomDuration = ctx.duration * 0.35;

    tl.to(box, {
      scale: zoomScale,
      duration: zoomDuration,
      ease: 'power2.inOut'
    }, zoomStart);

    // Show label after zoom
    if (data.label) {
      tl.to(label, {
        autoAlpha: 1,
        y: 0,
        duration: 0.4,
        ease: 'power2.out'
      }, zoomStart + zoomDuration * 0.8);
    }

    // Exit
    if (ctx.duration > 2) {
      tl.to(container, {
        autoAlpha: 0,
        duration: 0.4,
        ease: 'power2.in'
      }, ctx.duration - 0.5);
    }

    return tl;
  }
</script>
