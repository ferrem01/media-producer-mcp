<template>
  <div class="image-showcase">
    <div class="image-frame">
      <div class="image-container">
        <div class="image-box"></div>
      </div>
    </div>
    <p class="caption">{{caption}}</p>
  </div>
</template>

<style scoped>
  .image-showcase {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    width: 100%;
    height: 100%;
    font-family: var(--mp-font-family, 'Inter', system-ui, -apple-system, sans-serif);
    padding: 80px;
    overflow: hidden;
  }

  .image-frame {
    width: 85%;
    height: 72%;
    border-radius: 16px;
    overflow: hidden;
    box-shadow:
      0 25px 60px rgba(0, 0, 0, 0.4),
      0 0 0 1px rgba(255, 255, 255, 0.06);
    position: relative;
  }

  .image-container {
    width: 100%;
    height: 100%;
    overflow: hidden;
  }

  .image-box {
    width: 100%;
    height: 100%;
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
  }

  .caption {
    font-size: 18px;
    font-weight: 400;
    color: #94a3b8;
    margin-top: 24px;
    text-align: center;
    max-width: 65%;
    line-height: 1.5;
    letter-spacing: 0.005em;
    background: rgba(255, 255, 255, 0.03);
    border: 1px solid rgba(255, 255, 255, 0.06);
    border-radius: 999px;
    padding: 10px 24px;
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
  }

  .caption:empty {
    display: none;
  }
</style>

<script>
  function createTimeline(el, data, ctx) {
    var tl = gsap.timeline();
    var frame = el.querySelector('.image-frame');
    var box = el.querySelector('.image-box');
    var caption = el.querySelector('.caption');
    var effect = data.effect || 'ken-burns';

    if (data.src) {
      box.style.backgroundImage = 'url(' + data.src + ')';
    } else {
      box.style.background = 'linear-gradient(135deg, var(--mp-color-primary, #6366f1), var(--mp-color-accent, #a78bfa))';
      if (data.alt) {
        box.innerHTML = '<div style="display:flex;align-items:center;justify-content:center;height:100%;color:var(--mp-color-text,#fff);font-size:28px;font-weight:600;text-align:center;padding:20px;">' + data.alt + '</div>';
      }
    }

    var speed = ctx.motion === 'minimal' ? 0.5 : ctx.motion === 'punchy' ? 0.65 : 0.8;

    if (effect === 'ken-burns') {
      gsap.set(frame, { autoAlpha: 0, scale: 1.06, filter: 'blur(5px)' });
      gsap.set(box, { scale: 1 });
      tl.to(frame, { autoAlpha: 1, scale: 1, filter: 'blur(0px)', duration: speed, ease: 'power3.out' }, 0.2);
      tl.to(box, { scale: 1.12, duration: ctx.duration - 0.5, ease: 'none' }, 0);
    } else if (effect === 'reveal-left') {
      gsap.set(frame, { clipPath: 'inset(0 100% 0 0)' });
      tl.to(frame, { clipPath: 'inset(0 0% 0 0)', duration: speed, ease: 'power3.out' }, 0.2);
    } else if (effect === 'reveal-right') {
      gsap.set(frame, { clipPath: 'inset(0 0 0 100%)' });
      tl.to(frame, { clipPath: 'inset(0 0 0 0%)', duration: speed, ease: 'power3.out' }, 0.2);
    } else if (effect === 'zoom-in') {
      gsap.set(frame, { autoAlpha: 0, scale: 0.85, filter: 'blur(6px)' });
      tl.to(frame, { autoAlpha: 1, scale: 1, filter: 'blur(0px)', duration: speed, ease: 'back.out(1.2)' }, 0.2);
    } else {
      gsap.set(frame, { autoAlpha: 0, y: 30, filter: 'blur(4px)' });
      tl.to(frame, { autoAlpha: 1, y: 0, filter: 'blur(0px)', duration: speed, ease: 'power3.out' }, 0.2);
    }

    // Caption
    if (caption && caption.textContent.trim()) {
      gsap.set(caption, { autoAlpha: 0, y: 15 });
      tl.to(caption, { autoAlpha: 1, y: 0, duration: 0.45, ease: 'power2.out' }, 0.2 + speed * 0.7);
    }

    // Exit
    if (ctx.duration > 2) {
      var exitAt = ctx.duration - 0.6;
      tl.to(el.querySelector('.image-showcase'), {
        autoAlpha: 0,
        duration: 0.4,
        ease: 'power2.in'
      }, exitAt);
    }

    return tl;
  }
</script>
