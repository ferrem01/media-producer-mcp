<script>
  function createTimeline(el, data, ctx) {
    var textEl = el.querySelector('[data-text]');
    var typeEl = el.querySelector('[data-type]');
    var hintEl = el.querySelector('[data-hint]');
    var iconEl = el.querySelector('.placeholder-icon');
    var rec = el.querySelector('.icon-rec');
    var play = el.querySelector('.icon-play');

    if (textEl) textEl.textContent = data.text || 'Asset needed';
    if (typeEl) typeEl.textContent = data.asset_type || 'Asset needed';
    if (hintEl) { hintEl.textContent = data.hint || ''; if (!data.hint) hintEl.style.display = 'none'; }
    // A recording waits with a blinking REC dot; a still with the play glyph off.
    var isVideo = /recording|video|clip|b-roll|footage/i.test(String(data.asset_type || ''));
    if (rec && !isVideo) rec.style.display = 'none';
    if (play && !isVideo) play.style.opacity = '0.55';

    var tl = gsap.timeline();
    gsap.set([iconEl, typeEl, textEl, hintEl], { autoAlpha: 0, y: 10 });
    tl.to(iconEl, { autoAlpha: 1, y: 0, duration: 0.45, ease: 'power2.out' }, 0.1)
      .to(typeEl, { autoAlpha: 1, y: 0, duration: 0.4, ease: 'power2.out' }, 0.25)
      .to(textEl, { autoAlpha: 1, y: 0, duration: 0.45, ease: 'power2.out' }, 0.35)
      .to(hintEl, { autoAlpha: 1, y: 0, duration: 0.4, ease: 'power2.out' }, 0.5);
    if (rec && isVideo) {
      tl.to(rec, { opacity: 0.25, duration: 0.6, ease: 'sine.inOut', repeat: -1, yoyo: true }, 0.6);
    }
    return tl;
  }
</script>
