          it.el.style.borderRadius = (Math.min(r.w, r.h) * 0.012 * (1 - r.e)).toFixed(2) + 'px';
          it.el.style.boxShadow = shadow(r.h, 1 - r.e);
          it.el.style.zIndex = '30';
          return;
        }
        var w = it.w * s, h = it.h * s;
        var cx = RCX + (it.sx - cam.camX) * s, cy = RCY + it.oy * s;
        var half = Math.hypot(w, h) / 2;
        if (cx + half < -0.02 * RW || cx - half > RW * 1.02 || cy + half < 0 || cy - half > RH) { it.el.style.visibility = 'hidden'; return; }
        put(it, cx - w / 2, cy - h / 2, w, h, it.rot);
        it.el.style.borderRadius = (Math.min(w, h) * 0.012).toFixed(2) + 'px';
        it.el.style.boxShadow = shadow(h, 1);
      });
      }
      // Target highlight: a press ring on the clicked thing.
      stopItems.forEach(function (it, i) {
        var hl = it.hl, dt = t - click[i];
        if (dt < 0 || dt > 0.5 || smashing) { hl.style.visibility = 'hidden'; return; }
        var k = (it === lastIt && cover) ? lastRect(t).k : FLOAT ? (it.sk || it.k) : it.k * (t >= leave[i] ? s : 1);
        var th = Math.min(it.t.w, it.t.h) * k;
        var e = out2(dt / 0.5);
        var press = dt < 0.12 ? 1 - 0.05 * Math.sin(Math.PI * dt / 0.12) : 1;
        hl.style.visibility = 'inherit';
        hl.style.borderRadius = (th * 0.32).toFixed(2) + 'px';
        hl.style.background = 'rgba(' + chipRGB + ',' + (0.2 * (1 - e)).toFixed(3) + ')';
        hl.style.boxShadow = '0 0 0 ' + (Math.max(2, th * 0.06) + th * 0.22 * e).toFixed(2) + 'px rgba(' + chipRGB + ',' + (0.55 * (1 - e)).toFixed(3) + ')';
        hl.style.transform = 'scale(' + press.toFixed(4) + ')';
      });
      // Chips: pop out of the click point, fly an arc, land at chip_to, gone.
      stopItems.forEach(function (it, i) {
        var c = chips[i], dt = t - click[i];
        if (dt < 0 || t > land[i] + CHOLD + 1e-3 || smashing) { c.style.visibility = 'hidden'; return; }
        var P = targetScreen(i, click[i]);
        // Pops up off the click point -- or down, when the target sits at the top of the frame.
        var lift = chipH * 1.15 * (P.y - chipH * 1.15 < chipH ? -1 : 1);
        var x, y, sc;
        if (dt < POP) {
          var e = sPop(dt / POP);
          x = P.x; y = P.y - lift * out3(dt / POP); sc = Math.max(0, e);
        } else {
          var q = clamp01((dt - POP) / FLY), f = inOut3(q);
          // The arc's apex never leaves the frame (the bezier stays inside its control hull).
          var ax = P.x, ay = P.y - lift, mx = (ax + CTX) / 2, my = Math.max(chipH, Math.min(ay, CTY) - ARC);
          var u = 1 - f;
          x = u * u * ax + 2 * u * f * mx + f * f * CTX;
          y = u * u * ay + 2 * u * f * my + f * f * CTY;
          sc = 1 - (1 - CLAND) * inOut3((q - 0.6) / 0.4);
        }
        c.style.visibility = 'inherit';
        c.style.zIndex = String(10 + i);
        // Centred on (x, y): the pill's own size is left to its text and font.
        c.style.transform = 'translate(' + x.toFixed(2) + 'px,' + y.toFixed(2) + 'px) translate(-50%,-50%) scale(' + sc.toFixed(4) + ')';
      });
      // Captions: ride the stop's box; in from arrive - 0.14 (0.3 s), out from leave - 0.06 (0.18 s).
      caps.forEach(function (c, i) {
        if (!c) return;
        var it = stopItems[i], cur = it.cur;
        var lv = i === N - 1 ? (cover ? ZAT : Infinity) : leave[i];
        var a = out2((t - (arrive[i] - 0.14)) / 0.3), b = clamp01((t - (lv - 0.06)) / 0.18), o = a * (1 - b);
        if (!cur || o <= 0.001 || smashing || it.el.style.visibility === 'hidden') { c.style.visibility = 'hidden'; return; }
        var top = cur.top - 0.012 * RH - capH, left = cur.left;
        // No room above (a tall stop fills the height): the pill straddles the top edge, inset like a tab.
        if (top < 0.045 * RH) { top = cur.top - capH / 2; left = cur.left + capFs * 0.9; }
        top += (1 - a) * capFs * 0.6 - b * capFs * 0.4;
        c.style.visibility = 'inherit';
        c.style.opacity = o.toFixed(3);
        c.style.transform = 'translate(' + left.toFixed(2) + 'px,' + top.toFixed(2) + 'px)';
      });
      // Drops: pop in at their point, hold, fly the chip's arc to chip_to, gone.
      drops.forEach(function (d, j) {
        var c = d.el, dt = t - d.at;
        if (dt < 0 || t > d.land + CHOLD + 1e-3) { c.style.visibility = 'hidden'; return; }
        var P = d.P, x, y, sc;
        if (dt < POP) { x = P.x; y = P.y + dropH * 0.4 * (1 - out3(dt / POP)); sc = Math.max(0, sPop(dt / POP)); }
        else if (dt < POP + DHOLD) { x = P.x; y = P.y; sc = 1; }
        else {
          var q = clamp01((dt - POP - DHOLD) / FLY), f = inOut3(q);
          var mx = (P.x + CTX) / 2, my = Math.max(dropH, Math.min(P.y, CTY) - ARC), u = 1 - f;
          x = u * u * P.x + 2 * u * f * mx + f * f * CTX;
          y = u * u * P.y + 2 * u * f * my + f * f * CTY;
          sc = 1 - (1 - CLAND) * inOut3((q - 0.6) / 0.4);
        }
        c.style.visibility = 'inherit';
        c.style.zIndex = String(30 + j);
        c.style.transform = 'translate(' + x.toFixed(2) + 'px,' + y.toFixed(2) + 'px) translate(-50%,-50%) scale(' + sc.toFixed(4) + ')';
      });
      // Cursor: position, press and ring from the last click.
      if (cursor) {
        var vis = t >= AT - 1e-4 && t < cExit && !smashing;
        var cp = cursorAt(t);
        var last = -1; for (var i = 0; i < N; i++) if (t >= click[i]) last = i;
        var dtc = last >= 0 ? t - click[last] : 1;
        var press = dtc < 0.12 ? 1 - 0.15 * Math.sin(Math.PI * dtc / 0.12) : 1;
        gsap.set(cursor, { x: cp.x - tipX, y: cp.y - tipY, scale: press, autoAlpha: vis ? 1 : 0 });
        if (ring) {
          var rp = dtc / 0.42;
          if (last >= 0 && rp <= 1) gsap.set(ring, { autoAlpha: 0.8 * (1 - out2(rp)), scale: 0.25 + 1.3 * out2(rp) });
          else gsap.set(ring, { autoAlpha: 0, scale: 0.25 });
        }
      }
    }

    var END = Math.max(num(ctx && ctx.duration, 0), SETTLE + 0.5, land[N - 1] + 0.1);
    drops.forEach(function (d) { END = Math.max(END, d.land + CHOLD + 0.1); });
    var st = { t: 0 };
    tl.to(st, { t: END, duration: END, ease: 'none' }, 0);
    tl.eventCallback('onUpdate', function () { render(st.t); });
    render(0);
    return tl;
  }
</script>
