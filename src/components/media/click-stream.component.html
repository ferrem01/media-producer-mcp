<style scoped>
  /* CLICK STREAM: a hand working through the internet. Web content rushes
     past (a strip of pieces sliding sideways while the camera pulls back and
     pushes in again); it STOPS on a piece, the cursor clicks one thing on it,
     and the click throws a purple event chip across the frame to a landing
     point (where the film's activity feed receives it as a new row). Five to
     seven stops, each shorter than the last. Nothing fades or blurs: pieces
     move, scale and get covered. Every style is a pure function of the time,
     and the click / landing schedule is published on the root. */

        var hl = it.hl, dt = t - click[i];
        if (dt < 0 || dt > 0.5) { hl.style.visibility = 'hidden'; return; }
        var k = (it === lastIt && cover) ? lastRect(t).k : it.k * (t >= leave[i] ? s : 1);
        var th = Math.min(it.t.w, it.t.h) * k;
        var e = out2(dt / 0.5);
        var press = dt < 0.12 ? 1 - 0.05 * Math.sin(Math.PI * dt / 0.12) : 1;
        hl.style.visibility = 'inherit';
        hl.style.borderRadius = (th * 0.32).toFixed(2) + 'px';
        hl.style.background = 'rgba(' + chipRGB + ',' + (0.2 * (1 - e)).toFixed(3) + ')';
        hl.style.boxShadow = '0 0 0 ' + (Math.max(2, th * 0.06) + th * 0.22 * e).toFixed(2) + 'px rgba(' + chipRGB + ',' + (0.55 * (1 - e)).toFixed(3) + ')';
        hl.style.transform = 'scale(' + press.toFixed(4) + ')';
      });
      // Chips: pop out of the click point, fly an arc, land at chip_to, gone.
      stopItems.forEach(function (it, i) {
        var c = chips[i], dt = t - click[i];
        if (dt < 0 || t > land[i] + CHOLD + 1e-3) { c.style.visibility = 'hidden'; return; }
        var P = targetScreen(i, click[i]);
        // Pops up off the click point -- or down, when the target sits at the top of the frame.
        var lift = chipH * 1.15 * (P.y - chipH * 1.15 < chipH ? -1 : 1);
        var x, y, sc;
        if (dt < POP) {
          var e = sPop(dt / POP);
          x = P.x; y = P.y - lift * out3(dt / POP); sc = Math.max(0, e);
        } else {
          var q = clamp01((dt - POP) / FLY), f = inOut3(q);
          // The arc's apex never leaves the frame (the bezier stays inside its control hull).
          var ax = P.x, ay = P.y - lift, mx = (ax + CTX) / 2, my = Math.max(chipH, Math.min(ay, CTY) - ARC);
          var u = 1 - f;
          x = u * u * ax + 2 * u * f * mx + f * f * CTX;
          y = u * u * ay + 2 * u * f * my + f * f * CTY;
          sc = 1 - (1 - CLAND) * inOut3((q - 0.6) / 0.4);
        }
        c.style.visibility = 'inherit';
        c.style.zIndex = String(10 + i);
        // Centred on (x, y): the pill's own size is left to its text and font.
        c.style.transform = 'translate(' + x.toFixed(2) + 'px,' + y.toFixed(2) + 'px) translate(-50%,-50%) scale(' + sc.toFixed(4) + ')';
      });
      // Cursor: position, press and ring from the last click.
      if (cursor) {
        var vis = t >= AT - 1e-4 && t < cExit;
        var cp = cursorAt(t);
        var last = -1; for (var i = 0; i < N; i++) if (t >= click[i]) last = i;
        var dtc = last >= 0 ? t - click[last] : 1;
        var press = dtc < 0.12 ? 1 - 0.15 * Math.sin(Math.PI * dtc / 0.12) : 1;
        gsap.set(cursor, { x: cp.x - tipX, y: cp.y - tipY, scale: press, autoAlpha: vis ? 1 : 0 });
        if (ring) {
          var rp = dtc / 0.42;
          if (last >= 0 && rp <= 1) gsap.set(ring, { autoAlpha: 0.8 * (1 - out2(rp)), scale: 0.25 + 1.3 * out2(rp) });
          else gsap.set(ring, { autoAlpha: 0, scale: 0.25 });
        }
      }
    }

    var END = Math.max(num(ctx && ctx.duration, 0), SETTLE + 0.5, land[N - 1] + 0.1);
    var st = { t: 0 };
    tl.to(st, { t: END, duration: END, ease: 'none' }, 0);
    tl.eventCallback('onUpdate', function () { render(st.t); });
    render(0);
    return tl;
  }
</script>
