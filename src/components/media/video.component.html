<template>
  <div class="video-wrap" id="video-container"></div>
</template>

<style scoped>
  .video-wrap {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
  }
  .video-wrap video {
    width: 100%;
    height: 100%;
    display: block;
  }
</style>

<script>
  function createTimeline(el, data, ctx) {
    var tl = gsap.timeline();
    var container = el.querySelector('#video-container');
    // A clip with alpha (the take as a layer, core/speaker-layer.ts): the
    // wrap must not paint -- its black box would bury whatever lies under.
    if (data.alpha) container.style.background = 'transparent';

    // Set object-fit from data or default to cover
    var fit = data.object_fit || 'cover';
    var style = 'width:100%;height:100%;object-fit:' + fit + ';display:block;';

    var at = Number(data.at);
    var exitAt = Number(data.exit_at);
    var timed = isFinite(at) || isFinite(exitAt);
    if (!isFinite(at) || at < 0) at = 0;
    if (!isFinite(exitAt) || exitAt <= at) exitAt = ctx.duration;

    // Use shared video-sync utility (loaded by scene assembler). A timed
    // clip starts from ITS beginning when it lands: the capture seeks every
    // video to start-at + scene time, so a negative start-at holds it on
    // frame 0 until `at`.
    // start_at: seconds into the source where the clip stands at scene
    // time 0 (the take as a layer plays from its trim, on the base's clock).
    var startAt = Number(data.start_at);
    if (!isFinite(startAt) || startAt < 0) startAt = 0;
    var video = loadVideoForCapture(container, data.src, { style: style, startAt: timed && at > 0 ? -at : startAt });

    if (timed) {
      // A TIMED clip is a cut, not a fade (SPEC-creator-cut.md). Sub-frame
      // tweens, not set(): a set() later in a timeline renders on creation.
      gsap.set(container, { autoAlpha: 0 });
      tl.fromTo(container, { autoAlpha: 0 }, { autoAlpha: 1, duration: 0.02, ease: 'none', immediateRender: false }, at);
      if (exitAt < ctx.duration) tl.to(container, { autoAlpha: 0, duration: 0.02, ease: 'none' }, exitAt);
      return tl;
    }

    // Fade in
    gsap.set(container, { autoAlpha: 0 });
    tl.to(container, { autoAlpha: 1, duration: 0.3, ease: 'power2.out' }, 0);

    // Fade out before scene ends
    if (ctx.duration > 1) {
      tl.to(container, { autoAlpha: 0, duration: 0.3, ease: 'power2.in' }, ctx.duration - 0.3);
    }

    return tl;
  }
</script>
