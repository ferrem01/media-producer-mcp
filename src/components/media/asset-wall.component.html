      var nr = clamp(Math.round(num(data.count, 6)), 3, 12);
      var deck = S.pick(nr, Object.assign({}, opts, { kinds: opts.kinds || ['slide'], brands: opts.brands || (opts.items ? null : ['flowpath']), shuffle: false }));
      var wr = W * (tall ? 0.88 : 0.6);
      var cards = deck.map(function (p) { return card(p, wr); });
      var hr = cards.length ? cards[0].h : wr * 0.5625;
      var place = function (s) {
        cards.forEach(function (c, idx) {
          var d = idx - s, ad = Math.abs(d);
          var lean = d > 0 ? Math.min(d, 3) : Math.max(d, -2);
          gsap.set(c.el, Object.assign(at(W / 2, H / 2), {
            y: -lean * hr * 0.33 + (d < 0 ? hr * 0.25 * Math.min(-d, 1) : 0),
            z: -ad * hr * 0.55,
            rotationX: d > 0 ? Math.min(d, 2.4) * 24 : Math.max(d, -1.2) * -70,
            autoAlpha: d < -1.1 ? 0 : d > 4.5 ? 0 : 1,
            filter: dof(ad * hr * 0.55, 60), zIndex: 100 - Math.round(ad * 10),
          }));
        });
      };
      var st = { s: -0.9 };
      place(st.s);
      tl.to(st, { s: 0, duration: 0.8, ease: 'power3.out', onUpdate: function () { place(st.s); } }, AT);
      var steps = cards.length - 1, per = Math.max(0.5, (SPAN - 1.1) / Math.max(1, steps));
      for (var r = 0; r < steps; r++) {
        (function (r) { tl.to(st, { s: r + 1, duration: per * 0.6, ease: 'power2.inOut', onUpdate: function () { place(st.s); } }, AT + 0.8 + r * per + per * 0.3); })(r);
      }
      gsap.set(plane, { rotationY: -8, transformOrigin: '50% 50%' });
      tl.to(plane, { rotationY: 6, duration: SPAN, ease: 'sine.inOut' }, AT);
    } else if (layout === 'fly') {
      // WORK FLYING AT THE CAMERA: pieces come out of the deep at angles,
      // grow, sharpen, rush past the lens and are gone -- a stream of work.
      var nf = clamp(Math.round(num(data.count, 24)), 4, 48);
      var flies = S.pick(nf, opts), travel = clamp(num(data.travel, 3.2), 1.2, 8) / Math.max(0.25, SPEED || 1);
      // Already in flight on the first frame: the stream starts a wave early.
      var lead = travel * 0.75, gapF = Math.max(0.06, (SPAN + lead - travel * 0.4) / nf);
      flies.forEach(function (p, q) {
        var c = card(p, M * (p.ratio < 0.7 ? 0.62 : 0.4));
        // Lanes round the centre (clear of a headline), never dead centre.
        var ang = q * 2.39996 + rnd() * 0.6, rad = M * (0.3 + rnd() * 0.42);
        var x0 = Math.cos(ang) * rad * (W / M) * 0.8, y0 = Math.sin(ang) * rad * 0.8;
        var ry = (x0 > 0 ? -1 : 1) * (12 + rnd() * 22), rx = (y0 > 0 ? 1 : -1) * (6 + rnd() * 14);
        var t0 = AT - lead + q * gapF;
        var proxy = { t: 0 };
        var setAt = function (u) {
          var z = -M * 4.2 + u * M * 4.8;
          gsap.set(c.el, Object.assign(at(W / 2, H / 2), {
            x: x0 * (0.45 + u * 0.9), y: y0 * (0.45 + u * 0.9), z: z, rotationY: ry * (1 - u * 0.4), rotationX: rx * (1 - u * 0.4),
            rotation: (q % 2 ? 1 : -1) * 3, autoAlpha: u < 0.06 ? u / 0.06 : u > 0.94 ? (1 - u) / 0.06 : 1,
            filter: z > M * 0.15 ? 'blur(' + Math.min(9, (z - M * 0.15) / 60).toFixed(2) + 'px)' : z < -M * 2.6 ? 'blur(' + Math.min(4, (-M * 2.6 - z) / 200).toFixed(2) + 'px)' : 'blur(0px)',
          }));
        };
        setAt(0);
        if (t0 < 0) { proxy.t = Math.min(1, -t0 / travel); setAt(proxy.t); }
        if (proxy.t < 1) tl.to(proxy, { t: 1, duration: travel * (1 - proxy.t), ease: 'none', onUpdate: function () { setAt(proxy.t); } }, Math.max(0, t0));
      });
    } else if (layout === 'orbit') {
      // Round a person: pieces float in the side columns (bands on a tall
      // frame), clear of the face, turned a little towards the middle,
      // bobbing out of phase so the collage breathes.
      var n = clamp(Math.round(num(data.count, tall ? 4 : 6)), 2, 10);
      var po = S.pick(n, opts), slots = [];
      if (tall) {
        var perBand = Math.ceil(n / 2);
        for (var a = 0; a < n; a++) { var top = a < perBand, iT = top ? a : a - perBand, cnt = top ? perBand : n - perBand;
          slots.push({ cx: W * (0.5 + (iT - (cnt - 1) / 2) * (0.9 / cnt)), cy: top ? H * 0.17 : H * 0.82, w: W * 0.9 / cnt, h: H * 0.28, ry: 0 }); }
      } else {
        var left = Math.ceil(n / 2);
        for (var b = 0; b < n; b++) { var L = b < left, iS = L ? b : b - left, cS = L ? left : n - left;
          slots.push({ cx: W * (L ? 0.15 + (iS % 2) * 0.05 : 0.85 - (iS % 2) * 0.05), cy: H * (0.5 + (iS - (cS - 1) / 2) * (0.92 / cS)), w: W * 0.22, h: H * 0.92 / cS * 1.05, ry: L ? 18 : -18 }); }
      }
      po.forEach(function (p, q) {
        var s = slots[q], ratio = p.ratio > 0 ? p.ratio : 0.75, wq = Math.min(s.w, s.h / ratio), c = card(p, wq);
        gsap.set(c.el, Object.assign(at(s.cx, s.cy), { rotationY: s.ry, rotation: (q % 2 ? 1 : -1) * (2 + rnd() * 3), z: -rnd() * M * 0.2, autoAlpha: 0, y: H * 0.05 }));
        tl.to(c.el, { autoAlpha: 1, y: 0, duration: 0.8, ease: 'power3.out' }, AT + q * 0.12);
        var bob = 2.2 + rnd(), reps = Math.max(0, Math.floor((SPAN - 0.9) / bob) - 1);
        if (reps > 0) tl.to(c.el, { y: -H * 0.014, rotationY: s.ry * 0.6, duration: bob, ease: 'sine.inOut', yoyo: true, repeat: reps }, AT + 0.9 + rnd() * 0.4);
      });
    } else if (layout === 'fan') {
      // A stack that fans open in 3D.
      var nn = clamp(Math.round(num(data.count, 5)), 3, 7);
      var pf = S.pick(nn, Object.assign({}, opts, { kinds: opts.kinds || ['slide'] })), wf = W * (tall ? 0.8 : 0.5);
      pf.forEach(function (p, f) {
        var c = card(p, wf), off = f - (nn - 1) / 2;
        gsap.set(c.el, Object.assign(at(W / 2, H / 2), { autoAlpha: 0, z: -f * 40, zIndex: nn - f }));
        tl.to(c.el, { autoAlpha: 1, duration: 0.3 }, AT + f * 0.05);
        tl.to(c.el, { rotationY: -18, rotationX: 6, x: off * wf * (tall ? 0.08 : 0.16), y: off * -wf * 0.03, z: -Math.abs(off) * wf * 0.12, duration: 1.2, ease: 'power3.inOut' }, AT + 0.35);
        tl.to(c.el, { rotationY: -10, duration: Math.max(1, SPAN - 1.6), ease: 'sine.inOut' }, AT + 1.55);
      });
    } else if (layout === 'scroll' || layout === 'feed') {
      // SCROLL: full-length emails and blog pages standing in columns on a
      // plane turned in 3D, each column scrolling at its own pace, the next
      // one the other way -- the whole piece read top to bottom, many at
      // once. FEED: social posts in their platform frames rising in columns,
      // each at its own depth, near and far ones out of focus.
      var feed = layout === 'feed';
      var nc = clamp(Math.round(num(data.count, feed ? (tall ? 2 : 4) : (tall ? 3 : 5))), 1, 8);
      var spread = W * (feed ? (tall ? 1.2 : 1.25) : (tall ? 1.5 : 1.45)), gapS = M * 0.035;
      var colW = spread / nc - gapS, need = H * 2.6;
      var pool = S.pick(nc * 10, Object.assign({}, opts, { kinds: opts.kinds || (feed ? ['social'] : ['email', 'blog']) })), pi = 0;
      var travel = H * (feed ? 0.75 : 0.6) * (SPEED || 1);
      var cols2 = [];
      for (var ci = 0; ci < nc; ci++) {
        var off = ci - (nc - 1) / 2, col = document.createElement('div'); col.className = 'aw-col'; plane.appendChild(col);
        cols2.push({ el: col, off: off, z: feed ? 0 : -Math.abs(off) * M * 0.16 + M * 0.04, y: -H * 0.75 + (ci % 2) * colW * 0.45, made: 0 });
      }
      // Dealt row by row across the columns, so neighbours never show the
      // same piece side by side.
      for (var busy = true; busy;) {
        busy = false;
        cols2.forEach(function (cl) {
          if (cl.y >= need - H * 0.75 || cl.made >= 12) return;
          busy = true;
          var pc = pool[pi++ % pool.length], wc = colW * (feed ? 0.9 + rnd() * 0.1 : 1);
          var it = feed && pc.kind === 'social' ? post(pc, wc, cl.el) : card(pc, wc, cl.el);
          var pz = feed ? (rnd() - 0.6) * M * 0.45 : 0;
          gsap.set(it.el, Object.assign(at(0, cl.y + it.h / 2), { z: pz, rotation: feed ? (rnd() - 0.5) * 4 : 0, filter: dof(feed ? pz : cl.z, feed ? 120 : 140) }));
          cl.y += it.h + gapS * (feed ? 1.6 : 1); cl.made++;
        });
      }
      cols2.forEach(function (cl, ci) {
        var dir = feed ? -1 : (ci % 2 ? 1 : -1), pace = 0.82 + rnd() * 0.36;
        gsap.set(cl.el, { x: W / 2 + cl.off * (colW + gapS), y: dir > 0 ? -travel * pace : 0, z: cl.z });
        tl.to(cl.el, { y: dir > 0 ? 0 : -travel * pace, duration: SPAN, ease: 'none' }, AT);
      });
      gsap.set(plane, feed ? { rotationX: 14, rotationY: 12, rotation: 3, z: -M * 0.12, transformOrigin: '50% 50%' }
        : { rotationX: 18, rotationY: -16, rotation: -5, z: -M * 0.15, transformOrigin: '50% 50%' });
      tl.to(plane, feed ? { rotationY: 6, z: M * 0.04, duration: SPAN, ease: 'sine.inOut' } : { rotationY: -9, z: M * 0.04, duration: SPAN, ease: 'sine.inOut' }, AT);
    } else {
      // GRID: the same piece for many brands -- "50 personalised decks" --
      // each card flipping in edge-on, in a wave, the plane leaning back.
      var ng = clamp(Math.round(num(data.count, tall ? 8 : 9)), 4, 16);
      var pg = S.pick(ng, Object.assign({}, opts, { kinds: opts.kinds || ['slide', 'landing'] }));
      var colsG = tall ? 2 : (ng > 9 ? 4 : 3), rowsG = Math.ceil(ng / colsG);
      var gap = M * 0.025, pad = M * 0.06, band = headBox ? H * (tall ? 0.12 : 0.17) : 0, rg = 0.5625;
      var wg = Math.min((W - 2 * pad - (colsG - 1) * gap) / colsG, ((H - band - 2 * pad - (rowsG - 1) * gap) / rowsG) / rg);
      var hg = wg * rg, x0g = (W - (colsG * wg + (colsG - 1) * gap)) / 2, y0g = band + (H - band - (rowsG * hg + (rowsG - 1) * gap)) / 2;
      pg.forEach(function (p, g2) {
        var cx = g2 % colsG, cy = Math.floor(g2 / colsG), c = card(Object.assign({}, p, { ratio: rg }), wg);
        gsap.set(c.el, Object.assign(at(x0g + cx * (wg + gap) + wg / 2, y0g + cy * (hg + gap) + hg / 2), { autoAlpha: 0, rotationY: -80, z: -M * 0.3 }));
        tl.to(c.el, { autoAlpha: 1, rotationY: 0, z: 0, duration: 0.7, ease: 'power3.out' }, AT + (cx + cy) * 0.1);
      });
      gsap.set(plane, { rotationX: 8, transformOrigin: '50% 60%' });
      tl.to(plane, { rotationX: 2, duration: SPAN, ease: 'sine.inOut' }, AT);
      if (headBox) { head.style.top = (band * 0.55 + pad * 0.3) + 'px'; head.style.fontSize = Math.round(Math.min(band * 0.5, M * 0.065)) + 'px'; }
    }

    if (head.textContent) {
      gsap.set(head, { autoAlpha: 0, y: H * 0.02 });
      tl.to(head, { autoAlpha: 1, y: 0, duration: 0.7, ease: 'power3.out' }, AT + num(data.headline_at, 0.35));
    }
    return tl;
  }
