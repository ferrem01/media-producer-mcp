<template>
  <div class="scr-root">
    <div class="scr-rail"></div>
    <div class="scr-caps"></div>
  </div>
</template>

<style scoped>
  /* SCREEN CAROUSEL: a product flow as a rail of 2-6 app screens. The
     screen in the centre is primary; its neighbours recede to the sides; on
     each cue the rail advances one screen and the caption under it swaps.
     Screens sit in a browser window, a phone, or bare. Sized from the box. */
  .scr-root, .scr-root * { max-width: none; }
  .scr-root { --u: 1px; position: absolute; inset: 0; overflow: hidden; font-family: var(--mp-font-family, 'Inter', system-ui, sans-serif); }
  .scr-root.t-light { --ink: var(--mp-color-on-light, #17171c); --mute: color-mix(in srgb, var(--mp-color-on-light, #17171c) 62%, #ffffff); --chrome: #ffffff; --chrome-line: rgba(20, 20, 40, 0.10); --bar: #f1f1f5; }
  .scr-root.t-dark { --ink: #ffffff; --mute: rgba(255, 255, 255, 0.7); --chrome: #1d1e26; --chrome-line: rgba(255, 255, 255, 0.10); --bar: #26272f; }
  .scr-rail { position: absolute; left: 0; right: 0; top: 0; }
  .scr-item { position: absolute; left: 0; top: 0; transform-origin: 50% 50%; }
  .scr-dev { position: relative; width: 100%; height: 100%; box-sizing: border-box; overflow: hidden; background: var(--chrome);
    border: 1px solid var(--chrome-line); border-radius: calc(var(--u) * 18);

  .scr-bar { height: calc(var(--u) * 40); background: var(--bar); display: flex; align-items: center; gap: calc(var(--u) * 8); padding: 0 calc(var(--u) * 16); border-bottom: 1px solid var(--chrome-line); }
  .scr-bar i { width: calc(var(--u) * 12); height: calc(var(--u) * 12); border-radius: 50%; background: #d4d4dc; display: block; }
  .scr-bar b { margin-left: calc(var(--u) * 14); flex: 1; max-width: 50%; height: calc(var(--u) * 22); border-radius: 999px; background: var(--chrome); border: 1px solid var(--chrome-line);
    font-size: calc(var(--u) * 13); font-weight: 500; color: var(--mute); display: flex; align-items: center; padding: 0 calc(var(--u) * 12); overflow: hidden; white-space: nowrap; }
  .scr-shot { position: absolute; left: 0; right: 0; bottom: 0; top: calc(var(--u) * 40); background-size: cover; background-position: center top; background-color: var(--bar);
    display: flex; align-items: center; justify-content: center; }
  .scr-root.dev-phone .scr-dev { border-radius: calc(var(--u) * 46); border: calc(var(--u) * 10) solid #111116; }
  .scr-root.dev-phone .scr-bar { display: none; }
  .scr-root.dev-phone .scr-shot { top: 0; border-radius: calc(var(--u) * 36); }
  .scr-root.dev-phone .scr-dev::after { content: ''; position: absolute; top: calc(var(--u) * 12); left: 50%; width: 30%; height: calc(var(--u) * 24); transform: translateX(-50%); border-radius: 999px; background: #111116; }
  .scr-root.dev-none .scr-bar { display: none; }
  .scr-root.dev-none .scr-shot { top: 0; }

  .scr-cap { position: absolute; left: 0; right: 0; top: 0; text-align: center; padding: 0 6%; }

<script>
  function createTimeline(el, data, ctx) {
    var tl = gsap.timeline();
    var q = function (s) { return el.querySelector(s); };
    var root = q('.scr-root'), rail = q('.scr-rail'), caps = q('.scr-caps');
    var DUR = (ctx && ctx.duration) || 6;
    var screens = (Array.isArray(data.screens) ? data.screens : []).map(function (s) { return typeof s === 'string' ? { src: s } : (s || {}); }).slice(0, 8);
    if (!screens.length) return tl;
    var n = screens.length;

    var gl = window.mpGroundLum ? mpGroundLum() : null;
    root.classList.add('t-' + (data.theme === 'dark' || data.theme === 'light' ? data.theme : (typeof gl === 'number' && gl < 0.18 ? 'dark' : 'light')));
    var W0 = el.clientWidth || 1200, H0 = el.clientHeight || 700;
    var device = data.device === 'phone' || data.device === 'none' || data.device === 'browser' ? data.device : (H0 > W0 * 1.1 ? 'phone' : 'browser');
    root.classList.add('dev-' + device);

    // Visible area (a full-frame slot overhangs the frame).
    var rc = el.getBoundingClientRect(), sc = rc.width / W0 || 1;
    var ox = Math.max(0, -rc.left, rc.right - window.innerWidth) / sc, oy = Math.max(0, -rc.top, rc.bottom - window.innerHeight) / sc;
    var W = W0 - 2 * ox, H = H0 - 2 * oy;
    var hasCaps = screens.some(function (s) { return s.title || s.caption; });
    // Screen aspect (w/h): a browser window 16:10.5, a phone 9:19.5, bare 16:10 (or data.aspect).
    var aspect = Number(data.aspect) || (device === 'phone' ? 9 / 19.5 : device === 'browser' ? 16 / 10.5 : 16 / 10);
    var capH = hasCaps ? H * 0.2 : 0, dotsH = H * 0.06;
    var availH = H * 0.92 - capH - dotsH;
    // A tall frame gives the centre screen most of the width (neighbours peek).
    var tallBox = H > W * 1.1;
    var sh = Math.min(availH, (W * (device === 'phone' ? (tallBox ? 0.62 : 0.3) : (tallBox ? 0.8 : 0.62))) / aspect), sw = sh * aspect;
    // Type follows the frame, not the screen (a small screen still gets video-size captions).
    var u = tallBox ? W / 820 : Math.min(W / 1500, H / 850);
    root.style.setProperty('--u', u.toFixed(3) + 'px');
    var top = oy + (H - (sh + capH + dotsH)) / 2 + H * 0.02;
    rail.style.top = top + 'px'; rail.style.height = sh + 'px';

    var items = screens.map(function (s, i) {
      var it = document.createElement('div'); it.className = 'scr-item';
      it.style.width = sw + 'px'; it.style.height = sh + 'px';
      it.innerHTML = '<div class="scr-dev"><div class="scr-bar"><i></i><i></i><i></i><b></b></div><div class="scr-shot"></div></div>';
      it.querySelector('b').textContent = s.url || data.url || '';
      if (!(s.url || data.url)) it.querySelector('b').style.visibility = 'hidden';
      var shot = it.querySelector('.scr-shot');
      if (s.src) {
        shot.style.backgroundImage = 'url("' + String(s.src).replace(/"/g, '%22') + '")';
        var im = new Image(); im.src = String(s.src); im.style.cssText = 'position:absolute;width:1px;height:1px;opacity:0'; it.appendChild(im);
      } else {
        var ph = document.createElement('div'); ph.className = 'scr-ph'; ph.textContent = s.title || ('Screen ' + (i + 1)); shot.appendChild(ph);
      }
      rail.appendChild(it);
      return it;
    });
    var capEls = screens.map(function (s) {
      var c = document.createElement('div'); c.className = 'scr-cap';
      c.innerHTML = '<h4></h4><p></p>';
      c.querySelector('h4').textContent = s.title || '';
      c.querySelector('p').textContent = s.caption || '';
      caps.appendChild(c);
      return c;
    });
    caps.style.top = (top + sh + H * 0.045) + 'px';
    // Captions shrink until the longest fits its band.
    if (hasCaps) {
      for (var k = 0; k < 20; k++) {
        var tall = Math.max.apply(null, capEls.map(function (c) { return c.offsetHeight; }));
        if (tall <= capH * 0.95) break;
        u *= 0.94; root.style.setProperty('--u', u.toFixed(3) + 'px');
      }
    }
    var dots = document.createElement('div'); dots.className = 'scr-dots';
    for (var d = 0; d < n; d++) dots.appendChild(document.createElement('i'));
    dots.style.top = (top + sh + capH + H * 0.03) + 'px';
    if (n > 1 && data.dots !== false) root.appendChild(dots);

    // Rail geometry: the centre screen at full size, neighbours receded.
    var cx = ox + W / 2, gapX = sw * (device === 'phone' ? 0.95 : 0.8);
    var st = { idx: 0, a: 0 };
    function apply() {
      items.forEach(function (it, i) {
        var o = i - st.idx, ao = Math.abs(o);
        var scale = 1 - Math.min(ao, 2) * 0.17;
        var x = cx + o * gapX * (1 - Math.min(ao, 2) * 0.08) - sw / 2;
        var op = ao >= 2.2 ? 0 : 1 - Math.min(ao, 1.6) * 0.42;
        gsap.set(it, { x: x, y: (1 - st.a) * 30, scale: scale, autoAlpha: op * st.a, zIndex: 100 - Math.round(ao * 10) });
        it.style.filter = ao > 0.05 ? 'saturate(' + (1 - Math.min(ao, 1) * 0.35).toFixed(2) + ')' : 'none';
      });
      capEls.forEach(function (c, i) {
        var ao = Math.abs(i - st.idx);
        var v = Math.max(0, 1 - ao * 2.2) * st.a;
        c.style.opacity = v; c.style.transform = 'translateY(' + ((1 - v) * 12).toFixed(1) + 'px)';
      });
      Array.prototype.forEach.call(dots.children, function (dt, i) { dt.classList.toggle('on', Math.round(st.idx) === i); });
    }

    // MOTION: the rail rises in on the first screen, then advances one screen
    // per cue (screens[i].at, else evenly through the scene).
    var AT = Number(data.at) || 0.2;
    tl.to(st, { a: 1, duration: 0.6, ease: 'power3.out' }, AT);
    var span = DUR - AT - 1.2;
    for (var i = 1; i < n; i++) {
      var at = screens[i].at !== undefined ? Number(screens[i].at) : AT + 0.6 + (span * i) / n;
      tl.to(st, { idx: i, duration: 0.8, ease: 'power3.inOut' }, at);
    }
    tl.to({}, { duration: 0.01 }, DUR - 0.01);
    tl.eventCallback('onUpdate', apply);
    apply();
    return tl;
  }
</script>
