<script>
  function createTimeline(el, data, ctx) {
    var tl = gsap.timeline();
    var player = el.querySelector('.video-player');
    var viewport = el.querySelector('.video-viewport');
    var playBtn = el.querySelector('.play-button');
    var playRing = el.querySelector('.play-ring');
    var progressFill = el.querySelector('.progress-fill');
    var progressKnob = el.querySelector('.progress-knob');
    var titleEl = el.querySelector('.video-title');
    var totalTime = el.querySelector('.time-total');

    if (data.title) titleEl.textContent = data.title;
    if (data.duration) totalTime.textContent = data.duration;
    else totalTime.textContent = '3:24';

    if (data.thumbnail_color) {
      viewport.style.background = 'linear-gradient(135deg, ' + data.thumbnail_color + '33 0%, ' + data.thumbnail_color + '11 100%)';
    }

    var speed = ctx.motion === 'minimal' ? 0.5 : ctx.motion === 'punchy' ? 0.7 : 1.0;

    // Initial state
    gsap.set(player, { autoAlpha: 0, scale: 0.92, y: 30, filter: 'blur(4px)' });
    gsap.set(playBtn, { scale: 0.6, autoAlpha: 0 });
    gsap.set(playRing, { scale: 0.4, autoAlpha: 0 });

    // Entrance
    tl.to(player, {
      autoAlpha: 1, scale: 1, y: 0, filter: 'blur(0px)',
      duration: speed,
      ease: 'power3.out'
    }, 0.3);

    // Play button appears
    tl.to(playBtn, {
      scale: 1, autoAlpha: 1,
      duration: speed * 0.7,
      ease: 'back.out(1.6)'
    }, 0.3 + speed * 0.4);

    // Ring pulse
    tl.to(playRing, {
      scale: 1, autoAlpha: 1,
      duration: speed * 0.6,
      ease: 'power2.out'
    }, 0.3 + speed * 0.5);

    tl.to(playRing, {
      scale: 1.4, autoAlpha: 0,
      duration: 1.2,
      ease: 'power1.out',
      repeat: 1
    }, 0.3 + speed);

    // Progress bar animation
    var progDuration = Math.max(ctx.duration - 2, 1.5);
    tl.to(progressFill, {
      width: '65%',
      duration: progDuration,
      ease: 'none'
    }, 0.3 + speed);

    tl.to(progressKnob, {
      left: '65%',
      duration: progDuration,
      ease: 'none'
    }, 0.3 + speed);

    // Exit
    if (ctx.duration > 2) {
      var exitAt = ctx.duration - 0.7;
      tl.to(player, {
        autoAlpha: 0, scale: 0.96, y: -15,
        duration: 0.5,
        ease: 'power2.in'
      }, exitAt);
    }

    return tl;
  }
</script>
