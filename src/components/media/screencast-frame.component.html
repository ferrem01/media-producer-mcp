<script>
  function createTimeline(el, data, ctx) {
    var tl = gsap.timeline();
    var stage = el.querySelector('.scf-stage');
    var frame = el.querySelector('.scf-frame');
    var chrome = el.querySelector('.scf-chrome');
    var viewport = el.querySelector('.scf-viewport');
    var media = el.querySelector('.scf-media');

    var isFloat = data.presentation === 'float';
    // Float: no chrome bar -- the footage IS the object; 'plain' geometry.
    // 'phone' survives float (a floating device is a first-class object).
    var frameStyle = data.frame_style === 'phone' ? 'phone'
      : (isFloat ? 'plain' : (data.frame_style || 'plain')); // none | plain | macos-browser | phone
    var isPhone = frameStyle === 'phone';
    if (isPhone) frame.classList.add('is-phone');
    if (isPhone && data.island === false) { var isl = el.querySelector('.scf-island'); if (isl) isl.style.display = 'none'; }
    var isImage = !data.video_url && data.image_url;

    // Image mode: swap the (empty-src) video for an <img> with identical
    // crop/overscan behavior. Videos are markup-only; images are fair game.
    if (isImage) {
      var img = document.createElement('img');
      img.className = media.className;
      img.src = data.image_url;
      media.parentNode.replaceChild(img, media);
      media = img;
    } else if (!data.video_url) {
      media.removeAttribute('src'); // no source at all: keep an empty dark frame
    }
    if (!isImage && data.video_start_at) {
      media.setAttribute('data-start-at', String(data.video_start_at));
    }

    // ── Crop resolution ──
    // data.crop is either an object {top,bottom,left,right} in SOURCE pixels
    // (the assembler resolves crop:"auto" from the asset's ingest analysis)
    // or still "auto" when no sidecar existed at assembly -- then we try the
    // sidecar over HTTP and fall back to no crop.
    function normCrop(c) {
      c = c && typeof c === 'object' ? c : {};
      return {
        top: Math.max(0, Number(c.top) || 0),
        bottom: Math.max(0, Number(c.bottom) || 0),
        left: Math.max(0, Number(c.left) || 0),
        right: Math.max(0, Number(c.right) || 0)
      };
    }
    var crop = normCrop(data.crop === 'auto' ? null : data.crop);
    if (data.crop === 'auto' && data.video_url && typeof fetch === 'function') {
      try {
        fetch(data.video_url + '.intel.json').then(function (r) { return r.ok ? r.json() : null; }).then(function (intel) {
          if (intel && intel.trims) {
            crop = normCrop({
              top: intel.trims.top.px, bottom: intel.trims.bottom.px,
              left: intel.trims.left.px, right: intel.trims.right.px
            });
            layout();
          }
        }).catch(function () {});
      } catch (e) {}
    }

    // ── Geometry ──
    // The frame is sized so the whole window (chrome bar + viewport) fits the
    // component box; the viewport takes the CONTENT box's aspect; the media
    // overscans the viewport by the crop amounts so the source's own chrome /
    // letterbox sits outside the clip. All values are proportional, so the
    // math holds at any frame size.
    var centerFloat = null; // assigned by the float rig; layout() re-runs it
    function layout() {
      var srcW = 1920, srcH = 1080;
      if (!isImage && media.videoWidth) { srcW = media.videoWidth; srcH = media.videoHeight; }
      else if (isImage && media.naturalWidth) { srcW = media.naturalWidth; srcH = media.naturalHeight; }
      var cw = Math.max(1, srcW - crop.left - crop.right);
      var chh = Math.max(1, srcH - crop.top - crop.bottom);
      var ar = cw / chh;

      var stageBox = stage.getBoundingClientRect();
      if (stageBox.width < 4 || stageBox.height < 4) return;
      var full = frameStyle === 'none';
      var maxWPct = full ? 100 : Math.min(100, Math.max(8, Number(data.max_width_pct) || (isPhone ? 26 : isFloat ? 72 : 90)));
      var padV = full ? 1.0 : (isFloat || isPhone ? 0.8 : 0.94);

      var frameW = stageBox.width * (maxWPct / 100);
      var chromeH = frameStyle === 'macos-browser' ? Math.min(64, Math.max(40, frameW * 0.034)) : 0;
      var maxH = stageBox.height * padV;
      if (frameW / ar + chromeH > maxH) frameW = Math.max(1, (maxH - chromeH) * ar);
      chromeH = frameStyle === 'macos-browser' ? Math.min(64, Math.max(40, frameW * 0.034)) : 0;

      var radius = full ? 0 : (data.corner_radius === undefined ? (isPhone ? 44 : 16) : Math.max(0, Number(data.corner_radius) || 0));
      frame.style.width = frameW + 'px';
      frame.style.borderRadius = radius + 'px';
      if (full || data.shadow === false) frame.style.boxShadow = 'none';

      if (frameStyle === 'macos-browser') {
        chrome.style.display = 'flex';
        chrome.style.height = chromeH + 'px';
        chrome.style.fontSize = Math.max(12, chromeH * 0.36) + 'px';
        if (!data.url_text) { var u = chrome.querySelector('.scf-url'); if (u) u.style.visibility = 'hidden'; }
      } else {
        chrome.style.display = 'none';
      }

      viewport.style.aspectRatio = cw + ' / ' + chh;
      media.style.width = (srcW / cw) * 100 + '%';
      media.style.left = (-crop.left / cw) * 100 + '%';
      media.style.top = (-crop.top / chh) * 100 + '%';
      layoutCallouts();
      if (centerFloat) centerFloat();
    }

    // ── Region callouts: [{at, dur?, x, y, w, h}] (% of the displayed
    // content box). A cropped duplicate of the footage lifts toward the
    // camera in a gradient-glow shell while the base dims (the launch-film
    // "3D callout"). The clone copies the stamped attrs (src, data-mp-edl,
    // data-start-at), so the render's frame swap and the preview's EDL
    // runtime drive it exactly like the base media.
    var callouts = (Array.isArray(data.callouts) ? data.callouts : []).map(function (c) {
      return {
        at: Math.max(0.2, Number(c.at) || 0),
        dur: Math.max(3, Number(c.dur) || 5),
        travel: Number(c.travel) || 0,
        x: Math.min(95, Math.max(0, Number(c.x) || 0)),
        y: Math.min(95, Math.max(0, Number(c.y) || 0)),
        w: Math.min(100, Math.max(5, Number(c.w) || 30)),
        h: Math.min(100, Math.max(5, Number(c.h) || 30)),
      };
    }).filter(function (c) { return c.at < (ctx.duration || 1e9) - 2; });
    // Dim OVERLAY, not a filter: tweening `filter` on the frame re-composites
    // the live <video> layer (filter + 3D transform + box-reflect) and
    // Chromium drops it to BLACK for the duration. A translucent panel above
    // the footage never touches the video's layer.
    var dimEl = null;
    var wrap3d = null;
    if (callouts.length) {
      dimEl = document.createElement('div');
      dimEl.style.cssText = 'position:absolute;inset:0;background:#05050c;opacity:0;pointer-events:none;z-index:3;border-radius:inherit;';
      frame.appendChild(dimEl);
      // Rings + cards live in PLANE space: this overlay receives the same
      // pose/drift tweens as the frame, so callouts tilt with the footage.
      wrap3d = document.createElement('div');
      wrap3d.className = 'scf-3d';
      stage.appendChild(wrap3d);
    }
    var calloutEls = callouts.map(function () {
      var card = document.createElement('div'); card.className = 'scf-callout';
      var clip = document.createElement('div'); clip.className = 'scf-callout-clip';
      var mini = document.createElement('div'); mini.style.cssText = 'position:absolute;';
      var clone = media.cloneNode(true);
      clone.classList.remove('scf-media');
      // Derived mirror of the base media: playback sync must drive it, but
      // editing surfaces (Studio media lane, popovers, EDL audits) must not
      // list it as a second video.
      clone.setAttribute('data-mp-derived', '1');
      mini.appendChild(clone); clip.appendChild(mini); card.appendChild(clip);
      var ring = document.createElement('div'); ring.className = 'scf-callout-ring';
      wrap3d.appendChild(ring);
      wrap3d.appendChild(card);
      return { card: card, clip: clip, mini: mini, clone: clone, ring: ring, from: { x: 0, y: 0, s: 1 } };
    });
    function layoutCallouts() {
      if (!calloutEls.length) return;
      // Re-copy the base media's sync attributes now: the EDL stamp lands on
      // the base during doc parse, which can be AFTER the clone was created
      // -- a clone without data-mp-edl plays raw source time and drifts out
      // of sync with the edited base (shows removed segments).
      calloutEls.forEach(function (e2) {
        var edl = media.getAttribute('data-mp-edl');
        if (edl) e2.clone.setAttribute('data-mp-edl', edl); else e2.clone.removeAttribute('data-mp-edl');
        var sAt = media.getAttribute('data-start-at');
        if (sAt) e2.clone.setAttribute('data-start-at', sAt); else e2.clone.removeAttribute('data-start-at');
        try { e2.clone.muted = true; } catch (eM2) {}
      });
      // UNTRANSFORMED offsets (frame space), not getBoundingClientRect: under
      // the float tilt the client rect is the projected AABB and region math
      // against it drifts. The wrapper mirrors the frame's box + pose, so
      // plane-space coordinates land exactly on the footage.
      var frameW2 = frame.offsetWidth, frameH2 = frame.offsetHeight;
      if (frameW2 < 4) return;
      wrap3d.style.left = frame.offsetLeft + 'px';
      wrap3d.style.top = frame.offsetTop + 'px';
      wrap3d.style.width = frameW2 + 'px';
      wrap3d.style.height = frameH2 + 'px';
      var vpL = viewport.offsetLeft, vpT = viewport.offsetTop;
      var vpW = viewport.offsetWidth, vpH = viewport.offsetHeight;
      callouts.forEach(function (c, i) {
        var elc = calloutEls[i];
        var regW = (c.w / 100) * vpW, regH = (c.h / 100) * vpH;
        // Zoom the region up, capped so the card never dominates the frame.
        var z = Math.min(1.9, Math.max(1.35, Math.min((frameW2 * 0.5) / regW, (frameH2 * 0.55) / regH)));
        var cardW = regW * z, cardH = regH * z;
        var cx = vpL + (c.x / 100) * vpW + regW / 2;
        var cy = vpT + (c.y / 100) * vpH + regH / 2;
        // The lifted card may overhang the plane's edges slightly -- it is
        // off the surface, not clipped by it.
        var left = Math.min(frameW2 - cardW + frameW2 * 0.06, Math.max(-frameW2 * 0.06, cx - cardW / 2));
        var top = Math.min(frameH2 - cardH + frameH2 * 0.05, Math.max(-frameH2 * 0.05, cy - cardH / 2 - frameH2 * 0.03));
        elc.card.style.left = left + 'px';
        elc.card.style.top = top + 'px';
        // Anchor ring sits exactly on the source region; the card's FLIP
        // origin transform maps the destination rect back onto that region.
        var regLeft = vpL + (c.x / 100) * vpW;
        var regTop = vpT + (c.y / 100) * vpH;
        elc.ring.style.left = regLeft + 'px';
        elc.ring.style.top = regTop + 'px';
        elc.ring.style.width = regW + 'px';
        elc.ring.style.height = regH + 'px';
        elc.from.x = regLeft - left;
        elc.from.y = regTop - top;
        elc.from.s = 1 / z;
        elc.clip.style.width = cardW + 'px';
        elc.clip.style.height = cardH + 'px';
        elc.mini.style.width = vpW * z + 'px';
        elc.mini.style.height = vpH * z + 'px';
        elc.mini.style.left = -(c.x / 100) * vpW * z + 'px';
        elc.mini.style.top = -(c.y / 100) * vpH * z + 'px';
        // The clone reuses the base media's % geometry -- % of the mini
        // viewport, which is the real viewport scaled by z.
        elc.clone.style.position = 'absolute';
        elc.clone.style.width = media.style.width || '100%';
        elc.clone.style.left = media.style.left || '0';
        elc.clone.style.top = media.style.top || '0';
        elc.clone.style.height = 'auto';
      });
    }

    layout();
    if (!isImage) {
      if (media.readyState >= 1) layout();
      media.addEventListener('loadedmetadata', layout);
    } else {
      if (media.complete) layout(); else media.addEventListener('load', layout);
    }

    // ── Float presentation: tilted 3D pose + slow orbit drift ──
    // The plane-space wrapper receives the SAME tweens, so rings and callout
    // cards ride the tilt exactly.
    var pose = { ry: -14, rx: 5 };
    if (isFloat) {
      stage.classList.add('is-float');
      if (data.theme === 'light') stage.classList.add('is-light');
      // Floor light pool under the plane (behind the frame + reflection):
      // the slab hovers over a lit surface, not a void.
      var pool = document.createElement('div');
      pool.className = 'scf-pool';
      stage.insertBefore(pool, stage.firstChild);
      gsap.set(pool, { autoAlpha: 0 });
      tl.to(pool, { autoAlpha: 1, duration: 1.2, ease: 'sine.out' }, 0.4);
      tl.to(pool, { scale: 1.06, duration: Math.max(4, (ctx.duration || 8) / 2), yoyo: true, repeat: 1, ease: 'sine.inOut' }, 0.4);
      // Real slab thickness: side faces fold backward from the screen's
      // left/bottom edges inside a preserve-3d wrapper that shares the
      // frame's box and pose. Actual foreshortened geometry -- reads as
      // thickness at any zoom because it IS thickness.
      var depth3d = document.createElement('div');
      depth3d.className = 'scf-depth';
      var faceL = document.createElement('div'); faceL.className = 'scf-face scf-face--right';
      var faceB = document.createElement('div'); faceB.className = 'scf-face scf-face--bottom';
      depth3d.appendChild(faceL); depth3d.appendChild(faceB);
      stage.appendChild(depth3d);
      gsap.set(depth3d, { autoAlpha: 0 });
      tl.to(depth3d, { autoAlpha: 1, duration: 0.8, ease: 'power2.out' }, 0.3);
      var poseTargets = wrap3d ? [frame, wrap3d, depth3d] : [frame, depth3d];
      gsap.set(poseTargets, { rotateY: pose.ry, rotateX: pose.rx, transformOrigin: '50% 50%' });
      // One slow deterministic sweep across the scene -- the camera never
      // stops. Seek-exact (plain tween on the scene timeline).
      tl.to(poseTargets, { rotateY: pose.ry - 7, rotateX: pose.rx - 1.5, duration: Math.max(4, ctx.duration || 8), ease: 'sine.inOut' }, 0);
      // The tilt is not symmetric on screen: rotateY(-14) recedes the left
      // edge and swells the right toward the camera, so the PROJECTED image
      // sits right of center even though the box is flex-centered. Measure
      // the projection and shift the plane so its visual center is true.
      var floatXFix = 0;
      centerFloat = function () {
        try {
          // Glass mirrors the frame's box with a margin (offset geometry,
          // pre-transform -- the shared pose does the rest).
          var fw = frame.offsetWidth, fh = frame.offsetHeight;
          if (fw > 4) {
            // Depth wrapper mirrors the frame's untransformed box; the
            // shared pose transform does the rest.
            depth3d.style.left = frame.offsetLeft + 'px';
            depth3d.style.top = frame.offsetTop + 'px';
            depth3d.style.width = fw + 'px';
            depth3d.style.height = fh + 'px';
          }
          var sb = stage.getBoundingClientRect();
          var fb = frame.getBoundingClientRect();
          if (sb.width < 4 || fb.width < 4) return;
          var scale = sb.width / Math.max(1, stage.offsetWidth);
          var dx = ((sb.left + sb.width / 2) - (fb.left + fb.width / 2)) / scale;
          if (Math.abs(dx) < 1) return;
          floatXFix += dx;
          gsap.set(pool ? poseTargets.concat([pool]) : poseTargets, { x: floatXFix });
        } catch (e2) {}
      };
      centerFloat();
    }

    // Callout choreography -- readable in four beats, never a flash:
    //   1. the anchor ring draws ON the region, in place, base fully lit
    //   2. the base dims GENTLY (a spotlight, not a strobe)
    //   3. the region GROWS OUT of its ring toward the camera (FLIP travel
    //      from the source rect -- the visual connection), then breathes
    //   4. it travels back into the ring, ring dissolves, base relights
    calloutEls.forEach(function (elc, i) {
      var c = callouts[i];
      gsap.set(elc.ring, { autoAlpha: 0, scale: 1.06, transformOrigin: '50% 50%' });
      gsap.set(elc.card, { autoAlpha: 0, transformOrigin: '0 0' });
      var end = Math.min(c.at + c.dur, (ctx.duration || c.at + c.dur) - 0.6);
      var liftAt = c.at + 0.55;
      // Optional per-callout flight speed ("how fast it eases in/out"):
      // travel is the out-flight duration; the return scales with it.
      var travel = Math.max(0.35, Math.min(2, Number(c.travel) || 0.9));
      // Function-based FLIP values: read at first render, after layout().
      var fx = function () { return elc.from.x; };
      var fy = function () { return elc.from.y; };
      var fs = function () { return elc.from.s; };
      // The card starts flush ON the plane (z 0, plane rotation inherited via
      // the wrapper) and lifts along the plane's normal (translateZ) as it
      // expands; during the hold it eases PARTWAY toward camera-flat (a
      // counter-rotation of ~55% of the pose) so the zoomed content reads,
      // then settles back onto the plane for the return.
      var liftZ = isFloat ? 110 : 0;
      // The lifted card stays ON the plane: it shares the wrapper's live
      // pose (including the orbit drift) with NO counter-rotation. A static
      // counter fights the drifting wrapper and reads as a flat card
      // hovering over a tilted screen -- the mismatch, not the intent.
      var counterY = 0;
      var counterX = 0;
      tl.to(elc.ring, { autoAlpha: 1, scale: 1, duration: 0.4, ease: 'power2.out' }, c.at)
        .to(dimEl, { opacity: 0.42, duration: 0.9, ease: 'power2.inOut' }, c.at + 0.35)
        .fromTo(elc.card,
          { x: fx, y: fy, scale: fs, z: 0, rotateY: 0, rotateX: 0, autoAlpha: 0 },
          { autoAlpha: 1, duration: 0.25, ease: 'power1.out' }, liftAt)
        .to(elc.card, { x: 0, y: 0, scale: 1, z: liftZ, duration: travel, ease: 'power3.inOut' }, liftAt + 0.1)
        .to(elc.card, { rotateY: counterY, rotateX: counterX, duration: 0.6, ease: 'power2.out' }, liftAt + travel * 0.6);
      // Gentle hold breathe -- only when the hold is long enough that it
      // finishes before the return starts (overlapping scale tweens fight).
      if (end - liftAt > 3.4) {
        tl.to(elc.card, { scale: 1.012, duration: (end - liftAt - 1.4) / 2, yoyo: true, repeat: 1, ease: 'sine.inOut' }, liftAt + 1.1);
      }
      tl.to(elc.card, { rotateY: 0, rotateX: 0, duration: 0.45, ease: 'power2.inOut' }, end - 0.15)
        .to(elc.card, { x: fx, y: fy, scale: fs, z: 0, duration: travel * 0.78, ease: 'power2.inOut' }, end)
        .to(elc.card, { autoAlpha: 0, duration: 0.25, ease: 'power1.in' }, end + 0.5)
        .to(elc.ring, { autoAlpha: 0, scale: 1.05, duration: 0.4, ease: 'power2.in' }, end + 0.55)
        .to(dimEl, { opacity: 0, duration: 0.7, ease: 'power2.inOut' }, end + 0.4);
    });

    // Entrance only -- real footage NEVER fades itself out; the scene or a
    // transition decides how it ends.
    var speed = ctx.motion === 'minimal' ? 0.5 : ctx.motion === 'punchy' ? 0.7 : 0.9;
    gsap.set(frame, { autoAlpha: 0, scale: 0.97, y: 24 });
    tl.to(frame, { autoAlpha: 1, scale: 1, y: 0, duration: speed, ease: 'power3.out' }, 0.15);

    return tl;
  }
</script>
