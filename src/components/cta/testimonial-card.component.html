<script>
  function createTimeline(el, data, ctx) {
    var tl = gsap.timeline();
    var container = el.querySelector('.testimonial-container');
    var quoteMark = el.querySelector('.quote-mark');
    var quoteText = el.querySelector('.quote-text');
    var starsRow = el.querySelector('.stars-row');
    var authorRow = el.querySelector('.author-row');
    var avatarEl = el.querySelector('.author-avatar');
    var nameEl = el.querySelector('.author-name');
    var roleEl = el.querySelector('.author-role');

    // Set content
    quoteText.textContent = data.quote || '';

    // Set author info
    var name = data.name || '';
    nameEl.textContent = name;
    var roleParts = [];
    if (data.role) roleParts.push(data.role);
    if (data.company) roleParts.push(data.company);
    roleEl.textContent = roleParts.join(' · ');

    // Avatar
    var avatarColor = data.avatar_color || '#A78BFA';
    avatarEl.style.background = 'linear-gradient(135deg, ' + avatarColor + ', ' + avatarColor + 'cc)';
    avatarEl.textContent = name ? name[0].toUpperCase() : '?';

    // Stars
    if (data.rating && data.rating > 0) {
      for (var s = 1; s <= 5; s++) {
        var star = document.createElement('span');
        star.className = 'star' + (s <= data.rating ? '' : ' empty');
        star.textContent = '★';
        starsRow.appendChild(star);
      }
    }

    // Collect animated elements
    var elements = [quoteMark, quoteText];
    if (starsRow.children.length > 0) elements.push(starsRow);
    elements.push(authorRow);

    // Initial states
    gsap.set(container, { autoAlpha: 0, scale: 1.06, filter: 'blur(4px)' });
    gsap.set(elements, { autoAlpha: 0, y: 20 });
    gsap.set(quoteMark, { scale: 0.8 });

    var speed = ctx.motion === 'minimal' ? 0.4 : ctx.motion === 'punchy' ? 0.6 : 0.9;

    // Container entrance
    tl.to(container, {
      autoAlpha: 1, scale: 1, filter: 'blur(0px)',
      duration: speed,
      ease: 'power3.out'
    }, 0.3);

    // Quote mark
    tl.to(quoteMark, {
      autoAlpha: 0.15, y: 0, scale: 1,
      duration: speed * 0.7,
      ease: 'power2.out'
    }, 0.5);

    // Quote text
    tl.to(quoteText, {
      autoAlpha: 1, y: 0,
      duration: speed * 0.8,
      ease: 'power2.out'
    }, 0.6);

    // Stars
    if (starsRow.children.length > 0) {
      tl.to(starsRow, {
        autoAlpha: 1, y: 0,
        duration: speed * 0.5,
        ease: 'power2.out'
      }, 0.6 + speed * 0.5);
    }

    // Author row
    tl.to(authorRow, {
      autoAlpha: 1, y: 0,
      duration: speed * 0.6,
      ease: 'power2.out'
    }, 0.6 + speed * 0.7);

    // Exit
    if (ctx.duration > 2) {
      var exitAt = ctx.duration - 0.6;
      tl.to(container, {
        autoAlpha: 0, scale: 0.97, y: -15,
        duration: 0.5,
        ease: 'power2.in'
      }, exitAt);
    }

    return tl;
  }
</script>
