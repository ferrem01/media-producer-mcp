<script>
  function createTimeline(el, data, ctx) {
    var tl = gsap.timeline();
    var q = function (s) { return el.querySelector(s); };
    var root = q('.tc-root'), card = q('.tc-card');
    var DUR = (ctx && ctx.duration) || 5;
    var gl = window.mpGroundLum ? mpGroundLum() : null;
    var theme = data.theme === 'dark' || data.theme === 'light' ? data.theme : (typeof gl === 'number' && gl < 0.18 ? 'dark' : 'light');
    root.classList.add('t-' + theme);
    if (data.surface === 'none') root.classList.add('surface-none');

    // Quote as word spans (the highlight phrase marked), grouped into lines after sizing.
    var quote = String(data.quote || '').replace(/^["“]|["”]$/g, '');
    var hi = String(data.highlight || '').trim();
    var hs = hi ? quote.toLowerCase().indexOf(hi.toLowerCase()) : -1;
    var qEl = q('.tc-quote');
    var words = [], pos = 0;
    quote.split(/(\s+)/).forEach(function (part) {
      if (!part) return;
      // The space stays inside the word before it, so a highlight runs unbroken.
      if (/^\s+$/.test(part)) { if (words.length) words[words.length - 1].textContent += part; pos += part.length; return; }
      var w = document.createElement('span'); w.className = 'tc-w'; w.textContent = part;
      if (hs >= 0 && pos >= hs && pos < hs + hi.length) w.classList.add('hl');
      qEl.appendChild(w); words.push(w); pos += part.length;
    });

    var rating = Math.max(0, Math.min(5, Math.round(Number(data.rating) || 0)));
    var stars = q('.tc-stars');
    for (var s = 0; s < (rating ? 5 : 0); s++) {
      var sv = document.createElementNS('http://www.w3.org/2000/svg', 'svg'); sv.setAttribute('viewBox', '0 0 24 24');
      sv.innerHTML = '<path d="M12 2.6l2.8 6 6.5.7-4.9 4.4 1.4 6.4L12 16.9 6.2 20.1l1.4-6.4L2.7 9.3l6.5-.7z" fill="' + (s < rating ? '#f5a524' : 'var(--s-line)') + '"/>';
      stars.appendChild(sv);
    }
    var name = String(data.name || '');
    q('.tc-name').textContent = name;
    q('.tc-role').textContent = [data.role, data.company_logo ? data.company : null].filter(Boolean).join(' · ');
    var initials = name.split(/\s+/).filter(Boolean).map(function (p) { return p[0]; }).slice(0, 2).join('').toUpperCase();
    q('.tc-initials').textContent = initials || '?';
    if (data.avatar_color) q('.tc-avatar').style.setProperty('--tc-av', String(data.avatar_color));
    if (data.avatar) {
      var img = document.createElement('img'); img.src = String(data.avatar); img.alt = '';
      img.onerror = function () { img.remove(); };
      q('.tc-avatar').appendChild(img);
    }
    var comp = q('.tc-company');
    if (data.company_logo) { var li = document.createElement('img'); li.src = String(data.company_logo); li.alt = ''; comp.appendChild(li); }
    else if (data.company) comp.textContent = String(data.company);

    // SIZE: a landscape card (never wider than ~2.1:1), type from the box,
    // shrink until it fits, hug the content.
    var W0 = el.clientWidth || 900, H0 = el.clientHeight || 520, pad = Math.round(Math.min(W0, H0) * 0.06);
    // Shadows are sized from this margin so the slot (which clips) never cuts them.
    root.style.setProperty('--pad', pad + 'px');
    // A full-frame slot overhangs the frame (the camera layer is larger than
    // the canvas; measured: cards 9px from the edge), so the margin is kept
    // inside what is SEEN.
    var rc = el.getBoundingClientRect(), sc = rc.width / W0 || 1;
    var ox = Math.max(0, -rc.left, rc.right - window.innerWidth) / sc, oy = Math.max(0, -rc.top, rc.bottom - window.innerHeight) / sc;
    var W = W0 - 2 * (pad + ox), H = H0 - 2 * (pad + oy);
    var cw = Math.min(W, H * 2.1);
    card.style.width = cw + 'px';
    var u = Math.min(cw / 760, H / 420);
    for (var i = 0; i < 30; i++) {
      root.style.setProperty('--u', u.toFixed(3) + 'px');
      if (card.scrollHeight <= H + 1 && card.scrollWidth <= card.clientWidth + 1) break;
      u *= 0.95;
    }
    // Group words into their rendered lines so each line can rise.
    var lines = [], lastTop = null;
    words.forEach(function (w) { var t = w.offsetTop; if (lastTop === null || Math.abs(t - lastTop) > 2) { lines.push([]); lastTop = t; } lines[lines.length - 1].push(w); });
    var lineEls = lines.map(function (ws) {
      var ln = document.createElement('span'); ln.className = 'tc-line';
      qEl.insertBefore(ln, ws[0]); ws.forEach(function (w) { ln.appendChild(w); });
      return ln;
    });

    // MOTION: card rises, the glyph lands, quote lines rise, the highlight
    // sweeps, stars fill left to right, the person lands last.
    var AT = Number(data.at) || 0.2;
    gsap.set(card, { autoAlpha: 0, y: 28 });
    tl.to(card, { autoAlpha: 1, y: 0, duration: 0.55, ease: 'power3.out' }, AT);
    gsap.set(q('.tc-glyph'), { autoAlpha: 0, y: 8 });
    tl.to(q('.tc-glyph'), { autoAlpha: 1, y: 0, duration: 0.4, ease: 'power3.out' }, AT + 0.2);
    if (window.mpLineRise) mpLineRise(tl, lineEls, AT + 0.3, { stagger: 0.1, duration: 0.4, rise: 12 });
    var t = AT + 0.4 + lineEls.length * 0.1;
    var hw = qEl.querySelectorAll('.tc-w.hl');
    if (hw.length) {
      var hAt = t + 0.25, hEach = 0.6 / hw.length;
      Array.prototype.forEach.call(hw, function (w, k) { tl.to(w, { backgroundSize: '100% 100%', duration: hEach, ease: 'none' }, hAt + k * hEach); });
    }
    var starEls = stars.querySelectorAll('svg');
    if (starEls.length) {
      gsap.set(starEls, { autoAlpha: 0 });
      tl.to(starEls, { autoAlpha: 1, duration: 0.2, stagger: 0.07, ease: 'power1.out' }, t);
      t += 0.25;
    }
    var foot = q('.tc-foot');
    gsap.set(foot, { autoAlpha: 0, y: 10 });
    tl.to(foot, { autoAlpha: 1, y: 0, duration: 0.4, ease: 'power3.out' }, t + 0.1);
    if (data.exit === true && DUR > 2) tl.to(card, { autoAlpha: 0, y: -16, duration: 0.4, ease: 'power2.in' }, DUR - 0.5);
    return tl;
  }
</script>
