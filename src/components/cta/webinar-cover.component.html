<script>
  function createTimeline(el, data, ctx) {
    var tl = gsap.timeline();
    var q = function (s) { return el.querySelector(s); };
    var root = q('.wc-root'), block = q('.wc-block');
    function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
    if (data.accent) root.style.setProperty('--acc', String(data.accent));
    if (data.ink) root.style.setProperty('--wc-ink', String(data.ink));
    if (data.button_color) root.style.setProperty('--wc-btn', String(data.button_color));
    if (data.align === 'center') root.classList.add('center');
    if (data.ground === 'cream' || data.ground === 'waves') {
      var gr = q('.wc-ground'), wv = q('.wc-waves');
      gr.style.display = 'block';
      if (data.ground_tone) gr.style.background = String(data.ground_tone);
      var GW = el.clientWidth || 1080, GH = el.clientHeight || 1920;
      wv.setAttribute('viewBox', '0 0 ' + GW + ' ' + GH);
      wv.setAttribute('preserveAspectRatio', 'none');
      if (data.ground === 'waves' && window.mpWavesSvg) wv.innerHTML = mpWavesSvg(GW, GH, {});
    }

    if (data.pill) q('.wc-pill-t').textContent = String(data.pill); else q('.wc-pill').classList.add('off');
    q('.wc-kicker').textContent = data.kicker ? String(data.kicker) : '';
    // *word* is the accent italic, as on the cover ("Marketing *Analytics*").
    q('.wc-title').innerHTML = esc(data.title || '').replace(/\*([^*]+)\*/g, '<em>$1</em>');
    q('.wc-sub').textContent = data.subtitle ? String(data.subtitle) : '';
    var hasDate = !!data.date, hasTime = !!data.time;
    q('.wc-date .wc-cell-t').textContent = hasDate ? String(data.date) : '';
    q('.wc-time .wc-cell-t').textContent = hasTime ? String(data.time) : '';
    if (!hasDate) q('.wc-date').classList.add('off');
    if (!hasTime) q('.wc-time').classList.add('off');
    if (!hasDate || !hasTime) q('.wc-sep').classList.add('off');
    if (!hasDate && !hasTime) { q('.wc-when').classList.add('off'); q('.wc-rule').classList.add('off'); }
    var btn = q('.wc-button');
    if (data.button_text) q('.wc-label').textContent = String(data.button_text); else q('.wc-actions').classList.add('off');
    if (data.arrow === false) q('.wc-arrow').style.display = 'none';

    // SIZE: generous first, shrink until the block fits the box (minus a
    // margin), so the cover owns its slot at any size.
    var W = el.clientWidth || 1600, H = el.clientHeight || 900;
    var tall = H > W * 1.2;
    if (tall) root.classList.add('tall');
    var pad = Math.round(Math.min(W, H) * (tall ? 0.09 : 0.04));
    // Start large and shrink until the block fits: the measure depends on
    // the font (Inter is far narrower than a fallback sans), so no fixed
    // starting ratio is right for every box.
    var u = Math.min(W / 560, H / 560);
    for (var i = 0; i < 60; i++) {
      root.style.setProperty('--u', u.toFixed(3) + 'px');
      if (block.scrollHeight <= H - 2 * pad && block.scrollWidth <= W - 2 * pad) break;
      u *= 0.95;
    }

    // MOTION: still:true shows the cover whole from the first frame (an
    // opener whose first frame is the thumbnail). Otherwise the lines rise
    // in reading order from `at`, and the button lands last with one shine.
    var parts = ['.wc-pill', '.wc-kicker', '.wc-title', '.wc-sub', '.wc-rule', '.wc-when']
      .map(q).filter(function (x) { return x && !x.classList.contains('off') && (x.textContent || x.classList.contains('wc-rule')); });
    var AT = data.at !== undefined && data.at !== null && isFinite(Number(data.at)) ? Number(data.at) : 0.2;
    var hasBtn = !!data.button_text;
    if (data.still !== true) {
      gsap.set(parts, { autoAlpha: 0, y: 18 });
      tl.to(parts, { autoAlpha: 1, y: 0, duration: 0.45, stagger: 0.08, ease: 'power3.out' }, AT);
    }
    var bAt = data.button_at !== undefined && data.button_at !== null && isFinite(Number(data.button_at))
      ? Number(data.button_at) : (data.still === true ? AT : AT + 0.25 + parts.length * 0.08);
    if (hasBtn) {
      gsap.set(btn, { autoAlpha: 0, y: 12 });
      tl.to(btn, { autoAlpha: 1, y: 0, duration: 0.4, ease: 'back.out(1.6)' }, bAt);
      gsap.set(q('.wc-shine'), { xPercent: -110 });
      tl.to(q('.wc-shine'), { xPercent: 260, duration: 0.9, ease: 'power2.inOut' }, bAt + 0.5);
    }
    if (hasBtn && data.press_at !== undefined && data.press_at !== null) {
      var pa = Number(data.press_at);
      tl.to(btn, { scale: 0.96, duration: 0.09, ease: 'power2.in' }, pa);
      tl.to(btn, { scale: 1, duration: 0.18, ease: 'power2.out' }, pa + 0.09);
    }
    return tl;
  }
</script>
