<template>
  <div class="sp-root">
    <div class="sp-wrap">
      <div class="sp-title"></div>
      <div class="sp-grid"></div>
    </div>
  </div>
</template>

<style scoped>
  /* One design unit (--u) from the slot: the audit measured the old stats

  .sp-root {

    position: absolute; inset: 0;

    max-width: none;
  }
  .sp-root.t-light { --g-ink: var(--mp-color-on-light, #17171c); --s-bg: #ffffff; --s-ink: var(--mp-color-on-light, #17171c); --s-muted: color-mix(in srgb, var(--mp-color-on-light, #17171c) 64%, #ffffff); --s-line: rgba(20, 20, 40, 0.09); --s-acc: var(--mp-color-primary, #393bf5); }
  .sp-root.t-dark { --g-ink: #ffffff; --s-bg: #16171d; --s-ink: #ffffff; --s-muted: rgba(255, 255, 255, 0.72); --s-line: rgba(255, 255, 255, 0.10); --s-acc: color-mix(in srgb, var(--mp-color-primary, #393bf5) 55%, #ffffff); }

  .sp-wrap { box-sizing: border-box; display: flex; flex-direction: column; align-items: center; }

  .sp-item {
    position: relative; overflow: hidden; box-sizing: border-box; min-width: 0;
    display: flex; flex-direction: column; justify-content: center;
    padding: calc(var(--u) * 34) calc(var(--u) * 30) calc(var(--u) * 30);
    background: var(--s-bg); color: var(--s-ink);
    border: 1px solid var(--s-line); border-radius: calc(var(--u) * 22);
    box-shadow: 0 calc(var(--pad) * 0.06) calc(var(--pad) * 0.16) rgba(20, 20, 60, 0.06), 0 calc(var(--pad) * 0.25) calc(var(--pad) * 0.7) rgba(20, 20, 60, 0.12);

  .sp-root.style-plain .sp-item { background: none; border: 0; box-shadow: none; }
  .sp-root.style-plain .sp-item { color: var(--g-ink); }

  .sp-root.style-plain .sp-bar { display: none; }
  .sp-text { font-size: calc(var(--un) * 30); font-weight: 600; line-height: 1.15; letter-spacing: -0.015em; white-space: nowrap; }

<script>
  function createTimeline(el, data, ctx) {
    var tl = gsap.timeline();
    var q = function (s) { return el.querySelector(s); };
    var root = q('.sp-root'), wrap = q('.sp-wrap'), grid = q('.sp-grid');
    var DUR = (ctx && ctx.duration) || 5;
    var gl = window.mpGroundLum ? mpGroundLum() : null;
    var theme = data.theme === 'dark' || data.theme === 'light' ? data.theme : (typeof gl === 'number' && gl < 0.18 ? 'dark' : 'light');
    root.classList.add('t-' + theme, 'style-' + (data.style === 'plain' ? 'plain' : 'cards'));
    if (data.align !== 'left') root.classList.add('align-center');
    q('.sp-title').textContent = data.title ? String(data.title) : '';

    // Each item is read for what it IS: a figure (counts up, large, accent),
    // a logo image, a short name (wordmark), or a line of praise.
    var items = Array.isArray(data.items) ? data.items : [];
    var cards = items.map(function (it) {
      if (typeof it === 'string') it = { text: it };
      it = it || {};
      var card = document.createElement('div'); card.className = 'sp-item';
      var text = String(it.text || '');
      var kind = it.logo ? 'logo' : (/\d/.test(text) && text.length <= 12 ? 'stat' : (text.length > 40 ? 'quote' : 'logo'));
      card.classList.add(kind);
      card.innerHTML = '<div class="sp-bar"></div>';
      if (it.logo) { var img = document.createElement('img'); img.src = String(it.logo); img.alt = text; card.appendChild(img); }
      else { var t = document.createElement('div'); t.className = 'sp-text'; t.textContent = text; card.appendChild(t); }
      if (it.subtext) { var s = document.createElement('div'); s.className = 'sp-sub'; s.textContent = String(it.subtext); card.appendChild(s); }
      grid.appendChild(card);
      return { el: card, kind: kind, text: text };
    });
    var n = Math.max(1, cards.length);
    var cols = data.layout === 'grid' ? (n <= 4 ? Math.min(2, n) : 3) : Math.min(n, 5);
    grid.style.gridTemplateColumns = 'repeat(' + cols + ', minmax(0, 1fr))';

    // SIZE: type from the box, shrink until the title and every card fit
    // (a figure never wraps or spills out of its card).
    var W0 = el.clientWidth || 900, H0 = el.clientHeight || 520, pad = Math.round(Math.min(W0, H0) * 0.06);
    // Shadows are sized from this margin so the slot (which clips) never cuts them.
    root.style.setProperty('--pad', pad + 'px');
    // A full-frame slot overhangs the frame (the camera layer is larger than
    // the canvas; measured: cards 9px from the edge), so the margin is kept
    // inside what is SEEN.
    var rc = el.getBoundingClientRect(), sc = rc.width / W0 || 1;
    var ox = Math.max(0, -rc.left, rc.right - window.innerWidth) / sc, oy = Math.max(0, -rc.top, rc.bottom - window.innerHeight) / sc;
    var W = W0 - 2 * (pad + ox), H = H0 - 2 * (pad + oy);
    wrap.style.width = W + 'px';
    // Two scales: --u for the whole block (fits the height), --un for each
    // card's figure or name (fits its card's width), so one wide figure
    // shrinks only the figures, never the labels under them.
    var rows = Math.ceil(n / cols);
    var u = Math.min(W / (cols * 240), H / (rows * 150 + (data.title ? 100 : 20))), k = 1;
    // The figure line itself is measured: overflow into the card's padding never shows in the card's scrollWidth.
    function wide() { for (var c = 0; c < cards.length; c++) { var e = cards[c].el.querySelector('.sp-text') || cards[c].el; if (e.scrollWidth > e.clientWidth + 1) return true; } return false; }
    for (var i = 0; i < 60; i++) {
      root.style.setProperty('--u', u.toFixed(3) + 'px');
      root.style.setProperty('--un', (u * k).toFixed(3) + 'px');
      if (wide()) { k *= 0.95; continue; }
      if (wrap.scrollHeight > H + 1) { u *= 0.95; continue; }
      break;
    }

    // MOTION: the title rises, cards land one after another, each accent bar
    // draws and each figure counts up to its value.
    var AT = Number(data.at) || 0.2;
    var title = q('.sp-title');
    if (title.textContent && window.mpLineRise) mpLineRise(tl, title, AT, { duration: 0.45, rise: 14 });
    var cAt = AT + (title.textContent ? 0.35 : 0), each = Math.min(0.16, 1.2 / n);
    cards.forEach(function (c, k) {
      var at = cAt + k * each;
      gsap.set(c.el, { autoAlpha: 0, y: 18 });
      tl.to(c.el, { autoAlpha: 1, y: 0, duration: 0.45, ease: 'power3.out' }, at);
      var bar = c.el.querySelector('.sp-bar');
      gsap.set(bar, { scaleX: 0 });
      tl.to(bar, { scaleX: 1, duration: 0.5, ease: 'power2.inOut' }, at + 0.15);
      var tx = c.el.querySelector('.sp-text');
      if (c.kind === 'stat' && tx && window.mpCountUp) mpCountUp(tl, tx, at + 0.1, { to: c.text, duration: 1.0 });
    });
    if (data.exit === true && DUR > 2) tl.to(wrap, { autoAlpha: 0, y: -16, duration: 0.4, ease: 'power2.in' }, DUR - 0.5);
    return tl;
  }
</script>
