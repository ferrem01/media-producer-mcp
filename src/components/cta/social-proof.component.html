<template>
  <div class="social-proof">
    <h2 class="sp-title">{{title}}</h2>
    <div class="sp-grid"></div>
  </div>
</template>

<style scoped>

    display: none;

  .sp-grid {
    display: flex;
    flex-wrap: wrap;

    gap: 20px;
    width: 100%;
    max-width: 960px;

    display: grid;

  .sp-subtext:empty {
    display: none;
  }
</style>

<script>
  function createTimeline(el, data, ctx) {
    var tl = gsap.timeline();
    var grid = el.querySelector('.sp-grid');
    var title = el.querySelector('.sp-title');
    var items = data.items || [];
    var layout = data.layout || 'row';

    if (layout === 'grid') {
      grid.classList.add('layout-grid');
    }

    items.forEach(function(item) {
      var div = document.createElement('div');
      div.className = 'sp-item';

      var text = document.createElement('div');
      text.className = 'sp-text';
      text.textContent = item.text;
      div.appendChild(text);

      if (item.subtext) {
        var sub = document.createElement('div');
        sub.className = 'sp-subtext';
        sub.textContent = item.subtext;
        div.appendChild(sub);
      }

      grid.appendChild(div);
    });

    var cards = grid.querySelectorAll('.sp-item');
    var speed = ctx.motion === 'minimal' ? 0.35 : ctx.motion === 'punchy' ? 0.45 : 0.6;
    var stagger = ctx.motion === 'minimal' ? 0.08 : 0.12;

    // Title entrance
    if (title && title.textContent.trim()) {
      gsap.set(title, { autoAlpha: 0, y: 20, filter: 'blur(4px)' });
      tl.to(title, { autoAlpha: 1, y: 0, filter: 'blur(0px)', duration: speed, ease: 'power3.out' }, 0.2);
    }

    // Cards with scale + blur entrance
    gsap.set(cards, { autoAlpha: 0, y: 25, scale: 1.06, filter: 'blur(5px)' });

    tl.to(cards, {
      autoAlpha: 1, y: 0, scale: 1, filter: 'blur(0px)',
      duration: speed,
      stagger: stagger,
      ease: ctx.motion === 'punchy' ? 'back.out(1.2)' : 'power3.out'
    }, 0.5);

    // Glow after entrance
    tl.to(cards, {
      boxShadow: '0 0 24px rgba(167, 139, 250, 0.05), 0 8px 32px rgba(0, 0, 0, 0.2), 0 0 0 1px rgba(255, 255, 255, 0.04)',
      duration: 0.4,
      stagger: stagger * 0.5
    }, '-=0.2');

    // Exit
    if (ctx.duration > 2) {
      var exitAt = ctx.duration - 0.6;
      tl.to(el.querySelector('.social-proof'), {
        autoAlpha: 0,
        duration: 0.4,
        ease: 'power2.in'
      }, exitAt);
    }

    return tl;
  }
</script>
