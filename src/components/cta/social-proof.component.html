<template>
  <div class="social-proof">
    <h2 class="sp-title">{{title}}</h2>
    <div class="sp-grid"></div>
  </div>
</template>

<style scoped>
  .social-proof {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    width: 100%;
    height: 100%;
    font-family: var(--mp-font-family, 'Inter', sans-serif);
    padding: 40px 60px;
    box-sizing: border-box;
  }

  .sp-title {
    font-size: 36px;
    font-weight: 700;
    color: var(--mp-color-text, #ffffff);
    margin: 0 0 40px 0;
    text-align: center;
  }

  .sp-title:empty {
    display: none;
  }

  .sp-grid {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 24px;
    width: 100%;
    max-width: 900px;
  }

  .sp-grid.layout-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
  }

  .sp-item {
    background: var(--mp-color-surface, #1e293b);
    border-radius: var(--mp-border-radius, 12px);
    padding: 28px 32px;
    text-align: center;
    flex: 1;
    min-width: 180px;
    max-width: 280px;
  }

  .sp-text {
    font-size: 22px;
    font-weight: 700;
    color: var(--mp-color-text, #ffffff);
    line-height: 1.3;
  }

  .sp-subtext {
    font-size: 15px;
    font-weight: 400;
    color: var(--mp-color-text-muted, #94a3b8);
    margin-top: 8px;
  }

  .sp-subtext:empty {
    display: none;
  }
</style>

<script>
  function createTimeline(el, data, ctx) {
    var tl = gsap.timeline();
    var grid = el.querySelector('.sp-grid');
    var title = el.querySelector('.sp-title');
    var items = data.items || [];
    var layout = data.layout || 'row';

    if (layout === 'grid') {
      grid.classList.add('layout-grid');
    }

    // Build items
    items.forEach(function(item) {
      var div = document.createElement('div');
      div.className = 'sp-item';

      var text = document.createElement('div');
      text.className = 'sp-text';
      text.textContent = item.text;
      div.appendChild(text);

      if (item.subtext) {
        var sub = document.createElement('div');
        sub.className = 'sp-subtext';
        sub.textContent = item.subtext;
        div.appendChild(sub);
      }

      grid.appendChild(div);
    });

    var cards = grid.querySelectorAll('.sp-item');
    gsap.set(cards, { autoAlpha: 0, y: 20, scale: 0.95 });

    // Title
    if (title && title.textContent.trim()) {
      gsap.set(title, { autoAlpha: 0, y: 20 });
      tl.to(title, { autoAlpha: 1, y: 0, duration: 0.5, ease: 'power2.out' }, 0.2);
    }

    // Stagger items in
    tl.to(cards, {
      autoAlpha: 1,
      y: 0,
      scale: 1,
      duration: 0.5,
      stagger: 0.12,
      ease: 'power3.out'
    }, 0.5);

    // Exit
    if (ctx.duration > 2) {
      tl.to(el.querySelector('.social-proof'), {
        autoAlpha: 0,
        duration: 0.4,
        ease: 'power2.in'
      }, ctx.duration - 0.5);
    }

    return tl;
  }
</script>
