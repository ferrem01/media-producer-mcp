  </div>
</template>

<style scoped>

    display: none;

<script>
  function createTimeline(el, data, ctx) {
    var tl = gsap.timeline();
    var card = el.querySelector('.pricing-card');
    var featuresContainer = el.querySelector('.pricing-features');
    var ctaBtn = el.querySelector('.pricing-cta');

    if (data.highlighted) {
      card.classList.add('highlighted');
    }

    // Build features
    var features = data.features || [];
    features.forEach(function(f) {
      var row = document.createElement('div');
      row.className = 'pricing-feature';

      var check = document.createElement('span');
      check.className = 'feature-check';
      check.textContent = '\u2713';

      var text = document.createElement('span');
      text.textContent = f;

      row.appendChild(check);
      row.appendChild(text);
      featuresContainer.appendChild(row);
    });

    var featureRows = featuresContainer.querySelectorAll('.pricing-feature');

    // Entrance
    gsap.set(card, { autoAlpha: 0, y: 50, scale: 0.95 });
    gsap.set(featureRows, { autoAlpha: 0, x: -20 });
    gsap.set(ctaBtn, { autoAlpha: 0, scale: 0.9 });

    tl.to(card, {
      autoAlpha: 1,
      y: 0,
      scale: 1,
      duration: 0.6,
      ease: 'power3.out'
    }, 0.3);

    // Features animate in one by one
    tl.to(featureRows, {
      autoAlpha: 1,
      x: 0,
      duration: 0.4,
      stagger: 0.1,
      ease: 'power2.out'
    }, 0.7);

    // CTA button
    if (ctaBtn && ctaBtn.textContent.trim()) {
      tl.to(ctaBtn, {
        autoAlpha: 1,
        scale: 1,
        duration: 0.4,
        ease: 'back.out(1.2)'
      }, 0.7 + features.length * 0.1 + 0.2);
    }

    // Exit
    if (ctx.duration > 2) {
      tl.to(card, {
        autoAlpha: 0,
        y: -20,
        duration: 0.4,
        ease: 'power2.in'
      }, ctx.duration - 0.5);
    }

    return tl;
  }
</script>
