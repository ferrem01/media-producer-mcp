      <div class="pc-price-row"><span class="pc-compare"></span><span class="pc-price"></span><span class="pc-period"></span></div>

<style scoped>

  .pc-root.t-light { --s-bg: #ffffff; --s-ink: var(--mp-color-on-light, #17171c); --s-muted: color-mix(in srgb, var(--mp-color-on-light, #17171c) 64%, #ffffff); --s-line: rgba(20, 20, 40, 0.09); --s-acc: var(--mp-color-primary, #393bf5); --s-tint: color-mix(in srgb, var(--mp-color-primary, #393bf5) 12%, #ffffff); }

<script>
  function createTimeline(el, data, ctx) {
    var tl = gsap.timeline();
    var q = function (s) { return el.querySelector(s); };
    var root = q('.pc-root'), card = q('.pc-card');
    var DUR = (ctx && ctx.duration) || 5;
    function txt(sel, v) { q(sel).textContent = v === undefined || v === null ? '' : String(v); }
    txt('.pc-name', data.name);
    txt('.pc-desc', data.description);
    txt('.pc-price', data.price);
    txt('.pc-period', data.period);
    txt('.pc-compare', data.compare_price);
    txt('.pc-cta', data.cta);
    var hl = !!data.highlighted;
    if (hl) card.classList.add('hl');
    txt('.pc-badge', data.badge !== undefined ? data.badge : (hl ? 'Most popular' : ''));

    var gl = window.mpGroundLum ? mpGroundLum() : null;
    var theme = data.theme === 'dark' || data.theme === 'light' ? data.theme : (typeof gl === 'number' && gl < 0.18 ? 'dark' : 'light');
    root.classList.add('t-' + theme);

    var box = q('.pc-features');
    var rows = (Array.isArray(data.features) ? data.features : []).map(function (f) {
      var row = document.createElement('div'); row.className = 'pc-feat';
      row.innerHTML = '<span class="pc-check"><svg viewBox="0 0 16 16"><path d="M3.5 8.4l2.9 2.9 6.1-6.6" fill="none" stroke="var(--s-acc)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg></span><span class="pc-ft"></span>';
      row.querySelector('.pc-ft').textContent = String(f && typeof f === 'object' ? (f.text || '') : f);
      box.appendChild(row);
      return row;
    });

    // SIZE: a portrait card that fills the slot's height (never wider than
    // ~0.9:1), type from the box, shrink until the content fits, hug it.
    var W0 = el.clientWidth || 600, H0 = el.clientHeight || 800, pad = Math.round(Math.min(W0, H0) * 0.06);
    // Shadows are sized from this margin so the slot (which clips) never cuts them.
    root.style.setProperty('--pad', pad + 'px');
    // A full-frame slot overhangs the frame (the camera layer is larger than
    // the canvas; measured: cards 9px from the edge), so the margin is kept
    // inside what is SEEN.
    var rc = el.getBoundingClientRect(), sc = rc.width / W0 || 1;
    var ox = Math.max(0, -rc.left, rc.right - window.innerWidth) / sc, oy = Math.max(0, -rc.top, rc.bottom - window.innerHeight) / sc;
    var W = W0 - 2 * (pad + ox), H = H0 - 2 * (pad + oy);
    var cw = Math.min(W, H * 0.9);
    card.style.width = cw + 'px';
    var u = Math.min(cw / 480, H / 640);
    for (var i = 0; i < 30; i++) {
      root.style.setProperty('--u', u.toFixed(3) + 'px');
      if (card.scrollHeight <= H + 1 && card.scrollWidth <= card.clientWidth + 1) break;
      u *= 0.95;
    }

    // MOTION: card rises, head lines rise, the price counts up, the rule
    // draws, features build in one at a time, the CTA lands last.
    var AT = Number(data.at) || 0.2;
    gsap.set(card, { autoAlpha: 0, y: 28 });
    tl.to(card, { autoAlpha: 1, y: 0, duration: 0.55, ease: 'power3.out' }, AT);
    var head = [q('.pc-head'), q('.pc-desc'), q('.pc-price-row')].filter(function (x) { return x.textContent; });
    if (window.mpLineRise) mpLineRise(tl, head, AT + 0.2, { stagger: 0.1, duration: 0.4, rise: 12 });
    var price = q('.pc-price');
    if (window.mpCountUp && /\d/.test(price.textContent)) mpCountUp(tl, price, AT + 0.35, { to: String(data.price), duration: 0.9 });
    gsap.set(q('.pc-rule'), { scaleX: 0 });
    tl.to(q('.pc-rule'), { scaleX: 1, duration: 0.5, ease: 'power2.inOut' }, AT + 0.5);
    var fAt = AT + 0.7, each = Math.min(0.14, 1.4 / Math.max(1, rows.length));
    rows.forEach(function (r, k) {
      gsap.set(r, { autoAlpha: 0, y: 10 });
      tl.to(r, { autoAlpha: 1, y: 0, duration: 0.32, ease: 'power3.out' }, fAt + k * each);
    });
    var cta = q('.pc-cta');
    if (cta.textContent) {
      gsap.set(cta, { autoAlpha: 0, y: 10 });
      tl.to(cta, { autoAlpha: 1, y: 0, duration: 0.4, ease: 'power3.out' }, fAt + rows.length * each + 0.1);
    }
    if (data.exit === true && DUR > 2) tl.to(card, { autoAlpha: 0, y: -16, duration: 0.4, ease: 'power2.in' }, DUR - 0.5);
    return tl;
  }
</script>
