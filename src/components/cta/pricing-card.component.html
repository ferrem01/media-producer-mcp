<script>
  function createTimeline(el, data, ctx) {
    var tl = gsap.timeline();
    var card = el.querySelector('.pricing-card');
    var featuresContainer = el.querySelector('.pricing-features');
    var ctaBtn = el.querySelector('.pricing-cta');
    var priceRow = el.querySelector('.pricing-price-row');
    var name = el.querySelector('.pricing-name');

    if (data.highlighted) {
      card.classList.add('highlighted');
    }

    // Build features
    var features = data.features || [];
    features.forEach(function(f) {
      var row = document.createElement('div');
      row.className = 'pricing-feature';

      var check = document.createElement('span');
      check.className = 'feature-check';
      check.textContent = '\u2713';

      var text = document.createElement('span');
      text.textContent = f;

      row.appendChild(check);
      row.appendChild(text);
      featuresContainer.appendChild(row);
    });

    var featureRows = featuresContainer.querySelectorAll('.pricing-feature');
    var speed = ctx.motion === 'minimal' ? 0.4 : ctx.motion === 'punchy' ? 0.55 : 0.7;

    // Card entrance with scale + blur
    gsap.set(card, { autoAlpha: 0, y: 50, scale: 1.06, filter: 'blur(5px)' });
    gsap.set(featureRows, { autoAlpha: 0, x: -15 });
    gsap.set(ctaBtn, { autoAlpha: 0, scale: 0.9 });

    tl.to(card, {
      autoAlpha: 1, y: 0, scale: 1, filter: 'blur(0px)',
      duration: speed,
      ease: 'power3.out'
    }, 0.3);

    // Features stagger in
    tl.to(featureRows, {
      autoAlpha: 1, x: 0,
      duration: 0.4,
      stagger: 0.08,
      ease: 'power2.out'
    }, 0.3 + speed * 0.5);

    // CTA button
    if (ctaBtn && ctaBtn.textContent.trim()) {
      tl.to(ctaBtn, {
        autoAlpha: 1, scale: 1,
        duration: 0.45,
        ease: ctx.motion === 'punchy' ? 'back.out(1.3)' : 'power3.out'
      }, 0.3 + speed * 0.5 + features.length * 0.08 + 0.1);

      // Subtle pulse glow on CTA
      tl.to(ctaBtn, {
        boxShadow: '0 0 36px rgba(167, 139, 250, 0.3), 0 8px 32px rgba(167, 139, 250, 0.18)',
        duration: 0.5,
        ease: 'sine.inOut',
        yoyo: true,
        repeat: 2
      }, '-=0.1');
    }

    // Exit
    if (ctx.duration > 2) {
      var exitAt = ctx.duration - 0.6;
      tl.to(card, {
        autoAlpha: 0, y: -20, scale: 0.97,
        duration: 0.4,
        ease: 'power2.in'
      }, exitAt);
    }

    return tl;
  }
</script>
