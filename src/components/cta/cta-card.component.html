<script>
  function createTimeline(el, data, ctx) {
    var tl = gsap.timeline();
    var card = el.querySelector('.cta-card');
    var headline = el.querySelector('.cta-headline');
    var desc = el.querySelector('.cta-description');
    var button = el.querySelector('.cta-button');

    if (data.button_color) {
      button.style.background = data.button_color;
    }

    gsap.set(card, { autoAlpha: 0, y: 60 });

    // Card slides up
    tl.to(card, {
      autoAlpha: 1,
      y: 0,
      duration: 0.7,
      ease: 'power3.out'
    }, 0.3);

    // Button pulse
    if (button && button.textContent.trim()) {
      tl.to(button, {
        scale: 1.05,
        duration: 0.5,
        ease: 'sine.inOut',
        yoyo: true,
        repeat: 2
      }, 1.2);
    }

    // Exit
    if (ctx.duration > 2) {
      tl.to(card, {
        autoAlpha: 0,
        y: -30,
        duration: 0.4,
        ease: 'power2.in'
      }, ctx.duration - 0.5);
    }

    return tl;
  }
</script>
