<script>
  function createTimeline(el, data, ctx) {
    var tl = gsap.timeline();
    var card = el.querySelector('.cta-card');
    var headline = el.querySelector('.cta-headline');
    var desc = el.querySelector('.cta-description');
    var button = el.querySelector('.cta-button');

    if (data.button_color) {
      button.style.background = data.button_color;
      button.style.boxShadow = '0 0 30px ' + data.button_color + '40, 0 8px 24px ' + data.button_color + '25';
    }

    var speed = ctx.motion === 'minimal' ? 0.45 : ctx.motion === 'punchy' ? 0.6 : 0.75;

    // Card entrance with scale + blur
    gsap.set(card, { autoAlpha: 0, y: 50, scale: 1.06, filter: 'blur(5px)' });

    tl.to(card, {
      autoAlpha: 1, y: 0, scale: 1, filter: 'blur(0px)',
      duration: speed,
      ease: 'power3.out'
    }, 0.3);

    // Button pulse with glow
    if (button && button.textContent.trim()) {
      tl.to(button, {
        scale: 1.04,
        boxShadow: '0 0 40px rgba(167, 139, 250, 0.35), 0 8px 32px rgba(167, 139, 250, 0.2)',
        duration: 0.5,
        ease: 'sine.inOut',
        yoyo: true,
        repeat: 3
      }, 0.3 + speed + 0.3);
    }

    // Exit
    if (ctx.duration > 2) {
      var exitAt = ctx.duration - 0.6;
      tl.to(card, {
        autoAlpha: 0, y: -25, scale: 0.97,
        duration: 0.4,
        ease: 'power2.in'
      }, exitAt);
    }

    return tl;
  }
</script>
