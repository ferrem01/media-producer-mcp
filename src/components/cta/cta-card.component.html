<script>
  function createTimeline(el, data, ctx) {
    var tl = gsap.timeline();
    var card = el.querySelector('.cta-card');
    var headline = el.querySelector('.cta-headline');
    var desc = el.querySelector('.cta-description');
    var button = el.querySelector('.cta-button');
    var buttonGlow = el.querySelector('.cta-button-glow');

    if (data.button_color) {
      button.style.background = 'linear-gradient(135deg, ' + data.button_color + ' 0%, ' + data.button_color + 'cc 100%)';
      buttonGlow.style.background = data.button_color;
      button.style.boxShadow = '0 0 30px ' + data.button_color + '40, 0 8px 24px ' + data.button_color + '25, inset 0 1px 0 rgba(255,255,255,0.15)';
    }

    var speed = ctx.motion === 'minimal' ? 0.45 : ctx.motion === 'punchy' ? 0.6 : 0.75;

    // Card entrance with scale + blur
    gsap.set(card, { autoAlpha: 0, y: 50, scale: 1.06, filter: 'blur(5px)' });
    gsap.set(buttonGlow, { autoAlpha: 0, scale: 0.5 });

    tl.to(card, {
      autoAlpha: 1, y: 0, scale: 1, filter: 'blur(0px)',
      duration: speed,
      ease: 'power3.out'
    }, 0.3);

    // Button glow appears
    tl.to(buttonGlow, {
      autoAlpha: 0.3, scale: 1,
      duration: speed * 0.6,
      ease: 'power2.out'
    }, 0.3 + speed * 0.5);

    // Breathing glow pulse on the button
    if (button && button.textContent.trim()) {
      tl.to(buttonGlow, {
        scale: 1.3,
        autoAlpha: 0.15,
        duration: 1.2,
        ease: 'sine.inOut',
        yoyo: true,
        repeat: -1
      }, 0.3 + speed + 0.2);

      tl.to(button, {
        scale: 1.02,
        duration: 1.2,
        ease: 'sine.inOut',
        yoyo: true,
        repeat: -1
      }, 0.3 + speed + 0.2);
    }

    // Exit
    if (ctx.duration > 2) {
      var exitAt = ctx.duration - 0.7;
      tl.to([buttonGlow], {
        autoAlpha: 0,
        duration: 0.3,
        ease: 'power2.in'
      }, exitAt);
      tl.to(card, {
        autoAlpha: 0, y: -25, scale: 0.97,
        duration: 0.4,
        ease: 'power2.in'
      }, exitAt + 0.05);
    }

    return tl;
  }
</script>
