<style scoped>
  /* One design unit (--u) sized from the slot, so the card reads at video
     scale in any box: the audit measured the old card at 16px button type in
     a full frame, and a 40%-wide slot showed a small card lost in the middle. */
  .cta-root {
    --u: 1px; --pad: 40px;
    position: absolute; inset: 0;

    max-width: none;
  }
  /* The theme is measured from the scene ground (light / dark) or asked for

  .cta-root.t-light { --s-bg: #ffffff; --s-ink: var(--mp-color-on-light, #17171c); --s-muted: color-mix(in srgb, var(--mp-color-on-light, #17171c) 64%, #ffffff); --s-line: rgba(20, 20, 40, 0.09); --s-acc: var(--mp-color-primary, #393bf5); --b-bg: var(--mp-color-primary, #393bf5); --b-ink: var(--mp-color-on-primary, #ffffff); }
  .cta-root.t-dark { --s-bg: #16171d; --s-ink: #ffffff; --s-muted: rgba(255, 255, 255, 0.72); --s-line: rgba(255, 255, 255, 0.10); --s-acc: color-mix(in srgb, var(--mp-color-primary, #393bf5) 55%, #ffffff); --b-bg: var(--mp-color-primary, #393bf5); --b-ink: var(--mp-color-on-primary, #ffffff); }
  .cta-root.t-brand { --s-bg: linear-gradient(135deg, var(--mp-color-primary, #393bf5) 0%, color-mix(in srgb, var(--mp-color-primary, #393bf5) 72%, #ffffff) 100%); --s-ink: var(--mp-color-on-primary, #ffffff); --s-muted: color-mix(in srgb, var(--mp-color-on-primary, #ffffff) 80%, transparent); --s-line: rgba(255, 255, 255, 0.22); --s-acc: var(--mp-color-on-primary, #ffffff); --b-bg: var(--mp-color-on-primary, #ffffff); --b-ink: var(--mp-color-primary, #393bf5); }

    box-shadow: 0 calc(var(--pad) * 0.06) calc(var(--pad) * 0.16) rgba(20, 20, 60, 0.06), 0 calc(var(--pad) * 0.25) calc(var(--pad) * 0.7) rgba(20, 20, 60, 0.12);
    overflow: hidden;
  }
  .cta-root.surface-none .cta-card { background: none; border: 0; box-shadow: none; }

  /* The button and the link never shrink: a squeezed flex item clipped the

<script>
  function createTimeline(el, data, ctx) {
    var tl = gsap.timeline();
    var q = function (s) { return el.querySelector(s); };
    var root = q('.cta-root'), card = q('.cta-card');
    var DUR = (ctx && ctx.duration) || 5;
    function txt(sel, v) { q(sel).textContent = v === undefined || v === null ? '' : String(v); }
    txt('.cta-eyebrow', data.eyebrow);
    txt('.cta-headline', data.headline);
    txt('.cta-description', data.description);
    txt('.cta-label', data.button_text);
    txt('.cta-secondary', data.secondary_text);
    txt('.cta-url', data.url);
    var btn = q('.cta-button');
    if (!data.button_text) btn.style.display = 'none';
    if (data.arrow === false) q('.cta-arrow').style.display = 'none';

    var gl = window.mpGroundLum ? mpGroundLum() : null;
    var theme = data.theme === 'dark' || data.theme === 'light' || data.theme === 'brand' ? data.theme
      : (typeof gl === 'number' && gl < 0.18 ? 'dark' : 'light');
    root.classList.add('t-' + theme);
    if (data.surface === 'none') root.classList.add('surface-none');
    if (data.actions === 'stack') root.classList.add('stack');
    if (data.button_color) {
      btn.style.background = String(data.button_color);
      // The glow follows the button, not the brand: a black button with a
      // blue halo read as a mistake.
      btn.style.boxShadow = '0 calc(var(--u) * 10) calc(var(--u) * 26) color-mix(in srgb, ' + String(data.button_color) + ' 28%, transparent), inset 0 1px 0 rgba(255, 255, 255, 0.22)';
    }

    // SIZE: the card fills the slot (a landscape card never wider than ~1.9:1),
    // type from the box, then shrink until the content fits.
    // A margin keeps the shadow in the slot and the card off the frame edge.
    var W0 = el.clientWidth || 900, H0 = el.clientHeight || 520, pad = Math.round(Math.min(W0, H0) * 0.06);
    // Shadows are sized from this margin so the slot (which clips) never cuts them.
    root.style.setProperty('--pad', pad + 'px');
    // A full-frame slot overhangs the frame (the camera layer is larger than
    // the canvas; measured: cards 9px from the edge), so the margin is kept
    // inside what is SEEN.
    var rc = el.getBoundingClientRect(), sc = rc.width / W0 || 1;
    var ox = Math.max(0, -rc.left, rc.right - window.innerWidth) / sc, oy = Math.max(0, -rc.top, rc.bottom - window.innerHeight) / sc;
    var W = W0 - 2 * (pad + ox), H = H0 - 2 * (pad + oy);
    var cw = Math.min(W, H * 1.9);
    card.style.width = cw + 'px'; card.style.height = 'auto'; card.style.maxHeight = H + 'px';
    // Start generous (the type should own the card), shrink until it fits;
    // the card then hugs its content instead of framing empty space.
    var u = Math.min(cw / 540, H / 300);
    for (var i = 0; i < 30; i++) {
      root.style.setProperty('--u', u.toFixed(3) + 'px');
      if (card.scrollHeight <= H + 1 && card.scrollWidth <= card.clientWidth + 1) break;
      u *= 0.95;
    }

    // MOTION: the card rises, lines rise in reading order, the button lands
    // last and a single shine crosses it. No pops, no blur (house type rules).
    var AT = Number(data.at) || 0.2;
    gsap.set(card, { autoAlpha: 0, y: 28 });
    tl.to(card, { autoAlpha: 1, y: 0, duration: 0.55, ease: 'power3.out' }, AT);
    var lines = ['.cta-eyebrow', '.cta-headline', '.cta-description'].map(q).filter(function (x) { return x && x.textContent; });
    if (window.mpLineRise) mpLineRise(tl, lines, AT + 0.2, { stagger: 0.12, duration: 0.4, rise: 14 });
    var act = [btn, q('.cta-secondary')].filter(function (x) { return x && x.textContent && x.style.display !== 'none'; });
    var bAt = AT + 0.35 + lines.length * 0.12;
    if (act.length) {
      gsap.set(act, { autoAlpha: 0, y: 12 });
      tl.to(act, { autoAlpha: 1, y: 0, duration: 0.4, stagger: 0.1, ease: 'power3.out' }, bAt);
      // The shine parks off the button's left edge and crosses to past the right (it is 40% wide).
      gsap.set(q('.cta-shine'), { xPercent: -110 });
      tl.to(q('.cta-shine'), { xPercent: 260, duration: 0.9, ease: 'power2.inOut' }, bAt + 0.5);
      tl.fromTo(q('.cta-arrow'), { x: 0 }, { x: 6, duration: 0.35, ease: 'power2.out', yoyo: true, repeat: 1, immediateRender: false }, bAt + 0.55);
    }
    var url = q('.cta-url');
    if (url.textContent) { gsap.set(url, { autoAlpha: 0 }); tl.to(url, { autoAlpha: 1, duration: 0.4 }, bAt + 0.3); }
    if (data.press_at !== undefined && data.press_at !== null && data.button_text) {
      var pa = Number(data.press_at);
      tl.to(btn, { scale: 0.96, duration: 0.09, ease: 'power2.in' }, pa);
      tl.to(btn, { scale: 1, duration: 0.18, ease: 'power2.out' }, pa + 0.09);
    }
    // A closing card HOLDS; the cut is the exit. Opt in to a fade with exit:true.
    if (data.exit === true && DUR > 2) tl.to(card, { autoAlpha: 0, y: -16, duration: 0.4, ease: 'power2.in' }, DUR - 0.5);
    return tl;
  }
</script>
