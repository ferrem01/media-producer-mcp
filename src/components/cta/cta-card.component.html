<script>
  function createTimeline(el, data, ctx) {
    var tl = gsap.timeline();
    var card = el.querySelector('.cta-card');
    var headline = el.querySelector('.cta-headline');
    var desc = el.querySelector('.cta-description');
    var button = el.querySelector('.cta-button');

    if (data.button_color) {
      button.style.background = data.button_color;
    }

    gsap.set(card, { autoAlpha: 0, y: 60, scale: 0.95 });

    // Card slides up with scale
    tl.to(card, {
      autoAlpha: 1,
      y: 0,
      scale: 1,
      duration: 0.7,
      ease: 'power3.out'
    }, 0.3);

    // Button subtle pulse
    if (button && button.textContent.trim()) {
      tl.to(button, {
        scale: 1.03,
        duration: 0.6,
        ease: 'sine.inOut',
        yoyo: true,
        repeat: 3
      }, 1.2);
    }

    // Exit
    if (ctx.duration > 2) {
      tl.to(card, {
        autoAlpha: 0,
        y: -30,
        scale: 0.97,
        duration: 0.4,
        ease: 'power2.in'
      }, ctx.duration - 0.5);
    }

    return tl;
  }
</script>
