<template>
  <div class="bubble-map">
    <div class="bubble-grid"></div>
    <div class="bubble-layer"></div>
    <div class="bubble-title"></div>
  </div>
</template>

<style scoped>
  .bubble-map {
    position: relative;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: var(--mp-color-background, #09090b);
    font-family: var(--mp-font-family, 'Inter', system-ui, sans-serif);
  }

  .bubble-grid {
    position: absolute;
    inset: 6% 4%;
  }

  .map-dot {
    position: absolute;
    width: 7px;
    height: 7px;
    border-radius: 50%;
    transform: translate(-50%, -50%);
    background: rgba(255, 255, 255, 0.07);
  }

  .map-dot.land {
    background: rgba(99, 102, 241, 0.45);
  }

  .bubble-layer {
    position: absolute;
    inset: 6% 4%;
    pointer-events: none;
  }

  .map-bubble {
    position: absolute;
    transform: translate(-50%, -50%);
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .bubble-circle {
    border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, var(--mp-color-accent, #a78bfa), var(--mp-color-primary, #6366f1));
    box-shadow: 0 0 26px rgba(167, 139, 250, 0.5), inset 0 0 16px rgba(255, 255, 255, 0.15);
    border: 1.5px solid rgba(255, 255, 255, 0.35);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
  }

  .bubble-value {
    font-weight: 800;
    color: #ffffff;
    line-height: 1;
    font-variant-numeric: tabular-nums;
    text-shadow: 0 1px 6px rgba(0, 0, 0, 0.5);
  }

  .bubble-name {
    position: absolute;
    bottom: -26px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 16px;
    font-weight: 600;
    color: var(--mp-color-text, #ffffff);
    white-space: nowrap;
    text-shadow: 0 2px 10px rgba(0, 0, 0, 0.7);
  }

  .bubble-name:empty { display: none; }

  .bubble-title {
    position: absolute;
    top: 5%;
    left: 50%;
    transform: translateX(-50%);
    font-size: 30px;
    font-weight: 700;
    color: var(--mp-color-text, #ffffff);
    letter-spacing: -0.01em;
    text-shadow: 0 2px 16px rgba(0, 0, 0, 0.6);
  }

  .bubble-title:empty { display: none; }
</style>

<script>
  function createTimeline(el, data, ctx) {
    var tl = gsap.timeline();

    var grid = el.querySelector('.bubble-grid');
    var layer = el.querySelector('.bubble-layer');
    var titleEl = el.querySelector('.bubble-title');

    if (data.title && titleEl) titleEl.textContent = data.title;

    // Stylized continent regions (same approach as world-map) for the backdrop.
    var regions = [
      { x0: 8, x1: 26, y0: 18, y1: 42 },
      { x0: 20, x1: 30, y0: 44, y1: 78 },
      { x0: 44, x1: 56, y0: 16, y1: 38 },
      { x0: 46, x1: 60, y0: 38, y1: 74 },
      { x0: 56, x1: 88, y0: 14, y1: 46 },
      { x0: 78, x1: 90, y0: 60, y1: 74 }
    ];
    function isLand(px, py) {
      for (var r = 0; r < regions.length; r++) {
        var g = regions[r];
        if (px >= g.x0 && px <= g.x1 && py >= g.y0 && py <= g.y1) return true;
      }
      return false;
    }

    var cols = 46, rows = 24;
    for (var iy = 0; iy < rows; iy++) {
      for (var ix = 0; ix < cols; ix++) {
        var px = (ix + 0.5) / cols * 100;
        var py = (iy + 0.5) / rows * 100;
        var dot = document.createElement('div');
        dot.className = isLand(px, py) ? 'map-dot land' : 'map-dot';
        dot.style.left = px + '%';
        dot.style.top = py + '%';
        grid.appendChild(dot);
      }
    }

    var bubbles = (data.bubbles && data.bubbles.length) ? data.bubbles : [
      { x_pct: 17, y_pct: 30, value: 1200, label: 'N. America' },
      { x_pct: 49, y_pct: 26, value: 860, label: 'Europe' },
      { x_pct: 72, y_pct: 30, value: 1640, label: 'Asia' },
      { x_pct: 52, y_pct: 56, value: 540, label: 'Africa' },
      { x_pct: 25, y_pct: 62, value: 380, label: 'S. America' }
    ];

    // Radius proportional to sqrt(value) so AREA encodes magnitude.
    var maxVal = 1;
    bubbles.forEach(function (b) { if ((b.value || 0) > maxVal) maxVal = b.value; });
    var minR = 24, maxR = 78;

    var bubbleData = [];
    bubbles.forEach(function (b) {
      var val = b.value || 0;
      var r = minR + (maxR - minR) * Math.sqrt(val / maxVal);

      var wrap = document.createElement('div');
      wrap.className = 'map-bubble';
      wrap.style.left = (b.x_pct != null ? b.x_pct : 50) + '%';
      wrap.style.top = (b.y_pct != null ? b.y_pct : 50) + '%';

      var circle = document.createElement('div');
      circle.className = 'bubble-circle';
      circle.style.width = (r * 2) + 'px';
      circle.style.height = (r * 2) + 'px';

      var valueEl = document.createElement('div');
      valueEl.className = 'bubble-value';
      valueEl.style.fontSize = Math.max(13, Math.round(r * 0.45)) + 'px';
      valueEl.textContent = '0';

      var nameEl = document.createElement('div');
      nameEl.className = 'bubble-name';
      if (b.label) nameEl.textContent = b.label;

      circle.appendChild(valueEl);
      wrap.appendChild(circle);
      wrap.appendChild(nameEl);
      layer.appendChild(wrap);

      bubbleData.push({ wrap: wrap, circle: circle, valueEl: valueEl, nameEl: nameEl, value: val });
    });

    var speed = ctx.motion === 'minimal' ? 0.7 : ctx.motion === 'punchy' ? 1.3 : 1.0;

    gsap.set(grid.querySelectorAll('.map-dot'), { autoAlpha: 0, scale: 0.4 });
    bubbleData.forEach(function (b) {
      gsap.set(b.wrap, { autoAlpha: 1 });
      gsap.set(b.circle, { scale: 0, autoAlpha: 0 });
      gsap.set(b.nameEl, { autoAlpha: 0, y: 8 });
    });
    if (titleEl && titleEl.textContent.trim()) gsap.set(titleEl, { autoAlpha: 0, y: -16 });

    tl.to(grid.querySelectorAll('.map-dot'), {
      autoAlpha: 1, scale: 1,
      duration: 0.8, ease: 'power2.out',
      stagger: { each: 0.0015, from: 'center', grid: [rows, cols] }
    }, 0);

    if (titleEl && titleEl.textContent.trim()) {
      tl.to(titleEl, { autoAlpha: 1, y: 0, duration: 0.5, ease: 'power3.out' }, 0.3);
    }

    var start = 0.8;
    var bStagger = (ctx.motion === 'minimal' ? 0.15 : 0.25) / speed;
    bubbleData.forEach(function (b, i) {
      var at = start + i * bStagger;
      // Scale-in.
      tl.to(b.circle, { scale: 1, autoAlpha: 1, duration: 0.6 / speed, ease: 'back.out(1.6)' }, at);
      tl.to(b.nameEl, { autoAlpha: 1, y: 0, duration: 0.4, ease: 'power2.out' }, at + 0.2);
      // Count tick.
      var counter = { v: 0 };
      tl.to(counter, {
        v: b.value,
        duration: 0.9 / speed,
        ease: 'power2.out',
        onUpdate: function () { b.valueEl.textContent = Math.round(counter.v).toLocaleString(); }
      }, at);
    });

    // Ambient gentle breathing on the bubbles.
    bubbleData.forEach(function (b, i) {
      tl.to(b.circle, {
        scale: 1.06,
        duration: 2 + i * 0.2,
        ease: 'sine.inOut',
        yoyo: true,
        repeat: -1
      }, start + 1.2 + i * bStagger);
    });

    if (ctx.duration > 2) {
      var exitAt = ctx.duration - 0.6;
      tl.to([grid, layer, titleEl], { autoAlpha: 0, duration: 0.4, ease: 'power2.in' }, exitAt);
    }

    return tl;
  }
</script>
