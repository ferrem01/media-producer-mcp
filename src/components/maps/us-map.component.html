<template>
  <div class="us-map">
    <div class="us-grid"></div>
    <div class="us-markers"></div>
    <div class="us-title"></div>
  </div>
</template>

<style scoped>
  .us-map {
    position: relative;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: var(--mp-color-background, #09090b);
    font-family: var(--mp-font-family, 'Inter', system-ui, sans-serif);
  }

  .us-grid {
    position: absolute;
    inset: 12% 8%;
  }

  .map-dot {
    position: absolute;

  }

  .map-dot.land {
    background: var(--mp-color-primary, #6366f1);

    box-shadow: 0 0 7px rgba(99, 102, 241, 0.35);
  }

  .us-markers {
    position: absolute;
    inset: 12% 8%;
    pointer-events: none;
  }

  .map-marker {
    position: absolute;
    transform: translate(-50%, -50%);

    flex-direction: column;

  }

  .marker-dot {
    width: 18px;
    height: 18px;

  }

    position: absolute;

  }

  .marker-label:empty { display: none; }

  .us-title {
    position: absolute;
    top: 5%;

    transform: translateX(-50%);
    font-size: 30px;

    color: var(--mp-color-text, #ffffff);
    letter-spacing: -0.01em;
    text-shadow: 0 2px 16px rgba(0, 0, 0, 0.6);
  }

  .us-title:empty { display: none; }
</style>

<script>
  function createTimeline(el, data, ctx) {
    var tl = gsap.timeline();

    var grid = el.querySelector('.us-grid');
    var markersWrap = el.querySelector('.us-markers');
    var titleEl = el.querySelector('.us-title');

    if (data.title && titleEl) titleEl.textContent = data.title;

    // Loose contiguous-US silhouette: per-column vertical extents (top/bottom
    // in 0..100 pct of the grid box) across 0..100 pct horizontally. Roughly a
    // wide block with a tapered Texas wedge and Florida nub.
    function landBand(px) {
      // returns {top, bottom} or null
      if (px < 3 || px > 99) return null;
      var top, bottom;
      // Northern edge dips toward the middle (Great Lakes) and rises at coasts.
      top = 8 + 10 * Math.sin((px / 100) * Math.PI);
      // Southern edge: bulk ~64, with a Texas dip around 55-66 and Florida at 88-96.
      bottom = 62;
      if (px > 50 && px < 68) bottom = 62 + 22 * Math.sin(((px - 50) / 18) * Math.PI); // Texas wedge down
      if (px > 86 && px < 97) bottom = 70 + 18 * Math.sin(((px - 86) / 11) * Math.PI); // Florida nub
      return { top: top, bottom: bottom };
    }

    function isLand(px, py) {
      var b = landBand(px);
      if (!b) return false;
      return py >= b.top && py <= b.bottom;
    }

    var cols = 44, rows = 26;
    for (var iy = 0; iy < rows; iy++) {
      for (var ix = 0; ix < cols; ix++) {
        var px = (ix + 0.5) / cols * 100;
        var py = (iy + 0.5) / rows * 100;
        var land = isLand(px, py);
        var dot = document.createElement('div');
        dot.className = land ? 'map-dot land' : 'map-dot';
        dot.style.left = px + '%';
        dot.style.top = py + '%';
        grid.appendChild(dot);
      }
    }

    var markers = (data.markers && data.markers.length) ? data.markers : [
      { x_pct: 10, y_pct: 30, label: 'Seattle' },
      { x_pct: 12, y_pct: 50, label: 'Los Angeles' },
      { x_pct: 55, y_pct: 55, label: 'Dallas' },
      { x_pct: 70, y_pct: 30, label: 'Chicago' },
      { x_pct: 90, y_pct: 35, label: 'New York' }
    ];

    markers.forEach(function (m) {
      var wrap = document.createElement('div');
      wrap.className = 'map-marker';
      wrap.style.left = (m.x_pct != null ? m.x_pct : 50) + '%';
      wrap.style.top = (m.y_pct != null ? m.y_pct : 50) + '%';

      var ring = document.createElement('span');
      ring.className = 'marker-ring';
      var dot = document.createElement('span');
      dot.className = 'marker-dot';
      var lab = document.createElement('span');
      lab.className = 'marker-label';
      if (m.label) lab.textContent = m.label;

      wrap.appendChild(ring);
      wrap.appendChild(dot);
      wrap.appendChild(lab);
      markersWrap.appendChild(wrap);
    });

    var markerEls = markersWrap.querySelectorAll('.map-marker');
    var dots = markersWrap.querySelectorAll('.marker-dot');
    var rings = markersWrap.querySelectorAll('.marker-ring');
    var labels = markersWrap.querySelectorAll('.marker-label');

    var speed = ctx.motion === 'minimal' ? 0.7 : ctx.motion === 'punchy' ? 1.3 : 1.0;

    gsap.set(grid.querySelectorAll('.map-dot'), { autoAlpha: 0, scale: 0.4 });
    gsap.set(markerEls, { autoAlpha: 1 });
    gsap.set(dots, { scale: 0, autoAlpha: 0 });
    gsap.set(rings, { scale: 0.5, autoAlpha: 0 });
    gsap.set(labels, { autoAlpha: 0, y: 10 });
    if (titleEl && titleEl.textContent.trim()) gsap.set(titleEl, { autoAlpha: 0, y: -16 });

    tl.to(grid.querySelectorAll('.map-dot'), {
      autoAlpha: 1, scale: 1,
      duration: 0.8, ease: 'power2.out',
      stagger: { each: 0.0016, from: 'edges', grid: [rows, cols] }
    }, 0);

    if (titleEl && titleEl.textContent.trim()) {
      tl.to(titleEl, { autoAlpha: 1, y: 0, duration: 0.5, ease: 'power3.out' }, 0.3);
    }

    var markerStart = 0.9;
    var mStagger = (ctx.motion === 'minimal' ? 0.15 : 0.22) / speed;
    tl.to(dots, { scale: 1, autoAlpha: 1, duration: 0.4 / speed, ease: 'back.out(2)', stagger: mStagger }, markerStart);
    tl.to(labels, { autoAlpha: 1, y: 0, duration: 0.4, ease: 'power2.out', stagger: mStagger }, markerStart + 0.15);

    rings.forEach(function (ring, i) {
      tl.fromTo(ring,
        { scale: 0.5, autoAlpha: 0.7 },
        { scale: 3.4, autoAlpha: 0, duration: 2, ease: 'power2.out', repeat: -1 },
        markerStart + 0.3 + i * mStagger
      );
    });

    if (ctx.duration > 2) {
      var exitAt = ctx.duration - 0.6;
      tl.to([grid, markersWrap, titleEl], { autoAlpha: 0, duration: 0.4, ease: 'power2.in' }, exitAt);
    }

    return tl;
  }
</script>
