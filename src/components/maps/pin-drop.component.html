<script>
  function createTimeline(el, data, ctx) {
    var tl = gsap.timeline();

    var grid = el.querySelector('.pin-grid');
    var marker = el.querySelector('.pin-marker');
    var shadow = el.querySelector('.pin-shadow');
    var label = el.querySelector('.pin-label');
    var rings = el.querySelectorAll('.pin-ring');

    var locationLabel = data.location_label || 'San Francisco';
    if (label) label.textContent = locationLabel;

    var speed = ctx.motion === 'minimal' ? 0.7 : ctx.motion === 'punchy' ? 1.3 : 1.0;

    if (grid) gsap.set(grid, { autoAlpha: 0 });
    gsap.set(marker, { y: -340, scale: 0.7, autoAlpha: 0 });
    gsap.set(shadow, { scaleX: 0.2, autoAlpha: 0 });
    gsap.set(rings, { scale: 0.4, autoAlpha: 0 });
    if (label) gsap.set(label, { autoAlpha: 0, y: 18 });

    if (grid) tl.to(grid, { autoAlpha: 0.45, duration: 0.6, ease: 'power2.out' }, 0);

    // Pin drops with a bounce.
    tl.to(marker, {
      y: 0, scale: 1, autoAlpha: 1,
      duration: 0.9 / speed,
      ease: 'bounce.out'
    }, 0.3);

    // Shadow appears on landing.
    tl.to(shadow, { scaleX: 1, autoAlpha: 1, duration: 0.3, ease: 'power2.out' }, 0.3 + 0.65 / speed);

    // Impact squash.
    tl.to(marker, { scaleX: 1.18, scaleY: 0.85, duration: 0.12, ease: 'power2.out' }, 0.3 + 0.62 / speed);
    tl.to(marker, { scaleX: 1, scaleY: 1, duration: 0.25, ease: 'elastic.out(1, 0.4)' }, '>');

    // Label fades up.
    if (label) tl.to(label, { autoAlpha: 1, y: 0, duration: 0.5, ease: 'power3.out' }, 0.3 + 0.7 / speed);

    // Concentric pulse rings emanate continuously.
    var ringStart = 0.3 + 0.7 / speed;
    rings.forEach(function (ring, i) {
      tl.fromTo(ring,
        { scale: 0.4, autoAlpha: 0.8 },
        { scale: 3.2, autoAlpha: 0, duration: 2.2, ease: 'power2.out', repeat: -1 },
        ringStart + i * 0.7
      );
    });

    // Exit.
    if (ctx.duration > 2) {
      var exitAt = ctx.duration - 0.6;
      tl.to([marker, shadow, label, grid], { autoAlpha: 0, duration: 0.4, ease: 'power2.in' }, exitAt);
    }

    return tl;
  }
</script>
