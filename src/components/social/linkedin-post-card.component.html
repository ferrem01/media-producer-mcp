<script>
  function createTimeline(el, data, ctx) {
    var tl = gsap.timeline();
    var card = el.querySelector('.li-card');
    var avatar = el.querySelector('.li-avatar');
    var nameEl = el.querySelector('.li-name');
    var headlineEl = el.querySelector('.li-headline');
    var textEl = el.querySelector('.li-text');
    var reactCount = el.querySelector('.li-react-count');
    var commentCount = el.querySelector('.li-comment-count');
    var reactIcons = el.querySelector('.li-react-icons');

    if (data.name) nameEl.textContent = data.name;
    if (data.headline) headlineEl.textContent = data.headline;
    if (data.text) textEl.textContent = data.text;
    if (data.avatar_color && avatar) avatar.style.background = data.avatar_color;
    var reactions = data.reactions !== undefined ? data.reactions : 1240;
    var comments = data.comments !== undefined ? data.comments : 86;

    function fmt(n) {
      n = Math.round(n);
      if (n >= 1000000) return (n / 1000000).toFixed(1).replace(/\.0$/, '') + 'M';
      if (n >= 1000) return (n / 1000).toFixed(1).replace(/\.0$/, '') + 'K';
      return String(n);
    }

    var speed = ctx.motion === 'minimal' ? 0.5 : ctx.motion === 'punchy' ? 0.65 : 0.8;

    gsap.set(card, { autoAlpha: 0, y: 44, scale: 1.03, filter: 'blur(4px)' });
    gsap.set([avatar, el.querySelector('.li-names'), textEl, el.querySelector('.li-stats')], { autoAlpha: 0, y: 14 });

    tl.to(card, { autoAlpha: 1, y: 0, scale: 1, filter: 'blur(0px)', duration: speed, ease: 'power3.out' }, 0.25);
    tl.to([avatar, el.querySelector('.li-names'), textEl, el.querySelector('.li-stats')], {
      autoAlpha: 1, y: 0, duration: speed * 0.7, stagger: 0.07, ease: 'power2.out'
    }, 0.4);

    // reaction icons pop
    tl.from(reactIcons, { scale: 0.4, duration: 0.4, ease: 'back.out(2.2)', transformOrigin: '0% 50%' }, 0.95);

    var rObj = { val: 0 };
    tl.to(rObj, { val: reactions, duration: speed * 1.8, ease: 'power2.out', onUpdate: function () { reactCount.textContent = fmt(rObj.val); } }, 0.9);
    var cObj = { val: 0 };
    tl.to(cObj, { val: comments, duration: speed * 1.8, ease: 'power2.out', onUpdate: function () { commentCount.textContent = fmt(cObj.val); } }, 1.0);

    // ambient: subtle reaction icon breathe
    tl.to(reactIcons, { scale: 1.08, duration: 1.1, ease: 'sine.inOut', yoyo: true, repeat: -1, transformOrigin: '0% 50%' }, 1.9);

    if (ctx.duration > 2) {
      var exitAt = ctx.duration - 0.6;
      tl.to(card, { autoAlpha: 0, y: -24, scale: 0.98, duration: 0.45, ease: 'power2.in' }, exitAt);
    }

    return tl;
  }
</script>
