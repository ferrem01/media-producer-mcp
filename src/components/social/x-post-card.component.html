<script>
  function createTimeline(el, data, ctx) {
    var tl = gsap.timeline();
    var card = el.querySelector('.x-card');
    // Display scale: the card is fixed-size by design; hero shots blow it up.
    if (data.scale) { card.style.transform = 'scale(' + Number(data.scale) + ')'; card.style.transformOrigin = '50% 50%'; }
    var avatar = el.querySelector('.x-avatar');
    var nameEl = el.querySelector('.x-name');
    var handleEl = el.querySelector('.x-handle');
    var verified = el.querySelector('.x-verified');
    var textEl = el.querySelector('.x-text');
    var stats = el.querySelectorAll('.x-stat');

    if (data.name) nameEl.textContent = data.name;
    if (data.handle) handleEl.textContent = data.handle.charAt(0) === '@' ? data.handle : '@' + data.handle;
    if (data.text) textEl.textContent = data.text;
    if (data.verified === false && verified) verified.style.display = 'none';
    if (data.avatar_color && avatar) avatar.style.background = data.avatar_color;
    var timeEl = el.querySelector('.x-time');
    if (data.time && timeEl) timeEl.textContent = data.time;

    // count targets
    var likeEl = el.querySelector('.x-likes .x-count');
    var repostEl = el.querySelector('.x-reposts .x-count');
    var replyEl = el.querySelector('.x-replies .x-count');
    if (data.likes !== undefined && likeEl) likeEl.setAttribute('data-val', String(data.likes));
    if (data.reposts !== undefined && repostEl) repostEl.setAttribute('data-val', String(data.reposts));
    if (data.replies !== undefined && replyEl) replyEl.setAttribute('data-val', String(data.replies));

    function fmt(n) {
      n = Math.round(n);
      if (n >= 1000000) return (n / 1000000).toFixed(1).replace(/\.0$/, '') + 'M';
      if (n >= 1000) return (n / 1000).toFixed(1).replace(/\.0$/, '') + 'K';
      return String(n);
    }

    var speed = ctx.motion === 'minimal' ? 0.55 : ctx.motion === 'punchy' ? 0.7 : 0.85;

    gsap.set(card, { autoAlpha: 0, y: 50, scale: 1.04, filter: 'blur(4px)' });
    gsap.set([avatar, nameEl, handleEl, verified, textEl], { autoAlpha: 0, y: 16 });
    gsap.set(stats, { autoAlpha: 0, y: 12 });

    tl.to(card, { autoAlpha: 1, y: 0, scale: 1, filter: 'blur(0px)', duration: speed, ease: 'power3.out' }, 0.25);
    tl.to([avatar, nameEl, handleEl, verified, textEl], {
      autoAlpha: 1, y: 0, duration: speed * 0.8, stagger: 0.06, ease: 'power2.out'
    }, 0.4);
    tl.to(stats, { autoAlpha: 1, y: 0, duration: speed * 0.7, stagger: 0.08, ease: 'power2.out' }, 0.7);

    // count tick-up
    stats.forEach(function (s, i) {
      var c = s.querySelector('.x-count');
      if (!c) return;
      var target = parseFloat(c.getAttribute('data-val')) || 0;
      var obj = { val: 0 };
      tl.to(obj, {
        val: target, duration: speed * 1.6, ease: 'power2.out',
        onUpdate: function () { c.textContent = fmt(obj.val); }
      }, 0.85 + i * 0.08);
    });

    // ambient: subtle like-heart pulse
    var heart = el.querySelector('.x-likes svg');
    if (heart) {
      tl.to(heart, { scale: 1.18, duration: 1.1, ease: 'sine.inOut', yoyo: true, repeat: -1, transformOrigin: '50% 50%' }, 1.6);
    }

    if (ctx.duration > 2) {
      var exitAt = ctx.duration - 0.6;
      tl.to(card, { autoAlpha: 0, y: -25, scale: 0.98, duration: 0.45, ease: 'power2.in' }, exitAt);
    }

    return tl;
  }
</script>
