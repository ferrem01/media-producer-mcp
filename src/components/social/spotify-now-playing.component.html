<script>
  function createTimeline(el, data, ctx) {
    var tl = gsap.timeline();
    var card = el.querySelector('.sp-card');
    // Display scale: the card is fixed-size by design; hero shots blow it up.
    // Folded into every GSAP scale value -- an inline transform would be
    // overwritten by the first tween that touches scale.
    // Hero scale is ~1-2.5 by design; an unclamped value (measured live: 42)
    // blew the card past the frame -- artist line clipped ~10180px off-canvas.
    var S = Number(data.scale) || 1;
    S = Math.min(2.5, Math.max(0.5, S));
    card.style.transformOrigin = '50% 50%';
    if (data.layout === 'card') {
      card.classList.add('sp-portrait');
      el.querySelector('.sp-now-label').textContent = 'Spotify';
    }
    var art = el.querySelector('.sp-art');
    var track = el.querySelector('.sp-track');
    var artist = el.querySelector('.sp-artist');
    var bars = el.querySelectorAll('.sp-bar');
    var fill = el.querySelector('.sp-progress-fill');
    var info = el.querySelector('.sp-info');

    if (data.track) track.textContent = data.track;
    if (data.artist) artist.textContent = data.artist;
    if (data.art_color && art) art.style.background = data.art_color;

    var speed = ctx.motion === 'minimal' ? 0.5 : ctx.motion === 'punchy' ? 0.65 : 0.8;

    gsap.set(card, { autoAlpha: 0, y: 44, scale: 1.03 * S, filter: 'blur(4px)' });
    gsap.set(art, { autoAlpha: 0, scale: 0.8 });
    gsap.set([el.querySelector('.sp-now'), track, artist, el.querySelector('.sp-progress')], { autoAlpha: 0, x: -14 });

    tl.to(card, { autoAlpha: 1, y: 0, scale: S, filter: 'blur(0px)', duration: speed, ease: 'power3.out' }, 0.25);
    tl.to(art, { autoAlpha: 1, scale: 1, duration: speed * 0.8, ease: 'back.out(1.5)', transformOrigin: '50% 50%' }, 0.35);
    tl.to([el.querySelector('.sp-now'), track, artist, el.querySelector('.sp-progress')], {
      autoAlpha: 1, x: 0, duration: speed * 0.7, stagger: 0.07, ease: 'power2.out'
    }, 0.45);

    // equalizer bars dance (ambient, looping)
    bars.forEach(function (b, i) {
      tl.to(b, {
        scaleY: 2.6 + (i % 2) * 0.6,
        duration: 0.34 + i * 0.05,
        ease: 'sine.inOut',
        yoyo: true,
        repeat: -1,
        transformOrigin: 'bottom'
      }, 0.9 + i * 0.08);
    });

    // progress bar advances across the clip
    var prog = { v: 0 };
    var fillDur = ctx.duration > 2 ? (ctx.duration - 1.2) : 4;
    tl.to(prog, {
      v: data.progress !== undefined ? data.progress : 72,
      duration: fillDur,
      ease: 'none',
      onUpdate: function () { fill.style.width = prog.v + '%'; }
    }, 0.9);

    if (ctx.duration > 2) {
      var exitAt = ctx.duration - 0.6;
      tl.to(card, { autoAlpha: 0, y: -24, scale: 0.98 * S, duration: 0.45, ease: 'power2.in' }, exitAt);
    }

    return tl;
  }
</script>
