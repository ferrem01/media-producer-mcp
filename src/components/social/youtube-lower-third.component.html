<script>
  function createTimeline(el, data, ctx) {
    var tl = gsap.timeline();
    var bar = el.querySelector('.yt-bar');
    var avatar = el.querySelector('.yt-avatar');
    var channel = el.querySelector('.yt-channel');
    var subsLine = el.querySelector('.yt-subs');
    var subCount = el.querySelector('.yt-sub-count');
    var subBtn = el.querySelector('.yt-sub-btn');
    var bell = el.querySelector('.yt-bell');

    if (channel) channel.textContent = data.channel || data.title || data.app || 'Quotient';
    if (data.avatar_color && avatar) avatar.style.background = data.avatar_color;
    var subs = data.subscribers !== undefined ? data.subscribers : 1250000;

    function fmt(n) {
      n = Math.round(n);
      if (n >= 1000000) return (n / 1000000).toFixed(1).replace(/\.0$/, '') + 'M';
      if (n >= 1000) return (n / 1000).toFixed(0) + 'K';
      return String(n);
    }

    var speed = ctx.motion === 'minimal' ? 0.5 : ctx.motion === 'punchy' ? 0.65 : 0.8;

    gsap.set(bar, { autoAlpha: 0, x: -60, scale: 1.02, filter: 'blur(4px)' });
    gsap.set([avatar, channel, subsLine], { autoAlpha: 0, x: -16 });
    gsap.set([subBtn, bell], { autoAlpha: 0, scale: 0.7 });

    tl.to(bar, { autoAlpha: 1, x: 0, scale: 1, filter: 'blur(0px)', duration: speed, ease: 'power3.out' }, 0.25);
    tl.to([avatar, channel, subsLine], { autoAlpha: 1, x: 0, duration: speed * 0.7, stagger: 0.06, ease: 'power2.out' }, 0.4);
    tl.to(subBtn, { autoAlpha: 1, scale: 1, duration: speed * 0.7, ease: 'back.out(2)', transformOrigin: '50% 50%' }, 0.75);
    tl.to(bell, { autoAlpha: 1, scale: 1, duration: speed * 0.7, ease: 'back.out(2)', transformOrigin: '50% 50%' }, 0.85);

    // sub count tick-up
    var obj = { val: 0 };
    tl.to(obj, { val: subs, duration: speed * 1.8, ease: 'power2.out', onUpdate: function () { subCount.textContent = fmt(obj.val); } }, 0.7);

    // subscribe button pulse on arrival
    tl.to(subBtn, { scale: 1.08, duration: 0.16, yoyo: true, repeat: 1, ease: 'power2.inOut', transformOrigin: '50% 50%' }, 1.4);

    // ambient: bell wiggle
    tl.to(bell.querySelector('svg'), { rotation: 14, duration: 0.12, yoyo: true, repeat: 5, ease: 'sine.inOut', transformOrigin: '50% 10%' }, 1.7);
    tl.to(subBtn, { scale: 1.03, duration: 1.1, ease: 'sine.inOut', yoyo: true, repeat: -1, transformOrigin: '50% 50%' }, 2.4);

    if (ctx.duration > 2) {
      var exitAt = ctx.duration - 0.6;
      tl.to(bar, { autoAlpha: 0, x: -40, scale: 0.98, duration: 0.45, ease: 'power2.in' }, exitAt);
    }

    return tl;
  }
</script>
