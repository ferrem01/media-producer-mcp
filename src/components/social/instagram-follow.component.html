<script>
  function createTimeline(el, data, ctx) {
    var tl = gsap.timeline();
    var chip = el.querySelector('.ig-chip');
    var ring = el.querySelector('.ig-ring');
    var avatar = el.querySelector('.ig-avatar');
    var username = el.querySelector('.ig-username');
    var sub = el.querySelector('.ig-sub');
    var btnFollow = el.querySelector('.ig-btn-follow');
    var btnFollowing = el.querySelector('.ig-btn-following');

    if (data.username) username.textContent = (data.username.charAt(0) === '@' ? data.username.slice(1) : data.username);
    if (data.subtitle && sub) sub.textContent = data.subtitle;
    if (data.avatar_color && avatar) avatar.style.background = data.avatar_color;

    var speed = ctx.motion === 'minimal' ? 0.5 : ctx.motion === 'punchy' ? 0.65 : 0.8;

    gsap.set(chip, { autoAlpha: 0, y: 40, scale: 1.05, filter: 'blur(4px)' });
    gsap.set([username, sub], { autoAlpha: 0, x: -14 });
    gsap.set(btnFollowing, { autoAlpha: 0 });

    tl.to(chip, { autoAlpha: 1, y: 0, scale: 1, filter: 'blur(0px)', duration: speed, ease: 'power3.out' }, 0.25);
    tl.from(ring, { scale: 0.5, duration: speed, ease: 'back.out(1.6)', transformOrigin: '50% 50%' }, 0.3);
    tl.to([username, sub], { autoAlpha: 1, x: 0, duration: speed * 0.7, stagger: 0.07, ease: 'power2.out' }, 0.45);

    // Follow -> Following transition
    var swapAt = 1.6;
    tl.to(btnFollow, { autoAlpha: 0, duration: 0.3, ease: 'power2.in' }, swapAt);
    tl.to(btnFollowing, { autoAlpha: 1, duration: 0.3, ease: 'power2.out' }, swapAt + 0.05);
    tl.fromTo(el.querySelector('.ig-btn'), { scale: 1 }, { scale: 0.9, duration: 0.12, yoyo: true, repeat: 1, ease: 'power2.inOut', transformOrigin: '50% 50%' }, swapAt - 0.05);

    // ambient: gentle ring rotation glow via avatar pulse
    tl.to(ring, { rotation: 360, duration: 8, ease: 'none', repeat: -1, transformOrigin: '50% 50%' }, swapAt + 0.4);

    if (ctx.duration > 2) {
      var exitAt = ctx.duration - 0.6;
      tl.to(chip, { autoAlpha: 0, y: -22, scale: 0.97, duration: 0.45, ease: 'power2.in' }, exitAt);
    }

    return tl;
  }
</script>
