<script>
  function createTimeline(el, data, ctx) {
    var tl = gsap.timeline();
    data = data || {};
    var DUR = (ctx && ctx.duration) || 6;
    var num = function (v, d) { var n = Number(v); return (v === null || v === undefined || v === '' || !isFinite(n)) ? d : n; };

    // ---- Ground: a soft lavender field (or any CSS background) ----
    var bgColor = data.background || 'linear-gradient(135deg, #b7a6f2 0%, #d9d2fb 55%, #eef0ff 100%)';
    root.style.background = bgColor;

    // ---- Cards: given, repeated to fill `count` (a row that reads as

      { from: 'Acme Weekly', subject: 'Last chance!', color: '#6366f1' },
      { from: 'Acme Weekly', subject: 'Just checking in', color: '#6366f1' }
    ] : [
      { name: 'Toy Car', price: '$21.50', emoji: '🚗' }, { name: 'Fiddle Leaf', price: '$34.00', emoji: '🪴' },
      { name: 'Desk Lamp', price: '$48.00', emoji: '💡' }, { name: 'Sneakers', price: '$89.00', emoji: '👟' },
      { name: 'Gift Box', price: '$15.00', emoji: '🎁' }, { name: 'Headphones', price: '$129', emoji: '🎧' }
    ];
    var given = (Array.isArray(data.cards) && data.cards.length ? data.cards : DEFAULTS).filter(function (c) { return c && typeof c === 'object'; });
    var count = Math.max(given.length, Math.min(40, num(data.count, 18)));
    var TINTS = ['#fde7ef', '#e6f0ff', '#e9f8ee', '#fff3dc', '#efe9ff', '#e8f7f8'];
    var cards = [];
    for (var i = 0; i < count; i++) {
      var c = given[i % given.length];
      var card = document.createElement('div'); card.className = 'cc-card';
      if (style === 'email') {
        var hd = document.createElement('div'); hd.className = 'cc-mail-hd';
        var av = document.createElement('div'); av.className = 'cc-av'; av.style.background = c.color || '#6366f1';
        av.textContent = String(c.from || '?').charAt(0).toUpperCase();
        var fr = document.createElement('div'); fr.className = 'cc-from'; fr.textContent = c.from || '';
        hd.appendChild(av); hd.appendChild(fr); card.appendChild(hd);
        var sj = document.createElement('div'); sj.className = 'cc-subj'; sj.textContent = c.subject || ''; card.appendChild(sj);
        [0.95, 0.8, 0.9, 0.6, 0.85].forEach(function (w) { var ln = document.createElement('div'); ln.className = 'cc-line'; ln.style.width = (w * 100) + '%'; card.appendChild(ln); });
      } else {
        var img = document.createElement('div'); img.className = 'cc-img'; img.style.background = c.tint || TINTS[i % TINTS.length];
        if (c.image) { var im = document.createElement('img'); im.src = c.image; im.alt = ''; img.appendChild(im); }
        else img.textContent = c.emoji || c.icon || '';
        card.appendChild(img);
        var nm = document.createElement('div'); nm.className = 'cc-name'; nm.textContent = c.name || ''; card.appendChild(nm);
        var mt = document.createElement('div'); mt.className = 'cc-meta';
        var pr = document.createElement('div'); pr.className = 'cc-price'; pr.textContent = c.price || '';
        var st = document.createElement('div'); st.className = 'cc-stars'; st.textContent = '★★★★☆';
        mt.appendChild(pr); mt.appendChild(st); card.appendChild(mt);
      }
      row.appendChild(card);
      cards.push(card);
    }

    // ---- Scale the 1920x1080 design to cover the box ----
    var fit = function () {
      var w = el.clientWidth || 1920, h = el.clientHeight || 1080;
      var s = Math.max(w / 1920, h / 1080);
      stage.style.transform = 'translate(' + ((w - 1920 * s) / 2) + 'px,' + ((h - 1080 * s) / 2) + 'px) scale(' + s + ')';
    };
    fit();
    if (typeof ResizeObserver !== 'undefined') new ResizeObserver(fit).observe(el);

    // ---- The row in 3D: cards stand along a diagonal into depth, each
    // turned toward the camera like a domino in a line ----
    var GAP = num(data.gap, 118);
    var yaw = num(data.angle, -32);
    gsap.set(row, { rotationY: yaw, rotationX: 12 });
    cards.forEach(function (card, k) {
      gsap.set(card, { x: k * GAP, z: -k * 26, rotationY: 34 });
    });

    // ---- Domino entrance: each card stands up from flat, one after the
    // next (the first few land where the eye is) ----
    var enterAt = num(data.enter_at, 0.1), pace = num(data.pace, 0.07);
    cards.forEach(function (card, k) {
      gsap.set(card, { rotationX: -92, autoAlpha: 0 });

    });

    // ---- The camera slides along the row (more cards keep coming) ----
    var travel = num(data.travel, Math.min(count * GAP * 0.55, 1300));
    tl.fromTo(row, { x: 0 }, { x: -travel, duration: DUR, ease: 'sine.inOut', immediateRender: false }, 0);

    // ---- Hover: the cursor comes to a card and a tag pops beside it ----

      gsap.set(cursor, { autoAlpha: 0, x: 1100, y: 900 });

      var idx = Math.max(0, Math.min(count - 1, Math.round(num(h.card, hi))));

      var ga = num(data.grey_at, DUR);
      tl.to(stage, { filter: 'grayscale(1) contrast(0.92) brightness(0.98)', duration: 0.6, ease: 'power2.inOut' }, ga);

      tl.to(cursor, { autoAlpha: 0, duration: 0.3 }, ga);
    }
    return tl;
  }
