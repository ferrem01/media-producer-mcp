<template>
  <div class="sgp"><div class="sgp-pool"></div><div class="sgp-row"></div></div>
</template>

<style scoped>
  /* ── signal-pool: leads standing in a pool, each on a column of SIGNAL
     slips -- one row of an activity log per brand interaction. A landing
     signal slides in under the lead's sticker and lifts him, so the more
     signals, the taller he stands: height IS the score. Signals can peel
     off (he drops back), a badge can stick on, a lead can move out. ── */
  .sgp { position: absolute; inset: 0; pointer-events: none; font-family: 'Inter', sans-serif; }
  .sgp-pool { position: absolute; left: 2%; right: 2%; bottom: 0; border: 3px solid var(--sgp-ink, #17171c);
    border-radius: 999px / 70%; background: var(--sgp-water, #c9d3f7); }
  .sgp-pool svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
  .sgp-pool path { fill: none; stroke: var(--sgp-ink, #17171c); stroke-width: 2.5; stroke-linecap: round; opacity: 0.55; vector-effect: non-scaling-stroke; }
  .sgp-row { position: absolute; inset: 0; }
  .sgp-lead { position: absolute; bottom: 0; }
  .sgp-stk { position: absolute; left: 0; right: 0; bottom: 0; display: flex; justify-content: center; align-items: flex-end; }
  .sgp-stk img { max-width: 100%; max-height: 100%; object-fit: contain; display: block;
    filter: drop-shadow(0 12px 18px rgba(43, 36, 48, 0.2)); }
  .sgp-slip { position: absolute; display: flex; align-items: center; gap: 0.45em;
    padding: 0 0.6em; box-sizing: border-box; background: var(--sgp-paper, #fffaf2);
    border: 2px solid var(--sgp-ink, #17171c); border-radius: 0.35em; color: var(--sgp-ink, #17171c);
    font-weight: 600; white-space: nowrap; overflow: hidden; box-shadow: 0 3px 0 rgba(23, 23, 28, 0.12); }
  .sgp-dot { flex: 0 0 auto; width: 0.62em; height: 0.62em; border-radius: 50%; border: 1.5px solid var(--sgp-ink, #17171c); }
  .sgp-txt { flex: 1 1 auto; overflow: hidden; text-overflow: ellipsis; }
  .sgp-time { flex: 0 0 auto; font-weight: 500; opacity: 0.55; font-size: 0.82em; }
  .sgp-badge { position: absolute; width: 42%; right: -12%; z-index: 3; }
  .sgp-badge img { width: 100%; display: block; filter: drop-shadow(0 8px 12px rgba(43, 36, 48, 0.25)); }
  .sgp-label { position: absolute; left: 50%; transform: translateX(-50%); white-space: nowrap;
    font-family: 'Courier New', ui-monospace, monospace; font-weight: 700; color: var(--sgp-ink, #17171c); }
  .sgp-count { position: absolute; left: 50%; white-space: nowrap; font-weight: 800; color: #fff;
    background: var(--sgp-ink, #17171c); border-radius: 999px; padding: 0.2em 0.7em; }
</style>

<script>
  function createTimeline(el, data, ctx) {
    var tl = gsap.timeline();
    var host = el.querySelector('.sgp');
    var row = host.querySelector('.sgp-row');
    var W = host.clientWidth || 1600, H = host.clientHeight || 800;
    var leads = Array.isArray(data.leads) ? data.leads.filter(function (l) { return l && (l.src || l.sticker); }) : [];
    if (!leads.length) return tl;
    if (data.ink) host.style.setProperty('--sgp-ink', data.ink);
    if (data.water) host.style.setProperty('--sgp-water', data.water);
    // Signal colours: the brand guide's families.
    var KIND = { email: '#E07A4F', web: '#2F6E35', social: '#EF8DB8', event: '#3B57E0', campaign: '#3B57E0', sales: '#8E4F72', flow: '#9A4A3A' };
    function num(v, d) { var n = Number(v); return isFinite(n) ? n : d; }
    // Deterministic jitter (no Math.random: every capture must match).
    function jit(i, j) { var x = Math.sin(i * 12.9898 + j * 78.233) * 43758.5453; return (x - Math.floor(x)) * 2 - 1; }

    // GEOMETRY. Leads stand evenly across the box on one floor; the tallest
    // possible column (every signal it ever holds) must fit under the top.
    var n = leads.length;
    var showPool = data.pool !== false;
    var poolH = showPool ? H * 0.12 : 0;
    var floor = H - poolH * 0.55; // feet sit in the water
    var slot = W / n;
    var colW = Math.min(slot * 0.8, H * 0.42);
    var stkH = Math.min(colW * 1.08, H * 0.34);
    var maxSig = 1;
    leads.forEach(function (l) { maxSig = Math.max(maxSig, (l.signals || []).length); });
    var slipW = Math.min(slot * 0.94, colW * 1.45); // a log row is wider than the sticker
    var hasCount = leads.some(function (l) { return l.count; });
    var topRoom = H * 0.03 + (hasCount ? H * 0.085 : 0);
    var slipH = Math.max(14, Math.min(H * 0.07, (floor - stkH - topRoom) / maxSig));
    var slipGap = slipH * 0.12;
    var step = slipH + slipGap;
    var fs = Math.max(10, Math.round(slipH * 0.42));
    if (showPool) {
      var pool = host.querySelector('.sgp-pool');
      pool.style.height = poolH + 'px';
      pool.innerHTML = '<svg viewBox="0 0 100 20" preserveAspectRatio="none"><path d="M12 9 q3 -3 6 0 t6 0"/><path d="M70 12 q3 -3 6 0 t6 0"/><path d="M42 14 q3 -3 6 0 t6 0"/></svg>';
      gsap.set(pool, { autoAlpha: 0, scaleX: 0.92 });
      tl.to(pool, { autoAlpha: 1, scaleX: 1, duration: 0.5, ease: 'back.out(1.6)' }, Math.max(0, num(data.pool_at, 0)));
    } else host.querySelector('.sgp-pool').style.display = 'none';

    var allTx = [];
    leads.forEach(function (l, li) {
      var col = document.createElement('div');
      col.className = 'sgp-lead';
      col.setAttribute('data-anchor', 'lead-' + (l.id || li));
      var cx = slot * (li + 0.5);
      col.style.left = (cx - colW / 2) + 'px';
      col.style.width = colW + 'px';
      col.style.bottom = (H - floor) + 'px';
      col.style.fontSize = fs + 'px';
      row.appendChild(col);

      // Signals in landing order; at <= 0 = already in his log at frame 0.
      var sigs = (l.signals || []).map(function (s, si) { return { s: s, at: num(s.at, 0), si: si }; });
      sigs.sort(function (a, b) { return a.at - b.at; });
      var peel = l.peel && num(l.peel.count, 0) > 0 ? { at: num(l.peel.at, 0), count: Math.round(num(l.peel.count, 0)) } : null;

      // The column: slip k (k-th to land) sits k steps up from the floor;
      // the sticker rides on top of however many have landed.
      var stk = document.createElement('div');
      stk.className = 'sgp-stk';
      stk.style.height = stkH + 'px';
      var img = document.createElement('img');
      img.src = l.src || ('/assets/_system/stickers/' + String(l.sticker).toLowerCase().replace(/[^a-z0-9]+/g, '-') + '.webp');
      stk.appendChild(img);
      col.appendChild(stk);
      var rot = num(l.rotation, jit(li, 1) * 3);
      var startN = sigs.filter(function (x) { return x.at <= 0; }).length;
      gsap.set(stk, { y: -startN * step, rotation: rot, transformOrigin: '50% 100%' });

      var enterAt = num(l.enter_at, 0);
      if (enterAt > 0) {
        gsap.set(col, { autoAlpha: 0, y: -H * 0.25 });
        tl.to(col, { autoAlpha: 1, y: 0, duration: 0.55, ease: 'back.out(1.4)' }, enterAt);
      }

      sigs.forEach(function (x, k) {
        var s = x.s;
        var slip = document.createElement('div');
        slip.className = 'sgp-slip';
        slip.style.height = slipH + 'px';
        slip.style.bottom = (k * step) + 'px';
        slip.style.width = slipW + 'px';
        slip.style.left = ((colW - slipW) / 2) + 'px';
        var dot = document.createElement('span'); dot.className = 'sgp-dot';
        dot.style.background = s.color || KIND[s.kind] || KIND.web;
        var tx = document.createElement('span'); tx.className = 'sgp-txt'; tx.textContent = String(s.text || '');
        slip.appendChild(dot); slip.appendChild(tx);
        if (s.time) { var tm = document.createElement('span'); tm.className = 'sgp-time'; tm.textContent = String(s.time); slip.appendChild(tm); }
        col.insertBefore(slip, stk);
        allTx.push(tx);
        var srot = jit(li, k + 3) * 1.6;
        if (x.at <= 0) gsap.set(slip, { rotation: srot });
        else {
          // He lifts first (a hop), the slip slides in under him and he lands on it.
          gsap.set(slip, { autoAlpha: 0, x: colW * 0.9, rotation: srot + 8 });
          tl.to(stk, { y: -(k + 1) * step - slipH * 0.35, duration: 0.22, ease: 'power2.out' }, x.at)
            .to(slip, { autoAlpha: 1, x: 0, rotation: srot, duration: 0.3, ease: 'back.out(1.3)' }, x.at + 0.06)
            .to(stk, { y: -(k + 1) * step, duration: 0.28, ease: 'bounce.out' }, x.at + 0.22);
        }
        if (peel && k >= sigs.length - peel.count) {
          // The newest signals peel off one after another, flutter away.
          var order = sigs.length - 1 - k;
          var pAt = peel.at + order * 0.18;
          tl.to(slip, { x: colW * (0.7 + 0.3 * jit(li, k)), y: -H * 0.18, rotation: srot + 35 * (jit(k, li) > 0 ? 1 : -1), autoAlpha: 0, duration: 0.6, ease: 'power2.in' }, pAt);
          tl.to(stk, { y: -k * step, duration: 0.3, ease: 'bounce.out' }, pAt + 0.12);
        }
      });

      if (l.badge && (l.badge.src || l.badge.sticker)) {
        var bd = document.createElement('div'); bd.className = 'sgp-badge';
        var bi = document.createElement('img');
        bi.src = l.badge.src || ('/assets/_system/stickers/' + String(l.badge.sticker).toLowerCase().replace(/[^a-z0-9]+/g, '-') + '.webp');
        bd.appendChild(bi); bd.style.top = (-stkH * 0.08) + 'px';
        stk.appendChild(bd);
        var bAt = num(l.badge.at, 0);
        gsap.set(bd, { autoAlpha: 0, scale: 1.6, rotation: 18 });
        tl.to(bd, { autoAlpha: 1, scale: 1, rotation: 8, duration: 0.35, ease: 'back.out(2)' }, Math.max(0, bAt));
      }

      if (l.label) {
        var lb = document.createElement('div'); lb.className = 'sgp-label';
        lb.textContent = String(l.label); lb.style.fontSize = Math.round(fs * 1.1) + 'px';
        lb.style.top = '100%'; lb.style.marginTop = (poolH * 0.62 + 4) + 'px';
        col.appendChild(lb);
        var lAt = num(l.label_at, Math.max(enterAt, 0) + 0.4);
        gsap.set(lb, { autoAlpha: 0, y: 8 });
        tl.to(lb, { autoAlpha: 1, y: 0, duration: 0.3, ease: 'power2.out' }, lAt);
      }

      if (l.count) {
        // A running tally on the star: "N signals", ticking as each lands.
        var ct = document.createElement('div'); ct.className = 'sgp-count';
        ct.style.fontSize = Math.round(fs * 1.05) + 'px';
        stk.appendChild(ct); ct.style.bottom = (stkH + 6) + 'px'; ct.style.transform = 'translateX(-50%)';
        var word = String(l.count_word || 'signals');
        var landed = startN;
        ct.textContent = landed + ' ' + word;
        sigs.forEach(function (x, k) {
          if (x.at > 0) tl.call(function (v) { ct.textContent = v + ' ' + word; }, [k + 1], x.at + 0.2);
        });
        if (startN === 0) { gsap.set(ct, { autoAlpha: 0 }); var first = sigs.find(function (x) { return x.at > 0; }); if (first) tl.to(ct, { autoAlpha: 1, duration: 0.2 }, first.at + 0.2); }
        if (peel) for (var p = 0; p < peel.count; p++) tl.call(function (v) { ct.textContent = v + ' ' + word; }, [sigs.length - p - 1], peel.at + p * 0.18 + 0.3);
      }

      // A move: the lead (column and all) travels by a box fraction --
      // out of the pool toward sales, or back in.
      (Array.isArray(l.moves) ? l.moves : (l.move ? [l.move] : [])).forEach(function (m) {
        tl.to(col, { x: num(m.dx, 0) * W, y: num(m.dy, 0) * H, duration: num(m.duration, 0.8), ease: m.ease || 'power2.inOut' }, num(m.at, 0));
      });
    });
    // FIT: every signal must read whole, and every row reads at ONE size --
    // the longest line sets the type for the whole pool (floor 70%) before
    // the ellipsis is allowed to cut anything.
    var fitK = 1;
    allTx.forEach(function (t) { if (t.scrollWidth > t.clientWidth + 1) fitK = Math.min(fitK, t.clientWidth / t.scrollWidth); });
    if (fitK < 1) {
      var fs2 = Math.floor(fs * Math.max(0.7, fitK * 0.98)) + 'px';
      row.querySelectorAll('.sgp-slip').forEach(function (sl) { sl.style.fontSize = fs2; });
    }
    return tl;
  }
</script>
