<template>
  <div class="strn"></div>
</template>

<style scoped>
  /* ── sticker-rain: a shower of die-cut stickers (the money shot: dollar
     bills fluttering down around a person grinning up at them). Pieces fall
     from above the frame, sway and tumble on the way down, and either pass
     out through the bottom (flutter) or land and stay on a floor (pile).
     Positions come from a seeded PRNG, so a render is the same every time. ── */
  .strn { position: absolute; inset: 0; overflow: hidden; pointer-events: none; }
  .strn-piece { position: absolute; left: 0; top: 0; display: block; will-change: transform;
    filter: drop-shadow(0 10px 16px rgba(20, 16, 24, 0.22)); }
</style>

<script>
  function createTimeline(el, data, ctx) {
    var tl = gsap.timeline();
    var root = el.querySelector('.strn');
    if (!root) return tl;
    var srcs = [];
    if (Array.isArray(data.srcs)) srcs = data.srcs.filter(function (s) { return typeof s === 'string' && s; });
    if (!srcs.length && typeof data.src === 'string' && data.src) srcs = [data.src];
    if (!srcs.length) return tl;

    // Seeded PRNG (mulberry32): the same data rains the same way every frame
    // of every render.
    var seed = (Number(data.seed) || 7) >>> 0;
    var rnd = function () {
      seed = (seed + 0x6d2b79f5) >>> 0;
      var t = seed;
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
    var W = root.clientWidth || el.clientWidth || 1080;
    var H = root.clientHeight || el.clientHeight || 1920;
    var count = Math.max(1, Math.min(40, Math.round(Number(data.count) || 14)));
    var at = data.at != null ? Math.max(0, Number(data.at)) : 0.2;
    var spread = data.spread != null ? Math.max(0, Number(data.spread)) : 1.4;
    var fall = data.fall != null ? Math.max(0.4, Number(data.fall)) : 2.2;
    var size = data.size != null ? Math.max(0.04, Math.min(0.6, Number(data.size))) : 0.2;
    var mode = data.mode === 'pile' ? 'pile' : 'flutter';
    var floor = data.floor != null ? Math.max(0.3, Math.min(1, Number(data.floor))) : 0.94;
    // lanes 'sides': keep the middle third clear (the face); 'all' anywhere.
    var sides = data.lanes === 'sides';

    // Start order is shuffled against the lanes: a left-to-right stagger
    // reads as a diagonal line sweeping the frame, not a shower (measured:
    // 14 bills fell as one slanted row).
    var order = [];
    for (var k = 0; k < count; k++) order.push(k);
    for (var k2 = count - 1; k2 > 0; k2--) { var j2 = Math.floor(rnd() * (k2 + 1)); var tmp = order[k2]; order[k2] = order[j2]; order[j2] = tmp; }

    for (var i = 0; i < count; i++) {
      var img = document.createElement('img');
      img.className = 'strn-piece';
      img.alt = '';
      img.src = srcs[i % srcs.length];
      var pw = Math.round(W * size * (0.75 + rnd() * 0.5));
      img.style.width = pw + 'px';
      img.style.height = 'auto';
      root.appendChild(img);

      // Lane: spread evenly across the width (jittered) so the shower reads
      // full, not clumped; 'sides' folds the middle third out.
      var u = (i + 0.2 + rnd() * 0.6) / count;
      if (sides) u = u < 0.5 ? u * (2 / 3) : 1 / 3 + u * (2 / 3);
      var x = u * W - pw / 2;
      var t0 = at + (count > 1 ? (order[i] / (count - 1)) * spread : 0) + (rnd() - 0.5) * 0.12;
      var dur = fall * (0.85 + rnd() * 0.3);
      var rot0 = (rnd() - 0.5) * 70;
      var spin = (rnd() < 0.5 ? -1 : 1) * (90 + rnd() * 240);

      gsap.set(img, { x: x, y: -pw * 1.4, rotation: rot0, autoAlpha: 0 });
      tl.set(img, { autoAlpha: 1 }, Math.max(0, t0));
      if (mode === 'flutter') {
        // Falls through the frame: a steady drop, a side-to-side sway, a
        // lazy tumble -- paper in air.
        tl.to(img, { y: H + pw * 0.4, duration: dur, ease: 'none' }, Math.max(0, t0));
        var sway = pw * (0.35 + rnd() * 0.4);
        var swings = 2 + Math.floor(rnd() * 2);
        var seg = dur / (swings * 2);
        for (var s = 0; s < swings * 2; s++) {
          tl.to(img, { x: x + (s % 2 === 0 ? sway : -sway * 0.6), duration: seg, ease: 'sine.inOut' }, Math.max(0, t0) + s * seg);
        }
        tl.to(img, { rotation: rot0 + spin, duration: dur, ease: 'none' }, Math.max(0, t0));
      } else {
        // Drops with gravity, lands on the floor with a bounce, and stays.
        // Its BOTTOM rests on the floor (a little above for a heap): the
        // top sits one piece-height higher (measured: coins set by a fixed
        // fraction of their width hung off the bottom edge).
        var ph = img.naturalWidth ? pw * img.naturalHeight / img.naturalWidth : pw;
        var land = H * floor - ph * (1 + rnd() * 0.3);
        tl.to(img, { y: land, duration: dur * 0.7, ease: 'bounce.out' }, Math.max(0, t0));
        tl.to(img, { rotation: (rnd() - 0.5) * 36, duration: dur * 0.7, ease: 'power2.out' }, Math.max(0, t0));
        // A piece that stays must stay whole: its resting place is kept
        // inside the side edges (measured: the outer coins sat half off).
        // The margin covers the tilt's corners and the scene's slow camera push
        // (it scales the frame about its centre, carrying edge pieces outward).
        var restX = Math.max(W * 0.05 + pw * 0.12, Math.min(W * 0.95 - pw * 1.12, x + (rnd() - 0.5) * pw * 0.5));
        tl.to(img, { x: restX, duration: dur * 0.7, ease: 'power1.out' }, Math.max(0, t0));
      }
    }
    return tl;
  }
</script>
