<script>
  function createTimeline(el, data, ctx) {
    var tl = gsap.timeline();
    var root = el.querySelector('.tc-root'), sky = el.querySelector('.tc-sky'), clouds = el.querySelector('.tc-clouds'), text = el.querySelector('.tc-text');
    var dur = Number(data.duration) > 0 ? Number(data.duration) : (ctx && ctx.duration > 0 ? ctx.duration : 2);
    var at = Number(data.at) > 0 ? Number(data.at) : 0;
    var span = Math.max(0.5, dur - at);
    var boxW = root.clientWidth || 1080, boxH = root.clientHeight || 1350;
    if (data.tone === 'dusk') sky.classList.add('dusk');
    // The script face, fetched like the brand's own (the page already links
    // Google Fonts for the kit); a missing face falls back to the system's script.
    if (data.font !== false && !document.getElementById('mp-font-time-card')) {
      var l = document.createElement('link'); l.id = 'mp-font-time-card'; l.rel = 'stylesheet';
      l.href = 'https://fonts.googleapis.com/css2?family=' + encodeURIComponent(data.font_family || 'Dancing Script') + ':wght@700&display=swap';
      document.head.appendChild(l);
    }
    if (data.font_family) text.style.fontFamily = "'" + data.font_family + "', 'Brush Script MT', cursive";
    text.textContent = data.text || 'Some time later…';
    var fs = Number(data.font_size) > 0 ? Number(data.font_size) : Math.round(Math.min(boxW, boxH) * 0.16);
    text.style.fontSize = fs + 'px';
    if (data.color) text.style.color = data.color;
    gsap.set(text, { autoAlpha: 0, scale: 0.92, y: 10 });
    tl.to(text, { autoAlpha: 1, scale: 1, y: 0, duration: 0.35, ease: 'power2.out' }, at + 0.05);
    if (data.drift !== false) {
      tl.fromTo(sky, { scale: 1 }, { scale: 1.05, duration: span, ease: 'none' }, at);
      tl.fromTo(clouds, { x: 0, scale: 1 }, { x: -Math.round(boxW * 0.03), scale: 1.07, duration: span, ease: 'none' }, at);
    }
    return tl;
  }
</script>
