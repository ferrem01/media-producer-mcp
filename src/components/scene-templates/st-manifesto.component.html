<template>
  <div class="stmf">
    <div class="stmf-kicker-row"><span class="stmf-rule"></span><span class="stmf-kicker">{{kicker}}</span></div>
    <div class="stmf-flow"></div>
    <div class="stmf-sticker"></div>
    <img class="stmf-wordmark" alt="" />
    <div class="stmf-index">{{scene_index}}</div>
    <div class="st-overlay"></div>
  </div>
</template>

<style scoped>
  /* ── st-manifesto: the kinetic-type statement beat. ONE sentence owns the
     frame, landing word by word with violent scale/weight contrast; accent
     words slam in brand color. Pure typography as the visual -- the beat
     between denser scenes where the film says its thesis out loud. */
  .stmf { position: absolute; inset: 0; overflow: hidden; color: #f4f4f8;
    font-family: var(--mp-font-family, 'Inter'), 'Inter', sans-serif; }
  .stmf.is-light { color: #17171c; }
  .stmf-kicker-row { position: absolute; left: 50%; top: 16vh; transform: translateX(-50%);
    display: flex; align-items: center; gap: 14px; }
  .stmf-rule { width: 34px; height: 2px; background: var(--mp-color-primary, #4f46e5);
    transform-origin: left center; }
  /* 14px kicker needs 4.5:1; raw primary measured 2.79:1 on the dark world --
     the script lifts it (hue kept) as a resolved rgb(); this static is the
     no-JS fallback. Light keeps raw primary (measures clean). */
  .stmf-kicker { font-size: 14px; font-weight: 600; letter-spacing: 0.2em; text-transform: uppercase;
    color: #babbf1; }
  .is-light .stmf-kicker { color: var(--mp-color-primary, #4f46e5); }
  .stmf-flow { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
    width: 80vw; display: flex; flex-wrap: wrap; justify-content: center; align-items: baseline;
    column-gap: 1.15vw; row-gap: 1.2vh; text-align: center; }
  .stmf-word { display: inline-block; font-size: 5.2vw; font-weight: 500; line-height: 1.04;
    letter-spacing: -0.025em; white-space: nowrap; }
  .stmf-word.is-accent { color: var(--mp-color-primary, #4f46e5); font-weight: 600; }
  .stmf-word.is-small { font-size: 2.6vw; font-weight: 400; opacity: 0.75; }
  /* sticker-slam: the reversal beat -- an accent slab lands rotated ACROSS
     the sentence, which grays back to make room for it. The Lenny-film
     "But it's true!" move. */
  .stmf-sticker { position: absolute; left: 50%; top: 47%; display: none;
    padding: 1.4vw 3.2vw 1.7vw; border-radius: 1.1vw; white-space: nowrap;
    background: var(--mp-color-primary, #4f46e5); color: #fff;
    font-size: 4.6vw; font-weight: 800; letter-spacing: -0.02em;
    box-shadow: 0 1.1vw 2.6vw rgba(23,23,28,0.24); }
  .stmf-wordmark { position: absolute; left: 8vw; bottom: 5.4vh; height: 24px; width: auto; opacity: 0.85; }
  .stmf-index { position: absolute; right: 8vw; bottom: 5.4vh; font-family: 'Inter', sans-serif;
    font-size: 13px; font-weight: 600; letter-spacing: 0.2em; opacity: 0.5; }
  .st-overlay { position: absolute; inset: 0; pointer-events: none; }
</style>

<script>
  function createTimeline(el, data, ctx) {
    var tl = gsap.timeline();
    var q = function(s) { return el.querySelector(s); };
    var root = q('.stmf');
    var light = data.theme === 'light';
    if (light) root.classList.add('is-light');
    var dur = ctx.duration || 8;

    var wm = q('.stmf-wordmark');
    if (wm) { if (data.logo_url) { wm.src = data.logo_url; if (!light && window.mpLogoOnDark) mpLogoOnDark(wm); } else wm.style.display = 'none'; }
    var kickerRow = q('.stmf-kicker-row');
    if (!data.kicker) kickerRow.style.display = 'none';
    // 14px kicker needs 4.5:1; raw primary measured 2.79:1 on the dark world.
    // Resolved rgb() mix (35% primary toward #f4f4f8): color-mix() computes
    // to color(srgb ...) which the contrast gate cannot parse.
    if (!light && window.mpParseColor) {
      var pr = mpParseColor(getComputedStyle(root).getPropertyValue('--mp-color-primary').trim() || '#4f46e5');
      if (pr) q('.stmf-kicker').style.color = 'rgb(' + Math.round(pr.r * 0.35 + 244 * 0.65) + ',' +
        Math.round(pr.g * 0.35 + 244 * 0.65) + ',' + Math.round(pr.b * 0.35 + 248 * 0.65) + ')';
    }

    // Words: '*word*' marks accents (brand color + slam); small connective
    // words ('a', 'the', 'of'...) automatically set smaller for scale rhythm.
    var accents = (Array.isArray(data.accent_words) ? data.accent_words : []).map(function(w) { return String(w).toLowerCase().replace(/[^\w]/g, ''); });
    var SMALL = { a: 1, an: 1, the: 1, of: 1, to: 1, in: 1, on: 1, and: 1, or: 1, for: 1, with: 1, is: 1, it: 1 };
    var flow = q('.stmf-flow');
    // Tokenize with *star groups* intact: every word inside a group is an
    // accent (a naive whitespace split breaks multi-word accents).
    var tokens = [];
    // Punctuation hugging a *star group* ("*ask*.") stays glued to the
    // accent word -- a naive split made the period its own flex item with a
    // full word-gap before it.
    var tokRe = /(\S*)\*([^*]+)\*(\S*)|(\S+)/g;
    var tm;
    while ((tm = tokRe.exec(String(data.text || ''))) !== null) {
      if (tm[2] !== undefined) {
        var ws = tm[2].split(/\s+/).filter(Boolean);
        ws.forEach(function(w, i) {
          if (i === 0 && tm[1]) w = tm[1] + w;
          if (i === ws.length - 1 && tm[3]) w = w + tm[3];
          tokens.push({ w: w, star: true });
        });
      } else tokens.push({ w: tm[4], star: false });
    }
    // House type system: the sentence lands as ONE block (line rise + fade).
    // Accents are color-only spans that move with their line -- no masks, no
    // per-word stagger, no slam, no glow.
    // Ramp words: per-glyph gradient (primary -> magenta -> orange), the same
    // 'rainbow' emphasis st-statement uses -- per-glyph SOLID colors, so no
    // background-clip paint-box bugs.
    var rampWords = (Array.isArray(data.ramp_words) ? data.ramp_words : []).map(function(w) { return String(w).toLowerCase().replace(/[^\w]/g, ''); });
    var rp = (window.mpParseColor && mpParseColor(getComputedStyle(root).getPropertyValue('--mp-color-primary').trim() || '#4f46e5')) || { r: 79, g: 70, b: 229 };
    var rampStops = [
      { at: 0.10, c: [rp.r, rp.g, rp.b] },
      { at: 0.55, c: [196, 72, 159] },
      { at: 0.95, c: [255, 106, 77] },
    ];
    function rampAt(t) {
      var p2 = 0.10 + t * 0.85;
      var a = rampStops[0], b = rampStops[rampStops.length - 1];
      for (var ri = 0; ri < rampStops.length - 1; ri++) {
        if (p2 >= rampStops[ri].at && p2 <= rampStops[ri + 1].at) { a = rampStops[ri]; b = rampStops[ri + 1]; break; }
      }
      var f = b.at === a.at ? 0 : (p2 - a.at) / (b.at - a.at);
      var c = a.c.map(function(v, ci) { return Math.round(v + (b.c[ci] - v) * f); });
      return 'rgb(' + c.join(',') + ')';
    }
    tokens.forEach(function(tok) {
      var clean = tok.w.replace(/\*/g, '');
      var bare = clean.toLowerCase().replace(/[^\w]/g, '');
      var w = document.createElement('span');
      w.className = 'stmf-word';
      if (rampWords.indexOf(bare) !== -1) {
        w.classList.add('is-accent');
        var chars = Array.from(clean);
        var n = Math.max(1, chars.length - 1);
        chars.forEach(function(ch, gi) {
          var g = document.createElement('span');
          g.style.color = rampAt(gi / n);
          g.textContent = ch;
          w.appendChild(g);
        });
      } else {
        w.textContent = clean;
        if (tok.star || accents.indexOf(bare) !== -1) w.classList.add('is-accent');
        else if (SMALL[bare] && !data.uniform) w.classList.add('is-small');
      }
      flow.appendChild(w);
    });

    if (data.entrance === 'type-on') {
      // Word-by-word build-up, PRE-LAID: the whole sentence occupies its
      // final layout from frame one (invisible), and each word lands IN
      // PLACE with a soft rise + blur-off. Nothing that has landed ever
      // moves again -- the reflow-on-every-word of the naive type-on read
      // as chop at full-frame scale. fromTo tweens; scrub-safe.
      var at0 = data.at !== undefined ? Number(data.at) : 0.3;
      var step = Number(data.word_interval) > 0 ? Number(data.word_interval) : 0.14;
      var wordEls = flow.querySelectorAll('.stmf-word');
      for (var wi = 0; wi < wordEls.length; wi++) {
        gsap.set(wordEls[wi], { autoAlpha: 0, y: 9, filter: 'blur(5px)' });
        var when = Array.isArray(data.word_times) && data.word_times[wi] !== undefined
          ? Number(data.word_times[wi]) : at0 + wi * step;
        tl.fromTo(wordEls[wi], { autoAlpha: 0, y: 9, filter: 'blur(5px)' },
          { autoAlpha: 1, y: 0, filter: 'blur(0px)', duration: 0.3, ease: 'power2.out',
            immediateRender: false }, when);
      }
    } else if (data.entrance === 'sticker-slam' || data.sticker_text) {
      // The sentence lands house-style, then the sticker SLAMS across it and
      // the sentence recedes to gray -- the reversal, staged as one object
      // landing on another. Scrub-safe: fromTo + set, no callbacks.
      if (window.mpLineRise) mpLineRise(tl, flow, 0.35);
      else { gsap.set(flow, { autoAlpha: 0, y: 10 }); tl.to(flow, { autoAlpha: 1, y: 0, duration: 0.3, ease: 'power3.out' }, 0.35); }
      var st = q('.stmf-sticker');
      st.textContent = String(data.sticker_text || '');
      st.style.display = 'block';
      var sAt = data.sticker_at !== undefined ? Number(data.sticker_at) : Math.max(1.2, (dur || 6) * 0.45);
      var sRot = data.sticker_rotation !== undefined ? Number(data.sticker_rotation) : -4;
      gsap.set(st, { xPercent: -50, yPercent: -50, autoAlpha: 0, scale: 1.7, rotation: sRot - 6 });
      tl.to(flow, { color: light ? '#a9a5b3' : '#5b5a68', duration: 0.18 }, sAt - 0.05)
        .fromTo(st, { autoAlpha: 0, scale: 1.7, rotation: sRot - 6 },
          { autoAlpha: 1, scale: 1, rotation: sRot, duration: 0.34, ease: 'back.out(2.2)', immediateRender: false }, sAt);
    } else if (window.mpLineRise) mpLineRise(tl, flow, 0.35);
    else {
      gsap.set(flow, { autoAlpha: 0, y: 10 });
      tl.to(flow, { autoAlpha: 1, y: 0, duration: 0.3, ease: 'power3.out' }, 0.35);
    }

    gsap.set(q('.stmf-rule'), { scaleX: 0 });
    gsap.set(q('.stmf-kicker'), { autoAlpha: 0, y: -8 });
    gsap.set([wm, q('.stmf-index')], { autoAlpha: 0 });
    tl.to(q('.stmf-rule'), { scaleX: 1, duration: 0.5, ease: 'power3.out' }, 0.2)
      .to(q('.stmf-kicker'), { autoAlpha: 1, y: 0, duration: 0.5, ease: 'power2.out' }, 0.3)
      .to([wm, q('.stmf-index')], { autoAlpha: 1, duration: 0.6 }, 0.8);

    if (window.mpAtmosphere) mpAtmosphere(root, { dark: !light, noBase: !!data.backdrop_active, image: data.backdrop_image || null });
    if (window.mpCameraPush) mpCameraPush(tl, root, dur, 1.05);
    return tl;
  }
</script>
