<template>
  <div class="sths">
    <div class="sths-ghost" aria-hidden="true"></div>
    <div class="sths-col">
      <div class="sths-kicker-row">
        <span class="sths-rule"></span>
        <span class="sths-kicker">{{kicker}}</span>
      </div>
      <h1 class="sths-headline"></h1>
      <p class="sths-supporting">{{supporting}}</p>
    </div>
    <div class="sths-burst" aria-hidden="true"></div>
    <div class="sths-stat">
      <div class="sths-num">0</div>
      <div class="sths-numline"></div>
      <div class="sths-statlabel">{{stat_label}}</div>
    </div>
    <div class="sths-items"></div>
    <img class="sths-wordmark" alt="" />
    <div class="sths-index">{{scene_index}}</div>
    <!-- Freeform overlay: the ONLY region codegen may add bespoke elements
         into. The compositional skeleton around it is template-owned. -->
    <div class="st-overlay"></div>
  </div>
</template>

<style scoped>
  /* ── st-hero-stat: one number carries the scene ──
     Composition is locked: left text column on an 8vw margin, oversized
     numeral cluster right-of-center, items baseline in the lower third,
     ghost numeral as the single atmosphere element. No decorative grids. */
  .sths {
    position: absolute; inset: 0; overflow: hidden;
    background: var(--mp-color-background, #fbfbfd);
    font-family: var(--mp-font-family, 'Inter'), 'Inter', sans-serif;
    /* Pinned ink, not var(--mp-color-text): without data.theme this template
       paints a LIGHT atmosphere world even on a dark page, where the page
       token is #ffffff -- white-on-white measured 1.06:1. The template paints
       its own world, so its ink is pinned to that world; the dark branch
       below re-inks everything for the dark world. */
    color: #17171c;
  }
  .sths-ghost {
    position: absolute; right: -5vw; top: -28vh; height: 160vh;
    font-size: 118vh; line-height: 1; font-weight: 600;
    color: var(--mp-color-primary, #4f46e5); opacity: 0.05;
    letter-spacing: -0.04em; user-select: none;
  }
  .sths-col { position: absolute; left: 8vw; top: 18vh; width: 44vw; }
  .sths-kicker-row { display: flex; align-items: center; gap: 14px; margin-bottom: 3.2vh; }
  .sths-rule { display: inline-block; width: 34px; height: 2px; background: var(--mp-color-primary, #4f46e5); transform-origin: left center; }
  .sths-kicker {
    font-family: 'Inter', sans-serif; font-size: 15px; font-weight: 600;
    letter-spacing: 0.19em; text-transform: uppercase;
    /* 15px kicker needs 4.5:1; raw primary measured 4.11:1 on the light
       wash -- the script deepens it toward ink (hue kept) as a resolved
       rgb(), because color-mix() computes to color(srgb ...) which the
       contrast gate cannot parse. This static is the no-JS fallback. */
    color: #3e38a9;
  }
  .sths-headline {
    margin: 0 0 3vh 0; font-weight: 500; font-size: 4.6vw; line-height: 1.06;
    letter-spacing: -0.015em; max-width: 15ch; text-wrap: balance; word-break: keep-all;
  }
  .sths-headline .sths-line { display: block; overflow: hidden; }
  .sths-headline .sths-line > span { display: block; }
  .sths-supporting {
    margin: 0; font-family: 'Inter', sans-serif; font-size: 1.15vw; line-height: 1.55;
    /* Pinned muted ink for the light world (the page muted token is tuned
       for the PAGE's ground, which may be dark): #4b5563 measures ~7:1 on
       the wash. Dark branch re-inks. */
    color: #4b5563; max-width: 42ch;
  }
  .sths-stat { position: absolute; right: 10vw; top: 20vh; text-align: right; }
  .sths-num {
    font-size: 17.5vw; line-height: 0.9; font-weight: 500; letter-spacing: -0.03em;
    background: linear-gradient(160deg, var(--mp-color-primary, #4f46e5) 20%, color-mix(in srgb, var(--mp-color-primary, #4f46e5) 55%, #8b5cf6) 78%, var(--mp-color-secondary, #d48c34) 130%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    font-variant-numeric: tabular-nums;
  }
  .sths-numline { height: 3px; width: 100%; margin: 2.4vh 0 1.6vh; background: linear-gradient(90deg, transparent, var(--mp-color-secondary, #d48c34)); transform-origin: right center; }
  .sths-statlabel {
    font-family: 'Inter', sans-serif; font-size: 15px; font-weight: 600;
    letter-spacing: 0.17em; text-transform: uppercase;
    color: #4b5563; /* pinned to the light world; dark branch re-inks */
  }
  .sths-items { position: absolute; left: 8vw; right: 10vw; bottom: 14vh; display: flex; gap: 1.1vw; }
  .sths-item {
    display: flex; align-items: center; gap: 10px;
    padding: 13px 18px; border: 1px solid color-mix(in srgb, var(--mp-color-primary, #4f46e5) 26%, transparent);
    border-radius: 3px; background: color-mix(in srgb, var(--mp-color-primary, #4f46e5) 4%, #ffffff);
  }
  .sths-item-n {
    font-family: 'Inter', sans-serif; font-size: 12px; font-weight: 700;
    color: var(--mp-color-secondary, #d48c34); letter-spacing: 0.06em;
  }
  .sths-item-t {
    font-family: 'Inter', sans-serif; font-size: 13.5px; font-weight: 600;
    letter-spacing: 0.13em; text-transform: uppercase; white-space: nowrap;
  }
  .sths-item.is-live {
    border-color: var(--mp-color-primary, #4f46e5);
    background: color-mix(in srgb, var(--mp-color-primary, #4f46e5) 9%, #ffffff);
  }
  .sths-wordmark { position: absolute; left: 8vw; bottom: 6vh; height: 26px; width: auto; opacity: 0.85; }
  .sths-index {
    position: absolute; right: 10vw; bottom: 6vh;
    font-family: 'Inter', sans-serif; font-size: 13px; font-weight: 600;
    letter-spacing: 0.2em; color: var(--mp-color-text-muted, #9ca3af);
  }
  .st-overlay { position: absolute; inset: 0; pointer-events: none; }
  /* Sunburst: celebration backdrop for the numeral (data.sunburst). Rays sit
     BEHIND the stat cluster and stay pale -- the number is still the subject
     (the squint winner), the rays are the applause. */
  .sths-burst { position: absolute; pointer-events: none; z-index: 0; }
  .sths-ray { position: absolute; left: -2.6vw; bottom: 0; width: 5.2vw;
    transform-origin: 50% 100%;
    background: var(--mp-color-secondary, #d48c34);
    clip-path: polygon(28% 100%, 72% 100%, 100% 0, 0 0); }
  .sths-conf { position: absolute; width: 0.8vw; height: 1.3vw; border-radius: 3px; }
</style>

<script>
  function createTimeline(el, data, ctx) {
    var tl = gsap.timeline();
    var q = function(s) { return el.querySelector(s); };

    // ── Slot fill (DOM only -- the skeleton above never changes) ──
    var ghost = q('.sths-ghost');
    var num = q('.sths-num');
    var statValue = Number(data.stat_value) || 0;
    if (ghost) ghost.textContent = String(statValue);

    var head = q('.sths-headline');
    var lines = String(data.headline || '').split('|');
    if (head) {
      lines.forEach(function(txt) {
        var line = document.createElement('span'); line.className = 'sths-line';
        var inner = document.createElement('span'); inner.textContent = txt.trim();
        line.appendChild(inner); head.appendChild(line);
      });
    }

    var itemsWrap = q('.sths-items');
    var items = Array.isArray(data.items) ? data.items.slice(0, 6) : [];
    items.forEach(function(label, i) {
      var it = document.createElement('div'); it.className = 'sths-item';
      var n = document.createElement('span'); n.className = 'sths-item-n';
      n.textContent = (i < 9 ? '0' : '') + (i + 1);
      var t = document.createElement('span'); t.className = 'sths-item-t';
      t.textContent = String(label);
      it.appendChild(n); it.appendChild(t); itemsWrap.appendChild(it);
    });

    var wm = q('.sths-wordmark');
    if (wm) { if (data.logo_url) wm.src = data.logo_url; else wm.style.display = 'none'; }

    // ── Choreography: build (0-2.4s), breathe, no self-exit ──
    var lineEls = el.querySelectorAll('.sths-line > span');
    var itemEls = el.querySelectorAll('.sths-item');
    var itemsAt = Math.min(Math.max(2.6, ctx.duration * 0.32), 6);

    gsap.set(q('.sths-rule'), { scaleX: 0 });
    gsap.set(q('.sths-kicker'), { autoAlpha: 0, x: -12 });
    gsap.set(lineEls, { yPercent: 110, filter: 'blur(6px)' });
    gsap.set(q('.sths-supporting'), { autoAlpha: 0, y: 14 });
    gsap.set(q('.sths-stat'), { autoAlpha: 0, y: 44 });
    gsap.set(q('.sths-numline'), { scaleX: 0 });
    gsap.set(itemEls, { autoAlpha: 0, y: 26 });
    gsap.set(ghost, { autoAlpha: 0 });
    gsap.set([wm, q('.sths-index')], { autoAlpha: 0 });

    tl.to(q('.sths-rule'), { scaleX: 1, duration: 0.5, ease: 'power3.out' }, 0.15)
      .to(q('.sths-kicker'), { autoAlpha: 1, x: 0, duration: 0.5, ease: 'power2.out' }, 0.3)
      .to(lineEls, { yPercent: 0, filter: 'blur(0px)', duration: 0.85, ease: 'power4.out', stagger: 0.12 }, 0.45)
      .to(ghost, { autoAlpha: 0.05, duration: 1.6, ease: 'power1.inOut' }, 0.6)
      .to(q('.sths-numline'), { scaleX: 1, duration: 0.7, ease: 'power2.inOut' }, 1.35)
      .to(q('.sths-supporting'), { autoAlpha: 1, y: 0, duration: 0.7, ease: 'power2.out' }, 1.5)
      .to([wm, q('.sths-index')], { autoAlpha: 1, duration: 0.6 }, 1.9);
    // The numeral cluster is THROWN in from below-right with velocity smear;
    // item chips are thrown with alternating lateral energy.
    if (window.mpThrow) mpThrow(tl, q('.sths-stat'), 0.95, { fromY: 150, fromX: 70, duration: 0.7 });
    else tl.to(q('.sths-stat'), { autoAlpha: 1, y: 0, duration: 0.9, ease: 'power3.out' }, 0.95);
    Array.prototype.forEach.call(itemEls, function(chip, ci) {
      if (window.mpThrow) mpThrow(tl, chip, itemsAt + ci * 0.09, { fromY: 75, fromX: ci % 2 ? 55 : -55, duration: 0.5 });
      else tl.to(chip, { autoAlpha: 1, y: 0, duration: 0.65, ease: 'power3.out' }, itemsAt + ci * 0.09);
    });

    // Count-up locked to the stat's entrance.
    if (num) {
      var counter = { v: 0 };
      tl.to(counter, {
        v: statValue, duration: 1.1, ease: 'power2.out',
        onUpdate: function() { num.textContent = String(Math.round(counter.v)); },
      }, 0.95);
    }

    // Breathe: the ghost numeral drifts for the whole scene.
    if (ghost) tl.to(ghost, { y: -30, duration: Math.max(4, ctx.duration - 1), ease: 'none' }, 1);

    // ── Atmosphere: washes + grain + slow push + shimmer + lit tags ──
    var dark = data.theme === 'dark';
    // Kicker ink per world: 15px needs 4.5:1 and raw primary measured 4.11:1
    // on the light wash / ~2.2:1 on the dark world. Brand hue kept, mixed
    // toward the world's ink pole, resolved to rgb() (color-mix() computes
    // to color(srgb ...) which the contrast gate cannot parse).
    if (window.mpParseColor) {
      var pr = mpParseColor(getComputedStyle(el.querySelector('.sths')).getPropertyValue('--mp-color-primary').trim() || '#4f46e5');
      var pole = dark ? { r: 244, g: 244, b: 248 } : { r: 23, g: 23, b: 28 };
      var pct = dark ? 0.35 : 0.7;
      var kck = q('.sths-kicker');
      if (pr && kck) kck.style.color = 'rgb(' + Math.round(pr.r * pct + pole.r * (1 - pct)) + ',' +
        Math.round(pr.g * pct + pole.g * (1 - pct)) + ',' + Math.round(pr.b * pct + pole.b * (1 - pct)) + ')';
    }
    if (dark) {
      el.querySelector('.sths').style.color = '#f4f4f8';
      var sup = q('.sths-supporting'); if (sup) sup.style.color = 'rgba(244,244,248,0.62)';
      Array.prototype.forEach.call(el.querySelectorAll('.sths-item'), function(it) {
        it.style.background = 'rgba(255,255,255,0.05)'; it.style.borderColor = 'rgba(255,255,255,0.16)';
        var t = it.querySelector('.sths-item-t'); if (t) t.style.color = '#f4f4f8';
      });
      var sl = q('.sths-statlabel'); if (sl) sl.style.color = 'rgba(244,244,248,0.55)';
      var ix = q('.sths-index'); if (ix) ix.style.color = 'rgba(244,244,248,0.4)';
    }
    // ── SUNBURST (data.sunburst): the celebration variant -- rotating rays
    // and a confetti burst behind the numeral. Deterministic (index-derived,
    // no RNG) so every render and every scrub position is identical. ──
    var burst = q('.sths-burst');
    if (data.sunburst && burst) {
      var statBox = q('.sths-stat');
      // Park the burst on the numeral cluster's centre.
      burst.style.left = '68%'; burst.style.top = '42%';
      burst.style.width = '0'; burst.style.height = '0';
      var RAYS = 14, rays = [];
      for (var ri = 0; ri < RAYS; ri++) {
        var ray = document.createElement('div');
        ray.className = 'sths-ray';
        ray.style.height = (17 + (ri * 7) % 11) + 'vw';
        ray.style.transform = 'rotate(' + (ri * (360 / RAYS)) + 'deg) translateY(-7vw)';
        burst.appendChild(ray); rays.push(ray);
      }
      var CONF = 18, confs = [];
      var cols = [
        'var(--mp-color-primary, #4f46e5)', 'var(--mp-color-secondary, #d48c34)',
        dark ? '#f4f4f8' : '#17171c', 'var(--mp-color-accent, #8b5cf6)',
      ];
      for (var ci = 0; ci < CONF; ci++) {
        var cf = document.createElement('div');
        cf.className = 'sths-conf';
        cf.style.background = cols[ci % cols.length];
        cf.style.left = (Math.cos(ci * 2.39) * (9 + (ci * 3.1) % 7)).toFixed(2) + 'vw';
        cf.style.top = (Math.sin(ci * 2.39) * (6 + (ci * 2.3) % 5)).toFixed(2) + 'vw';
        cf.style.transform = 'rotate(' + (ci * 47) + 'deg)';
        burst.appendChild(cf); confs.push(cf);
      }
      // Ray strength is ground-relative: a 0.16 wash vanished on a near-white
      // world (measured live), while the same value is plenty on dark.
      gsap.set(rays, { scaleY: 0, opacity: dark ? 0.15 : 0.28 });
      gsap.set(confs, { scale: 0 });
      gsap.set(burst, { rotation: -8 });
      var bAt = data.sunburst_at !== undefined ? Number(data.sunburst_at) : 0.35;
      tl.to(rays, { scaleY: 1, opacity: dark ? 0.15 : 0.28, duration: 0.5, ease: 'power3.out', stagger: 0.02 }, bAt)
        .to(burst, { rotation: 6, duration: Math.max(2, (ctx.duration || 6) - bAt), ease: 'none' }, bAt)
        .to(confs, { scale: 1, duration: 0.3, ease: 'back.out(2)', stagger: 0.015 }, bAt + 0.25)
        .to(confs, { y: '+=1.4vw', autoAlpha: 0.85, duration: 2.2, ease: 'none' }, bAt + 0.6);
    } else if (burst) {
      burst.style.display = 'none';
    }

    if (window.mpAtmosphere) mpAtmosphere(el.querySelector('.sths'), { dark: dark, noBase: !!data.backdrop_active });
    if (window.mpCameraPush) mpCameraPush(tl, el.querySelector('.sths'), ctx.duration, 1.035);
    if (window.mpShimmer && num) mpShimmer(tl, q('.sths-stat'), 2.3);
    if (window.mpGlow && num) mpGlow(num, getComputedStyle(el.querySelector('.sths')).getPropertyValue('--mp-color-primary').trim() || '#4f46e5', 0.55);
    Array.prototype.forEach.call(itemEls, function(it) { if (window.mpLiftShadow) mpLiftShadow(it); });

    // ── Beat phases: the scene EVOLVES instead of freezing after the build.
    // Phase 2+: a highlight walks the item tags, one per remaining phase
    // (or cycling), each pulse lifting its tag while the others calm.
    var phases = window.mpBeatPhases ? mpBeatPhases(ctx, 4) : [];
    if (itemEls.length && phases.length > 1) {
      var walkPhases = phases.slice(1);
      walkPhases.forEach(function(ph, pi) {
        var target = itemEls[pi % itemEls.length];
        var at = Math.max(ph.start, itemsAt + 0.9);
        if (at >= ctx.duration - 0.5) return;
        tl.add(function() {}, at); // anchor
        tl.to(target, { y: -6, scale: 1.04, duration: 0.45, ease: 'power2.out',
          onStart: function() { target.classList.add('is-live'); } }, at);
        tl.to(target, { y: 0, scale: 1, duration: 0.5, ease: 'power2.inOut',
          onComplete: function() { target.classList.remove('is-live'); } }, Math.min(ph.end - 0.4, at + Math.max(1.2, (ph.end - at) - 0.5)));
      });
    }

    return tl;
  }
</script>
