<script>
  function createTimeline(el, data, ctx) {
    var tl = gsap.timeline();
    var q = function (s) { return el.querySelector(s); };
    var win = q('.uvp-win');
    var dur = ctx.duration || 8;

    if (!data.title) q('.uvp-title').textContent = 'output.mp4';

    // Content: an image URL (Ken Burns), or slotted content via content_html
    // (sanitized to text/img by the pipeline), else a subtle brand field.
    var content = q('.uvp-content');
    if (data.image_url) {
      var img = document.createElement('img');
      img.src = data.image_url;
      content.appendChild(img);
      tl.fromTo(img, { scale: 1.04 }, { scale: 1.12, duration: Math.max(4, dur), ease: 'none' }, 0);
    } else {
      content.style.background =
        'radial-gradient(ellipse at 30% 30%, color-mix(in srgb, var(--mp-color-primary, #4f46e5) 22%, #ffffff), #fbfbfd 70%)';
    }

    if (window.mpThrow) mpThrow(tl, win, 0.2, { fromY: 90, duration: 0.6 });
    else { gsap.set(win, { autoAlpha: 0, y: 30 }); tl.to(win, { autoAlpha: 1, y: 0, duration: 0.6, ease: 'power3.out' }, 0.2); }

    // THE build: the scrub bar advances in real time, the clock counts, and
    // the scene badge ticks up -- the player is alive, the video is "real".
    var runtime = Math.max(8, Number(data.runtime_seconds) || 32);
    var playAt = 0.9;
    var playSpan = Math.max(2, dur - playAt - 0.3);
    var frac = Math.min(1, playSpan / runtime);
    var st = { t: 0 };
    var fill = q('.uvp-fill'), knob = q('.uvp-knob'), time = q('.uvp-time');
    var track = q('.uvp-track');
    var scenes = Math.max(1, Number(data.scene_count) || 0);
    var badge = q('.uvp-badge');
    function fmt(s) { var mn = Math.floor(s / 60), sc = Math.floor(s % 60); return mn + ':' + (sc < 10 ? '0' : '') + sc; }
    if (!data.badge && scenes > 1) badge.textContent = 'scene 1 / ' + scenes;
    tl.to(st, {
      t: runtime * frac, duration: playSpan, ease: 'none',
      onUpdate: function () {
        var p = (st.t / runtime) * 100;
        fill.style.width = p + '%';
        knob.style.left = p + '%';
        time.textContent = fmt(st.t) + ' / ' + fmt(runtime);
        if (scenes > 1) badge.textContent = 'scene ' + Math.min(scenes, 1 + Math.floor((st.t / runtime) * scenes)) + ' / ' + scenes;
      },
    }, playAt);

    if (window.mpLiftShadow) mpLiftShadow(win);
    return tl;
  }
</script>
