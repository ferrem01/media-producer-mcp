<script>
  function createTimeline(el, data, ctx) {
    var tl = gsap.timeline();
    var q = function (s) { return el.querySelector(s); };
    var root = q('.sa-root');
    var DUR = (ctx && ctx.duration) || 8;
    var gl = window.mpGroundLum ? mpGroundLum() : null;
    root.classList.add('t-' + (data.theme === 'dark' || data.theme === 'light' ? data.theme : (typeof gl === 'number' && gl < 0.18 ? 'dark' : 'light')));
    var W0 = el.clientWidth || 1200, H0 = el.clientHeight || 700;
    var phone = data.device === 'phone';
    if (phone) root.classList.add('dev-phone');
    var scope = phone ? q('.sa-phone') : q('.sa-wrap');
    var ask = String(data.prompt || '');
    var name = data.agent_name === '' ? '' : String(data.agent_name || 'Quotient');
    Array.prototype.forEach.call(el.querySelectorAll('.sa-name'), function (n) { n.textContent = name; });
    if (!ask) { var a0 = q('.sa-ask'); if (a0) a0.style.display = 'none'; }

    // ---- The answer as words: paragraphs, "- " bullets, **bold** in the brand color ----
    var host = scope.querySelector('.sa-answer');
    var words = [], lis = [];
    String(data.answer || '').split(/\n/).forEach(function (line) {
      if (!line.trim()) return;
      var bullet = /^\s*([-*•])\s+/.test(line);
      var block = document.createElement('div');
      block.className = bullet ? 'sa-li' : 'sa-p';
      if (bullet) lis.push({ el: block, first: words.length });
      var body = bullet ? line.replace(/^\s*([-*•])\s+/, '') : line;
      body.split(/(\*\*[^*]+\*\*)/).forEach(function (seg) {
        if (!seg) return;
        var bold = /^\*\*[^*]+\*\*$/.test(seg);
        (bold ? seg.slice(2, -2) : seg).split(/(\s+)/).forEach(function (w) {
          if (!w) return;
          if (/^\s+$/.test(w)) { if (words.length) words[words.length - 1].el.textContent += w; return; }
          var s = document.createElement('span'); s.className = 'sa-w' + (bold ? ' b sa-acc' : ''); s.textContent = w;
          block.appendChild(s); words.push({ el: s, bold: bold, block: block });
        });
      });
      host.appendChild(block);
    });
    var tip = document.createElement('span'); tip.className = 'sa-tip';
    if (phone) {
      var kb = q('.sa-kb');
      ['qwertyuiop', 'asdfghjkl', 'zxcvbnm', ' '].forEach(function (row) {
        var r = document.createElement('div'); r.className = 'sa-kr';
        row.split('').forEach(function (ch) { var b = document.createElement('b'); if (ch === ' ') { b.className = 'sp'; b.textContent = 'space'; } else b.textContent = ch; r.appendChild(b); });
        kb.appendChild(r);
      });
    }

    // ---- SIZE: lay out, then shrink until the FINISHED answer fits ----
    var rc = el.getBoundingClientRect(), sc = rc.width / W0 || 1;
    var ox = Math.max(0, -rc.left, rc.right - window.innerWidth) / sc + W0 * 0.05, oy = Math.max(0, -rc.top, rc.bottom - window.innerHeight) / sc + H0 * 0.06;
    var W = W0 - 2 * ox, H = H0 - 2 * oy;
    var u;
    if (phone) {
      var ph = Math.min(H, W * 2.05), pw = ph / 2.05;
      var P = q('.sa-phone');
      P.style.cssText = 'left:' + (ox + (W - pw) / 2) + 'px;top:' + (oy + (H - ph) / 2) + 'px;width:' + pw + 'px;height:' + ph + 'px';
      u = pw / 420;
      q('.sa-me').textContent = ask;
      q('.sa-phone .sa-ask-text').textContent = '';
    } else {
      var wrap = q('.sa-wrap');
      wrap.style.cssText = 'left:' + ox + 'px;top:' + oy + 'px;width:' + W + 'px;height:' + H + 'px;justify-content:center';
      q('.sa-wrap .sa-ask-text').textContent = ask;
      u = Math.min(W / 1300, H / 700) * 1.25;
    }
    function tooTall() {
      // A bottom-anchored thread overflows UPWARD, which scrollHeight never
      // reports (measured: the ask bubble cut off the top), so add it up.
      if (phone) { var th = q('.sa-thread'), cs = getComputedStyle(th); return q('.sa-me').offsetHeight + q('.sa-them').offsetHeight + parseFloat(cs.rowGap || 0) + parseFloat(cs.paddingTop) + parseFloat(cs.paddingBottom) > th.clientHeight + 1; }
      return q('.sa-wrap').scrollHeight > H + 1;
    }
    // Measure with the keyboard gone (the answer streams after it drops).
    for (var i = 0; i < 40; i++) {
      root.style.setProperty('--u', u.toFixed(3) + 'px');
      if (!tooTall()) break;
      u *= 0.95;
    }
    if (!phone) {
      // Pin the ask pill at its finished size, so typing never reflows the answer below it.
      var pill = q('.sa-ask');
      if (ask) { pill.style.width = pill.offsetWidth + 'px'; pill.style.minHeight = pill.offsetHeight + 'px'; }
      q('.sa-wrap .sa-ask-text').textContent = '';
    }

    // ---- TIMING: type the ask, think, then stream in seeded token bursts ----
    var seed = Number(data.seed) || 7;
    function rnd() { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; }
    var AT = Number(data.at) || 0.2;
    var cps = Number(data.type_speed) || 24;
    var typeDur = ask ? Math.min(2.2, ask.length / cps) : 0;
    var tSend = AT + 0.4 + typeDur + (ask ? 0.25 : 0);
    var tStream = tSend + (data.thinking === false ? 0.1 : 0.8);
    var tEnd = Math.max(tStream + 0.6, DUR * 0.85 - 0.3);
    var chunks = [], k = 0;
    while (k < words.length) { var c = 1 + Math.floor(rnd() * 3); chunks.push([k, Math.min(words.length, k + c)]); k += c; }
    var per = (tEnd - tStream) / Math.max(1, chunks.length);
    var wps = Number(data.words_per_second);
    if (wps > 0) per = Math.max(0.05, (words.length / wps) / Math.max(1, chunks.length));
    chunks.forEach(function (ch, ci) { for (var j = ch[0]; j < ch[1]; j++) words[j].t = tStream + ci * per + (rnd() - 0.5) * per * 0.3; });
    var lastT = words.length ? words[words.length - 1].t : tStream;

    var st = { t: 0 };
    var askEls = el.querySelectorAll(phone ? '.sa-phone .sa-ask-text' : '.sa-wrap .sa-ask-text');
    var caretEls = el.querySelectorAll(phone ? '.sa-phone .sa-ask-caret' : '.sa-wrap .sa-ask-caret');
    function apply() {
      var t = st.t;
      // The ask types, its caret blinks while it types.
      var nch = ask ? Math.max(0, Math.min(ask.length, Math.floor((t - AT - 0.4) / Math.max(0.001, typeDur) * ask.length))) : 0;
      var typed = phone ? (t < tSend ? ask.slice(0, nch) : '') : ask.slice(0, nch);
      Array.prototype.forEach.call(askEls, function (e) { if (e.textContent !== typed) e.textContent = typed; });
      Array.prototype.forEach.call(caretEls, function (c) { c.style.opacity = (t > AT + 0.3 && t < tSend && Math.floor(t * 2.4) % 2 === 0) ? 1 : 0; });
      // Words: invisible, then grey on arrival, settling to ink over 0.45s.
      var tipAt = -1;
      for (var i = 0; i < words.length; i++) {
        var w = words[i], d = t - w.t;
        // Full frame keeps the finished layout (nothing reflows); a chat
        // bubble GROWS as the words arrive.
        if (d < 0) { w.el.style.opacity = 0; if (phone) w.el.style.display = 'none'; continue; }
        if (phone) w.el.style.display = '';
        var f = Math.min(1, d / 0.45);
        w.el.style.opacity = Math.min(1, 0.35 + d / 0.12);
        if (!w.bold) w.el.style.color = f >= 1 ? '' : 'color-mix(in srgb, var(--ink) ' + Math.round(30 + 70 * f) + '%, transparent)';
        tipAt = i;
      }
      if (phone) Array.prototype.forEach.call(host.children, function (b) { var first = words.filter(function (w) { return w.block === b; })[0]; b.style.display = first && t >= first.t ? '' : 'none'; });
      // Bullet dots land with their first word.
      lis.forEach(function (li) { li.el.style.setProperty('--dot', words[li.first] && t >= words[li.first].t ? 1 : 0); });
      // The caret rides the tip while streaming, then goes.
      if (tipAt >= 0 && t < lastT + 0.6) { if (tip.previousSibling !== words[tipAt].el) words[tipAt].el.after(tip); tip.style.opacity = 1; }
      else tip.style.opacity = 0;
      var thinking = t >= tSend && t < tStream && tipAt < 0;
      Array.prototype.forEach.call(el.querySelectorAll('.sa-think'), function (e) { e.style.opacity = thinking ? 1 : 0; });
      Array.prototype.forEach.call(el.querySelectorAll('.sa-think i'), function (e, j) { e.style.opacity = Math.floor(t * 3) % 3 >= j ? 1 : 0.2; });
      if (phone) {
        var kbUp = Math.max(0, Math.min(1, (t - AT - 0.1) / 0.35)) * (1 - Math.max(0, Math.min(1, (t - tSend) / 0.35)));
        q('.sa-kb').style.transform = 'translateY(' + ((1 - kbUp) * 100).toFixed(1) + '%)';
        q('.sa-compose').style.transform = 'translateY(' + (-kbUp * q('.sa-kb').offsetHeight).toFixed(1) + 'px)';
        var me = q('.sa-me'), them = q('.sa-them');
        var mv = ask ? Math.max(0, Math.min(1, (t - tSend) / 0.3)) : 0;
        me.style.display = ask && t >= tSend ? '' : 'none'; me.style.opacity = mv; me.style.transform = 'translateY(' + ((1 - mv) * 14).toFixed(1) + 'px)';
        them.style.display = t >= tSend + 0.15 ? '' : 'none';
        q('.sa-dots').style.display = thinking ? '' : 'none';
        Array.prototype.forEach.call(el.querySelectorAll('.sa-dots i'), function (e, j) { e.style.opacity = Math.floor(t * 3) % 3 === j ? 1 : 0.35; });
      }
    }
    // Entrance of the surface itself.
    gsap.set(scope, { autoAlpha: 0, y: 20 });
    tl.to(scope, { autoAlpha: 1, y: 0, duration: 0.5, ease: 'power3.out' }, AT);
    tl.to(st, { t: DUR, duration: DUR, ease: 'none' }, 0);
    tl.eventCallback('onUpdate', apply);
    apply();
    return tl;
  }
</script>
