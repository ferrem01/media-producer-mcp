<template>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&display=block">
  <div class="stm"></div>
</template>

<style scoped>
  /* STATUS MORPH: one black shape that keeps morphing through a list of
     states -- a label, a spinner, a progress bar with a counting percentage,
     a route with a van driving it, and a done circle with a check that draws
     itself. Labels rise out of the shape's own mask; the shape never fades. */
  .stm, .stm * { max-width: none; box-sizing: border-box; }
  .stm { position: absolute; inset: 0; overflow: hidden; pointer-events: none;
    font-family: 'Geist', var(--mp-font-family, system-ui), sans-serif; color: #111; }
  .stm-abs { position: absolute; left: 0; top: 0; }
</style>

<script>
  function createTimeline(el, data, ctx) {
    var tl = gsap.timeline();
    data = data || {};
    var root = el.querySelector('.stm');
    if (!root) return tl;
    var num = function (v, d) { var n = Number(v); return (v === null || v === undefined || v === '' || !isFinite(n)) ? d : n; };
    var W = root.clientWidth || 1080, H = root.clientHeight || 1080, U = Math.min(W, H);
    if (!document.getElementById('mp-font-geist')) {
      var lk = document.createElement('link'); lk.id = 'mp-font-geist'; lk.rel = 'stylesheet';
      lk.href = 'https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&display=block';
      document.head.appendChild(lk);
    }
    var px = function (v) { return v.toFixed(2) + 'px'; };
    var esc = function (s) { return String(s === undefined || s === null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); };
    var mk = function (parent, cls, css, html) {
      var d = document.createElement('div');
      d.className = 'stm-abs' + (cls ? ' ' + cls : '');
      if (css) d.style.cssText += css;
      if (html !== undefined && html !== null) d.innerHTML = html;
      parent.appendChild(d); return d;
    };

    var AT = num(data.at, 0);
    var pill = data.pill || {};
    var base = { cx: num(pill.x, 0.5) * W, cy: num(pill.y, 0.62) * H, w: num(pill.w, 0.44) * W, h: num(pill.h, 0.075) * H };
    var dd = data.done || {};
    var done = { cx: num(dd.x, base.cx / W) * W, cy: num(dd.y, base.cy / H) * H, d: num(dd.size, 0.12) * U };
    if (data.color) root.style.setProperty('--stm-c', data.color);

    // ── STATUS MORPH: ONE black shape that keeps changing ──
    // Shared with status-morph (copied verbatim; components are self-contained).
    // Every state is a content layer inside the shape; the shape clips it, so a
    // label rises out of its own mask while the shape resizes around it.
    function buildMorph(host, o) {
      var base = o.base, st = o.start || base, dn = o.done || { cx: base.cx, cy: base.cy, d: base.h * 1.5 };
      var h0 = base.h, fs = h0 * (o.fontScale || 0.32), pad = h0 * 0.42;
      var P = { cx: st.cx, cy: st.cy, w: st.w, h: st.h };
      var shape = document.createElement('div');
      shape.className = o.cls + '-shape';
      shape.style.cssText = 'position:absolute;overflow:hidden;background:#0b0b0c;color:#fff;transform-origin:50% 50%;box-shadow:0 ' + (h0 * 0.16).toFixed(2) + 'px ' + (h0 * 0.45).toFixed(2) + 'px rgba(10,10,20,0.24);' +
        'font-family:\'Geist\', var(--mp-font-family, system-ui), sans-serif;font-size:' + fs.toFixed(2) + 'px;font-weight:600;line-height:1;white-space:nowrap;';
      host.appendChild(shape);
      if (isFinite(Number(o.shadowAt))) {
        // born from a flat button (the nav's): the lift grows as it takes off
        var shOn = shape.style.boxShadow;
        shape.style.boxShadow = '0 1px 3px rgba(10,10,20,0.18)';
        tl.to(shape, { boxShadow: shOn, duration: 0.35, ease: 'power2.out' }, Number(o.shadowAt));
      }
      var apply = function () {
        shape.style.left = (P.cx - P.w / 2).toFixed(2) + 'px'; shape.style.top = (P.cy - P.h / 2).toFixed(2) + 'px';
        shape.style.width = P.w.toFixed(2) + 'px'; shape.style.height = P.h.toFixed(2) + 'px';
        shape.style.borderRadius = (Math.min(P.w, P.h) / 2).toFixed(2) + 'px';
      };
      apply();
      var go = function (b, at, dur, ease) { tl.to(P, { cx: b.cx, cy: b.cy, w: b.w, h: b.h, duration: dur || 0.34, ease: ease || 'power3.inOut', onUpdate: apply }, at); };
      var ICON = {
        check: '<svg width="0.95em" height="0.95em" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>',
        printer: '<svg width="1.1em" height="1.1em" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M7 9V3.5h10V9"/><rect x="3" y="9" width="18" height="8" rx="2.2"/><path d="M7 14h10v6.5H7z"/></svg>'
      };
      var current = null;
      var layer = function (html) {
        var d = document.createElement('div');
        d.className = o.cls + '-layer';
        d.style.cssText = 'position:absolute;left:0;top:0;width:100%;height:100%;display:flex;align-items:center;justify-content:center;';
        d.innerHTML = html; shape.appendChild(d); return d;
      };
      var swap = function (el, at) {
        if (!current || at < 0) { if (current) gsap.set(current, { autoAlpha: 0 }); current = el; return; }
        var prev = current;
        tl.to(prev, { yPercent: -120, duration: 0.18, ease: 'power2.in' }, at).set(prev, { autoAlpha: 0 }, at + 0.18);
        gsap.set(el, { autoAlpha: 0, yPercent: 120 });
        tl.set(el, { autoAlpha: 1 }, at + 0.08).to(el, { yPercent: 0, duration: 0.3, ease: 'power3.out' }, at + 0.08);
        current = el;
      };
      var row = function (left, right) {
        return '<div style="position:absolute;left:' + pad.toFixed(2) + 'px;right:' + pad.toFixed(2) + 'px;top:0;height:70%;display:flex;align-items:center;justify-content:space-between;">' +
          '<span style="display:inline-flex;align-items:center;gap:0.5em">' + left + '</span>' + (right || '') + '</div>';
      };
      var api = { shape: shape, P: P, go: go };
      api.label = function (text, icon, at) {
        var el = layer('<span class="' + o.cls + '-text" style="display:inline-flex;align-items:center;gap:0.45em">' + (icon && ICON[icon] ? ICON[icon] : '') + esc(text) + '</span>');
        swap(el, at); return el;
      };
      api.run = function (states) {
        var list = states.slice().filter(function (s) { return s && isFinite(Number(s.at)); }).sort(function (a, b) { return a.at - b.at; });
        list.forEach(function (s, i) {
          var at = Number(s.at), next = list[i + 1] ? Number(list[i + 1].at) : at + 1.2;
          var kind = s.kind || 'label', el;
          var bw = base.w * num(s.w, kind === 'progress' ? 0.88 : kind === 'route' ? 0.94 : 1);
          var bh = base.h * num(s.h, kind === 'progress' ? 1.34 : kind === 'route' ? 1.42 : 1);
          var box = { cx: base.cx, cy: base.cy, w: bw, h: bh };
          if (kind === 'spinner') {
            el = layer('<svg class="' + o.cls + '-spin" width="1.35em" height="1.35em" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round"><circle cx="12" cy="12" r="9" stroke-dasharray="38 100" /></svg>');
            go(box, at); swap(el, at);
            tl.fromTo(el.firstChild, { rotation: 0 }, { rotation: 360 * Math.max(1, (next - at) * 2.4), duration: Math.max(0.1, next - at), ease: 'none', immediateRender: false, transformOrigin: '50% 50%' }, at);
          } else if (kind === 'progress') {
            el = layer(row((s.icon === false ? '' : ICON[s.icon || 'printer']) + '<span>' + esc(s.text || 'Printing') + '</span>',
              '<span class="' + o.cls + '-pct" style="font-variant-numeric:tabular-nums">0%</span>') +
              '<div style="position:absolute;left:' + pad.toFixed(2) + 'px;right:' + pad.toFixed(2) + 'px;bottom:22%;height:' + Math.max(1.5, h0 * 0.05).toFixed(2) + 'px;border-radius:9px;background:rgba(255,255,255,0.22);overflow:hidden">' +
              '<div class="' + o.cls + '-fill" style="position:absolute;left:0;top:0;width:100%;height:100%;background:#fff;transform-origin:0 50%;transform:scaleX(0)"></div></div>');
            go(box, at); swap(el, at);
            var pct = el.querySelector('.' + o.cls + '-pct'), fill = el.querySelector('.' + o.cls + '-fill'), pp = { p: 0 };
            var upP = function () { pct.textContent = Math.round(pp.p * 100) + '%'; fill.style.transform = 'scaleX(' + pp.p.toFixed(4) + ')'; };
            tl.to(pp, { p: 1, duration: Math.max(0.1, num(s.to, at + 0.8) - at - 0.1), ease: 'power1.inOut', onUpdate: upP }, at + 0.1);
          } else if (kind === 'route') {
            var vw = h0 * 0.46, vh = vw * 16 / 28, dw = h0 * 0.3;
            el = layer(row('<span>' + esc(s.text || 'On its way') + '</span>',
              s.right === false ? '' : '<span style="color:rgba(255,255,255,0.55);font-weight:500">' + esc(s.right || 'today') + '</span>') +
              '<div class="' + o.cls + '-route" style="position:absolute;left:' + pad.toFixed(2) + 'px;right:' + (pad + dw * 1.3).toFixed(2) + 'px;bottom:25%;height:' + Math.max(1.5, h0 * 0.045).toFixed(2) + 'px;' +
              'background:repeating-linear-gradient(90deg, rgba(255,255,255,0.5) 0 ' + Math.max(1.5, h0 * 0.05).toFixed(2) + 'px, transparent 0 ' + Math.max(4, h0 * 0.13).toFixed(2) + 'px)">' +
              '<div class="' + o.cls + '-trail" style="position:absolute;left:0;top:0;width:100%;height:100%;background:#fff;border-radius:9px;transform-origin:0 50%;transform:scaleX(0)"></div>' +
              '<svg class="' + o.cls + '-van" viewBox="0 0 28 16" width="' + vw.toFixed(2) + '" height="' + vh.toFixed(2) + '" style="position:absolute;left:0;bottom:' + (h0 * 0.01).toFixed(2) + 'px;overflow:visible">' +
              '<path fill="#fff" d="M1 3a2 2 0 0 1 2-2h14v11H1z"/><path fill="#fff" d="M18 4.5h5.2L27 8.6V12h-9z"/><path fill="#0b0b0c" d="M20 6h2.7l2.2 2.4H20z"/>' +
              '<circle cx="6.5" cy="13" r="2.6" fill="#fff" stroke="#0b0b0c" stroke-width="1.4"/><circle cx="21.5" cy="13" r="2.6" fill="#fff" stroke="#0b0b0c" stroke-width="1.4"/></svg></div>' +
              '<svg viewBox="0 0 16 16" width="' + dw.toFixed(2) + '" height="' + dw.toFixed(2) + '" fill="none" stroke="#fff" stroke-width="1.7" stroke-linejoin="round" style="position:absolute;right:' + pad.toFixed(2) + 'px;bottom:calc(25% - ' + (dw * 0.3).toFixed(2) + 'px)"><path d="M2 7.5L8 2.5l6 5V14H2z"/></svg>');
            go(box, at); swap(el, at);
            var van = el.querySelector('.' + o.cls + '-van'), trail = el.querySelector('.' + o.cls + '-trail'), rp = { p: 0 };
            var upR = function () { van.style.left = 'calc(' + (rp.p * 100).toFixed(3) + '% - ' + (rp.p * vw).toFixed(2) + 'px)'; trail.style.transform = 'scaleX(' + rp.p.toFixed(4) + ')'; };
            tl.to(rp, { p: 1, duration: Math.max(0.1, num(s.to, at + 0.5) - at - 0.1), ease: 'power1.inOut', onUpdate: upR }, at + 0.1);
          } else if (kind === 'done') {
            var d = num(s.d, dn.d);
            el = layer('<svg class="' + o.cls + '-check" width="' + (d * 0.46).toFixed(2) + '" height="' + (d * 0.46).toFixed(2) + '" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5" stroke-dasharray="22" stroke-dashoffset="22"/></svg>');
            go({ cx: dn.cx, cy: dn.cy, w: d, h: d }, at, 0.38, 'power3.inOut');
            swap(el, at);
            var ck = el.querySelector('path');
            tl.to(ck, { attr: { 'stroke-dashoffset': 0 }, duration: 0.26, ease: 'power2.out' }, at + 0.22);
            tl.to(shape, { scale: 1.08, duration: 0.12, ease: 'power2.out' }, at + 0.36).to(shape, { scale: 1, duration: 0.3, ease: 'back.out(2.5)' }, at + 0.48);
          } else {
            el = api.label(s.text || '', s.icon, at);
            go(box, at);
          }
        });
      };
      return api;
    }

    var states = Array.isArray(data.states) && data.states.length ? data.states.slice() : [
      { kind: 'label', text: 'Order print', at: AT },
      { kind: 'spinner', at: AT + 0.1 },
      { kind: 'label', icon: 'check', text: 'Ordered', at: AT + 0.45 },
      { kind: 'progress', icon: 'printer', text: 'Printing', at: AT + 0.85, to: AT + 1.65 },
      { kind: 'route', text: 'On its way', right: 'today', at: AT + 1.95, to: AT + 2.45 },
      { kind: 'done', at: AT + 2.7 }
    ];
    states.sort(function (a, b) { return num(a.at, 0) - num(b.at, 0); });
    var morph = buildMorph(root, { base: base, done: done, cls: 'stm', fontScale: num(data.font_scale, 0.3) });
    if (data.color) morph.shape.style.background = data.color;
    // The first state, if it is a label at (or before) `at`, is the shape's
    // standing face; everything after it is a morph.
    var first = states[0];
    if (first && (first.kind || 'label') === 'label' && num(first.at, AT) <= AT) { morph.label(first.text || '', first.icon, -1); states.shift(); }
    else morph.label('', null, -1);
    if (data.appear === 'pop') {
      gsap.set(morph.shape, { scale: 0 });
      tl.to(morph.shape, { scale: 1, duration: 0.45, ease: 'back.out(1.8)' }, num(data.appear_at, AT));
    }
    morph.run(states);

    // A built-in cursor clicks the pill when the first morph starts.
    if (data.cursor !== false && states.length) {
      var cs = 0.026 * U * num(data.cursor_scale, 1);
      var cur = mk(root, 'stm-cursor', 'width:' + px(cs) + ';height:' + px(cs) + ';z-index:5;');
      var ring = mk(cur, 'stm-cur-ring', 'left:' + px(-cs * 0.7) + ';top:' + px(-cs * 0.7) + ';width:' + px(cs * 1.4) + ';height:' + px(cs * 1.4) + ';border-radius:50%;border:' + px(Math.max(1.5, cs * 0.08)) + ' solid rgba(15,15,20,0.55);background:rgba(15,15,20,0.08);');
      var press = mk(cur, 'stm-cur-press', 'left:0;top:0;width:100%;height:100%;transform-origin:0 0;',
        '<svg width="' + px(cs) + '" height="' + px(cs) + '" viewBox="0 0 24 24" style="position:absolute;left:' + px(-cs * 0.22) + ';top:' + px(-cs * 0.1) + ';overflow:visible;filter:drop-shadow(0 1px 1.5px rgba(0,0,0,0.3))">' +
        '<path d="M5.5 3.21V20.8c0 .45.54.67.85.35l4.86-4.86a.5.5 0 0 1 .35-.15h6.87c.45 0 .67-.53.35-.85L5.85 2.35a.5.5 0 0 0-.35.86z" fill="#0b0b0c" stroke="#ffffff" stroke-width="1.5" stroke-linejoin="round"/></svg>');
      gsap.set(ring, { scale: 0, autoAlpha: 0, transformOrigin: '50% 50%' });
      var cFrom = Array.isArray(data.cursor_from) ? data.cursor_from : [0.74, 0.82];
      var cTo = Array.isArray(data.cursor_to) ? data.cursor_to : [0.72, 0.8];
      gsap.set(cur, { x: num(cFrom[0], 0.74) * W, y: num(cFrom[1], 0.82) * H });
      var clickAt = num(data.click_at, num(states[0].at, AT + 0.1) - 0.05);
      tl.to(cur, { x: base.cx + base.w * 0.18, y: base.cy + base.h * 0.1, duration: 0.3, ease: 'power2.inOut' }, clickAt - 0.32)
        .to(press, { scale: 0.85, duration: 0.06, ease: 'power2.out' }, clickAt)
        .to(press, { scale: 1, duration: 0.1, ease: 'power2.out' }, clickAt + 0.07)
        .fromTo(ring, { scale: 0.3, autoAlpha: 0.6 }, { scale: 1.5, autoAlpha: 0, duration: 0.35, ease: 'power2.out', immediateRender: false }, clickAt)
        .to(morph.shape, { scale: 0.96, duration: 0.07, ease: 'power2.out' }, clickAt)
        .to(morph.shape, { scale: 1, duration: 0.18, ease: 'back.out(3)' }, clickAt + 0.08)
        .to(cur, { x: num(cTo[0], 0.72) * W, y: num(cTo[1], 0.8) * H, duration: 0.6, ease: 'power2.inOut' }, clickAt + 0.2);
    }
    return tl;
  }
</script>
