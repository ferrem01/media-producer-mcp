<template>

    <div class="rd-counter"></div>

  </div>

<style scoped>
  /* REVIEW DECK: "it reads every one." Rich record cards dealt one at a

     card is dealt away -- kept ones up and out, passed ones down -- as the
     next rises from the deck behind. A small counter ("Application 127 of
     480") ticks per card. Applications, leads, tickets, invoices. */
  .rd-root, .rd-root * { box-sizing: border-box; max-width: none; }
  .rd-root { --u: 1px; position: absolute; inset: 0; font-family: var(--mp-font-family, 'Inter', system-ui, sans-serif); color: var(--ink); }
  .rd-root.t-light { --ink: var(--mp-color-on-light, #17171c); --mute: color-mix(in srgb, var(--mp-color-on-light, #17171c) 55%, #ffffff); --faint: color-mix(in srgb, var(--mp-color-on-light, #17171c) 35%, #ffffff); --card: #ffffff; --edge: rgba(20, 20, 40, 0.08); --line: rgba(20, 20, 40, 0.07); --tile: #eceae6; }
  .rd-root.t-dark { --ink: #f5f6fa; --mute: rgba(255, 255, 255, 0.62); --faint: rgba(255, 255, 255, 0.4); --card: #1d1e26; --edge: rgba(255, 255, 255, 0.09); --line: rgba(255, 255, 255, 0.08); --tile: #2a2b35; }
  .rd-stage { position: absolute; }
  .rd-card { position: absolute; left: 0; top: 0; width: 100%; border-radius: calc(var(--u) * 22); background: var(--card);
    box-shadow: 0 calc(var(--u) * 24) calc(var(--u) * 60) rgba(20, 20, 60, 0.16), 0 calc(var(--u) * 3) calc(var(--u) * 10) rgba(20, 20, 60, 0.07), inset 0 0 0 1px var(--edge);
    padding: calc(var(--u) * 30) calc(var(--u) * 34); transform-origin: 50% 60%; }
  .rd-head { display: flex; align-items: center; gap: calc(var(--u) * 16); margin-bottom: calc(var(--u) * 22); }
  .rd-av { flex: 0 0 auto; width: calc(var(--u) * 62); height: calc(var(--u) * 62); border-radius: 50%; overflow: hidden; display: flex; align-items: center; justify-content: center; color: #fff; font-weight: 700; font-size: calc(var(--u) * 22); }
  .rd-av img { width: 100%; height: 100%; object-fit: cover; display: block; }

  .rd-rl { font-size: calc(var(--u) * 19); color: var(--mute); margin-top: calc(var(--u) * 4); }
  .rd-label { font-size: calc(var(--u) * 13); font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: var(--faint); margin: calc(var(--u) * 16) 0 calc(var(--u) * 8); }

  .rd-row:first-of-type { border-top: 0; }

  .rd-tick svg { width: 60%; height: 60%; }

  .rd-thumbs > div { width: calc(var(--u) * 78); height: calc(var(--u) * 78); border-radius: calc(var(--u) * 10); overflow: hidden; background: var(--tile); background-size: cover; background-position: center; }
  .rd-quote { font-size: calc(var(--u) * 18); color: var(--mute); font-style: italic; line-height: 1.35; }

    background: linear-gradient(180deg, transparent, color-mix(in srgb, var(--acc) 16%, transparent) 55%, color-mix(in srgb, var(--acc) 30%, transparent) 92%, transparent); }

    font-size: calc(var(--u) * 17); font-weight: 700; letter-spacing: 0.01em; white-space: nowrap; display: flex; align-items: center; gap: calc(var(--u) * 8); }
  .rd-stamp.yes { background: #17171c; color: #fff; }

<script>
  function createTimeline(el, data, ctx) {
    var tl = gsap.timeline();
    var q = function (s) { return el.querySelector(s); };
    var root = q('.rd-root'), stage = q('.rd-stage'), counter = q('.rd-counter');
    var DUR = (ctx && ctx.duration) || 8;
    var num = function (v, d) { var n = Number(v); return (v === null || v === undefined || v === '' || !isFinite(n)) ? d : n; };
    var gl = window.mpGroundLum ? mpGroundLum() : null;
    root.classList.add('t-' + (data.theme === 'dark' || data.theme === 'light' ? data.theme : (typeof gl === 'number' && gl < 0.18 ? 'dark' : 'light')));
    root.style.setProperty('--acc', data.color ? String(data.color) : 'var(--mp-color-primary, #393bf5)');
    var TONES = ['#b5654a', '#6b7a8f', '#c08a3e', '#7a5c8e', '#4f7f6a', '#a0525f', '#5a6fa8'];
    var LBL = data.labels || {};
    var cards = (Array.isArray(data.cards) ? data.cards : []).filter(function (c) { return c && c.name; }).slice(0, 8);
    if (!cards.length) return tl;

    // ---- The card box: the visible frame, a card of ~5:4 inside it. ----
    var W0 = el.clientWidth || 1200, H0 = el.clientHeight || 700;
    var rc = el.getBoundingClientRect(), sc = rc.width / W0 || 1;
    var ox = Math.max(0, -rc.left, rc.right - window.innerWidth) / sc + W0 * 0.04, oy = Math.max(0, -rc.top, rc.bottom - window.innerHeight) / sc + H0 * 0.06;
    var W = W0 - 2 * ox, H = H0 - 2 * oy;
    var hasCounter = !!data.counter;
    var topRoom = hasCounter ? H * 0.07 : 0, deckRoom = H * 0.05;
    var cw = Math.min(W, (H - topRoom - deckRoom) * 1.3), chMax = H - topRoom - deckRoom;
    var sx = ox + (W - cw) / 2;
    function initials(n) { return String(n || '').split(/\s+/).filter(Boolean).slice(0, 2).map(function (w) { return w.charAt(0).toUpperCase(); }).join(''); }
    var TICK = '<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';

    var els = cards.map(function (c, i) {
      var card = document.createElement('div'); card.className = 'rd-card'; card.setAttribute('data-anchor', 'card');
      var keep = c.keep !== false;
      var html = '<div class="rd-head"><div class="rd-av" data-anchor="avatar"></div><div><div class="rd-nm"></div><div class="rd-rl"></div></div></div>';
      card.innerHTML = html;
      var av = card.querySelector('.rd-av'); av.style.background = TONES[i % TONES.length];
      if (c.avatar) { var im = document.createElement('img'); im.src = String(c.avatar); im.alt = ''; av.appendChild(im); } else av.textContent = initials(c.name);
      card.querySelector('.rd-nm').textContent = String(c.name);
      card.querySelector('.rd-rl').textContent = String(c.role || '');
      var rows = (Array.isArray(c.rows) ? c.rows : []).slice(0, 5);
      if (rows.length) {
        var lb = document.createElement('div'); lb.className = 'rd-label'; lb.textContent = String(LBL.rows || 'Experience'); card.appendChild(lb);
        rows.forEach(function (r) {
          var row = document.createElement('div'); row.className = 'rd-row';
          var t = document.createElement('span'); t.textContent = String(r); row.appendChild(t);
          var tk = document.createElement('span'); tk.className = 'rd-tick'; row.appendChild(tk);
          card.appendChild(row);
        });
      }
      var thumbs = (Array.isArray(c.thumbs) ? c.thumbs : []).slice(0, 5);
      if (thumbs.length) {
        var lb2 = document.createElement('div'); lb2.className = 'rd-label'; lb2.textContent = String(LBL.thumbs || 'Portfolio'); card.appendChild(lb2);
        var th = document.createElement('div'); th.className = 'rd-thumbs';
        thumbs.forEach(function (src, k) { var d = document.createElement('div'); if (src) d.style.backgroundImage = 'url("' + String(src).replace(/"/g, '%22') + '")'; else d.style.background = TONES[(i + k + 2) % TONES.length]; th.appendChild(d); });
        card.appendChild(th);
      }
      if (c.quote) {
        var lb3 = document.createElement('div'); lb3.className = 'rd-label'; lb3.textContent = String(LBL.quote || 'Why this role'); card.appendChild(lb3);
        var qt = document.createElement('div'); qt.className = 'rd-quote'; qt.textContent = '“' + String(c.quote) + '”'; card.appendChild(qt);
      }
      var clip = document.createElement('div'); clip.className = 'rd-clip'; card.appendChild(clip);
      var scan = document.createElement('div'); scan.className = 'rd-scan'; clip.appendChild(scan);
      var stamp = document.createElement('div'); stamp.className = 'rd-stamp ' + (keep ? 'yes' : 'no');
      stamp.innerHTML = keep ? '<i></i><span></span>' : '<span></span>';
      stamp.querySelector('span').textContent = String(c.stamp || (keep ? (LBL.yes || 'Shortlisted') : (LBL.no || 'Not this search')));
      card.appendChild(stamp);
      stage.appendChild(card);
      return { card: card, keep: keep, scan: scan, stamp: stamp, ticks: [].slice.call(card.querySelectorAll('.rd-tick')), rows: [].slice.call(card.querySelectorAll('.rd-row')) };
    });

    // ---- Size: shrink the type until the tallest card fits. ----
    stage.style.left = sx + 'px'; stage.style.width = cw + 'px';
    // Grow the type until the tallest card fills most of the box (measured:
    // a wide box left a short card floating in space), then shrink to fit.
    var u = cw / 900;
    var tallestAt = function () { root.style.setProperty('--u', u.toFixed(3) + 'px'); return Math.max.apply(null, els.map(function (e) { return e.card.offsetHeight; })); };
    for (var g = 0; g < 20 && tallestAt() < chMax * 0.82 && u < cw / 560; g++) u *= 1.06;
    for (var f = 0; f < 30 && tallestAt() > chMax; f++) u *= 0.94;
    var ch = Math.max.apply(null, els.map(function (e) { return e.card.offsetHeight; }));
    els.forEach(function (e) { e.card.style.height = ch + 'px'; });
    var sy = oy + topRoom + (H - topRoom - deckRoom - ch) / 2;
    stage.style.top = sy + 'px'; stage.style.height = ch + 'px';

    // ---- The counter: one span per card, shown in turn (no callbacks). ----
    var cspans = [];
    if (hasCounter) {
      var co = typeof data.counter === 'object' ? data.counter : {};
      var from = num(co.from, 127), total = co.total !== undefined ? String(co.total) : '480', label = String(co.label || 'Application');
      counter.style.left = sx + 'px'; counter.style.top = (sy - topRoom * 0.75) + 'px';
      els.forEach(function (e, i) { var s = document.createElement('span'); s.textContent = label + ' ' + (from + i) + ' of ' + total; counter.appendChild(s); cspans.push(s); });
    }

    // ---- Motion: per card -- rise to the front, scan, tick, stamp, deal away. ----
    var AT = num(data.at, 0.3);
    var per = num(data.per_card, Math.max(1.6, Math.min(3.2, (DUR - AT - 0.6) / els.length)));
    var deckGap = ch * 0.035;
    els.forEach(function (e, i) {
      var t0 = AT + i * per;
      // In the deck: the next two peek behind, smaller and dimmer.
      var depth = function (d) { return { y: -deckGap * Math.min(d, 2), scale: 1 - 0.045 * Math.min(d, 2), autoAlpha: d > 2 ? 0 : 1 - 0.28 * d, zIndex: 20 - d }; };
      gsap.set(e.card, i === 0 ? { autoAlpha: 0, y: ch * 0.08, scale: 0.97, zIndex: 20 } : depth(i));
      // Each earlier deal moves this card one step forward.
      for (var d = i - 1; d >= 0; d--) tl.to(e.card, Object.assign(depth(d), { duration: 0.4, ease: 'power3.out' }), AT + (i - 1 - d) * per + per * 0.9);
      if (i === 0) tl.to(e.card, { autoAlpha: 1, y: 0, scale: 1, duration: 0.5, ease: 'power3.out' }, t0);
      if (cspans[i]) { gsap.set(cspans[i], { autoAlpha: 0 }); tl.set(cspans[i], { autoAlpha: 1 }, t0); if (i < els.length - 1) tl.set(cspans[i], { autoAlpha: 0 }, t0 + per); }
      // The scan: a band sweeps from under the head to the bottom; each row
      // ticks as the band's leading edge passes its centre.
      var head = e.card.querySelector('.rd-head');
      var y0 = head.offsetTop + head.offsetHeight, y1 = ch;
      var sStart = t0 + 0.4, sDur = per * 0.45;
      gsap.set(e.scan, { top: y0 - e.scan.offsetHeight });
      tl.to(e.scan, { opacity: 1, duration: 0.15 }, sStart);
      tl.to(e.scan, { top: y1, duration: sDur, ease: 'none' }, sStart);
      tl.to(e.scan, { opacity: 0, duration: 0.2 }, sStart + sDur - 0.1);
      e.rows.forEach(function (row, k) {
        var c = row.offsetTop + row.offsetHeight / 2;
        var at = sStart + Math.max(0, Math.min(1, (c - y0) / (y1 - y0))) * sDur;
        var tk = e.ticks[k];
        if (e.keep) {
          tk.innerHTML = TICK;
          gsap.set(tk, { scale: 0.4, backgroundColor: 'rgba(34,197,94,0)' });
          gsap.set(tk.firstChild, { autoAlpha: 0 });
          tl.to(tk, { scale: 1, backgroundColor: 'rgba(34,197,94,1)', duration: 0.22, ease: 'back.out(2)' }, at);
          tl.to(tk.firstChild, { autoAlpha: 1, duration: 0.15 }, at + 0.05);
        } else {
          gsap.set(tk, { scale: 0.4, autoAlpha: 0 });
          tl.to(tk, { scale: 1, autoAlpha: 0.7, duration: 0.2 }, at);
        }
      });
      if (window.mpStampIn) mpStampIn(tl, e.stamp, t0 + per * 0.66, { rotation: -4 }); else { gsap.set(e.stamp, { autoAlpha: 0 }); tl.to(e.stamp, { autoAlpha: 1, duration: 0.2 }, t0 + per * 0.66); }
      // Dealt away: kept ones up and to the left, passed ones down.
      if (i < els.length - 1) {
        tl.to(e.card, e.keep ? { x: -cw * 0.55, y: -ch * 0.12, rotation: -7, autoAlpha: 0, duration: 0.45, ease: 'power2.in' }
          : { y: ch * 0.35, rotation: 4, autoAlpha: 0, duration: 0.4, ease: 'power2.in' }, t0 + per * 0.9);
      }
    });
    return tl;
  }
</script>
