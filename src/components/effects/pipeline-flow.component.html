<template>

    <div class="pflow-card">
      <div class="pflow-rail"><div class="pflow-rail-fill"></div></div>

<style scoped>

    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;

    font-family: var(--mp-font-family, 'Inter', system-ui, -apple-system, sans-serif);

  /* The rail runs behind the glyph row, pinned to the glyph centre line. */

    opacity: 0;

</style>

<script>
  function createTimeline(el, data, ctx) {
    var tl = gsap.timeline();
    var card = el.querySelector('.pflow-card');
    var nodesWrap = el.querySelector('.pflow-nodes');
    var rail = el.querySelector('.pflow-rail');
    var railFill = el.querySelector('.pflow-rail-fill');
    var pulse = el.querySelector('.pflow-pulse');
    if (!card || !nodesWrap) return tl;

    var GLYPHS = {
      mail: '<path d="M3 6.5A2.5 2.5 0 0 1 5.5 4h13A2.5 2.5 0 0 1 21 6.5v11a2.5 2.5 0 0 1-2.5 2.5h-13A2.5 2.5 0 0 1 3 17.5z"/><path d="m3.6 6.9 7.5 5.3a1.6 1.6 0 0 0 1.8 0l7.5-5.3"/>',
      spark: '<path d="M12 2.6 14.1 9l6.4 2.1-6.4 2.1L12 19.6 9.9 13.2 3.5 11.1 9.9 9z"/><path d="M18.6 2.6 19.4 5l2.4.8-2.4.8-.8 2.4-.8-2.4L15.4 5.8 17.8 5z"/>',
      video: '<rect x="3.2" y="4.5" width="12.6" height="15" rx="3"/><path d="m16.6 11.2 3.6-2.4a.7.7 0 0 1 1.1.6v5.2a.7.7 0 0 1-1.1.6l-3.6-2.4z"/>',
      chart: '<path d="M4 19.5V10"/><path d="M10 19.5V5"/><path d="M16 19.5v-6"/><path d="M21 19.5v-9"/>',
      check: '<circle cx="12" cy="12" r="8.6"/><path d="m8.3 12.2 2.6 2.6 4.9-5.2"/>',
      doc:   '<path d="M6 3.4h7.4L18.6 8.6v12A1.4 1.4 0 0 1 17.2 22H6a1.4 1.4 0 0 1-1.4-1.4V4.8A1.4 1.4 0 0 1 6 3.4z"/><path d="M13.2 3.6v5.2h5.2"/>',
      bolt:  '<path d="M13.4 2.6 5.2 13.4h5.6l-.8 8 8.2-10.8h-5.6z"/>',
      cloud: '<path d="M7.2 18.4A4.2 4.2 0 0 1 7.6 10a5.6 5.6 0 0 1 10.7 1.5 3.7 3.7 0 0 1-.7 7z"/>',
    };

    var nodes = (data && data.nodes) || [];
    if (nodes.length < 2) return tl;

    var nodeEls = [];
    for (var i = 0; i < nodes.length; i++) {
      var n = nodes[i] || {};
      var wrap = document.createElement('div');
      wrap.className = 'pflow-node';

      var glyph = document.createElement('div');
      glyph.className = 'pflow-glyph';
      var halo = document.createElement('div');
      halo.className = 'pflow-halo';
      glyph.appendChild(halo);
      var path = GLYPHS[n.icon] || GLYPHS.spark;
      glyph.insertAdjacentHTML('beforeend',
        '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" ' +
        'stroke-linecap="round" stroke-linejoin="round">' + path + '</svg>');

      var label = document.createElement('div');
      label.className = 'pflow-label';
      label.textContent = String(n.label || '');

      wrap.appendChild(glyph);
      wrap.appendChild(label);
      nodesWrap.appendChild(wrap);
      nodeEls.push({ wrap: wrap, glyph: glyph, halo: halo, label: label });
    }

    // ── Geometry ──────────────────────────────────────────────────────────
    // The rail and the pulse ride the GLYPH centre line, which is a laid-out
    // fact, not a guess -- read it once the nodes are in the DOM.
    var cardBox = card.getBoundingClientRect();
    var firstBox = nodeEls[0].glyph.getBoundingClientRect();
    var lastBox = nodeEls[nodeEls.length - 1].glyph.getBoundingClientRect();
    var centreY = (firstBox.top + firstBox.height / 2) - cardBox.top;
    var startX = (firstBox.left + firstBox.width / 2) - cardBox.left;
    var endX = (lastBox.left + lastBox.width / 2) - cardBox.left;

    rail.style.top = centreY + 'px';
    rail.style.left = startX + 'px';
    rail.style.right = (cardBox.width - endX) + 'px';
    pulse.style.top = centreY + 'px';

    var stops = [];
    for (var s = 0; s < nodeEls.length; s++) {
      var b = nodeEls[s].glyph.getBoundingClientRect();
      stops.push((b.left + b.width / 2) - cardBox.left);
    }
    var span = Math.max(1, endX - startX);

    // ── Timeline ──────────────────────────────────────────────────────────
    // The lit fill is the brand primary as the scene actually resolved it.
    var litFill = (getComputedStyle(el).getPropertyValue('--mp-color-primary') || '').trim() || '#4f46e5';

    var at = (data && data.at != null) ? Number(data.at) : 0.3;
    var step = (data && data.step != null) ? Number(data.step) : 0.9;
    var hold = (data && data.hold != null) ? Number(data.hold) : 1.2;
    var wantExit = !(data && data.exit === false);

    gsap.set(card, { opacity: 0, y: 26, scale: 0.94 });
    gsap.set(nodeEls.map(function (n) { return n.wrap; }), { autoAlpha: 0, y: 14 });
    gsap.set(railFill, { scaleX: 0 });
    gsap.set(pulse, { opacity: 0, x: stops[0] });

    tl.to(card, { opacity: 1, y: 0, scale: 1, duration: 0.5, ease: 'back.out(1.5)' }, at);
    for (var k = 0; k < nodeEls.length; k++) {
      tl.to(nodeEls[k].wrap, { autoAlpha: 1, y: 0, duration: 0.34, ease: 'power3.out' },
        at + 0.12 + k * 0.08);
    }

    // The pulse leaves the first node, and each node lights as it arrives.
    var t = at + 0.5;
    tl.to(pulse, { opacity: 1, duration: 0.18 }, t);
    lightNode(0, t);

    for (var h = 1; h < nodeEls.length; h++) {
      var travel = step * 0.62;
      tl.to(pulse, { x: stops[h], duration: travel, ease: 'power2.inOut' }, t);
      tl.to(railFill, {
        scaleX: (stops[h] - stops[0]) / span,
        duration: travel, ease: 'power2.inOut',
      }, t);
      t += travel;
      lightNode(h, t);
      t += step - travel;
    }

    tl.to(pulse, { opacity: 0, duration: 0.3, ease: 'power2.in' }, t - 0.1);

    if (wantExit) {
      var out = t + hold;
      tl.to(card, { opacity: 0, y: -18, scale: 0.97, duration: 0.42, ease: 'power2.in' }, out);
    }

    return tl;

    function lightNode(idx, when) {
      var n = nodeEls[idx];
      // Tween the properties, not the class. A className tween runs through
      // CSSPlugin and fights the scale tween on the same element; explicit
      // props reverse cleanly under frame-seeking.
      tl.to(n.glyph, {
        backgroundColor: litFill, borderColor: 'rgba(255,255,255,0.34)', color: '#ffffff',
        duration: 0.2, ease: 'power2.out',
      }, when);
      tl.to(n.label, { color: '#ffffff', duration: 0.2, ease: 'power2.out' }, when);
      tl.fromTo(n.glyph, { scale: 1 },
        { scale: 1.13, duration: 0.16, ease: 'power2.out', immediateRender: false }, when);
      tl.to(n.glyph, { scale: 1, duration: 0.3, ease: 'elastic.out(1, 0.55)' }, when + 0.16);
      tl.fromTo(n.halo, { opacity: 0, scale: 0.8 },
        { opacity: 0.55, scale: 1.15, duration: 0.22, ease: 'power2.out', immediateRender: false }, when);
      tl.to(n.halo, { opacity: 0.22, scale: 1, duration: 0.5, ease: 'power2.out' }, when + 0.22);
    }
  }
</script>
