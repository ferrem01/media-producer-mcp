<template>
  <div class="crg"><div class="crg-glow"></div><svg class="crg-waves" aria-hidden="true"></svg></div>
</template>

<style scoped>
  /* CREAM GROUND: the cream world's surface -- the warm editorial cream of
     st-statement (#f4efe1) with its soft white glow at the centre, and
     nothing else. Flat and still, so it rides inside the camera rig and
     the cut between scenes is invisible. */
  .crg { position: absolute; inset: 0; background: #f4efe1; overflow: hidden; }
  .crg-glow { position: absolute; inset: 0; pointer-events: none;
    background: radial-gradient(ellipse 70% 55% at 50% 46%, rgba(255,255,255,0.55), rgba(255,255,255,0) 70%); }
  .crg-waves { position: absolute; inset: 0; width: 100%; height: 100%; display: none; pointer-events: none; }
</style>

<script>
  function createTimeline(el, data, ctx) {
    var root = el.querySelector('.crg');
    if (data.tone) root.style.background = String(data.tone);
    if (data.glow === false) el.querySelector('.crg-glow').style.display = 'none';

    // pattern "waves": the Claude announce email's line texture -- a band of
    // fine contour lines flowing across the sheet in a slow S, bunching and
    // spreading as they go, faint enough to stay paper. Drawn, so it is
    // crisp at any frame size. Still (the ground never moves).
    if (data.pattern === 'waves') {
      var svg = el.querySelector('.crg-waves');
      var W = el.clientWidth || 1920, H = el.clientHeight || 1080;
      svg.setAttribute('viewBox', '0 0 ' + W + ' ' + H);
      svg.setAttribute('preserveAspectRatio', 'none');
      svg.style.display = 'block';
      var ink = String(data.pattern_color || '#b48a6e');
      var op = data.pattern_opacity !== undefined && isFinite(Number(data.pattern_opacity)) ? Number(data.pattern_opacity) : 0.32;
      var N = 34, STEPS = 90, S = Math.min(W, H);
      var out = '';
      // Two families: the main band sweeping down-right through the middle,
      // and a fainter echo rising into the lower-right corner.
      var bands = [
        { n: N, c0: 0.30, c1: 0.80, bow: 0.14, spread0: 0.20, spread1: 0.46, alpha: 1 },
        { n: Math.round(N * 0.6), c0: 1.08, c1: 0.84, bow: -0.05, spread0: 0.14, spread1: 0.28, alpha: 0.6 },
      ];
      for (var b = 0; b < bands.length; b++) {
        var B = bands[b];
        for (var i = 0; i < B.n; i++) {
          var t = B.n > 1 ? i / (B.n - 1) : 0.5;
          var d = '';
          for (var k = 0; k <= STEPS; k++) {
            var u = k / STEPS;
            var centre = H * (B.c0 + (B.c1 - B.c0) * u) + H * B.bow * Math.sin(u * Math.PI * 1.7 + 0.4);
            var spread = H * (B.spread0 + (B.spread1 - B.spread0) * (0.5 - 0.5 * Math.cos(u * Math.PI)));
            var ripple = S * 0.012 * Math.sin(u * 7.5 + t * 2.6);
            var y = centre + (t - 0.5) * spread + ripple;
            d += (k ? 'L' : 'M') + (u * W).toFixed(1) + ' ' + y.toFixed(1);
          }
          // Lines thin out toward the band's edges, so it reads as one form.
          var edge = 1 - Math.pow(Math.abs(t - 0.5) * 2, 2.2) * 0.75;
          out += '<path d="' + d + '" fill="none" stroke="' + ink + '" stroke-width="' + (S / 1080 * 1.1).toFixed(2) +
            '" stroke-opacity="' + (op * B.alpha * edge).toFixed(3) + '"/>';
        }
      }
      svg.innerHTML = out;
    }
    return gsap.timeline();
  }
</script>
