<script>
  function createTimeline(el, data, ctx) {
    var tl = gsap.timeline();
    var connector = el.querySelector('.split-connector');
    var leftIcon = el.querySelector('.left-icon');
    var leftLabel = el.querySelector('.left-label');
    var rightIcon = el.querySelector('.right-icon');
    var rightLabel = el.querySelector('.right-label');
    var lineGlow = el.querySelector('.line-glow');
    var badge = el.querySelector('.connector-badge');
    var badgeText = el.querySelector('[data-target="badge-text"]');
    var lineTrack = el.querySelector('.line-track');

    var leftText = data.left_label || 'Quotient';
    var rightText = data.right_label || 'Canva';
    var leftColor = data.left_color || '#6366f1';
    var rightColor = data.right_color || '#00C4CC';
    var leftLetter = data.left_letter || 'Q';
    var rightLetter = data.right_letter || 'C';
    var badgeLabel = data.badge_text || 'Connected';

    leftLabel.textContent = leftText;
    rightLabel.textContent = rightText;
    leftIcon.textContent = leftLetter;
    leftIcon.style.background = leftColor;
    rightIcon.textContent = rightLetter;
    rightIcon.style.background = rightColor;
    badgeText.textContent = badgeLabel;

    // Initial state
    gsap.set(connector, { autoAlpha: 0 });
    gsap.set(lineTrack, { scaleX: 0 });
    gsap.set(lineGlow, { opacity: 0, scaleX: 0 });
    gsap.set(badge, { autoAlpha: 0, scale: 0.8 });

    // Entrance
    tl.to(connector, { autoAlpha: 1, duration: 0.3, ease: 'power2.out' }, 0.2);
    tl.to(lineTrack, { scaleX: 1, duration: 0.6, ease: 'power2.inOut' }, 0.4);
    tl.to(lineGlow, { opacity: 1, scaleX: 1, duration: 0.5, ease: 'power2.out' }, 0.7);
    tl.to(badge, { autoAlpha: 1, scale: 1, duration: 0.3, ease: 'back.out(2)' }, 0.9);

    // Subtle glow pulse
    tl.to(lineGlow, {
      opacity: 0.6,
      duration: 1.5,
      yoyo: true,
      repeat: -1,
      ease: 'sine.inOut'
    }, 1.5);

    // Exit
    if (ctx.duration > 2) {
      tl.to(connector, { autoAlpha: 0, duration: 0.3, ease: 'power2.in' }, ctx.duration - 0.4);
    }

    return tl;
  }
</script>
