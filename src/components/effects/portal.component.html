<template>
  <div class="portal">
    <div class="portal-core"></div>
  </div>
</template>

<style scoped>
  .portal {
    position: absolute;
    inset: 0;
    pointer-events: none;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .portal-core {
    position: relative;
    width: 38%;
    aspect-ratio: 1 / 1;
  }

  .portal-ring {
    position: absolute;
    inset: 0;
    border-radius: 50%;
    pointer-events: none;
    will-change: transform, opacity;
  }

  .portal-ray {
    position: absolute;
    top: 50%;
    left: 50%;
    transform-origin: 0 0;
    pointer-events: none;
    mix-blend-mode: screen;
    will-change: transform, opacity;
  }

  .portal-spark {
    position: absolute;
    top: 50%;
    left: 50%;
    border-radius: 50%;
    pointer-events: none;
    mix-blend-mode: screen;
    will-change: transform, opacity;
  }
</style>

<script>
  function createTimeline(el, data, ctx) {
    var tl = gsap.timeline();
    var core = el.querySelector('.portal-core');
    if (!core) return tl;

    var color = data.color || 'var(--mp-color-primary, #6366f1)';
    var glow = 'var(--mp-color-glow, rgba(255,255,255,0.9))';

    // Concentric energy rings.
    var ringDefs = [
      { inset: '0%',  border: 10, blur: 4,  op: 0.9 },
      { inset: '12%', border: 6,  blur: 2,  op: 0.7 },
      { inset: '26%', border: 16, blur: 18, op: 0.5 }
    ];
    var rings = [];
    ringDefs.forEach(function (cfg) {
      var r = document.createElement('div');
      r.className = 'portal-ring';
      r.style.top = cfg.inset;
      r.style.left = cfg.inset;
      r.style.right = cfg.inset;
      r.style.bottom = cfg.inset;
      r.style.border = cfg.border + 'px solid ' + color;
      r.style.boxShadow = '0 0 60px ' + color + ', inset 0 0 50px ' + color;
      r.style.filter = 'blur(' + cfg.blur + 'px)';
      r.style.opacity = String(cfg.op);
      r.setAttribute('data-op', String(cfg.op));
      core.appendChild(r);
      rings.push(r);
    });

    // Soft inner glow disc.
    var disc = document.createElement('div');
    disc.className = 'portal-ring';
    disc.style.inset = '30%';
    disc.style.background = 'radial-gradient(circle, ' + glow + ' 0%, ' + color + ' 45%, transparent 72%)';
    disc.style.filter = 'blur(14px)';
    disc.style.opacity = '0.85';
    core.appendChild(disc);

    // Light rays emanating outward.
    var rayCount = 14;
    var rays = [];
    for (var i = 0; i < rayCount; i++) {
      var ray = document.createElement('div');
      ray.className = 'portal-ray';
      var ang = (360 / rayCount) * i;
      ray.style.width = '46%';
      ray.style.height = '3px';
      ray.style.background = 'linear-gradient(90deg, ' + color + ' 0%, transparent 100%)';
      ray.style.transform = 'rotate(' + ang + 'deg)';
      ray.style.opacity = '0.5';
      core.appendChild(ray);
      rays.push(ray);
    }

    // Orbiting sparks.
    var sparkCount = 18;
    var sparks = [];
    for (var s = 0; s < sparkCount; s++) {
      var sp = document.createElement('div');
      sp.className = 'portal-spark';
      var sz = 3 + Math.random() * 5;
      sp.style.width = sz + 'px';
      sp.style.height = sz + 'px';
      sp.style.background = glow;
      sp.style.boxShadow = '0 0 10px ' + color;
      sp.style.opacity = '0';
      core.appendChild(sp);
      sparks.push(sp);
    }

    // Open: scale + rotate the whole core in.
    tl.fromTo(core,
      { scale: 0.05, rotation: -120, opacity: 0 },
      { scale: 1, rotation: 0, opacity: 1, duration: 1.3, ease: 'back.out(1.5)' }, 0);

    // Ambient counter-rotating swirl of the rings (looping).
    rings.forEach(function (r, idx) {
      var dir = idx % 2 === 0 ? 1 : -1;
      tl.to(r, {
        rotation: dir * 360,
        duration: (8 + idx * 3),
        ease: 'none',
        repeat: -1,
        transformOrigin: '50% 50%'
      }, 1.0);
      var baseOp = parseFloat(r.getAttribute('data-op')) || 0.6;
      tl.to(r, {
        opacity: baseOp * 0.55,
        duration: 1.8 + idx * 0.3,
        ease: 'sine.inOut',
        yoyo: true,
        repeat: -1
      }, 1.3);
    });

    // Glow disc pulse.
    tl.to(disc, {
      scale: 1.12,
      opacity: 0.55,
      duration: 2.2,
      ease: 'sine.inOut',
      yoyo: true,
      repeat: -1,
      transformOrigin: '50% 50%'
    }, 1.3);

    // Rays shimmer + slowly rotate.
    rays.forEach(function (ray, idx) {
      var baseAng = (360 / rayCount) * idx;
      tl.fromTo(ray,
        { opacity: 0, scaleX: 0.3 },
        { opacity: 0.5, scaleX: 1, duration: 0.8, ease: 'power2.out' }, 0.9 + idx * 0.03);
      tl.to(ray, {
        opacity: 0.15,
        duration: 1.2 + (idx % 5) * 0.3,
        ease: 'sine.inOut',
        yoyo: true,
        repeat: -1
      }, 1.4 + idx * 0.05);
    });
    // Slow rotation of the whole ray set is achieved by rotating each toward next slot.
    rays.forEach(function (ray, idx) {
      var baseAng = (360 / rayCount) * idx;
      tl.to(ray, {
        rotation: baseAng + 360,
        duration: 22,
        ease: 'none',
        repeat: -1,
        transformOrigin: '0 0'
      }, 1.4);
    });

    // Sparks orbit outward and recycle.
    sparks.forEach(function (sp, idx) {
      var ang = Math.random() * Math.PI * 2;
      var radius = 30 + Math.random() * 130;
      var ex = Math.cos(ang) * radius;
      var ey = Math.sin(ang) * radius;
      var dur = 2.5 + Math.random() * 2.5;
      var delay = 1.0 + Math.random() * 2.5;
      var sparkTl = gsap.timeline({ repeat: -1, repeatDelay: Math.random() * 1.5 });
      sparkTl.fromTo(sp,
        { x: 0, y: 0, opacity: 0, scale: 0.4 },
        { opacity: 0.95, scale: 1, duration: dur * 0.3, ease: 'power1.out' }, 0);
      sparkTl.to(sp, { x: ex, y: ey, duration: dur, ease: 'power1.out' }, 0);
      sparkTl.to(sp, { opacity: 0, scale: 0.2, duration: dur * 0.4, ease: 'power1.in' }, dur * 0.6);
      tl.add(sparkTl, delay);
    });

    return tl;
  }
</script>
