<template>
  <div class="grain-overlay">
    <svg class="grain-svg" width="100%" height="100%">
      <filter id="grainNoiseFilter">
        <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" stitchTiles="stitch"/>
        <feColorMatrix type="saturate" values="0"/>
      </filter>
      <rect class="grain-rect" width="100%" height="100%" filter="url(#grainNoiseFilter)"/>
    </svg>
  </div>
</template>

<style scoped>
  .grain-overlay {
    position: absolute;
    inset: 0;
    pointer-events: none;
    overflow: hidden;
  }

  .grain-svg {
    position: absolute;
    top: -20%;
    left: -20%;
    width: 140%;
    height: 140%;
    mix-blend-mode: overlay;
    opacity: 0;
  }

  .grain-rect {
    opacity: 0.5;
  }
</style>

<script>
  function createTimeline(el, data, ctx) {
    var tl = gsap.timeline();
    var svg = el.querySelector('.grain-svg');
    var rect = el.querySelector('.grain-rect');

    var intensity = data.intensity !== undefined ? data.intensity : 0.5;
    intensity = Math.max(0, Math.min(1, intensity));

    // Map intensity to a subtle overlay opacity range.
    var maxOpacity = 0.04 + intensity * 0.16;

    if (svg) {
      // Gentle fade-in of the grain layer.
      tl.to(svg, { opacity: maxOpacity, duration: 0.6, ease: 'power1.out' }, 0);

      // Continuous tiny drift so the grain texture never sits perfectly still.
      tl.to(svg, {
        x: 6,
        y: -6,
        duration: 0.18,
        ease: 'steps(3)',
        yoyo: true,
        repeat: -1
      }, 0.1);
    }

    if (rect) {
      // Subtle flicker of grain density over time.
      tl.to(rect, {
        opacity: 0.32,
        duration: 0.22,
        ease: 'steps(2)',
        yoyo: true,
        repeat: -1
      }, 0);
    }

    return tl;
  }
</script>
