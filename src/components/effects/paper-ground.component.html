<template>
  <div class="paper-ground">
    <canvas class="pg-canvas"></canvas>
    <img class="pg-tex" alt="" />
  </div>
</template>

<style scoped>
  /* ── paper-ground: the PAPER WORLD's full-bleed surface (SPEC-canvas-tour
     dependencies; the Lenny/Behind-the-Craft print aesthetic). A painted
     sheet -- warm tone, pulp mottle, hairline fibers, speckle, edge-fold
     shading, soft warm vignette -- deterministic from the world's seed so
     every scene of a film sits on the SAME piece of paper.
     The intensity dial spans clean print (~0.15, barely-there tooth) to
     letterpress (~0.85, visible fiber). Sets the ink channel CSS vars
     (--mp-ink, --mp-paper) that performed-type components consume. */
  .paper-ground { width: 100%; height: 100%; position: relative; overflow: hidden; }
  .pg-canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
  /* The tooth source lives in the DOM (hidden) so the page's load event and
     the capture's image wait both account for it -- a texture that decodes
     after the screenshot would make renders nondeterministic. */
  .pg-tex { position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none; }
</style>

<script>
  function createTimeline(el, data, ctx) {
    var tl = gsap.timeline();
    var cv = el.querySelector('.pg-canvas');
    var rect = el.getBoundingClientRect();
    var cw = Math.max(320, Math.round(rect.width) || 1920);
    var ch = Math.max(180, Math.round(rect.height) || 1080);
    // 1.5x backing so modest camera pushes stay crisp.
    var W = Math.round(cw * 1.5), H = Math.round(ch * 1.5);
    cv.width = W; cv.height = H;
    var g = cv.getContext('2d');

    var tone = typeof data.tone === 'string' && /^#([0-9a-fA-F]{3}){1,2}$/.test(data.tone) ? data.tone : '#f2efe7';
    var intensity = Math.max(0, Math.min(1, Number(data.intensity) >= 0 ? Number(data.intensity) : 0.35));
    var seed = (Number(data.seed) || 7) >>> 0;
    function rnd() { seed = (seed * 1664525 + 1013904223) >>> 0; return seed / 4294967296; }

    // Ink channel: warm charcoal on light paper, warm cream on a dark sheet
    // (pure black/white banned -- the print-world law).
    var th = tone.length === 4 ? tone.replace(/[0-9a-fA-F]/g, function (c) { return c + c; }) : tone;
    var lum = (parseInt(th.slice(1, 3), 16) * 0.299 + parseInt(th.slice(3, 5), 16) * 0.587 + parseInt(th.slice(5, 7), 16) * 0.114) / 255;
    var darkSheet = lum < 0.5;
    var ink = darkSheet ? '#efeadd' : '#3b342a';
    var root = document.documentElement;
    root.style.setProperty('--mp-paper', tone);
    root.style.setProperty('--mp-ink', ink);

    // ── paint the sheet (once; the paper does not move) ──
    // PHOTOGRAPHIC TOOTH (data.texture_url): a real macro surface photo,
    // high-passed to neutral gray by generate_clip mode='texture', stamped
    // across the sheet at random rotation with a feathered alpha so there
    // are no tile seams (grid/mirror tiling makes butterfly artifacts --
    // measured in the Behind-the-Craft prototype). Procedural fibers stay
    // as the base layer and thin out when a photo is present: the photo
    // carries the relief, the fibers carry the pulp.
    var texImg = el.querySelector('.pg-tex');
    var texUrl = typeof data.texture_url === 'string' && /^(\/|https?:|data:|file:)/.test(data.texture_url)
      ? data.texture_url : '';
    var hasTex = false;
    function stampTooth(img) {
      var S = Math.round(Math.min(W, H) * 0.34);
      if (!S || !img.naturalWidth) return;
      var stamp = document.createElement('canvas');
      stamp.width = S; stamp.height = S;
      var sc = stamp.getContext('2d');
      sc.drawImage(img, 0, 0, S, S);
      var fade = sc.createRadialGradient(S / 2, S / 2, S * 0.18, S / 2, S / 2, S * 0.5);
      fade.addColorStop(0, 'rgba(0,0,0,1)');
      fade.addColorStop(1, 'rgba(0,0,0,0)');
      sc.globalCompositeOperation = 'destination-in';
      sc.fillStyle = fade;
      sc.fillRect(0, 0, S, S);
      g.save();
      g.globalCompositeOperation = 'soft-light';
      g.globalAlpha = 0.35 + 0.5 * intensity;
      var step = S * 0.34;
      for (var sy = -1; sy * step < H + S; sy++) {
        for (var sx = -1; sx * step < W + S; sx++) {
          g.save();
          g.translate(sx * step + (rnd() - 0.5) * step * 0.6, sy * step + (rnd() - 0.5) * step * 0.6);
          g.rotate(Math.floor(rnd() * 4) * Math.PI / 2);
          if (rnd() < 0.5) g.scale(-1, 1);
          g.drawImage(stamp, -S / 2, -S / 2, S, S);
          g.restore();
        }
      }
      g.restore();
    }

    g.fillStyle = tone;
    g.fillRect(0, 0, W, H);
    // pulp mottle: big soft blobs, barely-there
    var mottleN = Math.round(60 + 120 * intensity);
    for (var i = 0; i < mottleN; i++) {
      var mx = rnd() * W, my = rnd() * H, mr = H * (0.06 + rnd() * 0.16);
      var grad = g.createRadialGradient(mx, my, 0, mx, my, mr);
      var dark = rnd() < 0.5;
      var a = (dark ? 0.020 : 0.030) * (0.5 + intensity);
      grad.addColorStop(0, dark ? 'rgba(120,106,84,' + a + ')' : 'rgba(255,252,244,' + (a * 1.4) + ')');
      grad.addColorStop(1, 'rgba(0,0,0,0)');
      g.fillStyle = grad;
      g.beginPath(); g.arc(mx, my, mr, 0, 7); g.fill();
    }
    // The tooth goes down over the base + mottle, under the fibers.
    if (texUrl && texImg) {
      texImg.src = texUrl;
      if (texImg.complete && texImg.naturalWidth) { stampTooth(texImg); hasTex = true; }
    }

    // fibers: short hairline arcs (thinned when a photo carries the relief)
    var area = (W * H) / (2880 * 1620);
    var fiberN = Math.round(area * (6000 + 34000 * intensity) * (hasTex ? 0.45 : 1));
    g.lineWidth = 1.1;
    for (var f = 0; f < fiberN; f++) {
      var x = rnd() * W, y = rnd() * H, ang = rnd() * Math.PI, len = 4 + rnd() * 12;
      var bow = (rnd() - 0.5) * 6;
      var fd = rnd() < 0.45;
      var fa = (fd ? 0.045 : 0.06) + rnd() * 0.05 * (0.5 + intensity);
      g.strokeStyle = fd ? 'rgba(112,100,80,' + fa + ')' : 'rgba(255,253,246,' + fa + ')';
      g.beginPath();
      g.moveTo(x, y);
      g.quadraticCurveTo(x + Math.cos(ang) * len / 2 + bow, y + Math.sin(ang) * len / 2 - bow,
        x + Math.cos(ang) * len, y + Math.sin(ang) * len);
      g.stroke();
    }
    // speckle
    var specN = Math.round(area * (14000 + 40000 * intensity));
    for (var p = 0; p < specN; p++) {
      g.fillStyle = rnd() < 0.5 ? 'rgba(110,98,78,0.04)' : 'rgba(255,253,246,0.05)';
      g.fillRect(rnd() * W, rnd() * H, 1.4, 1.4);
    }
    // edge-fold shading (a scanned sheet, not a flat fill) + warm vignette
    if (data.vignette !== false) {
      var eg = g.createLinearGradient(0, 0, W * 0.055, 0);
      eg.addColorStop(0, 'rgba(90,80,62,0.09)');
      eg.addColorStop(0.55, 'rgba(90,80,62,0.025)');
      eg.addColorStop(1, 'rgba(0,0,0,0)');
      g.fillStyle = eg; g.fillRect(0, 0, W * 0.055, H);
      var eg2 = g.createLinearGradient(W, 0, W - W * 0.04, 0);
      eg2.addColorStop(0, 'rgba(90,80,62,0.06)');
      eg2.addColorStop(1, 'rgba(0,0,0,0)');
      g.fillStyle = eg2; g.fillRect(W - W * 0.04, 0, W * 0.04, H);
      var vg = g.createRadialGradient(W / 2, H * 0.46, H * 0.25, W / 2, H * 0.46, H * 0.95);
      vg.addColorStop(0, 'rgba(255,255,255,' + (darkSheet ? 0 : 0.10) + ')');
      vg.addColorStop(0.6, 'rgba(0,0,0,0)');
      vg.addColorStop(1, 'rgba(112,78,40,0.07)');
      g.fillStyle = vg; g.fillRect(0, 0, W, H);
    }

    // The paper holds still -- stillness is the world's voice ("settle,
    // never bounce"). A single zero-motion tween keeps the timeline shaped
    // like every other backdrop's.
    tl.set({}, {}, ctx.duration || 5);
    return tl;
  }
</script>
