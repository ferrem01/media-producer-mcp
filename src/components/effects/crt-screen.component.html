<template>
  <div class="crt-root">
    <div class="crt-stage">
      <div class="crt-tube">
        <div class="crt-glass">
          <div class="crt-content"><div class="crt-img"></div><div class="crt-text"></div></div>
          <div class="crt-mask"></div>
          <div class="crt-lines"></div>
          <div class="crt-roll"></div>
          <div class="crt-vig"></div>
          <div class="crt-flash"></div>
        </div>
      </div>
      <svg class="crt-defs" width="0" height="0" aria-hidden="true">
        <filter class="crt-barrel" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
          <feImage class="crt-map" result="map" preserveAspectRatio="none" x="0" y="0" width="100%" height="100%"/>
          <feDisplacementMap in="SourceGraphic" in2="map" scale="220" xChannelSelector="R" yChannelSelector="G"/>
        </filter>
      </svg>
    </div>
  </div>
</template>

<style scoped>
  /* An old CRT television: the curved glass (a real barrel bulge, an SVG
     displacement map computed once), the phosphor triad and scanlines, a
     rolling bright band, bloom, a power-on that springs open from a line and
     a power-off that collapses to a dot. Shows a word or an image. Designed
     at 1920x1080, scaled to fit its box. */
  .crt-root, .crt-root * { max-width: none; }
  .crt-root { position: absolute; inset: 0; overflow: hidden; background: #0b0b0d; }
  .crt-stage { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; transform-origin: 0 0; }
  .crt-tube { position: absolute; left: 230px; top: 110px; width: 1460px; height: 860px; border-radius: 120px / 90px;
    background: #050506; box-shadow: 0 0 0 26px #141416, 0 0 0 30px #2a2a2e, 0 40px 90px rgba(0,0,0,0.6); overflow: hidden; }
  .crt-glass { position: absolute; inset: 0; border-radius: inherit; overflow: hidden; background: #0e1012; }
  .crt-content { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; }
  .crt-img { position: absolute; inset: 60px 120px; background-size: contain; background-position: center; background-repeat: no-repeat; }
  .crt-text { position: relative; font-family: var(--mp-font-family, Inter), Inter, sans-serif; font-weight: 800; letter-spacing: -0.04em;
    line-height: 1; white-space: nowrap; }
  .crt-mask { position: absolute; inset: 0; pointer-events: none; mix-blend-mode: multiply; opacity: 0.55;
    background: repeating-linear-gradient(90deg, rgba(255,60,60,0.9) 0 2px, rgba(60,255,90,0.9) 2px 4px, rgba(70,110,255,0.9) 4px 6px); }
  .crt-lines { position: absolute; inset: 0; pointer-events: none; opacity: 0.6;
    background: repeating-linear-gradient(0deg, rgba(0,0,0,0.55) 0 2px, rgba(0,0,0,0) 2px 5px); }
  .crt-roll { position: absolute; left: 0; right: 0; top: 0; height: 220px; pointer-events: none;
    background: linear-gradient(180deg, rgba(255,255,255,0), rgba(255,255,255,0.07), rgba(255,255,255,0)); }
  .crt-vig { position: absolute; inset: 0; pointer-events: none; border-radius: inherit;
    background: radial-gradient(120% 110% at 50% 50%, rgba(0,0,0,0) 55%, rgba(0,0,0,0.75) 100%); box-shadow: inset 0 0 120px rgba(0,0,0,0.8); }
  .crt-flash { position: absolute; inset: 0; background: #fff; opacity: 0; pointer-events: none; }
  .crt-defs { position: absolute; }
</style>

<script>
  function createTimeline(el, data, ctx) {
    var tl = gsap.timeline();
    data = data || {};
    var DUR = (ctx && ctx.duration) || 4;
    var num = function (v, d) { var n = Number(v); return (v === null || v === undefined || v === '' || !isFinite(n)) ? d : n; };
    var stage = el.querySelector('.crt-stage'), glass = el.querySelector('.crt-glass'), content = el.querySelector('.crt-content');
    var textEl = el.querySelector('.crt-text'), imgEl = el.querySelector('.crt-img');
    var roll = el.querySelector('.crt-roll'), flash = el.querySelector('.crt-flash');

    // ---- Phosphor: white, green or amber (or any color) ----
    var PH = { white: '#f4f6ff', green: '#6dff9a', amber: '#ffbd4a' };
    var color = PH[data.phosphor] || data.color || PH.white;
    if (data.background) el.querySelector('.crt-root').style.background = data.background;
    if (data.image) imgEl.style.backgroundImage = 'url("' + String(data.image).replace(/"/g, '%22') + '")';
    if (data.text) {
      textEl.textContent = data.text;
      var size = num(data.size, 0.42) * 860;
      textEl.style.fontSize = size + 'px';
      textEl.style.color = color;
      textEl.style.textShadow = '0 0 18px ' + color + ', 0 0 60px ' + color;
    }
    if (data.image) imgEl.style.filter = 'drop-shadow(0 0 20px ' + color + '66)';

    // ---- The curved glass: a barrel displacement map (R = x push, G = y
    // push, 128 = none), drawn once, fed to the filter ----
    var uid = 'crt' + Math.round(num(data.seed, 1) * 997) + (el.getAttribute('data-cid') || Math.floor(el.getBoundingClientRect().left));
    var filt = el.querySelector('.crt-barrel');
    filt.setAttribute('id', uid);
    try {
      var N = 128, cv = document.createElement('canvas'); cv.width = N; cv.height = N;
      var cx = cv.getContext('2d'), img = cx.createImageData(N, N);
      var k = num(data.curve, 0.55);
      for (var y = 0; y < N; y++) for (var x = 0; x < N; x++) {
        var nx = (x / (N - 1)) * 2 - 1, ny = (y / (N - 1)) * 2 - 1;
        var r2 = nx * nx + ny * ny;
        var dx = -nx * r2 * k * 0.5, dy = -ny * r2 * k * 0.5;
        var o = (y * N + x) * 4;
        img.data[o] = Math.max(0, Math.min(255, 128 + dx * 127));
        img.data[o + 1] = Math.max(0, Math.min(255, 128 + dy * 127));
        img.data[o + 2] = 128; img.data[o + 3] = 255;
      }
      cx.putImageData(img, 0, 0);
      el.querySelector('.crt-map').setAttribute('href', cv.toDataURL('image/png'));
      content.style.filter = 'url(#' + uid + ')';
    } catch (e) { /* no canvas: flat glass */ }

    // ---- Scale to FIT the box: the set is an object, its bezel never
    // cropped (measured: covering a tall box cut the tube's sides) ----
    var fit = function () {
      var w = el.clientWidth || 1920, h = el.clientHeight || 1080;
      var s = Math.min(w / 1920, h / 1080) * 1.12;
      stage.style.transform = 'translate(' + ((w - 1920 * s) / 2) + 'px,' + ((h - 1080 * s) / 2) + 'px) scale(' + s + ')';
    };
    fit();
    if (typeof ResizeObserver !== 'undefined') new ResizeObserver(fit).observe(el);

    // ---- Power on: a bright line springs open to the full picture ----
    var onAt = num(data.power_on_at, 0.1);
    if (data.power_on !== false) {
      gsap.set(glass, { scaleY: 0.004, scaleX: 0.7, filter: 'brightness(3)' });
      gsap.set(content, { autoAlpha: 0 });
      tl.to(glass, { scaleX: 1, duration: 0.12, ease: 'power2.out' }, onAt);
      tl.to(glass, { scaleY: 1, duration: 0.28, ease: 'back.out(1.6)' }, onAt + 0.1);
      tl.to(glass, { filter: 'brightness(1)', duration: 0.5, ease: 'power2.out' }, onAt + 0.2);
      tl.to(content, { autoAlpha: 1, duration: 0.15 }, onAt + 0.22);
      tl.fromTo(flash, { opacity: 0.8 }, { opacity: 0, duration: 0.4, immediateRender: false }, onAt + 0.1);
    }

    // ---- Alive: the rolling band, a faint flicker, timed glitches ----
    tl.fromTo(roll, { y: -240 }, { y: 1100, duration: 2.6, ease: 'none', repeat: Math.max(0, Math.ceil(DUR / 2.6)), immediateRender: false }, 0);
    var fl = [];
    for (var t = 0.35; t < DUR; t += 0.23) fl.push({ opacity: (Math.round(t * 100) % 3 === 0) ? 0.9 : 1, duration: 0.23, ease: 'none' });
    if (fl.length) tl.to(content, { keyframes: fl }, onAt + 0.4);
    (Array.isArray(data.glitches) ? data.glitches : []).forEach(function (g) {
      var at = num(typeof g === 'object' ? g.at : g, -1); if (at < 0 || at >= DUR) return;
      tl.to(content, { keyframes: [
        { x: -38, skewX: -6, duration: 0.04 }, { x: 26, skewX: 4, duration: 0.04 },
        { x: -12, skewX: 0, duration: 0.04 }, { x: 0, duration: 0.05 }
      ] }, at);
      tl.fromTo(flash, { opacity: 0.18 }, { opacity: 0, duration: 0.15, immediateRender: false }, at);
    });

    // ---- Power off: collapse to a line, then to a dot, then dark ----
    if (data.power_off_at !== undefined && data.power_off_at !== null && data.power_off_at !== '') {
      var off = num(data.power_off_at, DUR - 0.6);
      tl.to(glass, { scaleY: 0.004, filter: 'brightness(3)', duration: 0.16, ease: 'power3.in' }, off);
      tl.to(glass, { scaleX: 0.004, duration: 0.14, ease: 'power3.in' }, off + 0.16);
      tl.to(glass, { autoAlpha: 0, duration: 0.2 }, off + 0.32);
    }
    return tl;
  }
</script>
