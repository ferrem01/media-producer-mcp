<template>
  <div class="spotlight-effect">
    <div class="spotlight-overlay"></div>
  </div>
</template>

<style scoped>
  .spotlight-effect {
    width: 100%;
    height: 100%;
    position: relative;
  }

  .spotlight-overlay {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
  }
</style>

<script>
  function createTimeline(el, data, ctx) {
    var tl = gsap.timeline();
    var overlay = el.querySelector('.spotlight-overlay');

    var x = data.x || 50;
    var y = data.y || 50;
    var radius = data.radius || 20;
    var color = data.color || 'rgba(255,255,255,0.15)';

    function setSpotlight(cx, cy, r) {
      overlay.style.background = 'radial-gradient(circle at ' + cx + '% ' + cy + '%, ' +
        'transparent ' + r + '%, rgba(0,0,0,0.7) ' + (r + 15) + '%)';
    }

    // Start with dark overlay
    overlay.style.background = 'rgba(0,0,0,0.7)';

    // Animate spotlight appearing
    var state = { cx: x, cy: y, r: 0 };

    tl.to(state, {
      r: radius,
      duration: 0.8,
      ease: 'power2.out',
      onUpdate: function() {
        setSpotlight(state.cx, state.cy, state.r);
      }
    }, 0.3);

    // Hold, then optionally close
    if (ctx.duration > 3) {
      tl.to(state, {
        r: 0,
        duration: 0.5,
        ease: 'power2.in',
        onUpdate: function() {
          setSpotlight(state.cx, state.cy, state.r);
        }
      }, ctx.duration - 0.6);
    }

    return tl;
  }
</script>
