<template>
  <div class="particle-field">
    <svg class="particle-canvas" viewBox="0 0 1920 1080" preserveAspectRatio="none">
    </svg>
  </div>
</template>

<style scoped>
  .particle-field {
    width: 100%;
    height: 100%;
    pointer-events: none;
  }

  .particle-canvas {
    width: 100%;
    height: 100%;
  }

  .particle-dot {
    fill: currentColor;
    opacity: 0.4;
  }

  .particle-line {
    stroke: currentColor;
    stroke-width: 0.5;
    opacity: 0.15;
  }
</style>

<script>
  function createTimeline(el, data, ctx) {
    var tl = gsap.timeline();
    var svg = el.querySelector('.particle-canvas');
    var count = data.count || 30;
    var color = data.color || 'rgba(255,255,255,0.4)';
    var speed = data.speed || 1;
    var connected = data.connected !== undefined ? data.connected : false;
    var w = ctx.canvas.width;
    var h = ctx.canvas.height;

    svg.setAttribute('viewBox', '0 0 ' + w + ' ' + h);
    svg.style.color = color;

    // Create particles
    var particles = [];
    for (var i = 0; i < count; i++) {
      var cx = Math.random() * w;
      var cy = Math.random() * h;
      var r = 1.5 + Math.random() * 2.5;
      var circle = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
      circle.setAttribute('cx', cx);
      circle.setAttribute('cy', cy);
      circle.setAttribute('r', r);
      circle.setAttribute('class', 'particle-dot');
      svg.appendChild(circle);
      particles.push({ el: circle, x: cx, y: cy });
    }

    // Optional connecting lines
    if (connected && count <= 60) {
      var threshold = Math.min(w, h) * 0.15;
      for (var a = 0; a < particles.length; a++) {
        for (var b = a + 1; b < particles.length; b++) {
          var dx = particles[a].x - particles[b].x;
          var dy = particles[a].y - particles[b].y;
          var dist = Math.sqrt(dx * dx + dy * dy);
          if (dist < threshold) {
            var line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
            line.setAttribute('x1', particles[a].x);
            line.setAttribute('y1', particles[a].y);
            line.setAttribute('x2', particles[b].x);
            line.setAttribute('y2', particles[b].y);
            line.setAttribute('class', 'particle-line');
            line.style.opacity = String(0.15 * (1 - dist / threshold));
            svg.insertBefore(line, svg.firstChild);
          }
        }
      }
    }

    // Animate each particle with slow random drift
    for (var j = 0; j < particles.length; j++) {
      var p = particles[j];
      var driftX = (Math.random() - 0.5) * 80 * speed;
      var driftY = (Math.random() - 0.5) * 60 * speed;
      var dur = (3 + Math.random() * 4) / speed;
      tl.to(p.el, {
        attr: { cx: '+=' + driftX, cy: '+=' + driftY },
        duration: dur,
        ease: 'sine.inOut',
        yoyo: true,
        repeat: -1
      }, Math.random() * 2);
    }

    return tl;
  }
</script>
