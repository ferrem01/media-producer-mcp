<template>
  <div class="vfx-text-cursor">
    <div class="vtc-line">
      <span class="vtc-selection"></span>
      <span class="vtc-text"></span><span class="vtc-caret"></span>
    </div>
  </div>
</template>

<style scoped>
  .vfx-text-cursor {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .vtc-line {
    position: relative;
    font-family: var(--mp-font-heading, 'Inter', monospace);
    font-weight: 700;
    font-size: 8vw;
    line-height: 1.1;
    letter-spacing: 0.01em;
    white-space: nowrap;
    color: var(--mp-color-text, #ffffff);
  }

  .vtc-text {
    position: relative;
    z-index: 2;
  }

  .vtc-selection {
    position: absolute;
    top: -0.06em;
    left: 0;
    height: 1.12em;
    width: 0;
    z-index: 1;
    background: var(--mp-color-primary, #6366f1);
    opacity: 0.35;
    border-radius: 2px;
    pointer-events: none;
    will-change: width, opacity;
  }

  .vtc-caret {
    display: inline-block;
    width: 0.06em;
    height: 1em;
    margin-left: 0.04em;
    vertical-align: text-bottom;
    background: var(--mp-color-glow, #ffffff);
    box-shadow: 0 0 12px var(--mp-color-primary, #6366f1),
                0 0 24px var(--mp-color-primary, #6366f1);
    will-change: opacity, transform;
  }
</style>

<script>
  function createTimeline(el, data, ctx) {
    var tl = gsap.timeline();
    var textEl = el.querySelector('.vtc-text');
    var caret = el.querySelector('.vtc-caret');
    var sel = el.querySelector('.vtc-selection');
    if (!textEl) return tl;

    var full = (typeof data.text === 'string' && data.text) ? data.text : 'render';

    // Build per-character spans so we can type and select them.
    var chars = full.split('');
    var charEls = [];
    textEl.textContent = '';
    chars.forEach(function (ch) {
      var span = document.createElement('span');
      span.textContent = ch === ' ' ? ' ' : ch;
      span.style.opacity = '1';
      textEl.appendChild(span);
      charEls.push(span);
    });

    // Fit-to-width: shrink the line's font-size until the full typed string
    // (plus caret) fits ~90% of the canvas width, so it never clips the edges.
    var line = el.querySelector('.vtc-line');
    if (line) {
      var stage = el.querySelector('.vfx-text-cursor') || el;
      var maxW = (stage.clientWidth || (ctx && ctx.width) || 1920) * 0.9;
      var fit = 0;
      while (line.scrollWidth > maxW && fit < 60) {
        var cur = parseFloat(getComputedStyle(line).fontSize) || 150;
        var next = cur * 0.92;
        if (next < 20) { line.style.fontSize = '20px'; break; }
        line.style.fontSize = next + 'px';
        fit++;
      }
    }

    // Initial visible state = full text shown (final state). Animate FROM hidden.
    // Hidden chars collapse (display:none) so the typed prefix stays CENTERED
    // in the flex container and never appears anchored/clipped at an edge.
    gsap.set(charEls, { opacity: 0, display: 'none' });
    if (sel) gsap.set(sel, { width: 0, opacity: 0 });

    // Blinking caret loop (independent of typing).
    if (caret) {
      tl.to(caret, {
        opacity: 0,
        duration: 0.5,
        ease: 'steps(1)',
        yoyo: true,
        repeat: -1
      }, 0);
    }

    // Type each character in: collapse -> inline + fade so the line keeps
    // re-centering on its visible content as it grows.
    var t = 0.4;
    var perChar = 0.09;
    charEls.forEach(function (span, i) {
      tl.set(span, { display: 'inline', opacity: 1 }, t + i * perChar);
    });
    var doneTyping = t + charEls.length * perChar + 0.3;

    // After typing, sweep a selection highlight across the whole word.
    if (sel) {
      tl.to(sel, { opacity: 0.35, duration: 0.01 }, doneTyping);
      tl.fromTo(sel,
        { width: 0 },
        { width: textEl.offsetWidth || '100%', duration: 0.45, ease: 'power2.out' }, doneTyping);
      // Pulse the selection glow.
      tl.to(sel, {
        opacity: 0.18,
        duration: 0.7,
        ease: 'sine.inOut',
        yoyo: true,
        repeat: -1
      }, doneTyping + 0.5);
    }

    // Caret subtle settle nudge at the end of typing.
    if (caret) {
      tl.fromTo(caret,
        { scaleY: 1.4 },
        { scaleY: 1, duration: 0.3, ease: 'power2.out', transformOrigin: '50% 100%' }, doneTyping);
    }

    return tl;
  }
</script>
