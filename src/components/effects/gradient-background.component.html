<template>
  <div class="gradient-bg">
    <svg class="noise-overlay" width="100%" height="100%">
      <filter id="noiseFilter">
        <feTurbulence type="fractalNoise" baseFrequency="0.65" numOctaves="3" stitchTiles="stitch"/>
        <feColorMatrix type="saturate" values="0"/>
      </filter>
      <rect width="100%" height="100%" filter="url(#noiseFilter)" opacity="0.04"/>
    </svg>
  </div>
</template>

<style scoped>
  .gradient-bg {
    width: 100%;
    height: 100%;
    position: relative;
  }

  .noise-overlay {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: 1;
    pointer-events: none;
    mix-blend-mode: overlay;
    opacity: 0.04;
  }
</style>

<script>
  function createTimeline(el, data, ctx) {
    var tl = gsap.timeline();
    var bg = el.querySelector('.gradient-bg');

    var from = data.from || var_value('--mp-color-background') || '#0f172a';
    var to = data.to || var_value('--mp-color-surface') || '#1e293b';
    var angle = data.angle || 165;

    bg.style.background = 'linear-gradient(' + angle + 'deg, ' + from + ' 0%, ' + to + ' 100%)';

    // Subtle shift animation
    if (ctx.duration > 2) {
      tl.fromTo(bg, {
        backgroundPosition: '0% 0%'
      }, {
        backgroundPosition: '100% 100%',
        duration: ctx.duration,
        ease: 'none'
      }, 0);
    }

    return tl;

    function var_value(name) {
      return getComputedStyle(document.documentElement).getPropertyValue(name).trim();
    }
  }
</script>
