<template>
  <div class="mesh-gradient">
    <svg class="noise-overlay" width="100%" height="100%">
      <filter id="noiseFilter">
        <feTurbulence type="fractalNoise" baseFrequency="0.65" numOctaves="3" stitchTiles="stitch"/>
        <feColorMatrix type="saturate" values="0"/>
      </filter>
      <rect width="100%" height="100%" filter="url(#noiseFilter)" opacity="0.04"/>
    </svg>
  </div>
</template>

<style scoped>
  .mesh-gradient {
    width: 100%;
    height: 100%;
    position: relative;
    overflow: hidden;
    background: var(--mp-color-background, #09090b);
  }

  .noise-overlay {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: 1;
    pointer-events: none;
  }

  .mesh-blob {
    position: absolute;
    border-radius: 50%;
    pointer-events: none;
  }
</style>

<script>
  function createTimeline(el, data, ctx) {
    var tl = gsap.timeline();
    var container = el.querySelector('.mesh-gradient');
    var speed = data.speed || 1;

    var colors = data.colors || [
      'var(--mp-color-primary, #6366f1)',
      'var(--mp-color-secondary, #22d3ee)',
      'var(--mp-color-accent, #a78bfa)',
      '#f472b6'
    ];

    // Create 4 large, heavily blurred blobs for organic mesh feel
    var blobConfigs = [
      { x: '5%',  y: '5%',  size: '70%', blur: 100 },
      { x: '45%', y: '50%', size: '65%', blur: 110 },
      { x: '50%', y: '-5%', size: '60%', blur: 90  },
      { x: '10%', y: '55%', size: '58%', blur: 120 }
    ];

    blobConfigs.forEach(function(cfg, i) {
      if (i >= colors.length) return;
      var blob = document.createElement('div');
      blob.className = 'mesh-blob';
      blob.style.background = 'radial-gradient(circle, ' + colors[i % colors.length] + ' 0%, transparent 70%)';
      blob.style.width = cfg.size;
      blob.style.height = cfg.size;
      blob.style.left = cfg.x;
      blob.style.top = cfg.y;
      blob.style.opacity = '0.45';
      blob.style.filter = 'blur(' + cfg.blur + 'px)';
      container.appendChild(blob);
    });

    var blobs = container.querySelectorAll('.mesh-blob');

    var blobEase = 'sine.inOut';

    // Animate blobs with slow organic drift
    blobs.forEach(function(blob, i) {
      var xShift = (i % 2 === 0 ? 1 : -1) * (60 + i * 20);
      var yShift = (i % 2 === 0 ? -1 : 1) * (40 + i * 15);
      var cycleDur = (8 + i * 1.5) / speed;

      // Clamp to scene duration if needed
      var dur = Math.min(cycleDur, ctx.duration * 0.9);

      tl.to(blob, {
        x: xShift,
        y: yShift,
        scale: 1.06 + i * 0.04,
        duration: dur,
        ease: blobEase,
        yoyo: true,
        repeat: -1
      }, i * 0.5);

      // Cross-fade opacity for more organic feel
      tl.to(blob, {
        opacity: 0.3 + (i % 2) * 0.2,
        duration: dur * 0.7,
        ease: 'sine.inOut',
        yoyo: true,
        repeat: -1
      }, i * 0.3);
    });

    return tl;
  }
</script>
