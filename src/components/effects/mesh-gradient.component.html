<template>
  <div class="mesh-gradient">
    <svg class="noise-overlay" width="100%" height="100%">
      <filter id="noiseFilter">
        <feTurbulence type="fractalNoise" baseFrequency="0.65" numOctaves="3" stitchTiles="stitch"/>
        <feColorMatrix type="saturate" values="0"/>
      </filter>
      <rect width="100%" height="100%" filter="url(#noiseFilter)" opacity="0.03"/>
    </svg>
  </div>
</template>

<style scoped>
  .mesh-gradient {
    width: 100%;
    height: 100%;
    position: relative;
    overflow: hidden;
  }

  .noise-overlay {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: 1;
    pointer-events: none;
  }

  .mesh-blob {
    position: absolute;
    border-radius: 50%;
    filter: blur(100px);
    opacity: 0.4;
  }
</style>

<script>
  function createTimeline(el, data, ctx) {
    var tl = gsap.timeline();
    var container = el.querySelector('.mesh-gradient');
    var speed = data.speed || 1;

    var colors = data.colors || [
      'var(--mp-color-primary, #6366f1)',
      'var(--mp-color-secondary, #22d3ee)',
      'var(--mp-color-accent, #a78bfa)',
      '#f472b6',
      '#34d399'
    ];

    var bg = 'var(--mp-color-background, #09090b)';
    container.style.background = bg;

    // Create 5 overlapping blobs at different quadrants
    var blobConfigs = [
      { x: '5%', y: '10%', size: '65%' },
      { x: '50%', y: '55%', size: '60%' },
      { x: '55%', y: '5%', size: '55%' },
      { x: '15%', y: '60%', size: '50%' },
      { x: '35%', y: '30%', size: '70%' }
    ];

    blobConfigs.forEach(function(cfg, i) {
      if (i >= colors.length) return;
      var blob = document.createElement('div');
      blob.className = 'mesh-blob';
      blob.style.background = colors[i % colors.length];
      blob.style.width = cfg.size;
      blob.style.height = cfg.size;
      blob.style.left = cfg.x;
      blob.style.top = cfg.y;
      container.appendChild(blob);
    });

    var blobs = container.querySelectorAll('.mesh-blob');

    // Animate blobs with very slow drift (20s+ cycle)
    blobs.forEach(function(blob, i) {
      var xShift = (i % 2 === 0 ? 1 : -1) * (60 + i * 15);
      var yShift = (i % 2 === 0 ? -1 : 1) * (40 + i * 12);
      var dur = Math.max(20, (ctx.duration * 0.9) / speed);

      tl.to(blob, {
        x: xShift,
        y: yShift,
        scale: 1.05 + i * 0.03,
        duration: dur,
        ease: 'sine.inOut',
        yoyo: true,
        repeat: -1
      }, i * 0.5);
    });

    return tl;
  }
</script>
