<template>
  <div class="mesh-gradient">
    <svg class="noise-overlay" width="100%" height="100%">
      <filter id="noiseFilter">
        <feTurbulence type="fractalNoise" baseFrequency="0.65" numOctaves="3" stitchTiles="stitch"/>
        <feColorMatrix type="saturate" values="0"/>
      </filter>
      <rect width="100%" height="100%" filter="url(#noiseFilter)" opacity="0.04"/>
    </svg>
  </div>
</template>

<style scoped>
  .mesh-gradient {
    width: 100%;
    height: 100%;
    position: relative;
    overflow: hidden;
    background: var(--mp-color-background, #09090b);
  }
  .mesh-gradient.mesh-light {
    /* The light world (SPEC-world.md): airy editorial base, not brand-dark. */
    background: #fafaf8;
  }

  .noise-overlay {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: 1;
    pointer-events: none;
  }

  .mesh-blob {
    position: absolute;
    border-radius: 50%;
    pointer-events: none;
  }
</style>

<script>
  function createTimeline(el, data, ctx) {
    var tl = gsap.timeline();
    var container = el.querySelector('.mesh-gradient');
    var speed = data.speed || 1;
    var light = data.theme === 'light';
    if (light) container.classList.add('mesh-light');

    var colors = data.colors || [
      'var(--mp-color-primary, #6366f1)',
      'var(--mp-color-secondary, #22d3ee)',
      'var(--mp-color-accent, #a78bfa)',
      '#f472b6'
    ];

    // Seeded layout: the WORLD's seed decides where the blobs live, so the
    // same film always lands in the same world (and different films differ).
    var seed = Number(data.seed) || 7;
    function rnd() { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; }

    var blobCount = 4;
    var blobs = [];
    for (var i = 0; i < blobCount; i++) {
      var blob = document.createElement('div');
      blob.className = 'mesh-blob';
      var col = colors[i % colors.length];
      blob.style.background = 'radial-gradient(circle, ' + col + ' 0%, transparent 70%)';
      var size = 52 + rnd() * 26; // % of frame
      blob.style.width = size + '%';
      blob.style.height = size + '%';
      var bx = -10 + rnd() * 70;
      var by = -12 + rnd() * 72;
      blob.style.left = bx + '%';
      blob.style.top = by + '%';
      // Light world: soft pastel wash (low opacity over near-white).
      // Dark world: the richer glow the brand-dark films always had.
      blob.style.opacity = light ? String(0.16 + rnd() * 0.1) : String(0.38 + rnd() * 0.14);
      blob.style.filter = 'blur(' + Math.round(90 + rnd() * 40) + 'px)';
      container.appendChild(blob);
      blobs.push({
        el: blob,
        baseOpacity: parseFloat(blob.style.opacity),
        // Per-blob drift parameters (seeded, film-stable)
        ax: 40 + rnd() * 60, ay: 30 + rnd() * 45,
        fx: 0.05 + rnd() * 0.05, fy: 0.04 + rnd() * 0.05,
        px: rnd() * Math.PI * 2, py: rnd() * Math.PI * 2,
        fs: 0.03 + rnd() * 0.03, ps: rnd() * Math.PI * 2,
      });
    }

    // CONTINUOUS drift: blob state is a pure function of FILM time
    // (data.time_offset + local t), so the world's motion survives scene
    // cuts -- and frame capture / preview seeks land on identical frames.
    var offset = Number(data.time_offset) || 0;
    var st = { t: 0 };
    function applyState(t) {
      var ft = offset + t * (ctx.duration || 10);
      for (var i = 0; i < blobs.length; i++) {
        var b = blobs[i];
        var x = Math.sin(ft * b.fx * speed * Math.PI * 2 + b.px) * b.ax;
        var y = Math.cos(ft * b.fy * speed * Math.PI * 2 + b.py) * b.ay;
        var s = 1 + Math.sin(ft * b.fs * speed * Math.PI * 2 + b.ps) * 0.06;
        b.el.style.transform = 'translate(' + x.toFixed(1) + 'px,' + y.toFixed(1) + 'px) scale(' + s.toFixed(3) + ')';
        b.el.style.opacity = String(b.baseOpacity * (0.85 + 0.15 * Math.sin(ft * 0.11 + i * 1.7)));
      }
    }
    tl.to(st, { t: 1, duration: ctx.duration || 10, ease: 'none', onUpdate: function () { applyState(st.t); } }, 0);
    applyState(0);

    return tl;
  }
</script>
