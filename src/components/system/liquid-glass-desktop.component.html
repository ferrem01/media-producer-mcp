<script>
  function createTimeline(el, data, ctx) {
    var tl = gsap.timeline();
    data = data || {};

    var menubar = el.querySelector('.lgd-menubar');
    var boldEl = el.querySelector('.lgd-menu-bold');
    var clockEl = el.querySelector('.lgd-clock');
    var win = el.querySelector('.lgd-window');
    var sheen = el.querySelector('.lgd-window-sheen');
    var winTitle = el.querySelector('.lgd-window-title');
    var sidebar = el.querySelector('.lgd-window-sidebar');
    var content = el.querySelector('.lgd-window-content');
    var dock = el.querySelector('.lgd-dock');
    var blob1 = el.querySelector('.lgd-blob-1');
    var blob2 = el.querySelector('.lgd-blob-2');
    var blob3 = el.querySelector('.lgd-blob-3');

    if (boldEl) boldEl.textContent = data.appName || 'Finder';
    if (clockEl) clockEl.textContent = data.time || 'Mon 9:41 AM';
    if (winTitle) winTitle.textContent = data.windowTitle || 'Documents';

    // Sidebar items
    if (sidebar) {
      var sideItems = data.sidebar || [
        { icon: '🏠', label: 'Home' },
        { icon: '📁', label: 'Documents', active: true },
        { icon: '⬇️', label: 'Downloads' },
        { icon: '🖼️', label: 'Pictures' },
        { icon: '⭐', label: 'Favorites' }
      ];
      for (var s = 0; s < sideItems.length; s++) {
        var si = document.createElement('div');
        si.className = 'lgd-side-item' + (sideItems[s].active ? ' active' : '');
        si.innerHTML = '<span>' + (sideItems[s].icon || '•') + '</span><span>' + (sideItems[s].label || '') + '</span>';
        sidebar.appendChild(si);
      }
    }

    // Content placeholder rows + cards
    var contentEls = [];
    if (content) {
      var card1 = document.createElement('div'); card1.className = 'lgd-content-card'; content.appendChild(card1); contentEls.push(card1);
      for (var r = 0; r < 4; r++) {
        var row = document.createElement('div');
        row.className = 'lgd-content-row';
        row.style.width = (90 - r * 12) + '%';
        content.appendChild(row);
        contentEls.push(row);
      }
      var card2 = document.createElement('div'); card2.className = 'lgd-content-card'; content.appendChild(card2); contentEls.push(card2);
    }

    // Dock
    var dockEls = [];
    if (dock) {
      var dockApps = (data.dock && data.dock.length) ? data.dock : [
        { icon: '🧭' }, { icon: '✉️' }, { icon: '📅' }, { icon: '🎵' },
        { icon: '📷' }, { icon: '⚙️' }, { icon: '🗑️' }
      ];
      for (var d = 0; d < dockApps.length; d++) {
        var di = document.createElement('div');
        di.className = 'lgd-dock-icon';
        di.textContent = dockApps[d].icon || '📱';
        dock.appendChild(di);
        dockEls.push(di);
      }
    }

    var speed = ctx.motion === 'minimal' ? 0.5 : ctx.motion === 'punchy' ? 0.7 : 0.9;

    // Initial states
    if (menubar) gsap.set(menubar, { autoAlpha: 0, y: -52 });
    if (win) gsap.set(win, { autoAlpha: 0, y: 60, scale: 0.95 });
    if (sheen) gsap.set(sheen, { left: '-60%' });
    if (contentEls.length) gsap.set(contentEls, { autoAlpha: 0, x: 20 });
    if (dock) gsap.set(dock, { autoAlpha: 0, y: 80 });
    if (dockEls.length) gsap.set(dockEls, { scale: 1 });

    // Menubar slides down
    if (menubar) tl.to(menubar, { autoAlpha: 1, y: 0, duration: speed * 0.8, ease: 'power3.out' }, 0.1);

    // Window rises in
    if (win) tl.to(win, { autoAlpha: 1, y: 0, scale: 1, duration: speed, ease: 'back.out(1.2)' }, 0.3);

    // Window content reveals
    if (contentEls.length) {
      tl.to(contentEls, { autoAlpha: 1, x: 0, duration: speed * 0.6, stagger: 0.06, ease: 'power3.out' }, 0.6);
    }

    // Window sheen sweep
    if (sheen) tl.fromTo(sheen, { left: '-60%' }, { left: '180%', duration: speed * 1.6, ease: 'power2.inOut' }, 0.7);

    // Dock slides up
    if (dock) tl.to(dock, { autoAlpha: 1, y: 0, duration: speed, ease: 'back.out(1.4)' }, 0.5);

    // Dock magnify sweep — a wave of scale that travels across icons (looping)
    if (dockEls.length) {
      var magTl = gsap.timeline({ repeat: -1, repeatDelay: 1.2 });
      for (var m = 0; m < dockEls.length; m++) {
        magTl.to(dockEls[m], {
          scale: 1.5, y: -18,
          duration: 0.22,
          ease: 'power2.out'
        }, m * 0.12);
        magTl.to(dockEls[m], {
          scale: 1, y: 0,
          duration: 0.32,
          ease: 'power2.inOut'
        }, m * 0.12 + 0.22);
      }
      tl.add(magTl, 0.5 + speed + 0.5);
    }

    // Ambient drift
    if (blob1) tl.to(blob1, { x: 60, y: 50, duration: 7, ease: 'sine.inOut', yoyo: true, repeat: -1 }, 0);
    if (blob2) tl.to(blob2, { x: -60, y: -50, duration: 8, ease: 'sine.inOut', yoyo: true, repeat: -1 }, 0);
    if (blob3) tl.to(blob3, { x: -40, y: 40, scale: 1.15, duration: 9, ease: 'sine.inOut', yoyo: true, repeat: -1 }, 0);

    // Gentle window float
    if (win) tl.to(win, { y: -6, duration: 4, ease: 'sine.inOut', yoyo: true, repeat: -1 }, 0.3 + speed);

    if (ctx.duration > 2) {
      var exitAt = ctx.duration - 0.6;
      if (win) tl.to(win, { autoAlpha: 0, y: 40, scale: 0.97, duration: 0.5, ease: 'power2.in' }, exitAt);
      if (dock) tl.to(dock, { autoAlpha: 0, y: 60, duration: 0.45, ease: 'power2.in' }, exitAt);
      if (menubar) tl.to(menubar, { autoAlpha: 0, y: -40, duration: 0.45, ease: 'power2.in' }, exitAt);
    }

    return tl;
  }
</script>
