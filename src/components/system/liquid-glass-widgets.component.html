<script>
  function createTimeline(el, data, ctx) {
    var tl = gsap.timeline();
    data = data || {};

    var grid = el.querySelector('.lg-widgets-grid');
    var blob1 = el.querySelector('.lg-blob-1');
    var blob2 = el.querySelector('.lg-blob-2');
    var blob3 = el.querySelector('.lg-blob-3');

    var weather = data.weather || {};
    var calendar = data.calendar || {};
    var activity = data.activity || {};

    function makeWidget() {
      var w = document.createElement('div');
      w.className = 'lg-widget';
      var sh = document.createElement('div');
      sh.className = 'lg-widget-sheen';
      w.appendChild(sh);
      return w;
    }

    var widgetEls = [];
    var sheenEls = [];

    // Weather widget
    if (grid) {
      var wW = makeWidget();
      wW.innerHTML +=
        '<div class="lg-w-icon">' + (weather.icon || '⛅') + '</div>' +
        '<div class="lg-w-label">' + (weather.location || 'San Francisco') + '</div>' +
        '<div class="lg-w-temp">' + (weather.temp !== undefined ? weather.temp : 68) + '°</div>' +
        '<div class="lg-w-cond">' + (weather.condition || 'Partly Cloudy') + '</div>';
      grid.appendChild(wW);
      widgetEls.push(wW);
      sheenEls.push(wW.querySelector('.lg-widget-sheen'));

      // Calendar widget
      var cW = makeWidget();
      var events = calendar.events || ['Design Review', 'Lunch w/ Team', 'Ship Release'];
      var eventsHtml = '';
      for (var e = 0; e < events.length; e++) {
        eventsHtml += '<div class="lg-c-event"><span class="lg-c-dot"></span>' + events[e] + '</div>';
      }
      cW.innerHTML +=
        '<div class="lg-c-day">' + (calendar.day || 'Monday') + '</div>' +
        '<div class="lg-c-date">' + (calendar.date !== undefined ? calendar.date : 22) + '</div>' +
        eventsHtml;
      grid.appendChild(cW);
      widgetEls.push(cW);
      sheenEls.push(cW.querySelector('.lg-widget-sheen'));

      // Activity widget
      var aW = makeWidget();
      var ringWrap = document.createElement('div');
      ringWrap.className = 'lg-a-rings';
      // SVG rings
      var move = activity.move !== undefined ? activity.move : 78;
      var exercise = activity.exercise !== undefined ? activity.exercise : 60;
      var stand = activity.stand !== undefined ? activity.stand : 90;
      var ringData = [
        { r: 86, color: '#fa3c6e', pct: move },
        { r: 64, color: '#a3f73c', pct: exercise },
        { r: 42, color: '#3cd6f7', pct: stand }
      ];
      var svgNS = 'http://www.w3.org/2000/svg';
      var svg = document.createElementNS(svgNS, 'svg');
      svg.setAttribute('width', '200');
      svg.setAttribute('height', '200');
      svg.setAttribute('viewBox', '0 0 200 200');
      var arcs = [];
      for (var ri = 0; ri < ringData.length; ri++) {
        var rd = ringData[ri];
        var circ = 2 * Math.PI * rd.r;
        var bg = document.createElementNS(svgNS, 'circle');
        bg.setAttribute('cx', '100'); bg.setAttribute('cy', '100');
        bg.setAttribute('r', rd.r);
        bg.setAttribute('fill', 'none');
        bg.setAttribute('stroke', 'rgba(255,255,255,0.14)');
        bg.setAttribute('stroke-width', '16');
        svg.appendChild(bg);
        var arc = document.createElementNS(svgNS, 'circle');
        arc.setAttribute('cx', '100'); arc.setAttribute('cy', '100');
        arc.setAttribute('r', rd.r);
        arc.setAttribute('fill', 'none');
        arc.setAttribute('stroke', rd.color);
        arc.setAttribute('stroke-width', '16');
        arc.setAttribute('stroke-linecap', 'round');
        arc.setAttribute('transform', 'rotate(-90 100 100)');
        arc.setAttribute('stroke-dasharray', circ);
        arc.setAttribute('stroke-dashoffset', circ);
        arc._circ = circ;
        arc._pct = rd.pct;
        svg.appendChild(arc);
        arcs.push(arc);
      }
      ringWrap.appendChild(svg);
      aW.appendChild(ringWrap);
      var stats = document.createElement('div');
      stats.className = 'lg-a-stats';
      stats.innerHTML =
        '<div class="lg-a-stat" style="color:#fa3c6e">Move ' + move + '%</div>' +
        '<div class="lg-a-stat" style="color:#a3f73c">Exercise ' + exercise + '%</div>' +
        '<div class="lg-a-stat" style="color:#3cd6f7">Stand ' + stand + '%</div>';
      aW.appendChild(stats);
      grid.appendChild(aW);
      widgetEls.push(aW);
      sheenEls.push(aW.querySelector('.lg-widget-sheen'));

      // store arcs for animation
      grid._arcs = arcs;
    }

    var speed = ctx.motion === 'minimal' ? 0.6 : ctx.motion === 'punchy' ? 0.8 : 1.0;

    if (widgetEls.length) {
      gsap.set(widgetEls, { autoAlpha: 0, y: 60, scale: 0.9 });
    }
    for (var s = 0; s < sheenEls.length; s++) {
      if (sheenEls[s]) gsap.set(sheenEls[s], { left: '-60%' });
    }

    // Widgets assemble in with stagger
    if (widgetEls.length) {
      tl.to(widgetEls, {
        autoAlpha: 1, y: 0, scale: 1,
        duration: speed,
        stagger: 0.15,
        ease: 'back.out(1.3)'
      }, 0.3);
    }

    // Sheen sweeps per widget
    for (var sc = 0; sc < sheenEls.length; sc++) {
      if (sheenEls[sc]) {
        tl.fromTo(sheenEls[sc], { left: '-60%' }, {
          left: '170%', duration: speed * 1.2, ease: 'power2.inOut'
        }, 0.6 + sc * 0.15);
      }
    }

    // Activity rings fill
    if (grid && grid._arcs) {
      var arcsArr = grid._arcs;
      for (var ai = 0; ai < arcsArr.length; ai++) {
        (function(arc, idx) {
          var target = arc._circ * (1 - Math.min(arc._pct, 100) / 100);
          tl.to(arc, {
            attr: { 'stroke-dashoffset': target },
            duration: speed * 1.4,
            ease: 'power2.out'
          }, 0.8 + idx * 0.1);
        })(arcsArr[ai], ai);
      }
    }

    // Ambient blob drift
    if (blob1) tl.to(blob1, { x: 50, y: 40, duration: 6, ease: 'sine.inOut', yoyo: true, repeat: -1 }, 0);
    if (blob2) tl.to(blob2, { x: -50, y: -40, duration: 7, ease: 'sine.inOut', yoyo: true, repeat: -1 }, 0);
    if (blob3) tl.to(blob3, { x: -40, y: 30, scale: 1.15, duration: 8, ease: 'sine.inOut', yoyo: true, repeat: -1 }, 0);

    // Gentle ambient float on widgets
    if (widgetEls.length) {
      tl.to(widgetEls, {
        y: -8,
        duration: 2.5,
        ease: 'sine.inOut',
        stagger: { each: 0.3, yoyo: true, repeat: -1 },
        yoyo: true,
        repeat: -1
      }, 0.3 + speed + 0.4);
    }

    if (ctx.duration > 2 && widgetEls.length) {
      var exitAt = ctx.duration - 0.6;
      tl.to(widgetEls, {
        autoAlpha: 0, y: 40, scale: 0.94,
        duration: 0.5,
        stagger: 0.06,
        ease: 'power2.in'
      }, exitAt);
    }

    return tl;
  }
</script>
