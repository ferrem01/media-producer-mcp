<script>
  function createTimeline(el, data, ctx) {
    var tl = gsap.timeline();
    data = data || {};

    var media = el.querySelector('.lg-media');
    var sheen = el.querySelector('.lg-media-sheen');
    var titleEl = el.querySelector('.lg-media-title');
    var artistEl = el.querySelector('.lg-media-artist');
    var eqEl = el.querySelector('.lg-media-eq');
    var fill = el.querySelector('.lg-media-scrub-fill');
    var knob = el.querySelector('.lg-media-scrub-knob');
    var art = el.querySelector('.lg-media-art');
    var meta = el.querySelector('.lg-media-meta');
    var controls = el.querySelector('.lg-media-controls');
    var blob1 = el.querySelector('.lg-blob-1');
    var blob2 = el.querySelector('.lg-blob-2');

    if (titleEl) titleEl.textContent = data.title || 'Midnight City';
    if (artistEl) artistEl.textContent = data.artist || 'Neon Skyline';

    // Build EQ bars
    var eqBars = [];
    if (eqEl) {
      for (var i = 0; i < 7; i++) {
        var bar = document.createElement('div');
        bar.className = 'lg-media-eq-bar';
        eqEl.appendChild(bar);
        eqBars.push(bar);
      }
    }

    var speed = ctx.motion === 'minimal' ? 0.6 : ctx.motion === 'punchy' ? 0.8 : 1.0;

    if (media) gsap.set(media, { autoAlpha: 0, y: 40, scale: 0.95 });
    if (sheen) gsap.set(sheen, { left: '-60%' });
    if (art) gsap.set(art, { autoAlpha: 0, scale: 0.85 });
    if (meta) gsap.set(meta, { autoAlpha: 0, x: -20 });
    if (controls) gsap.set(controls, { autoAlpha: 0, y: 16 });
    if (fill) gsap.set(fill, { width: '8%' });
    if (knob) gsap.set(knob, { left: '8%' });

    // Panel in
    if (media) {
      tl.to(media, { autoAlpha: 1, y: 0, scale: 1, duration: speed, ease: 'back.out(1.2)' }, 0.2);
    }
    if (art) tl.to(art, { autoAlpha: 1, scale: 1, duration: speed * 0.7, ease: 'back.out(1.5)' }, 0.4);
    if (meta) tl.to(meta, { autoAlpha: 1, x: 0, duration: speed * 0.6, ease: 'power3.out' }, 0.5);
    if (controls) tl.to(controls, { autoAlpha: 1, y: 0, duration: speed * 0.6, ease: 'power3.out' }, 0.6);

    if (sheen) {
      tl.fromTo(sheen, { left: '-60%' }, { left: '170%', duration: speed * 1.4, ease: 'power2.inOut' }, 0.5);
    }

    // Scrubber advances steadily (bounded across most of the clip)
    var scrubDur = Math.max(2, (ctx.duration || 6) - 1.6);
    if (fill) tl.to(fill, { width: '88%', duration: scrubDur, ease: 'none' }, 0.7);
    if (knob) tl.to(knob, { left: '88%', duration: scrubDur, ease: 'none' }, 0.7);

    // Animated EQ bars (looping)
    if (eqBars.length) {
      var heights = ['30%', '70%', '45%', '90%', '55%', '80%', '40%'];
      for (var b = 0; b < eqBars.length; b++) {
        gsap.set(eqBars[b], { height: heights[b] });
        tl.to(eqBars[b], {
          height: (20 + Math.round(Math.random() * 70)) + '%',
          duration: 0.35 + Math.random() * 0.3,
          ease: 'sine.inOut',
          yoyo: true,
          repeat: -1
        }, 0.8 + b * 0.05);
      }
    }

    if (blob1) tl.to(blob1, { x: -50, y: 40, duration: 6.5, ease: 'sine.inOut', yoyo: true, repeat: -1 }, 0);
    if (blob2) tl.to(blob2, { x: 50, y: -40, duration: 7.5, ease: 'sine.inOut', yoyo: true, repeat: -1 }, 0);

    if (ctx.duration > 2 && media) {
      var exitAt = ctx.duration - 0.55;
      tl.to(media, { autoAlpha: 0, y: 30, scale: 0.96, duration: 0.45, ease: 'power2.in' }, exitAt);
    }

    return tl;
  }
</script>
