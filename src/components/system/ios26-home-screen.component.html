<script>
  function createTimeline(el, data, ctx) {
    var tl = gsap.timeline();
    data = data || {};

    var phone = el.querySelector('.ios-phone');
    var timeEl = el.querySelector('.ios-time');
    var widgetsEl = el.querySelector('.ios-widgets');
    var gridEl = el.querySelector('.ios-grid');
    var dockEl = el.querySelector('.ios-dock');

    // Fit-to-box: the phone is authored at 480x1000; boxes shorter than that
    // used to clip every piece of chrome off-view (certified 1:1 against the
    // bare page). Scale the wrapper, leave GSAP's transforms on .ios-phone.
    var stageEl = el.querySelector('.ios-stage');
    var fitEl = el.querySelector('.ios-fit');
    if (stageEl && fitEl) {
      var sr = stageEl.getBoundingClientRect();
      if (sr.width > 4 && sr.height > 4) {
        var fitScale = Math.min(1, sr.width / 500, sr.height / 1010);
        if (fitScale < 1) fitEl.style.transform = 'scale(' + fitScale + ')';
      }
    }

    // Emoji slot handed a word: render an OS-style monogram instead of 45px
    // of clipped text (measured in certification).
    function iconGlyph(s, fallback) {
      var str = String(s == null ? '' : s).trim();
      if (!str) return fallback;
      var glyphs = Array.from(str);
      return glyphs.length > 2 ? glyphs[0].toUpperCase() : str;
    }

    // Fit a one-line widget headline the way iOS does: shrink a few steps,
    // then ellipsize -- a full sentence in a 160px widget otherwise overflows
    // onto the app grid.
    function fitWidgetLine(node, minPx) {
      if (!node) return;
      node.style.whiteSpace = 'nowrap';
      node.style.overflow = 'hidden';
      var fs = parseFloat(getComputedStyle(node).fontSize) || 24;
      while (node.scrollWidth > node.clientWidth && fs > minPx) {
        fs -= 1;
        node.style.fontSize = fs + 'px';
      }
      var txt = node.textContent;
      while (node.scrollWidth > node.clientWidth && txt.length > 2) {
        txt = txt.slice(0, -2);
        node.textContent = txt + '…';
      }
    }

    if (timeEl) timeEl.textContent = data.time || '9:41';

    var apps = (data.apps && data.apps.length) ? data.apps : [
      { icon: '💬', label: 'Messages' }, { icon: '📷', label: 'Camera' },
      { icon: '🗺️', label: 'Maps' }, { icon: '📅', label: 'Calendar' },
      { icon: '🎵', label: 'Music' }, { icon: '📸', label: 'Photos' },
      { icon: '⚙️', label: 'Settings' }, { icon: '🌤️', label: 'Weather' },
      { icon: '📝', label: 'Notes' }, { icon: '📈', label: 'Stocks' },
      { icon: '🧭', label: 'Safari' }, { icon: '🎮', label: 'Games' }
    ];

    var dockApps = (data.dock && data.dock.length) ? data.dock : [
      { icon: '📞' }, { icon: '✉️' }, { icon: '🧭' }, { icon: '🎵' }
    ];

    // Widgets
    var widgetEls = [];
    if (widgetsEl) {
      var w1 = document.createElement('div');
      w1.className = 'ios-widget';
      w1.innerHTML = '<div class="ios-widget-title">Weather</div><div class="ios-widget-big">' +
        ((data.weather && data.weather.temp) || 68) + '°</div><div class="ios-widget-sub">' +
        ((data.weather && data.weather.condition) || 'Sunny') + '</div>';
      widgetsEl.appendChild(w1);
      widgetEls.push(w1);

      var w2 = document.createElement('div');
      w2.className = 'ios-widget';
      w2.innerHTML = '<div class="ios-widget-title">Up Next</div><div class="ios-widget-big" style="font-size:34px;margin-top:14px;">' +
        ((data.upNext && data.upNext.title) || 'Design Sync') + '</div><div class="ios-widget-sub">' +
        ((data.upNext && data.upNext.time) || '2:00 PM') + '</div>';
      widgetsEl.appendChild(w2);
      widgetEls.push(w2);
      fitWidgetLine(w2.querySelector('.ios-widget-big'), 20);
    }

    // App grid
    var iconEls = [];
    if (gridEl) {
      for (var i = 0; i < apps.length; i++) {
        var wrap = document.createElement('div');
        wrap.className = 'ios-icon-wrap';
        var ic = document.createElement('div');
        ic.className = 'ios-icon';
        ic.textContent = iconGlyph(apps[i].icon, '📱');
        wrap.appendChild(ic);
        var lb = document.createElement('div');
        lb.className = 'ios-icon-label';
        lb.textContent = apps[i].label || '';
        wrap.appendChild(lb);
        gridEl.appendChild(wrap);
        iconEls.push(ic);
      }
    }

    // Dock
    var dockEls = [];
    if (dockEl) {
      for (var d = 0; d < dockApps.length; d++) {
        var di = document.createElement('div');
        di.className = 'ios-icon';
        di.textContent = iconGlyph(dockApps[d].icon, '📱');
        dockEl.appendChild(di);
        dockEls.push(di);
      }
    }

    var speed = ctx.motion === 'minimal' ? 0.5 : ctx.motion === 'punchy' ? 0.7 : 0.9;

    // Initial states
    if (phone) gsap.set(phone, { autoAlpha: 0, scale: 0.94, y: 30 });
    if (widgetEls.length) gsap.set(widgetEls, { autoAlpha: 0, y: 30, scale: 0.9 });
    if (iconEls.length) gsap.set(iconEls, { autoAlpha: 0, scale: 0.4 });
    if (dockEl) gsap.set(dockEl, { autoAlpha: 0, y: 50 });

    // Phone fade in
    if (phone) tl.to(phone, { autoAlpha: 1, scale: 1, y: 0, duration: speed, ease: 'power3.out' }, 0.1);

    // Widgets pop
    if (widgetEls.length) {
      tl.to(widgetEls, { autoAlpha: 1, y: 0, scale: 1, duration: speed * 0.8, stagger: 0.12, ease: 'back.out(1.4)' }, 0.4);
    }

    // Icons stagger/pop in
    if (iconEls.length) {
      tl.to(iconEls, {
        autoAlpha: 1, scale: 1,
        duration: speed * 0.7,
        stagger: { each: 0.04, from: 'start' },
        ease: 'back.out(1.8)'
      }, 0.55);
    }

    // Dock slides up
    if (dockEl) tl.to(dockEl, { autoAlpha: 1, y: 0, duration: speed, ease: 'back.out(1.3)' }, 0.7);

    // Subtle parallax on the whole phone content (gentle ambient)
    if (phone) {
      tl.to(phone, { y: -10, duration: 4, ease: 'sine.inOut', yoyo: true, repeat: -1 }, 0.1 + speed);
    }
    // Icons gentle breathe
    if (iconEls.length) {
      tl.to(iconEls, {
        y: -4,
        duration: 2.4,
        ease: 'sine.inOut',
        stagger: { each: 0.05, yoyo: true, repeat: -1, grid: 'auto' },
        yoyo: true,
        repeat: -1
      }, 1.4);
    }

    if (ctx.duration > 2 && phone) {
      var exitAt = ctx.duration - 0.55;
      tl.to(phone, { autoAlpha: 0, scale: 0.96, y: 20, duration: 0.45, ease: 'power2.in' }, exitAt);
    }

    return tl;
  }
</script>
