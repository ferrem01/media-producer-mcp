<script>
  function createTimeline(el, data, ctx) {
    var tl = gsap.timeline();
    data = data || {};

    var notif = el.querySelector('.mac-notif');
    var sheen = el.querySelector('.mac-notif-sheen');
    var iconEl = el.querySelector('.mac-notif-icon');
    var titleEl = el.querySelector('.mac-notif-title');
    var subEl = el.querySelector('.mac-notif-sub');
    var actionEl = el.querySelector('.mac-notif-action');
    var blob1 = el.querySelector('.mac-blob-1');
    var blob2 = el.querySelector('.mac-blob-2');

    if (iconEl) iconEl.textContent = data.icon || '📅';
    if (titleEl) titleEl.textContent = data.title || 'Calendar';
    if (subEl) subEl.textContent = data.subtitle || 'Design Review in 10 minutes';
    if (actionEl) {
      if (data.action === '' ) actionEl.textContent = '';
      else actionEl.textContent = data.action || 'View';
    }

    var speed = ctx.motion === 'minimal' ? 0.6 : ctx.motion === 'punchy' ? 0.8 : 1.0;

    if (notif) gsap.set(notif, { autoAlpha: 0, x: 120, scale: 0.95 });
    if (sheen) gsap.set(sheen, { left: '-60%' });

    if (notif) {
      // slide in top-right with bounce
      tl.to(notif, {
        autoAlpha: 1, x: 0, scale: 1,
        duration: speed,
        ease: ctx.motion === 'minimal' ? 'power3.out' : 'back.out(1.6)'
      }, 0.3);
      // settle micro-bounce
      tl.to(notif, {
        x: -4,
        duration: 0.5,
        ease: 'sine.inOut',
        yoyo: true,
        repeat: -1
      }, 0.3 + speed);
    }

    if (sheen) {
      tl.fromTo(sheen, { left: '-60%' }, {
        left: '170%',
        duration: speed * 1.3,
        ease: 'power2.inOut'
      }, 0.3 + speed * 0.7);
    }

    if (blob1) tl.to(blob1, { x: -50, y: 40, duration: 6.5, ease: 'sine.inOut', yoyo: true, repeat: -1 }, 0);
    if (blob2) tl.to(blob2, { x: 50, y: -40, duration: 7.5, ease: 'sine.inOut', yoyo: true, repeat: -1 }, 0);

    if (ctx.duration > 2 && notif) {
      var exitAt = ctx.duration - 0.6;
      tl.to(notif, {
        autoAlpha: 0, x: 110, scale: 0.96,
        duration: 0.5,
        ease: 'power2.in'
      }, exitAt);
    }

    return tl;
  }
</script>
