<script>
  function createTimeline(el, data, ctx) {
    var tl = gsap.timeline();
    data = data || {};

    var stage = el.querySelector('.lg-notif-stage');
    var notif = el.querySelector('.lg-notif');
    var sheen = el.querySelector('.lg-notif-sheen');
    var iconEl = el.querySelector('.lg-notif-icon');
    var appEl = el.querySelector('.lg-notif-app');
    var timeEl = el.querySelector('.lg-notif-time');
    var titleEl = el.querySelector('.lg-notif-title');
    var textEl = el.querySelector('.lg-notif-text');
    var blob1 = el.querySelector('.lg-blob-1');
    var blob2 = el.querySelector('.lg-blob-2');

    if (appEl) appEl.textContent = data.app || 'Messages';
    if (timeEl) timeEl.textContent = data.time || 'now';
    if (titleEl) titleEl.textContent = data.title || 'New Message';
    if (textEl) textEl.textContent = data.body || 'You have a new notification waiting for you.';
    if (iconEl) iconEl.textContent = data.icon || '💬';

    var speed = ctx.motion === 'minimal' ? 0.6 : ctx.motion === 'punchy' ? 0.8 : 1.0;

    if (notif) gsap.set(notif, { autoAlpha: 0, y: -120, scale: 0.94 });
    if (sheen) gsap.set(sheen, { left: '-60%' });

    // Slide down + settle
    if (notif) {
      tl.to(notif, {
        autoAlpha: 1, y: 0, scale: 1,
        duration: speed * 0.9,
        ease: ctx.motion === 'punchy' ? 'back.out(1.4)' : 'back.out(1.1)'
      }, 0.3);
      // gentle settle bob
      tl.to(notif, {
        y: 6,
        duration: 0.4,
        ease: 'sine.inOut',
        yoyo: true,
        repeat: -1
      }, 0.3 + speed * 0.9);
    }

    // Specular sheen sweep
    if (sheen) {
      tl.fromTo(sheen, { left: '-60%' }, {
        left: '160%',
        duration: speed * 1.3,
        ease: 'power2.inOut'
      }, 0.3 + speed * 0.6);
    }

    // Ambient blob drift (bounded loop)
    if (blob1) {
      tl.to(blob1, { x: 60, y: 40, duration: 6, ease: 'sine.inOut', yoyo: true, repeat: -1 }, 0);
    }
    if (blob2) {
      tl.to(blob2, { x: -50, y: -30, duration: 7, ease: 'sine.inOut', yoyo: true, repeat: -1 }, 0);
    }

    // Exit
    if (ctx.duration > 2 && notif) {
      var exitAt = ctx.duration - 0.6;
      tl.to(notif, {
        autoAlpha: 0, y: -90, scale: 0.96,
        duration: 0.5,
        ease: 'power2.in'
      }, exitAt);
    }

    return tl;
  }
</script>
