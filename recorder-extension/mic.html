<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Enable microphone — Quotient Recorder</title>
    <style>
      body { font: 15px/1.6 -apple-system, "Segoe UI", sans-serif; color: #17171c; max-width: 460px; margin: 80px auto; padding: 0 20px; text-align: center; }
      h1 { font-size: 18px; }
      p { color: #6b7280; }
      button { background: #393bf5; color: #fff; border: 0; border-radius: 8px; padding: 12px 24px; font-size: 14px; font-weight: 600; cursor: pointer; margin-top: 12px; }
      #status { margin-top: 16px; font-size: 13px; min-height: 20px; }
      .ok { color: #16a34a; font-weight: 600; }
      .err { color: #dc2626; }
    </style>
  </head>
  <body>
    <h1>&#127897; Enable your microphone</h1>
    <p>Live narration records your voice while you demo. Chrome needs you to allow the mic for this extension once &mdash; click below and choose <b>Allow</b> in the prompt.</p>
    <button id="enable">Enable microphone</button>
    <div id="status"></div>
    <script src="mic.js"></script>
  </body>
</html>
