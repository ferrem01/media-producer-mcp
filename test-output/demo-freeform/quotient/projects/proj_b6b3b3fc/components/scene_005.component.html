<script>
  function createTimeline(el, data, ctx) {
    var tl = gsap.timeline();

    var cards = el.querySelectorAll('.card');
    var icons = el.querySelectorAll('.icon-container');
    var titles = el.querySelectorAll('.card-title');
    var texts = el.querySelectorAll('.card-text');

    // Determine speed from motion style
    var speed = ctx.motion === 'minimal' ? 0.4 : ctx.motion === 'punchy' ? 0.6 : 0.8;
    var staggerDelay = ctx.motion === 'minimal' ? 0.1 : ctx.motion === 'punchy' ? 0.15 : 0.2;
    var ease = ctx.motion === 'punchy' ? 'back.out(1.4)' : 'power3.out';

    // Set initial states
    gsap.set(cards, { autoAlpha: 0, y: 60, scale: 0.9 });
    gsap.set(icons, { scale: 0, rotation: -15 });
    gsap.set([titles, texts], { autoAlpha: 0, y: 20 });

    // Entrance animations
    tl.to(cards, {
      autoAlpha: 1,
      y: 0,
      scale: 1,
      duration: speed,
      ease: ease,
      stagger: staggerDelay
    }, 0.4);

    tl.to(icons, {
      scale: 1,
      rotation: 0,
      duration: speed * 0.8,
      ease: 'elastic.out(1, 0.6)',
      stagger: staggerDelay
    }, 0.6);

    tl.to(titles, {
      autoAlpha: 1,
      y: 0,
      duration: speed * 0.6,
      ease: 'power2.out',
      stagger: staggerDelay * 0.5
    }, 0.8);

    tl.to(texts, {
      autoAlpha: 1,
      y: 0,
      duration: speed * 0.6,
      ease: 'power2.out',
      stagger: staggerDelay * 0.5
    }, 1.0);

    // Add subtle floating animation during hold
    tl.to(cards, {
      y: -8,
      duration: 2,
      ease: 'power1.inOut',
      yoyo: true,
      repeat: -1,
      stagger: {
        each: 0.3,
        repeat: -1
      }
    }, 1.5);

    // Exit animations
    if (ctx.duration > 2.5) {
      var exitAt = ctx.duration - 0.8;
      tl.to(cards, {
        autoAlpha: 0,
        y: -40,
        scale: 0.95,
        duration: 0.5,
        ease: 'power2.in',
        stagger: 0.1
      }, exitAt);
    }

    return tl;
  }
</script>
