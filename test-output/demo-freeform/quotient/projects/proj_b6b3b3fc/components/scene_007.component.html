<script>
  function createTimeline(el, data, ctx) {
    var tl = gsap.timeline();
    
    var headline = el.querySelector('.headline');
    var button = el.querySelector('.cta-button');
    var buttonGlow = el.querySelector('.button-glow');
    var pattern = el.querySelector('.background-pattern');
    
    // Set initial states
    gsap.set([headline, button], { autoAlpha: 0, y: 40 });
    gsap.set(pattern, { autoAlpha: 0 });
    gsap.set(buttonGlow, { autoAlpha: 0, scale: 0.5 });
    
    // Motion adaptation
    var speed = ctx.motion === 'minimal' ? 0.4 : ctx.motion === 'punchy' ? 0.6 : 0.8;
    var ease = ctx.motion === 'punchy' ? 'back.out(1.4)' : 'power3.out';
    
    // Entrance animations
    tl.to(pattern, { autoAlpha: 1, duration: 0.8, ease: 'power2.out' }, 0.2)
      .to(headline, { autoAlpha: 1, y: 0, duration: speed, ease: ease }, 0.4)
      .to(button, { autoAlpha: 1, y: 0, duration: speed * 0.8, ease: ease }, '-=0.3');
    
    // Button glow pulse animation
    var glowTl = gsap.timeline({ repeat: -1, yoyo: true });
    glowTl.to(buttonGlow, { 
      autoAlpha: 0.6, 
      scale: 1, 
      duration: 1.2, 
      ease: 'power2.inOut' 
    });
    
    tl.add(glowTl, 1.2);
    
    // Subtle button scale pulse
    var pulseTl = gsap.timeline({ repeat: -1, yoyo: true });
    pulseTl.to(button, { 
      scale: 1.02, 
      duration: 2, 
      ease: 'power2.inOut' 
    });
    
    tl.add(pulseTl, 1.5);
    
    // Exit animation
    if (ctx.duration > 2.5) {
      var exitAt = ctx.duration - 0.8;
      tl.to([headline, button], { 
        autoAlpha: 0, 
        y: -30, 
        duration: 0.5, 
        ease: 'power2.in' 
      }, exitAt)
      .to(pattern, { autoAlpha: 0, duration: 0.3 }, exitAt + 0.2);
    }
    
    return tl;
  }
</script>
