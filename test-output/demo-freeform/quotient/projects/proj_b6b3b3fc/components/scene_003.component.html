<script>
  function createTimeline(el, data, ctx) {
    var tl = gsap.timeline();

    // Query elements
    var quotientNode = el.querySelector('.quotient-node');
    var canvaNode = el.querySelector('.canva-node');
    var flowPath = el.querySelector('.flow-path');
    var particles = el.querySelectorAll('.particle');
    var dataPoints = el.querySelectorAll('.data-point');
    var titleText = el.querySelector('.title-text');
    var subtitleText = el.querySelector('.subtitle-text');
    var logoContainers = el.querySelectorAll('.logo-container');

    // Motion settings
    var speed = ctx.motion === 'minimal' ? 0.4 : ctx.motion === 'punchy' ? 0.7 : 1.0;
    var stagger = ctx.motion === 'minimal' ? 0.05 : ctx.motion === 'punchy' ? 0.08 : 0.12;

    // Set initial states
    gsap.set([quotientNode, canvaNode, titleText, subtitleText], { autoAlpha: 0, y: 40 });
    gsap.set(flowPath, { drawSVG: '0%' });
    gsap.set(particles, { autoAlpha: 0, scale: 0 });
    gsap.set(dataPoints, { autoAlpha: 0, scale: 0, y: 20 });

    // Position particles along path
    gsap.set('.particle-1', { left: '10%', top: '45%' });
    gsap.set('.particle-2', { left: '25%', top: '25%' });
    gsap.set('.particle-3', { left: '50%', top: '45%' });
    gsap.set('.particle-4', { left: '75%', top: '75%' });
    gsap.set('.particle-5', { left: '90%', top: '45%' });

    // Position data points
    gsap.set('.dp-1', { left: '20%', top: '35%' });
    gsap.set('.dp-2', { left: '50%', top: '20%' });
    gsap.set('.dp-3', { left: '80%', top: '60%' });

    // Entrance animations
    tl.to(quotientNode, { autoAlpha: 1, y: 0, duration: speed * 0.8, ease: 'back.out(1.2)' }, 0.3)
      .to(canvaNode, { autoAlpha: 1, y: 0, duration: speed * 0.8, ease: 'back.out(1.2)' }, 0.5)
      .to(flowPath, { drawSVG: '100%', duration: speed * 1.5, ease: 'power2.inOut' }, 0.8)
      .to(particles, { 
        autoAlpha: 1, 
        scale: 1, 
        stagger: stagger * 2, 
        duration: speed * 0.6, 
        ease: 'back.out(1.4)' 
      }, 1.2)
      .to(dataPoints, { 
        autoAlpha: 1, 
        scale: 1, 
        y: 0, 
        stagger: stagger, 
        duration: speed * 0.6, 
        ease: 'back.out(1.2)' 
      }, 1.4)
      .to(titleText, { autoAlpha: 1, y: 0, duration: speed * 0.8, ease: 'power3.out' }, 1.8)
      .to(subtitleText, { autoAlpha: 1, y: 0, duration: speed * 0.6, ease: 'power3.out' }, 2.0);

    // Continuous animations during hold
    // Logo pulse animation
    var logoPulse = gsap.timeline({ repeat: -1 });
    logoPulse.to(logoContainers, { 
      scale: 1.05, 
      duration: 1.5, 
      ease: 'power2.inOut', 
      stagger: 0.3 
    })
    .to(logoContainers, { 
      scale: 1, 
      duration: 1.5, 
      ease: 'power2.inOut', 
      stagger: 0.3 
    });
    tl.add(logoPulse, 2.2);

    // Particle flow animation
    var particleFlow = gsap.timeline({ repeat: -1 });
    particleFlow.to(particles, {
      motionPath: {
        path: flowPath,
        autoRotate: false,
        alignOrigin: [0.5, 0.5]
      },
      duration: 3,
      ease: 'none',
      stagger: 0.6
    });
    tl.add(particleFlow, 2.0);

    // Data point pulse
    var dataPointPulse = gsap.timeline({ repeat: -1});
    dataPointPulse.to(dataPoints, {
      scale: 1.2,
      duration: 0.8,
      ease: 'power2.inOut',
      stagger: 0.4
    })
    .to(dataPoints, {
      scale: 1,
      duration: 0.8,
      ease: 'power2.inOut',
      stagger: 0.4
    });
    tl.add(dataPointPulse, 2.5);

    // Exit animations
    if (ctx.duration > 3) {
      var exitAt = ctx.duration - 0.8;
      tl.to([titleText, subtitleText], { 
        autoAlpha: 0, 
        y: -30, 
        duration: 0.4, 
        ease: 'power2.in' 
      }, exitAt)
      .to([quotientNode, canvaNode], { 
        autoAlpha: 0, 
        scale: 0.8, 
        duration: 0.5, 
        ease: 'power2.in',
        stagger: 0.1 
      }, exitAt + 0.1)
      .to([particles, dataPoints], { 
        autoAlpha: 0, 
        scale: 0, 
        duration: 0.3, 
        ease: 'power2.in' 
      }, exitAt + 0.2);
    }

    return tl;
  }
</script>
