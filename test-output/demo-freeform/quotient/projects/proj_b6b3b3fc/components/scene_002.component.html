<script>
  function createTimeline(el, data, ctx) {
    var tl = gsap.timeline();
    
    // Query elements
    var browserMockup = el.querySelector('.browser-mockup');
    var integrationPanel = el.querySelector('.integration-panel');
    var canvaBtn = el.querySelector('.canva-btn');
    var canvaEditor = el.querySelector('.canva-editor');
    var campaignCards = el.querySelectorAll('.campaign-card');
    var brandAssets = el.querySelectorAll('.asset-preview');
    var designElements = el.querySelectorAll('.brand-logo-placeholder, .text-element, .cta-element');
    
    // Set initial states
    gsap.set(browserMockup, { autoAlpha: 0, scale: 0.9, y: 30 });
    gsap.set(integrationPanel, { autoAlpha: 0, x: 50 });
    gsap.set(campaignCards, { autoAlpha: 0, y: 20 });
    gsap.set(brandAssets, { autoAlpha: 0, scale: 0.8 });
    gsap.set(canvaEditor, { autoAlpha: 0, scale: 0.9, y: 20 });
    gsap.set(designElements, { autoAlpha: 0, y: 20 });
    
    // Motion settings
    var speed = ctx.motion === 'minimal' ? 0.4 : ctx.motion === 'punchy' ? 0.6 : 0.8;
    var ease = ctx.motion === 'punchy' ? 'back.out(1.2)' : 'power3.out';
    
    // Entrance animations
    tl.to(browserMockup, { 
      autoAlpha: 1, 
      scale: 1, 
      y: 0, 
      duration: speed * 1.2, 
      ease: ease 
    }, 0.2);
    
    tl.to(campaignCards, { 
      autoAlpha: 1, 
      y: 0, 
      stagger: 0.1, 
      duration: speed, 
      ease: ease 
    }, 0.6);
    
    tl.to(integrationPanel, { 
      autoAlpha: 1, 
      x: 0, 
      duration: speed, 
      ease: ease 
    }, 0.8);
    
    tl.to(brandAssets, { 
      autoAlpha: 1, 
      scale: 1, 
      stagger: 0.05, 
      duration: speed * 0.8, 
      ease: ease 
    }, 1.2);
    
    // Create and animate cursor
    var cursor = createCursor(el);
    gsap.set(cursor, { autoAlpha: 0 });
    
    tl.to(cursor, { autoAlpha: 1, duration: 0.3 }, 1.8);
    
    // Move cursor to Canva button and click
    moveCursor(tl, cursor, canvaBtn, 2.0, 0.8, 'power2.out');
    clickCursor(tl, cursor, 2.8);
    
    // Button click effect
    tl.to(canvaBtn, { 
      scale: 0.95, 
      duration: 0.1, 
      ease: 'power2.out' 
    }, 2.8);
    
    tl.to(canvaBtn, { 
      scale: 1, 
      duration: 0.2, 
      ease: 'back.out(1.7)' 
    }, 2.9);
    
    // Transition to Canva editor
    tl.to(browserMockup, { 
      autoAlpha: 0, 
      scale: 0.95, 
      duration: 0.4, 
      ease: 'power2.in' 
    }, 3.2);
    
    tl.to(canvaEditor, { 
      autoAlpha: 1, 
      scale: 1, 
      y: 0, 
      duration: speed, 
      ease: ease 
    }, 3.4);
    
    // Animate design elements appearing
    tl.to(designElements, { 
      autoAlpha: 1, 
      y: 0, 
      stagger: 0.1, 
      duration: speed * 0.8, 
      ease: ease 
    }, 3.8);
    
    // Hide cursor
    hideCursor(tl, cursor, 4.2);
    
    // Exit animation
    if (ctx.duration > 4.5) {
      var exitAt = ctx.duration - 0.6;
      tl.to([canvaEditor, cursor], { 
        autoAlpha: 0, 
        duration: 0.4, 
        ease: 'power2.in' 
      }, exitAt);
    }
    
    return tl;
  }
</script>
