        <span class='word' data-word='x'>×</span>

</template>

<style scoped>

<script>
  function createTimeline(el, data, ctx) {
    var tl = gsap.timeline();
    
    // Query elements
    var words = el.querySelectorAll('.word');
    var underline = el.querySelector('.underline');
    var particlesContainer = el.querySelector('.particles-container');
    
    // Create particles
    var particles = [];
    for (var i = 0; i < 25; i++) {
      var particle = document.createElement('div');
      particle.className = 'particle';
      particle.style.left = Math.random() * 100 + '%';
      particle.style.top = Math.random() * 100 + '%';
      particle.style.opacity = Math.random() * 0.6 + 0.2;
      particlesContainer.appendChild(particle);
      particles.push(particle);
    }
    
    // Set initial states
    gsap.set(words, { autoAlpha: 0, y: 60, rotationX: -15 });
    gsap.set(underline, { width: 0, autoAlpha: 0 });
    gsap.set(particles, { y: 20 });
    
    // Motion speed adaptation
    var speed = ctx.motion === 'minimal' ? 0.4 : ctx.motion === 'punchy' ? 0.7 : 0.6;
    var staggerDelay = ctx.motion === 'minimal' ? 0.15 : ctx.motion === 'punchy' ? 0.08 : 0.12;
    var ease = ctx.motion === 'punchy' ? 'back.out(1.4)' : 'elastic.out(1, 0.3)';
    
    // Entrance animations
    tl.to(words, {
      autoAlpha: 1,
      y: 0,
      rotationX: 0,
      duration: speed * 1.2,
      ease: ease,
      stagger: staggerDelay
    }, 0.5);
    
    // Underline drawing
    tl.to(underline, {
      autoAlpha: 1,
      width: '60%',
      duration: speed * 1.5,
      ease: 'power3.out'
    }, '-=0.3');
    
    // Particle float animation
    tl.to(particles, {
      y: -100,
      duration: 3,
      ease: 'none',
      stagger: {
        each: 0.1,
        repeat: -1,
        yoyo: true
      }
    }, 0);
    
    // Subtle word emphasis
    tl.to(words[0], {
      scale: 1.05,
      duration: 0.3,
      ease: 'power2.out',
      yoyo: true,
      repeat: 1
    }, 2.0);
    
    tl.to(words[2], {
      scale: 1.05,
      duration: 0.3,
      ease: 'power2.out',
      yoyo: true,
      repeat: 1
    }, 2.3);
    
    // Exit animation
    var exitAt = ctx.duration - 0.8;
    tl.to([words, underline], {
      autoAlpha: 0,
      y: -30,
      duration: 0.5,
      ease: 'power2.in',
      stagger: 0.05
    }, exitAt);
    
    tl.to(particles, {
      autoAlpha: 0,
      duration: 0.3,
      ease: 'power2.in'
    }, exitAt);
    
    return tl;
  }
</script>
