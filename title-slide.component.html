</template>

<script>
  function createTimeline(el, data, ctx) {
    var tl = gsap.timeline();

    var badge = el.querySelector('.badge');
    var titleEl = el.querySelector('.title');
    var subtitle = el.querySelector('.subtitle');

    // Inject text content
    if (data.badge) badge.textContent = data.badge;
    if (data.title) titleEl.textContent = data.title;
    if (data.subtitle) subtitle.textContent = data.subtitle;

    // Collect visible elements
    var elements = [];
    if (badge && badge.textContent) elements.push(badge);
    if (titleEl && titleEl.textContent) elements.push(titleEl);
    if (subtitle && subtitle.textContent) elements.push(subtitle);

    // Set initial states
    gsap.set(elements, { autoAlpha: 0 });

    // Badge: gentle scale up
    if (badge && badge.textContent) {
      gsap.set(badge, { scale: 0.9, y: 15 });
    }

    // Title: dramatic reveal -- scale down from slightly large + blur
    if (titleEl && titleEl.textContent) {
      gsap.set(titleEl, { scale: 1.08, y: 20, filter: 'blur(6px)' });
    }

    // Subtitle: simple y offset
    if (subtitle && subtitle.textContent) {
      gsap.set(subtitle, { y: 20 });
    }

    // Speed based on motion style
    var speed = ctx.motion === 'minimal' ? 0.4 : ctx.motion === 'punchy' ? 0.6 : 0.9;

    // Entrance sequence
    var t = 0.3;

    if (badge && badge.textContent) {
      tl.to(badge, {
        autoAlpha: 1, scale: 1, y: 0,
        duration: speed * 0.7,
        ease: 'power3.out'
      }, t);
      t += speed * 0.3;
    }

    if (titleEl && titleEl.textContent) {
      tl.to(titleEl, {
        autoAlpha: 1, scale: 1, y: 0, filter: 'blur(0px)',
        duration: speed,
        ease: 'power3.out'
      }, t);
      t += speed * 0.4;
    }

    if (subtitle && subtitle.textContent) {
      tl.to(subtitle, {
        autoAlpha: 1, y: 0,
        duration: speed * 0.7,
        ease: 'power2.out'
      }, t);
    }

    // Exit
    if (ctx.duration > 2) {
      var exitStart = ctx.duration - 0.7;
      tl.to(elements, {
        autoAlpha: 0, y: -15,
        duration: 0.5,
        stagger: 0.04,
        ease: 'power2.in'
      }, exitStart);
    }

    return tl;
  }
</script>
